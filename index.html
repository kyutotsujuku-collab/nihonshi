風説書","h":"翻訳はオランダ通詞"},{"q":"1715年、清は年30隻、オランダは年2隻などと貿易を制限した法令を【　】という。","a":"海舶互市新例","h":"長崎新令・正徳新令とも"},{"q":"1609年、朝鮮と己酉約条を結んで貿易を再開した対馬藩の大名は【　】である。","a":"宗氏","h":"釜山の倭館に歳遣船を派遣"},{"q":"新将軍就任の慶賀などを名目に1607〜1811年に計12回来日した朝鮮の使節を【　】という。","a":"朝鮮通信使","h":"当初3回は回答兼刷還使"},{"q":"1609年、幕府の許可を得て琉球に侵攻し、国王尚寧を服属させたのは【　】である。","a":"島津家久","h":"首里城を落とした"},{"q":"琉球王国が将軍の代替わりごとに江戸へ派遣した使節を【　】という。","a":"慶賀使","h":"国王の代替わりは謝恩使"},{"q":"琉球が薩摩藩に服属しつつ中国への朝貢も続けた状態を【　】という。","a":"日中両属","h":"薩摩は中国産品の入手ルートにした"},{"q":"1604年、家康から蝦夷地統治の条令を与えられ、アイヌとの交易独占権を保障された藩は【　】である。","a":"松前藩","h":"蠣崎氏から改称"},{"q":"松前藩が家臣にアイヌとの交易地（商場）を知行として与えた制度を【　】という。","a":"商場知行制","h":"のち場所請負制度に転換"},{"q":"1669年、交易条件に不満をもつアイヌが松前藩に抵抗した戦いを【　】という。","a":"シャクシャインの戦い","h":"津軽藩の援軍で鎮圧"}],"mc":[{"q":"幕府がオランダ風説書を提出させた目的として正しいものはどれか。","c":["オランダ人にキリスト教を布教させるため","海外情報を幕府が独占して獲得するため","唐人屋敷を管理するため","朝鮮通信使を接待するため"],"a":1,"e":"鎖国下でも商館長からの風説書で海外情勢を把握した。中国船からは唐船風説書を提出させた。"},{"q":"1689年に長崎に唐人屋敷が建設された理由はどれか。","c":["清との貿易を全面禁止するため","オランダ人と同居させるため","清国人の居住地を限定しトラブルや抜荷を防ぐため","明の亡命者を保護するため"],"a":2,"e":"清が海禁を解除して貿易額が増大したため、居住地を限定・管理した。"},{"q":"朝鮮通信使の幕府側から見たメリットとして最も適当なものはどれか。","c":["朝鮮から生糸を大量に輸入できた","将軍の対外的権威を誇示できた","対馬藩を改易できた","清との国交を仲介させられた"],"a":1,"e":"対馬藩が同行し幕府は丁重に応対。文化交流だけでなく、将軍の権威を国内外に示す場だった。"},{"q":"薩摩藩が琉球に独立王国の形式と中国への朝貢を残した理由はどれか。","c":["中国産品の入手ルートとし、砂糖などを転売するため","幕府が琉球の直轄を命じたため","琉球が薩摩の侵攻を退けたため","オランダとの貿易を琉球で行うため"],"a":0,"e":"日中両属の形式により、清の冊封体制下の朝貢貿易を継続させて利益を得た。"},{"q":"琉球使節に異国風の服装・髪型を強制した目的はどれか。","c":["琉球の文化を保護するため","清の冊封使を歓迎するため","薩摩藩の財政を節約するため","「異国人」が将軍に入貢しているように見せるため"],"a":3,"e":"沿道の人々に異国が将軍に服属していると見せ、幕府の権威を高めた。"},{"q":"シャクシャインの戦いの原因として正しいものはどれか。","c":["商場の設置で自由な交易ができず、不利な交易条件を強いられたため","松前藩が場所請負制度を廃止したため","幕府がアイヌにキリスト教を禁じたため","津軽藩が蝦夷地に侵攻したため"],"a":0,"e":"「アイヌ勘定」と呼ばれる不利な条件などに反発して1669年に蜂起したが、松前藩が津軽藩の援軍を得て鎮圧した。"},{"q":"シャクシャインの戦いの結果として正しいものはどれか。","c":["アイヌが交易の自由を回復した","松前藩が改易された","18世紀前半までに場所請負制度に転換し、松前藩は1万石格の大名扱いとなった","蝦夷地が幕府の直轄地となった"],"a":2,"e":"アイヌを服従させた松前藩は大名扱いされ、商場知行制から場所請負制度に移行して支配が強まった。"},{"q":"「4つの口」と相手の組み合わせとして誤っているものはどれか。","c":["長崎―中国・オランダ","対馬―朝鮮","薩摩―琉球","松前―朝鮮"],"a":3,"e":"松前の相手はアイヌ（蝦夷地）。"}],"order":[{"title":"長崎貿易の制限","items":["糸割符制度の廃止","糸割符制度の復活・定高貿易仕法","唐人屋敷の建設","海舶互市新例"],"e":"1655年廃止→1685年復活と輸入額制限→1689年唐人屋敷→1715年海舶互市新例で隻数・銀高を制限。"},{"title":"蝦夷地の支配","items":["蠣崎慶広が秀吉に支配権を認められる","松前氏と改称","松前藩の成立（商場知行制）","シャクシャインの戦い","クナシリ・メナシの戦い"],"e":"1594年→1599年家康の承認→1604年条令3箇条→1669年→1789年アイヌ最後の大規模抵抗。"},{"title":"東アジア情勢","items":["己酉約条","後金の建国","清と改称","明の滅亡"],"e":"1609年朝鮮と貿易再開→1616年ヌルハチが後金建国→1636年ホンタイジが清に改称→1644年明滅亡。"}]}],"review":[{"q":"家康が1605年に将軍職を秀忠に譲ったことと、1615年の大坂の役の共通する目的として最も適当なものはどれか。","c":["朝廷との外戚関係を結ぶこと","徳川氏による支配の永続を示し、他者が天下を狙う余地をなくすこと","貿易利潤を幕府が独占すること","キリスト教を禁止すること"],"a":1,"e":"譲位は下剋上の思想の否定、大坂の役は豊臣氏の滅亡。ともに徳川の世襲支配を確立するためだった。"},{"q":"1615年に出された法令の組み合わせとして正しいものはどれか。","c":["一国一城令・武家諸法度元和令・禁中並公家諸法度","武家諸法度寛永令・諸宗寺院法度・分地制限令","一国一城令・田畑永代売買禁止令・禁書令","公家衆法度・寺院法度・武家諸法度元和令"],"a":0,"e":"大坂夏の陣直後の1615年に、大名（一国一城令・元和令）と朝廷（禁中並公家諸法度）をあわせて統制した。"},{"q":"島原の乱がその後の幕府政策に与えた影響として正しいものはどれか。","c":["武断政治が終わり文治政治に転換した","寺請制度の整備とポルトガル船来航禁止など、禁教と鎖国が一気に進んだ","参勤交代が制度化された","朝鮮通信使が廃止された"],"a":1,"e":"1637〜38年の乱後、1639年ポルトガル船禁止、1640年宗門改役設置、1641年出島移転と続いた。"},{"q":"武断政治の説明として正しいものはどれか。","c":["家康・秀忠・家光が大名の改易・減封を断行し、牢人が大量に発生した","家綱が牢人対策のため末期養子の禁を緩めた","外様大名を幕府の要職に登用した","幕府が藩の自主性を全く認めなかった"],"a":0,"e":"福島正則・本多正純・加藤忠広・徳川忠長などの処分で牢人が大量に発生した。幕府は諸藩に自主性を認めつつ武家諸法度で統制した。"},{"q":"幕藩体制の経済的基盤についての説明として正しいものはどれか。","c":["幕府・藩ともに町人の営業税に依存した","幕府・藩ともに農村からの年貢収入に依存したため、本百姓体制の維持をはかった","幕府は長崎貿易の利潤のみで財政をまかなった","藩は幕領からの年貢で運営された"],"a":1,"e":"年貢収入に依存したため、田畑永代売買禁止令・分地制限令で本百姓の没落を防ぎ、五人組と村請制で確実に徴収した。"},{"q":"「鎖国」体制のもとでの対外関係として誤っているものはどれか。","c":["長崎で清・オランダと貿易し、風説書で海外情報を得た","対馬の宗氏を通じて朝鮮と通信・貿易した","薩摩藩が琉球を支配しつつ中国への朝貢も続けさせた","松前藩がアイヌと対等な自由貿易を続けた"],"a":3,"e":"松前藩は交易独占権をもち、商場知行制・場所請負制度でアイヌを従属させた。"}]},{"id":12,"title":"幕政の安定と文治政治","era":"江戸時代前期","span":"1651〜1716","oneLine":"武断から文治へ転じ、綱吉・正徳期に財政難と元禄文化が生まれた","chain":["徳川家綱","徳川綱吉","徳川家宣","徳川家継"],"parts":[{"title":"文治政治の開始","flow":[{"y":"1651","t":"由井正雪の乱〔慶安の変〕","s":"3代家光の死後、牢人の由井正雪・丸橋忠弥らが駿府と江戸で幕府転覆を企てるが失敗","why":"度重なる改易で牢人が増加し、かぶき者も横行して治安が悪化していたため"},{"y":"1651","t":"末期養子の禁緩和","s":"50歳未満17歳以上の大名・旗本に末期養子を許可","why":"改易を減らして牢人の発生を抑えるため"},{"y":"1657","t":"明暦の大火〔振袖火事〕","s":"江戸城天守閣を含む江戸市中の55%を焼き、死者10万人以上。大火後に広小路と定火消を設置","why":""},{"y":"1663","t":"武家諸法度寛文令・寛文の二大美事","s":"キリスト教禁止を初めて明文化。殉死の禁止と大名証人制の廃止","why":"朱子学に基づく徳治主義で人々を教化する文治政治への転換"},{"y":"1680","t":"5代綱吉の就任と天和の治","s":"館林藩主綱吉が将軍に。翌1681年に大老堀田正俊を登用し、専横の酒井忠清を罷免","why":"将軍権力を強化するため"},{"y":"1683","t":"武家諸法度天和令","s":"「文武忠孝を励し、礼儀を正すべきこと」。諸士法度を統合し、8代吉宗以後も踏襲","why":"忠孝や礼儀を重視する文治政治の徹底"},{"y":"1684","t":"側用人政治の開始","s":"若年寄稲葉正休が大老堀田正俊を殺害。以後、側用人柳沢吉保を大老格にまで優遇","why":"大老不在となり将軍の独断が助長された"},{"y":"1685","t":"生類憐みの令","s":"仏教の放生思想による極端な動物愛護令。犬の施策が不評で綱吉は「犬公方」と呼ばれた","why":"前年の服忌令とともに、殺生・死を忌み嫌う風潮の高まり"},{"y":"1695","t":"元禄小判の鋳造","s":"勘定吟味役荻原重秀の建議で慶長小判より低品質の元禄小判を鋳造。約500万両の出目を得る","why":"幕府の財政難対策"},{"y":"1701","t":"赤穂事件","s":"浅野長矩が江戸城中で吉良義央を斬りつけ即日切腹。翌年、大石良雄ら赤穂浪士が仇討ちに成功し全員切腹","why":"元禄小判によるインフレと社会停滞への庶民の不満が背景"}],"story":"幕政確立期の【武断政治】は度重なる改易を生み、牢人が増加してかぶき者も横行し治安が悪化した。そのため【1651年】、家光の死を機に【由井正雪の乱】が起きる。これを契機に幕府は【末期養子の禁】を緩和して改易を減らし、朱子学に基づく徳治主義の【文治政治】へ転換した。4代【家綱】は叔父の【保科正之】らに補佐され、【明暦の大火】後の復興、武家諸法度寛文令、殉死の禁止などを実施。諸藩でも【池田光政】や【徳川光圀】ら学者を登用する名君が現れた。5代【綱吉】は大老【堀田正俊】を登用して天和の治を行ったが、堀田の殺害後は側用人【柳沢吉保】を重用し独断が進む。仏教への帰依から【生類憐みの令】を出して不評を買い、寺社造営で財政が悪化したため→【荻原重秀】の建議で【元禄小判】を鋳造。出目で一時潤ったが→貨幣価値低下で物価が上昇し、庶民の不満は【赤穂事件】への熱狂として噴き出した。","keywords":["武断政治","文治政治","由井正雪の乱","末期養子の禁緩和","明暦の大火","保科正之","閑谷学校","大日本史","天和の治","柳沢吉保","生類憐みの令","湯島聖堂","元禄小判","赤穂事件","三井高利"],"blanks":[{"q":"1651年、牢人の由井正雪・丸橋忠弥らが幕府転覆を企てた【　】が起こった。","a":"由井正雪の乱","h":"慶安の変ともいう"},{"q":"4代将軍家綱は【　】の禁を緩和し、50歳未満17歳以上の大名・旗本に養子を許した。","a":"末期養子","h":"改易の緩和が目的"},{"q":"1657年の【　】では江戸市中の55%が焼け、大火後に定火消が設置された。","a":"明暦の大火","h":"振袖火事ともいう"},{"q":"家綱を補佐した会津藩主【　】は、3代家光の異母弟である。","a":"保科正之","h":"山崎闇斎に学んだ"},{"q":"岡山藩主池田光政は日本初の郷学【　】を設立した。","a":"閑谷学校","h":"熊沢蕃山を家老に登用した藩主"},{"q":"水戸藩主【　】は明から朱舜水を招き、『大日本史』の編纂を開始した。","a":"徳川光圀","h":"彰考館で編纂"},{"q":"5代将軍綱吉は1681年、大老に【　】を登用し、酒井忠清を罷免した。","a":"堀田正俊","h":"天和の治"},{"q":"1684年以降、綱吉は側用人【　】を登用し、大老格にまで優遇した。","a":"柳沢吉保","h":"六義園を設計した人物"},{"q":"1685年から出された【　】は極端な動物愛護令で、綱吉は「犬公方」と呼ばれた。","a":"生類憐みの令","h":"仏教の放生思想の影響"},{"q":"1690年に創設された【　】では、林鳳岡が大学頭に任命された。","a":"湯島聖堂","h":"聖堂学問所を併設"},{"q":"1695年、勘定吟味役【　】の建議で元禄小判が鋳造された。","a":"荻原重秀","h":"のち勘定奉行"},{"q":"1707年の【　】の噴火は、降灰被害と諸国高役金の賦課で人々に追い打ちをかけた。","a":"富士山","h":"宝永大噴火"}],"mc":[{"q":"江戸幕府が武断政治から文治政治へ転換した背景として最も適当なものはどれか。","c":["度重なる改易で牢人が増加し、治安が悪化していた","島原の乱で幕府の軍事力が大きく低下した","朝廷が幕府に徳治主義の採用を要求した","元禄小判の鋳造で物価が上昇した"],"a":0,"e":"改易による牢人増加とかぶき者の横行が由井正雪の乱を生み、これを契機に文治政治へ転換した。"},{"q":"末期養子の禁が緩和された目的として最も適当なものはどれか。","c":["大名の軍役負担を軽くするため","大名の改易を減らし、牢人の発生を抑えるため","将軍家の後継者を確保するため","外様大名を親藩に組み込むため"],"a":1,"e":"改易が牢人を増やして由井正雪の乱を招いたため、養子を認めて改易を緩和した。"},{"q":"殉死の禁止がもたらした結果として最も適当なものはどれか。","c":["大名証人制が強化された","幕府の財政が安定した","下剋上の思想が完全に消滅した","キリスト教の禁止が徹底された"],"a":2,"e":"主君個人でなく主家に仕える考えが定着し、下剋上思想が消滅した。大名証人制は同時に廃止された。"},{"q":"文治政治期の「名君」に共通する特徴として最も適当なものはどれか。","c":["いずれも親藩の藩主であった","いずれも幕府の老中を務めた","いずれも参勤交代を免除された","学者を積極的に登用して学問を振興した"],"a":3,"e":"池田光政は熊沢蕃山、保科正之は山崎闇斎、光圀は朱舜水、前田綱紀は木下順庵を登用した。池田・前田は外様。"},{"q":"綱吉が側用人政治を始めた契機として最も適当なものはどれか。","c":["明暦の大火で老中が多く死去したから","大老堀田正俊が若年寄に殺害されたから","赤穂事件で高家が処罰されたから","大老酒井忠清が専権を振るったから"],"a":1,"e":"1684年、稲葉正休が堀田正俊を殺害した後、綱吉は柳沢吉保を登用した。酒井忠清の罷免は1681年で天和の治の始まり。"},{"q":"元禄小判鋳造の結果として最も適当なものはどれか。","c":["金の含有率が慶長小判より高まった","物価が下落して武士の生活が潤った","貨幣価値が下がって物価が上昇し、下級武士・庶民の不満が増大した","長崎貿易が制限され金銀の流出が止まった"],"a":2,"e":"低品質の小判で約500万両の出目を得たが、インフレが進行した。長崎貿易の制限は正徳の政治の海舶互市新例。"},{"q":"武家諸法度天和令の特徴として最も適当なものはどれか。","c":["「文武忠孝を励し、礼儀を正すべきこと」を掲げ、諸士法度を統合した","キリスト教の禁止を初めて明文化した","参勤交代を制度として定めた","末期養子を全面的に許可した"],"a":0,"e":"天和令は忠孝・礼儀を重視し、吉宗以後も踏襲された。キリスト教禁止の明文化は寛文令、参勤交代の制度化は寛永令。"},{"q":"赤穂事件について正しいものはどれか。","c":["吉良義央は事件後、改易のうえ切腹を命じられた","赤穂浪士は仇討ちの功により全員赦免された","浅野長矩は柳沢吉保に代わる側用人であった","浅野長矩は江戸城中で吉良義央を斬りつけ、即日切腹を命じられた"],"a":3,"e":"1701年浅野は改易・即日切腹、翌年仇討ちした赤穂浪士46名も切腹を命じられ泉岳寺に葬られた。"}],"order":[{"title":"4代家綱の治世の出来事","items":["由井正雪の乱","明暦の大火","武家諸法度寛文令","寛文の朱印改め"],"e":"1651年の乱を機に文治政治へ転換。1657年の大火、1663年の寛文令、1664年の朱印改めと続く。"},{"title":"5代綱吉の政治","items":["堀田正俊を大老に登用","武家諸法度天和令","柳沢吉保を側用人に登用","生類憐みの令","元禄小判の鋳造"],"e":"1681年の天和の治→1683年天和令→1684年堀田殺害後に側用人政治→1685年生類憐みの令→1695年貨幣改鋳。"},{"title":"家綱から綱吉へ","items":["末期養子の禁緩和","綱吉の将軍就任","湯島聖堂の創設","赤穂事件","富士山の噴火"],"e":"1651年の緩和は家綱期。1680年綱吉就任後、1690年湯島聖堂、1701〜02年赤穂事件、1707年宝永大噴火。"}]},{"title":"文治政治の展開","flow":[{"y":"1709","t":"6代家宣の就任・生類憐みの令廃止","s":"綱吉の死後、養子の甲府藩主徳川綱豊が家宣として就任。生類憐みの令をただちに廃止し、柳沢吉保を退ける","why":"綱吉の元禄時代の政治への反発"},{"y":"1709","t":"正徳の政治の開始","s":"侍講新井白石と側用人間部詮房が主導。衣服の制度を整え家格・身分秩序を重視","why":"将軍の地位・権威の強化と経済復興が目的"},{"y":"1710","t":"閑院宮家の創設","s":"伏見宮・桂宮・有栖川宮に追加して4宮家とする","why":"皇統保持と朝廷との融和のため"},{"y":"1710","t":"宝永小判〔乾字金〕の鋳造","s":"勘定奉行荻原重秀による。金の含有率は慶長小判に戻したが目方を半分近く落とし混乱","why":""},{"y":"1711","t":"朝鮮通信使の待遇簡素化","s":"「日本国大君」の号を「日本国王」に改めさせる。対馬藩の雨森芳洲は猛反対","why":"従来の待遇が丁重すぎたと考え、将軍の権威を高めるため"},{"y":"1712","t":"荻原重秀の罷免・家宣の死","s":"家宣が死去し、3歳の家継が7代将軍に就任","why":""},{"y":"1714","t":"正徳小判の鋳造","s":"質・量ともに慶長小判と同様に戻したが、再度の改鋳はかえって混乱を招き失敗","why":"物価騰貴を抑えるため"},{"y":"1715","t":"海舶互市新例〔長崎新令〕","s":"清は年間30隻・銀6000貫、オランダは年間2隻に長崎貿易を制限","why":"銅の輸出能力相応に貿易を抑え、金・銀の流出を防ぐため"},{"y":"1716","t":"7代家継の死","s":"7歳で子がなく、将軍家の本家は途絶える。側近政治は譜代・旗本の反発を買った","why":""},{"y":"","t":"幕藩財政の窮乏","s":"商品貨幣経済の発達で農民の階層分化と物価高騰・米価の相対的低下が進み、年貢米を換金する武士が大打撃","why":"商品貨幣経済の発達とその結果の階層分化に対処できないしくみだったため"}],"story":"5代綱吉の死後、甥の【徳川家宣】が6代将軍となり、幼い【家継】とあわせた【正徳の政治】が行われた。侍講【新井白石】と側用人【間部詮房】が主導し、将軍が年少のため個人の資質ではなく将軍そのものを権威づける必要があった→そこで【閑院宮家】を創設して朝廷と融和し、【朝鮮通信使】の待遇を簡素化して「日本国王」の号を用いた。元禄小判のインフレを抑えるため【正徳小判】を鋳造したが、再度の改鋳はかえって混乱を招いた。【海舶互市新例】で長崎貿易を制限し金銀流出を防いだが、儒教的理想主義が現実と合わず、側近政治は譜代・旗本の反発を買った。一方、財政難の本質は【商品貨幣経済】の発達にあった。農村では階層分化が進んで年貢の確保が不安定になり→都市では物価が高騰して米価が相対的に低下→年貢米を換金して暮らす武士が大打撃を受けた。幕府・諸藩は【借り上げ】や【大名貸】、【藩札】発行で対応したが悪循環を生んだ。","keywords":["正徳の政治","徳川家宣","徳川家継","新井白石","間部詮房","閑院宮家","正徳小判","海舶互市新例","雨森芳洲","借り上げ","大名貸","藩札","商品貨幣経済"],"blanks":[{"q":"綱吉の死後、養子となっていた甲府藩主徳川綱豊が6代将軍【　】として就任した。","a":"徳川家宣","h":"綱吉の甥"},{"q":"正徳の政治は、京学の朱子学者で侍講の【　】と側用人間部詮房が主導した。","a":"新井白石","h":"木下順庵の門弟"},{"q":"新井白石とともに正徳の政治を主導した側用人は【　】である。","a":"間部詮房","h":"柳沢吉保は退けられた"},{"q":"1710年、皇統保持のため【　】が創設され、4宮家となった。","a":"閑院宮家","h":"伏見宮・桂宮・有栖川宮に追加"},{"q":"1711年の朝鮮通信使待遇簡素化に対し、対馬藩の朱子学者【　】は猛反対した。","a":"雨森芳洲","h":"新井白石の弟弟子"},{"q":"1714年、質・量ともに慶長小判と同様に戻した【　】が鋳造されたが、混乱を招き失敗した。","a":"正徳小判","h":"物価騰貴を抑えるのが目的"},{"q":"1715年の【　】は、銅の輸出能力相応に長崎貿易を制限し金・銀の流出を防いだ。","a":"海舶互市新例","h":"長崎新令・正徳新令ともいう"},{"q":"1716年、7代将軍【　】が7歳で死去し、将軍家の本家は途絶えた。","a":"徳川家継","h":"3歳で将軍に就任"},{"q":"大名が家臣の俸禄・知行を借り上げることを【　】といい、半分しか支給しない場合を半知という。","a":"借り上げ","h":"借知ともいう"},{"q":"富裕な商人による大名への貸し付けを【　】という。","a":"大名貸","h":"鴻池家などが行った"},{"q":"諸藩は幕府の許可を得て【　】という紙幣を発行したが、悪循環を生んだ。","a":"藩札","h":"藩内のみで通用"},{"q":"農村では【　】経済に巻き込まれて農民の階層分化が進み、本百姓体制が動揺した。","a":"商品貨幣","h":"幕藩財政窮乏の本質的要因"}],"mc":[{"q":"正徳の政治で将軍権威の強化が主目的となった理由として最も適当なものはどれか。","c":["家宣・家継が幼少・短命で、個人の資質ではなく将軍そのものを権威づける必要があったから","赤穂事件で幕府の権威が失墜したから","朝廷が幕府に将軍号の返上を求めたから","外様大名が側用人政治に反発したから"],"a":0,"e":"家継はわずか3歳で就任したため、閑院宮家創設や通信使待遇の改定で将軍の地位そのものを権威づけた。"},{"q":"閑院宮家創設の目的として最も適当なものはどれか。","c":["朝廷の禁裏御料を削減するため","皇統を保持し、朝廷と融和するため","大嘗祭を再興するため","朝鮮通信使を接待するため"],"a":1,"e":"3宮家に閑院宮を加え4宮家とし、将軍家と皇室の結びつきを強めた。"},{"q":"海舶互市新例が出された目的として最も適当なものはどれか。","c":["キリスト教の流入を防ぐため","清との国交を回復するため","銅の輸出能力に応じて貿易を制限し、金・銀の流出を防ぐため","長崎貿易を増やして幕府の収入を確保するため"],"a":2,"e":"清は年間30隻・銀6000貫、オランダは年間2隻に制限し、金銀流出を防止した。"},{"q":"正徳小判鋳造の結果として最も適当なものはどれか。","c":["約500万両の出目で幕府財政が潤った","物価が安定して元禄時代の混乱が収まった","金の含有率が慶長小判より下がった","再度の貨幣改鋳がかえって混乱を招き失敗した"],"a":3,"e":"慶長小判と同質同量に戻したが、たびたびの改鋳が混乱を招いた。出目で潤ったのは元禄小判。"},{"q":"正徳の政治の結果として最も適当なものはどれか。","c":["儒教的理想主義に走って現実と合わず、側近政治が譜代・旗本の反発を買った","生類憐みの令が強化され庶民の不満が高まった","側用人柳沢吉保が大老格に昇進した","将軍家の本家が安定して継承された"],"a":0,"e":"元禄時代に比べ一時的な安定はもたらしたが、成果が上がらないまま家継が死去し本家は途絶えた。"},{"q":"物価の高騰が武士に特に大きな打撃となった理由として最も適当なものはどれか。","c":["武士は商品作物を栽培して現金収入を得ていたから","武士は年貢米を換金して消費物資を得る純粋な消費者だったから","武士は藩札の発行で利益を得ていたから","武士は大名貸を行っていたから"],"a":1,"e":"武士は都市の消費者であり、諸物価の高騰と米価の相対的低下が直撃した。"},{"q":"幕府の支出増大の要因として正しいものの組合せはどれか。","c":["鎖国後の貿易利潤の減少と金銀産出量の減少","参勤交代の費用とお手伝い普請","明暦の大火後の江戸城・市街の再建費と綱吉の寺社造営・修築費","海舶互市新例による貿易制限と正徳小判の鋳造"],"a":2,"e":"貿易利潤・金銀産出の減少は収入減少の要因。参勤交代・お手伝い普請は藩の支出。"},{"q":"幕藩財政窮乏の本質的要因として最も適当なものはどれか。","c":["赤穂事件で幕府の権威が低下したこと","元禄小判の鋳造で出目を得たこと","朝鮮通信使の接待費が増大したこと","商品貨幣経済の発達と、その結果の階層分化に対処できないしくみだったこと"],"a":3,"e":"農村の商業的農業の進展で本百姓体制が動揺し、都市の消費拡大で物価が上昇したが、年貢米に依存するしくみは変わらなかった。"}],"order":[{"title":"正徳の政治の政策","items":["生類憐みの令の廃止","閑院宮家の創設","朝鮮通信使の待遇簡素化","正徳小判の鋳造","海舶互市新例"],"e":"1709年廃止→1710年閑院宮家→1711年通信使→1714年正徳小判→1715年長崎新令。"},{"title":"文治政治期の将軍","items":["徳川家綱","徳川綱吉","徳川家宣","徳川家継"],"e":"4代家綱、弟の5代綱吉、綱吉の甥の6代家宣、その子の7代家継で本家が途絶えた。"},{"title":"小判の改鋳","items":["慶長小判","元禄小判","宝永小判","正徳小判"],"e":"1695年元禄小判で品質低下→1710年宝永小判は含有率を戻すが目方半減→1714年正徳小判で慶長小判と同質同量に。"}]},{"title":"江戸時代の産業・経済","flow":[{"y":"1654","t":"治水・灌漑と新田開発","s":"玉川上水完成。箱根用水・見沼代用水なども開かれ、町人請負新田などで耕地面積は2倍以上に","why":"幕府・諸藩が年貢を確保するため開発を奨励"},{"y":"","t":"農具の改良と金肥","s":"備中鍬・千歯扱・唐箕・千石簁・踏車が普及。干鰯・〆粕・油粕などの金肥を使用","why":"商品作物栽培のため。ただし大規模農業は発達せず"},{"y":"1697","t":"『農業全書』","s":"宮崎安貞が著した日本初の本格的農書。のち大蔵永常の『農具便利論』『広益国産考』","why":""},{"y":"","t":"商品作物栽培と特産地の形成","s":"四木（楮・桑・茶・漆）三草（紅花・藍・麻）や木綿。出羽の紅花、阿波の藍、河内の木綿など","why":"現金収入を得るための商業的農業が進展"},{"y":"1671","t":"東廻り・西廻り航路の整備","s":"寛文年間に河村瑞賢が整備。南海路には菱垣廻船・樽廻船、日本海には北前船","why":"大量のモノを水上で運ぶため"},{"y":"","t":"五街道と宿駅・関所","s":"江戸日本橋を起点に道中奉行が管理。宿駅は宿場町へ発展し、箱根関では「入鉄砲に出女」を取締り","why":"全国統一による商品流通網の形成と参勤交代の制度化"},{"y":"","t":"三都の発達","s":"江戸「将軍のお膝元」、大坂「天下の台所」、京都","why":""},{"y":"","t":"蔵物・納屋物の流通","s":"大坂中之島の蔵屋敷で蔵元・掛屋が蔵物を扱い、江戸浅草蔵前の札差が蔵米を換金。堂島の米市場など卸売市場も発達","why":"幕府・諸藩が年貢米を換金する必要があったため"},{"y":"","t":"問屋商人と株仲間","s":"仲間・組合を結成し仲間掟で営業を独占。大坂の二十四組問屋、江戸の十組問屋。株仲間は運上・冥加を負担","why":""},{"y":"","t":"三貨と両替商","s":"金座・銀座・銭座で鋳造。金貨・銭貨は計数貨幣、銀貨は秤量貨幣。本両替の鴻池・三井などが両替や大名貸","why":"江戸の金遣い・大坂の銀遣いで換算が必要だったため"}],"story":"江戸時代の農村では、治水・灌漑の進歩と【新田開発】で耕地が2倍以上に増え、農具改良と【金肥】の使用で生産が高まった。【四木三草】や木綿などの【商品作物】栽培が広まり、現金収入を得る商業的農業が進展した→そのため農村でも貨幣が不可欠になった。特産物の流通と参勤交代の制度化を背景に交通が発達し、モノは主に水上を、ヒトは主に陸上を移動した。【河村瑞賢】が東廻り・西廻り航路を整備し、五街道は日本橋を起点に【道中奉行】が管理した。幕府・諸藩は年貢米を換金する必要があった→大坂中之島の【蔵屋敷】に蔵物が集まり【蔵元】・掛屋が扱い、江戸では【札差】が旗本・御家人の蔵米を換金した。こうして大坂は「天下の台所」として栄え、問屋商人は【株仲間】を結んで営業を独占した。【三貨】は江戸の金遣い・大坂の銀遣いで換算が必要だった→鴻池や三井など【両替商】が発達し、大名貸も行った。","keywords":["新田開発","鍬下年季","金肥","農業全書","四木三草","河村瑞賢","西廻り航路","五街道","蔵屋敷","札差","堂島","株仲間","三貨","寛永通宝","両替商"],"blanks":[{"q":"新田開発で検地を受けるまでの数年間は【　】といい、無税であった。","a":"鍬下年季","h":"町人請負新田などが開発された"},{"q":"干鰯・〆粕・油粕・糠など購入する肥料を【　】という。","a":"金肥","h":"従来の刈敷・草木灰に加えて使用"},{"q":"宮崎安貞が著した日本初の本格的農書は『【　】』である。","a":"農業全書","h":"『農具便利論』は大蔵永常"},{"q":"東廻り航路・西廻り航路は寛文年間に【　】が整備した。","a":"河村瑞賢","h":"安治川も開発した"},{"q":"大坂から江戸への南海路には、菱垣廻船と【　】が就航した。","a":"樽廻船","h":"ほかに尾州廻船の内海船"},{"q":"五街道は江戸の日本橋を起点とし、【　】が管理した。","a":"道中奉行","h":"東海道・中山道・甲州道中・日光道中・奥州道中"},{"q":"箱根の関所では特に「【　】」を厳しく取り締まった。","a":"入鉄砲に出女","h":"江戸に入る鉄砲と江戸から出る女性"},{"q":"大坂中之島の蔵屋敷で蔵物の出納・売却にあたった商人を【　】という。","a":"蔵元","h":"掛屋と兼任する場合も多い"},{"q":"江戸浅草の蔵前で旗本・御家人相手に蔵米の換金にあたった商人を【　】という。","a":"札差","h":"蔵宿ともいう"},{"q":"大坂の米市場は【　】にあり、雑喉場の魚市場、天満の青物市場とともに有名だった。","a":"堂島","h":"江戸は日本橋の魚市場、神田の青物市場"},{"q":"幕府に公認された営業独占権をもつ【　】は、運上・冥加という営業税を負担した。","a":"株仲間","h":"大坂の二十四組問屋、江戸の十組問屋"},{"q":"銭座で鋳造され、大量に流通した銭貨は【　】である。","a":"寛永通宝","h":"単位は貫・文"}],"mc":[{"q":"江戸時代の農村で貨幣が必要不可欠になった背景として最も適当なものはどれか。","c":["幕府が年貢を金納に統一したから","商品作物の栽培により現金収入を得る商業的農業が進展したから","農民が藩札の発行を認められたから","武士が農村に土着して消費を拡大したから"],"a":1,"e":"四木三草や木綿などの栽培と金肥の購入で、農村も商品貨幣経済に巻き込まれた。"},{"q":"江戸時代に交通が発達した背景として最も適当なものはどれか。","c":["幕府の全国統一による商品流通網の形成と参勤交代の制度化","鎖国の解除による海外貿易の拡大","関所の廃止と架橋の自由化","朝鮮通信使の往来の増加"],"a":0,"e":"各地の特産物の流通と参勤交代のため、水上・陸上交通が整備された。関所や渡しはむしろ交通の障害だった。"},{"q":"江戸時代のモノとヒトの移動について正しいものはどれか。","c":["モノもヒトも主に陸上を移動した","モノは主に陸上、ヒトは主に水上を移動した","モノは主に水上、ヒトは主に陸上を移動した","モノもヒトも主に水上を移動した"],"a":2,"e":"大量のモノは河川・海上交通で、ヒトは五街道などの陸上交通で移動した。"},{"q":"商業・金融が発達した背景として最も適当なものはどれか。","c":["幕府が商人に免税特権を与えたから","外国商人が三都に進出したから","農民が年貢を貨幣で納めるようになったから","幕府・諸藩が年貢米を換金する必要があったから"],"a":3,"e":"武士が蔵物としてコメを大坂などで売りカネに換えたことが、蔵元・掛屋・両替商の発達を促した。"},{"q":"三貨について正しいものはどれか。","c":["銀貨は秤量貨幣で、大坂を中心とする西日本で主に使われた","金貨は秤量貨幣で、両・分・朱で数えた","銭貨は秤量貨幣で、銀座で鋳造された","三貨の換算率は固定され混乱はなかった"],"a":0,"e":"金貨・銭貨は計数貨幣、銀貨は秤量貨幣。江戸の金遣い・大坂の銀遣いで、換算率の変更が混乱を生んだ。"},{"q":"蔵元・掛屋・札差について正しいものはどれか。","c":["蔵元は江戸浅草で旗本の蔵米を換金した","札差は大坂中之島の蔵屋敷で蔵物を売却した","札差は江戸浅草の蔵前で旗本・御家人相手に蔵米を換金した","掛屋は五街道の宿駅で人馬の継立を行った"],"a":2,"e":"蔵元・掛屋は大坂の蔵屋敷で諸藩の蔵物を扱い、札差は江戸で幕臣相手に換金した。"},{"q":"幕府直営の鉱山の組合せとして正しいものはどれか。","c":["院内銀山・阿仁銅山","別子銅山・尾去沢銅山","佐渡相川金山・但馬生野銀山・足尾銅山","木曽檜・秋田杉"],"a":2,"e":"院内・阿仁は秋田藩営、別子は住友家の経営。木曽檜・秋田杉は林業。"},{"q":"株仲間が幕府・諸藩に対して負った義務はどれか。","c":["参勤交代","運上・冥加の納入","お手伝い普請","鍬下年季の年貢"],"a":1,"e":"株仲間は営業独占を認められる代わりに運上・冥加という営業税を負担した。"}],"order":[{"title":"農書の成立","items":["『清良記』","『農業全書』","『民間省要』","『広益国産考』"],"e":"日本最古とされる『清良記』→元禄期に宮崎安貞の『農業全書』→享保期に田中丘隅の『民間省要』→化政期に大蔵永常の『広益国産考』。"},{"title":"株仲間の変遷","items":["江戸時代初期に禁止","元禄時代に黙認","享保の改革で公認","田沼時代に奨励","天保の改革で解散"],"e":"家康は禁止、綱吉が黙認、吉宗が公認、田沼意次が運上・冥加を納めさせて奨励、水野忠邦が解散させた。"},{"title":"治水・交通整備","items":["玉川上水の完成","箱根用水の完成","東廻り航路の整備","見沼代用水の完成"],"e":"1654年玉川上水→1670年箱根用水→1671年河村瑞賢が東廻り航路→1728年井沢弥惣兵衛の見沼代用水。"}]},{"title":"元禄文化","flow":[{"y":"","t":"元禄文化の特色","s":"上方（京都・大坂）の富裕な町人や武士が中心。現世を「浮き世」と肯定し、人間性の追求に主眼","why":"商品貨幣経済の発達による町人の台頭と、鎖国による日本独自の文化の成熟"},{"y":"","t":"井原西鶴の浮世草子","s":"好色物『好色一代男』、武家物『武道伝来記』、町人物『日本永代蔵』『世間胸算用』。もとは談林俳諧の俳人","why":""},{"y":"","t":"松尾芭蕉の蕉風俳諧","s":"「さび・かるみ・しおり・ほそみ」の俳句。俳諧紀行文『奥の細道』","why":""},{"y":"","t":"近松門左衛門と人形浄瑠璃","s":"世話物『曽根崎心中』、時代物『国性爺合戦』。語り竹本義太夫・人形遣い辰松八郎兵衛で大坂竹本座が人気","why":""},{"y":"","t":"歌舞伎の隆盛","s":"江戸・上方に常設の芝居小屋。市川団十郎（江戸・荒事）、坂田藤十郎（上方・和事）、芳沢あやめ（上方・女形）","why":""},{"y":"","t":"元禄美術","s":"尾形光琳が琳派を創始し『紅白梅図屛風』『燕子花図屛風』。菱川師宣が浮世絵版画を創始。野々村仁清が京焼の祖、宮崎友禅が友禅染、円空の鉈彫","why":""},{"y":"","t":"大名庭園","s":"廻遊式庭園の後楽園（水戸藩・岡山藩）、六義園（柳沢吉保）","why":"将軍の御成や藩主どうしの交流が増えたため"},{"y":"1684","t":"貞享暦の完成","s":"渋川春海〔安井算哲〕が作成し、幕府の天文方に任命される","why":""},{"y":"","t":"儒学の隆盛","s":"朱子学（京学の林家、南学の山崎闇斎）、陽明学（中江藤樹・熊沢蕃山）、古学（山鹿素行・伊藤仁斎・荻生徂徠）に分かれる","why":"文治政治の影響で儒学が重視されたため"},{"y":"","t":"諸学問の発達","s":"歴史学『本朝通鑑』『大日本史』、本草学の貝原益軒『大和本草』、和算の関孝和『発微算法』、国文学の契沖『万葉代匠記』","why":"儒学の発達に刺激されて諸学問が発達"}],"story":"【元禄文化】は上方（京都・大坂）の富裕な町人や武士が中心の文化である。商品貨幣経済の発達で町人が台頭し、鎖国により日本独自の文化が成熟したため→現世を「浮き世」と肯定する風潮が広まった。文学では【井原西鶴】が浮世草子で町人の姿を描き、【松尾芭蕉】が蕉風俳諧を確立し、【近松門左衛門】が人形浄瑠璃・歌舞伎の脚本で義理と人情を描いた。美術では【尾形光琳】が琳派を、【菱川師宣】が浮世絵版画を、【野々村仁清】が京焼を創始した。将軍の御成や藩主の交流が増えたため→後楽園・六義園などの大名庭園が盛んに作られた。学問では文治政治を背景に儒学が発達した→朱子学に加え、実践を重視する【陽明学】（中江藤樹）は幕府に警戒され、原典への復帰を説く【古学】（山鹿素行・荻生徂徠ら）が現れた。儒学の発達に刺激されて→歴史学の『大日本史』、本草学の【貝原益軒】、和算の【関孝和】、国文学の【契沖】など諸学問も発達した。","keywords":["元禄文化","浮世草子","井原西鶴","松尾芭蕉","近松門左衛門","人形浄瑠璃","尾形光琳","菱川師宣","野々村仁清","中江藤樹","山鹿素行","伊藤仁斎","荻生徂徠","貝原益軒","関孝和"],"blanks":[{"q":"【　】は上方（京都・大坂）の富裕な町人や武士が中心の文化である。","a":"元禄文化","h":"5代綱吉の時代"},{"q":"【　】は浮世草子の作者で、『好色一代男』『日本永代蔵』を著した。","a":"井原西鶴","h":"もとは談林俳諧の俳人"},{"q":"【　】は蕉風俳諧を確立し、俳諧紀行文『奥の細道』を著した。","a":"松尾芭蕉","h":"さび・かるみ・しおり・ほそみ"},{"q":"【　】は人形浄瑠璃・歌舞伎の脚本家で、『曽根崎心中』『国性爺合戦』を書いた。","a":"近松門左衛門","h":"世話物と時代物"},{"q":"近松作品は語り【　】、人形遣い辰松八郎兵衛で、大坂の竹本座において人気を誇った。","a":"竹本義太夫","h":"義太夫節として音曲化"},{"q":"京都の【　】は俵屋宗達の画法を取り入れて琳派を創始し、『紅白梅図屛風』を描いた。","a":"尾形光琳","h":"弟は陶工の尾形乾山"},{"q":"【　】は浮世絵版画を創始し、肉筆画『見返り美人図』を残した。","a":"菱川師宣","h":"当時は絵本・挿絵本が多い"},{"q":"【　】は上絵付法をもとに色絵を完成し、京焼の祖となった。","a":"野々村仁清","h":"代表作『色絵藤花文茶壺』"},{"q":"南学の朱子学者【　】は垂加神道を唱え、保科正之に礼遇された。","a":"山崎闇斎","h":"谷時中の門弟"},{"q":"日本陽明学の祖で「近江聖人」と呼ばれたのは【　】である。","a":"中江藤樹","h":"弟子に熊沢蕃山"},{"q":"【　】は『聖教要録』で朱子学を攻撃し、幕府により播磨国赤穂に流された。","a":"山鹿素行","h":"士道の大成者"},{"q":"【　】は江戸に蘐園塾を開いて古文辞学派を創始し、吉宗に『政談』を献じた。","a":"荻生徂徠","h":"弟子に太宰春台"}],"mc":[{"q":"元禄文化の特色として最も適当なものはどれか。","c":["江戸の武士を中心とする質実剛健な文化","上方の富裕な町人や武士を中心とする現世肯定的な文化","公家を中心とする伝統的な宮廷文化","地方の農民を中心とする素朴な文化"],"a":1,"e":"商品貨幣経済の発達で台頭した上方町人が担い手となり、「浮き世」を肯定した。"},{"q":"元禄期に大名庭園が盛んに作られた理由として最も適当なものはどれか。","c":["参勤交代が廃止され大名が国許に滞在したから","幕府が大名に庭園の造営を命じたから","将軍の御成や藩主どうしの交流が増えたから","朱舜水が庭園の造営を義務づけたから"],"a":2,"e":"将軍が大名屋敷を訪れる御成が増え、後楽園や六義園などの廻遊式庭園が設けられた。"},{"q":"熊沢蕃山が下総国古河に幽閉された理由として最も適当なものはどれか。","c":["『聖教要録』で朱子学を攻撃したから","『大学或問』で武士の帰農・参勤交代の緩和を主張し幕政を批判したから","『政談』で経世論を展開したから","垂加神道を唱えて朝廷を重んじたから"],"a":1,"e":"陽明学者の蕃山は岡山藩家老を務めたのち幕政批判で幽閉された。『聖教要録』は山鹿素行、『政談』は荻生徂徠。"},{"q":"陽明学が幕府に警戒された理由として最も適当なものはどれか。","c":["キリスト教の教義を取り入れていたから","孔子・孟子の原典への復帰を主張したから","上下の身分秩序を重んじたから","知識偏重を批判し「知行合一」の実践を重視して時世批判の傾向が強かったから"],"a":3,"e":"朱子学は身分秩序を正当化するため保護されたが、実践を説く陽明学は警戒された。原典復帰は古学派。"},{"q":"元禄期に諸学問が発達した背景として最も適当なものはどれか。","c":["文治政治を背景に儒学が発達し、その合理的な考え方が他の学問を刺激したから","鎖国が解かれ西洋の学問が流入したから","幕府が儒学以外の学問を禁止したから","寺子屋が全国に普及して識字率が上がったから"],"a":0,"e":"歴史学・本草学・和算・天文学・国文学などが儒学の発達に刺激されて発達した。"},{"q":"学派と人物の組合せとして正しいものはどれか。","c":["古文辞学派—山鹿素行","京学—谷時中","古義学派—伊藤仁斎","南学—藤原惺窩"],"a":2,"e":"伊藤仁斎は京都に古義堂を開き古義学派を創始。古文辞学派は荻生徂徠、京学は藤原惺窩、南学は谷時中。"},{"q":"著作と人物の組合せとして正しいものはどれか。","c":["『発微算法』—吉田光由","『万葉代匠記』—北村季吟","『西洋紀聞』—西川如見","『大和本草』—貝原益軒"],"a":3,"e":"『発微算法』は関孝和、『万葉代匠記』は契沖、『西洋紀聞』は新井白石。吉田光由は『塵劫記』、北村季吟は『源氏物語湖月抄』、西川如見は『華夷通商考』。"},{"q":"新井白石が『西洋紀聞』『采覧異言』を著した契機として最も適当なものはどれか。","c":["オランダ商館長の江戸参府に同行したから","屋久島に潜入したイタリア人宣教師シドッチを尋問したから","朝鮮通信使と筆談したから","長崎で蘭学を学んだから"],"a":1,"e":"白石はシドッチの尋問から得た知識で世界地理・西洋事情を記し、洋学の先駆となった。"}],"order":[{"title":"京学（林家）の系譜","items":["藤原惺窩","林羅山","林鵞峰","林鳳岡"],"e":"惺窩が京学を創始し、門弟の羅山が広めた。羅山の子が鵞峰、孫の鳳岡が綱吉のもとで初代大学頭となった。"},{"title":"新井白石にいたる師弟の系譜","items":["藤原惺窩","松永尺五","木下順庵","新井白石"],"e":"惺窩の門弟が尺五、尺五の門弟が順庵、順庵の門弟が白石・雨森芳洲・室鳩巣。"},{"title":"儒学諸学派の展開","items":["朱子学派（藤原惺窩・林羅山）","陽明学派（中江藤樹）","古学派（山鹿素行・伊藤仁斎・荻生徂徠）","折衷学派","考証学派"],"e":"幕府に保護された朱子学に対し、陽明学が実践を、古学が原典復帰を唱えた。折衷学派は田沼時代、考証学派は江戸後期に盛んになった。"}]}],"review":[{"q":"由井正雪の乱と末期養子の禁緩和の関係として最も適当なものはどれか。","c":["末期養子の禁緩和に反発した大名が由井正雪の乱を起こした","改易で増えた牢人が乱を起こしたため、幕府は末期養子を認めて改易を減らそうとした","由井正雪の乱で将軍が死去したため末期養子が必要になった","両者は無関係で、末期養子の禁緩和は綱吉の政策である"],"a":1,"e":"武断政治による改易→牢人増加→1651年の乱→同年に末期養子の禁緩和、という因果で文治政治が始まった。"},{"q":"綱吉が元禄小判を鋳造するに至った背景として最も適当なものはどれか。","c":["明暦の大火後の再建費や寺社造営費で支出が増え、金銀産出も減って幕府財政が破綻していた","海舶互市新例で長崎貿易の収入が減少した","赤穂事件の処理に多額の費用がかかった","正徳小判の鋳造で物価が高騰した"],"a":0,"e":"収入減と支出増が重なり、荻原重秀の建議で出目を得るため低品質の小判を鋳造した。海舶互市新例・正徳小判は綱吉より後。"},{"q":"正徳の政治が元禄時代の政治への反発として行ったことの組合せとして正しいものはどれか。","c":["武家諸法度天和令の制定と湯島聖堂の創設","生類憐みの令の廃止と側用人柳沢吉保の排除","服忌令の制定と大嘗祭の再興","堀田正俊の大老登用と酒井忠清の罷免"],"a":1,"e":"家宣は綱吉の死後ただちに生類憐みの令を廃止し、柳沢吉保を退けて新井白石・間部詮房に政治を委ねた。他はいずれも綱吉の政策。"},{"q":"文治政治と元禄文化・学問の関係として最も適当なものはどれか。","c":["武断政治のもとで兵学が発達し、元禄文化を生んだ","鎖国が解かれて西洋文化が流入し、元禄文化が開花した","文治政治で朱子学が重視されて儒学が発達し、その刺激で諸学問も発達した","幕府が儒学を弾圧したため、町人文化が発達した"],"a":2,"e":"徳治主義の文治政治は湯島聖堂の創設など儒学を優遇し、儒学の発達が歴史学・本草学・和算などを刺激した。"},{"q":"幕藩財政の窮乏と物価高騰の因果関係として最も適当なものはどれか。","c":["武士が商品作物を栽培したため米価が上昇し、農民が困窮した","商品貨幣経済の発達で物価が高騰し米価が相対的に下がったため、年貢米を換金する武士が打撃を受けた","藩札の発行で米価が上昇し、幕府財政が潤った","朝鮮通信使の接待で物価が高騰し、町人が困窮した"],"a":1,"e":"農村の階層分化で年貢確保が不安定になる一方、都市の消費拡大で物価が上がり、純粋な消費者である武士が最も困った。"},{"q":"大坂が「天下の台所」と呼ばれるようになった背景として最も適当なものはどれか。","c":["幕府が大坂に金座を置いて金貨を鋳造したから","五街道の起点として人の往来が集中したから","幕府・諸藩が年貢米を換金する必要から中之島に蔵屋敷を置き、全国の物資が集散したから","赤穂事件後に赤穂浪士が大坂で商業を始めたから"],"a":2,"e":"西廻り航路で東北の年貢米も大坂に集まり、蔵元・掛屋・両替商・堂島の米市場が発達した。金座と五街道の起点は江戸。"}]},{"id":13,"title":"幕藩体制の動揺と改革","era":"江戸時代中期","span":"1716〜1793","oneLine":"吉宗・田沼・定信の三つの政治が交替するなかで幕藩体制の限界が露見した","chain":["徳川吉宗","徳川家重","田沼意次","松平定信"],"parts":[{"title":"享保の改革","flow":[{"y":"1716","t":"徳川吉宗が8代将軍に就任","s":"御三家の紀伊藩主から初めて宗家以外の将軍となり、享保の改革（〜45年）を始める","why":"7代家継が7歳で死去し将軍家の本家が途絶えたため"},{"y":"1716","t":"側近政治の廃止と人材登用","s":"新井白石・間部詮房を罷免し老中・若年寄中心の政治に戻す。大岡忠相・田中丘隅・荻生徂徠・室鳩巣を登用","why":"曾祖父家康を模範とする復古理想主義と将軍独裁のため（御用取次で将軍の意志を反映）"},{"y":"1719","t":"相対済し令","s":"金銀貸借など金公事の訴訟を受理しないと通告。窮乏する旗本・御家人の救済にもなる","why":"裁判事務の簡素化のため"},{"y":"1720","t":"漢訳洋書輸入の禁の緩和","s":"キリスト教に関係のない漢訳洋書の輸入を許可。青木昆陽・野呂元丈にオランダ語を学ばせる","why":"実学の奨励のため"},{"y":"1721","t":"目安箱の設置","s":"評定所門前に設置し将軍自ら庶民の意見を聞く。小石川養生所・町火消（いろは47組）が実現","why":"三都の都市政策に庶民の声を活用するため"},{"y":"1722","t":"上げ米・定免法・新田開発の奨励","s":"大名から1万石につき100石を上納させ参勤交代の在府を半年に短縮（〜30年）。幕領は定免法・五公五民に。町人請負新田を奨励","why":"幕府財政を再建するため"},{"y":"1723","t":"足高の制","s":"役職の基準石高（役高）を決め、不足分を在職中のみ支給","why":"少ない財政負担で旗本の人材を登用するため"},{"y":"1730","t":"堂島米市場の公認","s":"「米価安・諸色高」の打開を図る。吉宗は「米公方」と呼ばれる","why":"米価の調節のため"},{"y":"1732","t":"享保の飢饉と元文金銀の改鋳","s":"飢饉で米価が高騰し、1736年に量・質を半分に落とした元文金銀へ改鋳。百姓一揆が頻発し江戸で初の打ちこわし","why":"米価高騰に対応するため"},{"y":"1742","t":"公事方御定書","s":"法令・判例を集め裁判・刑罰の基準を定める（下巻は御定書百箇条）。1744年には御触書寛保集成","why":"裁判の基準を整えるため"}],"story":"7代【家継】が幼くして死に将軍家の本家が途絶えたため→御三家【紀伊藩】主の【徳川吉宗】が8代将軍となり【享保の改革】を始めた。曾祖父家康を模範とする復古理想主義のため→【新井白石】・間部詮房を罷免し側近政治を廃止、一方で【大岡忠相】らを登用した。財政再建のため→【上げ米】で大名から米を上納させ、幕領では【定免法】・五公五民を採用、【新田開発】も奨励した。上げ米を長く続けると封建的主従関係が崩れるため→一時的なものとした。1721年の【目安箱】からは小石川養生所・町火消が実現し、1723年の【足高の制】は少ない負担で人材登用を可能にした。財政は一時的に再建されて吉宗は「幕府中興の祖」とされたが、【享保の飢饉】と年貢増徴が原因で→百姓一揆が頻発し江戸で初の打ちこわしが起こり、将軍自らの強力な改革の結果→幕藩体制の限界もまた露見した。","keywords":["徳川吉宗","享保の改革","大岡忠相","相対済し令","目安箱","足高の制","上げ米","定免法","公事方御定書","御三卿","青木昆陽","享保の飢饉","元文金銀","堂島米市場"],"blanks":[{"q":"8代将軍徳川吉宗は御三家の【　】藩主から将軍となり、享保の改革を展開した。","a":"紀伊","h":"初めて宗家以外から将軍が出た"},{"q":"吉宗は新井白石・【　】を罷免し、老中・若年寄中心の政治に戻した。","a":"間部詮房","h":"正徳の政治を担った側用人"},{"q":"吉宗が町奉行のち寺社奉行に登用した旗本は【　】である。","a":"大岡忠相","h":"町火消・小石川養生所の創設に尽力"},{"q":"1719年の【　】は、金公事の訴訟を受理しないと通告したもので、裁判事務の簡素化が目的だった。","a":"相対済し令","h":"旗本・御家人の救済手段ともなった"},{"q":"1721年、江戸城評定所の門前に【　】が設置され、将軍自ら庶民の意見を聞いた。","a":"目安箱","h":"小石川養生所の設置などが実現"},{"q":"1723年の【　】は、役職の基準石高を定め不足分を在職中のみ支給する制度である。","a":"足高の制","h":"少ない財政負担で人材登用"},{"q":"1742年、従来の法令・判例を集めて裁判の基準を定めた【　】が制定された。","a":"公事方御定書","h":"下巻は御定書百箇条"},{"q":"1722年から実施された【　】では、大名に1万石につき100石を上納させる代わりに参勤交代の在府期間を半年に短縮した。","a":"上げ米","h":"幕領の年間収入は1割以上増収"},{"q":"幕領では従来の検見法に代えて【　】・五公五民が採用された。","a":"定免法","h":"財政の安定と増収が見込めた"},{"q":"米価の調節に努めた吉宗は「【　】」〔八木将軍〕と呼ばれた。","a":"米公方","h":"大坂堂島の米市場を公認"},{"q":"甘藷〔さつまいも〕の栽培を提案した【　】は「甘藷先生」と呼ばれた。","a":"青木昆陽","h":"『和蘭文字略考』を著す"},{"q":"吉宗は宗家を支える分家として【　】（田安・一橋・清水）を設置した。","a":"御三卿","h":"藩のない10万石の親藩扱い"}],"mc":[{"q":"徳川吉宗が将軍に就任した背景として正しいものはどれか。","c":["5代綱吉が世継ぎなく死去したため","7代家継が幼くして死去し宗家が途絶えたため","6代家宣が吉宗を養子としたため","正徳の政治が成功し家継が譲位したため"],"a":1,"e":"7代家継は7歳で死去し子がなく、将軍家の本家が途絶えたため御三家紀伊藩主の吉宗が就任した。"},{"q":"吉宗が新井白石・間部詮房を罷免した理由として正しいものはどれか。","c":["側近政治を廃止し老中・若年寄中心の政治に戻すため","側用人政治を強化するため","朱子学者を幕政から排除するため","紀伊藩の家臣を老中にするため"],"a":0,"e":"5代綱吉以来の側近政治を廃止し、家康を模範とする将軍独裁政治を展開した。"},{"q":"足高の制の目的として正しいものはどれか。","c":["大名の改易を減らすため","旗本・御家人の借金を帳消しにするため","少ない財政負担で旗本の人材を登用するため","参勤交代の負担を軽減するため"],"a":2,"e":"役高に不足する分を在職中のみ支給する仕組みで、財政負担を抑えつつ人材を登用できた。"},{"q":"上げ米を長く続けなかった理由として正しいものはどれか。","c":["大名の反対で1年で廃止されたため","幕領の収入がまったく増えなかったため","続けると封建的主従関係が崩れるため","享保の飢饉で大名が上納できなくなったため"],"a":2,"e":"上げ米は幕府財政を一時的に回復させたが、主従関係が崩れる恐れから一時的なものにとどめた。"},{"q":"流地禁止令が翌年に廃止された理由として正しいものはどれか。","c":["株仲間が反発したため","これを徳政令と独断した農民により質地騒動が起こったため","町人請負新田の開発を妨げたため","旗本・御家人の借金が増えたため"],"a":1,"e":"本百姓体制の維持のため田畑の質流しを禁じたが、農民が徳政令と受け取り騒動となったため廃止された。"},{"q":"1736年に元文金銀へ改鋳された背景として正しいものはどれか。","c":["享保の飢饉による米価高騰に対応するため","天明の飢饉による米価高騰に対応するため","長崎貿易で金銀が流出したため","上げ米が廃止され財源が不足したため"],"a":0,"e":"1732年の享保の飢饉による米価高騰に対応し、享保金銀に比べ量・質を半分に落とした。"},{"q":"享保の改革の結果として正しいものはどれか。","c":["株仲間が全面的に禁止された","年貢増徴により百姓一揆が頻発し江戸で初の打ちこわしが起こった","御三卿が廃止された","幕府財政が完全に破綻した"],"a":1,"e":"財政は一時的に再建されたが、年貢増徴・緊縮財政の悪影響で一揆が頻発し、幕藩体制の限界も露見した。"}],"order":[{"title":"享保の改革の政策","items":["相対済し令","目安箱の設置","足高の制","公事方御定書"],"e":"相対済し令（1719）→目安箱（1721）→足高の制（1723）→公事方御定書（1742）の順。"},{"title":"享保の改革の財政・経済政策","items":["上げ米の開始","堂島米市場の公認","享保の飢饉","元文金銀への改鋳"],"e":"上げ米（1722）→堂島米市場公認（1730）→享保の飢饉（1732）→飢饉による米価高騰に対応して元文金銀改鋳（1736）。"}]},{"title":"田沼時代","flow":[{"y":"1758","t":"宝暦事件","s":"9代家重の治世に、京都で国学者竹内式部が追放される","why":""},{"y":"1767","t":"明和事件と田沼意次の台頭","s":"江戸で兵学者山県大弐が処刑される。10代家治のもと、家重の小姓から御用取次となった田沼意次が実権を握る（〜86年）","why":""},{"y":"1772","t":"田沼意次が老中に就任・南鐐二朱銀の鋳造","s":"初めて側用人から老中となる。明和五匁銀（1765年）に続き計数銀貨の南鐐二朱銀を鋳造","why":"商取引の円滑化と金中心の貨幣制度への統一を図るため"},{"y":"","t":"株仲間の奨励・専売制の拡大","s":"都市問屋商人に株を認める代わりに運上・冥加を納めさせる。銅座のほか鉄座・真鍮座・朝鮮人参座を組織","why":"年貢増徴に頼らず民間の経済活動の富を財源に取り込むため"},{"y":"","t":"印旛沼・手賀沼の干拓","s":"江戸・大坂の商人の力を借りて新田開発を図るが、利根川の大洪水などで挫折","why":"新田開発・水運の利便・洪水の抑止のため"},{"y":"1778","t":"ロシア船の厚岸来航と蝦夷地開発計画","s":"仙台藩医工藤平助の『赤蝦夷風説考』の意見を採用し、蝦夷地開発・対露貿易を計画","why":"ロシア船の来航を背景とする"},{"y":"1782","t":"天明の飢饉と浅間山大噴火","s":"天明の飢饉（〜87年）に1783年の浅間山大噴火が重なり、百姓一揆・打ちこわしが激増","why":""},{"y":"1784","t":"田沼意知殺害事件","s":"若年寄の意知（意次の子）が旗本佐野政言に殿中で刺殺される。佐野は「世直し大明神」と呼ばれた","why":"私憤による"},{"y":"1785","t":"最上徳内の北方探査","s":"蝦夷地・千島列島を探査し、アイヌとの交易やロシア貿易の可能性を調査","why":"蝦夷地開発・対露貿易計画のため"},{"y":"1786","t":"田沼意次の老中罷免","s":"10代家治の死去に伴い完全に失脚し、多くの政策も中止","why":"賄賂・縁故政治への不評と家治の死去"}],"story":"9代【家重】は側用人大岡忠光を登用し、10代【家治】のもとでは家重の小姓から出世した【田沼意次】が1772年に初めて側用人から老中となり実権を握った。この間、【宝暦事件】（竹内式部）と【明和事件】（山県大弐）という2つの尊王事件が起きている。再び行き詰まった幕府財政を再建するため→意次は年貢増徴に頼らず【株仲間】を奨励して運上・冥加を徴収し、専売制を拡大、【南鐐二朱銀】などの計数銀貨を鋳造した。ロシア船の厚岸来航を背景に→【工藤平助】の『赤蝦夷風説考』を採用し【最上徳内】に北方を探査させ、長崎貿易も拡大した。しかし商品貨幣経済の急速な進展が原因で→農村・都市で階層分化が進み、賄賂政治が横行した。さらに【天明の飢饉】・【浅間山】大噴火で一揆・打ちこわしが激増し、子の意知が刺殺され、1786年家治の死去に伴い→意次は失脚した。","keywords":["田沼意次","徳川家治","側用人","株仲間","運上・冥加","南鐐二朱銀","印旛沼・手賀沼","工藤平助","赤蝦夷風説考","最上徳内","俵物","天明の飢饉","浅間山大噴火","田沼意知","宝暦・天明期の文化"],"blanks":[{"q":"田沼意次は9代将軍【　】の小姓から御用取次に登用された。","a":"徳川家重","h":"吉宗の子で、大岡忠光を側用人とした"},{"q":"田沼意次が実権を握ったのは10代将軍【　】の治世である。","a":"徳川家治","h":"1786年の死去で意次は失脚"},{"q":"1758年の宝暦事件では、京都で国学者【　】が追放された。","a":"竹内式部","h":"尊王事件の一つ"},{"q":"1767年の明和事件では、江戸で兵学者【　】が処刑された。","a":"山県大弐","h":"宝暦事件に続く尊王事件"},{"q":"田沼意次は【　】を奨励し、営業独占を認める代わりに運上・冥加を納めさせた。","a":"株仲間","h":"綱吉が黙認、吉宗が公認していた"},{"q":"1772年から鋳造された計数銀貨【　】は、金中心の貨幣制度への統一をめざした。","a":"南鐐二朱銀","h":"明和五匁銀に続く"},{"q":"意次は下総国の【　】・手賀沼の干拓を進めたが、利根川の大洪水などで挫折した。","a":"印旛沼","h":"江戸・大坂の商人の力を借りた"},{"q":"仙台藩の医師【　】は『赤蝦夷風説考』を著し、蝦夷地開発と対露貿易を進言した。","a":"工藤平助","h":"1778年のロシア船厚岸来航が背景"},{"q":"1785年から【　】が蝦夷地・千島列島を探査した。","a":"最上徳内","h":"北方探査"},{"q":"長崎貿易では銅や【　】（いりこ・干し鮑・ふかひれ）で支払い、金・銀の輸入を図った。","a":"俵物","h":"俵物三種"},{"q":"1783年の【　】大噴火は天明の飢饉を長期化させた。","a":"浅間山","h":"「浅間しや富士より高き米相場」"},{"q":"1784年、若年寄田沼意知が旗本【　】に殿中で刺殺された。","a":"佐野政言","h":"「世直し大明神」と呼ばれた"}],"mc":[{"q":"田沼意次が株仲間を奨励した目的として正しいものはどれか。","c":["年貢増徴により財政を再建するため","運上・冥加を徴収し民間の富を財源に取り込むため","農村の商品作物栽培を抑制するため","在郷商人の流通参加を促すため"],"a":1,"e":"年貢増徴に頼らず民間の経済活動を活発にし、その富の一部を財源に取り込もうとした。"},{"q":"南鐐二朱銀の鋳造の目的として正しいものはどれか。","c":["銀中心の貨幣制度に統一するため","貨幣の質を落とし出目を得るため","金中心の貨幣制度への統一を図るため","藩札の発行を抑えるため"],"a":2,"e":"計数銀貨を鋳造し、商取引の円滑化と金中心の貨幣制度への統一をめざした。"},{"q":"田沼意次が蝦夷地開発・対露貿易を計画した背景として正しいものはどれか。","c":["ラクスマンの根室来航","クナシリ・メナシの蜂起","ロシア船の厚岸来航","アイヌとの交易の停止"],"a":2,"e":"1778年のロシア船厚岸来航を背景に、工藤平助『赤蝦夷風説考』の意見を採用した。"},{"q":"田沼時代に農村で豪農と貧農への階層分化が進んだ原因として正しいものはどれか。","c":["商品貨幣経済の急速な進展","定免法の採用","旧里帰農令の実施","囲米の制の実施"],"a":0,"e":"商品貨幣経済の進展により、村役人らは田畑を集めて豪農となり、小規模な本百姓や水呑は貧農化した。"},{"q":"田沼意次が失脚した直接の契機として正しいものはどれか。","c":["天明の打ちこわし","10代将軍家治の死去","田沼意知の殺害","浅間山の大噴火"],"a":1,"e":"1786年、家治の死去に伴い意次は老中を罷免され完全に失脚、多くの政策も中止された。"},{"q":"田沼時代の文化についての説明として正しいものはどれか。","c":["厳しい統制により文化は衰退した","上方町人中心の元禄文化が開花した","寛政異学の禁により朱子学のみが栄えた","大胆な改革に刺激を受け宝暦・天明期の文化が多様に発展した"],"a":3,"e":"田沼の大胆な改革に刺激を受け、民間の学問・芸術は多様な発展を遂げた。"},{"q":"田沼時代の長崎貿易についての説明として正しいものはどれか。","c":["海舶互市新例で貿易を制限した","オランダ船の来航を禁止した","金・銀の流出を防ぐため貿易を縮小した","銅や俵物で支払い金・銀の輸入を図った"],"a":3,"e":"銅7：俵物3の割合で支払い、貨幣鋳造のための金・銀輸入を図る積極策を展開した。"}],"order":[{"title":"田沼時代の出来事","items":["宝暦事件","明和事件","田沼意次の老中就任","田沼意知殺害事件","田沼意次の罷免"],"e":"宝暦事件（1758）→明和事件（1767）→老中就任（1772）→意知殺害（1784）→罷免（1786）。"},{"title":"田沼時代の北方政策と災害","items":["ロシア船の厚岸来航","天明の飢饉の開始","浅間山大噴火","最上徳内の北方探査"],"e":"厚岸来航（1778）→天明の飢饉開始（1782）→浅間山大噴火（1783）→最上徳内の探査（1785）。"}]},{"title":"寛政の改革","flow":[{"y":"1787","t":"天明の打ちこわしと松平定信の登場","s":"全国30余りの都市で打ちこわしが起こり、白河藩主の松平定信が老中首座となる（翌年将軍補佐）。11代家斉の初期治世6年間が寛政の改革（〜93年）","why":"田沼時代以後の国内外の混乱を収拾するため"},{"y":"1789","t":"棄捐令","s":"札差に対する旗本・御家人の6年以前の借金を帳消し、5年以内は低利年賦返済に","why":"改革の実行者である旗本・御家人を救済するため"},{"y":"1789","t":"囲米の制","s":"大名に1万石につき50石の囲米を命じ、常平倉・社倉・義倉も整備","why":"天明の飢饉後の備荒貯蓄のため"},{"y":"1789","t":"尊号一件（〜93年）","s":"光格天皇が実父閑院宮典仁親王への太上天皇尊号宣下を求めるが定信が拒否し、武家伝奏を処分。同年アイヌによるクナシリ・メナシの蜂起","why":""},{"y":"1790","t":"寛政異学の禁","s":"朱子学を正学とし、聖堂学問所で異学の講義を禁止。寛政の三博士を儒官に任命","why":"教学統制と朱子学振興のため"},{"y":"1790","t":"旧里帰農令","s":"正業をもたない江戸在住者に資金を与え帰村を奨励。完全な失敗に終わる","why":"農村人口の確保と都市人口の抑制のため"},{"y":"1790","t":"人足寄場の設置","s":"火付盗賊改長谷川平蔵の提案で石川島に設置し、無宿人を収容・職業訓練","why":"江戸の治安維持のため"},{"y":"1791","t":"七分積金","s":"町入用の節約分の7割を積み立て江戸町会所で運用し、貧民救済や低利金融にあてる","why":"天明の打ちこわし後の江戸の再建・治安維持のため"},{"y":"1792","t":"林子平の処罰とラクスマン来航","s":"前年刊行の『海国兵談』の版木を没収し蟄居を命じる。同年ロシア人ラクスマンが根室に来航し、海防強化を諸藩に命じる","why":"民間の出版統制と海防強化のため"},{"y":"1793","t":"松平定信の失脚","s":"尊号一件や一橋治済の大御所問題で将軍とも対立し、わずか6年で失脚","why":"厳しい統制への反発と将軍・朝廷との対立"}],"story":"田沼時代以後の混乱と1787年の【天明の打ちこわし】を背景に→11代【家斉】のもとで白河藩主の【松平定信】が老中首座となり【寛政の改革】を厳しく主導した。祖父吉宗を手本に→側近政治を廃止し、重商主義的な田沼時代に対し重農主義的に農村復興と商業資本の抑圧で財政再建を図った。教学統制のため→【寛政異学の禁】で朱子学を正学とし、出版統制令で山東京伝らを処罰、『海国兵談』の【林子平】も処罰した。飢饉後の備荒貯蓄のため→【囲米の制】、都市人口の抑制のため→旧里帰農令、旗本救済のため→【棄捐令】、江戸の治安維持のため→【人足寄場】・【七分積金】を実施した。しかし厳しい統制に大奥や都市民衆が反発し、【尊号一件】で朝廷とも対立した結果→わずか6年で失脚し、朝幕間の協調関係は崩れて天皇の権威が浮上し始めた。同じ頃、細川重賢・【上杉治憲】ら「名君」が自ら藩政改革を行った。","keywords":["松平定信","徳川家斉","寛政異学の禁","寛政の三博士","林子平","海国兵談","棄捐令","囲米の制","旧里帰農令","人足寄場","七分積金","尊号一件","光格天皇","上杉治憲","国産会所"],"blanks":[{"q":"寛政の改革は、御三卿一橋家出身の11代将軍【　】の初期治世に行われた。","a":"徳川家斉","h":"父は一橋治済"},{"q":"松平定信は御三卿の【　】家出身で、8代将軍吉宗の孫にあたる。","a":"田安","h":"田安宗武の子"},{"q":"1790年の【　】で朱子学が正学とされ、聖堂学問所での異学の講義が禁止された。","a":"寛政異学の禁","h":"教学統制と朱子学振興が目的"},{"q":"林家以外の推進 益が阻害され一揆が起こった。"}],"order":[{"title":"寛政の改革の政策","items":["棄捐令","寛政異学の禁","七分積金","林子平の処罰"],"e":"棄捐令（1789）→寛政異学の禁（1790）→七分積金（1791）→林子平の処罰（1792）。"},{"title":"田沼時代から寛政の改革へ","items":["天明の飢饉の開始","田沼意次の罷免","天明の打ちこわし","松平定信の老中首座就任","尊号一件"],"e":"天明の飢饉（1782〜）→意次罷免（1786）→打ちこわし（1787）→その混乱を背景に定信が老中首座（1787）→尊号一件（1789〜93）。"},{"title":"寛政の改革と対外関係","items":["クナシリ・メナシの蜂起","人足寄場の設置","ラクスマンの根室来航","松平定信の失脚"],"e":"アイヌの蜂起（1789）→人足寄場（1790）→ラクスマン来航（1792）→定信失脚（1793）。"}]},{"title":"宝暦・天明期の文化","flow":[{"y":"","t":"教育の普及と文化の裾野の拡大","s":"各地に藩校・郷校・私塾・寺子屋が開設され、武士だけでなく庶民の識字・教養が底上げされる","why":"産業・交通の発達と各種学校の設置のため"},{"y":"","t":"山脇東洋の腑分けと『蔵志』","s":"古医方の山脇東洋が京都で解剖を行い、玄白・良沢らに影響を与える","why":""},{"y":"","t":"『解体新書』と蘭学の始まり","s":"杉田玄白・前野良沢らが『ターヘル＝アナトミア』を翻訳。玄白は『蘭学事始』も著す","why":"吉宗の実学奨励で漢訳洋書輸入が緩和され、洋学の基礎ができていたため"},{"y":"","t":"蘭学の発展","s":"大槻玄沢『蘭学階梯』・芝蘭堂、宇田川玄随『西説内科撰要』、稲村三伯の初の蘭日辞書『ハルマ和解』","why":""},{"y":"","t":"平賀源内と西洋画","s":"長崎で学んだ平賀源内がエレキテルを発明し『西洋婦人図』を描く。門下の司馬江漢が銅版画を創始、小田野直武が秋田蘭画","why":""},{"y":"","t":"国学の発達","s":"荷田春満『創学校啓』→賀茂真淵『万葉考』『国意考』→本居宣長『古事記伝』。古道を理想化する復古主義","why":"古学派の研究法や歌学の刷新運動、神道思想を源流とする"},{"y":"","t":"塙保己一の和学講談所","s":"賀茂真淵に学んだ盲目の学者塙保己一が幕府の援助で江戸に設け『群書類従』を編纂","why":""},{"y":"","t":"諸思想と町人学者","s":"石田梅岩の心学『都鄙問答』、安藤昌益『自然真営道』の身分制批判。大坂の懐徳堂から富永仲基・山片蟠桃","why":"幕藩体制の矛盾が深まり合理主義の発想が生まれたため"},{"y":"","t":"錦絵の流行","s":"鈴木春信が多色刷の錦絵を創始し、喜多川歌麿の美人画、東洲斎写楽の役者絵が人気に","why":"一枚絵・多色刷の技術が生まれたため"},{"y":"","t":"戯作文学と寛政の改革による弾圧","s":"黄表紙（恋川春町『金々先生栄花夢』）・洒落本（山東京伝『仕懸文庫』）が流行するが、寛政の改革で発禁に。読本は上田秋成『雨月物語』","why":"政治・社会を題材とした風刺が出版統制の対象となったため"}],"story":"産業・交通の発達に加え、各地に藩校・郷校・私塾・【寺子屋】が作られたため→武士だけでなく庶民の識字・教養が底上げされ、18世紀後半の【宝暦・天明期の文化】は担い手の裾野が広がった。吉宗が漢訳洋書輸入の禁を緩め実学を奨励していたため→杉田玄白・【前野良沢】らの『【解体新書】』を出発点に蘭学が興隆し。儒学の古学派の研究法や神道思想を源流に→【国学】が発達し、荷田春満→【賀茂真淵】→【本居宣長】『古事記伝』と受け継がれ、【塙保己一】は『群書類従』を編纂した。幕藩体制の矛盾が深まったため→【石田梅岩】の心学や【安藤昌益】の身分制批判、大坂の【懐徳堂】から富永仲基・山片蟠桃ら合理的な町人学者も生まれた。文学では通俗的な戯作（黄表紙・洒落本）が流行したが、政治・社会を風刺したため→寛政の改革で弾圧された。浮世絵は【鈴木春信】が多色刷の【錦絵】を創始して一枚絵となり、歌麿の美人画、写楽の役者絵が人気を博した。","keywords":["宝暦・天明期の文化","解体新書","前野良沢","大槻玄沢","ハルマ和解","平賀源内","国学","本居宣長","塙保己一","石田梅岩","安藤昌益","懐徳堂","錦絵","鈴木春信","司馬江漢"],"blanks":[{"q":"杉田玄白・前野良沢らが『ターヘル＝アナトミア』を翻訳した『【　】』は蘭学の出発点となった。","a":"解体新書","h":"杉田玄白は『蘭学事始』も著す"},{"q":"稲村三伯が編纂した『【　】』は初の蘭日辞書である。","a":"ハルマ和解","h":"蘭日対訳辞書"},{"q":"古医方の医学者【　】は京都で腑分けを行い『蔵志』を著した。","a":"山脇東洋","h":"玄白・良沢らに影響を与えた"},{"q":"長崎で学んだ【　】はエレキテル・寒暖計などを発明し『西洋婦人図』を描いた。","a":"平賀源内","h":"司馬江漢・小田野直武の師"},{"q":"【　】は『古事記伝』『玉勝間』などを著し、伊勢国松坂に私塾鈴屋を開いた。","a":"本居宣長","h":"国学の大成者"},{"q":"賀茂真淵に師事した盲目の学者【　】は、和学講談所を設け『群書類従』を編纂した。","a":"塙保己一","h":"幕府の援助を受けた"},{"q":"【　】は心学〔石門心学〕を創始し、『都鄙問答』で庶民の生活倫理を説いた。","a":"石田梅岩","h":"弟子の手島堵庵らが全国に広めた"},{"q":"【　】は『自然真営道』『統道真伝』で「万人直耕の自然世」を理想として身分制社会を批判した。","a":"安藤昌益","h":"身分制社会批判"},{"q":"大坂の商人たちの出資で設立された私塾【　】からは、富永仲基・山片蟠桃らの町人学者が出た。","a":"懐徳堂","h":"中井甃庵らが設立、初代学主は三宅石庵"},{"q":"【　】は『弾琴美人』などの美人画で多色刷版画の錦絵を創始した。","a":"鈴木春信","h":"錦絵の創始者"},{"q":"平賀源内に学んだ【　】は銅版画を創始し『不忍池図』で高名になった。","a":"司馬江漢","h":"西洋画"},{"q":"上田秋成の読本『【　】』は上方で人気を博した。","a":"雨月物語","h":"伝説・歴史などを題材とした文章主体の小説"}],"mc":[{"q":"18世紀後半に文化の裾野が広がった理由として正しいものはどれか。","c":["寛政異学の禁で朱子学が普及したため","鎖国が解かれ外国文化が流入したため","各種学校の設置で庶民の識字・教養が底上げされたため","幕府が戯作の出版を奨励したため"],"a":2,"e":"藩校・郷校・私塾・寺子屋が各地に開設され、庶民の識字・教養が底上げされた。"},{"q":"『解体新書』についての説明として正しいものはどれか。","c":["杉田玄白・前野良沢らがオランダ語の解剖書を翻訳したもの","大槻玄沢が著した蘭学の入門書","山脇東洋が腑分けの結果を記したもの","稲村三伯が編纂した蘭日辞書"],"a":0,"e":"『ターヘル＝アナトミア』の翻訳。大槻玄沢は『蘭学階梯』、山脇東洋は『蔵志』、稲村三伯は『ハルマ和解』。"},{"q":"国学の発達の源流として正しいものはどれか。","c":["朱子学の大義名分論","蘭学の実証主義","石門心学の生活倫理","儒学の古学派の研究法や歌学の刷新運動、神道思想"],"a":3,"e":"古学派の研究法・歌学の刷新運動・神道思想を源流とし、古道を理想化する復古主義をとった。"},{"q":"黄表紙・洒落本が寛政の改革で弾圧された理由として正しいものはどれか。","c":["人間性を深く掘り下げすぎたため","遊里や政治・社会を題材とし風俗を乱すとされたため","朱子学を批判したため","外国の思想を紹介したため"],"a":1,"e":"洒落本は遊里、黄表紙は風刺・滑稽を基調とし、出版統制令で山東京伝・恋川春町らが処罰された。"},{"q":"宝暦・天明期の浮世絵とそれ以前の浮世絵の違いとして正しいものはどれか。","c":["肉筆画から版画になった","役者絵から風景画になった","挿絵・二色までから一枚絵・多色刷の錦絵になった","京都中心から長崎中心になった"],"a":2,"e":"鈴木春信が多色刷の錦絵を創始し、挿絵中心から一枚絵の多色刷版画へ変わった。"},{"q":"大坂の懐徳堂の特徴として正しいものはどれか。","c":["商人の出資で設立され合理的・実証的な町人学者を輩出した","幕府直営で藩士を教育した","国学を専門に教えた","蘭学者大槻玄沢が開いた"],"a":0,"e":"中井甃庵らが商人の出資で設立し、『出定後語』の富永仲基や『夢の代』の山片蟠桃を生んだ。"},{"q":"石田梅岩の心学についての説明として正しいものはどれか。","c":["身分制社会を批判し万人直耕を説いた","古道を理想化する復古主義をとった","男女の才知の平等を主張した","儒教道徳に仏教・神道を加味し庶民の生活倫理を説いた"],"a":3,"e":"『都鄙問答』で商人中心の庶民の生活倫理を説いたが身分制社会は批判しなかった。身分制批判は安藤昌益。"}],"order":[{"title":"蘭学の発展","items":["山脇東洋の腑分けと『蔵志』","『解体新書』の刊行","大槻玄沢『蘭学階梯』","稲村三伯『ハルマ和解』"],"e":"山脇東洋の解剖が玄白・良沢に影響→『解体新書』→玄沢が入門書『蘭学階梯』→初の蘭日辞書『ハルマ和解』。"},{"title":"国学の系譜","items":["荷田春満","賀茂真淵","本居宣長","塙保己一"],"e":"荷田春満『創学校啓』→賀茂真淵『万葉考』→本居宣長『古事記伝』。塙保己一は真淵に師事し『群書類従』を編纂。"},{"title":"浮世絵師の登場","items":["鈴木春信","喜多川歌麿","東洲斎写楽"],"e":"春信が錦絵を創始→歌麿の美人画『婦女人相十品』→写楽の役者絵『市川鰕蔵』。"}]}],"review":[{"q":"享保の改革と寛政の改革に共通する性格として正しいものはどれか。","c":["側近政治を活用した現実主義","家康や吉宗を手本とする復古理想主義","商業資本を積極的に利用した重商主義","蝦夷地開発と対露貿易の推進"],"a":1,"e":"吉宗は家康を、定信は祖父吉宗を手本とし、ともに側近政治を廃止した。商業資本の利用は田沼時代。"},{"q":"田沼意次が年貢増徴に頼らない財政再建を図った背景として正しいものはどれか。","c":["享保の改革の年貢増徴が一揆・打ちこわしを招き、幕府財政も再び行き詰まったため","寛政異学の禁で朱子学が振興されたため","天明の打ちこわしで江戸が荒廃したため","光格天皇との対立で朝廷の支持を失ったため"],"a":0,"e":"享保の改革の後、幕府財政は再び行き詰まり、意次は民間の経済活動の富を財源に取り込もうとした。"},{"q":"松平定信が商業資本を抑圧した理由として正しいものはどれか。","c":["株仲間が幕府に運上を納めなかったため","上げ米の再開に商人が反対したため","長崎貿易で銅が不足したため","田沼時代の重商主義が賄賂政治や階層分化を招いたのに対し、農村復興による財政再建を図ったため"],"a":3,"e":"田沼時代への反動として、定信は重農主義的に農村の復興と商業資本の抑圧で財政再建を図った。"},{"q":"株仲間に対する幕府の方針の変遷として正しいものはどれか。","c":["綱吉が公認→吉宗が奨励→意次が黙認","吉宗が禁止→意次が黙認→定信が公認","綱吉が黙認→吉宗が公認→意次が奨励","綱吉が奨励→吉宗が禁止→意次が公認"],"a":2,"e":"原則禁止だったが、5代綱吉が黙認、8代吉宗が公認、田沼意次が運上・冥加を目当てに奨励した。"},{"q":"宝暦・天明期の文化が発展した政治的背景として正しいものはどれか。","c":["田沼の大胆な改革による刺激と学校の普及","寛政の改革の出版奨励","享保の改革の倹約令","尊号一件による朝廷の権威上昇"],"a":0,"e":"田沼の大胆な改革に刺激を受けて民間の学問・芸術が多様に発展し、各種学校の普及が裾野を広げた。"},{"q":"享保の改革の実学奨励が後の文化に与えた影響として正しいものはどれか。","c":["国学の発達を促した","石門心学の普及を促した","錦絵の創始につながった","漢訳洋書輸入の緩和が『解体新書』などの蘭学興隆の基礎となった"],"a":3,"e":"吉宗が漢訳洋書輸入の禁を緩和し青木昆陽らにオランダ語を学ばせたことが、蘭学興隆の基礎となった。"}]},{"id":14,"title":"幕藩体制の崩壊","era":"江戸時代後期","span":"1793〜1845","oneLine":"飢饉と一揆で領主支配が揺らぎ、大御所政治の弛緩と天保の改革の失敗で幕府は決定的に衰退した","chain":["松平定信（寛政の改革）","徳川家斉（大御所政治）","松平信明ら寛政の遺老","水野忠成","水野忠邦（天保の改革）","阿部正弘"],"parts":[{"title":"百姓一揆と打ちこわし","flow":[{"y":"1641","t":"寛永の飢饉","s":"西日本の干ばつと東日本の長雨・冷害による江戸時代最初の大飢饉","why":"3代家光は対応として1643年に田畑永代売買禁止令を出した"},{"y":"1686","t":"嘉助騒動","s":"信濃国松本藩で起きた惣百姓一揆の例。以後、元文一揆・久留米一揆・郡上一揆・大原騒動と続く","why":"17世紀末からあらゆる階層の農民が参加する惣百姓一揆が典型となった"},{"y":"1732","t":"享保の飢饉","s":"長雨・冷害と西日本のイナゴ・ウンカ大発生が原因。江戸で初の打ちこわし","why":"幕府・諸藩はお救い政策を行ったが米価高騰を防げなかった"},{"y":"1764","t":"伝馬騒動","s":"信濃・上野・下野・武蔵の街道沿いの農民が助郷役の負担増に反対した広域闘争","why":"伝馬役の一種である助郷役が重くなったため"},{"y":"1782","t":"天明の飢饉","s":"長雨・冷害・浅間山大噴火（1783年）が原因で東北・関東を中心に発生","why":"白河藩など一部を除き対策が不十分で、1787年に天明の打ちこわしが起きた"},{"y":"1823","t":"摂津・河内・和泉の国訴","s":"在郷商人主導で農民が木綿・菜種の流通独占に反対した合法的訴訟","why":"領主・都市問屋商人の流通独占に生産者が反発したため"},{"y":"1833","t":"天保の飢饉","s":"冷害・洪水が原因で東北を中心に発生。農村で飢饉が慢性化し都市で米価が高騰","why":"幕府・各藩の対策が自領の利害中心だったため"},{"y":"1856","t":"渋染一揆","s":"備前国岡山藩で被差別民が藩の差別強化政策に反対した闘争","why":""},{"y":"","t":"世直し一揆","s":"19世紀前半〜幕末、貧農層が土地の再分配などを要求し豪商・村役人を襲撃","why":"領主への訴えは薄く、村方騒動と連動することが多かった"}],"story":"江戸時代の庶民闘争の最大要因は経済的困窮だった。【寛永】【享保】【天明】【天保】と飢饉が連続し、そこに幕藩領主の重税や問屋商人の農村進出、高利貸しの返済請求が重なったため→百姓一揆は弾圧にもかかわらず増加し、3000件以上に及んだ。形態は17世紀前半の愁訴・逃散から、村の代表が命懸けで直訴する【代表越訴型一揆】（【佐倉惣五郎】らが義民化）へ、さらに17世紀末からは全階層が参加し傘連判状で主謀者を隠す【惣百姓一揆】へと発展した。18世紀前半からは都市の貧民層が豪商を襲う【打ちこわし】が、畿内では在郷商人主導の合法的訴訟である【国訴】が、村内では豪農の不正を追及する【村方騒動】が起こり、幕末には土地の再分配を求める【世直し一揆】に至った。これらは一時的・分散的で全国的運動にはならなかったが、領主支配を後退させ封建社会の基礎を動揺させた。","keywords":["寛永の飢饉","享保の飢饉","天明の飢饉","天保の飢饉","代表越訴型一揆","佐倉惣五郎","惣百姓一揆","傘連判状","打ちこわし","国訴","村方騒動","世直し一揆","伝馬騒動","渋染一揆"],"blanks":[{"q":"1641〜43年の【　】の飢饉は江戸時代最初の大飢饉で、これを受けて家光は田畑永代売買禁止令を出した。","a":"寛永","h":"3代将軍家光の時代"},{"q":"1732年の【　】の飢饉では、江戸で初の打ちこわしが起こった。","a":"享保","h":"享保の改革期の三大飢饉の一つ"},{"q":"1782〜87年の【　】の飢饉は浅間山大噴火なども原因となり、1787年に主要都市で打ちこわしが起こった。","a":"天明","h":"田沼時代の飢饉"},{"q":"1833〜39年の【　】の飢饉では農村で飢饉が慢性化し、都市では米価が高騰した。","a":"天保","h":"大御所政治期の飢饉"},{"q":"17世紀後半、村の代表者が領主へ直訴する【　】型一揆が起こり、佐倉惣五郎らが義民として伝説化した。","a":"代表越訴","h":"役人を越えて命懸けで直訴"},{"q":"17世紀末から、あらゆる階層の農民が参加する【　】一揆が百姓一揆の典型となった。","a":"惣百姓","h":"傘連判状で主謀者を隠した"},{"q":"惣百姓一揆では、主謀者を隠すために【　】を作成することが多かった。","a":"傘連判状","h":"円形に署名する"},{"q":"17世紀後半、信濃国松本藩で【　】が起こった。","a":"嘉助騒動","h":"惣百姓一揆の初期の例"},{"q":"農村・都市の貧民層が豪商・高利貸しなどを襲い、店舗・家屋を破壊する行為を【　】という。","a":"打ちこわし","h":"主に都市で発生する暴動"},{"q":"在郷商人の主導で農民が流通独占に反対して起こした合法的訴訟を【　】という。","a":"国訴","h":"1823年〜の摂津・河内・和泉が有名"},{"q":"村役人を務める豪農の不正に対し、貧農が村入用の公開などを求めた闘争を【　】という。","a":"村方騒動","h":"18世紀後半〜"},{"q":"備前国岡山藩で被差別民が藩の差別強化政策に反対した闘争を【　】という。","a":"渋染一揆","h":"1856年〜"}],"mc":[{"q":"江戸時代の庶民闘争が増加し続けた最大の要因として最も適当なものはどれか。","c":["キリスト教の弾圧","飢饉・重税などによる経済的困窮","参勤交代の負担","外国船の接近"],"a":1,"e":"飢饉の頻発、幕藩領主の重税、問屋商人の進出、高利貸しの返済請求などの経済的困窮が最大要因。"},{"q":"享保の飢饉の結果として正しいものはどれか。","c":["田畑永代売買禁止令が出された","大塩の乱が起こった","天明の打ちこわしが起こった","江戸で初の打ちこわしが起こった"],"a":3,"e":"享保の飢饉（1732年）では幕府・各藩がお救い政策を行ったが、江戸で初の打ちこわしが起きた。"},{"q":"天明の飢饉の原因として正しいものはどれか。","c":["西日本の干ばつと東日本の長雨","冷害・洪水","長雨・冷害・浅間山大噴火","イナゴ・ウンカの大発生"],"a":2,"e":"1783年の浅間山大噴火に長雨・冷害が重なり、東北・関東を中心に発生した。"},{"q":"代表越訴型一揆から惣百姓一揆への変化の説明として正しいものはどれか。","c":["小規模な直訴から、全階層が参加する広域的で大規模な強訴へ","都市の暴動から農村の訴訟へ","合法的訴訟から武力蜂起へ","村役人への要求から幕府への直訴へ"],"a":0,"e":"代表越訴型は村の代表が直訴する小規模なもの、惣百姓一揆はあらゆる階層が参加し広域的・大規模。"},{"q":"国訴が百姓一揆や打ちこわしと異なる点として正しいものはどれか。","c":["領主に対する武力反抗であった","被差別民が主体であった","合法的な訴訟であった","村役人の交代を求めた"],"a":2,"e":"国訴は在郷商人主導で農民が流通独占に反対して起こした合法的訴訟。"},{"q":"天保の飢饉で農村の飢饉が慢性化し、都市で米価が高騰した背景として正しいものはどれか。","c":["幕府が株仲間を解散したため","幕府・各藩の対策が自領の利害中心だったため","囲米の制が廃止されたため","浅間山が噴火したため"],"a":1,"e":"各藩が自領の利害を優先したため、対策が全国的に機能しなかった。"},{"q":"村方騒動の説明として正しいものはどれか。","c":["街道沿いの農民が助郷役の負担増に反対した","在郷商人が都市問屋の流通独占に反対した","被差別民が藩の差別政策に反対した","貧農が村役人を務める豪農の不正を追及し村政改革を求めた"],"a":3,"e":"村入用の公開や村役人の交代を求めた闘争で、小作権をめぐり一揆と連動することも多かった。"},{"q":"江戸時代の庶民闘争の意義として正しいものはどれか。","c":["領主支配が後退し封建社会の基礎が動揺した","継続的・全国的・組織的な運動に発展した","幕府が身分制を廃止した","参加者が武士層に広がった"],"a":0,"e":"一時的・分散的で全国的運動にはならなかったが、領主支配を後退させ封建社会の基礎を動揺させた。"}],"order":[{"title":"江戸時代の飢饉","items":["寛永の飢饉","享保の飢饉","天明の飢饉","天保の飢饉"],"e":"寛永（1641〜43）→享保（1732）→天明（1782〜87）→天保（1833〜39）。享保・天明・天保が三大飢饉。"},{"title":"百姓一揆の形態の変化","items":["愁訴・逃散・強訴","代表越訴型一揆","惣百姓一揆","世直し一揆"],"e":"17世紀前半の愁訴・逃散→17世紀後半の代表越訴型→17世紀末からの惣百姓一揆→19世紀前半〜幕末の世直し一揆。"},{"title":"惣百姓一揆の代表例","items":["嘉助騒動","元文一揆","郡上一揆","大原騒動"],"e":"嘉助騒動（17世紀後半・松本藩）→元文一揆（18世紀前半・磐城平藩）→郡上一揆（18世紀半ば・郡上藩）→大原騒動（18世紀後半・飛驒幕領）。"}]},{"title":"大御所政治","flow":[{"y":"1793","t":"大御所政治の開始","s":"寛政の改革後、11代将軍徳川家斉が改革を放棄。1841年まで続く","why":"松平定信の失脚後、家斉に政治的意欲がなかったため"},{"y":"1804","t":"文化年間（寛政の遺老）","s":"老中松平信明らが幕政を主導し、寛政の改革の質素・倹約政策を継承","why":"定信が集団指導制を採っていたため"},{"y":"1805","t":"関東取締出役の設置","s":"八州廻り。幕領・私領・寺社領を問わず、水戸藩を除く関八州の治安維持にあたる","why":"無宿人・博徒の横行で関東の治安が悪化したため"},{"y":"1818","t":"文政年間（水野忠成）","s":"老中首座水野忠成が品位の劣る文政小判を大量に流通させ、物価上昇と賄賂政治が横行","why":"将軍や大奥の華美な生活を支えるため"},{"y":"1825","t":"異国船打払令","s":"無二念打払令。外国船の接近に対する強硬策","why":"外患への対応"},{"y":"1827","t":"寄場組合の結成","s":"関八州の農村40〜50か村ごとに組合を結成させ、治安維持・風俗取締りを行わせる","why":"関東農村の荒廃と治安悪化に対応するため"},{"y":"1836","t":"郡内騒動・加茂一揆","s":"天保の飢饉が特に厳しく、幕領の甲斐国郡内・三河国加茂でも一揆が起こる","why":"幕領でも一揆が起きたことは幕府への打撃となった"},{"y":"1837","t":"大塩の乱","s":"大坂町奉行所元与力の陽明学者大塩平八郎が門弟と武装蜂起。半日で鎮圧","why":"天保の飢饉への幕府の無為無策と豪商の米買い占めへの憤激"},{"y":"1837","t":"生田万の乱・モリソン号事件","s":"越後国柏崎で大塩門弟を称した国学者生田万が蜂起。同年モリソン号事件も起こる","why":"大塩の乱の影響が全国に波及した"},{"y":"1839","t":"蛮社の獄","s":"モリソン号事件を契機とする幕政批判を理由に蘭学者を弾圧","why":"内憂と外患が重なり幕府が思想統制を強めた"}],"story":"生産形態は問屋制家内工業から【工場制手工業】へ発展し、【在郷商人】の成長や諸藩の専売制、江戸地廻り経済圏の発達で流通ルートが多様化したため→大坂市場の地位は低下し、関東農村は荒廃した。寛政の改革後、11代【徳川家斉】が改革を放棄して【大御所政治】（1793〜1841年）が続き、文政年間には【水野忠成】が文政小判を乱発したため物価が上昇し賄賂政治が横行した。階層分化で無宿人・博徒が横行したため→1805年に【関東取締出役】、1827年に寄場組合を設けた。天保の飢饉に幕府が無為無策だったため→1837年、大坂で元与力の陽明学者【大塩平八郎】が武装蜂起した。半日で鎮圧されたが、直轄都市で元役人が公然と武力反抗したため幕府の権威は失墜し、生田万の乱など各地に波及した。「内憂と外患」の中で、幕府に代わる上位の権威として天皇・朝廷が求められ始めた。","keywords":["工場制手工業","問屋制家内工業","在郷商人","江戸地廻り経済圏","二宮尊徳","北前船","内海船","徳川家斉","大御所政治","水野忠成","関東取締出役","寄場組合","異国船打払令","大塩平八郎","生田万の乱"],"blanks":[{"q":"19世紀、奉公人を一か所に集めて分業に基づく協業を行う【　】〔マニュファクチュア〕が織物業を中心に広がった。","a":"工場制手工業","h":"酒造業・鉱業では17世紀にすでに存在"},{"q":"都市の問屋商人が資金・原料・器具を前貸しし、農家で行う手工業を【　】という。","a":"問屋制家内工業","h":"18〜19世紀"},{"q":"在郷町で成長した【　】は、消費地への直送ルートを開拓し、都市問屋商人の流通独占に反対した。","a":"在郷商人","h":"畿内では国訴を起こした"},{"q":"相模国の【　】は報徳仕法によって農村の復興を試みた。","a":"二宮尊徳","h":"金次郎。大原幽学の性学と並ぶ"},{"q":"蝦夷地からの西廻り航路を航行した【　】は栄えたが、途中で荷を降ろすことも多かった。","a":"北前船","h":"内海船（尾州廻船）とともに大坂の地位低下の一因"},{"q":"寛政の改革後、改革を放棄した11代将軍【　】の治世を大御所政治という。","a":"徳川家斉","h":"1837年に将軍職を家慶に譲った後も実権を握った"},{"q":"文政年間には老中首座【　】が幕政を主導し、品位の劣る文政小判を大量に流通させた。","a":"水野忠成","h":"賄賂政治が横行した"},{"q":"1805年、水戸藩を除く関八州の治安維持のため【　】〔八州廻り〕が設置された。","a":"関東取締出役","h":"幕領・私領・寺社領を問わず取り締まった"},{"q":"1827年、関八州の農村40〜50か村ごとに【　】を結成させ、治安維持・風俗取締りにあたらせた。","a":"寄場組合","h":"人足寄場とは別"},{"q":"1825年、幕府は外国船に対して【　】〔無二念打払令〕を出した。","a":"異国船打払令","h":"1842年に撤回される"},{"q":"1837年、陽明学者で私塾洗心洞を開いていた大坂町奉行所の元与力【　】が武装蜂起した。","a":"大塩平八郎","h":"天保の飢饉への幕府の無為無策に憤激"},{"q":"大塩の乱に呼応して、越後国柏崎で国学者による【　】の乱が起こった。","a":"生田万","h":"大塩門弟と称した"}],"mc":[{"q":"「天下の台所」大坂市場の地位が天保期に低下した理由として正しいものはどれか。","c":["株仲間が解散されたため","大塩の乱で大坂が焼失したため","西廻り航路が廃止されたため","在郷商人や諸藩が独自の流通ルートを開拓したため"],"a":3,"e":"在郷商人の直送、諸藩の専売制、江戸地廻り経済圏、内海船などにより商品集荷力が低下した。"},{"q":"関東農村が荒廃した背景として正しいものはどれか。","c":["在郷商人の成長や階層分化で農民が江戸に流入したため","幕府が人返しの法を出したため","参勤交代が廃止されたため","長州藩の人口が増加したため"],"a":0,"e":"江戸周辺の農民が大量に江戸へ流入し、無宿人・博徒が増えて関東農村の荒廃が進んだ。"},{"q":"文化年間と文政年間の幕政の違いとして正しいものはどれか。","c":["文化年間は水野忠成、文政年間は寛政の遺老が主導した","文化年間は倹約を継承し、文政年間は貨幣改鋳で賄賂政治が横行した","文化年間は天保の改革、文政年間は寛政の改革が行われた","両期とも松平定信が主導した"],"a":1,"e":"文化年間は松平信明ら寛政の遺老が倹約政策を継承、文政年間は水野忠成が文政小判を乱発した。"},{"q":"関東取締出役が設置された背景として正しいものはどれか。","c":["外国船が江戸湾に接近したため","大塩の乱が起こったため","無宿人・博徒が横行し関東の治安が悪化したため","水戸藩が反乱を起こしたため"],"a":2,"e":"階層分化の進行で無宿人・博徒が横行したため、1805年に関八州の治安維持機関として設置された。"},{"q":"大塩の乱の原因として最も適当なものはどれか。","c":["異国船打払令への反対","天保の飢饉に対する幕府の無為無策と豪商の米買い占め","株仲間解散令による混乱","上知令への反対"],"a":1,"e":"天保の飢饉に幕府が無為無策で豪商が米を買い占めたことへの憤激から、大塩平八郎が蜂起した。"},{"q":"大塩の乱が幕府・諸藩に大きな衝撃を与えた理由として正しいものはどれか。","c":["半年以上にわたって戦闘が続いたため","外国の援助を受けていたため","重要直轄都市で幕府の元役人が公然と武力で反抗したため","将軍が殺害されたため"],"a":2,"e":"乱は半日で鎮圧されたが、大坂という直轄都市で元与力が主導した武力反抗だったため権威が失墜した。"},{"q":"大塩の乱の影響として正しいものはどれか。","c":["生田万の乱など各地に一揆・打ちこわしを誘発した","幕府が寛政の改革を開始した","大御所政治が始まった","異国船打払令が出された"],"a":0,"e":"越後国柏崎の生田万の乱のほか各地で一揆・打ちこわしが誘発され、江戸では御救小屋で未然に防いだ。"},{"q":"大御所政治期に天皇・朝廷の権威が浮上し始めた背景として正しいものはどれか。","c":["幕府が尊号一件で朝廷に譲歩したため","朝廷が軍事力を持ったため","光格天皇が将軍を任命したため","内憂と外患で将軍・幕府の権威が失墜し、上位の権威が求められたため"],"a":3,"e":"国内外の危機で幕府の権威が失墜すると、これに代わる上位の権威として天皇・朝廷が求められた。"}],"order":[{"title":"生産形態の発展","items":["農村家内工業","問屋制家内工業","工場制手工業"],"e":"17世紀の農村家内工業→18〜19世紀の問屋制家内工業→19世紀の工場制手工業（マニュファクチュア）。"},{"title":"大御所政治期の治安・対外政策","items":["関東取締出役の設置","異国船打払令","寄場組合の結成","モリソン号事件","蛮社の獄"],"e":"1805年関東取締出役→1825年異国船打払令→1827年寄場組合→1837年モリソン号事件→1839年蛮社の獄。"},{"title":"天保の飢饉から大塩の乱へ","items":["天保の飢饉の開始","郡内騒動・加茂一揆","大塩の乱","生田万の乱"],"e":"1833年からの飢饉→1836年に幕領で郡内騒動・加茂一揆→1837年大塩の乱→同年に呼応した生田万の乱。"}]},{"title":"天保の改革","flow":[{"y":"1827","t":"薩摩藩、調所広郷を登用","s":"島津重豪が下級藩士の調所広郷を登用。借財棚上げ・黒砂糖専売強化・琉球を通じた密貿易","why":"三都商人からの莫大な借財を整理するため"},{"y":"1831","t":"防長大一揆","s":"長州藩で大一揆が起こり、藩主毛利敬親が村田清風を登用する契機となる","why":"領民抵抗が藩政改革を促した"},{"y":"1840","t":"アヘン戦争","s":"イギリスが清を破る（〜42年）。幕府は対外政策を緩和し西洋砲術を採用","why":"清の敗北が幕府に衝撃を与えた"},{"y":"1841","t":"天保の改革の開始","s":"大御所家斉の死後、老中首座水野忠邦が幕府権力の再建・強化を目指し強引に推進","why":"享保・寛政の改革を手本に幕府権威の復活を図った"},{"y":"1841","t":"株仲間解散令・三方領知替えの撤回","s":"株仲間解散は物価引下げが狙いだが逆効果。川越・庄内・長岡の転封は反対一揆で撤回","why":"物価引下げと商品流通の直接統制を目指したが混乱を招いた"},{"y":"1841","t":"高島秋帆の西洋砲術訓練","s":"長崎から高島秋帆を招き、江戸郊外の徳丸ヶ原で訓練を実施","why":"アヘン戦争の勃発が背景"},{"y":"1842","t":"天保の薪水給与令","s":"アヘン戦争の結果を受け異国船打払令を撤回。同年、家慶の67年ぶりの日光社参","why":"対外政策を緩和して衝突を避けるため"},{"y":"1843","t":"人返しの法・上知令・棄捐令","s":"人返しの法で流入貧民を帰村させ、上知令で江戸・大坂周辺約50万石の幕領編入を計画","why":"農村復興と幕府権力・年貢収入・対外防備の強化を意図した"},{"y":"1843","t":"天保の改革の失敗","s":"上知令が譜代大名・旗本の反対で撤回され、水野忠邦は失脚。幕府は決定的に衰退","why":"過度の強引さ・厳しさに世人の不満が爆発した"},{"y":"1845","t":"阿部正弘が老中首座に","s":"復帰していた水野忠邦が再度罷免され、福山藩主阿部正弘が後任となる","why":""}],"story":"大御所家斉の死後、12代将軍家慶のもとで老中首座の浜松藩主【水野忠邦】が【天保の改革】（1841〜43年）を強引に推進した。享保・寛政の改革を手本に倹約令・風俗取締りを行い、関東農村の荒廃に対し【人返しの法】で帰村を強制したが、追われた無宿人で治安が悪化した。物価引下げのため【株仲間解散令】を出したが逆効果で流通は混乱した。【アヘン戦争】での清の敗北を受け→異国船打払令を撤回して【天保の薪水給与令】を出し、高島秋帆に西洋砲術を訓練させた。さらに幕府権力・年貢・対外防備の強化のため江戸・大坂周辺約50万石を幕領化する【上知令】を出したが、譜代大名・旗本の反対で撤回されたため→忠邦は失脚し、幕府は決定的に衰退した。忠邦が譜代大名にすぎなかったことも弱点だった。一方、西南雄藩では中・下級藩士を登用した改革が進み、薩摩の【調所広郷】、長州の【村田清風】、肥前の【鍋島直正】が財政再建と軍事改革を成功させ、幕末に雄藩となる基盤を築いた。","keywords":["水野忠邦","鳥居耀蔵","人返しの法","株仲間解散令","天保の薪水給与令","高島秋帆","三方領知替え","上知令","調所広郷","村田清風","越荷方","鍋島直正","徳川斉昭","阿部正弘","反射炉"],"blanks":[{"q":"1841〜43年、老中首座の浜松藩主【　】が天保の改革を推進した。","a":"水野忠邦","h":"譜代大名だったことが弱点"},{"q":"天保の改革の風俗取締りは町奉行【　】が中心となって推進した。","a":"鳥居耀蔵","h":"寄席の大量取り潰しなど"},{"q":"1843年の【　】は江戸の人別改めを強化し、流入貧民の帰村を半強制した。","a":"人返しの法","h":"無宿人により治安が悪化して失敗"},{"q":"1841年の【　】は物価引下げを目指したが逆効果で、10年後に撤回された。","a":"株仲間解散令","h":"1851年に阿部正弘が再興令"},{"q":"アヘン戦争の結果を受け、幕府は1842年に異国船打払令を撤回し【　】を発布した。","a":"天保の薪水給与令","h":"対外政策の緩和"},{"q":"幕府は長崎から【　】を招き、江戸郊外の徳丸ヶ原で西洋砲術の訓練を実施した。","a":"高島秋帆","h":"アヘン戦争勃発が背景"},{"q":"川越藩→庄内藩→長岡藩→川越藩の転封計画を【　】といい、庄内藩の反対一揆などで撤回された。","a":"三方領知替え","h":"川越藩の財政難救済が目的"},{"q":"1843年の【　】は江戸・大坂周辺約50万石の幕領編入計画だったが、譜代大名・旗本の反対で撤回された。","a":"上知令","h":"水野忠邦失脚の直接の原因"},{"q":"薩摩藩では島津重豪が下級藩士の【　】を登用し、借財の棚上げや黒砂糖専売の強化を行った。","a":"調所広郷","h":"琉球を通じた密貿易を咎められ切腹"},{"q":"長州藩主毛利敬親は防長大一揆を契機に【　】を登用し、越荷方の強化などを行った。","a":"村田清風","h":"紙・蠟の専売制を改革"},{"q":"肥前藩主【　】〔閑叟〕は均田制を実施し、日本初の反射炉を備えた大砲製造所を建設した。","a":"鍋島直正","h":"有田焼・石炭の専売を強化"},{"q":"1845年、水野忠邦が再度罷免され、福山藩主【　】が老中首座となった。","a":"阿部正弘","h":"韮山反射炉の建設を命じた"}],"mc":[{"q":"天保の改革を主導した水野忠邦が三大改革の主導者のうちで不利だった点として正しいものはどれか。","c":["外様大名であったこと","将軍でも親藩でもない譜代大名であったこと","側用人出身であったこと","旗本であったこと"],"a":1,"e":"吉宗は将軍、定信は将軍の孫だったが、忠邦は譜代大名の老中にすぎず立場が軽かった。"},{"q":"人返しの法が失敗した理由として正しいものはどれか。","c":["株仲間が反対したため","農民が江戸への出稼ぎを増やしたため","江戸を追われた無宿人らにより治安が悪化したため","アヘン戦争が起こったため"],"a":2,"e":"流入貧民を強制的に帰村させたが、追われた無宿人によりかえって治安が悪化した。"},{"q":"株仲間解散令の結果として正しいものはどれか。","c":["逆効果となり流通が混乱した","物価が下がり流通が安定した","在郷商人が没落した","大坂市場が復活した"],"a":0,"e":"物価引下げと流通の直接統制を目指したが逆効果で混乱を招き、10年後に撤回された。"},{"q":"天保の薪水給与令が出された背景として正しいものはどれか。","c":["モリソン号事件でアメリカ船を撃退したため","ペリーが来航したため","ロシア船が根室に来航したため","アヘン戦争で清がイギリスに敗れたため"],"a":3,"e":"アヘン戦争（1840〜42年）の結果を受け、異国船打払令を撤回して対外政策を緩和した。"},{"q":"上知令の意図として正しくないものはどれか。","c":["幕府権力の強化","年貢収入の増加","対外防備の強化","諸藩の借財整理"],"a":3,"e":"江戸・大坂周辺約50万石の幕領編入で幕府権力・年貢収入・対外防備の強化を意図したが、譜代大名・旗本の反対で撤回。"},{"q":"江戸後期の藩政改革の特色として正しいものはどれか。","c":["上級藩士のみを重用した","中・下級藩士の有能者を登用し、専売制や藩営工業を実施した","商業資本と完全に絶縁した","幕府の指示で一斉に行われた"],"a":1,"e":"中・下級藩士の登用、借財整理と国産品奨励・専売制、領民抵抗の圧伏と軍事力強化が共通の特色。"},{"q":"長州藩の越荷方の説明として正しいものはどれか。","c":["黒砂糖の専売を行う機関","均田制を実施する機関","下関で北前船の積荷を対象に委託販売・貸倉庫・金融を行い収益をあげた","反射炉を建設する機関"],"a":2,"e":"本来上方に運ばれる越荷を対象に収益をあげ、洋式軍艦の購入費にもあてた。"},{"q":"水戸藩の藩政改革が挫折した理由として正しいものはどれか。","c":["保守派の反対など","藩主が切腹したため","幕府が上知令を出したため","外様大名だったため"],"a":0,"e":"徳川斉昭が藤田東湖・会沢安らを登用して改革を進めたが、保守派の反対などで挫折した。"}],"order":[{"title":"天保の改革の政策","items":["株仲間解散令","天保の薪水給与令","人返しの法","上知令の撤回"],"e":"1841年株仲間解散令→1842年薪水給与令→1843年人返しの法→同年上知令が反対で撤回され忠邦失脚。"},{"title":"幕政担当者の推移","items":["松平定信","水野忠成","水野忠邦","阿部正弘"],"e":"寛政の改革の定信→文政年間の忠成→天保の改革の忠邦→1845年に阿部正弘が老中首座。"},{"title":"西南雄藩の改革の開始","items":["調所広郷の登用（薩摩）","防長大一揆（長州）","村田清風の登用（長州）","肥前藩の大砲製造所建設"],"e":"1827年調所登用→1831年防長大一揆→それを契機に村田清風登用→1850年肥前藩が反射炉を備えた大砲製造所を建設。"}]},{"title":"化政文化","flow":[{"y":"1811","t":"蛮書和解御用の設置","s":"天文方高橋景保の建議で幕府の洋学研究機関を設置","why":"洋書翻訳の必要から"},{"y":"","t":"化政文学の隆盛","s":"十返舎一九『東海道中膝栗毛』、式亭三馬『浮世風呂』（滑稽本）、曲亭馬琴『南総里見八犬伝』（読本）","why":"江戸の幅広い階層の都市民が担い手となった"},{"y":"","t":"錦絵の風景画の流行","s":"葛飾北斎『富嶽三十六景』、歌川広重『東海道五十三次』","why":"開国後、フランス印象派のジャポニズムに影響"},{"y":"1821","t":"『大日本沿海輿地全図』完成","s":"伊能忠敬らによる実測地図（伊能図）","why":""},{"y":"1828","t":"シーボルト事件","s":"オランダ商館のドイツ人医師シーボルトは国外追放、天文方高橋景保は獄死","why":"幕府は思想に関わらない実学分野のみ洋学を認める傾向"},{"y":"1837","t":"モリソン号事件","s":"蛮社の獄の契機となる","why":""},{"y":"1839","t":"蛮社の獄","s":"尚歯会の蘭学者を弾圧。『慎機論』の渡辺崋山、『戊戌夢物語』の高野長英を処罰","why":"モリソン号事件を契機とする幕政批判を理由とした"},{"y":"","t":"平田篤胤の復古神道","s":"本居宣長の没後門人を自称。篤胤の没後に全国に広まる","why":"幕末の尊王攘夷運動に多大な影響を与えた"},{"y":"","t":"民衆宗教の発生","s":"文化期の黒住教、天保期の天理教、安政期の金光教","why":"明治期には教派神道となる"},{"y":"1841","t":"天保の改革による出版統制","s":"為永春水『春色梅児誉美』（人情本）、柳亭種彦『偐紫田舎源氏』（合巻）を発禁","why":"風俗取締りの一環"}],"story":"19世紀前半の【化政文化】は、上方と並ぶ経済の中心地に成長した江戸の幅広い階層の都市民が担った文化で、「粋」と「通」を重んじ、世相を反映して享楽的・退廃的だが批判的精神に満ちていた。小説では【曲亭馬琴】の読本、【十返舎一九】・式亭三馬の滑稽本が流行し、合巻・【人情本】は天保の改革で弾圧された。美術では【葛飾北斎】『富嶽三十六景』、【歌川広重】『東海道五十三次』の錦絵風景画が流行し、開国後に印象派のジャポニズムに影響を与えた。洋学は発達したが、幕府は実学分野のみ認める傾向だったため→1828年の【シーボルト事件】、1839年の【蛮社の獄】で渡辺崋山・高野長英を処罰した。国学では【平田篤胤】が復古神道を唱え、後期水戸学とともに幕末の尊王攘夷運動に影響を与えた。商品貨幣経済と交通の発達を背景に各地の文化交流が進み、御蔭参りなど寺社参詣が流行し、黒住教・【天理教】・金光教の民衆宗教も生まれた。","keywords":["化政文化","人情本","南総里見八犬伝","東海道中膝栗毛","北越雪譜","小林一茶","富嶽三十六景","東海道五十三次","渡辺崋山","伊能忠敬","シーボルト事件","蛮社の獄","高野長英","平田篤胤","適塾"],"blanks":[{"q":"19世紀前半、江戸の幅広い階層の都市民が担った文化を【　】文化という。","a":"化政","h":"文化・文政時代"},{"q":"恋愛を主題とした絵入り小説を【　】といい、為永春水『春色梅児誉美』が天保の改革で弾圧された。","a":"人情本","h":"合巻とともに弾圧"},{"q":"曲亭〔滝沢〕馬琴は勧善懲悪を主題とした読本『【　】』『椿説弓張月』を著した。","a":"南総里見八犬伝","h":"後期読本の代表"},{"q":"十返舎一九の滑稽本『【　】』は笑いを基調とする絵入り小説である。","a":"東海道中膝栗毛","h":"式亭三馬の『浮世風呂』と並ぶ"},{"q":"『浮世風呂』『浮世床』を著した滑稽本の作者は【　】である。","a":"式亭三馬","h":"十返舎一九と並ぶ"},{"q":"鈴木牧之の随筆『【　】』は越後国の雪国の自然や生活を紹介し、江戸で話題となった。","a":"北越雪譜","h":"越後国"},{"q":"『おらが春』を著し、信濃国と江戸を往来した俳人は【　】である。","a":"小林一茶","h":"俳諧"},{"q":"『富嶽三十六景』を描いた浮世絵師は【　】である。","a":"葛飾北斎","h":"広重とともに印象派に影響"},{"q":"谷文晁の弟子【　】は『鷹見泉石像』『一掃百態』を描き、蛮社の獄で処罰された。","a":"渡辺崋山","h":"『慎機論』の著者"},{"q":"1828年、日本地図の持ち出しを図った【　】は国外追放となり、高橋景保は獄死した。","a":"シーボルト","h":"オランダ商館のドイツ人医師。鳴滝塾を開いた"},{"q":"1839年の蛮社の獄では、『戊戌夢物語』の【　】が処罰された。","a":"高野長英","h":"渡辺崋山とともに尚歯会の蘭学者"},{"q":"本居宣長の没後門人を自称した【　】は復古神道を提唱し、幕末の尊王攘夷運動に影響を与えた。","a":"平田篤胤","h":"国学"},{"q":"緒方洪庵が大坂に開いた私塾を【　】〔適々斎塾〕という。","a":"適塾","h":"医学・洋学塾"},{"q":"天保期に大和国の中山みきが開いた民衆宗教は【　】である。","a":"天理教","h":"黒住教・金光教とともに明治期に教派神道となる"}],"mc":[{"q":"化政文化の特色として正しいものはどれか。","c":["上方の町人が担う明るく現実的な文化","武士のみが担う復古的な文化","江戸の幅広い階層の都市民が担う享楽的で批判精神に満ちた文化","京都の公家が担う古典文化"],"a":2,"e":"江戸を中心に、幕藩体制の動揺を直視した風刺・皮肉を含む多種多様な文化。"},{"q":"天保の改革で弾圧された作品の組合せとして正しいものはどれか。","c":["『仕懸文庫』と『鸚鵡返文武二道』","『春色梅児誉美』と『偐紫田舎源氏』","『東海道中膝栗毛』と『浮世風呂』","『南総里見八犬伝』と『椿説弓張月』"],"a":1,"e":"為永春水の人情本と柳亭種彦の合巻が発禁処分。①は寛政の改革で弾圧された。"},{"q":"北斎・広重の錦絵が影響を与えた対象として正しいものはどれか。","c":["中国の南画","朝鮮の陶磁器","オランダの解剖学","フランス印象派のジャポニズム"],"a":3,"e":"開国後、モネ・ゴッホなどフランス印象派のジャポニズムに多大な影響を与えた。"},{"q":"蛮社の獄の契機となった出来事として正しいものはどれか。","c":["シーボルト事件","モリソン号事件","大塩の乱","アヘン戦争"],"a":1,"e":"モリソン号事件（1837年）を契機とする幕政批判を理由に、1839年に尚歯会の蘭学者が弾圧された。"},{"q":"シーボルト事件と蛮社の獄から読み取れる幕府の洋学統制の傾向として正しいものはどれか。","c":["思想に関わらない実学的分野のみ洋学を認めた","洋学を全面的に禁止した","洋学者を積極的に幕府に登用した","国学のみを弾圧した"],"a":0,"e":"医学・地理学などの実学は認めたが、幕政批判につながる思想面は弾圧した。"},{"q":"平田篤胤の復古神道が幕末に与えた影響として正しいものはどれか。","c":["開国論を広めた","尊王攘夷運動に多大な影響を与えた","キリスト教の受容を促した","洋学の普及を促した"],"a":1,"e":"篤胤の没後、復古神道は全国に広まり、幕末の尊王攘夷運動に影響を与えた。"},{"q":"各地の文化交流を支えた背景として正しいものはどれか。","c":["幕府の参勤交代の廃止","キリスト教の解禁","藩校の廃止","商品貨幣経済と交通の発達"],"a":3,"e":"商品貨幣経済の発達と交通の発達により、都市と農村、三都と地方の文化的交流が盛んになった。"},{"q":"私塾と設立者の組合せとして正しいものはどれか。","c":["咸宜園―緒方洪庵","鳴滝塾―広瀬淡窓","適塾―緒方洪庵","松下村塾―シーボルト"],"a":2,"e":"咸宜園は広瀬淡窓（豊後国日田）、鳴滝塾はシーボルト（長崎）、松下村塾は吉田松陰の叔父（萩）。"}],"order":[{"title":"洋学統制の流れ","items":["蛮書和解御用の設置","シーボルト事件","モリソン号事件","蛮社の獄"],"e":"1811年蛮書和解御用→1828年シーボルト事件→1837年モリソン号事件→1839年蛮社の獄。"},{"title":"民衆宗教の発生","items":["黒住教","天理教","金光教"],"e":"文化期の黒住教（黒住宗忠）→天保期の天理教（中山みき）→安政期の金光教（川手文治郎）。"},{"title":"国学の系譜","items":["本居宣長","平田篤胤","復古神道の全国普及","幕末の尊王攘夷運動"],"e":"宣長→没後門人を自称した篤胤が復古神道を提唱→篤胤の没後に全国へ→尊王攘夷運動に影響。"}]}],"review":[{"q":"天保の飢饉から大塩の乱、天保の改革へと至る流れの説明として正しいものはどれか。","c":["飢饉への幕府の無為無策が大塩の乱を招き、幕府権威の失墜後に家斉の死を経て水野忠邦が改革に着手した","大塩の乱を鎮圧した水野忠邦がその功績で老中となり寛政の改革を行った","天保の改革の失敗が天保の飢饉を引き起こし大塩の乱に至った","大塩の乱の後、家斉が将軍に就任して大御所政治を始めた"],"a":0,"e":"1833年〜飢饉→1837年大塩の乱→1841年家斉の死後に忠邦が天保の改革を開始という流れ。"},{"q":"大御所政治期の文政年間と天保の改革の経済政策の対比として正しいものはどれか。","c":["文政年間は株仲間解散、天保の改革は文政小判の大量発行","文政年間は品位の劣る貨幣を乱発して物価が上昇し、天保の改革は物価引下げのため株仲間を解散した","両期とも倹約令を出さなかった","文政年間は上知令、天保の改革は寄場組合"],"a":1,"e":"水野忠成の文政小判乱発が物価上昇を招き、忠邦は株仲間解散令で物価引下げを図ったが失敗した。"},{"q":"関東農村の荒廃に対する幕府の対応の流れとして正しいものはどれか。","c":["人返しの法→関東取締出役→寄場組合","寄場組合→関東取締出役→人返しの法","人返しの法→寄場組合→関東取締出役","関東取締出役→寄場組合→人返しの法"],"a":3,"e":"1805年関東取締出役→1827年寄場組合（大御所政治期）→1843年人返しの法（天保の改革）。"},{"q":"アヘン戦争が幕府の政策に与えた影響として正しいものはどれか。","c":["異国船打払令を強化した","蛮社の獄で蘭学者を処罰した","異国船打払令を撤回して薪水給与令を出し、西洋砲術を採用した","モリソン号を撃退した"],"a":2,"e":"清の敗北を受け、1842年に天保の薪水給与令を出し、高島秋帆に西洋砲術を訓練させた。"},{"q":"天保の改革の失敗と西南雄藩の改革の成功を分けた要因の説明として正しいものはどれか。","c":["幕府は上知令などが譜代大名・旗本の反対で撤回されたが、雄藩は中・下級藩士を登用し専売制や軍事改革で成果をあげた","幕府は外様大名の協力を得たが、雄藩は保守派に抵抗された","幕府は西洋砲術を拒否したが、雄藩は洋学を全面禁止した","幕府は株仲間を奨励したが、雄藩は株仲間を解散した"],"a":0,"e":"忠邦は譜代大名で立場が弱く強引な改革に不満が爆発。薩長土肥は人材登用と財政・軍事改革で幕末に雄藩となった。"},{"q":"化政文化と大御所政治の関係として正しいものはどれか。","c":["寛政の改革の厳しい統制下で開花した","社会不安が増大する中で江戸を中心に享楽的・退廃的な文化として開花した","天保の改革で奨励されて発展した","大坂を中心に武士が担った"],"a":1,"e":"文化・文政時代、内憂と外患で社会不安が増す中、江戸の都市民が担う化政文化が開花し、後に天保の改革で弾圧された。"}]},{"id":15,"title":"開国と江戸幕府の滅亡","era":"江戸時代末期（幕末）","span":"1792〜1867","oneLine":"列強の接近で開国した幕府は、不平等条約と物価高で権威を失い、薩長に倒された","chain":["阿部正弘","堀田正睦","井伊直弼","安藤信正","島津久光","一橋慶喜","徳川慶喜"],"parts":[{"title":"列強の接近と開国","flow":[{"y":"1792","t":"ラクスマン来航","s":"ロシア使節ラクスマンが根室に来航し通商を要求。幕府は拒否したが長崎入港許可証を与えた","why":"漂流民大黒屋光太夫の送還と通商を求めるロシア（エカチェリーナ2世）の南下"},{"y":"1804","t":"レザノフ来航","s":"ロシアの露米会社支配人レザノフが長崎に来航し通商を要求、幕府は拒否","why":"ラクスマンに与えた長崎入港許可証をもとに通商を求めた"},{"y":"1808","t":"フェートン号事件・間宮林蔵の探検","s":"イギリス軍艦が長崎湾に侵入し、長崎奉行松平康英が切腹。同年、間宮林蔵が樺太を探検し離島と発見","why":"イギリス船の接近と北方の国境問題への対応"},{"y":"1811","t":"ゴローウニン事件","s":"国後島でロシア軍艦艦長ゴローウニンを捕縛。報復で捕まった高田屋嘉兵衛の尽力で和解（〜13年）","why":"レザノフ来航以来のロシアとの緊張"},{"y":"1825","t":"異国船打払令","s":"清・朝鮮・琉球船以外は打ち払う（無二念打払令）","why":"フェートン号事件などイギリス船の接近が相次いだため"},{"y":"1837","t":"モリソン号事件","s":"漂流民送還と通商を求めたアメリカ商船を浦賀・山川で撃退","why":"異国船打払令の実行"},{"y":"1842","t":"天保の薪水給与令","s":"アヘン戦争で清がイギリスに敗れたため、異国船打払令を撤回し漂着船に薪水・食糧を与える","why":"イギリスとの衝突を避けるため"},{"y":"1853","t":"ペリー来航","s":"アメリカ東インド艦隊司令長官ペリーが浦賀に来航し、フィルモア大統領の国書を提出。プチャーチンも長崎に来航","why":"アメリカは対清貿易船・捕鯨船の寄港地として日本の開国を切望"},{"y":"1854","t":"日米和親条約","s":"老中首座阿部正弘のもと、下田・箱館開港、片務的最恵国待遇などを認める。日露和親条約で択捉島以南を日本領、樺太は雑居地に","why":"ペリーが7隻で再来航し回答を迫ったため"},{"y":"1858","t":"日米修好通商条約","s":"大老井伊直弼が無勅許で調印。神奈川・長崎・兵庫・新潟の開港、協定関税、領事裁判権を認める。安政の五か国条約へ","why":"ハリスがアロー戦争の天津条約を引き合いに英仏の脅威を説き調印を迫った"}],"story":"【1792年】にロシア使節【ラクスマン】が根室に来航して通商を求め、以後【レザノフ】の長崎来航、【ゴローウニン事件】とロシアとの緊張が続いたため、幕府は蝦夷地を直轄し【間宮林蔵】らに北方を探査させた。イギリス船も接近し【フェートン号事件】が起きたため、幕府は【1825年】に【異国船打払令】を出し、【モリソン号事件】でアメリカ船を撃退した。しかし【アヘン戦争】で清が敗れると、衝突を恐れた幕府は【天保の薪水給与令】で打払令を撤回した。【1853年】、捕鯨船などの寄港地を求めるアメリカの【ペリー】が浦賀に来航し、翌年老中首座【阿部正弘】は【日米和親条約】で下田・箱館を開港、鎖国は崩れた。【日露和親条約】では択捉島以南を日本領とし北方国境が画定した。さらに総領事【ハリス】が通商を迫ると、老中首座【堀田正睦】は勅許を得られず失脚、大老【井伊直弼】が【1858年】に無勅許で【日米修好通商条約】に調印した。領事裁判権・協定関税を認める不平等条約で、のちの明治政府が改正に苦しむことになる。","keywords":["ラクスマン","レザノフ","間宮林蔵","ゴローウニン事件","フェートン号事件","異国船打払令","モリソン号事件","アヘン戦争","天保の薪水給与令","ペリー","日米和親条約","日露和親条約","ハリス","日米修好通商条約","安政の五か国条約"],"blanks":[{"q":"1792年、ロシア使節【　】が根室に来航し通商を要求した。","a":"ラクスマン","h":"エカチェリーナ2世の使節。漂流民大黒屋光太夫を送還した"},{"q":"1804年、ロシアの露米会社支配人【　】が長崎に来航し通商を要求した。","a":"レザノフ","h":"ラクスマンに与えられた長崎入港許可証を持って来航"},{"q":"1808年、【　】が樺太とその対岸を探検し、翌年に離島であることを発見した。","a":"間宮林蔵","h":"のちシーボルトが「間宮海峡」として世界に紹介"},{"q":"ゴローウニン事件では、報復のため捕縛された【　】の尽力で双方の交換が成立し和解した。","a":"高田屋嘉兵衛","h":"北前船商人"},{"q":"1808年、イギリス軍艦が長崎湾に侵入しオランダ商館員を人質にした【　】事件が起きた。","a":"フェートン号","h":"長崎奉行松平康英は自ら切腹した"},{"q":"1825年、幕府は【　】を出し、清・朝鮮・琉球船以外を打ち払うことにした。","a":"異国船打払令","h":"無二念打払令ともいう"},{"q":"1837年、漂流民送還・通商要求のアメリカ商船を浦賀・山川で撃退した【　】事件が起きた。","a":"モリソン号","h":"この事件への幕府批判が蛮社の獄につながる"},{"q":"1840年から【　】でイギリスが清を破り、南京条約が結ばれた。","a":"アヘン戦争","h":"香港島の割譲、上海など5港の開港"},{"q":"1853年、アメリカ東インド艦隊司令長官【　】が浦賀に来航し開国を要求した。","a":"ペリー","h":"黒船4隻。フィルモア大統領の国書を提出"},{"q":"1854年、老中首座【　】のもとで日米和親条約が締結された。","a":"阿部正弘","h":"福山藩主"},{"q":"日露和親条約では択捉島以南を日本領とし、【　】は両国人雑居の地とされた。","a":"樺太","h":"国境を定めなかった"},{"q":"1858年、大老【　】が無勅許のまま日米修好通商条約に調印した。","a":"井伊直弼","h":"彦根藩主、南紀派"}],"mc":[{"q":"1842年に幕府が天保の薪水給与令を出した背景として正しいものはどれか。","c":["ペリーが浦賀に来航したため","アヘン戦争で清がイギリスに敗れたため","ゴローウニン事件で和解が成立したため","オランダ国王が開国を勧告したため"],"a":1,"e":"アヘン戦争（1840〜42年）で清が敗れたことに衝撃を受け、異国船打払令を撤回して薪水給与令を出した。"},{"q":"アメリカが日本の開国を強く求めた理由として正しいものはどれか。","c":["対清貿易船・捕鯨船の寄港地とするため","蝦夷地の領有をめぐりロシアと対抗するため","キリスト教の布教を認めさせるため","日本の生糸を独占的に輸入するため"],"a":0,"e":"アメリカは対清貿易船や捕鯨船の寄港地として日本の開国を切望していた。"},{"q":"日露和親条約の内容として正しいものはどれか。","c":["択捉島以北をロシア領、得撫島以南を日本領とした","樺太を日本領とした","択捉島以南を日本領、得撫島以北をロシア領とし、樺太は雑居地とした","下田・箱館のみを開港した"],"a":2,"e":"国境は択捉島と得撫島の間に引かれ、樺太は両国人雑居の地とされた。開港は下田・箱館・長崎。"},{"q":"日米和親条約と日米修好通商条約の両方に共通する不平等の内容はどれか。","c":["領事裁判権の承認","関税自主権の欠如","片務的最恵国待遇","いずれも不平等条項はない"],"a":3,"e":"片務的最恵国待遇は和親条約、領事裁判権・協定関税は通商条約の内容で、両方に共通する条項ではない。"},{"q":"堀田正睦が条約勅許を得られなかった結果として正しいものはどれか。","c":["井伊直弼が大老に就任し無勅許で条約に調印した","ハリスが下田から退去した","幕府は通商条約の締結を断念した","阿部正弘が老中首座に復帰した"],"a":0,"e":"孝明天皇や一橋派の反対で勅許が得られず堀田は失脚、南紀派の井伊直弼が大老となり違勅調印した。"},{"q":"ハリスが幕府に条約調印を迫る際に引き合いに出した出来事はどれか。","c":["アヘン戦争の南京条約","アロー戦争の天津条約","アメリカの南北戦争","ゴローウニン事件"],"a":1,"e":"アロー戦争（第二次アヘン戦争）の天津条約を引き合いに、イギリス・フランスの脅威を説いた。"},{"q":"日米修好通商条約の批准のためポーハタン号で渡米した際、随行した勝海舟艦長の船はどれか。","c":["フェートン号","モリソン号","咸臨丸","ポサドニック号"],"a":2,"e":"咸臨丸が随行し、日本人の手による太平洋横断に初めて成功した。"},{"q":"幕府が1799年に東蝦夷地を直轄した背景として最も適当なものはどれか。","c":["イギリス船が長崎に侵入したため","ロシア船の接近が相次ぎ北方の防備が必要になったため","アヘン戦争で清が敗れたため","アメリカが通商を要求したため"],"a":1,"e":"ラクスマン来航以後、ロシアの南下に備えて幕府は蝦夷地の直轄と探査を進めた。"}],"order":[{"title":"列強の接近","items":["ラクスマン来航","レザノフ来航","フェートン号事件","ゴローウニン事件","異国船打払令"],"e":"1792年ラクスマン→1804年レザノフ→1808年フェートン号事件→1811年ゴローウニン事件→1825年打払令。"},{"title":"打払いから開国へ","items":["モリソン号事件","アヘン戦争","天保の薪水給与令","ペリー来航","日米和親条約"],"e":"1837年モリソン号事件→1840年アヘン戦争→1842年薪水給与令→1853年ペリー来航→1854年和親条約。"},{"title":"条約締結の流れ","items":["日米和親条約","ハリス着任","堀田正睦の上洛","井伊直弼の大老就任","日米修好通商条約"],"e":"1854年和親条約→1856年ハリス着任→1858年堀田上洛（勅許失敗）→井伊が大老就任→無勅許で通商条約調印。"}]},{"title":"開国の影響と江戸幕府の動揺","flow":[{"y":"1853","t":"安政の改革","s":"阿部正弘がペリー来航を朝廷に報告し諸大名・幕臣に諮問。徳川斉昭・島津斉彬らが幕政に参与し、品川台場築造・大船建造の禁の解除","why":"挙国一致で対外危機に対応するため"},{"y":"1855","t":"海軍伝習所・蕃書調所","s":"長崎に海軍伝習所（勝海舟・榎本武揚）、翌年洋学所を蕃書調所と改称、講武所設置","why":"国防の強化と洋学の研究"},{"y":"1858","t":"井伊直弼の大老就任と違勅調印","s":"南紀派の井伊が大老となり無勅許で通商条約に調印、14代将軍に徳川家茂を擁立","why":"将軍継嗣問題で一橋派と対立し、幕府独裁体制の復活をめざした"},{"y":"1858","t":"安政の大獄","s":"一橋派の大名を隠居・謹慎させ、吉田松陰・橋本左内・頼三樹三郎らを処刑（〜59年）","why":"戊午の密勅に激怒した井伊が反井伊派を弾圧"},{"y":"1859","t":"居留地貿易の開始","s":"横浜・長崎・箱館で貿易開始。生糸が輸出の約8割、相手国はイギリス中心","why":"通商条約の発効"},{"y":"1860","t":"五品江戸廻送令・万延小判","s":"雑穀・水油・蠟・呉服・生糸は江戸問屋経由とする。金流出を防ぐため万延小判を鋳造","why":"在郷商人の台頭による流通混乱と、金銀比価の差による金貨流出"},{"y":"1860","t":"桜田門外の変","s":"尊攘派の水戸浪士らが大老井伊直弼を殺害。幕府の権威は失墜","why":"違勅調印・将軍継嗣問題・安政の大獄への憤激"},{"y":"1861","t":"和宮降嫁の決定","s":"老中安藤信正・久世広周の公武合体策で孝明天皇の妹和宮の家茂への降嫁が決定","why":"朝廷と幕府の融和により幕藩体制を再建・強化するため"},{"y":"1862","t":"坂下門外の変","s":"和宮降嫁に憤激した尊攘派が安藤信正を襲撃。安藤は失脚し幕府主導の公武合体は挫折","why":"和宮降嫁への反発"},{"y":"1862","t":"文久の改革","s":"島津久光が勅使大原重徳を奉じて江戸へ下り、将軍後見職に一橋慶喜、政事総裁職に松平慶永、京都守護職に松平容保を任命。帰途に生麦事件","why":"雄藩主導で公武合体を進めるため"}],"story":"ペリー来航後、老中首座【阿部正弘】は朝廷に報告し諸大名にも諮問したため、朝廷の権威が高まり【徳川斉昭】・【島津斉彬】ら親藩・外様が幕政に参与した（【安政の改革】）。【1859年】に【横浜】などで貿易が始まると【生糸】の輸出が急増し、輸出超過による物資不足と、金銀比価の差による金貨流出を防ぐための【万延小判】鋳造が原因で物価が急上昇した。庶民は困窮し、外国人排斥の【攘夷運動】が激化した。幕府内では将軍継嗣問題で【井伊直弼】らの南紀派と【一橋慶喜】を推す一橋派が対立し、大老となった井伊は無勅許で通商条約に調印、【安政の大獄】で【吉田松陰】・【橋本左内】らを処刑した。その反発から【1860年】に【桜田門外の変】で井伊が殺害され、幕府の権威は失墜した。老中【安藤信正】は【和宮】降嫁で公武合体を図ったが【坂下門外の変】で失脚し、代わって薩摩の【島津久光】が【文久の改革】を主導、【松平容保】を京都守護職に据えた。","keywords":["安政の改革","徳川斉昭","島津斉彬","居留地貿易","生糸","五品江戸廻送令","万延小判","攘夷運動","南紀派","一橋派","安政の大獄","桜田門外の変","公武合体","和宮","文久の改革"],"blanks":[{"q":"安政の改革で幕政に参与した前水戸藩主は【　】である。","a":"徳川斉昭","h":"一橋慶喜の父。戊戌封事で海防強化を説いた"},{"q":"安政の改革で幕政に参与した薩摩藩主は【　】である。","a":"島津斉彬","h":"一橋派の中心人物の一人"},{"q":"1859年に居留地貿易が始まり、【　】が貿易額全体の8割以上を占めた。","a":"横浜","h":"他の貿易港は長崎・箱館"},{"q":"開港後の輸出品では【　】が全体の約8割を占めた。","a":"生糸","h":"八王子〜横浜の直通ルートが開かれた"},{"q":"1860年、幕府は雑穀・水油・蠟・呉服・生糸を江戸の問屋経由で輸出させる【　】を出した。","a":"五品江戸廻送令","h":"在郷商人の台頭による流通混乱への対応"},{"q":"1860年、金貨の流出を防ぐため質・量ともに劣る【　】が鋳造されたが、物価上昇に拍車をかけた。","a":"万延小判","h":"万延貨幣改鋳"},{"q":"将軍継嗣問題で南紀派は徳川慶福を、一橋派は【　】を推挙した。","a":"一橋慶喜","h":"前水戸藩主徳川斉昭の子"},{"q":"1858年、井伊直弼は【　】に就任し、無勅許のまま日米修好通商条約に調印した。","a":"大老","h":"彦根藩主"},{"q":"安政の大獄で処刑された長州藩士は【　】である。","a":"吉田松陰","h":"橋本左内（越前藩士）・頼三樹三郎も処刑"},{"q":"1860年、尊攘派の水戸浪士らが大老井伊直弼を殺害した事件を【　】という。","a":"桜田門外の変","h":"幕府の権威は失墜し専制的な政治は崩壊"},{"q":"1861年、孝明天皇の妹【　】の14代家茂への降嫁が決定した。","a":"和宮","h":"老中安藤信正らの公武合体策"},{"q":"文久の改革で京都守護職に就任した会津藩主は【　】である。","a":"松平容保","h":"配下に新選組"}],"mc":[{"q":"安政の改革の結果として正しいものはどれか。","c":["幕府の独裁体制が強化された","朝廷の権威が高まり、親藩・外様にも発言の機会が生じた","参勤交代が廃止された","譜代大名のみが幕政を担うようになった"],"a":1,"e":"阿部正弘が朝廷に報告し諸大名に諮問したため、朝廷の権威が高まり雄藩連合が発生した。"},{"q":"開港後に激しい物価上昇が起きた原因として正しいものはどれか。","c":["輸入超過による国内貨幣の不足","輸出超過による国内物資の不足と万延貨幣改鋳","五品江戸廻送令による輸出の停止","アメリカからの綿織物の大量輸入"],"a":1,"e":"生糸などの輸出超過で物資が不足し、質の劣る万延小判の鋳造が物価上昇に拍車をかけた。"},{"q":"開港後に金貨が大量に流出した原因はどれか。","c":["日本と外国の金銀比価が異なっていたため","幕府が金貨の輸出を奨励したため","外国商人が金貨で生糸を買い付けたため","居留地で金貨の使用が義務づけられたため"],"a":0,"e":"日本は金銀比価1:5、外国は1:15だったため10万両以上が流出し、洋銀が流入した。"},{"q":"貿易開始後の生産構造の変化として正しいものはどれか。","c":["綿織物業が発展し、製糸業が衰退した","生糸・茶の生産力が向上し、綿織物・綿糸業界が衰退した","武器・艦船の国産化が進んだ","毛織物の輸出が急増した"],"a":1,"e":"輸出品の生糸・茶の生産は伸び、輸入品と競合する綿織物・綿糸は衰退した。"},{"q":"南紀派と一橋派の対立について正しいものはどれか。","c":["南紀派は親藩・外様、一橋派は譜代・旗本が中心だった","南紀派は一橋慶喜、一橋派は徳川慶福を推した","南紀派は譜代・旗本が中心で、血統重視で徳川慶福を推した","堀田正睦は一橋派の中心人物だった"],"a":2,"e":"南紀派は井伊直弼ら譜代・旗本で慶福を推し、一橋派は斉昭・斉彬ら親藩・外様で慶喜を推した。堀田は中間派。"},{"q":"安政の大獄の契機となった出来事はどれか。","c":["桜田門外の変","和宮降嫁","水戸藩への戊午の密勅降下","生麦事件"],"a":2,"e":"孝明天皇が幕府を越えて水戸藩に密勅を下したことに井伊が激怒し、反井伊派を弾圧した。"},{"q":"桜田門外の変の結果として正しいものはどれか。","c":["幕府の権威が失墜し専制的な政治が崩壊した","一橋慶喜が15代将軍に就任した","幕府が攘夷を決行した","安政の大獄が始まった"],"a":0,"e":"大老井伊直弼の殺害は全国に衝撃を与え、幕府・将軍の権威は失墜した。"},{"q":"坂下門外の変の背景と結果として正しいものはどれか。","c":["生麦事件に憤激した志士が島津久光を襲撃し、薩英戦争に発展した","和宮降嫁に憤激した尊攘派が安藤信正を襲撃し、幕府主導の公武合体は挫折した","違勅調印に憤激した水戸浪士が井伊直弼を殺害した","文久の改革に反発した幕臣が松平慶永を襲撃した"],"a":1,"e":"和宮降嫁への反発から老中安藤信正が襲撃されて失脚し、以後は雄藩主導の公武合体（文久の改革）へ移った。"}],"order":[{"title":"井伊直弼の独裁から桜田門外の変まで","items":["堀田正睦の上洛","井伊直弼の大老就任","日米修好通商条約の違勅調印","安政の大獄","桜田門外の変"],"e":"1858年堀田上洛（失敗）→井伊大老就任→違勅調印→安政の大獄（1858〜59）→1860年桜田門外の変。"},{"title":"公武合体運動の展開","items":["桜田門外の変","和宮降嫁の決定","坂下門外の変","文久の改革","生麦事件"],"e":"1860年桜田門外の変→1861年和宮降嫁決定→1862年坂下門外の変→同年文久の改革→帰途に生麦事件。"},{"title":"貿易の開始と影響","items":["日米修好通商条約","居留地貿易の開始","五品江戸廻送令","ヒュースケン暗殺事件","イギリス公使館焼打ち事件"],"e":"1858年通商条約→1859年貿易開始→1860年廻送令・ヒュースケン暗殺→1862年焼打ち事件。"}]},{"title":"江戸幕府の滅亡","flow":[{"y":"1862","t":"長州藩尊攘派の京都制圧","s":"高杉晋作・久坂玄瑞・桂小五郎らが藩論を転換し、三条実美・武市瑞山と結び朝廷を動かす","why":"井伊の違勅調印を契機に尊王論と攘夷論が結びついた"},{"y":"1863","t":"家茂上洛と下関事件","s":"家茂が5月10日の攘夷決行を確約。長州藩が関門海峡で外国船を砲撃。高杉晋作が奇兵隊を組織","why":"勅使三条実美が幕府に攘夷決行を迫った"},{"y":"1863","t":"薩英戦争","s":"生麦事件の報復でイギリス艦隊が鹿児島湾に侵入。薩摩は攘夷の不可能を悟り、イギリスと接近","why":"前年の生麦事件"},{"y":"1863","t":"八月十八日の政変","s":"天皇と公武合体派（幕府・薩摩・会津）が長州藩を御所警備から解任。三条実美らは長州へ（七卿落ち）","why":"過激な攘夷は天皇の本意ではなかった"},{"y":"1864","t":"池田屋事件・禁門の変","s":"新選組が尊攘派志士を襲撃。京都に攻め上った長州藩は幕府方に敗れ朝敵となる","why":"八月十八日の政変後の巻き返し"},{"y":"1864","t":"四国艦隊下関砲撃事件・第1次長州征討","s":"オールコック主導の四国艦隊が下関を砲撃。長州藩は攘夷の不可能を悟り、幕府に恭順","why":"前年5月10日の砲撃への報復と、禁門の変を理由とする征討"},{"y":"1866","t":"薩長同盟","s":"1865年の条約勅許で攘夷論が消滅する中、坂本龍馬・中岡慎太郎の斡旋で西郷隆盛と木戸孝允が密約。パークスは薩長に接近、ロッシュは幕府を支援","why":"両藩とも攘夷を放棄し倒幕へ藩論を転換"},{"y":"1866","t":"第2次長州征討","s":"薩摩不参加の中、長州藩が幕府軍を撃破。家茂が大坂城で急死し中止。徳川慶喜が15代将軍に、孝明天皇も急死","why":"薩長同盟の密約と長州の新式武装"},{"y":"1867","t":"大政奉還","s":"山内豊信の建白で慶喜が二条城で政権を奉還（10月14日）。同日、討幕の密勅は空振り","why":"武力倒幕派の機先を制し支配体制を再構築するため"},{"y":"1867","t":"王政復古の大号令","s":"12月9日、武力倒幕派がクーデタで天皇中心の新政府を樹立。三職を設置し、小御所会議で慶喜の辞官納地を決定","why":"徳川慶喜を排除した雄藩連合政権をつくるため"}],"story":"井伊の違勅調印を契機に尊王論と攘夷論が結びつき、【1862年】に長州藩の【高杉晋作】らが藩論を転換して【三条実美】と結び朝廷を動かした。【1863年】、上洛した家茂は攘夷決行を確約し、長州藩は【下関事件】で外国船を砲撃したが報復を受け、高杉は【奇兵隊】を組織した。薩摩藩も【薩英戦争】で攘夷の不可能を悟った。同年【八月十八日の政変】で長州は京都を追われ、【1864年】の【禁門の変】に敗れて朝敵となり、【四国艦隊下関砲撃事件】と【第1次長州征討】で幕府に恭順した。しかし薩長はイギリス公使【パークス】の接近を受けて倒幕に転じ、【1866年】に【坂本龍馬】の斡旋で【薩長同盟】を結んだ。【第2次長州征討】は長州が幕府軍を破り、家茂の急死で中止された。15代将軍【徳川慶喜】は【1867年】に【大政奉還】で武力倒幕派の機先を制したが、12月9日の【王政復古の大号令】で慶喜を排除した新政府が樹立され、小御所会議で辞官納地が決定された。","keywords":["尊王攘夷論","高杉晋作","奇兵隊","薩英戦争","八月十八日の政変","禁門の変","四国艦隊下関砲撃事件","パークス","ロッシュ","薩長同盟","第2次長州征討","ええじゃないか","大政奉還","王政復古の大号令","小御所会議"],"blanks":[{"q":"1862年、長州藩尊攘派は尊攘派公家【　】や土佐藩の武市瑞山と結び、朝廷を動かした。","a":"三条実美","h":"八月十八日の政変で長州へ逃れる（七卿落ち）"},{"q":"下関事件で藩兵の弱さに失望した高杉晋作は、志願制の【　】など諸隊の組織を決意した。","a":"奇兵隊","h":"庶民も加えた部隊"},{"q":"1863年7月、生麦事件の報復としてイギリス艦隊が鹿児島湾に侵入した【　】が起きた。","a":"薩英戦争","h":"薩摩とイギリス接近の契機"},{"q":"1863年8月、公武合体派が巻き返し、長州藩を御所警備から解任した【　】が起きた。","a":"八月十八日の政変","h":"三条実美らは長州へ逃れた"},{"q":"池田屋事件で尊攘派の志士を襲撃したのは、京都守護職配下の【　】である。","a":"新選組","h":"近藤勇・土方歳三ら"},{"q":"1864年、長州藩は御所内外の戦いで幕府方に敗れ朝敵となった。これを【　】という。","a":"禁門の変","h":"蛤御門の変ともいう"},{"q":"幕府の無力を見抜き薩摩・長州に接近したイギリス公使は【　】である。","a":"パークス","h":"フランス公使ロッシュは幕府支持"},{"q":"1866年、【　】・中岡慎太郎の斡旋で薩長同盟が結ばれた。","a":"坂本龍馬","h":"土佐藩出身。「船中八策」でも知られる"},{"q":"1867年7月から三河国を発端に各地で「【　】」が発生した。","a":"ええじゃないか","h":"世直し一揆や御蔭参りも流行"},{"q":"1867年10月14日、慶喜は二条城で【　】を上表し、政権を朝廷に返した。","a":"大政奉還","h":"前土佐藩主山内豊信が建白"},{"q":"1867年12月9日、武力倒幕派が【　】を発し、天皇中心の新政府を樹立した。","a":"王政復古の大号令","h":"将軍・摂政・関白を廃止し三職を設置"},{"q":"1866年、幕府が結んだ【　】により関税率が一律5%に引き下げられた。","a":"改税約書","h":"翌年から輸入超過へ"}],"mc":[{"q":"薩英戦争の結果として正しいものはどれか。","c":["薩摩藩は攘夷の決行を強めた","薩摩藩は攘夷の不可能を悟り、イギリスとの接近の契機となった","イギリスは幕府への支援を強化した","薩摩藩は長州藩と同盟を結んだ"],"a":1,"e":"双方が被害を受けて講和し、薩摩は軍備近代化の必要を悟った。イギリスも薩摩の実力を評価した。"},{"q":"八月十八日の政変の背景として正しいものはどれか。","c":["長州藩の過激な攘夷が孝明天皇の本意ではなかったため","幕府が攘夷の決行を約束したため","薩摩藩が倒幕に転じたため","イギリス艦隊が兵庫沖で威嚇したため"],"a":0,"e":"天皇と公武合体派（幕府・薩摩・会津）が過激な攘夷派の長州を御所警備から解任した。"},{"q":"禁門の変の結果として正しいものはどれか。","c":["長州藩が京都を制圧した","長州藩は朝敵とされ、第1次長州征討が行われた","幕府は攘夷を決行した","薩摩藩が朝敵とされた"],"a":1,"e":"御所での戦いに敗れた長州藩は朝敵の汚名を着せられ、幕府は禁門の変を理由に征討の勅命を得た。"},{"q":"四国艦隊下関砲撃事件の結果として正しいものはどれか。","c":["長州藩
