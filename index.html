・快慶が金剛力士像","why":"平重衡に焼かれた南都の復興のため"},{"y":"1205","t":"新古今和歌集","s":"後鳥羽上皇の命で藤原定家・家隆らが編纂した八代集最後の勅撰和歌集","why":""},{"y":"","t":"歴史書と学問","s":"慈円『愚管抄』，幕府の公式記録『吾妻鏡』，金沢実時の金沢文庫，朱子学の伝来","why":"公家から武家への政権移行の中で歴史意識が高まったため"}],"story":"社会不安と【末法】の無常観，旧仏教の腐敗に伴う武士・庶民の救済要求を背景に，【易行】・【選択】・【専修】を特色とする鎌倉新仏教が生まれた。念仏の他力本願系では【法然】の浄土宗，悪人正機の【親鸞】の浄土真宗，【踊念仏】の一遍の時宗，坐禅の自力開悟系では【栄西】の臨済宗と【道元】の曹洞宗，題目の【日蓮】の日蓮宗が成立した。旧仏教では律宗の叡尊・【忍性】が社会事業を行った。蒙古襲来後は神国思想の広まりから【度会家行】が反本地垂迹説の【伊勢神道】を体系化した。鎌倉文化は写実的な公武二元文化で，南都復興のため【重源】が大仏様で東大寺南大門を再建し，慶派の【運慶】・快慶が金剛力士像を作った。文芸では【新古今和歌集】や『平家物語』が生まれ，公家から武家への政権移行の中で歴史意識が高まり，慈円の【愚管抄】や幕府の記録【吾妻鏡】が著された。南宋伝来の【朱子学】はのちに後醍醐天皇の討幕運動の支柱となった。","keywords":["易行・選択・専修","法然","選択本願念仏集","親鸞","教行信証","悪人正機","一遍","踊念仏","栄西","興禅護国論","道元","正法眼蔵","日蓮","立正安国論","忍性"],"blanks":[{"q":"浄土宗の開祖【　】は専修念仏を説き，『選択本願念仏集』を著した。","a":"法然","h":"中心寺院は知恩院"},{"q":"浄土真宗の開祖親鸞の著書は『【　】』である。","a":"教行信証","h":"弟子の唯円は『歎異抄』"},{"q":"時宗の開祖一遍は遊行・【　】を教義とし，著書は残っていない。","a":"踊念仏","h":"捨聖とも呼ばれる"},{"q":"臨済宗の開祖栄西は公案問答を教義とし，『【　】』を著した。","a":"興禅護国論","h":"『喫茶養生記』も著した"},{"q":"曹洞宗の開祖【　】は只管打坐を教義とし，『正法眼蔵』を著した。","a":"道元","h":"中心寺院は永平寺"},{"q":"日蓮宗の開祖日蓮は『【　】』を著し，伊豆国のち佐渡国に配流された。","a":"立正安国論","h":"中心寺院は久遠寺"},{"q":"律宗の【　】は奈良に北山十八間戸を建て，ハンセン病患者を救済した。","a":"忍性","h":"のち鎌倉の極楽寺で悲田院を建てた"},{"q":"蒙古襲来後，伊勢神宮外宮の神官【　】が反本地垂迹説を唱え，伊勢神道を体系化した。","a":"度会家行","h":"『神道五部書』『類聚神祇本源』"},{"q":"東大寺南大門は大仏様の建築で，【　】が宋人陳和卿の協力で再建した。","a":"重源","h":"平重衡の南都焼打ち後の復興"},{"q":"1205年，後鳥羽上皇の命で藤原定家・家隆らが編纂した勅撰和歌集は『【　】』である。","a":"新古今和歌集","h":"八代集の最後"},{"q":"慈円が道理による歴史解釈を試みた歴史書は『【　】』である。","a":"愚管抄","h":"後鳥羽上皇を諫めようとした"},{"q":"南宋の朱熹が始めた【　】（宋学）が伝来し，大義名分論は後醍醐天皇の討幕運動の理論的支柱となった。","a":"朱子学","h":"君臣の別を説く"}],"mc":[{"q":"鎌倉新仏教が成立した背景として最も適当なものはどれか。","c":["幕府が旧仏教を弾圧して新仏教を保護したため","宋から朱子学が伝来して仏教が衰退したため","戦乱・飢饉による社会不安と末法の無常観，旧仏教の腐敗に伴う武士・庶民の救済要求があったため","蒙古襲来で神国思想が広まったため"],"a":2,"e":"社会不安と旧仏教の世俗化の中で，武士・庶民に開かれた易行の教えが求められた。"},{"q":"鎌倉仏教6宗派に共通する特色として正しい組合せはどれか。","c":["易行・加持・祈禱","易行・選択・専修","戒律・修験・神仏習合","坐禅・題目・密教"],"a":1,"e":"複雑な修行を要しない易行，一つの方法を選ぶ選択，それに打ち込む専修が共通。"},{"q":"宗派・開祖・教義の組合せとして正しいものはどれか。","c":["浄土真宗―法然―専修念仏","時宗―親鸞―悪人正機","曹洞宗―栄西―公案問答","日蓮宗―日蓮―唱題・法華経至上主義"],"a":3,"e":"浄土宗は法然（専修念仏），浄土真宗は親鸞（悪人正機），臨済宗は栄西（公案問答），曹洞宗は道元（只管打坐）。"},{"q":"旧仏教（南都六宗）の鎌倉新仏教への対応として正しいものはどれか。","c":["貞慶が『摧邪輪』，高弁が『興福寺奏状』で専修念仏を支持した","貞慶が『興福寺奏状』，高弁が『摧邪輪』を著して法然の専修念仏を攻撃し，戒律の尊重を唱えた","叡尊・忍性が『立正安国論』を著して幕府を批判した","南都六宗はすべて念仏に転向した"],"a":1,"e":"法相宗の貞慶と華厳宗の高弁が専修念仏を攻撃。律宗の叡尊・忍性は社会事業を行った。"},{"q":"蒙古襲来後に伊勢神道が成立した背景として最も適当なものはどれか。","c":["「神風」による神国思想の広まりの中で，度会家行が反本地垂迹説を唱えたため","幕府が本地垂迹説を禁止したため","天台宗の山王一実神道が伊勢神宮を支配したため","元から神道の経典が伝来したため"],"a":0,"e":"元寇撃退を「神風」と捉える神国思想を背景に，外宮神官度会家行が神本仏迹説を体系化した。"},{"q":"東大寺南大門が大仏様で再建された背景として正しいものはどれか。","c":["承久の乱で焼失した南都を北条泰時が復興したため","後鳥羽上皇が禅宗様を採用して建てたため","蒙古襲来で焼失した東大寺を北条時宗が再建したため","平重衡の南都焼打ちで炎上した東大寺を重源が宋人陳和卿の協力で再建したため"],"a":3,"e":"1180年の南都焼打ちの復興として重源が大仏様で再建し，慶派の仏師が金剛力士像を作った。"},{"q":"建築様式と建築物の組合せとして正しいものはどれか。","c":["和様―円覚寺舎利殿","大仏様―蓮華王院本堂","禅宗様―円覚寺舎利殿","折衷様―東大寺南大門"],"a":2,"e":"和様は蓮華王院本堂，大仏様は東大寺南大門，禅宗様は円覚寺舎利殿，折衷様は観心寺金堂。"},{"q":"鎌倉時代に歴史関係の作品が増えた理由として最も適当なものはどれか。","c":["公家から武家への政権移行を認めざるを得ない状況の中で歴史意識が高まったため","幕府が歴史書の編纂を御家人に義務づけたため","朱子学が歴史研究を禁止したため","蒙古襲来で多くの史料が失われたため"],"a":0,"e":"政権移行を事実として受け止める中で『愚管抄』『吾妻鏡』などが生まれた。"}],"order":[{"title":"鎌倉仏教と信仰の展開","items":["法然の浄土宗","親鸞の越後配流","日蓮の佐渡配流","蒙古襲来後の伊勢神道成立"],"e":"法然が専修念仏を説き，師に連坐して親鸞が配流，日蓮は幕府により配流，元寇後に伊勢神道が体系化。"},{"title":"南都復興から鎌倉文化へ","items":["平重衡の南都焼打ち","重源による東大寺再建","新古今和歌集の編纂","朱子学による後醍醐天皇の討幕運動"],"e":"1180年焼打ち→重源の復興と慶派の活躍→1205年新古今和歌集→宋学の大義名分論が後醍醐天皇の討幕の支柱に。"}]}],"review":[{"q":"源頼朝が1185年に守護・地頭の任命権を獲得したことと，1221年の承久の乱の関係として最も適当なものはどれか。","c":["守護・地頭の設置により幕府が全国を完全支配したため，承久の乱は起こらなかった","承久の乱の勝利によって初めて守護・地頭が設置された","朝廷が国司・荘官を，幕府が守護・地頭を任命する公武二元的支配の矛盾が，後鳥羽上皇の討幕計画として承久の乱に至った","守護・地頭は承久の乱後に廃止された"],"a":2,"e":"公武二元的支配の矛盾が乱の原因。乱後は新補地頭設置で幕府の西国支配が拡大した。"},{"q":"北条義時の執権地位確立から御成敗式目制定までの流れとして正しいものはどれか。","c":["和田合戦→源実朝の暗殺→承久の乱→連署・評定衆の設置→御成敗式目","承久の乱→和田合戦→源実朝の暗殺→御成敗式目→評定衆の設置","源実朝の暗殺→和田合戦→御成敗式目→承久の乱→連署の設置","和田合戦→承久の乱→源実朝の暗殺→御成敗式目→評定衆の設置"],"a":0,"e":"1213年和田合戦→1219年実朝暗殺→1221年承久の乱→1225年連署・評定衆→1232年御成敗式目。"},{"q":"承久の乱と鎌倉時代の荘園支配の変化の関係として最も適当なものはどれか。","c":["乱後に幕府が地頭を全廃したため荘園領主の支配が回復した","乱後に畿内・西国へ新補地頭が置かれ，地頭の不法行為が激増して地頭請・下地中分による領主の妥協が進んだ","乱後に朝廷が地頭の罷免権を得て地頭の侵略を抑えた","乱後に守護が荘園を直接支配するようになった"],"a":1,"e":"西国への新補地頭設置が地頭の荘園侵略の背景。「泣く子と地頭には勝てぬ」。"},{"q":"蒙古襲来が鎌倉幕府の衰退につながった過程として最も適当なものはどれか。","c":["元軍に敗北して幕府が九州を失ったため","北条時宗が元に降伏して得宗の権威が失墜したため","元との貿易が禁止されて宋銭が流入しなくなったため","防衛戦で恩賞が不十分なうえ警戒態勢が続き，分割相続と貨幣経済の進展も重なって御家人が窮乏し，惣領制が解体して御家人制が動揺したため"],"a":3,"e":"永仁の徳政令も一時的効果に終わり，御家人の幕府への信頼が揺らいで悪党も発生した。"},{"q":"蒙古襲来が北条氏の政治と宗教に与えた影響として正しいものはどれか。","c":["得宗の地位が強化されて得宗専制政治が始まり，「神風」による神国思想の中で伊勢神道が成立した","執権政治が復活して評定衆の合議が強まり，本地垂迹説が定着した","源氏将軍が復活し，浄土宗が国教となった","六波羅探題が廃止され，修験道が禁止された"],"a":0,"e":"元寇後，得宗と御内人による専制が進み，度会家行が反本地垂迹説の伊勢神道を体系化した。"},{"q":"鎌倉時代の農業生産力の向上と貨幣経済の発達，御家人の窮乏の関係として最も適当なものはどれか。","c":["二毛作や新肥料で生産力が上がり商業・貨幣経済が発達したが，貨幣経済の進展は御家人の出費増大を招き窮乏の一因となった","生産力の向上で御家人の収入が増え，貨幣経済とは無関係に安定した","貨幣経済の発達により幕府が銭を鋳造し御家人に配布した","定期市の発達で御家人が商人となり所領を放棄した"],"a":0,"e":"宋銭流入と商業の発達は生活向上と出費増大をもたらし，分割相続・恩賞不足とともに御家人窮乏の原因となった。"}]},{"id":8,"title":"全国的武家政権の確立と衰退","era":"鎌倉時代末〜室町時代","span":"1317〜1536","oneLine":"鎌倉幕府滅亡と建武の新政を経て室町幕府が確立したが、内乱と一揆で衰退した","chain":["後醍醐天皇","足利尊氏","足利義詮","足利義満","足利義持","足利義教","足利義政"],"parts":[{"title":"鎌倉幕府の滅亡と建武の新政","flow":[{"y":"1317","t":"文保の和談","s":"幕府が10年ごとの両統迭立を強引に決定したが、両統とも合意に達せず反幕府感情が高まった","why":"後嵯峨上皇の2子が持明院統・大覚寺統に分かれ皇統や皇室領荘園の相続をめぐり対立していたため"},{"y":"1318","t":"後醍醐天皇の即位","s":"持明院統の花園天皇の後を受け、中継ぎ的役割で大覚寺統から即位","why":""},{"y":"1321","t":"後醍醐天皇の親政開始","s":"父後宇多法皇の院政を停止し、記録所を再興して親政を開始","why":"宋学の大義名分論を信奉し、皇位継承の決定権を幕府から取り戻そうとしたため"},{"y":"1324","t":"正中の変","s":"後醍醐天皇の討幕計画が密告で失敗。日野資朝は佐渡に流されるが天皇と日野俊基は赦免","why":"内管領長崎高資の専横で幕府支配が弱体化し、討幕の機とみたため"},{"y":"1331","t":"元弘の変","s":"討幕計画が再び失敗。日野資朝・俊基は死罪、天皇は笠置山で捕縛され廃位、幕府は光厳天皇を擁立。楠木正成が赤坂城で挙兵","why":""},{"y":"1332","t":"後醍醐天皇の隠岐配流","s":"天皇は隠岐に流されるが、護良親王が吉野で、楠木正成が千早城で挙兵","why":""},{"y":"1333","t":"鎌倉幕府の滅亡","s":"隠岐を脱出した天皇のもと、足利高氏らが六波羅探題を、新田義貞らが鎌倉を攻略。北条高時・守時が自害","why":"得宗専制政治のゆきづまりが御家人たちの裏切りを招いたため"},{"y":"1333","t":"建武の新政","s":"天皇親政を理想とするが、国司・守護の併置に見られるように実質は公武二元支配","why":"鎌倉時代に公武二元支配が根づいていたため"},{"y":"1335","t":"中先代の乱","s":"北条時行が鎌倉を攻略、足利直義は脱出時に護良親王を殺害。尊氏が無断で鎮圧し建武政権から離反","why":"綸旨の濫発や公家優位の政治に武家が反発していたため"},{"y":"1336","t":"湊川の戦い・北朝成立","s":"光厳上皇の院宣を得た尊氏が楠木正成を破り再入京。光明天皇を即位させ建武式目を制定、後醍醐天皇は吉野へ脱出","why":""}],"story":"【後嵯峨上皇】の2子が【持明院統】と【大覚寺統】に分かれて対立した。幕府は【文保の和談】で10年ごとの【両統迭立】を強引に決めたが、合意に達せず→かえって反幕府感情が高まった。大覚寺統から即位した【後醍醐天皇】は宋学の大義名分論を信奉し、【1321】年に父後宇多法皇の院政を停止→【記録所】を再興して親政を始めた。折しも内管領【長崎高資】の専横で幕府支配は弱体化していた。天皇は【正中の変】【元弘の変】と討幕を企てて失敗し【隠岐】に流されたが、【楠木正成】や【護良親王】の挙兵が続き→【1333】年、【足利高氏】が六波羅探題を、【新田義貞】が鎌倉を攻略して幕府は滅亡した。【建武の新政】は天皇親政を理想としたが、公武二元支配が根づいていたため実現できず、【綸旨】の濫発や公家優位の恩賞が武家の反発を招いた。【中先代の乱】を機に【足利尊氏】が離反→【湊川の戦い】で楠木正成を破り、【光明天皇】を立てて【建武式目】を制定（北朝）、後醍醐天皇は【吉野】に逃れた（南朝）。","keywords":["持明院統","大覚寺統","両統迭立","文保の和談","後醍醐天皇","長崎高資","正中の変","元弘の変","楠木正成","護良親王","足利高氏","新田義貞","建武の新政","記録所","雑訴決断所","綸旨","中先代の乱","建武式目"],"blanks":[{"q":"後嵯峨上皇の2子の皇統のうち、後深草天皇系で長講堂領を経済基盤としたのは【　】である。","a":"持明院統","h":"光厳天皇・光明天皇はこの系統"},{"q":"後嵯峨上皇の2子の皇統のうち、亀山天皇系で八条院領を経済基盤としたのは【　】である。","a":"大覚寺統","h":"後醍醐天皇はこの系統"},{"q":"1317〜18年の文保の和談で、幕府は10年ごとの【　】を強引に決定した。","a":"両統迭立","h":"両統が交互に皇位につく方式"},{"q":"1321年、後醍醐天皇は父後宇多法皇の院政を停止し、【　】を再興して親政を開始した。","a":"記録所","h":"建武政権でも重要政務を扱った"},{"q":"14代執権北条高時のとき、専横と賄賂政治で御家人の不満を招いた内管領は【　】である。","a":"長崎高資","h":"高時が田楽・闘犬にふける間に権力を握った"},{"q":"1324年、後醍醐天皇の討幕計画が密告により失敗した事件を【　】という。","a":"正中の変","h":"日野資朝は佐渡に流された"},{"q":"1331年の元弘の変後、幕府が擁立した持明院統の天皇は【　】である。","a":"光厳天皇","h":"建武の新政で廃位された"},{"q":"1331年、河内国赤坂城で挙兵した悪党は【　】である。","a":"楠木正成","h":"翌年には千早城で再び挙兵"},{"q":"1333年、赤松則村らとともに六波羅探題を攻略したのは【　】（のち尊氏）である。","a":"足利高氏","h":"のち室町幕府を開く"},{"q":"1333年、足利義詮らとともに鎌倉幕府を攻略したのは【　】である。","a":"新田義貞","h":"建武政権では武者所の頭人"},{"q":"建武政権で所領関係の裁判を扱い、鎌倉幕府の引付衆を継承した機関は【　】である。","a":"雑訴決断所","h":"京都の治安維持は武者所"},{"q":"後醍醐天皇は【　】を絶対万能とし濫発したため、訴訟が爆発的に増加した。","a":"綸旨","h":"所領個別安堵法は年紀法を無視した"}],"mc":[{"q":"文保の和談の結果として正しいものはどれか。","c":["両統が合意し皇位継承が安定した","両統とも合意に達せず反幕府感情が高まった","持明院統の皇位独占が決まった","幕府が皇位継承への介入を強めた"],"a":1,"e":"幕府は10年ごとの両統迭立を強引に決定したが、合意に至らずかえって反幕府感情が高まった。"},{"q":"後醍醐天皇が親政を目指した思想的背景として正しいものはどれか。","c":["宋学の大義名分論を信奉し延喜・天暦の治にならった","浄土教の他力本願を信奉した","末法思想から解放されたため","禅宗の自力開悟の教えによる"],"a":0,"e":"後醍醐天皇は朱子学〔宋学〕の大義名分論を信奉し、延喜・天暦の治にならい親政を目指した。"},{"q":"鎌倉幕府の支配が弱体化した背景として正しいものはどれか。","c":["執権北条高時が独裁を強めた","内管領長崎高資の専横と賄賂政治が御家人の不満を招いた","外様御家人が得宗を支持した","悪党が幕府に協力した"],"a":1,"e":"高時が田楽・闘犬にふける間に長崎高資が権力を握り、専横と賄賂政治が外様御家人のみならず高時の不満も招いた。"},{"q":"正中の変と元弘の変の説明として正しいものはどれか。","c":["正中の変で日野資朝・俊基は死罪となった","元弘の変では天皇と日野俊基は赦免された","ともに密告により失敗した後醍醐天皇の討幕計画である","元弘の変後、幕府は大覚寺統の天皇を擁立した"],"a":2,"e":"ともに密告で失敗。正中の変では資朝が佐渡配流、元弘の変では資朝・俊基が死罪、天皇は廃位され持明院統の光厳天皇が擁立された。"},{"q":"鎌倉幕府が滅亡した要因として最も適当なものはどれか。","c":["元寇で大敗し軍事力を失ったため","北条高時が自ら幕府を解体したため","後醍醐天皇が幕府と和睦したため","得宗専制政治のゆきづまりが御家人たちの裏切りを招いたため"],"a":3,"e":"得宗専制政治への反発から足利高氏や新田義貞らが幕府を裏切り、六波羅探題と鎌倉が攻略された。"},{"q":"建武政権が天皇親政の理想を実現できなかった理由として正しいものはどれか。","c":["鎌倉時代に公武二元支配が根づいていたため","摂関政治が続いていたため","院政が停止されなかったため","守護が廃止され地方を統治できなかったため"],"a":0,"e":"国司・守護の併置に見られるように、実質は公武二元支配の政権だった。"},{"q":"足利尊氏が建武政権から離反する契機となった出来事はどれか。","c":["正中の変","元弘の変","観応の擾乱","中先代の乱"],"a":3,"e":"1335年の中先代の乱を尊氏が天皇の許可なく鎌倉に下って鎮圧し、のち離反を決意した。"},{"q":"1336年に北朝が成立した経緯として正しいものはどれか。","c":["尊氏が後醍醐天皇を擁立し建武式目を制定した","尊氏が光厳上皇の院宣を得て入京し光明天皇を即位させた","後醍醐天皇が吉野で光明天皇に譲位した","新田義貞が光明天皇を擁立した"],"a":1,"e":"九州に敗走した尊氏は光厳上皇の院宣を得て東上、湊川の戦いで楠木正成を破り、光明天皇を即位させた。"}],"order":[{"title":"後醍醐天皇の討幕から幕府滅亡まで","items":["正中の変","元弘の変","後醍醐天皇の隠岐配流","六波羅探題・鎌倉の攻略"],"e":"1324年正中の変→1331年元弘の変→1332年隠岐配流→1333年幕府滅亡。"},{"title":"建武政権の崩壊","items":["護良親王の鎌倉幽閉","中先代の乱","尊氏の九州敗走","湊川の戦い"],"e":"1334年幽閉→1335年中先代の乱で離反→1336年入京後に北畠顕家に敗れ九州へ→院宣を得て湊川で正成を破る。"},{"title":"皇統対立から親政まで","items":["文保の和談","後醍醐天皇の即位","後宇多法皇の院政停止","正中の変"],"e":"1317〜18年和談→1318年即位→1321年院政停止・親政開始→1324年正中の変。"}]},{"title":"南北朝の争乱と室町幕府の成立","flow":[{"y":"1336","t":"建武式目の制定","s":"二階堂是円らへの施政方針の諮問を2項17条に記す。基本法は御成敗式目","why":"光明天皇を擁立し京に幕府を開設するため"},{"y":"1338","t":"尊氏が征夷大将軍に就任","s":"弟直義との二頭政治（軍事＝尊氏、行政・司法＝直義）を開始","why":""},{"y":"1339","t":"後醍醐天皇の死","s":"義良親王が後村上天皇として即位。尊氏・直義は夢窓疎石の勧めで天龍寺を造営","why":"後醍醐天皇の菩提を弔うため"},{"y":"","t":"北畠親房『神皇正統記』","s":"関東を転戦後吉野へ帰還し、後村上天皇に献上して南朝の正統性を強調","why":""},{"y":"1348","t":"四条畷の戦い","s":"楠木正行が戦死し吉野も陥落、後村上天皇は賀名生へ退く","why":""},{"y":"1350","t":"観応の擾乱","s":"直義による高師直殺害を契機に北朝の二派が武力衝突。直義が敗死","why":"急進派の尊氏・高師直と漸進派の直義・直冬が対立を深めたため"},{"y":"1378","t":"花の御所の造営","s":"3代義満が室町に将軍邸を造営。京都の市政権・段銭徴収権・外交権など朝廷の権限を吸収","why":""},{"y":"1391","t":"明徳の乱","s":"西国11か国の守護を兼ねる山名氏清を討伐。前年に土岐康行の乱","why":"義満が有力守護大名を圧伏するため挑発した"},{"y":"1392","t":"南北朝の合一","s":"義満の斡旋で後亀山天皇が京に帰り、後小松天皇に三種の神器を譲る","why":"1360年代には九州を除き北朝方が圧倒的に有利で、今川了俊が九州の南朝勢力も平定したため"},{"y":"1394","t":"義満が太政大臣に就任","s":"義持に将軍職を譲り公武の最高権力者に。翌年引退、北山山荘に金閣を造営。1399年応永の乱で大内義弘を討伐","why":""}],"story":"【1336】年、足利尊氏は光明天皇を擁立して【建武式目】を制定し、【1338】年に征夷大将軍となって弟【足利直義】との二頭政治を始めた。一方、後醍醐天皇は【吉野】で三種の神器を持ち南朝の正統性を主張したため→南北朝の対立となった。南朝は諸将が次々戦死し、【北畠親房】が『【神皇正統記】』で正統性を訴えたが常に苦戦した。しかし北朝側でも急進派の尊氏・【高師直】と漸進派の直義が対立→【観応の擾乱】で武力衝突し、双方が南朝と和睦するなど離合集散を繰り返した。さらに【惣領制の解体】で嫡子単独相続が一般化し、独立を目指す庶子家が幕府に反抗する勢力として南朝を利用したため→動乱は全国化・長期化した。3代将軍【足利義満】は【花の御所】を造営して朝廷の権限を吸収し、【明徳の乱】【応永の乱】で有力守護大名を圧伏→【1392】年に南北朝を合一し、【太政大臣】として公武の最高権力者に君臨した。幕府の経済基盤は【御料所】のほか段銭・土倉役など貨幣の臨時税が多く不安定だった。","keywords":["建武式目","御成敗式目","足利直義","後村上天皇","神皇正統記","高師直","観応の擾乱","惣領制の解体","足利義満","花の御所","明徳の乱","応永の乱","後小松天皇","管領","四職","鎌倉府","御料所","段銭"],"blanks":[{"q":"1336年、足利尊氏が二階堂是円らへの諮問をもとに制定した2項17条の施政方針を【　】という。","a":"建武式目","h":"基本法はあくまで御成敗式目"},{"q":"1338年に征夷大将軍となった尊氏は、弟【　】と二頭政治を行った。","a":"足利直義","h":"軍事＝尊氏、行政・司法＝弟"},{"q":"1339年の後醍醐天皇の死後、義良親王が【　】として即位した。","a":"後村上天皇","h":"のち賀名生を行在所とした"},{"q":"北畠親房が後村上天皇に献上し、南朝の正統性を強調した歴史書は『【　】』である。","a":"神皇正統記","h":"常陸国小田城など関東を転戦後に吉野へ帰還"},{"q":"足利尊氏の執事で、急進派として直義と対立した人物は【　】である。","a":"高師直","h":"直義に殺害されたことが観応の擾乱の契機"},{"q":"1350〜52年、北朝の二派が武力衝突した内紛を【　】という。","a":"観応の擾乱","h":"直義が敗死"},{"q":"征西将軍懐良親王は、幕府の九州探題【　】の下向により敗退した。","a":"今川了俊","h":"貞世ともいう"},{"q":"3代将軍足利義満は1378年、京都の【　】に将軍邸花の御所を造営した。","a":"室町","h":"幕府の名の由来"},{"q":"1392年、南朝の後亀山天皇は北朝の【　】に三種の神器を譲り南北朝が合一した。","a":"後小松天皇","h":"義満の斡旋による"},{"q":"1391年、西国11か国の守護を兼ねる山名氏清が討伐された事件を【　】という。","a":"明徳の乱","h":"山名氏は六分一衆と呼ばれた"},{"q":"将軍を補佐し政務を総括する【　】には、細川・斯波・畠山の三家が交替で就任した。","a":"管領","h":"もとの執事"},{"q":"幕府直轄の荘園【　】は、将軍直属の奉公衆が管理した。","a":"御料所","h":"畿内・東海を中心に散在"}],"mc":[{"q":"鎌倉幕府と室町幕府を一連のものとみなす意見がある理由として正しいものはどれか。","c":["ともに北条氏が実権を握ったため","ともに御成敗式目を基本法としたため","ともに鎌倉に置かれたため","ともに建武式目を基本法としたため"],"a":1,"e":"室町幕府も基本法は御成敗式目で、以後の追加法を建武以来追加という。"},{"q":"観応の擾乱が起こった直接の契機はどれか。","c":["足利直義が高師直を殺害した","高師直が足利直義を殺害した","尊氏が直冬を養子にした","後村上天皇が京都を攻撃した"],"a":0,"e":"急進派の尊氏・高師直と漸進派の直義・直冬が対立し、直義による高師直殺害を契機に武力衝突した。"},{"q":"南北朝の動乱が長期化した背景として正しいものはどれか。","c":["分割相続が一般化し血縁的結合が強まった","南朝が軍事力を増強し続けた","惣領制が解体し庶子家が幕府への反抗に南朝を利用した","北朝が一貫して団結していた"],"a":2,"e":"嫡子単独相続の一般化で庶子家独立の傾向が強まり、幕府に反抗する勢力が南朝を利用した。北朝の内紛も要因。"},{"q":"足利尊氏・直義が天龍寺を造営した目的はどれか。","c":["高師直の菩提を弔うため","明との貿易の拠点とするため","南朝との和睦の証とするため","後醍醐天皇の菩提を弔うため"],"a":3,"e":"1339年の後醍醐天皇の死後、夢窓疎石の勧めを受けて造営した。"},{"q":"足利義満が土岐康行の乱・明徳の乱・応永の乱を起こさせた目的はどれか。","c":["南朝勢力を平定するため","鎌倉府の勢力を抑えるため","有力守護大名を圧伏するため","朝廷の権限を奪うため"],"a":2,"e":"複数か国の守護を兼ねる土岐・山名・大内氏を挑発して討伐し、将軍権力を強化した。"},{"q":"義満の権力について正しいものはどれか。","c":["将軍在職のまま太政大臣に就任した","太政大臣就任後も将軍職を保持した","将軍職を義持に譲り公武の最高権力者として君臨した","皇位に就いた"],"a":2,"e":"1394年に義持に将軍職を譲って太政大臣に就任し、日本国王として明から冊封されるなど皇位に肉薄した。"},{"q":"室町幕府の経済基盤が不安定だった理由として正しいものはどれか。","c":["御料所が全国に広大に存在したため","明からの援助に頼ったため","年貢米に依存していたため","貨幣による臨時税が多かったため"],"a":3,"e":"御料所は散在するのみで、段銭・棟別銭・土倉役・酒屋役などの貨幣の臨時税が多かった。"},{"q":"鎌倉府について正しいものはどれか。","c":["鎌倉公方は上杉氏が世襲した","関東管領は足利基氏の子孫が世襲した","鎌倉公方は尊氏の子基氏の子孫、関東管領は上杉氏が世襲した","京都の幕府とは異なる簡素な機構だった"],"a":2,"e":"関東8か国＋甲斐・伊豆を統治し、京都の幕府と同様の機構を備えていた。"}],"order":[{"title":"南北朝の対立の成立","items":["光明天皇の擁立","建武式目の制定","尊氏の征夷大将軍就任","後醍醐天皇の死"],"e":"1336年光明天皇擁立・建武式目→1338年将軍就任→1339年後醍醐天皇死去。"},{"title":"北朝の内紛と義満の登場","items":["観応の擾乱","尊氏の死","花の御所の造営","南北朝の合一"],"e":"1350〜52年観応の擾乱→1358年尊氏死去→1378年花の御所→1392年合一。"},{"title":"義満による守護大名の圧伏","items":["土岐康行の乱","明徳の乱","太政大臣就任","応永の乱"],"e":"1390年土岐氏→1391年山名氏清→1394年太政大臣→1399年大内義弘。"}]},{"title":"内乱と一揆の時代","flow":[{"y":"1352","t":"半済令（観応半済令）","s":"近江・美濃・尾張3国で荘園・公領の年貢の半分を兵粮米として徴収する権限を守護に認める。のち永続化・全国化","why":"南北朝動乱下の軍費調達のため"},{"y":"","t":"守護請・守護大名の成長","s":"守護が年貢徴収を一括請負。半済令・守護請で得た権利を国人に分与して被官化し、14世紀末に守護領国制が成立","why":"国人・地侍など地方武士の力が増大し、彼らを統括する守護の役割が大きくなったため"},{"y":"1416","t":"上杉禅秀の乱","s":"鎌倉府の内紛に乗じた前関東管領上杉禅秀を、鎌倉公方足利持氏の要請で幕府が討伐","why":""},{"y":"1428","t":"正長の徳政一揆","s":"近江坂本の馬借の蜂起が発端。京の酒屋・土倉・寺院を襲撃し畿内各地で私徳政","why":"惣村の土民が徳政令発布などを要求したため"},{"y":"1438","t":"永享の乱","s":"くじ引きで将軍となった6代義教と関東管領上杉憲実が鎌倉公方足利持氏を討伐","why":""},{"y":"1441","t":"嘉吉の変・嘉吉の徳政一揆","s":"赤松満祐が「万人恐怖」の義教を謀殺。土民が代始めの徳政を要求し、幕府は初の徳政令を発布","why":"義教の専制への反発と、その混乱に乗じた土民の要求"},{"y":"1454","t":"享徳の乱","s":"鎌倉公方足利成氏が関東管領上杉憲忠を謀殺。公方は古河公方と堀越公方に分裂し関東は戦国時代へ","why":""},{"y":"1467","t":"応仁の乱","s":"8代義政の時代に発生し、全国的に戦国時代に突入","why":""},{"y":"1485","t":"山城の国一揆","s":"両畠山軍の南山城退去などを要求し、国人の月行事らによる自治が8年間続く","why":""},{"y":"1488","t":"加賀の一向一揆","s":"蓮如が組織した門徒が守護富樫政親を滅ぼし、約1世紀の自治支配","why":""}],"story":"南北朝の動乱で【国人】ら地方武士の力が増大したため→彼らを統括する守護の役割が大きくなった。守護は【半済令】で年貢の半分を徴収する権限を得、【守護請】で年貢徴収を請け負った。これらの権利を国人に分与して被官化を進めた結果→【守護大名】へ成長し、14世紀末に【守護領国制】が成立した。一方、厳密な主従関係のない国人は【国人一揆】を結んで抵抗した。4代義持の後、くじ引きで将軍となった6代【足利義教】は【永享の乱】で鎌倉公方持氏を討ち「万人恐怖」の専制を行ったため→【1441】年【嘉吉の変】で赤松満祐に謀殺された。8代【足利義政】は政務を放棄し【銀閣】を造営、【享徳の乱】で関東が、【応仁の乱】で全国が戦国時代に突入した。農村では【惣村】が成長し【寄合】で惣掟を定めた。土民は【正長の徳政一揆】【嘉吉の徳政一揆】で徳政を要求し、【山城の国一揆】は国人の自治を8年、【加賀の一向一揆】は約1世紀の自治支配を実現した。","keywords":["半済令","守護請","守護大名","守護領国制","国人一揆","足利義教","永享の乱","嘉吉の変","享徳の乱","応仁の乱","惣村","寄合","地下請","正長の徳政一揆","山城の国一揆","加賀の一向一揆","蓮如","法華一揆"],"blanks":[{"q":"1352年、南北朝動乱下の軍費調達のため守護に荘園・公領の年貢の半分の徴収権を認めた法令を【　】という。","a":"半済令","h":"当初は近江・美濃・尾張3国、一年限り"},{"q":"荘園・公領の年貢徴収を守護が一括して請け負うことを【　】という。","a":"守護請","h":"領主は経営から手を引くことも多かった"},{"q":"14世紀末に成立した、守護による一国全体に及ぶ地域的支配体制を【　】という。","a":"守護領国制","h":"国衙の機能は守護所が吸収"},{"q":"国人たちが一味神水の儀式で結び、守護領国制に抵抗した一揆を【　】という。","a":"国人一揆","h":"傘連判で平等を強調"},{"q":"天台座主から「くじ引き」で還俗して6代将軍となったのは【　】である。","a":"足利義教","h":"「万人恐怖の世」と評された"},{"q":"1438年、6代将軍義教と関東管領上杉憲実が鎌倉公方足利持氏を討伐した事件を【　】という。","a":"永享の乱","h":"続いて結城合戦が起こる"},{"q":"1441年、播磨国守護赤松満祐が6代将軍義教を謀殺した事件を【　】という。","a":"嘉吉の変","h":"山名持豊らが赤松氏を追討"},{"q":"享徳の乱の結果、鎌倉公方は足利成氏の【　】と足利政知の堀越公方に分裂した。","a":"古河公方","h":"関東管領上杉氏も山内・扇谷に分裂"},{"q":"惣村では【　】と呼ばれる村民の会議で惣掟を定め、違反者を地下検断で追放した。","a":"寄合","h":"宮座が主導"},{"q":"1428年、近江坂本の馬借の蜂起を発端に起こった土一揆を【　】という。","a":"正長の徳政一揆","h":"柳生の徳政碑文が有名"},{"q":"1485年、両畠山軍の南山城退去などを要求し国人の自治が8年続いた一揆を【　】という。","a":"山城の国一揆","h":"国人一揆と土一揆が一国単位で結合した国一揆"},{"q":"1488年、本願寺8世【　】が組織した門徒が守護富樫政親を滅ぼした。","a":"蓮如","h":"越前吉崎を拠点に御文で布教"}],"mc":[{"q":"守護が守護大名と呼ばれるほど強大化した過程として正しいものはどれか。","c":["半済令・守護請で得た権利を国人に分与して被官化を進めた","幕府から一国の土地を与えられた","国人と厳密な主従関係を結んだ","荘園領主から土地を購入した"],"a":0,"e":"荘園・公領内の諸権利を国人に分与することで被官化を進め、荘園領主・知行国主は有名無実化した。"},{"q":"半済令が出された目的として正しいものはどれか。","c":["御家人の窮乏を救済するため","惣村の年貢を軽減するため","荘園領主の権利を保護するため","南北朝動乱下の軍費を調達するため"],"a":3,"e":"1352年の観応半済令は、守護に年貢の半分を兵粮米として徴収する権限を認めた。"},{"q":"国人一揆が結ばれた理由として正しいものはどれか。","c":["守護大名と土地を媒介とした厳密な主従関係を結んでいなかったため","幕府が国人に一揆を命じたため","土民の要求に応じるため","守護が国人を優遇したため"],"a":0,"e":"自立的気風の強い国人は、自らの領主権を守るため一味同心して守護領国制に抵抗した。"},{"q":"嘉吉の変の背景として最も適当なものはどれか。","c":["義政の浪費に守護が反発した","義持が後継を決めなかった","義教の「万人恐怖」と評される専制","義教が徳政令を出さなかった"],"a":2,"e":"播磨守護赤松満祐が専制を行う6代義教を謀殺し、山名持豊らが赤松氏を追討した。"},{"q":"1441年時点で室町幕府に起こっていた状態として正しいものはどれか。","c":["応仁の乱で京都が焼けていた","京・鎌倉で両公方を欠いていた","南北朝が再び分裂していた","鎌倉公方が古河と堀越に分裂していた"],"a":1,"e":"永享の乱で鎌倉公方持氏が討たれ、嘉吉の変で将軍義教が殺され、両公方を欠く事態となった。"},{"q":"惣村が登場した背景として正しいものはどれか。","c":["幕府が村の自治を命じたため","荘園領主が年貢を免除したため","守護が農民を組織したため","生産力の向上と戦乱への自衛の必要性"],"a":3,"e":"独立小農民の成長、入会地・用水をめぐる結合の必要、荘園領主・国人への対抗や戦乱への自衛が背景。"},{"q":"嘉吉の徳政一揆の結果として正しいものはどれか。","c":["幕府は徳政令を拒否した","馬借が私徳政を行った","幕府は初の徳政令を発布した","赤松氏が徳政令を出した"],"a":2,"e":"土民が嘉吉の乱に乗じて代始めの徳政を要求し、幕府は山城一国平均の初の徳政令を発布した。"},{"q":"加賀の一向一揆について正しいものはどれか。","c":["国人の月行事が8年間自治を行った","守護富樫政親を滅ぼし約1世紀自治支配を続けた","延暦寺の焼打ちで壊滅した","日親の布教で商工業者が蜂起した"],"a":1,"e":"1488年、蓮如が組織した門徒が富樫政親を滅ぼして富樫泰高を擁立、1582年に織田信長に討滅されるまで続いた。"}],"order":[{"title":"室町幕府の内乱","items":["上杉禅秀の乱","永享の乱","嘉吉の変","享徳の乱","応仁の乱"],"e":"1416年→1438年→1441年→1454年→1467年。義持→義教→義政の時代の順。"},{"title":"一揆の順序","items":["正長の徳政一揆","播磨の土一揆","嘉吉の徳政一揆","山城の国一揆","加賀の一向一揆"],"e":"1428年→1429年→1441年→1485年→1488年。"},{"title":"守護の権限拡大","items":["半済令","守護領国制の成立","上杉禅秀の乱","嘉吉の変"],"e":"1352年半済令→14世紀末守護領国制→1416年→1441年。"}]},{"title":"室町時代の外交","flow":[{"y":"1325","t":"建長寺船の派遣","s":"14代執権北条高時が建長寺の再建費を得るために派遣","why":""},{"y":"1342","t":"天龍寺船の派遣","s":"足利尊氏・直義が夢窓疎石の勧めにより派遣","why":"天龍寺を造営するため"},{"y":"1368","t":"明の成立","s":"紅巾の乱を経て朱元璋が建国。海禁政策を推進し、1369年以降懐良親王に倭寇禁圧を要求","why":"中国中心の伝統的国際秩序の回復を目指したため"},{"y":"1392","t":"朝鮮の建国","s":"倭寇討伐に功のあった李成桂が建国。通交と倭寇禁止を求め義満が応じる","why":"倭寇の被害や国内対立・凶作で高麗が衰退したため"},{"y":"1401","t":"義満の遣使","s":"正使祖阿・副使肥富を派遣。翌年「日本国王源道義」として冊封される","why":"貿易の利益と国内権威の確立のため"},{"y":"1404","t":"日明貿易の開始","s":"勘合で倭寇・私貿易船と区別し朝貢形式で派遣。滞在費は明の負担で無関税","why":""},{"y":"1411","t":"義持による国交中絶","s":"朝貢形式を好まず中絶。倭寇が活発化","why":""},{"y":"1419","t":"応永の外寇","s":"宗貞茂の死後に倭寇が活発化し、朝鮮が対馬を襲撃。1423年に関係修復","why":""},{"y":"1510","t":"三浦の乱","s":"特権縮小に不満を抱いた恒居倭が暴動。1512年壬申約条で再開するが宗氏のみに","why":""},{"y":"1523","t":"寧波の乱","s":"博多商人と結ぶ大内氏が堺商人と結ぶ細川氏に勝ち貿易を独占。1551年大内氏滅亡で終結","why":""}],"story":"鎌倉後期には【建長寺船】【天龍寺船】が元へ派遣された。南北朝期には日本人中心の【前期倭寇】が朝鮮・中国沿岸を襲い、【1368】年に成立した【明】は【海禁政策】をとって倭寇の禁圧を求めた。室町幕府は貿易の利益と国内権威の確立を求めたため→【1401】年に【足利義満】が遣使し、「日本国王源道義」として冊封を受け、【1404】年に【勘合】を用いた朝貢形式の【日明貿易】が始まった。4代【義持】は朝貢形式を嫌って中絶したが→6代【義教】が再開し、のち幕府は【抽分銭】を徴収する側に回った。【1523】年の【寧波の乱】で大内氏が独占し、大内氏の滅亡で終結。朝鮮では倭寇で衰退した高麗に代わり【李成桂】が【1392】年に建国し、通信符を用いて守護大名・商人にも広く許可する自由な貿易が始まった。対馬の【宗氏】が日朝を繋いだが、【応永の外寇】で中断、【癸亥約条】で制限され、【三浦の乱】後は宗氏だけが行うようになった。","keywords":["建長寺船","天龍寺船","前期倭寇","海禁政策","日本国王源道義","勘合","朝貢形式","銅銭","抽分銭","寧波の乱","後期倭寇","李成桂","宗氏","三浦","応永の外寇","癸亥約条","三浦の乱"],"blanks":[{"q":"1342年、足利尊氏・直義は天龍寺造営のため夢窓疎石の勧めで【　】を派遣した。","a":"天龍寺船","h":"鎌倉幕府は建長寺船"},{"q":"南北朝時代に朝鮮半島や中国沿岸を襲った日本人中心の武装海賊集団を前期【　】という。","a":"倭寇","h":"対馬・壱岐・肥前松浦が根拠地"},{"q":"1368年、紅巾の乱を経て朱元璋が建国した漢民族の王朝は【　】である。","a":"明","h":"海禁政策を推進"},{"q":"日明貿易では【　】により倭寇・私貿易船と区別した。","a":"勘合","h":"明＝日字、日本＝本字"},{"q":"1402年、足利義満は「【　】」として建文帝から大統暦を賜り冊封された。","a":"日本国王源道義","h":"翌年「日本国王臣源」と名乗り再遣使"},{"q":"日明貿易の日本側の主な輸入品は【　】・生糸・絹織物・陶磁器などであった。","a":"銅銭","h":"輸出品は銅・金・硫黄・刀剣"},{"q":"1411年、朝貢形式を好まず日明間の国交を中絶した将軍は【　】である。","a":"足利義持","h":"1432年に義教が再開"},{"q":"1523年、博多商人と結ぶ大内氏と堺商人と結ぶ細川氏が衝突した事件を【　】という。","a":"寧波の乱","h":"以後大内氏が貿易を独占"},{"q":"1392年、倭寇討伐に功のあった【　】が朝鮮を建国した。","a":"李成桂","h":"高麗の衰退が背景"},{"q":"日朝貿易で日本側の主な輸入品は【　】・大蔵経・朝鮮人参などであった。","a":"木綿","h":"綿布ともいう"},{"q":"1419年、宗貞茂の死後に倭寇が活発化したため朝鮮が対馬を襲撃した事件を【　】という。","a":"応永の外寇","h":"1423年に関係修復"},{"q":"1443年、宗貞盛と朝鮮の間で渡航船を年間50隻に制限した約定を【　】という。","a":"癸亥約条","h":"嘉吉条約ともいう"}],"mc":[{"q":"室町幕府が明の冊封体制を受け入れた理由として正しいものはどれか。","c":["明の軍事的圧力を恐れたため","倭寇が幕府を攻撃したため","南朝が明と結んでいたため","貿易の利益と国内権威の確立を求めたため"],"a":3,"e":"幕府側は貿易の利益＋国内権威の確立、明側は倭寇の禁圧＋伝統的国際秩序の回復という利害が一致した。"},{"q":"日明貿易で日本側の利益が莫大だった理由として正しいものはどれか。","c":["日本が明から関税を徴収したため","滞在費・運搬費は明の負担で無関税だったため","明が銀を大量に輸出したため","日本が明を冊封したため"],"a":1,"e":"朝貢形式のため滞在費・運搬費などは明の負担で、無関税だった。"},{"q":"前期倭寇が海賊行為に及んだ背景として正しいものはどれか。","c":["明の海禁政策で私貿易が不調だったため","幕府が海賊を奨励したため","朝鮮が対馬を占領したため","琉球が中継貿易を独占したため"],"a":0,"e":"明の海禁政策により私貿易が不調となり、海賊行為に及ぶ場合が多かった。"},{"q":"日明貿易の中絶と再開について正しいものはどれか。","c":["義満が中絶し義持が再開した","義持が中絶し義教が再開した","義教が中絶し義政が再開した","義持が中絶し義満が再開した"],"a":1,"e":"1411年に4代義持が朝貢形式を好まず中絶、1432年に6代義教が再開した。"},{"q":"日明貿易と日朝貿易の形式の違いとして正しいものはどれか。","c":["日明貿易は朝貢形式だが、日朝貿易は守護大名・国人・商人にも広く許可された","日明貿易は守護大名や商人にも広く許可された","日朝貿易は将軍が朝鮮国王に朝貢する形式だった","両者とも勘合を用いた"],"a":0,"e":"日朝貿易は通信符を用い、当初から幕府以外にも幅広く許可された。"},{"q":"対馬の宗氏が日朝貿易を独占することになった経緯として正しいものはどれか。","c":["朝鮮が宗氏に貿易権を最初から与えた","紛争後の貿易制限で宗氏だけが残った","幕府が宗氏を守護大名に任命した","宗氏が明の冊封を受けた"],"a":1,"e":"応永の外寇後は文引を持つ者が貿易する体制となり、三浦の乱後の壬申約条で貿易は衰え宗氏だけが行うようになった。"},{"q":"朝鮮が建国された背景として正しいものはどれか。","c":["明が高麗を滅ぼしたため","琉球が高麗を攻撃したため","元が高麗を滅ぼしたため","倭寇の被害や国内対立・凶作により高麗が衰退したため"],"a":3,"e":"高麗の衰退を受け、倭寇討伐に功のあった李成桂が1392年に朝鮮を建国した。"},{"q":"三浦の乱が起こった原因として正しいものはどれか。","c":["宗貞茂の死後に倭寇が活発化した","貿易統制で特権が縮小され恒居倭が不満を抱いた","大内氏と細川氏が対立した","朝鮮が対馬を襲撃した"],"a":1,"e":"1510年、三浦の日本人居留民が暴動を起こし貿易は中断した。宗貞茂の死後の倭寇活発化は応永の外寇の背景。"}],"order":[{"title":"日明貿易の展開","items":["明の成立","義満の遣使","義持による中絶","義教による再開","寧波の乱"],"e":"1368年→1401年→1411年→1432年→1523年。"},{"title":"日朝関係の推移","items":["朝鮮の建国","応永の外寇","癸亥約条","三浦の乱","壬申約条"],"e":"1392年→1419年→1443年→1510年→1512年。"},{"title":"対元・対明の公的派遣","items":["建長寺船の派遣","天龍寺船の派遣","明の成立","日明貿易の開始"],"e":"1325年北条高時→1342年尊氏・直義→1368年→1404年。"}]}],"review":[{"q":"後醍醐天皇が討幕を目指した背景と、その政権が崩壊した理由の組合せとして正しいものはどれか。","c":["両統迭立への不満と、南朝の軍事力の衰え","皇位継承の決定権を幕府から取り戻す意図と、独裁への武家の反発","得宗専制への協力と、明との貿易の失敗","惣村の成長と、観応の擾乱"],"a":1,"e":"文保の和談後、天皇は皇位継承権を幕府から取り戻そうと親政・討幕を進め、建武政権は綸旨濫発や公家優位の政治に武家が反発して崩壊した。"},{"q":"南北朝の動乱と守護大名の成長の関係として正しいものはどれか。","c":["動乱で守護の権限が縮小され国人が独立した","守護は動乱に関与せず荘園領主が強化された","守護大名の成長により動乱は短期間で終結した","動乱下の軍費調達のため半済令が出され、守護が荘園・公領の権利を得て守護大名に成長した"],"a":3,"e":"1352年の半済令や守護請を通じて守護は諸権利を獲得し国人を被官化、守護大名の成長は動乱の長期化の背景にもなった。"},{"q":"足利義満の権力強化と外交の関係として正しいものはどれか。","c":["義満は明の冊封を拒否して権威を高めた","義満は南北朝合一後、日本国王として明から冊封され権威を確立した","義満は朝鮮に朝貢して権威を得た","義満は倭寇を率いて明と戦った"],"a":1,"e":"1392年に南北朝を合一し、1394年太政大臣となった義満は、1401年に遣使して「日本国王源道義」として冊封され、貿易の利益と権威を得た。"},{"q":"室町幕府が衰退していく過程として正しいものはどれか。","c":["義教が嘉吉の変で謀殺され、義政の時代に享徳の乱・応仁の乱で戦国時代に入った","義満が明徳の乱で敗れて幕府が崩壊した","義持が永享の乱で鎌倉公方に敗れた","観応の擾乱で義政が敗死した"],"a":0,"e":"1441年嘉吉の変で将軍義教が殺され、8代義政の時代に1454年享徳の乱で関東が、1467年応仁の乱で全国が戦国時代に突入した。"},{"q":"室町時代に一揆が多発した背景として正しいものはどれか。","c":["幕府の経済基盤が安定し徳政令が不要になったため","守護大名が農民を武装させたため","惣村の成長で土民が結合し、徳政令発布などを要求するようになったため","明の海禁政策で倭寇が国内に侵入したため"],"a":2,"e":"鎌倉後期から惣村が発達し、土民は一味同心して正長・嘉吉の徳政一揆などを起こした。幕府は分一銭目当てに分一徳政令を濫発した。"},{"q":"鎌倉幕府の滅亡から室町幕府の確立までの流れとして正しいものはどれか。","c":["元弘の変→建武の新政→観応の擾乱→南北朝の合一→建武式目","正中の変→中先代の乱→鎌倉幕府滅亡→建武式目→応永の乱","元弘の変→鎌倉幕府滅亡→建武の新政→建武式目→観応の擾乱→南北朝の合一","建武の新政→元弘の変→観応の擾乱→建武式目→南北朝の合一"],"a":2,"e":"1331年元弘の変→1333年幕府滅亡・建武の新政→1336年建武式目→1350年観応の擾乱→1392年南北朝合一。"}]},{"id":9,"title":"地方からの視点と日本の産業・文化の確立","era":"室町時代（戦国時代）","span":"15〜16世紀","oneLine":"応仁の乱で幕府が失墜し、地方の大名・産業・文化が自立して日本の基盤が固まった","chain":["足利義政","足利義尚","細川政元","三好長慶","松永久秀"],"parts":[{"title":"琉球王国と蝦夷ヶ島","flow":[{"y":"","t":"グスク時代","s":"11世紀末から按司と呼ばれる地方豪族がグスク（城）を築いて争った","why":""},{"y":"","t":"三山時代","s":"14世紀に按司たちが山北・中山・山南の三王国に統一され、各王が明の冊封を受けた","why":""},{"y":"1429","t":"琉球王国の成立","s":"中山王の尚巴志が三山を統一し、首里城に王府を置いた（第一尚氏王統）","why":"按司の抗争を勝ち抜き三山を統一したため"},{"y":"1457","t":"コシャマインの戦い","s":"蝦夷ヶ島で和人とアイヌが紛争。蠣崎氏の客将武田信広がコシャマインを射殺","why":"和人とアイヌの文化・風習の違いと交易の主導権争いのため"},{"y":"1470","t":"第二尚氏王統の成立","s":"尚円（内間金丸）が再統一し、のち尚真が明に冊封され全盛期を迎えた","why":""},{"y":"","t":"中継貿易の展開","s":"国際貿易港の那覇を中心に、明・日本・朝鮮と東南アジア諸国を結んだ","why":"日本・明の両国に朝貢する立場を生かして各地を結ぶため"},{"y":"","t":"蠣崎氏の台頭","s":"16世紀前半、蠣崎氏が安藤氏に代わり道南の館主を統一し松前を本拠とした","why":"コシャマインの戦いを鎮圧して実力を示したため"},{"y":"","t":"『おもろさうし』の編纂","s":"16世紀から琉球の歌謡集が編纂され、三弦をもとに三線が生まれた","why":""},{"y":"","t":"琉球王国の衰退","s":"南蛮貿易の発展・後期倭寇の活動・明の海禁政策緩和などで中継貿易の役割が小さくなった","why":"琉球を経由せずに貿易ができるようになったため"}],"story":"琉球では11世紀末から【按司】がグスクを築いて争い、14世紀に【三山】に統一されて各王が明の冊封を受けた。【1429】年、中山王の【尚巴志】が三山を統一して【琉球王国】が成立し、【首里】城に王府を置いて日本・明の両国に朝貢した。国際貿易港【那覇】を中心とする【中継貿易】で繁栄したが、のち【南蛮貿易】の発展や【後期倭寇】の活動、明の海禁政策緩和が原因で→中継貿易の役割が小さくなり→国家としても衰退した。一方、北の蝦夷ヶ島では13世紀頃から【アイヌ文化】が展開し、和人が渡島半島に【道南十二館】を築いて、津軽の【安藤氏】の支配下で【十三湊】を通じ北海の産物を畿内へ送った（日本海交易）。しかし和人とアイヌの文化・風習の違いと交易の主導権争いが原因で→【1457】年に【コシャマインの戦い】が起こり→これを鎮めた【蠣崎氏】がのちに安藤氏に代わって館主を統一し、松前を本拠とした。","keywords":["按司","三山","尚巴志","琉球王国","首里","中継貿易","那覇","おもろさうし","アイヌ文化","道南十二館","安藤氏","十三湊","コシャマインの戦い","蠣崎氏"],"blanks":[{"q":"11世紀末以降、【　】と呼ばれる地方豪族がグスクを築き互いに争った。","a":"按司","h":"グスク時代の地方豪族"},{"q":"14世紀、琉球は山北・中山・山南の三王国に統一され、これを【　】という。","a":"三山","h":"各王は明の冊封を受けた"},{"q":"1429年、按司から中山王となった【　】が三山を統一した。","a":"尚巴志","h":"第一尚氏王統の初代"},{"q":"琉球王国は【　】城に王府を置き、日本・明の両国に朝貢した。","a":"首里","h":"正殿前に万国津梁の鐘が掛けられた"},{"q":"1470年、【　】（内間金丸）が琉球を再統一し第二尚氏王統が成立した。","a":"尚円","h":"のち尚真が全盛期を築く"},{"q":"琉球王国は国際貿易港の【　】を中心に、明・日本・朝鮮と東南アジア諸国を結ぶ中継貿易を展開した。","a":"那覇","h":"首里の外港"},{"q":"16世紀から編纂された琉球の歌謡集を『【　】』という。","a":"おもろさうし","h":"伝統歌謡オモロを収める"},{"q":"中国から伝わった三弦をもとに琉球王国で【　】が生まれ、のち日本に伝わって三味線となった。","a":"三線","h":"蛇皮線ともいう"},{"q":"13世紀頃から北海道で展開した、狩猟・漁労・交易を中心とする文化を【　】という。","a":"アイヌ文化","h":"文字を持たず口承のユーカラが発達"},{"q":"和人が渡島半島に建設した【　】の館主は、津軽の豪族安藤氏の支配下にあった。","a":"道南十二館","h":"志苔館・花沢館など"},{"q":"北海の産物は津軽半島の日本海側にあった【　】を通じて畿内へ運ばれた。","a":"十三湊","h":"日本海交易の拠点"},{"q":"1457年、和人とアイヌの紛争である【　】が起こり、蠣崎氏がこれを討滅した。","a":"コシャマインの戦い","h":"客将武田信広が大首長を射殺"}],"mc":[{"q":"1429年に琉球王国が成立した経緯として正しいものはどれか。","c":["尚円が明の冊封を受けて三山を統一した","中山王の尚巴志が三山を統一した","山北の王が中山・山南を征服した","明の皇帝が按司を琉球国王に任命した"],"a":1,"e":"按司から中山王となった尚巴志が三山を統一し、琉球王国（第一尚氏王統）を成立させた。尚円は1470年の第二尚氏王統の祖。"},{"q":"琉球王国が中継貿易で繁栄できた背景として最も適当なものはどれか。","c":["日本・明の両国に朝貢する立場を生かして各国を結んだから","明の海禁政策が緩和され自由に貿易できたから","南蛮貿易の拠点として発展したから","後期倭寇と結んで密貿易を行ったから"],"a":0,"e":"琉球は日本・明の両国に朝貢し、那覇を中心に明・日本・朝鮮と東南アジアを結んだ。海禁緩和や南蛮貿易・後期倭寇はむしろ衰退の原因。"},{"q":"琉球王国の中継貿易が衰退した原因として誤っているものはどれか。","c":["南蛮貿易の発展","後期倭寇の活動","明の海禁政策の緩和","三山の分裂"],"a":3,"e":"衰退の原因は南蛮貿易の発展・後期倭寇の活動・明の財源不足や海禁政策緩和など。三山は1429年に統一済みである。"},{"q":"中世の蝦夷ヶ島について正しいものはどれか。","c":["アイヌは独自の文字で歴史を記録した","道南十二館の館主は蠣崎氏の支配下にあった","北海の産物は十三湊を通じて畿内へ運ばれた","アイヌ文化は古代のオホーツク文化より前に成立した"],"a":2,"e":"安藤氏の下で十三湊を通じ日本海交易が行われた。アイヌは文字を持たず口承のユーカラが発達。アイヌ文化は擦文文化・オホーツク文化の後を受けて中世に展開した。"},{"q":"志苔館跡付近で約39万枚の中国銭が出土したことが示す意味として最も適当なものはどれか。","c":["明が蝦夷ヶ島を直接支配していたこと","当地の経済的発展と日本列島の銅銭が蝦夷ヶ島まで流通していたこと","アイヌが独自に貨幣を鋳造していたこと","琉球王国との直接貿易があったこと"],"a":1,"e":"14世紀末〜15世紀初めに埋められた大量の中国銭は、当地の経済的発展と銅銭流通の広がりを示す。"},{"q":"1457年にコシャマインの戦いが起こった背景として最も適当なものはどれか。","c":["安藤氏が幕府に反乱を起こしたため","明が蝦夷ヶ島への朝貢を要求したため","松前藩がアイヌの交易を独占したため","和人とアイヌの文化・風習の違いと交易の主導権争い"],"a":3,"e":"和人の進出により文化・風習の違いと交易の主導権をめぐる対立が生じ、アイヌの大首長コシャマインが蜂起した。"},{"q":"コシャマインの戦いの結果として正しいものはどれか。","c":["安藤氏が館主を統一し松前を本拠とした","アイヌが渡島半島から和人を追放した","紛争を鎮めた蠣崎氏がのち安藤氏に代わり館主を統一した","幕府が蝦夷管領を廃止した"],"a":2,"e":"花沢館の蠣崎氏が討滅し、16世紀前半には蠣崎氏が安藤氏に代わって館主を統一し松前を本拠とした。"}],"order":[{"title":"琉球の歩み","items":["グスク時代","三山時代","琉球王国の成立（第一尚氏）","第二尚氏王統の成立","中継貿易の衰退"],"e":"按司の抗争（グスク）→三山への統一→1429年尚巴志の統一→1470年尚円の再統一→南蛮貿易・海禁緩和で衰退。"},{"title":"蝦夷ヶ島の動き","items":["アイヌ文化の展開","道南十二館の建設","安藤氏の乱","コシャマインの戦い","蠣崎氏による館主統一"],"e":"13世紀頃アイヌ文化→和人の進出と道南十二館→1322年安藤氏の乱→1457年コシャマインの戦い→16世紀前半蠣崎氏が館主を統一。"}]},{"title":"戦国の争乱","flow":[{"y":"1467","t":"応仁・文明の乱の勃発","s":"畠山政長軍と義就軍が京都で衝突し、守護大名が細川方（東軍）・山名方（西軍）に分かれた","why":"義政の失政、将軍家・管領家の後継争い、細川勝元と山名宗全の勢力争いが絡んだため"},{"y":"1473","t":"総大将の死去と義尚の就任","s":"両軍の総大将が死去し義政も引退、9代将軍義尚が就任したが戦いは収まらず","why":""},{"y":"1477","t":"和議と全国への波及","s":"戦いに疲れた両軍が和議を結び、守護大名は領国に下り地域紛争が全国へ広がった","why":"10年の戦いで両軍が疲弊したため"},{"y":"","t":"幕府権威の失墜","s":"将軍の支配力はほぼ山城国一国のみとなり、荘園公領制・守護領国制も崩れた","why":"戦乱で足軽が京都を荒らし、守護代・国人が荘園を横領したため"},{"y":"1493","t":"明応の政変","s":"管領細川政元が10代将軍義材を11代義澄に交替させた","why":"管領が将軍をしのぐ下剋上の風潮"},{"y":"1551","t":"大内義隆の滅亡","s":"守護代の陶晴賢により大内義隆が滅ぼされた","why":""},{"y":"1555","t":"厳島の戦い","s":"安芸の国人毛利元就が陶晴賢を滅ぼし台頭、のち尼子氏も滅ぼした","why":""},{"y":"1565","t":"13代将軍義輝の殺害","s":"松永久秀や三好三人衆が将軍義輝を殺害し、のち仲間割れして東大寺大仏殿が焼失","why":"三好長慶の死後、家臣の松永久秀が実権を握ったため"},{"y":"","t":"大名領国制の確立","s":"戦国大名は寄親・寄子制で家臣団を編成し、分国法を定め、指出検地で貫高制に基づく軍役を課した","why":"幕府から独立して分国内を一元的に支配するため"}],"story":"8代将軍【足利義政】の失政に、将軍家の後継争い（【足利義視】vs【足利義尚】）、管領家の家督問題、【細川勝元】と【山名宗全】の勢力争いが絡んだため→【1467】年に【応仁・文明の乱】が起こった。1477年の和議後に守護大名が領国に下ったことが原因で→争乱は全国に波及した。結果、幕府の権威は失墜して将軍の支配力は山城国のみとなり、【足軽】の略奪で京都は荒廃、荘園公領制と守護領国制が崩れて【下剋上】の風潮が高まり→約100年の【戦国時代】に入った。乱後も【1493】年の【明応の政変】で細川政元が将軍を交替させ、16世紀半ばには三好長慶、その家臣【松永久秀】が実権を握り、【1565】年に13代将軍【足利義輝】が殺害された。戦国大名は守護・守護代・国人など出自はさまざまだが、いずれも幕府から独立し、【寄親・寄子制】で家臣団を編成し、【分国法】で家臣と農民を統制した。【喧嘩両成敗法】は私闘の禁止・自力救済の否定であり、【指出検地】により【貫高制】に基づく軍役を課して大名領国制を築いた。畿内は幕府・朝廷・寺社の拠点だったため→有力な戦国大名は育たなかった。","keywords":["応仁・文明の乱","足利義政","日野富子","細川勝元","山名宗全","足軽","下剋上","明応の政変","松永久秀","北条早雲","毛利元就","寄親・寄子制","分国法","喧嘩両成敗法","貫高制"],"blanks":[{"q":"1467〜77年、将軍家・管領家の後継争いに守護大名の勢力争いが絡んで【　】が起こった。","a":"応仁・文明の乱","h":"細川方（東軍）と山名方（西軍）"},{"q":"8代将軍【　】の失政と正妻日野富子との関係悪化が応仁・文明の乱の一因となった。","a":"足利義政","h":"芸術・造営事業の浪費"},{"q":"応仁・文明の乱では、東軍の【　】と西軍の山名宗全が勢力を争った。","a":"細川勝元","h":"管領家"},{"q":"応仁・文明の乱で京都を荒廃させた雑兵を【　】という。","a":"足軽","h":"略奪・放火を行った"},{"q":"下の者が上の者の勢力をしのいでいく風潮を【　】という。","a":"下剋上","h":"守護代や国人が守護大名の領国を奪った"},{"q":"1493年、管領細川政元が10代将軍義材を11代義澄と交替させた事件を【　】という。","a":"明応の政変","h":"管領による将軍のすげ替え"},{"q":"1565年、松永久秀や三好三人衆は13代将軍【　】を殺害した。","a":"足利義輝","h":"のち東大寺大仏殿が焼け落ちる"},{"q":"堀越公方足利政知の遺児茶々丸を滅ぼし伊豆を奪ったのは【　】である。","a":"北条早雲","h":"伊勢宗瑞。のち小田原を本拠とする"},{"q":"1555年の厳島の戦いで陶晴賢を滅ぼした安芸の国人は【　】である。","a":"毛利元就","h":"のち尼子氏も滅ぼし中国全土を支配"},{"q":"戦国大名は国人・地侍を家臣化するため、親子関係に似た【　】制を整えた。","a":"寄親・寄子","h":"長槍・鉄砲を使う集団戦が可能になった"},{"q":"私闘を禁止し自力救済を否定した分国法の規定を【　】という。","a":"喧嘩両成敗法","h":"家臣団統制のための規定"},{"q":"伊達稙宗が制定した171条からなる最大の分国法は『【　】』である。","a":"塵芥集","h":"陸奥の伊達氏"}],"mc":[{"q":"応仁・文明の乱の原因として誤っているものはどれか。","c":["8代将軍義政の失政と日野富子との関係悪化","足利義視と足利義尚の将軍家後継争い","畠山氏・斯波氏の家督継承問題","細川政元による将軍の交替"],"a":3,"e":"細川政元の将軍交替は1493年の明応の政変で、乱後の出来事。乱の原因は義政の失政、将軍家・管領家の後継争い、細川勝元と山名宗全の勢力争い。"},{"q":"応仁・文明の乱が全国に波及した経緯として最も適当なものはどれか。","c":["幕府が全国の守護に出兵を命じたため","1477年の和議後に守護大名が領国に下り、地域紛争が広がったため","西軍が京都を放棄して地方に逃れたため","一向一揆が全国で蜂起したため"],"a":1,"e":"戦いに疲れた両軍が1477年に和議を結び、守護大名の多くが領国に下ったことで地域的紛争が全国に広がった。"},{"q":"応仁・文明の乱の結果として正しいものはどれか。","c":["将軍の支配力は畿内全域に強化された","荘園公領制が再建され公家が力を回復した","将軍の支配力はほぼ山城国一国のみとなった","守護大名の連合政権が確立した"],"a":2,"e":"幕府権威は失墜し、将軍の支配力は山城国のみに。幕府は守護大名の連合政権という形式もとれなくなり、荘園公領制・守護領国制も崩れた。"},{"q":"応仁・文明の乱後に文化の地方普及が進んだ背景として最も適当なものはどれか。","c":["幕府が地方に学校を建てたため","戦国大名が京都を占領したため","明との貿易が地方港に移ったため","公家・僧侶が没落して地方に下向したため"],"a":3,"e":"京都の荒廃・焼失により公家・僧侶が没落・地方下向し、朝廷の機能低下とともに文化の地方普及が進んだ。"},{"q":"戦国大名の出自について正しいものはどれか。","c":["武田氏・今川氏は守護代出身である","上杉氏・朝倉氏は守護大名出身である","毛利氏・長宗我部氏は国人など地方武士出身である","北条早雲は守護大名出身である"],"a":2,"e":"武田・今川・島津は守護、上杉・朝倉・織田は守護代、伊達・毛利・長宗我部は国人出身。北条早雲は伊勢氏出身でその他に分類される。"},{"q":"戦国大名が寄親・寄子制を採用した目的として最も適当なものはどれか。","c":["家臣団内の連携をはかり集団戦を可能にするため","荘園領主に年貢を納めるため","幕府から守護職を得るため","農民の逃散を防ぐため"],"a":0,"e":"国人・地侍を家臣化し、親子関係に似た協力体制を維持することで、長槍・鉄砲を使う集団戦が可能になった。"},{"q":"喧嘩両成敗法の意味として正しいものはどれか。","c":["喧嘩の当事者双方を処罰し、私闘を禁じて自力救済を否定する","喧嘩で勝った側に領地を与える","家臣同士の私的同盟を奨励する","領地の自由売買を認める"],"a":0,"e":"喧嘩両成敗法は私闘の禁止・自力救済の否定であり、大名が紛争解決を独占して家臣団を統制するための規定。"},{"q":"戦国大名の土地支配について正しいものはどれか。","c":["荘園公領制を維持し荘園領主を通じて農民を支配した","自己申告制の指出検地により貫高制に基づく軍役を課した","石高制に基づいて軍役を課した","検地を行わず家臣の申告を認めなかった"],"a":1,"e":"戦国大名は荘園公領制を否定し、指出検地で把握した貫高に基づき家臣に軍役を課した。石高制は後の豊臣政権のもの。"}],"order":[{"title":"応仁の乱から戦国へ","items":["応仁・文明の乱の勃発","9代将軍義尚の就任","両軍の和議","明応の政変","13代将軍義輝の殺害"],"e":"1467年勃発→1473年義政引退・義尚就任→1477年和議→1493年細川政元の政変→1565年松永久秀らによる義輝殺害。"},{"title":"畿内の実権者の移り変わり","items":["細川政元","細川晴元","三好長慶","松永久秀"],"e":"明応の政変の細川政元→管領細川晴元→重臣三好長慶が晴元を追放→長慶の死後、家臣松永久秀が実権を握った。"},{"title":"中国地方の動き","items":["大内義隆の滅亡","厳島の戦い","尼子氏の滅亡","毛利氏の中国全土支配"],"e":"1551年陶晴賢が大内義隆を滅ぼす→1555年厳島の戦いで毛利元就が陶晴賢を破る→のち出雲の尼子氏も滅ぼし→中国全土を支配。"}]},{"title":"室町時代の産業と都市の発展","flow":[{"y":"","t":"農業の集約化・多角化","s":"竜骨車の導入、刈敷・草木灰に加え下肥の普及、早稲・中稲・晩稲の品種改良、畿内の三毛作","why":"耕地面積が狭いため集約化・多角化を進める必要があった"},{"y":"","t":"商品作物の多様化","s":"楮・桑・茶・漆・藍・荏胡麻・苧・綿花などが広く流通した","why":"代銭納の普及と手工業の発達により農作物が商品化したため"},{"y":"","t":"手工業の発達と座の結成","s":"全国的に同業者組合の座が結ばれ、絹織物・和紙・陶器・漆器・刀剣など各地で特産物が生産された","why":""},{"y":"","t":"鉱山の開発","s":"15世紀前半に明・朝鮮向け輸出品として銅の需要が増え、金山・銀山の開発も進んだ","why":"明・朝鮮との貿易や戦国大名の勢力拡大のため"},{"y":"","t":"貨幣経済の発達","s":"年貢の代銭納が一般化し、為替（割符）の利用が増加。宋銭・明銭に加え鐚銭も流通した","why":"遠隔地取引が拡大したため"},{"y":"","t":"撰銭令の発布","s":"撰銭行為が流通を阻害したため、幕府・大名・惣村がそれぞれ撰銭令を出したが効果は不十分","why":"悪銭が横行し良銭を選ぶ撰銭が増えたため"},{"y":"","t":"交通・運送業の発達","s":"廻船、馬借・車借が発達し、問丸が卸売商人の問屋に発展した","why":"地方産業の発達で遠隔地取引が活発化したため"},{"y":"","t":"関所の発達","s":"困窮した幕府・公家・寺社が関銭・津料を徴収し、流通を阻害した","why":"荘園公領制の崩壊で幕府・公家・寺社が困窮したため"},{"y":"1500","t":"祇園祭の再興","s":"京都の町衆が月行事を中心に祇園祭を再興した","why":"自らの生命と財産を護るために町衆が結合したため"},{"y":"","t":"都市の発達","s":"城下町・門前町・寺内町・港町が各地に発達し、堺・博多は自治都市として繁栄した","why":""}],"story":"耕地面積が狭いため→室町時代の農業は集約化・多角化を進め、【刈敷】・草木灰に加え【下肥】が普及し、二毛作・三毛作が広がった。【代銭納】の普及と手工業の発達が原因で→楮・桑・茶・綿花などの商品作物が広く流通した。同業者組合の【座】が全国に結成され、西陣の絹織物、三河の綿織物、美濃紙、瀬戸焼などの特産物が生まれ、明・朝鮮向けの銅需要と戦国大名の勢力拡大のため→金山・銀山が開発された。遠隔地取引の拡大で為替（割符）が使われ、【宋銭】・【明銭】に加え鐚銭も流通したため→良銭を選ぶ【撰銭】が横行して流通を阻害し→幕府・大名・惣村は【撰銭令】を出したが効果は不十分だった。幕府は【土倉】・酒屋を保護して土倉役・酒屋役を取った。地方産業の発達で遠隔地取引が活発化したため→廻船や【馬借】・【車借】が発達し、問丸は【問屋】へ発展した。一方、荘園公領制の崩壊で困窮した幕府・公家・寺社は【関所】で関銭・津料を取り流通を妨げた。都市では城下町・門前町・寺内町・港町が発達し、京都の【町衆】は1500年に祇園祭を再興、【堺】は36人の会合衆、【博多】は12人の年行司が自治を行う自由都市となった。","keywords":["下肥","三毛作","座","代銭納","撰銭令","土倉","馬借","問屋","関銭","城下町","門前町","寺内町","町衆","会合衆","年行司"],"blanks":[{"q":"室町時代、刈敷・草木灰に加え【　】の使用が肥料として普及した。","a":"下肥","h":"人糞尿の肥料。干鰯は江戸時代"},{"q":"室町時代には二毛作が普及し、畿内では米・蕎麦・麦などの【　】が始まった。","a":"三毛作","h":"1年に3回作付け"},{"q":"室町時代には全国的に同業者組合の【　】が結成され、各地で特産物の生産が発達した。","a":"座","h":"大山崎の油座など"},{"q":"京都西陣・丹後・加賀・筑前博多などは【　】の産地として知られた。","a":"絹織物","h":"西陣が代表"},{"q":"朝鮮から伝わった綿花の栽培が戦国期に始まり、三河などで【　】が作られた。","a":"綿織物","h":"三河木綿"},{"q":"離宮八幡宮に所属し石清水八幡宮を本所とした座は大山崎の【　】である。","a":"油座","h":"油座神人"},{"q":"室町時代には年貢の銭納である【　】が一般化した。","a":"代銭納","h":"貨幣経済の発達"},{"q":"室町時代には宋銭のほか、洪武通宝・宣徳通宝などの【　】が流通した。","a":"明銭","h":"統一貨幣はなかった"},{"q":"幕府・大名・惣村は、悪銭と良銭の交換率を定め特定の悪銭流通を禁止する【　】を発布した。","a":"撰銭令","h":"効果は不十分だった"},{"q":"幕府は土倉役・酒屋役を得るかわりに、都市金融業者の【　】・酒屋を保護した。","a":"土倉","h":"高利貸業者"},{"q":"都市近郊の運送業者として【　】・車借が発達した。","a":"馬借","h":"馬で運ぶ業者"},{"q":"運送業者だった問丸は、商品の運送・保管・売買を行う卸売商人の【　】に発展した。","a":"問屋","h":"商人宿も兼ねた"}],"mc":[{"q":"室町時代に農業の集約化・多角化が進められた背景として最も適当なものはどれか。","c":["耕地面積が狭かったため","幕府が大規模開墾を禁じたため","明から新しい農具が大量に輸入されたため","人口が減少して労働力が余ったため"],"a":0,"e":"耕地面積が狭いため、灌漑・肥料・品種改良・二毛作などで単位面積あたりの生産を高める必要があった。"},{"q":"室町時代に商品作物が広く流通するようになった背景として最も適当なものはどれか。","c":["幕府が商品作物の栽培を義務づけたため","代銭納の普及と手工業の発達により農作物が商品化したため","荘園領主が現物納を強制したため","撰銭令により貨幣が使えなくなったため"],"a":1,"e":"年貢の代銭納が普及して農民が銭を必要とし、手工業の発達で原料需要が高まったため、楮・桑・茶・綿花などが商品として流通した。"},{"q":"室町時代に鉱山の開発が進んだ理由として最も適当なものはどれか。","c":["幕府が貨幣を鋳造したため","銀を明への朝貢品にしたため","明・朝鮮向け輸出品として銅の需要が増え、戦国大名の勢力拡大にも必要だったため","一向一揆が鉱山を占拠したため"],"a":2,"e":"15世紀前半に明・朝鮮向けの銅需要が増え、戦国大名の富国強兵策のため甲斐・伊豆・駿河の金山や但馬・石見の銀山が開発された。"},{"q":"撰銭令が出された背景として最も適当なものはどれか。","c":["幕府が統一貨幣を発行したため","宋銭の輸入が途絶えたため","農民が銭納を拒否したため","鐚銭などの悪貨が横行し、良銭を選ぶ撰銭が流通を阻害したため"],"a":3,"e":"統一貨幣がなく私鋳銭など悪銭が横行し、精銭を選ぶ撰銭行為が円滑な流通を阻害したため、幕府・大名・惣村が撰銭令を出した。"},{"q":"室町時代に交通が発達した理由として最も適当なものはどれか。","c":["幕府が街道を整備し関所を撤廃したため","地方産業の発達により遠隔地取引が活発化したため","戦国大名が参勤交代を命じたため","明の使節が頻繁に来日したため"],"a":1,"e":"地方産業の発達で遠隔地取引が活発化し、廻船・馬借・車借・問屋が発達した。関所はむしろ増え、撤廃は戦国大名による。"},{"q":"室町時代に関所が増えた背景として最も適当なものはどれか。","c":["荘園公領制の崩壊で困窮した幕府・公家・寺社が関銭・津料を徴収したため","戦国大名が領国防衛のため設置したため","幕府が商業を統制するため","海賊対策のため港に設置したため"],"a":0,"e":"困窮した幕府・公家・寺社が収入源として関銭・津料を徴収した。流通を阻害したため、のち戦国大名により撤廃命令が出された。"},{"q":"室町時代の都市について正しいものはどれか。","c":["宇治・山田は伊勢神宮の門前町である","一乗谷は上杉氏の城下町である","吉崎は港町として発展した","堺は12人の年行司が自治を行った"],"a":0,"e":"一乗谷は朝倉氏、吉崎は寺内町、堺は36人の会合衆、博多が12人の年行司。宇治・山田は伊勢神宮の門前町。"},{"q":"京都の町衆が1500年に祇園祭を再興した背景として最も適当なものはどれか。","c":["幕府の命令で復活させたため","延暦寺が祭礼を主催したため","町衆が自らの生命と財産を護るために結合し、自治を担ったため","戦国大名が京都を支配したため"],"a":2,"e":"応仁の乱で荒廃した京都で、月行事を中心とする町衆が自治的団体を作り独自の町法を定め、祇園祭を再興した。"}],"order":[{"title":"貨幣経済と撰銭の流れ","items":["代銭納の一般化","鐚銭の大量流通","撰銭行為の増加","撰銭令の発布"],"e":"年貢の銭納が普及→統一貨幣がなく私鋳銭が流通→良銭を選ぶ撰銭が横行→幕府・大名・惣村が撰銭令を出す。"},{"title":"流通業の発達","items":["遠隔地取引の活発化","問丸の運送・保管","問屋への発展","戦国大名による関所撤廃"],"e":"地方産業の発達で遠隔地取引が盛んに→問丸が運送・保管→卸売商人の問屋に発展→流通を阻害する関所を戦国大名が撤廃。"}]},{"title":"室町時代の文化","flow":[{"y":"","t":"南北朝文化","s":"足利尊氏・直義が安国寺・利生塔を造立、夢窓疎石が天龍寺庭園を作庭、水墨画が始まる","why":"時代の転換期の緊張感を背景に歴史意識が高まった"},{"y":"1339","t":"『神皇正統記』","s":"北畠親房が南朝の立場から歴史を記述。『太平記』も南朝の立場、『梅松論』は北朝の立場","why":""},{"y":"","t":"『菟玖波集』","s":"二条良基が最古の連歌集を編纂、勅撰に準ぜられ連歌が和歌と対等の地位を築く","why":""},{"y":"","t":"五山・十刹の制度化","s":"3代将軍義満が官寺の制に倣い五山・十刹を制度化、僧録司を相国寺に置き春屋妙葩が初代僧録","why":"幕府の保護下で臨済宗を統制するため"},{"y":"","t":"北山文化","s":"義満が鹿苑寺金閣を建て、観阿弥・世阿弥父子が猿楽能を完成。狂言も発達","why":"公家文化と武家文化、大陸文化と日本文化の融合"},{"y":"","t":"東山文化","s":"8代将軍義政が慈照寺銀閣・東求堂同仁斎を建て、書院造・枯山水が登場","why":""},{"y":"","t":"雪舟・狩野派の活躍","s":"雪舟が明に渡り水墨画を大成、狩野正信・元信の狩野派が幕府御用絵師となる","why":""},{"y":"","t":"正風連歌と侘茶","s":"宗祇が正風連歌を確立、村田珠光が侘茶を創始し武野紹鷗・千利休へ","why":""},{"y":"","t":"吉田兼倶の唯一神道","s":"伊勢神道の影響を受け、反本地垂迹説に基づき神道を中心に儒教・仏教を取り入れた","why":""},{"y":"","t":"文化の地方普及","s":"応仁・文明の乱後、大内氏の山口、桂庵玄樹の薩南学派、足利学校などに文化が広がる","why":"戦国大名の城下町形成、公家・僧侶の地方疎開、連歌師の地方遍歴のため"}],"story":"室町文化は公家と武家、大陸と日本の文化の融合が進み、産業の発達に伴い連歌・能・茶の湯など集団性のある庶民文化が栄えた。【臨済宗】は幕府の保護下で発展し、義満が【五山・十刹】を制度化して五山文学・【五山版】が生まれたが、幕府に依存していたため→幕府の衰退とともに没落した。時宗は【同朋衆】を輩出し、吉田兼倶は【唯一神道】を創始した。南北朝の動乱期の緊張感を背景に→歴史意識が高まり、南朝方の『【神皇正統記】』『【太平記】』、北朝方の『【梅松論】』が書かれ、二条良基の『【菟玖波集】』で連歌が和歌と対等になった。北山文化では義満の【金閣】が建ち、【観阿弥・世阿弥】父子が猿楽能を完成、【狂言】も発達した。東山文化では義政の【銀閣】に【書院造】が登場し、【枯山水】、【雪舟】の水墨画、【狩野派】、【宗祇】の正風連歌、【御伽草子】、【村田珠光】の侘茶が生まれ、現代の伝統文化の源流となった。応仁・文明の乱後は、戦国大名の城下町形成、公家・僧侶の地方疎開、連歌師の地方遍歴が原因で→文化の地方普及が進み、大内氏の【山口】、【足利学校】、【桂庵玄樹】の薩南学派、『【節用集】』などに結実した。","keywords":["五山・十刹","五山版","唯一神道","夢窓疎石","菟玖波集","神皇正統記","太平記","金閣","世阿弥","書院造","枯山水","雪舟","狩野派","宗祇","御伽草子","村田珠光","足利学校"],"blanks":[{"q":"室町幕府の保護の下で発展し、幕府の衰退とともに没落した禅宗の宗派は【　】である。","a":"臨済宗","h":"五山・十刹の制"},{"q":"京都五山の別格に位置づけられた寺院は【　】である。","a":"南禅寺","h":"天龍寺・相国寺より上位"},{"q":"五山僧により経典や漢詩文が【　】として出版された。","a":"五山版","h":"五山文学"},{"q":"時宗からは、芸能・文芸面で活躍する将軍側近の【　】が輩出された。","a":"同朋衆","h":"阿弥号を名乗る"},{"q":"京都吉田神社の神官吉田兼倶は、反本地垂迹説に基づく【　】を創始した。","a":"唯一神道","h":"伊勢神道の影響"},{"q":"天龍寺庭園・西芳寺庭園を作庭した禅僧は【　】である。","a":"夢窓疎石","h":"尊氏・直義が帰依"},{"q":"二条良基が編纂した最古の連歌集は『【　】』である。","a":"菟玖波集","h":"勅撰に準ぜられた"},{"q":"北畠親房が南朝の立場から記した歴史書は『【　】』である。","a":"神皇正統記","h":"南朝の正統性を主張"},{"q":"観阿弥・【　】父子は3代将軍義満の保護を受けて猿楽能を完成した。","a":"世阿弥","h":"『風姿花伝』の著者"},{"q":"慈照寺東求堂同仁斎に見られる、日本の住宅建築の原型となった様式を【　】という。","a":"書院造","h":"東山文化"},{"q":"明に渡り帰国して『秋冬山水図』『天橋立図』を描いた水墨画家は【　】である。","a":"雪舟","h":"『四季山水図巻』も"},{"q":"奈良の【　】が侘茶を創始し、堺の武野紹鷗、千利休へと大成された。","a":"村田珠光","h":"茶と禅の精神の統一"}],"mc":[{"q":"室町時代に臨済宗が発展し、のち衰退した理由として最も適当なものはどれか。","c":["幕府の保護の下で発展したため、幕府の衰退とともに没落した","朝廷の保護を受けたが朝廷が没落したため","一向一揆に寺院を焼かれたため","曹洞宗に信者を奪われたため"],"a":0,"e":"義満が五山・十刹を制度化するなど幕府の保護で発展したが、その分幕府と運命を共にした。"},{"q":"南北朝文化で歴史意識が高まった背景として最も適当なものはどれか。","c":["明から歴史書が輸入されたため","時代の転換期の緊張感を背景としたため","幕府が正史の編纂を命じたため","五山僧が朱子学を禁じたため"],"a":1,"e":"南北朝の動乱という転換期の緊張感を背景に、『神皇正統記』『梅松論』『増鏡』などが書かれた。"},{"q":"南北朝期の歴史書・軍記物語について正しいものはどれか。","c":["『神皇正統記』は北朝の立場から書かれた","『太平記』は今川了俊が北朝の立場から書いた","『梅松論』は武家の立場・北朝方から書かれた","『増鏡』は南朝の正統性を主張した"],"a":2,"e":"『神皇正統記』（北畠親房）と『太平記』は南朝方、『梅松論』は北朝方、『難太平記』は今川了俊が北朝の立場で記述、『増鏡』は公家の立場の四鏡の最後。"},{"q":"『菟玖波集』が編纂された結果として正しいものはどれか。","c":["俳諧連歌が確立した","正風連歌が確立した","連歌が禁止された","連歌が勅撰に準ぜられ和歌と対等の地位を築いた"],"a":3,"e":"二条良基の『菟玖波集』は最古の連歌集で勅撰に準ぜられた。正風連歌は宗祇、俳諧連歌は宗鑑。"},{"q":"東山文化について正しいものはどれか。","c":["3代将軍義満が慈照寺銀閣を建てた","書院造が登場し日本の住宅建築の原型となった","鹿苑寺庭園は枯山水の代表である","観阿弥・世阿弥が猿楽能を完成した"],"a":1,"e":"銀閣は8代義政、鹿苑寺は北山文化、猿楽能の完成も北山文化。書院造の登場が東山文化の特色。"},{"q":"応仁・文明の乱後に文化の地方普及が進んだ理由として誤っているものはどれか。","c":["戦国大名の城下町形成","公家・僧侶の地方疎開","連歌師の地方遍歴","幕府による地方学校の設立"],"a":3,"e":"地方普及の要因は城下町形成、公家・僧侶の地方疎開、連歌師の遍歴。足利学校は関東管領上杉憲実の再興で幕府によるものではない。"},{"q":"侘茶の系譜として正しいものはどれか。","c":["村田珠光→武野紹鷗→千利休","武野紹鷗→村田珠光→千利休","千利休→武野紹鷗→村田珠光","村田珠光→千利休→武野紹鷗"],"a":0,"e":"奈良の村田珠光が創始し、堺の武野紹鷗を経て、堺の千利休が大成した。"},{"q":"文化の地方普及の例として誤っているものはどれか。","c":["大内氏の城下町山口","桂庵玄樹の薩南学派","義満による五山・十刹の制度化","万里集九の中部・関東遍歴"],"a":2,"e":"五山・十刹は京都・鎌倉中心の中央の制度。山口・薩南学派・万里集九は地方普及の典型例。"}],"order":[{"title":"室町文化の展開","items":["南北朝文化","北山文化","東山文化","戦国期の文化（地方普及）"],"e":"尊氏・直義期の南北朝文化→義満の北山文化→義政の東山文化→応仁の乱後の地方普及。"},{"title":"連歌の歩み","items":["『菟玖波集』（二条良基）","『新撰菟玖波集』（宗祇）","『犬筑波集』（宗鑑）"],"e":"南北朝期に二条良基が最古の連歌集→東山期に宗祇が正風連歌を確立→戦国期に宗鑑らが俳諧連歌を確立。"},{"title":"茶の湯の大成","items":["闘茶の流行","村田珠光の侘茶創始","武野紹鷗","千利休の大成"],"e":"南北朝期は賭け事の闘茶→東山期に村田珠光が茶と禅を統一した侘茶を創始→堺の武野紹鷗→千利休が大成。"}]}],"review":[{"q":"応仁・文明の乱が戦国大名の登場につながった経緯として最も適当なものはどれか。","c":["幕府が守護大名に領国支配を命じたため","和議後に守護大名が領国に下り、下剋上の風潮の中で守護代や国人が台頭したため","明が日本の大名を冊封したため","一向一揆が全国の守護を滅ぼしたため"],"a":1,"e":"1477年の和議後に地域紛争が全国に広がり、守護領国制が衰退して守護代・国人が領国を奪う下剋上が進み、戦国大名が登場した。"},{"q":"室町時代に文化の地方普及が進んだことと最も関係が深い出来事はどれか。","c":["応仁・文明の乱による公家・僧侶の地方下向","琉球王国の成立","コシャマインの戦い","撰銭令の発布"],"a":0,"e":"乱で京都が荒廃し公家・僧侶が地方に疎開、戦国大名の城下町形成や連歌師の遍歴と合わせて文化が地方に広がった。"},{"q":"戦国大名が城下町を建設し関所を撤廃した目的として最も適当なものはどれか。","c":["幕府への年貢を増やすため","荘園領主の権益を守るため","商業を振興して大量の物資を調達し富国強兵をはかるため","一向宗の布教を助けるため"],"a":2,"e":"戦国大名は武器や大量の物資の生産・調達が必要だったため、鉱山開発・農業振興と並んで撰銭令・楽市令・関所撤廃・城下町建設で商業を振興した。"},{"q":"室町時代の貨幣経済と流通について正しいものはどれか。","c":["幕府が統一貨幣を発行し撰銭は起こらなかった","代銭納の普及が商品作物の流通と撰銭令の背景となった","関所は戦国大名が新設したものである","土倉は運送業者で問屋は金融業者である"],"a":1,"e":"年貢の代銭納が一般化して銭の需要が高まり、農作物が商品化する一方で悪銭が横行し撰銭令が出された。土倉は金融、問屋は卸売商人。"},{"q":"琉球王国の衰退と日本の戦国期の動きを結びつけた説明として最も適当なものはどれか。","c":["南蛮貿易の発展や後期倭寇の活動、明の海禁緩和により中継貿易の役割が小さくなった","戦国大名が琉球に出兵して滅ぼした","堺・博多が明への朝貢を独占した","蠣崎氏が琉球との交易を断った"],"a":0,"e":"南蛮貿易が堺・博多を拠点に発展し、後期倭寇や明の海禁緩和で琉球を経由する必要が薄れ、中継貿易国家としての琉球は衰退した。"},{"q":"室町時代の宗教勢力の盛衰について正しいものはどれか。","c":["旧仏教は荘園の崩壊で衰え、臨済宗は幕府とともに衰退し、浄土真宗本願寺派は一向一揆を起こすほど拡大した","臨済宗は朝廷の保護で発展し幕府衰退後も繁栄した","旧仏教は荘園公領制の崩壊で勢力を回復した","日蓮宗は東国では布教せず西日本のみで拡大した"],"a":0,"e":"旧仏教は荘園崩壊で衰退、臨済宗は幕府の保護に依存したため幕府とともに没落、本願寺派は北陸・東海・畿内で一向一揆を起こすほど拡大した。"}]},{"id":10,"title":"織豊政権による統一","era":"安土桃山時代","span":"1543〜1598","oneLine":"鉄砲とキリスト教が伝わる中、信長・秀吉が旧権威を克服して天下を統一した","chain":["織田信長","豊臣秀吉","豊臣秀次","豊臣秀頼","徳川家康"],"parts":[{"title":"PART1 ヨーロッパ人の来航","flow":[{"y":"1492","t":"コロンブスの新大陸到達","s":"スペインは西廻りでアジアをめざす","why":"香辛料や金・銀の魅力、羅針盤の改良と快速帆船の普及で遠洋航海が可能になったため"},{"y":"1498","t":"ヴァスコ＝ダ＝ガマのインド航路開拓","s":"ポルトガルは東廻りでゴア→マラッカ→マカオへ進出","why":"新航路開拓・貿易拡大・キリスト教布教・植民地獲得が目的"},{"y":"1543","t":"鉄砲伝来","s":"種子島に漂着した王直の船のポルトガル人が鉄砲を伝える。島主種子島時尭が2挺購入","why":""},{"y":"1549","t":"ザビエルの来航","s":"アンジロウの案内で鹿児島に上陸、島津貴久に布教許可を得る","why":"宗教改革に対抗するカトリック（イエズス会）の海外布教のため"},{"y":"","t":"南蛮貿易の展開","s":"日本の銀と中国の生糸を交換する中継貿易。平戸・長崎・府内・鹿児島に南蛮船が来航","why":"石見大森銀山などで灰吹法により銀産出が増大し、明は海禁政策で私貿易を禁じていたため"},{"y":"","t":"キリシタン大名の発生","s":"大村純忠・有馬晴信・大友義鎮らが入信","why":"貿易と布教が一体化しており、貿易利潤を求めたため"},{"y":"1579","t":"ヴァリニャーノ来日","s":"巡察使として来日し、有馬にセミナリオ、府内にコレジオを設立","why":""},{"y":"1582","t":"天正遣欧使節の派遣","s":"大村・有馬・大友の三大名が4少年をローマへ派遣、教皇グレゴリウス13世に謁見","why":"ヴァリニャーノの勧めによる"},{"y":"1584","t":"スペイン船の平戸来航","s":"マニラに進出していたスペインが平戸で貿易を開始","why":""},{"y":"1590","t":"使節の帰国","s":"ヴァリニャーノが再来日し活字印刷機を伝えるが、既にバテレン追放令が出ており布教は制限された","why":""}],"story":"【マルコ＝ポーロ】の『世界の記述』や香辛料・金銀の魅力、羅針盤の改良などを背景に、15世紀後半から【大航海時代】が始まった。【ポルトガル】は東廻りで【ゴア】→【マラッカ】→【マカオ】と進出し、【1543年】に【種子島】へ漂着した商人が【鉄砲】を伝えた。【スペイン】は西廻りで【マニラ】に進出した。一方、日本では【灰吹法】の導入で【銀】の産出が急増し、中国では【生糸】の生産が増えたが、明は【海禁政策】で私貿易を禁じていた→そこで南蛮人が両者を仲介する【中継貿易】＝【南蛮貿易】が栄え、【琉球王国】は衰退した。貿易はキリスト教布教と一体化していたため、利潤を求める大名の中から【キリシタン大名】が生まれた。宗教改革に対抗するカトリックの【イエズス会】は【1549年】に【ザビエル】を鹿児島へ送り、後継者【ヴァリニャーノ】の勧めで【1582年】に【天正遣欧使節】が派遣されたが、帰国時には秀吉の【バテレン追放令】が出ており布教は制限された。","keywords":["大航海時代","ヴァスコ＝ダ＝ガマ","マカオ","マニラ","南蛮貿易","灰吹法","中継貿易","キリシタン大名","種子島","フランシスコ＝ザビエル","イエズス会","ルイス＝フロイス","ヴァリニャーノ","天正遣欧使節"],"blanks":[{"q":"15世紀後半に始まった、ヨーロッパを中心に世界の一体化が進んだ時代を【　】という。","a":"大航海時代","h":"新航路開拓・貿易拡大・布教・植民地獲得が目的"},{"q":"1498年、ヴァスコ＝ダ＝ガマがインド航路を開拓した国は【　】である。","a":"ポルトガル","h":"東廻りでアジアに到達"},{"q":"ポルトガルはゴア→マラッカ→中国の【　】へと進出した。","a":"マカオ","h":"中国の港"},{"q":"スペインはフィリピンのルソン島にある【　】へ進出した。","a":"マニラ","h":"西廻りでアジアに到達"},{"q":"南蛮貿易の背景には、灰吹法の導入による日本の【　】産出量の増大があった。","a":"銀","h":"石見大森銀山など"},{"q":"南蛮貿易は日本産の銀と中国産の生糸を交換する【　】であった。","a":"中継貿易","h":"明は海禁政策で私貿易を禁止していた"},{"q":"1543年、種子島に漂着した【　】人が鉄砲を伝えた。","a":"ポルトガル","h":"中国の密貿易商人王直の船に乗っていた"},{"q":"鉄砲の国産化が進んだ和泉国の都市は【　】である。","a":"堺","h":"近江の国友、紀伊の根来・雑賀も産地"},{"q":"1549年、イエズス会のフランシスコ＝【　】が鹿児島に来航し布教を始めた。","a":"ザビエル","h":"アンジロウの案内、島津貴久に許可を得る"},{"q":"1579年に巡察使として来日し、府内にコレジオを設立したのは【　】である。","a":"ヴァリニャーノ","h":"天正遣欧使節の派遣を提案した"},{"q":"大村純忠・有馬晴信・大友義鎮が1582年に派遣した使節を【　】という。","a":"天正遣欧使節","h":"伊東マンショら4少年がローマへ"},{"q":"織田信長の庇護を受けて京都に南蛮寺、安土にセミナリオを設立したのは【　】である。","a":"オルガンティーノ","h":"イタリア人宣教師"}],"mc":[{"q":"南蛮貿易が盛んになった背景として正しいものはどれか。","c":["日本の生糸生産が増大し中国へ輸出したため","明が海禁政策をやめ日本との貿易を認めたため","灰吹法の導入で日本の銀産出量が増大したため","琉球王国が中継貿易を独占したため"],"a":2,"e":"石見大森銀山などで灰吹法により銀産出が増大し、明の海禁政策のもとで南蛮人が日本の銀と中国の生糸を仲介した。"},{"q":"ポルトガルとスペインのアジア到達の仕方について正しいものはどれか。","c":["ポルトガルは西廻り、スペインは東廻りで到達した","ポルトガルは東廻り、スペインは西廻りで到達した","両国とも東廻りで到達した","両国とも西廻りで到達した"],"a":1,"e":"ポルトガルはインド航路（東廻り）でゴア る","why":""},{"y":"1576","t":"安土城築城開始","s":"五層七重の天守閣をもつ初の本格的近世城郭。1577年に安土山下町に楽市令","why":""},{"y":"1580","t":"石山戦争終結","s":"正親町天皇の仲介で11年の戦いが終わる","why":""},{"y":"1582","t":"本能寺の変","s":"天目山の戦いで武田氏を滅ぼした後、明智光秀に攻められ自害","why":"羽柴秀吉の毛利攻め救援に向かう途中であった"}],"story":"尾張出身の【織田信長】は、他の戦国大名と違い、つねに京都・畿内支配をねらった。【1560年】【桶狭間の戦い】で今川義元を破り、1567年に美濃を制圧して【岐阜城】に移り、「【天下布武】」の印章を用いた。1568年には【足利義昭】を奉じて入京し15代将軍としたが、義昭と対立→【1573年】に義昭を追放して【室町幕府】を滅亡させた。統一の要因は、京都に近く濃尾平野を抱える地理的有利、【足軽】の長槍隊・鉄砲隊と常備軍という軍事力、そして旧来の秩序・権威を克服する革新性であった。経済面では南蛮貿易の拠点で鉄砲の産地である【堺】を直轄化し、加納や安土山下町に【楽市令】を出して商工業を掌握した。宗教面では旧権力を打破するため【延暦寺焼打ち】・【安土宗論】・【石山戦争】で仏教を弾圧する一方、キリスト教は保護した。【1575年】【長篠の戦い】で鉄砲隊により武田を破り、【安土城】を築いたが、【1582年】【本能寺の変】で【明智光秀】に攻められ自害した。","keywords":["織田信長","天下布武","桶狭間の戦い","足利義昭","姉川の戦い","石山戦争","延暦寺焼打ち","長篠の戦い","安土城","楽市令","堺","安土宗論","本能寺の変","明智光秀"],"blanks":[{"q":"織田信長は「【　】」の印章を用いて畿内と周辺の統一を進めた。","a":"天下布武","h":"美濃制圧後に使用"},{"q":"1560年、織田信長が今川義元を破った戦いは【　】である。","a":"桶狭間の戦い","h":"尾張国"},{"q":"1568年、信長は【　】を奉じて入京し、15代将軍とした。","a":"足利義昭","h":"13代将軍義輝の弟"},{"q":"1571年、信長は浅井・朝倉軍を匿った比叡山【　】を焼打ちした。","a":"延暦寺","h":"天台宗の総本山"},{"q":"1573年、信長は15代将軍義昭を追放し、【　】を滅亡させた。","a":"室町幕府","h":"義昭は備後国鞆の浦で抵抗を続けた"},{"q":"1575年、織田・徳川連合軍が足軽鉄砲隊で武田勝頼を破った戦いは【　】である。","a":"長篠の戦い","h":"三河国"},{"q":"1576年、信長は琵琶湖畔に【　】の築城を開始した。","a":"安土城","h":"五層七重の天守閣をもつ初の本格的近世城郭"},{"q":"1582年、信長は本能寺の変で重臣の【　】に攻められ自害した。","a":"明智光秀","h":"毛利攻めの救援に向かう途中"},{"q":"信長は南蛮貿易の拠点で鉄砲の産地である自治都市【　】を直轄地とした。","a":"堺","h":"会合衆に2万貫の矢銭を要求"},{"q":"信長は美濃加納や安土山下町に【　】を出し、都市・市場の繁栄をめざした。","a":"楽市令","h":"楽市・楽座"},{"q":"信長は1570年から本願寺11世顕如と【　】を戦い、1580年に終結した。","a":"石山戦争","h":"正親町天皇の仲介で終結"},{"q":"1579年、信長は【　】により日蓮宗を弾圧し、京都町衆の団結を阻止した。","a":"安土宗論","h":"宗教政策の一つ"}],"mc":[{"q":"織田信長がほかの戦国大名と明らかに違っていた点はどれか。","c":["領国の農業振興のみを重視した","つねに京都・畿内支配をねらっていた","仏教勢力と協調して支配を進めた","南蛮貿易を禁止した"],"a":1,"e":"信長は尾張から一貫して京都・畿内支配をめざし、義昭を奉じて入京、のち幕府を滅ぼした。"},{"q":"信長が堺を直轄地とした理由として最も適当なものはどれか。","c":["石山本願寺の門前町であったため","室町幕府の直轄地であったため","南蛮貿易の拠点で鉄砲の産地であったため","朝廷の所領であったため"],"a":2,"e":"堺は南蛮貿易の拠点かつ鉄砲の産地であり、1569年に会合衆へ矢銭を要求して直轄化した。"},{"q":"1571年の比叡山延暦寺焼打ちの直接の理由はどれか。","c":["延暦寺が日蓮宗と対立したため","延暦寺が浅井・朝倉連合軍を匿ったため","延暦寺が一向一揆を指導したため","延暦寺がキリスト教を保護したため"],"a":1,"e":"姉川の戦い後、延暦寺が浅井・朝倉軍を匿ったため焼打ちし、旧権力を打破した。"},{"q":"信長が楽市令を出した目的として正しいものはどれか。","c":["寺社の座を保護し商業を統制するため","関所を増やして通行税を得るため","新興商人の自由な営業を認め商工業を掌握するため","農民の武器を没収するため"],"a":2,"e":"楽市令は特定の都市・市場の繁栄をめざし、新興商人の自由営業と諸役免除などの優遇で商工業の再編・掌握をはかった。"},{"q":"1575年の長篠の戦いで信長が勝利した要因はどれか。","c":["武田の騎馬隊を多数の足軽鉄砲隊で破ったため","正親町天皇の仲介で武田が降伏したため","上杉謙信の援軍を得たため","武田信玄が戦いの直前に病死したため"],"a":0,"e":"長篠の戦いでは多数の足軽鉄砲隊で武田勝頼の騎馬隊を破った。信玄の病死は1572年の三方ヶ原の戦い後。"},{"q":"信長の宗教政策について正しいものはどれか。","c":["キリスト教を弾圧し仏教を保護した","仏教を弾圧しキリスト教を保護した","仏教・キリスト教ともに弾圧した","仏教・キリスト教ともに保護した"],"a":1,"e":"天台宗・日蓮宗・浄土真宗を弾圧する一方、ルイス＝フロイスやオルガンティーノらを保護した。"},{"q":"石山戦争が終結した経緯として正しいものはどれか。","c":["明智光秀の裏切りで信長が撤退した","正親町天皇の仲介で11年に及ぶ戦いが終結した","顕如が信長に討たれた","足利義昭の命令で和睦した"],"a":1,"e":"1570年に始まった石山戦争は、1580年に正親町天皇の仲介で終結した。"},{"q":"信長が本能寺の変で自害したときの状況として正しいものはどれか。","c":["武田氏との天目山の戦いに向かう途中であった","羽柴秀吉の毛利攻めの救援に向かう途中であった","上杉謙信との戦いの最中であった","石山本願寺攻めの最中であった"],"a":1,"e":"1582年、天目山で武田氏を滅ぼした後、秀吉の毛利攻め救援に向かう途中の京都本能寺で明智光秀に攻められた。"}],"order":[{"title":"信長の統一過程（前半）","items":["桶狭間の戦い","稲葉山城の戦い","足利義昭を奉じて入京","姉川の戦い","室町幕府滅亡"],"e":"1560年桶狭間→1567年美濃制圧→1568年入京→1570年姉川→1573年幕府滅亡。"},{"title":"信長の統一過程（後半）","items":["長篠の戦い","安土城築城開始","石山戦争終結","天目山の戦い","本能寺の変"],"e":"1575年長篠→1576年安土城→1580年石山戦争終結→1582年天目山で武田氏滅亡→同年本能寺の変。"},{"title":"信長の仏教弾圧","items":["石山戦争開始","比叡山延暦寺焼打ち","伊勢長島の一向一揆平定","安土宗論"],"e":"1570年石山戦争開始→1571年延暦寺焼打ち→1574年伊勢長島→1579年安土宗論。"}]},{"title":"PART3 豊臣秀吉による統一","flow":[{"y":"1582","t":"山崎の戦い","s":"羽柴秀吉が明智光秀を破る。山城国で太閤検地を開始","why":"本能寺で主君信長を失ったため主君の仇を討った"},{"y":"1583","t":"賤ヶ岳の戦い・大坂城築城開始","s":"柴田勝家を破り、石山本願寺跡に大坂城を築き始める","why":""},{"y":"1584","t":"小牧・長久手の戦い","s":"織田信雄・徳川家康と戦い引き分ける","why":""},{"y":"1585","t":"関白就任・四国平定","s":"近衛家の養子となり正親町天皇の関白に。翌年太政大臣・豊臣姓。長宗我部元親を平定","why":"以後、朝廷の権威を利用して統一をめざしたため"},{"y":"1587","t":"惣無事令・九州平定・バテレン追放令","s":"島津義久を平定し、博多で宣教師追放を命じる","why":"長崎寄進や奴隷輸出を領土的野心とみなし、統一支配の障害と懸念したため"},{"y":"1588","t":"聚楽第行幸・刀狩令・海賊取締令","s":"後陽成天皇の行幸で諸大名に忠誠を誓わせる。刀狩で兵農分離を促進","why":"一揆防止と兵農分離の促進のため"},{"y":"1590","t":"小田原攻め・奥州平定","s":"北条氏を滅ぼし、伊達政宗らを従え天下統一","why":""},{"y":"1591","t":"身分統制令・関白を秀次に譲る","s":"秀吉は太閤を称する","why":"兵農分離の固定のため"},{"y":"1592","t":"文禄の役","s":"名護屋城を本陣に約16万を出兵。李舜臣の水軍や義兵、明の援軍で苦戦","why":"朝鮮・明の征服と国内の領土的行き詰まりへの大名対策"},{"y":"1597","t":"慶長の役","s":"講和決裂で再出兵するが苦戦。1598年秀吉死去で撤兵","why":""}],"story":"尾張の農村出身で織田信長に仕えた【羽柴秀吉】は、【1582年】【山崎の戦い】で【明智光秀】を破り、翌年【賤ヶ岳の戦い】で柴田勝家を破って信長の後継争いに勝利し、石山本願寺跡に【大坂城】を築き始めた。1584年の【小牧・長久手の戦い】で家康と引き分けたため→以後は朝廷の権威を利用する方針に転じ、【1585年】【関白】、1586年に太政大臣となり【豊臣】姓を賜った。1587年に【惣無事令】を出して九州を平定し、1590年の【小田原攻め】と奥州平定で天下統一を達成した。国内では【太閤検地】で石高制と一地一作人の原則を確立し、【刀狩令】・身分統制令で【兵農分離】を進めた。対外的には貿易奨励のため【バテレン追放令】は不徹底に終わり、明征服と大名対策のため【文禄・慶長の役】を起こしたが、李舜臣の水軍や明の援軍で苦戦→秀吉の死で撤兵し豊臣政権は衰退した。政権は独裁色が強く、【五奉行】・【五大老】や蔵入地・直轄都市・豪商の財力に支えられた。","keywords":["山崎の戦い","賤ヶ岳の戦い","大坂城","関白","惣無事令","聚楽第","太閤検地","石高制","刀狩令","兵農分離","身分統制令","五奉行","五大老","バテレン追放令","文禄・慶長の役"],"blanks":[{"q":"1582年、羽柴秀吉が明智光秀を破った戦いは【　】である。","a":"山崎の戦い","h":"山城国"},{"q":"1583年、秀吉は石山本願寺跡に【　】の築城を開始した。","a":"大坂城","h":"賤ヶ岳の戦いの後"},{"q":"1585年、秀吉は近衛家の養子となり正親町天皇の【　】に就任した。","a":"関白","h":"朝廷の権威を利用"},{"q":"1586年、秀吉は太政大臣となり後陽成天皇より【　】姓を賜った。","a":"豊臣","h":""},{"q":"1587年、秀吉は関白として全国に【　】を発布した。","a":"惣無事令","h":"大名間の戦いを禁じる"},{"q":"1588年、後陽成天皇が京都の【　】に行幸し、諸大名は秀吉に忠誠を誓った。","a":"聚楽第","h":""},{"q":"秀吉が1582年から実施した検地を【　】という。","a":"太閤検地","h":"天正の石直し"},{"q":"太閤検地により、貫高制から【　】へ移行した。","a":"石高制","h":"田畑の生産力を石高で表示"},{"q":"1588年、方広寺の大仏造営を口実に農民の武器を没収した法令は【　】である。","a":"刀狩令","h":"兵農分離の促進"},{"q":"五奉行の顧問である最有力大名を【　】といい、徳川家康らが務めた。","a":"五大老","h":"小早川隆景の死後にこう呼ばれた"},{"q":"1592〜93年の朝鮮侵略を【　】という。","a":"文禄の役","h":"壬辰倭乱"},{"q":"文禄の役で亀甲船を使って日本軍を苦しめた朝鮮水軍の指揮者は【　】である。","a":"李舜臣","h":""}],"mc":[{"q":"小牧・長久手の戦いの後、秀吉の統一方針はどう変わったか。","c":["軍事力のみで諸大名を従えるようになった","朝廷の権威を利用しつつ統一をめざすようになった","室町幕府を再興しようとした","キリスト教を保護して大名を従えた"],"a":1,"e":"家康と引き分けた後、関白・太政大臣就任や豊臣姓など朝廷の権威を利用し、毛利・上杉・家康らを臣従させた。"},{"q":"太閤検地の意義として正しいものはどれか。","c":["荘園公領制が復活した","貫高制から石高制へ移行し、荘園公領制が最終的に解体した","農民の武器が没収された","全国の戸口調査が実施された"],"a":1,"e":"太閤検地で石高制と一地一作人の原則が確立し、荘園公領制は最終的に解体した。武器没収は刀狩、戸口調査は秀次の人掃令。"},{"q":"刀狩令が出された目的として最も適当なものはどれか。","c":["朝鮮出兵の武器を確保するため","検地反対などの一揆防止と兵農分離の促進のため","キリシタン大名を弾圧するため","海賊を取り締まるため"],"a":1,"e":"方広寺の大仏造営を口実に農民から武器を没収し、一揆を防ぎ兵農分離を進めて近世身分制度の基礎を確立した。"},{"q":"バテレン追放令が不徹底に終わった理由はどれか。","c":["キリシタン大名が反乱を起こしたため","秀吉が南蛮貿易を奨励したため","天皇が布教を許可したため","宣教師が全員国外退去したため"],"a":1,"e":"宣教師の20日以内の退去を命じたが、貿易は奨励したため追放は不徹底に終わった。"},{"q":"秀吉が朝鮮侵略を行った目的として正しいものはどれか。","c":["朝鮮・明の征服と国内の領土的行き詰まりへの大名対策","キリスト教の海外布教","琉球王国の中継貿易の復活","後期倭寇の保護"],"a":0,"e":"秀吉はアジア各地に服属を要求して拒否され、明征服の過程と大名対策のため出兵した。"},{"q":"文禄の役で日本軍が苦戦し長期化した要因として誤っているものはどれか。","c":["李舜臣率いる朝鮮水軍の活躍","民衆が蜂起した義兵の抵抗","明の援軍","徳川家康の裏切り"],"a":3,"e":"苦戦の要因は朝鮮水軍・義兵・明の援軍。家康は出兵しなかったが裏切ったわけではない。"},{"q":"朝鮮侵略の影響として正しいものはどれか。","c":["豊臣政権が強化され家康が失脚した","朝鮮の陶工により有田焼などのお国焼きが生まれた","明との勘合貿易が再開した","琉球王国が日本に服属した"],"a":1,"e":"出兵せず力を温存した家康に対し豊臣政権は衰退。文化面では活字印刷術や陶磁器の新技法が伝来した。"},{"q":"豊臣政権の政治組織について正しいものはどれか。","c":["五大老が実務を担当し、五奉行がその顧問であった","五奉行が実務を担当し、五大老がその顧問であった","五奉行は徳川家康が首座であった","政治組織は整備され秀吉の独裁は抑えられた"],"a":1,"e":"浅野長政・石田三成ら五奉行が実務、徳川家康・前田利家ら五大老が顧問。独裁色が強く未整備であった。"}],"order":[{"title":"秀吉の統一過程","items":["山崎の戦い","賤ヶ岳の戦い","小牧・長久手の戦い","九州平定","小田原攻め"],"e":"1582年山崎→1583年賤ヶ岳→1584年小牧・長久手→1587年九州平定→1590年小田原攻めで関東平定。"},{"title":"秀吉と朝廷","items":["関白就任","豊臣姓を賜る","聚楽第行幸","関白を秀次に譲り太閤を称す"],"e":"1585年関白→1586年太政大臣・豊臣姓→1588年後陽成天皇行幸→1591年太閤。"},{"title":"兵農分離政策と対外政策","items":["太閤検地開始","バテレン追放令","刀狩令","文禄の役","慶長の役"],"e":"1582年検地開始→1587年追放令→1588年刀狩→1592年文禄の役→1597年慶長の役。"}]},{"title":"PART4 安土桃山時代の文化","flow":[{"y":"","t":"桃山文化の特色","s":"新興大名・豪商の気風と経済力を受け豪壮・華麗。仏教色が薄れ現実的・世俗的","why":"信長の寺院弾圧で仏教色が薄れ、南蛮文化との交流があったため"},{"y":"1576","t":"安土城","s":"城郭建築の発展。安土城・大坂城・伏見城は現存せず、姫路城・犬山城が現存","why":""},{"y":"","t":"障壁画の発達","s":"狩野永徳の唐獅子図屛風、長谷川等伯の松林図屛風、海北友松の山水図屛風","why":"城郭内の御殿の襖・屛風を飾るため"},{"y":"","t":"侘茶の完成","s":"堺の千利休が侘茶を完成。妙喜庵待庵などの茶室","why":""},{"y":"1587","t":"北野大茶湯","s":"秀吉が開催。茶の湯は大名・豪商のたしなみに","why":""},{"y":"1590","t":"活字印刷機の伝来","s":"ヴァリニャーノが伝え、天草版平家物語・日葡辞書などキリシタン版が出版","why":""},{"y":"","t":"南蛮文化の受容","s":"油絵・銅版画、天文学・医学、セミナリオ・コレジオ、外来語","why":"南蛮人との交流により新たな文物がもたらされたため"},{"y":"","t":"朝鮮出兵の文化的影響","s":"陶工の来日で有田焼・萩焼などお国焼き、活字印刷術で慶長版本","why":"秀吉の朝鮮侵略で陶工や活字印刷術が伝わったため"},{"y":"","t":"阿国歌舞伎","s":"出雲阿国が京都でかぶき踊りを開始。女歌舞伎→若衆歌舞伎→野郎歌舞伎へ","why":""}],"story":"織豊政権期の文化を【桃山文化】という。新興の大名や【豪商】の気風・経済力を受けて豪壮・華麗で力強く、信長の寺院弾圧のため仏教色が薄れ現実的・世俗的で、南蛮文化の受容と伝統文化の復興が均衡を保つ多彩な性格をもった。鉄砲伝来で築城法が変わり→【姫路城】や【犬山城】などの城郭建築が発達し、御殿には書院造が取り入れられ、その襖・屛風を飾る【障壁画】が発達した。【狩野永徳】の【唐獅子図屛風】、【長谷川等伯】の【松林図屛風】、海北友松の山水図屛風が代表作である。堺の【千利休】が【侘茶】を完成させ、秀吉も【北野大茶湯】を開いた。朝鮮出兵で陶工が来日したため→【有田焼】・萩焼など【お国焼き】が生まれ、活字印刷術も伝わり後陽成天皇が【慶長版本】を出版した。芸能では【出雲阿国】の【阿国歌舞伎】や三味線を用いる【人形浄瑠璃】が始まった。南蛮人からは油絵・銅版画、天文学・医学が伝わり、【ヴァリニャーノ】の活字印刷機で【天草版】が出版され、【セミナリオ】・【コレジオ】で教育が行われた。","keywords":["桃山文化","姫路城","障壁画","狩野永徳","唐獅子図屛風","長谷川等伯","松林図屛風","千利休","侘茶","阿国歌舞伎","人形浄瑠璃","お国焼き","天草版","セミナリオ","コレジオ"],"blanks":[{"q":"織豊政権期の文化を【　】文化という。","a":"桃山","h":"安土桃山時代"},{"q":"白鷺城と呼ばれ世界文化遺産に登録された播磨国の城は【　】である。","a":"姫路城","h":"現存する城郭建築"},{"q":"桃山文化では、襖や屛風に濃絵や水墨画で描く【　】が発達した。","a":"障壁画","h":"城郭内の御殿を飾った"},{"q":"「唐獅子図屛風」「檜図屛風」を描き、信長・秀吉に仕えた画家は【　】である。","a":"狩野永徳","h":"洛中洛外図屛風も"},{"q":"「松林図屛風」を描いた水墨画家は【　】である。","a":"長谷川等伯","h":"智積院襖絵も"},{"q":"「山水図屛風」を水墨画で描いたのは【　】である。","a":"海北友松","h":""},{"q":"堺の【　】により侘茶が完成した。","a":"千利休","h":"宗易。茶の三宗匠の一人"},{"q":"1587年に豊臣秀吉が開催した大規模な茶会を【　】という。","a":"北野大茶湯","h":"北野大茶会"},{"q":"【　】が京都でかぶき踊りを始め、阿国歌舞伎と呼ばれた。","a":"出雲阿国","h":"のち女歌舞伎→若衆歌舞伎→野郎歌舞伎"},{"q":"琉球の三線を改良した【　】を伴奏に、浄瑠璃節と人形操りが合体して人形浄瑠璃が生まれた。","a":"三味線","h":""},{"q":"1590年にヴァリニャーノが伝えた活字印刷機で出版されたローマ字体主体の書物を【　】という。","a":"天草版","h":"キリシタン版。天草版平家物語など"},{"q":"ヴァリニャーノが府内に設置した大学・宣教師養成学校を【　】という。","a":"コレジオ","h":"安土・有馬のセミナリオは神学校"}],"mc":[{"q":"桃山文化が豪壮・華麗で力強い性格をもった背景はどれか。","c":["公家の伝統文化が復興したため","新興の大名や豪商の気風・経済力を受けたため","仏教勢力が文化を主導したため","幕府が文化を統制したため"],"a":1,"e":"新興大名・豪商の気風と経済力を反映し、豪壮・華麗な文化となった。"},{"q":"桃山文化で仏教色が薄れた理由として最も適当なものはどれか。","c":["キリスト教が国教とされたため","織田信長が寺院を弾圧したため","寺院が地方に移転したため","仏像彫刻が禁止されたため"],"a":1,"e":"信長の寺院弾圧により仏教色が薄れ、現実的・世俗的・人間中心的な文化となった。"},{"q":"桃山文化で障壁画が発達した背景として正しいものはどれか。","c":["寺院の壁画需要が増えたため","城郭内の豪華な御殿の襖や屛風を飾る必要があったため","南蛮人が油絵を注文したため","朝廷が絵師を保護したため"],"a":1,"e":"城郭建築の発展にともない、書院造の御殿の襖・障子・屛風に濃絵や水墨画が描かれた。"},{"q":"有田焼や萩焼などのお国焼きが生まれた契機はどれか。","c":["南蛮貿易で陶磁器が輸入されたため","朝鮮出兵で連れ帰った陶工が新技法を伝えたため","千利休が茶道を大成したため","明との貿易で陶工が来日したため"],"a":1,"e":"朝鮮侵略で連れ帰った陶工（李参平ら）により陶磁器の新技法が伝来し、各地でお国焼きが創出された。"},{"q":"後陽成天皇が慶長版本を出版できた背景はどれか。","c":["ヴァリニャーノが金属活字を献上したため","朝鮮侵略時に活字印刷術が伝来したため","五山版の技術が発展したため","明から木版技術が伝わったため"],"a":1,"e":"朝鮮侵略時に木活字・銅活字の活字印刷術が伝わり、慶長版本は古活字本のはしりとなった。"},{"q":"歌舞伎の発展の順序として正しいものはどれか。","c":["女歌舞伎→阿国歌舞伎→若衆歌舞伎→野郎歌舞伎","阿国歌舞伎→若衆歌舞伎→女歌舞伎→野郎歌舞伎","阿国歌舞伎→女歌舞伎→若衆歌舞伎→野郎歌舞伎","野郎歌舞伎→若衆歌舞伎→女歌舞伎→阿国歌舞伎"],"a":2,"e":"出雲阿国の阿国歌舞伎に始まり、女歌舞伎→若衆歌舞伎→野郎歌舞伎へと発展した。"},{"q":"南蛮文化について正しいものはどれか。","c":["セミナリオは大学・宣教師養成学校である","天草版はヴァリニャーノが伝えた活字印刷機で出版された","南蛮屛風は南蛮人の画家が描いた","コレジオは安土に設置された"],"a":1,"e":"1590年にヴァリニャーノが伝えた活字印刷機で天草版が出版された。セミナリオは神学校、コレジオは府内に設置、南蛮屛風は狩野派など日本人が制作。"}],"order":[{"title":"桃山文化に関する出来事","items":["安土城築城開始","北野大茶湯","活字印刷機の伝来","文禄の役開始"],"e":"1576年安土城→1587年北野大茶湯→1590年ヴァリニャーノが活字印刷機を伝来→1592年文禄の役。"},{"title":"歌舞伎の展開","items":["阿国歌舞伎","女歌舞伎","若衆歌舞伎","野郎歌舞伎"],"e":"出雲阿国のかぶき踊りから女歌舞伎→若衆歌舞伎→野郎歌舞伎へと発展した。"}]},{"title":"PART5 資料・史料と近世","flow":[{"y":"1611","t":"慶長三陸地震津波","s":"近世の自然災害の遺物から津波被害を知る","why":""},{"y":"1657","t":"明暦の大火","s":"振袖火事。火災は人災の場合が多い","why":""},{"y":"1707","t":"富士山の宝永噴火","s":"近世の大噴火","why":""},{"y":"1783","t":"浅間山の天明噴火","s":"亡くなった母娘の人骨が出土","why":""},{"y":"1855","t":"安政江戸地震","s":"近世の地震災害","why":""},{"y":"1993","t":"日本初の世界遺産登録","s":"姫路城・法隆寺地域の仏教建造物（文化遺産）、屋久島・白神山地（自然遺産）","why":""},{"y":"1996","t":"原爆ドーム・厳島神社の登録","s":"世界遺産に登録","why":""},{"y":"2011","t":"平泉の登録","s":"「平泉―仏国土（浄土）を表す建築・庭園及び考古学的遺跡群―」が世界遺産に","why":""},{"y":"","t":"富士山の世界文化遺産登録","s":"自然遺産登録は不可となり「信仰の対象と芸術の源泉」として文化遺産へ。日本に複合遺産はない","why":""}],"story":"近世の考古学的遺物は古代・中世に比べ出土量が増え、観光地化された場所も多い。日本の世界遺産では、1993年に【姫路城】・法隆寺地域の仏教建造物（文化遺産）と【屋久島】・【白神山地】（自然遺産）が日本初の登録となり、徳川家康を東照大権現として祀る【日光の社寺】、中世〜近世の世界有数の銀山【石見銀山】遺跡、自然遺産登録が不可となり文化遺産となった【富士山】などが続く。自然災害の人骨からは、【安政江戸地震】・慶長三陸地震津波・富士山の【宝永噴火】・浅間山の【天明噴火】などで何が起こったかを学び、将来の対策につなげられる。文献史料では、【武家諸法度】の元和令（秀忠）・寛永令（家光、【参勤交代】を規定）・天和令（綱吉）を対比し、田沼時代・寛政の改革・大御所時代の【狂歌・川柳】で世相を読み取れる。【林子平】の『海国兵談』は海防の不備を説き、『方広寺鐘銘』の「国家安康」「君臣豊楽」は家康の言い掛かりで大坂の陣を招いた。【伊能忠敬】の『大日本沿海輿地全図』は世界を驚かす資料である。","keywords":["世界遺産","姫路城","日光の社寺","石見銀山","富士山","宝永噴火","天明噴火","武家諸法度","参勤交代","狂歌・川柳","海国兵談","林子平","方広寺鐘銘","伊能忠敬"],"blanks":[{"q":"1993年、法隆寺地域の仏教建造物などとともに日本初の世界遺産に登録された兵庫県の城は【　】である。","a":"姫路城","h":"白鷺城"},{"q":"徳川家康を東照大権現として祀る栃木県の世界遺産は「【　】の社寺」である。","a":"日光","h":"東照宮"},{"q":"中世〜近世にまたがる世界有数の銀山で島根県の世界遺産は【　】遺跡である。","a":"石見銀山","h":"灰吹法で銀産出が増大した"},{"q":"「信仰の対象と芸術の源泉」として世界文化遺産に登録された山は【　】である。","a":"富士山","h":"自然遺産登録は不可となった"},{"q":"1707年に宝永噴火を起こした山は【　】である。","a":"富士山","h":""},{"q":"1783年に天明噴火を起こし、母娘の人骨が出土した山は【　】である。","a":"浅間山","h":""},{"q":"1855年に起こった近世の地震は【　】である。","a":"安政江戸地震","h":""},{"q":"元和令・寛永令・天和令からなる大名統制の法令は『【　】』である。","a":"武家諸法度","h":"江戸時代の客観的文献史料"},{"q":"武家諸法度の寛永令では、毎年夏4月中の【　】が定められた。","a":"参勤交代","h":"3代将軍家光"},{"q":"『海国兵談』を著し、江戸湾の海防の不備を説いたのは【　】である。","a":"林子平","h":"「江戸の日本橋より唐、阿蘭陀迄境なしの水路也」"},{"q":"「国家安康」「君臣豊楽」の鐘銘で知られる京都の寺は【　】である。","a":"方広寺","h":"秀吉が大仏造営を口実に刀狩を行った寺"},{"q":"『大日本沿海輿地全図』をつくったのは【　】である。","a":"伊能忠敬","h":"伊能図"}],"mc":[{"q":"近世の遺物が観光地化されることの問題点と利点の組合せとして正しいものはどれか。","c":["遺物の保存が進む一方、管理費収入は減る","遺物の破壊が進み維持が難しくなる一方、管理費収入の増加や地域おこしにつながる","遺物は変化せず、地域経済も変化しない","遺物の出土量が減り、観光客も減る"],"a":1,"e":"有名観光地化は遺物破壊と維持の困難を招くが、管理費収入や地域おこしにつながる。"},{"q":"1993年に日本初の世界遺産として登録されたものの組合せとして正しいものはどれか。","c":["姫路城・法隆寺地域の仏教建造物・屋久島・白神山地","原爆ドーム・厳島神社・屋久島・富士山","日光の社寺・石見銀山・平泉・姫路城","姫路城・平泉・知床・白神山地"],"a":0,"e":"1993年登録は姫路城・法隆寺地域（文化遺産）と屋久島・白神山地（自然遺産）。原爆ドーム・厳島神社は1996年、平泉は2011年。"},{"q":"富士山が世界文化遺産として登録された経緯として正しいものはどれか。","c":["複合遺産として登録された","自然遺産登録が不可となり文化遺産として登録された","宝永噴火の遺物が評価され自然遺産となった","日光の社寺と同時に登録された"],"a":1,"e":"自然遺産登録は不可となり「信仰の対象と芸術の源泉」として文化遺産に。日本に複合遺産はない。"},{"q":"近世の自然災害で亡くなった人骨を調べる目的として最も適当なものはどれか。","c":["当時の身分制度を明らかにするため","何が起こりどう復興したかを知り将来の対策を学ぶため","災害の年号を確定するため","観光資源として展示するため"],"a":1,"e":"災害の遺物から何が起こり、どんな過ちを犯し、どう復興したかを知り、将来の対策に生かす。"},{"q":"武家諸法度の変遷について正しいものはどれか。","c":["元和令は家光、寛永令は秀忠が出した","寛永令で参勤交代が定められた","天和令は「文武弓馬の道」を強調した","元和令は綱吉が出した"],"a":1,"e":"元和令は秀忠で「文武弓馬の道」、寛永令は家光で参勤交代を規定、天和令は綱吉。"},{"q":"「白河の清きに魚の住みかねてもとの濁りの田沼恋しき」の背景として正しいものはどれか。","c":["田沼時代の物価高を批判した","寛政の改革の厳しさに人々が田沼時代を懐かしんだ","大御所時代の復古を求めた","享保の改革を称賛した"],"a":1,"e":"寛政の改革の時期の狂歌で、厳しい改革に対し田沼時代を恋しがる世相を表す。"},{"q":"『方広寺鐘銘』が近世日本の歴史を動かしたといわれる理由はどれか。","c":["秀吉が刀狩の口実に用いたため","「国家安康」「君臣豊楽」に家康が言い掛かりをつけ大坂冬の陣を起こしたため","林子平が海防を説く根拠としたため","伊能忠敬が測量の基準としたため"],"a":1,"e":"豊臣家再建の方広寺の鐘銘に家康が言い掛かりをつけ、大坂冬の陣を起こした。"}],"order":[{"title":"近世の自然災害","items":["慶長三陸地震津波","明暦の大火","富士山の宝永噴火","浅間山の天明噴火","安政江戸地震"],"e":"1611年津波→1657年明暦の大火→1707年宝永噴火→1783年天明噴火→1855年安政江戸地震。"},{"title":"日本の世界遺産登録","items":["姫路城・屋久島・白神山地","原爆ドーム・厳島神社","平泉"],"e":"1993年に日本初の登録→1996年原爆ドーム・厳島神社→2011年平泉。"},{"title":"武家諸法度の変遷","items":["元和令","寛永令","天和令"],"e":"2代秀忠の元和令→3代家光の寛永令→5代綱吉の天和令。"}]}],"review":[{"q":"織田信長が堺を直轄化した理由と、南蛮貿易・鉄砲伝来との関係として正しいものはどれか。","c":["堺は琉球との中継貿易の拠点だったため","堺は南蛮貿易の拠点で鉄砲の産地だったため","堺はキリシタン大名の本拠地だったため","堺は石山本願寺の門前町だったため"],"a":1,"e":"鉄砲伝来後に堺は鉄砲の国産化の中心となり、南蛮貿易の拠点でもあったため信長は直轄地とした。"},{"q":"信長と秀吉のキリスト教政策の違いとその理由として正しいものはどれか。","c":["信長は弾圧、秀吉は保護した。秀吉が貿易利潤を求めたため","信長は保護、秀吉はバテレン追放令を出した。秀吉が統一支配の障害と懸念したため","両者とも徹底して禁教した。仏教勢力の要求のため","両者とも保護した。天皇が布教を許可したため"],"a":1,"e":"信長は仏教弾圧の一方でフロイスらを保護。秀吉は長崎寄進や奴隷輸出を領土的野心とみなし追放令を出したが、貿易奨励のため不徹底だった。"},{"q":"本能寺の変から秀吉の天下統一に至る流れとして正しいものはどれか。","c":["山崎の戦い→賤ヶ岳の戦い→関白就任→小田原攻め","賤ヶ岳の戦い→山崎の戦い→小田原攻め→関白就任","関白就任→山崎の戦い→賤ヶ岳の戦い→小田原攻め","山崎の戦い→小田原攻め→賤ヶ岳の戦い→関白就任"],"a":0,"e":"1582年山崎で光秀を討ち、1583年賤ヶ岳で勝家を破り、1585年関白となり、1590年小田原攻めと奥州平定で統一を完成した。"},{"q":"太閤検地と刀狩令が共通してもたらした結果として最も適当なものはどれか。","c":["荘園公領制の復活","兵農分離の促進と近世身分制度の基礎の確立","貫高制の確立","後期倭寇の終焉"],"a":1,"e":"検地で武士による農民の直接支配が確立し、刀狩で農民の武器を没収して兵農分離が進み、身分統制令で固定された。"},{"q":"朝鮮侵略が桃山文化に与えた影響として正しいものはどれか。","c":["油絵・銅版画の技法が伝わった","陶工の来日でお国焼きが生まれ、活字印刷術が伝わった","セミナリオ・コレジオが設立された","侘茶が完成した"],"a":1,"e":"李参平らの陶工により有田焼などのお国焼きが創出され、活字印刷術で後陽成天皇の慶長版本が出版された。油絵やセミナリオは南蛮文化。"},{"q":"鉄砲伝来が桃山文化の城郭建築にもたらした変化として正しいものはどれか。","c":["山城が主流となり天守閣が消えた","山城から平山城・平城へ変化し、姫路城などの城郭建築が発達した","城郭内から書院造が消えた","城郭が宗教施設に転用された"],"a":1,"e":"鉄砲の普及で築城法が山城から平山城・平城へ変化し、安土城以降、姫路城・犬山城など天守閣をもつ城郭建築が発達した。"}]},{"id":11,"title":"幕藩体制の確立と武断政治","era":"江戸時代前期","span":"1600〜1651","oneLine":"家康・秀忠・家光の武断政治で大名・朝廷・宗教・農村を統制し、鎖国で幕藩体制が固まった","chain":["徳川家康","徳川秀忠","徳川家光","徳川家綱"],"parts":[{"title":"徳川家康による統一","flow":[{"y":"1562","t":"清洲同盟","s":"今川氏から独立した家康が織田信長と同盟を結ぶ","why":"桶狭間の戦い（1560年）で今川義元が敗れ、三河で自立できたため"},{"y":"1586","t":"豊臣秀吉に臣従","s":"小牧・長久手の戦い（1584年）のあと秀吉に従う","why":""},{"y":"1590","t":"関東への国替え","s":"秀吉の命で北条氏滅亡後の関東へ移り、江戸城に入って約250万石の大名となる","why":"秀吉が家康を東国へ遠ざけるため"},{"y":"1600","t":"関ヶ原の戦い","s":"東軍の家康が石田三成ら西軍を破る。西軍総大将は毛利輝元","why":"秀吉死後、五大老筆頭の家康と文治派の三成が対立したため"},{"y":"1603","t":"江戸幕府を開く","s":"後陽成天皇から征夷大将軍を宣下され、国絵図・郷帳の作成を命じる","why":"諸大名に対する指揮権の正統性を得るため"},{"y":"1605","t":"秀忠に将軍職を譲る","s":"家康は駿府に隠居し大御所として実権を握る","why":"下剋上の思想を否定・根絶し、徳川の世襲を示すため"},{"y":"1614","t":"方広寺鐘銘問題・大坂冬の陣","s":"「国家安康」「君臣豊楽」に言い掛かりをつけ豊臣方を挑発、大坂の役を開始","why":"豊臣氏を滅ぼす口実をつくるため"},{"y":"1615","t":"大坂夏の陣・一国一城令・武家諸法度元和令","s":"豊臣氏が滅亡し元和偃武。居城以外の城を破却させ、崇伝起草の法度を発布","why":"戦乱が終わり、大名統制を法で固めるため"},{"y":"1635","t":"武家諸法度寛永令","s":"家光が林羅山に起草させ、参勤交代を制度化、大船建造を禁止","why":"大名の軍事力・財力を抑え将軍への服従を確認するため"},{"y":"1635","t":"幕藩体制の確立","s":"将軍と大名の主従関係を基礎に幕府と藩が全国を支配する体制が固まる","why":"参勤交代と武家諸法度で幕府の絶対的支配が確立したため"}],"story":"【徳川家康】は【織田信長】の同盟相手、のち【豊臣秀吉】の重臣として力をつけ、1590年に関東へ移って【江戸城】に入った。秀吉の死後、【1600年】の【関ヶ原の戦い】で石田三成ら西軍を破り、【1603年】に征夷大将軍となって【江戸幕府】を開いた。諸大名への指揮権の正統性を得たためである。家康はわずか2年で将軍職を秀忠に譲り、【大御所】として実権を握った。これは「天下は回り持ち」という下剋上の思想を否定するためだった。1614〜15年の【大坂の役】で豊臣氏を滅ぼすと、【元和偃武】となり戦乱は終わった。直後に【一国一城令】と【武家諸法度元和令】を出して大名を統制し、親藩・譜代・外様に区分して要地と遠隔地に配置した。武断主義で改易・減封を断行したため牢人が大量に発生した。3代【家光】は【1635年】の寛永令で【参勤交代】を制度化し、幕府の絶対的支配のもとで【幕藩体制】が確立した。","keywords":["関ヶ原の戦い","征夷大将軍","大御所","大坂の役","元和偃武","一国一城令","武家諸法度元和令","金地院崇伝","親藩・譜代・外様","参勤交代","武家諸法度寛永令","林羅山","幕藩体制","改易"],"blanks":[{"q":"1562年、徳川家康は【　】と清洲同盟を結んだ。","a":"織田信長","h":"桶狭間の戦いの勝者"},{"q":"1590年、家康は北条氏滅亡後の関東へ国替えとなり【　】に入った。","a":"江戸城","h":"武蔵など6か国約250万石"},{"q":"1600年、家康ら東軍が石田三成ら西軍を破った戦いを【　】という。","a":"関ヶ原の戦い","h":"美濃国"},{"q":"関ヶ原の戦いで西軍の総大将となった大坂城の大名は【　】である。","a":"毛利輝元","h":"戦後、周防・長門37万石に減封"},{"q":"1603年、家康は後陽成天皇より【　】を宣下され江戸幕府を開いた。","a":"征夷大将軍","h":"諸大名に対する指揮権の正統性"},{"q":"1607年、駿府へ隠居した家康は【　】（前将軍）として政権を握った。","a":"大御所","h":"崇伝・天海・本多正純が補佐"},{"q":"1614年、【　】鐘銘問 幕府を開く","秀忠に将軍職を譲る","大坂夏の陣","武家諸法度寛永令"],"e":"1600年関ヶ原→1603年将軍宣下→1605年譲位→1615年豊臣氏滅亡→1635年寛永令で参勤交代制度化。"},{"title":"将軍の代替わり","items":["家康が征夷大将軍となる","秀忠が将軍となる","家光が将軍となる","大御所秀忠の死"],"e":"1603年家康→1605年秀忠→1623年家光→1632年秀忠死去。秀忠も家康にならい大御所として実権を握った。"}]},{"title":"幕藩体制の確立（幕府の職制と朝廷統制）","flow":[{"y":"","t":"幕府の経済力","s":"幕領約400万石と旗本知行地300万石で全国の約4分の1。鉱山・都市・街道を直轄し貨幣鋳造権と長崎貿易を独占","why":""},{"y":"","t":"幕府の軍事力","s":"直参の旗本（御目見得以上）・御家人（御目見得以下）と諸大名の軍役で他勢力を圧倒","why":""},{"y":"1613","t":"公家衆法度","s":"朝廷統制の先駆けとなる法令","why":""},{"y":"1615","t":"禁中並公家諸法度","s":"金地院崇伝が起草。「天子諸芸能の事、第一御学問なり」と定め朝廷運営の基準とした","why":"天皇・公家を学問に専念させ、大名との接触を防ぐため"},{"y":"1620","t":"和子の入内","s":"秀忠の娘和子（東福門院）が後水尾天皇に入内し外戚関係を結ぶ","why":"幕府が天皇権威を自らの支配に利用するため"},{"y":"1627","t":"紫衣事件","s":"後水尾天皇が幕府に無断で紫衣着用を勅許したことを幕府が問題視し無効にした","why":"幕府の法度が天皇の勅許に優先することを示すため"},{"y":"1629","t":"後水尾天皇の退位","s":"沢庵宗彭が出羽に配流され、天皇は独断で退位。秀忠の孫が明正天皇として即位","why":"相次ぐ幕府の介入に天皇が反発したため"},{"y":"1634","t":"家光の上洛","s":"全大名に軍役を課し30万の大軍で上洛","why":"将軍の軍事指揮権と幕府の威勢を示すため"},{"y":"","t":"幕府職制の整備","s":"3代家光までに老中・若年寄・三奉行などを整備。将軍独裁で月番交代・合議制、評定所で合議","why":"側近政治を改め安定した政務体制をつくるため"}],"story":"幕府は幕領約【400万石】に旗本知行地を合わせ全国の約4分の1を占め、鉱山・都市・街道を直轄し、貨幣鋳造権と長崎貿易を独占した。この経済力と、【旗本】・【御家人】の直参と諸大名の軍役による軍事力で他勢力を圧倒した。職制は3代【家光】までに整備され、常置の最高職【老中】や【寺社奉行】は譜代大名が、【大目付】・町奉行・勘定奉行は旗本が就いた。鎌倉・室町幕府と違い将軍独裁体制で、役職をまたぐ事案は【評定所】で合議した。朝廷に対しては、天皇や公家が大名とつながることを警戒したため、1615年に【禁中並公家諸法度】を定め、【京都所司代】と【武家伝奏】で監察した。さらに秀忠の娘【和子】を後水尾天皇に入内させて外戚関係を結んだ。1627年の【紫衣事件】で幕府の法度が天皇の勅許に優先することが決定づけられ、反発した後水尾天皇は1629年に独断で退位、秀忠の孫が【明正天皇】となった。","keywords":["幕領","旗本","御家人","老中","若年寄","寺社奉行","大目付","目付","評定所","禁中並公家諸法度","京都所司代","武家伝奏","紫衣事件","後水尾天皇","明正天皇"],"blanks":[{"q":"将軍の直参のうち、御目見得以上の者を【　】という。","a":"旗本","h":"1万石未満、地方知行制が多い"},{"q":"将軍の直参のうち、御目見得以下の同心・足軽などを【　】という。","a":"御家人","h":"俸禄制（蔵米取）が多い"},{"q":"江戸幕府の常置の最高職で、2万5000石以上の譜代から4〜5名が選ばれたのは【　】である。","a":"老中","h":"はじめ年寄と呼ばれた"},{"q":"非常置の最高職で、10万石以上の譜代から1名が選ばれたのは【　】である。","a":"大老","h":"常置ではない"},{"q":"「三奉行」の筆頭で、寺社の監察や宗教統制にあたったのは【　】である。","a":"寺社奉行","h":"譜代大名が就任"},{"q":"老中支配の職で、大名の監察にあたったのは【　】である。","a":"大目付","h":" ":[{"y":"1609","t":"マードレ=デ=デウス号事件","s":"キリシタン大名有馬晴信が長崎でポルトガル船を撃沈","why":""},{"y":"1612","t":"幕領に禁教令","s":"岡本大八事件を契機に幕領（天領）でキリスト教を禁止","why":"ポルトガル・スペインの侵略への懸念と信者の団結を恐れたため"},{"y":"1613","t":"全国に禁教令","s":"翌1614年、高山右近ら300人余りをマニラ・マカオへ追放","why":""},{"y":"1622","t":"元和の大殉教","s":"長崎で宣教師・信徒ら55名を処刑","why":""},{"y":"1630","t":"禁書令","s":"洋書の輸入を禁止","why":"キリスト教関係の知識の流入を防ぐため"},{"y":"1637","t":"島原の乱","s":"益田（天草）四郎時貞を中心に約3万8000人が原城跡にこもる。松平信綱がオランダ船の援護も得て鎮圧","why":"松倉勝家・寺沢堅高の過酷な年貢徴収とキリシタン弾圧に領民が反抗したため"},{"y":"1640","t":"宗門改役の設置・寺請制度","s":"宗門改めを実施し、檀那寺が寺請証文を発行して檀家を監視","why":"島原の乱を機に禁教を徹底し、寺院を通じて民衆を支配するため"},{"y":"1643","t":"田畑永代売買禁止令","s":"寛永の飢饉を背景に家光が田畑の売買を禁止。同年に田畑勝手作りの禁","why":"富農への土地集中を防ぎ本百姓体制を維持するため"},{"y":"1665","t":"諸宗寺院法度・諸社禰宜神主法度","s":"仏教各宗派共通の統制令と、吉田家を中心とする神社・神職の統制令","why":""},{"y":"1673","t":"分地制限令","s":"4代家綱が名主20石・一般百姓10石未満の者の分地を禁止","why":"田畑の細分化を防ぎ本百姓体制を維持するため"}],"story":"当初は黙認したが、ポルトガル・スペインの侵略への懸念と信者の団結を恐れたため、【1612年】に幕領、翌年全国に【禁教令】を出し、【高山右近】らを追放。1637年、過酷な年貢とキリシタン弾圧に反抗した領民が【益田（天草）四郎時貞】を中心に蜂起した【島原の乱】が起こり、老中【松平信綱】がようやく鎮圧した。この乱が原因で幕府権力はさらに集中し、鎖国政策が促進された。禁教徹底のため【踏絵】を強制し、1640年に宗門改役を置いて【寺請制度】を整えたことで、寺院を通じて全国民を統制できるようになった。寺社にも【本末制度】と諸宗寺院法度で統制を及ぼしたため、仏教・神道は活力を失った。幕藩体制の基盤は村であり、村請制で年貢を納め、【五人組】で連帯責任を負わせた。農民の負担は重く、幕府は本百姓体制維持のため【田畑永代売買禁止令】（1643年）や【分地制限令】（1673年）を出した。","keywords":["禁教令","高山右近","元和の大殉教","島原の乱","益田（天草）四郎時貞","松平信綱","踏絵","寺請制度","宗門改帳","本末制度","諸宗寺院法度","村方三役","五人組","田畑永代売買禁止令","分地制限令"],"blanks":[{"q":"1612年、【　】事件を契機に幕府は幕領に禁教令を発布した。","a":"岡本大八","h":"翌年には全国に禁教令"},{"q":"1614年、キリシタン大名【　】ら300人余りがマニラ・マカオへ追放された。","a":"高山右近","h":"全国禁教令の翌年"},{"q":"1622年、長崎で宣教師・信徒ら55名が処刑された事件を【　】という。","a":"元和の大殉教","h":"元和年間"},{"q":"1637〜38年、益田（天草）四郎時貞を中心にキリシタン農民や牢人が蜂起した反乱を【　】という。","a":"島原の乱","h":"島原・天草一揆とも。原城跡にこもった"},{"q":"島原の乱を最終的に鎮圧した老中は【　】である。","a":"松平信綱","h":"「知恵伊豆」。オランダ船の援護も得た"},{"q":"1640年、幕府は【　】を設置して宗門改めを実施した。","a":"宗門改役","h":"寺請制度の整備"},{"q":"檀那寺が寺請証文を発行して檀家を監視する制度を【　】という。","a":"寺請制度","h":"寺檀制度とも"},{"q":"1601年以降の寺院法度で各宗派に本山・末寺を組織させたしくみを【　】という。","a":"本末制度","h":"将軍→寺社奉行→本山→末寺→檀家"},{"q":"1665年、仏教各宗派共通の ],"e":"1601年以降各宗派ごとの法度で本末制度→1640年宗門改役→1665年各宗派共通の諸宗寺院法度。"}]},{"title":"都市の統制と江戸時代前期の文化","flow":[{"y":"","t":"城下町の成立","s":"兵農分離で武士が集住し、自由営業・地子銭免除で町人が集住して物資の生産・集散が活発化","why":"武士（消費者）と町人（商工業者）を城下に集めるため"},{"y":"","t":"城下町の構造","s":"武家地・寺社地・町人地に町割され、町は町法（町掟）で運営","why":""},{"y":"","t":"町人の負担と階層","s":"年貢はなく町人足役・町入用を負担。町政参加は地主・家持のみで、地借・店借は参加できない","why":""},{"y":"","t":"身分秩序（士農工商）","s":"士約6〜10％、農約80％、工商約7〜10％。武士は苗字・帯刀、切捨御免の特権。えた・ひにんの賤民身分","why":"秩序維持による社会の安定をはかるため"},{"y":"","t":"家制度の確立","s":"家名第一、強大な家長権、男尊女卑。三従の教え、七去による三行半、縁切寺","why":""},{"y":"1617","t":"日光東照宮への改葬","s":"家康を東照大権現として祀る権現造の霊廟建築。陽明門も有名","why":""},{"y":"","t":"寛永期の文化","s":"家光のころの文化。桃山の豪華さを継承しつつ公家文化が復活し、優雅で落ち着いた文化","why":"戦乱がなくなり社会が安定したため"},{"y":"","t":"桂離宮・絵画・工芸","s":"八条宮智仁親王の桂離宮（数寄屋造）、狩野探幽、俵屋宗達の風神雷神図屛風、酒井田柿右衛門の赤絵、本阿弥光悦の蒔絵","why":""},{"y":"","t":"朱子学の保護","s":"藤原惺窩が朱子学を禅宗から解放し京学の祖に。門人の林羅山が家康に登用され林家の祖となる","why":"上下の秩序を重んじる朱子学が封建教学として幕藩体制の身分秩序を正当化するため"}],"story":"兵農分離で武士が、営業認可・地子銭免除で町人が城下に集住したため、【城下町】が成立した。町は町法で運営され、農村と違い年貢はなく、【町人足役】や町入用を負担した。町政に参加できるのは【地主・家持】だけだった。幕府は秩序維持による社会の安定をはかるため「【士農工商】」の身分制度を定め、武士に苗字・帯刀などの特権を与えた。家では家名第一の【家制度】が確立し、男尊女卑のもと女性は【三行半】で一方的に離縁された。戦がなくなり社会が安定したため、3代家光のころの【寛永期の文化】は優雅で落ち着いたものになった。建築では権現造の【日光東照宮】と数寄屋造の【桂離宮】、絵画では狩野探幽と【俵屋宗達】の風神雷神図屛風、工芸では【酒井田柿右衛門】の赤絵と【本阿弥光悦】の蒔絵が代表である。学問では上下の秩序を重んじる【朱子学】が封建教学として保護され、【藤原惺窩】の門人【林羅山】が家康に登用されて林家の祖となった。","keywords":["城下町","町人足役","地主・家持","士農工商","切捨御免","家制度","三行半","寛永期の文化","日光東照宮","桂離宮","狩野探幽","俵屋宗達","酒井田柿右衛門","本阿弥光悦","朱子学"],"blanks":[{"q":"兵農分離策による武士の集住と町人の集住によって【　】が成立した。","a":"城下町","h":"江戸・大坂・駿府・名古屋など"},{"q":"町人は年貢を課されなかったが、上下水道の整備や防火などの【　】や町入用を負担した。","a":"町人足役","h":"農村の年貢に相当する負担"},{"q":"長崎・酒田・下関などは【　】に分類される都市である。","a":"港町","h":"山田・日光は門前町"},{"q":"武士には苗字・帯刀のほか、【　】（無礼討ち）の特権があった。","a":"切捨御免","h":"無礼な庶民を斬っても罪にならない"},{"q":"村や町の番人・物乞い・遊芸・清掃などに従事した賤民身分を【　】という。","a":"ひにん","h":"非人。えたは皮革製造や行刑役"},{"q":"七去を理由とする男性からの一方的な離縁状を【　】という。","a":"三行半","h":"女性は縁切寺（東慶寺・満徳寺）に逃げ込んだ"},{"q":"徳川家康を東照大権現として祀る権現造の霊廟建築は【　】である。","a":"日光東照宮","h":"下野国。陽明門が有名"},{"q":"八条宮智仁親王の離宮で、数寄屋造・回遊式庭園の代表は【　】で ,"s":"京都・堺・長崎の商人に糸割符仲間をつくらせ生糸を一括購入","why":"ポルトガル商人の暴利を抑えるため"},{"y":"1609","t":"平戸にオランダ商館","s":"オランダとの貿易開始。同年マードレ=デ=デウス号事件でポルトガルと一時断交","why":""},{"y":"1613","t":"慶長遣欧使節・イギリス商館","s":"伊達政宗が支倉常長をスペイン・イタリアへ派遣（通商開拓は失敗）。平戸にイギリス商館開設","why":"家康はノヴィスパン（メキシコ）との貿易を希望していた"},{"y":"1623","t":"イギリスの退去","s":"アンボイナ事件でオランダに敗れ、自ら商館を閉鎖して退去","why":""},{"y":"1624","t":"スペイン船の来航禁止","s":"南蛮国のうちスペインを先に排除","why":"キリスト教布教と貿易が一体の南蛮人を警戒したため"},{"y":"1631","t":"奉書船制度","s":"朱印状に加え老中奉書も必要に。1633年に奉書船以外の海外渡航を禁止","why":"海外渡航を幕府がより厳しく管理するため"},{"y":"1635","t":"日本人の海外渡航・帰国の全面禁止","s":"鎖国令Ⅲ。朱印船貿易が終結、中国船の来航も長崎に限定","why":"禁教の徹底と貿易利潤の幕府独占のため"},{"y":"1639","t":"ポルトガル船の来航禁止","s":"島原の乱後、鎖国令Ⅴで南蛮人を完全に排除","why":"島原の乱でキリスト教の脅威を再認識したため"},{"y":"1641","t":"オランダ商館を出島へ","s":"平戸の商館を長崎の出島に移し「鎖国」体制が完成","why":"オランダ人も長崎奉行の監視下に置くため"}],"story":"カトリック国の【南蛮人】（ポルトガル・スペイン）は貿易と布教が一体であったのに対し、プロテスタント国の【紅毛人】（オランダ・イギリス）は布教を伴わなかった。1600年の【リーフデ号】漂着を機に【ウィリアム=アダムズ】らが家康の顧問となり、オランダ・イギリスが【平戸】に商館を開いた。ポルトガルの暴利を抑えるため1604年に【糸割符制度】が始まった。将軍の朱印状を得た【朱印船】が東南アジアで出会貿易を行い、【銀】を輸出して【生糸】を輸入した。しかし幕府は禁教の徹底と貿易利潤の独占をめざしたため、1624年スペイン船を禁じ、1631年【奉書船】制度、1635年日本人の海外渡航・帰国を全面禁止して朱印船貿易を終わらせた。【島原の乱】を経て1639年【ポルトガル】船の来航を禁じ、1641年平戸のオランダ商館を長崎の【出島】に移して「鎖国」体制が完成した。強固な幕藩体制が確立する一方、世界から孤立した。","keywords":["南蛮人","紅毛人","リーフデ号","ウィリアム=アダムズ","糸割符制度","平戸","慶長遣欧使節","支倉常長","アンボイナ事件","朱印船貿易","日本町","山田長政","奉書船","出島","鎖国論"],"blanks":[{"q":"ポルトガル人・スペイン人など、カトリック国の人々を【　】と呼んだ。","a":"南蛮人","h":"オランダ人・イギリス人は紅毛人"},{"q":"1604年、京都・堺・長崎の商人に生糸を一括購入させポルトガル商人の暴利を抑えた制度を【　】という。","a":"糸割符制度","h":"1631年に江戸・大坂を加え五ヵ所商人"},{"q":"1613年、伊達政宗はメキシコ・スペイン・イタリアへ【　】を派遣した（慶長遣欧使節）。","a":"支倉常長","h":"ルイス=ソテロが同行"},{"q":"1609年、オランダは【　】に商館を開設し貿易を開始した。","a":"平戸","h":"肥前国。1613年にイギリスも商館を開設"},{"q":"1600年に豊後に漂着したオランダ船【　】の航海士ヤン=ヨーステンと水先案内人ウィリアム=アダムズは家康に登用された。","a":"リーフデ号","h":"臼杵に来航"},{"q":"リーフデ号の水先案内人で三浦按針とも呼ばれるイギリス人は【　】である。","a":"ウィリアム=アダムズ","h":"ヤン=ヨーステンはオランダ人"},{"q":"1623年、【　】事件でイギリスはオランダに敗れ、自ら商館を閉鎖して日本を退去した。","a":"アンボイナ","h":"鎖国とは無関係に退去"},{"q":"将軍の朱印状を得て東南アジアで出会貿易を行った貿易を【　】という。","a":"朱印船貿易","h":"商人・大名・旗本が共同出資"},{"q":"朱印船貿易の主な輸出品は
