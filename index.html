925","t":"ラジオ放送とジャーナリズム","s":"1925年ラジオ放送開始、1926年NHK設立。政府の発表は高札→布告→官報、新聞は瓦版→小新聞→大新聞→四大紙→二大紙へ","why":""}],"story":"近代・現代は近世までと比べ現存する遺物が圧倒的に多い。幕末の【品川台場跡】、明治維新期の【旧新橋停車場】、明治前期の【開智学校】、明治中期に【コンドル】が設計した【旧岩崎邸】、明治後期に片山東熊が設計した【旧東宮御所】、大正時代に【辰野金吾】が設計した【東京駅】、昭和前期の国会議事堂、昭和中期の東京タワーなど、現存建築から各時代の世相を直接感じられる。戦争遺産では、戊辰戦争の【五稜郭】、西南戦争の西郷隆盛像、日清戦争の春帆楼、日露戦争の記念艦【三笠】、太平洋戦争では原爆ドーム（広島県）・平和祈念像（長崎県）・【平和の礎】（沖縄県）のほか、ハワイのアリゾナ記念館など国外の遺産に触れることで戦争の多面的な側面を知ることができる。また政府の発表は高札→布告→【官報】と変わり、雑誌は総合雑誌『中央公論』や大衆雑誌『【キング】』が生まれ、【1925年】にラジオ放送が始まった。現代ではSNSの書き込みすら後世の「史料」となる。","keywords":["品川台場跡","開智学校","コンドル","旧岩崎邸","片山東熊","辰野金吾","東京駅","五稜郭","記念艦三笠","原爆ドーム","平和の礎","官報","『キング』","NHK"],"blanks":[{"q":"明治時代中期の旧岩崎邸は、イギリス人建築家【　】が設計した。","a":"コンドル","h":"東京都に現存"},{"q":"明治時代後期の旧東宮御所〔迎賓館赤坂離宮〕は【　】が設計した。","a":"片山東熊","h":"東京都に現存"},{"q":"大正時代の東京駅は【　】が設計した。","a":"辰野金吾","h":"東京都に現存"},{"q":"明治時代前期の学校建築である【　】は長野県に現存する。","a":"開智学校","h":"近代の学校建築"},{"q":"戊辰戦争（1868〜69年）の戦争遺産として北海道の【　】がある。","a":"五稜郭","h":"箱館"},{"q":"日露戦争（1904〜05年）の戦争遺産として神奈川県の記念艦【　】がある。","a":"三笠","h":"日清戦争の遺産は春帆楼（山口県）"},{"q":"太平洋戦争の戦争遺産である平和の礎は【　】にある。","a":"沖縄県","h":"沖縄戦の戦没者を慰霊"},{"q":"太平洋戦争の戦争遺産である原爆ドームは【　】にある。","a":"広島県","h":"平和祈念像は長崎県"},{"q":"政府が国民に広く知らせるための発表は、高札→布告→【　】と変わってきた。","a":"官報","h":"現代では白書も"},{"q":"『太陽』『中央公論』『改造』が総合雑誌であるのに対し、『【　】』は大衆雑誌である。","a":"キング","h":"週刊誌には『サンデー毎日』『週刊朝日』"},{"q":"1925年にラジオ放送が始まり、翌年【　】が設立された。","a":"日本放送協会","h":"NHK。1953年にテレビ放送開始"}],"mc":[{"q":"辰野金吾が設計した大正時代の建築はどれか。","c":["旧岩崎邸","東京駅","旧東宮御所","旧新橋停車場"],"a":1,"e":"東京駅は辰野金吾、旧岩崎邸はコンドル、旧東宮御所は片山東熊の設計。"},{"q":"現存する近代建築を時代順に正しく並べたものはどれか。","c":["開智学校→旧岩崎邸→東京駅→国会議事堂","東京駅→開智学校→旧岩崎邸→国会議事堂","旧岩崎邸→開智学校→国会議事堂→東京駅","国会議事堂→東京駅→旧岩崎邸→開智学校"],"a":0,"e":"開智学校（明治前期）→旧岩崎邸（明治中期）→東京駅（大正）→国会議事堂（昭和前期）。"},{"q":"戦争と戦争遺産の組合せとして正しいものはどれか。","c":["戊辰戦争—記念艦三笠","日清戦争—五稜郭","日露戦争—春帆楼","西南戦争—西郷隆盛像"],"a":3,"e":"戊辰戦争は五稜郭、日清戦争は春帆楼、日露戦争は記念艦三笠。"},{"q":"太平洋戦争の戦争遺産のうち、国外にあるものはどれか。","c":["原爆ドーム","平和祈念像","アリゾナ記念館","平和の礎"],"a":2,"e":"アリゾナ記念館はハワイ、バンザイクリフはサイパンにある。他の3つは広島・長崎・沖縄。"},{"q":"近代のジャーナリズムについて正しいものはどれか。","c":["瓦版は現代の政府の発表手段である","『キング』は総合雑誌である","1925年にラジオ放送が始まり、翌年日本放送協会が設立された","官報は江戸時代のニュースを扱った"],"a":2,"e":"ラジオ放送は1925年開始、NHKは1926年設立。『キング』は大衆雑誌、瓦版は江戸時代のもの。"},{"q":"新聞とテレビ局の関係として正しいものはどれか。","c":["読売新聞—テレビ朝日","毎日新聞—TBS","産経新聞—日本テレビ","朝日新聞—フジテレビ"],"a":1,"e":"読売は日本テレビ、朝日はテレビ朝日、毎日はTBS、産経はフジテレビ、日経はテレビ東京。"}],"order":[{"title":"現存する近代・現代の建築","items":["品川台場跡","開智学校","旧岩崎邸","東京駅","東京タワー"],"e":"幕末→明治前期→明治中期→大正→昭和中期。"},{"title":"戦争遺産の対応する戦争","items":["五稜郭","春帆楼","記念艦三笠","盧溝橋","原爆ドーム"],"e":"戊辰戦争（1868）→日清戦争（1894）→日露戦争（1904）→日中戦争（1937）→太平洋戦争（1941）。"}]}],"review":[{"q":"幕府が異国船打払令を撤回して天保の薪水給与令を出してから、日米和親条約締結までの流れとして正しいものはどれか。","c":["アヘン戦争の結果に衝撃を受けて打払令を撤回し、ペリー来航後に和親条約で下田・箱館を開港した","モリソン号事件で敗れて打払令を撤回し、ハリスとの交渉で和親条約を結んだ","ラクスマン来航を機に打払令を撤回し、プチャーチンと和親条約を結んだ","フェートン号事件で敗れて打払令を撤回し、ビッドル来航で和親条約を結んだ"],"a":0,"e":"アヘン戦争（1840〜42）→薪水給与令（1842）→ペリー来航（1853）→日米和親条約（1854）。"},{"q":"井伊直弼の違勅調印が幕末政治に与えた影響として正しいものはどれか。","c":["朝廷の権威が下がり幕府独裁が安定した","尊王論と攘夷論が結びついて尊王攘夷論となり、反幕府運動が強まった","一橋派が幕政の主導権を握った","薩摩藩が直ちに倒幕に転じた"],"a":1,"e":"本来別の思想だった尊王論と攘夷論が違勅調印を契機に結びつき、安政の大獄・桜田門外の変を経て反幕運動が激化した。"},{"q":"開港後の貿易が攘夷運動の激化につながった因果として正しいものはどれか。","c":["輸入超過で国内産業が発展し、外国人への反感が薄れた","輸出超過と万延貨幣改鋳による物価上昇で庶民が困窮し、外国人排斥運動が激化した","生糸の輸入増で製糸業が衰退し、幕府批判が高まった","金貨の流入で物価が下落し、武士が困窮した"],"a":1,"e":"生糸などの輸出超過で物資が不足し、万延小判の鋳造が物価上昇に拍車をかけ、庶民の困窮が攘夷運動に向かった。"},{"q":"薩摩藩と長州藩が攘夷を放棄して倒幕に転じた共通の背景として正しいものはどれか。","c":["孝明天皇が倒幕の勅命を出したため","薩英戦争・四国艦隊下関砲撃事件で列強と交戦し攘夷の不可能を悟り、イギリスに接近したため","幕府が両藩の領地を没収したため","フランス公使ロッシュが両藩を支援したため"],"a":1,"e":"薩摩は薩英戦争、長州は下関戦争で敗れ、軍備近代化の必要と攘夷の不可能を悟った。イギリスも両藩の実力を評価し接近した。"},{"q":"公武合体運動が挫折した後、尊王攘夷運動が挫折し、倒幕運動へ至る順序として正しいものはどれか。","c":["坂下門外の変→八月十八日の政変→薩長同盟→大政奉還","薩長同盟→坂下門外の変→八月十八日の政変→大政奉還","八月十八日の政変→坂下門外の変→大政奉還→薩長同盟","大政奉還→薩長同盟→八月十八日の政変→坂下門外の変"],"a":0,"e":"1862年坂下門外の変（幕府主導の公武合体挫折）→1863年八月十八日の政変（尊攘派の後退）→1866年薩長同盟→1867年大政奉還。"},{"q":"大政奉還と王政復古の大号令の関係として正しいものはどれか。","c":["大政奉還で慶喜は新政府の総裁となり、王政復古の大号令で正式に承認された","慶喜が大政奉還で倒幕派の機先を制したのに対し、武力倒幕派が王政復古の大号令で慶喜を排除した新政府をつくった","王政復古の大号令を受けて慶喜が大政奉還を上表した","両方とも公議政体派の山内豊信が主導した"],"a":1,"e":"慶喜は討幕の密勅と同日に大政奉還で名分を奪ったが、岩倉具視ら武力倒幕派はクーデタで新政府を樹立し、小御所会議で辞官納地を決めた。"}]},{"id":16,"title":"明治維新と立憲国家の成立","era":"明治時代前期","span":"1868〜1890","oneLine":"戊辰戦争で成立した新政府が中央集権と富国強兵を進め、反乱と民権運動を経て憲法を得た","chain":["三条実美・岩倉具視","大久保利通","伊藤博文","黒田清隆"],"parts":[{"title":"戊辰戦争と明治維新","flow":[{"y":"1868","t":"鳥羽・伏見の戦い","s":"1月、旧幕府軍と新政府軍が衝突し戊辰戦争が始まる","why":"王政復古の大号令で成立した新政府と旧幕府側が対立したため"},{"y":"1868","t":"五箇条の誓文","s":"3月14日、天皇が神々に誓う形で公議世論の尊重・開国和親などの国是を示す","why":"列国の支持を得るため開明的な内容にした"},{"y":"1868","t":"五榜の掲示","s":"3月15日、5枚の高札で民衆への基本姿勢を示す（徒党・強訴・切支丹禁止など）","why":"旧幕府の民衆政策をそのまま引き継いだ"},{"y":"1868","t":"江戸無血開城","s":"4月、西郷隆盛と勝海舟の会談で決定","why":""},{"y":"1868","t":"政体書","s":"閏4月、太政官七官制・形式上の三権分立・府藩県三治制を定める","why":"アメリカの制度を参考に中央集権をめざした"},{"y":"1868","t":"奥羽越列藩同盟・会津戦争","s":"東北・北陸諸藩が反新政府同盟を結ぶが、9月に会津藩が降伏し崩壊","why":""},{"y":"1868","t":"東京改称・明治改元","s":"7月江戸を東京と改称、9月明治と改元し一世一元の制を採用","why":""},{"y":"1869","t":"五稜郭の戦い","s":"5月、榎本武揚らが降伏し戊辰戦争が終結","why":""},{"y":"1869","t":"版籍奉還","s":"薩長土肥4藩主が領地・人民を天皇に返還、旧藩主は知藩事に","why":"新政府が全国の支配権を形式上その手に収めるため"},{"y":"1871","t":"廃藩置県","s":"御親兵を集めて実施、府知事・県令を中央から派遣し中央集権が確立","why":"藩の負債を政府が肩代わりしたため旧藩主も反対しなかった"}],"story":"【1868年】1月の【鳥羽・伏見の戦い】で【戊辰戦争】が始まると、新政府は列国の支持を得るため開明的な【五箇条の誓文】を出し、翌日には旧幕府の民衆政策を引き継いだ【五榜の掲示】を掲げた。閏4月の【政体書】で太政官七官制と形式上の三権分立を定め、江戸を【東京】と改称して【明治】と改元し、【1869年】の【五稜郭の戦い】で【榎本武揚】が降伏して内戦は終わった。次に新政府は中央集権を進めるため、【1869年】に【版籍奉還】で藩主を【知藩事】とし、【1871年】には薩長土の【御親兵】で反乱に備えたうえで【廃藩置県】を断行、府知事・県令を派遣する体制が確立した。あわせて【四民平等】で華族・士族・平民の身分に改め、官制は太政官三院制へ、そして薩長土肥出身者が要職を占める【藩閥政府】が形成され、【開拓使】・【内務省】などの官庁が整えられた。","keywords":["戊辰戦争","五箇条の誓文","五榜の掲示","政体書","榎本武揚","版籍奉還","廃藩置県","御親兵","四民平等","太政官三院制","藩閥政府","開拓使","内務省","壬申戸籍"],"blanks":[{"q":"1868年1月、【　】により戊辰戦争が始まった。","a":"鳥羽・伏見の戦い","h":"旧幕府軍と新政府軍の最初の衝突"},{"q":"1869年5月の五稜郭の戦いで、旧幕臣の【　】らが降伏して戊辰戦争は終結した。","a":"榎本武揚","h":"のち樺太・千島交換条約の全権"},{"q":"1868年3月14日、天皇が神々に誓う形で【　】が出され、公議世論の尊重などの国是が示された。","a":"五箇条の誓文","h":"由利公正が起草し木戸孝允が加筆修正"},{"q":"民衆に対しては5枚の高札で【　】が示され、徒党・強訴やキリスト教の禁止が掲げられた。","a":"五榜の掲示","h":"旧幕府の民衆政策を引き継いだ"},{"q":"1868年閏4月の【　】により、太政官七官制と形式上の三権分立が定められた。","a":"政体書","h":"福岡孝弟・副島種臣が起草"},{"q":"1869年、薩長土肥4藩主が領地・人民を天皇に返還する【　】が行われ、旧藩主は知藩事となった。","a":"版籍奉還","h":"木戸孝允・大久保利通らが建議"},{"q":"1871年、政府は薩長土3藩の御親兵で反乱に備えたうえで【　】を断行した。","a":"廃藩置県","h":"1使3府302県を設置"},{"q":"1871年の太政官三院制では、正院・右院とともに立法機関の【　】が置かれた。","a":"左院","h":"1874年に民撰議院設立の建白書が提出された機関"},{"q":"四民平等により、公家・大名は【　】とされた。","a":"華族","h":"士族・平民と並ぶ族籍"},{"q":"1871年の戸籍法にもとづき、翌年に初の近代的全国戸籍である【　】が作られた。","a":"壬申戸籍","h":"族籍を記載したため差別が温存された"},{"q":"1873年に設置された【　】は殖産興業・警察・地方行政を統括し、初代長官は大久保利通であった。","a":"内務省","h":"初代内務卿は薩摩藩出身"},{"q":"1869年に設置された【　】は、蝦夷地を北海道と改称してその開拓と経営を担った。","a":"開拓使","h":"東京のち札幌に置かれた"}],"mc":[{"q":"五箇条の誓文が開明的な内容となった背景として最も適当なものはどれか。","c":["旧幕府の民衆政策を引き継いだため","列国の支持を得ようとしたため","アメリカ合衆国憲法を模倣したため","征韓論を実現するため"],"a":1,"e":"武力倒幕派が公議政体派を抑えつつ欧米列強の支持を得ようとしたため、開明的な内容となった。"},{"q":"五榜の掲示の内容として正しいものはどれか。","c":["キリスト教の信仰を公認した","公議世論の尊重を掲げた","三権分立を定めた","徒党・強訴・逃散を禁止した"],"a":3,"e":"五榜の掲示は五倫の道、徒党・強訴・逃散の禁止、切支丹邪宗門の禁止などを掲げ、旧幕府の民衆政策を引き継いだ。"},{"q":"政体書について正しいものはどれか。","c":["イギリスの議院内閣制を参考にした","由利公正が起草した","太政官七官制と形式上の三権分立を定めた","廃藩置県後に制定された"],"a":2,"e":"政体書はアメリカの制度を参考に福岡孝弟・副島種臣が起草し、太政官七官制と形式上の三権分立を定めた。"},{"q":"戊辰戦争の経過について、正しい順序はどれか。","c":["江戸無血開城→鳥羽・伏見の戦い→会津藩降伏→五稜郭の戦い","鳥羽・伏見の戦い→五稜郭の戦い→江戸無血開城→会津藩降伏","会津藩降伏→鳥羽・伏見の戦い→江戸無血開城→五稜郭の戦い","鳥羽・伏見の戦い→江戸無血開城→会津藩降伏→五稜郭の戦い"],"a":3,"e":"1868年1月鳥羽・伏見→4月江戸無血開城→9月会津藩降伏→1869年5月五稜郭の戦いで終結。"},{"q":"廃藩置県の前に政府が御親兵を徴集した目的として最も適当なものはどれか。","c":["旧藩主の反乱に備えるため","朝鮮に出兵するため","北海道を開拓するため","戊辰戦争を戦うため"],"a":0,"e":"政府は薩長土3藩から御親兵を集めて反乱に備えたうえで廃藩置県を断行した。"},{"q":"版籍奉還の結果として正しいものはどれか。","c":["旧藩主は東京に移住させられた","府知事・県令が中央から派遣された","旧藩主は知藩事として引き続き藩政にあたった","藩が廃止されて県が置かれた"],"a":2,"e":"版籍奉還では旧藩主が知藩事としてそのまま藩政にあたった。東京移住や府知事・県令の派遣は廃藩置県の結果。"},{"q":"旧藩主が廃藩置県に反対しなかった理由として最も適当なものはどれか。","c":["藩の負債を政府が肩代わりしたため","知藩事の地位が世襲されたため","征韓論に賛成したため","地租が引き下げられたため"],"a":0,"e":"諸藩の貢租とともに多額の負債も政府が引き継いだため、旧藩主は廃藩置県に賛成した。"},{"q":"藩閥政府の出身藩と人物の組合せとして正しいものはどれか。","c":["薩摩＝木戸孝允","長州＝大久保利通","肥前＝大隈重信","土佐＝江藤新平"],"a":2,"e":"大隈重信は肥前。木戸孝允は長州、大久保利通は薩摩、江藤新平は肥前の出身。"}],"order":[{"title":"戊辰戦争の経過","items":["鳥羽・伏見の戦い","江戸無血開城","会津藩降伏","五稜郭の戦い"],"e":"1868年1月に鳥羽・伏見で開戦し、4月に江戸開城、9月に会津が降伏、1869年5月の五稜郭の戦いで終結した。"},{"title":"新政府の基本方針","items":["五箇条の誓文","五榜の掲示","政体書","東京遷都"],"e":"1868年3月14日誓文→翌15日五榜の掲示→閏4月政体書→1869年事実上の東京遷都。"},{"title":"中央集権化の歩み","items":["版籍奉還","廃藩置県","太政官三院制","内務省の設置"],"e":"1869年版籍奉還→1871年廃藩置県→その後の官制改革で三院制→1873年内務省設置。"}]},{"title":"新政府の諸政策（富国強兵・殖産興業）","flow":[{"y":"1869","t":"兵部省の設置","s":"大村益次郎の尽力で軍制整備が始まる","why":"国民国家形成のための富国強兵政策"},{"y":"1871","t":"御親兵・鎮台","s":"御親兵を徴集し、鎮台を導入（4鎮台のち6鎮台）","why":""},{"y":"1872","t":"徴兵告諭","s":"山県有朋の尽力で徴兵告諭を出し、兵部省を陸軍省・海軍省に分離","why":""},{"y":"1873","t":"徴兵令","s":"国民皆兵を目標に満20歳の男子から3年間徴兵、免除規定が多く庶民の次男以下に適用","why":"武士の仕事だった軍事が庶民に回り徴兵令反対一揆（血税一揆）が起きた"},{"y":"1873","t":"地租改正条例","s":"地価の3％を地券所有者が金納する全国一律の税制へ","why":"安定した財源の確保と近代的土地私有の創出のため"},{"y":"1872","t":"新橋〜横浜間鉄道","s":"イギリスの援助で開通した「陸蒸気」、大都市と開港場を結ぶ","why":""},{"y":"1872","t":"富岡製糸場","s":"官営模範工場を設立しフランス人ブリューナが指導","why":"製糸・紡績の器械生産を促進するため"},{"y":"1874","t":"屯田兵制度","s":"士族授産と北海道開拓を兼ねて開始","why":"ロシアに対する備え"},{"y":"1876","t":"秩禄処分・廃刀令","s":"金禄公債証書を与えて秩禄を全廃、士族はすべての特権を失う","why":"秩禄が歳出の約30％を占める財政負担を解消するため"},{"y":"1877","t":"地租2.5％へ引下げ","s":"地租改正反対一揆が多発し、西南戦争直前に引き下げ","why":"農民一揆が士族の反乱と結びつくのを恐れたため"}],"story":"新政府は国民国家をつくるため「【富国強兵】」を掲げた。【1869年】に【大村益次郎】の尽力で【兵部省】を設け、【1873年】に【山県有朋】が中心となって【徴兵令】を出し、満20歳の男子を3年間徴兵する国民皆兵をめざした。しかし免除規定が多く実際は庶民の次男以下に適用されたため【血税一揆】が起きた。士族の秩禄は歳出の約30％を占めていたため、【1876年】の【秩禄処分】で【金禄公債証書】を与えて全廃し、同年の【廃刀令】と合わせて士族は特権を失い、【士族授産】や【屯田兵】で救済が図られた。財政安定のため【1873年】に【地租改正条例】を出し、地価の3％を地券所有者が金納する全国一律の税制としたが、負担が重く【地租改正反対一揆】が多発したため【1877年】に【2.5％】へ引き下げた。「【殖産興業】」では【1872年】の【新橋〜横浜間】鉄道、【富岡製糸場】などの官営模範工場、【前島密】の郵便制度が整い、海運では【岩崎弥太郎】の三菱が躍進した。北海道では【黒田清隆】が【ケプロン】を招き、【屯田兵】と【札幌農学校】でロシアに備えた開拓を進めた。","keywords":["富国強兵","徴兵令","山県有朋","血税一揆","秩禄処分","金禄公債証書","廃刀令","士族授産","地租改正条例","地券","殖産興業","富岡製糸場","前島密","岩崎弥太郎","屯田兵","札幌農学校"],"blanks":[{"q":"1869年、【　】の尽力で兵部省が設置された。","a":"大村益次郎","h":"長州藩出身、別名村田蔵六"},{"q":"1873年の【　】は、国民皆兵を目標に満20歳の男子から3年間徴兵することを定めた。","a":"徴兵令","h":"山県有朋の尽力で出された"},{"q":"徴兵令に反対する農民の一揆は【　】と呼ばれた。","a":"血税一揆","h":"徴兵令反対一揆の別名"},{"q":"1876年の【　】により、受給者に金禄公債証書を与えて秩禄は全廃された。","a":"秩禄処分","h":"同年に廃刀令も出された"},{"q":"士族に資金の貸し付けや就職の斡旋を行う政策を【　】という。","a":"士族授産","h":"「士族の商法」で失敗する者も多かった"},{"q":"1873年に【　】条例が出され、課税基準が収穫高から地価に改められた。","a":"地租改正","h":"地租は地価の3％を金納"},{"q":"地租改正反対一揆の多発により、1877年に地租は3％から【　】％に引き下げられた。","a":"2.5","h":"「竹槍でドンと突き出す二分五厘」"},{"q":"1872年、【　】間にイギリスの援助で初の鉄道が開通した。","a":"新橋〜横浜","h":"「陸蒸気」と呼ばれた"},{"q":"1871年、【　】の建議で官営郵便制度が発足した。","a":"前島密","h":"飛脚制度にかわる郵便網"},{"q":"土佐藩出身の【　】が設立した三菱は、政府の保護を受け海運で躍進した。","a":"岩崎弥太郎","h":"台湾出兵・西南戦争の軍事輸送で活躍"},{"q":"1872年設立の官営模範工場【　】は、フランス人ブリューナが指導した。","a":"富岡製糸場","h":"群馬県の製糸工場"},{"q":"1876年に開校した【　】には、アメリカ人クラークが教頭として招かれた。","a":"札幌農学校","h":"北海道開拓のための学校"}],"mc":[{"q":"徴兵令反対一揆（血税一揆）が起こった背景として最も適当なものはどれか。","c":["士族が兵役を独占したため","地租が引き上げられたため","解放令が出されたため","武士の仕事だった軍事が庶民に回ってきたため"],"a":3,"e":"免除規定が多く実際には庶民の次男以下に兵役が課されたため、農民の反発を招いた。"},{"q":"秩禄処分が行われた目的として最も適当なものはどれか。","c":["士族の反乱を鎮圧するため","歳出の約30％を占める財政負担を解消するため","華族に経済的特権を与えるため","徴兵令を廃止するため"],"a":1,"e":"秩禄は歳出の約30％を占めていたため、金禄公債証書を与えて全廃した。"},{"q":"地租改正の内容として正しいものはどれか。","c":["課税基準を地価から収穫高に改めた","納税者を村請制から地券所有者に改めた","地租を米で物納させた","地租は地価の1％とした"],"a":1,"e":"収穫高→地価、物納→金納、村請制→地券所有者と改め、地租は地価の3％とした。"},{"q":"地租改正の結果として正しいものはどれか。","c":["政府の税収は不安定になった","小作農の負担が軽減された","農村への商品経済の浸透が止まった","地主の土地所有権が確立し寄生地主が利益を得た"],"a":3,"e":"定額金納の地租は米価高騰で地主に有利に働き、寄生地主の土地所有権が確立した。自作農・小作農は困窮した。"},{"q":"1877年に地租が2.5％に引き下げられた理由として最も適当なものはどれか。","c":["西南戦争の戦費が不要になったため","松方デフレで物価が下落したため","農民一揆が士族の反乱と結びつくことを恐れたため","国会開設の請願を受け入れたため"],"a":2,"e":"1876年に地租改正反対一揆が多発し、政府は西南戦争直前に地租を引き下げた。"},{"q":"殖産興業政策について正しいものはどれか。","c":["新橋〜横浜間の鉄道はフランスの援助で開通した","富岡製糸場はイギリス人ブリューナが指導した","三菱は大久保利通・大隈重信の保護を受けて躍進した","郵便制度は岩崎弥太郎の建議で発足した"],"a":2,"e":"三菱は内務卿大久保利通・大蔵卿大隈重信の保護を受けた。鉄道はイギリス援助、ブリューナはフランス人、郵便は前島密の建議。"},{"q":"明治政府が北海道開拓に力を入れた理由として最も適当なものはどれか。","c":["ロシアに対する備え","清国への備え","朝鮮への出兵拠点とするため","士族の反乱を鎮圧するため"],"a":0,"e":"北方の大国ロシアへの対策として屯田兵制度などで開拓を進めた。"},{"q":"北海道開拓に関して正しいものはどれか。","c":["開拓次官黒田清隆がアメリカ人ケプロンを顧問に招いた","札幌農学校の教頭はドイツ人モッセであった","開拓使は1886年に設置された","屯田兵制度は清国に対する備えであった"],"a":0,"e":"黒田清隆がケプロンを顧問として招き、アメリカ式大農場制度の移殖を図った。クラークが札幌農学校教頭、開拓使は1869年設置。"}],"order":[{"title":"軍制の整備","items":["兵部省の設置","御親兵の徴集","徴兵告諭","徴兵令"],"e":"1869年兵部省→1871年御親兵・鎮台→1872年徴兵告諭→1873年徴兵令の順。"},{"title":"士族の解体","items":["四民平等","秩禄奉還の法","秩禄処分・廃刀令","士族の反乱"],"e":"1869年四民平等→1873年秩禄奉還の法→1876年秩禄処分・廃刀令で特権を失った士族が反乱を起こした。"},{"title":"北海道開拓","items":["開拓使の設置","屯田兵制度の開始","札幌農学校の開校","開拓使の廃止","北海道庁の設置"],"e":"1869年開拓使→1874年屯田兵→1876年札幌農学校→1882年開拓使廃止（三県体制）→1886年北海道庁。"}]},{"title":"明治初期の経済政策と国際問題","flow":[{"y":"1868","t":"太政官札の発行","s":"由利公正の建議で戊辰戦争の財源として不換紙幣を発行、翌年民部省札も","why":"御用金の徴収だけでは戦費が足りなかったため"},{"y":"1871","t":"新貨条例","s":"伊藤博文の建議で円・銭・厘の十進法を採用、金本位制をめざす","why":"近代的貨幣制度をつくるため（実際は金銀複本位制）"},{"y":"1871","t":"岩倉使節団の出発","s":"岩倉具視を大使、大久保・木戸・伊藤らを副使として欧米へ","why":"条約改正の予備交渉と欧米視察のため"},{"y":"1871","t":"日清修好条規","s":"伊達宗城と李鴻章が調印、相互に領事裁判権を認める初の対等条約","why":""},{"y":"1872","t":"国立銀行条例","s":"渋沢栄一の尽力でアメリカのナショナル＝バンク制度にならう、第一国立銀行など4行のみ","why":"民間の資本力で兌換紙幣を発行させようとした"},{"y":"1873","t":"明治六年の政変","s":"征韓論に敗れた西郷隆盛・板垣退助らが下野","why":"使節団帰国組の内治優先派が留守政府の征韓派と対立したため"},{"y":"1874","t":"台湾出兵","s":"琉球漂流民殺害事件を理由に西郷従道が出兵、木戸孝允は反対して下野","why":""},{"y":"1875","t":"樺太・千島交換条約","s":"榎本武揚が全権、樺太を放棄し千島列島全てを領有","why":"黒田清隆が北海道開拓専念のため樺太放棄を主張"},{"y":"1875","t":"江華島事件","s":"軍艦雲揚が朝鮮側を挑発し戦闘に、翌年日朝修好条規で朝鮮を開国","why":""},{"y":"1876","t":"国立銀行条例改正","s":"正貨兌換義務を除き金禄公債を資本金に認めたため設立が急増","why":"結果として不換紙幣が出回りインフレが進んだ"}],"story":"戊辰戦争の財源として政府は【由利公正】の建議で【太政官札】などの不換紙幣を発行した。【1871年】には【伊藤博文】の建議で【新貨条例】を定め、【円・銭・厘】の十進法による金本位制をめざした。【1872年】には【渋沢栄一】の尽力でアメリカの制度にならった【国立銀行条例】を出し、民間の力で兌換紙幣を発行させようとしたが、兌換義務が重く【第一国立銀行】など4行にとどまった。そこで【1876年】に条例を改正して兌換義務を外し【金禄公債証書】を資本金に認めたため設立が急増し、不換紙幣が出回ってインフレが進んだ。政府と結びついた【三井】・【三菱】・【五代友厚】らの【政商】はのちに財閥へ成長する。外交では【1871年】に【岩倉使節団】が条約改正の予備交渉のため欧米へ渡ったが失敗し、帰国後の内治優先派と留守政府の征韓派が対立して【明治六年の政変】が起きた。東アジアには【日清修好条規】、【台湾出兵】、【江華島事件】を経た【日朝修好条規】、【琉球処分】と強圧的な外交を進め、【樺太・千島交換条約】と【小笠原諸島】領有で国境を確定した。","keywords":["太政官札","新貨条例","国立銀行条例","渋沢栄一","第一国立銀行","政商","岩倉使節団","明治六年の政変","日清修好条規","台湾出兵","樺太・千島交換条約","江華島事件","日朝修好条規","琉球処分"],"blanks":[{"q":"1871年の新貨条例は、【　】・銭・厘の十進法による金本位制の確立を図った。","a":"円","h":"伊藤博文の建議"},{"q":"1872年、渋沢栄一の尽力で【　】が制定され、アメリカの制度にならった民間銀行が設立された。","a":"国立銀行条例","h":"第一国立銀行など4行のみ設立"},{"q":"国立銀行条例制定に尽力した【　】は、第一国立銀行の設立にも関わった。","a":"渋沢栄一","h":"大蔵省に出仕した後、実業界で活躍"},{"q":"政府の保護を受けた特権的商人を【　】といい、のちに財閥へ成長するものも多かった。","a":"政商","h":"三井・三菱・五代友厚など"},{"q":"薩摩藩出身の政商【　】は、のちに開拓使官有物払い下げ事件に関わった。","a":"五代友厚","h":"関西貿易社を経営"},{"q":"1871〜73年の岩倉使節団は、右大臣【　】を大使とした。","a":"岩倉具視","h":"副使は大久保利通・木戸孝允・伊藤博文・山口尚芳"},{"q":"1871年に結ばれた【　】は、相互に領事裁判権を認め合う日本初の対等条約であった。","a":"日清修好条規","h":"日本全権伊達宗城、清国全権李鴻章"},{"q":"1874年の台湾出兵に反対して政府を下野したのは【　】である。","a":"木戸孝允","h":"長州藩出身、維新の三傑の一人"},{"q":"1879年、政府は【　】を設置して琉球処分を完了した。","a":"沖縄県","h":"藩王尚泰は東京に移された"},{"q":"1875年の【　】では、日本の軍艦雲揚が朝鮮側を挑発し戦闘に発展した。","a":"江華島事件","h":"翌年の日朝修好条規につながる"},{"q":"1875年の樺太・千島交換条約では、【　】が日本全権を務めた。","a":"榎本武揚","h":"旧幕臣、五稜郭で降伏した人物"},{"q":"1876年、前年に米・英へ領有宣言をして異議がなかった【　】の領有が確定した。","a":"小笠原諸島","h":"内務省のち東京府が管轄"}],"mc":[{"q":"1872年の国立銀行条例で銀行設立が4行にとどまった理由として最も適当なものはどれか。","c":["発行銀行券の正貨兌換を義務付けたため","金禄公債証書を資本金にできなかったため","政府が銀行設立を禁止したため","松方デフレで資金が不足したため"],"a":0,"e":"正貨兌換義務が重かったため設立は4行にとどまり、1876年の改正で義務が除かれると設立が急増した。"},{"q":"1876年の国立銀行条例改正の結果として正しいものはどれか。","c":["銀行設立が減少しデフレが進んだ","国立銀行が普通銀行に転換した","設立が急増し不換紙幣が出回りインフレが進んだ","日本銀行が設立された"],"a":2,"e":"兌換義務撤廃と金禄公債の資本金化で第十五国立銀行などが急増し、不換紙幣が出回ってインフレを招いた。"},{"q":"新貨条例について正しいものはどれか。","c":["渋沢栄一の建議で制定された","銀本位制の確立を図った","1882年に制定された","円・銭・厘の十進法を採用した"],"a":3,"e":"1871年、伊藤博文の建議で円・銭・厘の十進法による金本位制の確立を図ったが、実際は金銀複本位制だった。"},{"q":"岩倉使節団の派遣が明治六年の政変につながった経緯として最も適当なものはどれか。","c":["条約改正に成功した使節団が留守政府に対立を挑んだため","外遊体験をした使節団と留守政府が征韓論をめぐり対立したため","留守政府が使節団の帰国を拒んだため","使節団が朝鮮に出兵したため"],"a":1,"e":"欧米視察から帰国した岩倉・大久保らの内治優先派が、留守政府の西郷・板垣ら征韓派を破り、征韓派が下野した。"},{"q":"明治六年の政変で下野した人物として誤っているものはどれか。","c":["西郷隆盛","板垣退助","大久保利通","江藤新平"],"a":2,"e":"大久保利通は内治優先派として政府に残った。西郷・板垣・後藤・江藤・副島が下野した。"},{"q":"台湾出兵の結果として正しいものはどれか。","c":["清国が日本に事実上の賠償金を支払った","日本が台湾を領有した","琉球が清国領となった","日清修好条規が破棄された"],"a":0,"e":"大久保利通が北京で交渉し、イギリスの調停で清国が50万両を支払うことで決着した。"},{"q":"樺太・千島交換条約の背景として最も適当なものはどれか。","c":["ロシアが千島列島の放棄を求めたため","征韓論を実行するため","小笠原諸島の領有を認めさせるため","黒田清隆が北海道開拓専念のため樺太放棄を主張したため"],"a":3,"e":"開拓長官黒田清隆が北海道開拓に専念するため樺太放棄を主張し、樺太をロシア領、千島全島を日本領とした。"},{"q":"日朝修好条規について正しいものはどれか。","c":["日本と朝鮮が対等な条約であった","清国の宗主権を認めた","領事裁判権・関税免除を朝鮮に承認させた日本優位の条約であった","日本全権は伊達宗城であった"],"a":2,"e":"黒田清隆を全権とし、領事裁判権・関税免除を承認させた不平等条約で、清国の宗主権を否定した。"}],"order":[{"title":"貨幣・金融制度の整備","items":["太政官札の発行","新貨条例","国立銀行条例","国立銀行条例改正"],"e":"1868年太政官札→1871年新貨条例→1872年国立銀行条例→1876年改正で設立急増。"},{"title":"清・琉球との関係","items":["日清修好条規","琉球藩の設置","台湾出兵","沖縄県の設置"],"e":"1871年日清修好条規→1872年琉球藩→1874年台湾出兵→1879年沖縄県設置で琉球処分完了。"},{"title":"朝鮮との関係","items":["征韓論・明治六年の政変","江華島事件","日朝修好条規"],"e":"1873年征韓論で政変→1875年江華島事件→1876年日朝修好条規で朝鮮を開国させた。"}]},{"title":"新政府への抵抗と自由民権運動の開始","flow":[{"y":"1873","t":"明治六年の政変","s":"征韓派参議の西郷隆盛・板垣退助・江藤新平らが下野","why":"不平士族がその下に結集する契機"},{"y":"1874","t":"民撰議院設立の建白書","s":"板垣退助らが愛国公党を結成し左院に提出、自由民権運動が始まる","why":"大久保利通ら薩長藩閥の「有司専制」への不満"},{"y":"1874","t":"佐賀の乱","s":"江藤新平らが征韓党を結成して挙兵、江藤は処刑","why":"征韓論の敗北と特権剥奪への不満"},{"y":"1874","t":"立志社の設立","s":"高知で板垣退助・片岡健吉らが結成","why":""},{"y":"1875","t":"大阪会議","s":"大久保・木戸・板垣が会談し、漸次立憲政体樹立の詔、元老院・大審院・地方官会議の設置が決まる","why":"政府が民権派に妥協し木戸・板垣を参議に復帰させるため"},{"y":"1875","t":"愛国社の結成・讒謗律","s":"大阪で各地政社の連合組織を結成、政府は讒謗律・新聞紙条例で弾圧","why":"妥協と弾圧により民権運動は一時沈滞"},{"y":"1876","t":"神風連の乱・秋月の乱・萩の乱","s":"廃刀令・秩禄処分に憤激した不平士族が各地で挙兵","why":"特権の剥奪と経済的困窮"},{"y":"1876","t":"地租改正反対一揆","s":"茨城大一揆・伊勢暴動など大規模な一揆が発生","why":"翌年地租が2.5％に引き下げられる"},{"y":"1877","t":"西南戦争","s":"西郷隆盛ら私学校生を中心とした最大・最後の士族反乱、徴兵軍が鎮圧","why":"以後、武力から言論による民権運動へ"},{"y":"1878","t":"紀尾井坂の変","s":"大久保利通が暗殺され維新の三傑が全て死没","why":""}],"story":"【徴兵令】や【征韓論】の敗北、【廃刀令】・【秩禄処分】で特権を奪われ困窮した士族は、【明治六年の政変】で下野した【西郷隆盛】・【江藤新平】らの下に結集した。【1874年】の【佐賀の乱】、【1876年】の【神風連の乱】・【秋月の乱】・【萩の乱】と反乱が続き、【1877年】の【西南戦争】は最大の反乱となったが徴兵軍に敗れ、これを最後に武力反抗は終わり、抵抗は言論による【自由民権運動】へ移った。農民も【学制】・徴兵令・地租改正の負担増に反発して一揆を起こし、政府は士族の反乱と結びつくことを恐れて【1877年】に地租を【2.5％】に引き下げた。民権運動は、【大久保利通】らの「【有司専制】」に不満を持つ【板垣退助】らが【1874年】に【愛国公党】を結成し【民撰議院設立の建白書】を左院に提出したことで始まった。板垣は高知で【立志社】を設立、【1875年】の【大阪会議】で政府は【漸次立憲政体樹立の詔】を出し【元老院】・【大審院】を設置して板垣らを参議に復帰させたが、同時に【讒謗律】・【新聞紙条例】で言論を弾圧したため、運動は一時沈滞した。","keywords":["士族の反乱","佐賀の乱","萩の乱","西南戦争","紀尾井坂の変","血税一揆","自由民権運動","有司専制","愛国公党","民撰議院設立の建白書","立志社","大阪会議","愛国社","讒謗律","新聞紙条例","中 免されたため","松方デフレで豪農が離脱したため"],"a":0,"e":"大阪会議の妥協と讒謗律・新聞紙条例の弾圧、さらに立志社の一部が西南戦争に加わろうとしたこともあり下火となった。"},{"q":"士族の反乱の順序として正しいものはどれか。","c":["萩の乱→佐賀の乱→西南戦争","佐賀の乱→萩の乱→西南戦争","西南戦争→佐賀の乱→萩の乱","佐賀の乱→西南戦争→萩の乱"],"a":1,"e":"1874年佐賀の乱→1876年神風連・秋月・萩の乱→1877年西南戦争。"}],"order":[{"title":"士族の反乱","items":["佐賀の乱","神風連の乱","萩の乱","西南戦争","紀尾井坂の変"],"e":"1874年佐賀の乱→1876年神風連・秋月・萩の乱→1877年西南戦争→1878年大久保暗殺。"},{"title":"自由民権運動の開始","items":["明治六年の政変","民撰議院設立の建白書","立志社の設立","大阪会議","立志社建白"],"e":"1873年政変で下野→1874年建白書提出→同年高知で立志社→1875年大阪会議→1877年立志社建白。"}]},{"title":"自由民権運動の拡大と激化・衰退","flow":[{"y":"1878","t":"三新法・愛国社再興","s":"初の統一的地方制度が定まり、愛国社が第2回大会で再興","why":"士族反乱や一揆が収まったため。運動は「豪農民権」へ"},{"y":"1880","t":"国会期成同盟・集会条例","s":"国会開設請願書の提出を試みるが拒否され、政府は集会条例で規制","why":""},{"y":"1881","t":"開拓使官有物払い下げ事件","s":"黒田清隆が五代友厚に不当な低価格で払い下げようとして世論の攻撃を浴びる","why":"藩閥の横暴として批判され中止"},{"y":"1881","t":"明治十四年の政変","s":"早期国会開設を主張する大隈重信を岩倉具視・伊藤博文らが罷免、国会開設の勅諭で1890年開設を公約","why":"大久保利通死後の主導権争い"},{"y":"1881","t":"自由党の結成","s":"板垣退助を党首にフランス流急進主義、翌年大隈重信の立憲改進党（イギリス流漸進主義）","why":"国会開設に備えて政党が結成された"},{"y":"1881","t":"松方財政の開始","s":"大蔵卿松方正義が増税と緊縮財政でインフレを収拾、1882年日本銀行設立","why":"インフレの収拾と安定した貨幣制度の確立のため"},{"y":"1882","t":"福島事件","s":"県令三島通庸と県会議長河野広中らが対立、激化事件が始まる","why":"松方デフレで豪農が離脱し運動が急進化"},{"y":"1884","t":"自由党解党・秩父事件","s":"指導部が解党を決議、埼玉で困民党約1万人が蜂起し軍隊が鎮圧","why":"松方デフレ下の農民の困窮"},{"y":"1886","t":"大同団結運動","s":"星亨のち後藤象二郎が中心に民権派の再結集を提唱","why":"井上馨外相の鹿鳴館外交への反発"},{"y":"1887","t":"三大事件建白運動・保安条例","s":"地租軽減・言論集会の自由・外交失策の回復を要求、政府は保安条例で民権派570名を追放","why":""}],"story":"【1878年】の【三新法】で初の統一的地方制度ができると【愛国社】が再興され、運動は寄生地主・商工業者も加わる「【豪農民権】」へ広がった。【1880年】の【国会期成同盟】の請願は拒否され、政府は【集会条例】で取り締まった。【1881年】、【黒田清隆】が【五代友厚】へ官有物を不当に安く払い下げようとした【開拓使官有物払い下げ事件】が世論の攻撃を浴びると、政府は早期開設論の【大隈重信】を罷免する一方、【国会開設の勅諭】で1890年の国会開設を公約した（【明治十四年の政変】）。これを受け【板垣退助】のフランス流【自由党】、大隈のイギリス流【立憲改進党】が結成された。同じ頃、大蔵卿【松方正義】がインフレ収拾のため緊縮の【松方財政】を行い【1882年】に【日本銀行】を設立したが、物価下落で豪農・豪商が運動から離脱し、貧農と結びついた自由党員が急進化した。【福島事件】に始まる激化事件が続き、【1884年】に自由党は解党、【秩父事件】は軍隊が鎮圧する最大の激化事件となり運動は衰退した。しかし【鹿鳴館外交】への反発から【1886年】に【大同団結運動】、【1887年】に【三大事件建白運動】で民権派が再結集し、政府は【保安条例】で対抗した。","ke "},{"q":"松方デフレが自由民権運動に与えた影響として最も適当なものはどれか。","c":["豪農が資金を提供し運動が穏健化した","豪農・豪商が運動から離脱し、貧農と結びついた運動が急進化した","士族が運動に加わり武力反乱に発展した","政府が地租を引き下げ運動が終息した"],"a":1,"e":"物価下落で経営難となった豪農・豪商が手を引き、困窮した農民と結びついた自由党員が激化事件を起こした。"},{"q":"秩父事件について正しいものはどれか。","c":["県令三島通庸と河野広中が対立した","旧自由党員らが困民党を間接的に支援し、軍隊が鎮圧した","朝鮮に渡ろうとした大井憲太郎らが検挙された","板垣退助が襲撃された"],"a":1,"e":"1884年、埼玉で困民党約1万人が蜂起し軍隊が出動した最大の激化事件。福島事件・大阪事件・岐阜事件と区別する。"},{"q":"大同団結運動が拡大した背景として最も適当なものはどれか。","c":["井上馨外相の鹿鳴館外交への反発","松方デフレによる不況","秩父事件の成功","国会開設の勅諭"],"a":0,"e":"条約改正問題で鹿鳴館外交への反発が高まり、星亨・後藤象二郎を中心に民権派の再結集が進んだ。"}],"order":[{"title":"民権運動の拡大と政党結成","items":["三新法・愛国社再興","国会期成同盟の発足","明治十四年の政変","自由党の結成","立憲改進党の結成"],"e":"1878年三新法→1880年国会期成同盟→1881年10月政変で国会開設公約→同年自由党→1882年立憲改進党。"},{"title":"激化事件","items":["福島事件","加波山事件","秩父事件","大阪事件","静岡事件"],"e":"1882年福島→1883年加波山→1884年秩父→1885年大阪→1886年静岡。"},{"title":"民権派の再結集と弾圧","items":["大同団結運動の提唱","三大事件建白運動","保安条例","大日本帝国憲法発布"],"e":"1886年大同団結→1887年三大事件建白→同年保安条例で追放→1889年憲法発布で大赦。"}]},{"title":"立憲国家の成立","flow":[{"y":"1880","t":"『日本国憲按』廃案","s":"岩倉具視らが元老院の憲法草案を日本の国体に合わないとして廃案","why":""},{"y":"1882","t":"伊藤博文の渡欧","s":"憲法調査のためヨーロッパへ、グナイスト・シュタインにドイツ流憲法理論を学ぶ","why":"立憲君主の下で内閣が主導権を握る体制をつくるため"},{"y":"1884","t":"華族令","s":"井上毅が起草、公・侯・伯・子・男の5爵を定め将来の貴族院の土台とする","why":"皇室の藩屏とするため"},{"y":"1885","t":"内閣制度の創設","s":"太政官制を廃止、伊藤博文が初代首相、宮内省は内閣の外に置く","why":"宮中・府中の別を明確にし天皇に政治責任が及ばないようにする"},{"y":"1886","t":"憲法の起草","s":"伊藤博文・井上毅・伊東巳代治・金子堅太郎がロエスレルの助言で非公開に進める","why":""},{"y":"1888","t":"市制・町村制・枢密院","s":"モッセの助言で市制・町村制を公布、憲法審議のため枢密院を設置","why":""},{"y":"1889","t":"大日本帝国憲法の発布","s":"2月11日、黒田清隆内閣の下で欽定憲法として発布、皇室典範も制定","why":"アジア初の近代的立憲国家"},{"y":"1890","t":"府県制・郡制","s":"地方議会は制限選挙で地方名望家が実権を握る","why":""},{"y":"1890","t":"民法・商法の公布","s":"ボアソナードの民法に民法典論争、ロエスレルの商法に商法典論争が起き施行延期","why":"日本の家制度・商習慣に合わないと批判されたため"},{"y":"1896","t":"修正民法（明治民法）","s":"穂積陳重らがドイツ法系に修正、戸主権の強い家制度が残る","why":""}],"story":"【1880年】に元老院の『【日本国憲按】』が廃案となると、【1882年】に【伊藤博文】が憲法調査のため渡欧し、【グナイスト】・【シュタイン】からドイツ流の憲法理論を学んだ。立憲君主の下で内閣が主導権を握るためにドイツ流が選ばれたのである。帰国後、【1884年】に【華族令】で将来の貴族院の土台をつくり、【1885年】に【内閣制度】を創設して伊藤が初代首相となったが、首相は「同輩中の首席」にすぎず、宮中と府中を分けるため【宮内省】を内閣の外に置き【内大臣】を設けた。【1886年】から【井上毅】らが【ロエスレル】の助言で憲法を起草し、【1888年】に【枢密院】を設置、【1889年】2月11日に【黒田清隆】内閣の下で【大日本帝国憲法】が発布された。天皇が制定する【欽定憲法】で、天皇主権のもと広範な【天皇大権】と内閣から独立した【統帥権】をもち、帝国議会は【協賛機関】、臣民の権利は法律の留保を受ける硬性憲法であった。法典では【ボアソナード】の民法、ロエスレルの商法が【民法典論争】・商法典論争で施行延期となり、【1896年】からドイツ法系の【明治民法】が公布されて家父長制的な【家】制度が残った。","keywords":["伊藤博文","シュタイン","華族令","内閣制度","内大臣","ロエスレル","枢密院","大日本帝国憲法","欽定憲法","統帥権","天皇大権","皇室典範","ボアソナード","民法典論争","明治民法"],"blanks":[{"q":"1882年、【　】が憲法調査のためヨーロッパへ出発した。","a":"伊藤博文","h":"のち初代内閣総理大臣"},{"q":"伊藤博文はウィーン大学の【　】からドイツ流憲法理論を学んだ。","a":"シュタイン","h":"ベルリン大学のグナイストと並ぶ"},{"q":"1884年の【　】により公・侯・伯・子・男の5爵位が定められ、将来の貴族院の土台となった。","a":"華族令","h":"井上毅が起草"},{"q":"1885年に内閣制度が創設され、宮中では三条実美が【　】となって天皇を常侍輔弼した。","a":"内大臣","h":"宮中・府中の別を明確にするため"},{"q":"憲法の起草はドイツ人顧問【　】の助言を得て非公開で進められた。","a":"ロエスレル","h":"商法も起草した"},{"q":"1888年に設置された【　】は天皇の最高諮問機関で「欽定憲法の番人」と呼ばれた。","a":"枢密院","h":"初代議長は伊藤博文"},{"q":"1889年、皇位継承などを定めた【　】が制定されたが、公布はされなかった。","a":"皇室典範","h":"「臣民の干渉する所に非ざるなり」"},{"q":"大日本帝国憲法は君主が制定する【　】憲法である。","a":"欽定","h":"民定憲法の対義語"},{"q":"大日本帝国憲法では、陸海軍の【　】が内閣から独立して存在した。","a":"統帥権","h":"天皇大権の一つ"},{"q":"大日本帝国憲法下で天皇の名の下に裁判を行う司法機関は【　】である。","a":"大審院","h":"1875年の大阪会議で設置が決まった"},{"q":"1880年の刑法・治罪法は、フランス人顧問【　】が起草した。","a":"ボアソナード","h":"民法も起草"},{"q":"1890年公布の民法をめぐって、穂積八束「民法出でて忠孝亡ぶ」に代表される【　】が起こった。","a":"民法典論争","h":"施行延期につながる"}],"mc":[{"q":"大日本帝国憲法がドイツ流とされた理由として最も適当なものはどれか。","c":["民権派の私擬憲法を採用したため","議院内閣制を実現するため","主権在民を認めるため","立憲君主の下で内閣が主導権を握るため"],"a":3,"e":"伊藤博文はグナイスト・シュタインからドイツ流憲法理論を学び、君主権の強い体制を採用した。"},{"q":"1885年の内閣制度創設について正しいものはどれか。","c":["宮内省を内閣の中に置いた","初代首相は黒田清隆であった","宮中・府中の別を明確にするため内大臣府を設置した","太政官制は存続した"],"a":2,"e":"太政官制を廃止し伊藤博文が初代首相となり、宮内省を内閣の外に置き内大臣府を設けて天皇に政治責任が及ばないようにした。"},{"q":"華族令が制定された目的として最も適当なものはどれか。","c":["将来の貴族院の土台をつくるため","士族の反乱を防ぐため","衆議院議員の資格を定めるため","地方名望家を保護するため"],"a":0,"e":"国家に功績のあった者を華族に加えて「皇室の藩屏」とし、将来の貴族院の土台をつくった。"},{"q":"大日本帝国憲法の内容として正しいものはどれか。","c":["帝国議会は国権の最高機関であった","内閣について詳細に規定した","国務大臣は個々に天皇を輔弼し天皇に対してのみ責任を負った","臣民の権利は無制限に保障された"],"a":2,"e":"内閣の規定はなく、国務大臣は天皇に対してのみ責任を負い、議会は協賛機関、臣民の権利は法律の留保を受けた。"},{"q":"大日本帝国憲法における帝国議会の位置づけとして正しいものはどれか。","c":["天皇の協賛機関で衆議院と貴族院は対等","衆議院が貴族院に優越した","唯一の立法機関であった","一院制であった"],"a":0,"e":"帝国議会は天皇の協賛機関で、衆議院と貴族院の二院制で両院は対等であった。"},{"q":"民法典論争の結果として正しいものはどれか。","c":["ボアソナードの民法がそのまま施行された","商法が廃止された","刑法がフランス法系に改められた","民法の施行が延期され、ドイツ法系に修正された"],"a":3,"e":"1892年に施行延期が決まり、法典調査会で穂積陳重らが修正した明治民法が1896年から公布された。"},{"q":"外国人顧問と業績の組合せとして正しいものはどれか。","c":["モッセ＝刑法の起草","ロエスレル＝市制・町村制の助言","ボアソナード＝刑法・民法の起草","シュタイン＝憲法草案の助言"],"a":2,"e":"ボアソナードは刑法・民法、ロエスレルは憲法助言と商法、モッセは市制・町村制、シュタインは伊藤にウィーンで教授。"}],"order":[{"title":"憲法制定の経過","items":["伊藤博文の渡欧","華族令","内閣制度の創設","枢密院の設置","大日本帝国憲法発布"],"e":"1882年渡欧→1884年華族令→1885年内閣制度→1888年枢密院→1889年憲法発布。"},{"title":"近代法典の編纂","items":["新律綱領","改定律例","刑法・治罪法","民法・商法の公布","修正民法（明治民法）"],"e":"1870年新律綱領→1873年改定律例→1880年刑法→1890年民法・商法→論争を経て1896年明治民法。"}]}],"review":[{"q":"廃藩置県から自由民権運動の開始までの流れとして最も適当なものはどれか。","c":["廃藩置県で藩閥政府が形成され、その有司専制への不満から民撰議院設立の建白書が出された","民撰議院設立の建白書を受けて廃藩置県が行われた","版籍奉還で藩が廃止され、その反発から西南戦争が起きた","廃藩置県により士族の特権が保障され、民権運動は起こらなかった"],"a":0,"e":"廃藩置県で薩長土肥の藩閥政府が確立し、大久保利通らの有司専制に不満を持つ板垣退助らが1874年に建白書を提出した。"},{"q":"明治六年の政変が国内政治に与えた影響として最も適当なものはどれか。","c":["征韓派が政府の主導権を握り朝鮮に出兵した","下野した征韓派が士族の反乱と自由民権運動の両方の起点となった","岩倉使節団が派遣されることになった","廃藩置県が断行された"],"a":1,"e":"下野した江藤新平は佐賀の乱、西郷隆盛は西南戦争を起こし、板垣退助らは民撰議院設立の建白書を提出した。"},{"q":"地租改正と農民一揆・士族反乱の関係として最も適当なものはどれか。","c":["地租改正で農民の負担が軽減され一揆は起きなかった","地租改正反対一揆を鎮圧するため西南戦争が起きた","士族の反乱の結果、地租は3％に引き上げられた","地租改正反対一揆が士族の反乱と結びつくことを恐れた政府は地租を2.5％に引き下げた"],"a":3,"e":"1876年の大規模な一揆が士族反乱と結合することを恐れ、西南戦争直前の1877年に地租を引き下げた。"},{"q":"西南戦争と松方財政の関係として最も適当なものはどれか。","c":["西南戦争の戦費のため不換紙幣が濫発されインフレとなり、松方正義が緊縮財政で収拾した","松方デフレへの不満から西南戦争が起きた","西南戦争で正貨が流入しデフレとなったため松方が積極財政を行った","松方財政で国立銀行が増設され西南戦争の戦費がまかなわれた"],"a":0,"e":"西南戦争の戦費調達で不換紙幣が濫発されインフレを招き、1881年から松方正義が増税・緊縮で収拾し銀本位制を確立した。"},{"q":"松方デフレと自由民権運動の激化の関係として最も適当なものはどれか。","c":["松方デフレで豪農が豊かになり運動が拡大した","松方デフレで士族が困窮し萩の乱を起こした","不況で豪農・豪商が運動から離脱し、貧農と結びついた自由党員が秩父事件などを起こした","松方デフレに反対して民撰議院設立の建白書が出された"],"a":2,"e":"松方デフレは豪農民権を崩し、農民民権への転換と激化事件の続発を招き、運動は衰退した。"},{"q":"明治十四年の政変から大日本帝国憲法発布までの流れとして正しいものはどれか。","c":["国会開設の勅諭→伊藤博文の渡欧→内閣制度創設→枢密院設置→憲法発布","伊藤博文の渡欧→国会開設の勅諭→憲法発布→内閣制度創設→枢密院設置","内閣制度創設→国会開設の勅諭→伊藤博文の渡欧→憲法発布→枢密院設置","国会開設の勅諭→枢密院設置→伊藤博文の渡欧→内閣制度創設→憲法発布"],"a":0,"e":"1881年勅諭で1890年開設を公約→1882年伊藤渡欧→1885年内閣制度→1888年枢密院→1889年憲法発布。"}]},{"id":17,"title":"「脱亜入欧」の達成と帝国主義","era":"明治時代後期〜大正時代前期","span":"1889〜1922","oneLine":"条約改正と日清・日露戦争の勝利で列強入りし、藩閥と政党は妥協しつつ帝国主義の道を進んだ","chain":["黒田清隆内閣","第1次山県有朋内閣","第1次松方正義内閣","第2次伊藤博文内閣","第2次松方正義内閣","第3次伊藤博文内閣","第1次大隈重信内閣","第2次山県有朋内閣","第4次伊藤博文内閣","桂園時代"],"parts":[{"title":"初期議会と条約改正","flow":[{"y":"1889","t":"衆議院議員選挙法・超然主義演説","s":"選挙権は直接国税15円以上を納める満25歳以上の男子（全人口の1.1%）。黒田清隆首相は政府は政党に左右されないと演説","why":"藩閥政府が政党の影響を受けずに政策を進めるため"},{"y":"1890","t":"第一回総選挙・第一議会","s":"民党（立憲自由党・立憲改進党）が過半数。第1次山県内閣は主権線・利益線論で軍拡を主張し、立憲自由党土佐派の裏切りで予算成立","why":"民党は「政費節減・民力休養」を掲げ予算削減を要求したため対立"},{"y":"1892","t":"第二回総選挙の選挙干渉","s":"品川弥二郎内相が大規模な選挙干渉を行うが民党が勝利。品川は引責辞任し国民協会を結成","why":"政府が民党を弱体化させようとしたため"},{"y":"1893","t":"建艦詔勅（和衷協同の詔書）","s":"第2次伊藤内閣は第四議会で内閣弾劾上奏案を可決されるが、明治天皇の詔勅で軍拡予算を成立させ民党連合は崩壊","why":"自由党と政府の提携が強まったため"},{"y":"1893","t":"第五・六議会と対外硬派連合","s":"大隈重信率いる立憲改進党が国民協会と硬六派を結成し、陸奥宗光外相の条約改正交渉を軟弱と非難","why":"現行条約励行の強硬外交を主張し内地雑居に反対したため"},{"y":"1886","t":"ノルマントン号事件","s":"井上馨外相の鹿鳴館外交のさなか、イギリス船沈没で日本人乗客が見殺しにされ船長の過失が軽く扱われる","why":"領事裁判制度のため国民は法権回復の必要性を痛感"},{"y":"1889","t":"大隈重信外相襲撃","s":"外国人判事任用が『ロンドン=タイムズ』に暴露され世論が沸騰、玄洋社の来島恒喜が大隈を爆弾で襲撃し黒田内閣は総辞職","why":"秘密交渉の条件が国権を損なうと民権派・国権派が連合して反対したため"},{"y":"1891","t":"大津事件","s":"青木周蔵外相の交渉中、巡査津田三蔵がロシア皇太子を暴行し青木は辞任。大審院長児島惟謙は無期徒刑判決で司法権の独立を護る","why":"第1次松方内閣は日露関係悪化を恐れ死刑を求めたが児島が反対"},{"y":"1894","t":"日英通商航海条約","s":"陸奥宗光外相が青木案を踏襲し、日清戦争直前に締結。法権回復に成功し1899年発効","why":"ロシアの南下を警戒したイギリスが同意したため"},{"y":"1911","t":"改正日米通商航海条約","s":"小村寿太郎外相が第2次桂内閣のもとで税権を完全回復し、条約改正を達成","why":"日露戦争の勝利で国際的地位が急上昇し列国の反対が減ったため"}],"story":"1889年の憲法発布翌日、【黒田清隆】首相は政府は政党に左右されないという【超然主義】演説を行った。しかし1890年の第一回総選挙で旧民権派の【民党】が過半数を獲得したため→議会では軍備拡張を主張する政府と「政費節減・民力休養」を唱える民党が予算問題で激突した。第1次松方内閣は【選挙干渉】まで行ったが民党は勝利し→1893年、第2次伊藤内閣は【建艦詔勅】でようやく軍拡予算を通し、民党連合は崩壊した。一方、条約改正は【井上馨】の鹿鳴館外交が【ノルマントン号事件】と外国人判事任用問題で批判を浴びて挫折→【大隈重信】も秘密交渉が暴露されて襲撃され→【青木周蔵】は【大津事件】で辞任した。しかしロシアの南下を警戒するイギリスが歩み寄ったため→1894年、【陸奥宗光】が【日英通商航海条約】で法権回復に成功し、日露戦争勝利後の1911年に【小村寿太郎】が税権を完全回復して条約改正は達成された。","keywords":["超然主義","民党","吏党","主権線・利益線","政費節減・民力休養","選挙干渉","建艦詔勅","対外硬派連合","鹿鳴館","ノルマントン号事件","大津事件","児島惟謙","日英通商航海条約","改正日米通商航海条約"],"blanks":[{"q":"1889年2月12日、黒田清隆首相は政府が政党に左右されず独自に政策を進めるという【　】演説を行った。","a":"超然主義","h":"憲法発布の翌日の演説"},{"q":"第一回総選挙では旧民権派の【　】が過半数を獲得し、立憲自由党が130議席で第一党となった。","a":"民党","h":"政府支持の政党は吏党"},{"q":"第一議会で第1次【　】内閣は「主権線・利益線」防衛のため軍備拡張を主張した。","a":"山県有朋","h":"利益線とは朝鮮のこと"},{"q":"第二議会では【　】海相の蛮勇演説で議会が紛糾し解散した。","a":"樺山資紀","h":"薩摩藩出身の海軍大臣"},{"q":"第二回総選挙では【　】内相が大規模な選挙干渉を行ったが民党が勝利した。","a":"品川弥二郎","h":"引責辞任後、国民協会を結成"},{"q":"1893年、第2次伊藤博文内閣は明治天皇の【　】により辛うじて軍備拡張予算を成立させた。","a":"建艦詔勅","h":"和衷協同の詔書ともいう"},{"q":"第五議会では大隈重信率いる立憲改進党が国民協会を巻き込み【　】（硬六派）を結成した。","a":"対外硬派連合","h":"現行条約励行を主張"},{"q":"1883年、井上馨は東京にイギリス人コンドル設計の【　】を建て、極端な欧化政策を進めた。","a":"鹿鳴館","h":"連日の舞踏会・音楽会"},{"q":"1886年の【　】事件では、イギリス人船長の過失が軽く扱われ、国民は法権回復の必要を痛感した。","a":"ノルマントン号","h":"イギリス船の沈没事件"},{"q":"1891年の【　】で青木周蔵外相は辞任したが、大審院長児島惟謙は司法権の独立を護った。","a":"大津事件","h":"巡査津田三蔵がロシア皇太子を暴行"},{"q":"1894年、陸奥宗光外相は【　】を締結して法権回復に成功した。","a":"日英通商航海条約","h":"日清戦争の直前に締結"},{"q":"1911年、【　】外相が改正日米通商航海条約を結び、税権の完全回復を達成した。","a":"小村寿太郎","h":"第2次桂太郎内閣の外相"}],"mc":[{"q":"第一議会で政府と民党が対立した主な理由として正しいものはどれか。","c":["民党が条約改正の即時実施を求めたため","政府が軍備拡張予算を提出し、民党が政費節減・民力休養を唱えて削減を求めたため","民党が超然主義を主張したため","政府が地租増徴を提案したため"],"a":1,"e":"政府は主権線・利益線防衛のため軍拡を主張、民党は政費節減・民力休養で予算削減を要求した。"},{"q":"第一議会で政府の軍備拡張予算が成立した直接の要因はどれか。","c":["立憲改進党が政府と提携したため","天皇の詔勅が出されたため","立憲自由党土佐派の裏切りで双方が妥協したため","選挙干渉で民党が敗北したため"],"a":2,"e":"土佐派の裏切りに憤激した中江兆民は議会を「無血虫の陳列場」と批判し辞職した。"},{"q":"1893年の建艦詔勅の結果として正しいものはどれか。","c":["民党連合が崩壊し自由党と政府の提携が強まった","第2次伊藤内閣が総辞職した","対外硬派連合が結成された","松方内閣が選挙干渉を行った"],"a":0,"e":"詔勅により民党は軍備予算で妥協せざるを得なくなり、自由党が政府に接近した。"},{"q":"井上馨の条約改正交渉が挫折した背景として正しいものはどれか。","c":["大津事件で外相が辞任したため","外国人判事の任用などを容認していたことが批判され、三大事件建白運動が起きたため","アメリカが税権回復に反対したため","日清戦争が始まったため"],"a":1,"e":"外国人判事任用・内地雑居・法典編纂の秘密容認が暴露され、政府内外の批判で井上は辞任した。"},{"q":"1889年に大隈重信外相が襲撃された背景として正しいものはどれか。","c":["鹿鳴館外交への反発","民権派の議員辞職","秘密の交渉条件がロンドン=タイムズに暴露され、民権派・国権派が連合して反対したため","ロシア皇太子への暴行事件"],"a":2,"e":"外国人判事任用を大審院に限る案が暴露されて世論が沸騰し、玄洋社の来島恒喜が襲撃した。"},{"q":"青木周蔵外相の交渉にイギリスが同意を示した理由として正しいものはどれか。","c":["日清戦争で日本が勝利したため","日本が鹿鳴館を建てたため","アメリカが先に同意したため","ロシアの南下を警戒したため"],"a":3,"e":"ロシアの南下を警戒するイギリスは日本との関係改善を望み、同意を示した。"},{"q":"1911年に条約改正が達成できた要因として最も適当なものはどれか。","c":["日露戦争の勝利で日本の国際的地位が向上し列国の反対が減ったため","イギリスが日英同盟を破棄したため","ノルマントン号事件で世論が高まったため","対外硬派連合が内閣を弾劾したため"],"a":0,"e":"日清・日露戦争の勝利による国際的地位の向上と国力の充実、法典編纂が成功の要因。"},{"q":"条約改正交渉を担当した人物と出来事の組み合わせとして誤っているものはどれか。","c":["寺島宗則―税権回復をめざしたがイギリスなどの反対で失敗","井上馨―鹿鳴館外交","陸奥宗光―大津事件で辞任","小村寿太郎―改正日米通商航海条約"],"a":2,"e":"大津事件で辞任したのは青木周蔵。陸奥宗光は日英通商航海条約を締結した。"}],"order":[{"title":"初期議会の展開","items":["超然主義演説","第一回総選挙で民党勝利","品川弥二郎の選挙干渉","建艦詔勅で軍拡予算成立","対外硬派連合の結成"],"e":"1889年演説→1890年総選挙→1892年選挙干渉→1893年建艦詔勅→1893年第五議会で硬六派結成。"},{"title":"条約改正交渉の担当者","items":["岩倉具視","寺島宗則","井上馨","大隈重信","青木周蔵"],"e":"岩倉使節団（1871〜）→寺島（税権交渉）→井上（鹿鳴館外交）→大隈（襲撃される）→青木（大津事件）の順。"},{"title":"条約改正達成までの経過","items":["ノルマントン号事件","大隈重信の襲撃","大津事件","日英通商航海条約","改正日米通商航海条約"],"e":"1886年→1889年→1891年→1894年法権回復→1911年税権回復。"}]},{"title":"朝鮮問題と日清戦争","flow":[{"y":"1882","t":"壬午軍乱","s":"親清的保守派の大院君一派が旧式軍隊と結び漢城でクーデタ。日本公使館を焼打ちしたが清が出兵し鎮圧。済物浦条約で日本は賠償金と公使館守備兵駐留権を得る","why":"親日的開化派の閔妃と大院君の対立が背景"},{"y":"1884","t":"甲申事変","s":"清仏戦争を契機に金玉均ら独立党が日本公使館守備兵の支援でクーデタ。清軍に鎮圧され金玉均は日本へ亡命。漢城条約で日本が賠償金を獲得","why":"壬午軍乱後に閔氏一族が親清派へ転換し、独立党（親日）と事大党（親清）が対立したため"},{"y":"1885","t":"天津条約","s":"伊藤博文と李鴻章が調印。日清両軍の朝鮮撤兵と出兵時の事前相互予告を規定","why":"朝鮮における日清の武力衝突を避けるため"},{"y":"1885","t":"「脱亜論」","s":"福沢諭吉が『時事新報』で、アジアの連帯を否定し欧米列強の一員になるべきだと主張","why":"清仏戦争での清の敗北などで日本人のアジア観が変化し国権論が強まったため"},{"y":"1889","t":"防穀令事件","s":"朝鮮政府が穀物輸出を禁止し日本商人が打撃。日本は損害賠償を請求し1893年に実現、朝鮮の対日感情は悪化","why":"凶作を理由とした輸出禁止に日本が反発したため"},{"y":"1894","t":"甲午農民戦争","s":"全琫準を中心とする東学の信徒が減税と排日を要求し朝鮮南部を占領。清と日本が出兵","why":"鎮圧に失敗した閔妃政権が清に救援を要請し、清は天津条約に従い日本に通知したため"},{"y":"1894","t":"日清戦争開戦","s":"日清共同の朝鮮内政改革提案を清が拒否。豊島沖海戦を経て8月1日宣戦布告。陸軍は平壌・旅順を占領、海軍は黄海海戦と威海衛攻撃で北洋艦隊を全滅","why":"軍備・国論の統一などで日本が清を上回っていた"},{"y":"1895","t":"下関条約","s":"伊藤博文・陸奥宗光と李鴻章が調印。清は朝鮮の独立承認、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両、4港開港","why":"賠償金で1897年に金本位制が確立"},{"y":"1895","t":"三国干渉","s":"ロシア・フランス・ドイツが遼東半島の清への返還を要求し、日本は還付金3000万両を代償に受諾","why":"ロシアが日本の大陸進出を警戒し、独仏を誘ったため"},{"y":"1895","t":"台湾総督府設置","s":"初代総督樺山資紀。「台湾民主国」の抵抗を武力で鎮圧し、1897年から民政へ。児玉源太郎・後藤新平のもと土地調査事業や台湾銀行設立","why":"国民は臥薪嘗胆を標語に反ロシアで軍備拡張に向かう"}],"story":"朝鮮では親日的開化派の【閔妃】と親清的保守派の【大院君】が対立していた。1882年の【壬午軍乱】は清の出兵で収まったが→閔氏一族が親清派に転じたため→1884年、金玉均ら独立党が日本の支援で【甲申事変】を起こし失敗した。日清の衝突を避けるため→1885年に伊藤博文と李鴻章が【天津条約】を結んだが、日本の朝鮮への影響力は減退し、清への反感から【脱亜論】に代表される国権論が強まった。1894年、【甲午農民戦争】を機に日清両国が出兵し→内政改革案を清が拒否したため【日清戦争】が始まった。軍備・国論の統一で優る日本は圧勝し→1895年の【下関条約】で遼東半島・台湾などを獲得した。しかし日本の大陸進出を警戒するロシアが独仏を誘って【三国干渉】を行ったため→日本は遼東半島を返還し、国民は【臥薪嘗胆】を標語に反ロシアの軍備拡張へ向かった。","keywords":["壬午軍乱","閔妃","大院君","済物浦条約","甲申事変","金玉均","天津条約","脱亜論","防穀令事件","甲午農民戦争","下関条約","李鴻章","三国干渉","臥薪嘗胆","台湾総督府"],"blanks":[{"q":"1882年、大院君一派が旧式軍隊と結んで漢城でクーデタを起こした【　】では、日本公使館が焼打ちされた。","a":"壬午軍乱","h":"壬午事変ともいう"},{"q":"壬午軍乱後、日朝間で【　】が結ばれ、日本は賠償金と公使館守備兵駐留権を獲得した。","a":"済物浦条約","h":"1882年"},{"q":"1884年、【　】ら独立党が日本公使館守備兵の支援を受けてクーデタを起こしたが清軍に鎮圧された（甲申事変）。","a":"金玉均","h":"失敗後、日本に亡命"},{"q":"1885年、日本全権伊藤博文と清国全権【　】が天津条約を結び、日清両軍の朝鮮からの撤兵などを定めた。","a":"李鴻章","h":"下関条約の清国全権でもある"},{"q":"1885年、福沢諭吉は『時事新報』の社説「【　】」でアジアの連帯を否定し、欧米列強の一員になるべきだと主張した。","a":"脱亜論","h":"「脱亜入欧」を主張する国権論"},{"q":"1894年、全琫準を中心とする東学の信徒が起こした【　】が日清戦争の契機となった。","a":"甲午農民戦争","h":"減税と排日を要求"},{"q":"1895年の【　】で、清は朝鮮の独立を承認し、遼東半島・台湾・澎湖諸島を日本に割譲した。","a":"下関条約","h":"日清講和条約ともいう"},{"q":"下関条約直後、ロシア・フランス・ドイツは【　】の清への返還を日本に要求した（三国干渉）。","a":"遼東半島","h":"還付金3000万両を代償に返還"},{"q":"三国干渉後、日本国民は「【　】」を標語に軍備拡張を基調とする戦後経営にあたった。","a":"臥薪嘗胆","h":"反ロシア意識の高揚"},{"q":"1895年、日本は台湾総督府を設置し、初代総督に海軍軍令部長の【　】を任命した。","a":"樺山資紀","h":"蛮勇演説を行った人物と同一"},{"q":"下関条約の賠償金により、1897年の貨幣法で【　】が確立した。","a":"金本位制","h":"貨幣制度"}],"mc":[{"q":"壬午軍乱の背景として正しいものはどれか。","c":["独立党と事大党の対立","親日的開化派の閔妃と親清的保守派の大院君の対立","東学の信徒による反乱","清仏戦争での清の敗北"],"a":1,"e":"閔氏一族の軍制改革に反発した大院君一派がクーデタを起こした。"},{"q":"甲申事変が起こった契機として正しいものはどれか。","c":["ベトナム支配をめぐる清仏戦争の勃発","防穀令の発布","天津条約の締結","甲午農民戦争の発生"],"a":0,"e":"清仏戦争で清が不利になった機会に、独立党が日本公使館の支援でクーデタを決行した。"},{"q":"天津条約の内容として誤っているものはどれか。","c":["日清両軍の朝鮮からの撤兵","朝鮮への軍事顧問の派遣停止","出兵時の事前の相互予告義務","清による朝鮮の独立承認"],"a":3,"e":"朝鮮の独立承認は1895年の下関条約の内容。"},{"q":"日清戦争が開戦に至った直接の経緯として正しいものはどれか。","c":["甲申事変で日本公使館が焼かれたため","三国干渉に日本が反発したため","甲午農民戦争で日清が出兵し、日本の朝鮮内政改革提案を清が拒否したため","閔妃殺害事件が起きたため"],"a":2,"e":"農民軍と朝鮮政府が和解した後も両軍は駐留し、改革案の拒否で開戦は必至となった。"},{"q":"日清戦争で日本が圧勝した要因として最も適当なものはどれか。","c":["ロシアの軍事支援を受けたため","軍備・兵力・国論の統一などで清を上回っていたため","清が北洋艦隊を持っていなかったため","朝鮮が日本側で参戦したため"],"a":1,"e":"日本は装備・訓練・国論の統一と日英通商航海条約によるイギリスの好意的態度に恵まれた。"},{"q":"三国干渉が行われた理由として正しいものはどれか。","c":["イギリスが日本の台湾領有に反対したため","清が列国に救援を求めたため","アメリカが門戸開放を主張したため","ロシアが日本の遼東半島領有を満洲進出への脅威とみて独仏を誘ったため"],"a":3,"e":"「朝鮮の独立を有名無実に為す」ことを理由に、露仏独が遼東半島の返還を要求した。"},{"q":"三国干渉の結果として正しいものはどれか。","c":["日本は台湾を清に返還した","国民の反ロシア意識が高まり臥薪嘗胆を標語に軍備拡張へ向かった","日本は清と日清通商航海条約を破棄した","朝鮮に大院君の親日政権が成立した"],"a":1,"e":"遼東半島を返還した日本では反露感情が高まり、朝鮮では閔妃の親露政権が成立した。"},{"q":"下関条約の影響として誤っているものはどれか。","c":["賠償金で金本位制が確立した","琉球帰属問題が自然消滅した","日本優位の日清通商航海条約が結ばれた","日本が旅順・大連の租借権を得た"],"a":3,"e":"旅順・大連の租借は1898年にロシアが得たもの。日本が獲得したのは1905年のポーツマス条約。"}],"order":[{"title":"朝鮮をめぐる日清の対立","items":["壬午軍乱","甲申事変","天津条約","防穀令事件","甲午農民戦争"],"e":"1882年→1884年→1885年→1889年〜→1894年。二度の事変後に天津条約で協調したが、農民戦争で開戦。"},{"title":"日清戦争から戦後まで","items":["甲午農民戦争","日英通商航海条約","宣戦布告","下関条約","三国干渉"],"e":"1894年5月農民戦争→7月日英条約調印→8月1日宣戦→1895年4月講和→直後に三国干渉。"}]},{"title":"藩閥・政党の妥協と東アジアの帝国主義時代","flow":[{"y":"1896","t":"自由党・進歩党と政府の提携","s":"第2次伊藤内閣に板垣退助が内相として入閣。大隈重信は進歩党を結成し第2次松方内閣（松隈内閣）に外相として入閣","why":"日清戦後経営を進める藩閥政府は資本家・地主を基盤とする政党を無視できなくなったため"},{"y":"1898","t":"憲政党の結成","s":"第3次伊藤内閣が地租増徴案を出すと自由党・進歩党が合同して憲政党を結成し否決。伊藤内閣は総辞職","why":"衆議院に絶対多数を持つ政党が出現し議会運営の見通しを失ったため"},{"y":"1898","t":"第1次大隈重信内閣（隈板内閣）","s":"首相兼外相大隈、内相板垣の初の政党内閣。尾崎行雄文相の共和演説事件を機に憲政党と憲政本党に分裂し4か月で退陣","why":"旧自由党系と旧進歩党系の後任人事をめぐる対立が激化したため"},{"y":"1899","t":"文官任用令改正","s":"第2次山県内閣は憲政党と提携し地租増徴（3.3%）を可決したのち、高級官僚の自由任用を原則廃止","why":"政党の力が官僚に及ぶことを防ぐため"},{"y":"1900","t":"治安警察法・軍部大臣現役武官制","s":"治安立法の集大成である治安警察法を制定し、陸・海相を現役大将・中将に限定。選挙法も改正（直接国税10円以上、大選挙区制）","why":"政党の力が軍部に及ぶことを防ぐため"},{"y":"1900","t":"立憲政友会の結成","s":"山県の政策に反発した憲政党が解党し、伊藤系官僚と合同して立憲政友会を結成（初代総裁伊藤博文）","why":"伊藤は議会の円滑運営のため政党容認の考えを持っていた"},{"y":"1901","t":"桂園時代へ","s":"第4次伊藤内閣が北清事変処理の増税案を否決され退陣。山県閥の第1次桂太郎内閣と政友会の西園寺公望が政界を二分。山県・伊藤らは元老となる","why":"政党を否定する山県系官僚・貴族院勢力が反発したため"},{"y":"1898","t":"列強の中国分割","s":"ドイツは膠州湾、ロシアは旅順・大連、イギリスは九龍半島・威海衛を租借。日本は福建省の不割譲を確約させる","why":"「眠れる獅子」清の敗北が刺激となり、賠償金借款の代償に租借権を得た"},{"y":"1895","t":"閔妃殺害事件と親露政権","s":"公使三浦梧楼が親露政策の閔妃を殺害。翌年高宗がロシア公使館に逃れ親露政権を樹立し、朝鮮での日本の立場は決定的に悪化","why":"三国干渉後に閔妃が親露政策をとったため"},{"y":"1899","t":"門戸開放宣言","s":"アメリカ国務長官ジョン=ヘイが門戸開放・機会均等・領土保全を提案し、モンロー宣言の伝統政策を転換","why":"中国分割に出遅れたアメリカが市場参入の意思を表明するため"}],"story":"日清戦争後、資本主義の成立で【資本家・寄生地主】の発言力が増したため→藩閥政府は政党を無視できなくなり、第2次伊藤内閣は自由党、第2次松方内閣は進歩党と提携した。しかし1898年、第3次伊藤内閣が地租増徴を図ると→両党は合同して【憲政党】を結成し、初の政党内閣【隈板内閣】が成立した。ところが党内対立で4か月で崩壊→第2次【山県有朋】内閣は憲政党と提携して地租増徴を通した後、【文官任用令改正】・【治安警察法】・【軍部大臣現役武官制】で政党の力を官僚・軍部から締め出した。これに反発した憲政党は政党容認の伊藤博文と接近し→1900年に【立憲政友会】を結成した。以後、山県閥の桂太郎と政友会の西園寺公望が交互に政権を担う【桂園時代】となり、山県・伊藤らは【元老】として背後から影響力を行使した。一方、清の敗北を機に列強は【租借】の形で中国分割を進め、アメリカは【門戸開放宣言】で市場参入を主張した。","keywords":["進歩党","憲政党","隈板内閣","共和演説事件","憲政本党","文官任用令","治安警察法","軍部大臣現役武官制","立憲政友会","元老","桂園時代","租借","閔妃殺害事件","大韓帝国","門戸開放宣言"],"blanks":[{"q":"1896年、大隈重信は対外硬派連合の5派を基盤に【　】を結成し、第2次松方内閣に外相として入閣した。","a":"進歩党","h":"松隈内閣"},{"q":"1898年、地租増徴に反対した自由党と進歩党が合同して【　】を結成した。","a":"憲政党","h":"衆議院に絶対多数を持つ政党"},{"q":"第1次大隈重信内閣は首相兼外相に大隈、内相に【　】を擁する初の政党内閣であった。","a":"板垣退助","h":"隈板内閣の「板」"},{"q":"憲政党は旧自由党系の憲政党と、大隈重信・犬養毅ら旧進歩党系の【　】に分裂した。","a":"憲政本党","h":"尾崎行雄文相の共和演説事件が契機"},{"q":"1899年、第2次山県内閣は【　】を改正し、高級官僚の自由任用を原則廃止した。","a":"文官任用令","h":"政党の力が官僚に及ぶことを防ぐ"},{"q":"1900年、第2次山県内閣は従来の治安立法の集大成として【　】を制定した。","a":"治安警察法","h":"労働運動などを取り締まる"},{"q":"1900年、現役の大将・中将以外は陸・海軍大臣になれないとする【　】が定められた。","a":"軍部大臣現役武官制","h":"組閣に軍部の支持が不可欠になった"},{"q":"1900年、憲政党は解党して伊藤系官僚と合同し、伊藤博文を初代総裁とする【　】を結成した。","a":"立憲政友会","h":"幸徳秋水は「自由党を祭る文」で批判"},{"q":"山県有朋・伊藤博文らは政界の第一線を退き、後継首相の指名などで非公式に天皇を補佐する【　】となった。","a":"元老","h":"内閣の背後から影響力を行使"},{"q":"1898年、ロシアは旅順・大連を、ドイツは【　】を租借した。","a":"膠州湾","h":"山東半島、99年租借"},{"q":"1895年、公使【　】が親露政策をとる閔妃を殺害し、朝鮮における日本の立場は決定的に悪化した。","a":"三浦梧楼","h":"閔妃殺害事件"},{"q":"1899年、アメリカ国務長官ジョン=ヘイは【　】宣言を行い、機会均等・領土保全とともに提案した。","a":"門戸開放","h":"ヘイの三原則"}],"mc":[{"q":"日清戦争後に藩閥政府が政党と提携し始めた背景として正しいものはどれか。","c":["資本主義の成立で政党を後援する資本家・寄生地主の発言力が増大したため","民党が超然主義を受け入れたため","軍部大臣現役武官制が廃止されたため","憲法が改正されたため"],"a":0,"e":"対外緊張の中で戦後経営を進める政府は政党勢力を無視できなくなった。"},{"q":"憲政党が結成された直接のきっかけはどれか。","c":["第2次山県内閣の治安警察法制定","第3次伊藤内閣の地租増徴案に自由党・進歩党がともに反対したこと","隈板内閣の共和演説事件","立憲政友会の結成"],"a":1,"e":"両党は地租増徴案を否決して合同し、絶対多数を得たため伊藤内閣は総辞職した。"},{"q":"隈板内閣がわずか4か月で退陣した理由として正しいものはどれか。","c":["軍部大臣現役武官制で陸相が得られなかったため","地租増徴案が否決されたため","尾崎行雄文相の辞任後の人事をめぐり旧自由党系と旧進歩党系が対立したため","北清事変の増税案が否決されたため"],"a":2,"e":"共和演説事件を機に憲政党は憲政党（旧自由党系）と憲政本党（旧進歩党系）に分裂した。"},{"q":"第2次山県内閣が文官任用令を改正した目的として正しいものはどれか。","c":["軍部の力を抑えるため","官僚の身分保障を弱めるため","政党員を積極的に官僚に登用するため","政党の力が官僚に及ぶことを防ぐため"],"a":3,"e":"高級官僚の自由任用を原則廃止し、文官分限令・懲戒令で官僚の身分保障を強化した。"},{"q":"立憲政友会が結成された経緯として正しいものはどれか。","c":["山県の政策に反発した憲政党が、政党容認の考えをもつ伊藤博文と合同した","進歩党と自由党が再合同した","山県有朋が自ら政党を組織した","貴族院勢力が政党をつくった"],"a":0,"e":"1900年、憲政党は解党して伊藤系官僚と合同し、伊藤が初代総裁となった。"},{"q":"軍部大臣現役武官制の結果として正しいものはどれか。","c":["政党が軍部を統制できるようになった","内閣の組閣に軍部の支持が不可欠となった","元老制度が廃止された","陸海軍大臣を文官が務められるようになった"],"a":1,"e":"現役大将・中将以外は陸・海相になれないため、軍部が組閣を左右できるようになった。"},{"q":"列強の中国分割が始まった背景として最も適当なものはどれか。","c":["義和団が北京を包囲したため","アメリカが門戸開放を宣言したため","日清戦争で「眠れる獅子」清が敗北したのが刺激となったため","日露戦争で日本が勝利したため"],"a":2,"e":"清が賠償金を借款する代償に、列強は港湾の租借権や鉄道敷設権を得た。"},{"q":"アメリカが門戸開放宣言を出した理由として正しいものはどれか。","c":["中国分割に直接加わらず、各国の勢力範囲内での通商の自由を求めたため","ロシアの南下を軍事的に阻止するため","日本の朝鮮支配を承認するため","モンロー宣言を強化するため"],"a":0,"e":"ハワイ併合・フィリピン獲得で太平洋に進出したアメリカが市場参入の意思を表明した。"}],"order":[{"title":"政党内閣成立までの流れ","items":["板垣退助が第2次伊藤内閣に入閣","第2次松方内閣に大隈重信が入閣","憲政党の結成","第1次大隈重信内閣","憲政党と憲政本党に分裂"],"e":"1896年自由党提携→1896年進歩党提携→1898年合同→隈板内閣→共和演説事件で分裂。"},{"title":"第2次山県内閣以後の展開","items":["地租増徴案の可決","文官任用令改正","治安警察法・軍部大臣現役武官制","立憲政友会の結成","第1次桂太郎内閣成立"],"e":"1898年→1899年→1900年→1900年政友会→1901年桂内閣で桂園時代へ。"},{"title":"朝鮮における日露関係","items":["三国干渉","閔妃殺害事件","高宗がロシア公使館へ逃れる","大韓帝国と改称","西・ローゼン協定"],"e":"1895年干渉→1895年殺害事件→1896年親露政権→1897年改称→1898年ロシアの旅順・大連租借を黙認。"}]},{"title":"北清事変と日露戦争","flow":[{"y":"1900","t":"北清事変（義和団戦争）","s":"義和団が北京の列国公使館を包囲し清も列国に宣戦。日本・ロシアなど8か国連合軍が鎮圧","why":"列強の帝国主義的進出に対する排外運動が高揚したため"},{"y":"1901","t":"北京議定書","s":"清は4億5000万両の賠償金、公使館所在区域の治外法権、公使館守備隊の北京駐留を承認","why":"北清事変の処理"},{"y":"1902","t":"日英同盟協約","s":"日露協商論（伊藤・井上）と日英同盟論（山県・桂）が対立し後者が優勢。ロシアを対象とした防御同盟で有効期限5年","why":"北清事変後もロシアが満洲を占領し韓国にも野心を見せたため。イギリスも光栄ある孤立を放棄"},{"y":"1903","t":"主戦論と非戦論","s":"対露同志会や七博士意見書が主戦論を主張。幸徳秋水・堺利彦は平民社で反戦論、内村鑑三は非戦論を展開","why":"『万朝報』の黒岩涙香が主戦論に転じたため彼らは退社"},{"y":"1904","t":"日露戦争開戦","s":"2月、日本軍が仁川と旅順のロシア艦隊を奇襲し翌々日宣戦布告","why":"日本の大陸進出とロシアの南下政策が対立"},{"y":"1905","t":"旅順占領・奉天会戦","s":"1月、乃木希典が二〇三高地を攻略し旅順占領。3月、大山巌が奉天会戦で辛勝","why":"陸軍は多数の兵を失いながら辛勝"},{"y":"1905","t":"日本海海戦","s":"5月、東郷平八郎の連合艦隊がバルチック艦隊を壊滅させ、講和の機運が高まる","why":"海軍は大勝したが、日本は戦費約17億円が欠乏し余力なし"},{"y":"1905","t":"ポーツマス条約","s":"9月5日、小村寿太郎とウィッテが調印。ロシアは韓国への日本の指導・監督権を承認、旅順・大連租借権と長春以南の鉄道を譲渡、北緯50度以南のサハリンを割譲","why":"セオドア=ローズヴェルト大統領が調停、ロシアも第一次ロシア革命で継続困難"},{"y":"1905","t":"日比谷焼打ち事件","s":"講和反対国民大会の参加者が暴徒化し、東京に戒厳令。第1次桂内閣は翌年総辞職","why":"戦争継続能力の真相を知らされないまま、賠償金が得られないことへの不満"},{"y":"","t":"日露戦争の影響","s":"韓国・満洲への進出、重工業の発達、白人不敗神話を打ち破りアジア・ヨーロッパの民族運動を刺激","why":"日本の国際的地位が向上"}],"story":"列強の進出に対する清国内の排外運動が高揚し→1900年、【義和団】が北京の公使館を包囲し清も列国に宣戦した（【北清事変】）。8か国連合軍が鎮圧したが、ロシアはその後も【満洲】を占領し韓国にも野心を見せたため→日本政府内では伊藤・井上の【日露協商論（満韓交換論）】と山県・桂の【日英同盟論】が対立し→1902年、ロシアの南下を警戒するイギリスが光栄ある孤立を捨てて【日英同盟協約】が結ばれた。国内では主戦論が多数となる一方、【内村鑑三】の非戦論などもあった。1904年に開戦した【日露戦争】では、陸軍は旅順攻略・奉天会戦で辛勝、海軍は【日本海海戦】で大勝したが→戦費が尽きた日本はアメリカの【セオドア=ローズヴェルト】に調停を依頼し、1905年【ポーツマス条約】を結んだ。しかし賠償金が得られなかったため→国民の不満が爆発し【日比谷焼打ち事件】が起こり、戒厳令が出された。","keywords":["北清事変","義和団","北京議定書","日英同盟協約","日露協商論","満韓交換論","七博士意見書","平民社","内村鑑三","与謝野晶子","二〇三高地","日本海海戦","ポーツマス条約","日比谷焼打ち事件","戒厳令"],"blanks":[{"q":"1900年、清国内で【　】を中心とする排外運動が高揚し、北京の列国公使館を包囲した。","a":"義和団","h":"北清事変は義和団戦争ともいう"},{"q":"1901年の【　】で、清は4億5000万両の賠償金や公使館守備隊の北京駐留を列国に承認した。","a":"北京議定書","h":"北清事変の処理"},{"q":"伊藤博文・井上馨ら元老は、ロシアとの戦争準備が不十分だとして【　】（満韓交換論）を主張した。","a":"日露協商論","h":"山県・桂の日英同盟論と対立"},{"q":"1902年、日本は【　】を結び、ロシアを対象とした防御同盟で実質的に欧米列強入りを果たした。","a":"日英同盟協約","h":"イギリスは光栄ある孤立を放棄"},{"q":"1903年、戸水寛人ら東京帝国大学などの七博士は【　】を桂首相・小村外相に提出し対露強硬論を唱えた。","a":"七博士意見書","h":"主戦論"},{"q":"幸徳秋水・堺利彦は『万朝報』を退社し、1903年に【　】を結成して週刊『平民新聞』を創刊した。","a":"平民社","h":"社会主義の立場からの反戦論"},{"q":"【　】はキリスト教人道主義の立場から『万朝報』で非戦論を展開した。","a":"内村鑑三","h":"日清戦争時は義戦として賛同していた"},{"q":"1904年、【　】は雑誌『明星』に厭戦詩「君死にたまふこと勿れ」を発表した。","a":"与謝野晶子","h":"旅順口包囲軍の中にある弟を歎いた"},{"q":"1905年1月、第三軍司令官【　】が二〇三高地を攻略し旅順を占領した。","a":"乃木希典","h":"多数の兵を失った"},{"q":"1905年5月の日本海海戦では、連合艦隊司令長官【　】がバルチック艦隊を壊滅させた。","a":"東郷平八郎","h":"海軍は大勝"},{"q":"1905年9月5日、日本全権小村寿太郎とロシア全権ウィッテが【　】条約に調印した。","a":"ポーツマス","h":"セオドア=ローズヴェルトが調停"},{"q":"ポーツマス条約への不満から日比谷焼打ち事件が起こり、東京に【　】が出された。","a":"戒厳令","h":"第1次桂内閣は翌年総辞職"}],"mc":[{"q":"北清事変が起こった背景として正しいものはどれか。","c":["列強の帝国主義的進出に対する清国内の排外運動の高揚","日本の韓国併合への反発","ロシアの満洲撤兵","辛亥革命の勃発"],"a":0,"e":"義和団の運動を清政府が利用して列国に宣戦したため8か国連合軍が出兵した。"},{"q":"日英同盟が締結された背景として正しいものはどれか。","c":["ロシアが北清事変後も満洲を占領し、日本とイギリスの利益と衝突したため","アメリカが日本の韓国支配に反対したため","清がイギリスに救援を求めたため","日本がロシアと協商を結んだため"],"a":0,"e":"ロシアの南下に対抗するため、イギリスは光栄ある孤立を放棄して日本と結んだ。"},{"q":"日露協商論（満韓交換論）を主張した人物と理由の組み合わせとして正しいものはどれか。","c":["山県有朋―ロシアと戦うにはイギリスと結ぶべき","伊藤博文―ロシアと戦うには軍事的・財政的準備が不十分","桂太郎―満洲をロシアに譲るべき","小村寿太郎―韓国を放棄すべき"],"a":1,"e":"伊藤・井上ら元老が協商論、山県・桂らが日英同盟論（対露開戦論）を唱えた。"},{"q":"幸徳秋水・堺利彦が『万朝報』を退社した理由として正しいものはどれか。","c":["政府に弾圧されたため","内村鑑三と対立したため","社長の黒岩涙香が経営悪化を理由に主戦論に転じたため","平民社が解散したため"],"a":2,"e":"退社後の1903年に平民社を結成し『平民新聞』で反戦論を展開した。"},{"q":"日露戦争において日本がアメリカに調停を依頼した理由として正しいものはどれか。","c":["陸軍が奉天会戦で大敗したため","戦費が欠乏しこれ以上戦線を拡大する余力がなかったため","イギリスが同盟を破棄したため","国内で反戦論が多数になったため"],"a":1,"e":"約17億円の戦費を内外債・増税に頼り補給が限界に達していた。ロシアも革命で継続困難だった。"},{"q":"ポーツマス条約の内容として誤っているものはどれか。","c":["韓国に対する日本の指導・監督権の承認","旅順・大連の租借権と長春以南の鉄道の譲渡","北緯50度以南のサハリンの割譲","賠償金の支払い"],"a":3,"e":"賠償金は一切得られず、これが日比谷焼打ち事件の原因となった。"},{"q":"日比谷焼打ち事件が起こった根本的な理由として正しいものはどれか。","c":["戦争継続能力の真相を知らされないまま、賠償金が得られないことに国民が不満を抱いたため","政府が戒厳令を出したため","日英同盟が破棄されたため","韓国併合に反対したため"],"a":0,"e":"条約調印の日に開かれた講和反対国民大会の参加者数万人が暴徒化した。"},{"q":"日露戦争の影響として誤っているものはどれか。","c":["韓国・満洲への進出","白人不敗神話を打ち破りアジアの民族運動を刺激","軍備拡大と重工業の発達","ロシアとの関係が断絶し日露協約が結ばれなかった"],"a":3,"e":"戦後の日本とロシアは満蒙権益維持のため接近し、1907年から4次の日露協約を結んだ。"}],"order":[{"title":"北清事変から日露開戦まで","items":["北清事変","北京議定書","日英同盟協約","七博士意見書","日露戦争開戦"],"e":"1900年→1901年→1902年→1903年→1904年2月。"},{"title":"日露戦争の戦局","items":["仁川・旅順奇襲","旅順占領","奉天会戦","日本海海戦","ポーツマス条約"],"e":"1904年2月開戦→1905年1月旅順→3月奉天→5月日本海海戦→9月講和。"}]},{"title":"日露戦争後の国際関係と内政","flow":[{"y":"1905","t":"第二次日韓協約","s":"桂・タフト協定、第二次日英同盟協約、ポーツマス条約で列強の承認を得たうえで韓国の外交権を剥奪し保護国化。漢城に統監府を設置し伊藤博文が初代統監","why":"韓国支配を列強に認めさせるため"},{"y":"1907","t":"ハーグ密使事件と第三次日韓協約","s":"高宗を退位させ内政権も掌握、韓国軍も解散。反日の義兵運動が全国化","why":"高宗がハーグの万国平和会議に密使を送ったため"},{"y":"1909","t":"伊藤博文暗殺","s":"ハルビン駅頭で韓国の民族運動家安重根に暗殺される","why":"韓国の反日運動の高まり"},{"y":"1910","t":"韓国併合条約","s":"全権寺内正毅。朝鮮と改称し京城に朝鮮総督府を設置、寺内が初代総督。東洋拓殖会社が植民地経営、朝鮮銀行が金融を支配","why":"韓国を植民地化するため"},{"y":"1906","t":"関東都督府・満鉄設立","s":"関東州に関東都督府を置き、半官半民の南満洲鉄道株式会社を設立。1919年に関東庁と関東軍に分割","why":"満洲は植民地化せず軍事的・経済的進出にとどめた"},{"y":"1905","t":"桂・ハリマン覚書の破棄","s":"小村寿太郎外相の反対で満鉄共同経営案を破棄。1909年ノックスの満鉄中立化提案も日露が拒否","why":"アメリカは門戸開放を唱え満洲市場を求めたため関係が悪化"},{"y":"1907","t":"第一次日露協約","s":"日本は南満洲・韓国、ロシアは北満洲・外蒙古を勢力範囲とする。第二次（1910）でアメリカの満洲進出阻止を約束、第四次（1916）は軍事同盟","why":"満蒙権益維持のため日露が接近"},{"y":"1911","t":"辛亥革命","s":"孫文の中国同盟会などの革命勢力が台頭。1912年中華民国成立、宣統帝退位で清朝滅亡、袁世凱が臨時大総統に","why":"日本は第一次世界大戦時以外は不干渉"},{"y":"1912","t":"第三次桂内閣と第一次護憲運動・大正政変","s":"2個師団増設をめぐり第2次西園寺内閣が陸軍と衝突し総辞職。内大臣桂太郎が組閣すると尾崎行雄・犬養毅らが閥族打破・憲政擁護を掲げ運動。桂内閣は62日で総辞職（大正政変）","why":"宮中・府中の別を破った閥族の横暴と見られたため"},{"y":"1914","t":"第2次大隈重信内閣","s":"立憲同志会を与党とし加藤高明が外相。1915年の総選挙で同志会が圧勝し2個師団増設が通過","why":"山県ら元老が国民人気の高い大隈に組閣させ政友会に打撃を与えようとしたため"}],"story":"日露戦争後、日本は【桂・タフト協定】などで列強の承認を得たうえで→1905年の【第二次日韓協約】で韓国を保護国化し、【統監府】を置いて伊藤博文が初代統監となった。1907年の【ハーグ密使事件】を口実に内政権も掌握し韓国軍を解散させたため→【義兵運動】が全国化し、1909年に伊藤は【安重根】に暗殺された。1910年、【韓国併合条約】で朝鮮は植民地となり【朝鮮総督府】が置かれた。満洲は【満鉄】などによる軍事的・経済的進出にとどまったが→門戸開放を唱えるアメリカとは満洲市場と移民問題で関係が悪化し→満蒙権益維持のため日本はロシアと4次の【日露協約】を結んだ。内政では桂太郎と西園寺公望が交互に政権を担う【桂園時代】が続いたが、1912年、2個師団増設問題で倒れた西園寺内閣の後に内大臣桂が組閣したため→尾崎行雄・犬養毅らが「閥族打破・憲政擁護」を掲げる【第一次護憲運動】を起こし、桂内閣は62日で退陣した（【大正政変】）。","keywords":["桂・タフト協定","第二次日韓協約","統監府","ハーグ密使事件","義兵運動","安重根","韓国併合条約","朝鮮総督府","関東都督府","南満洲鉄道株式会社","日露協約","辛亥革命","桂園時代","第一次護憲運動","大正政変"],"blanks":[{"q":"1905年の第二次日韓協約で韓国の外交権を剥奪し、漢城に【　】を設置して伊藤博文が初代統監となった。","a":"統監府","h":"保護国化"},{"q":"1907年の【　】事件を機に第三次日韓協約が結ばれ、高宗は退位させられ韓国軍も解散した。","a":"ハーグ密使","h":"万国平和会議に密使を派遣"},{"q":"1909年、伊藤博文はハルビン駅頭で韓国の民族運動家【　】に暗殺された。","a":"安重根","h":"反日の義兵運動が高まっていた"},{"q":"1910年の【　】により韓国は植民地化され、朝鮮と改称された。","a":"韓国併合条約","h":"日本全権は寺内正毅"},{"q":"韓国併合後、京城に【　】が設置され、寺内正毅が初代総督となった。","a":"朝鮮総督府","h":"東洋拓殖会社が植民地経営を推進"},{"q":"1906年、旅順に関東都督府が置かれ、半官半民の国策会社【　】（満鉄）が設立された。","a":"南満洲鉄道株式会社","h":"長春以南の旧東清鉄道を経営"},{"q":"1905年、桂太郎首相が内約した【　】は、小村寿太郎外相の反対により破棄された。","a":"桂・ハリマン覚書","h":"アメリカとの満鉄共同経営案"},{"q":"1907年の第一次【　】で、日本は南満洲・韓国、ロシアは北満洲・外蒙古を勢力範囲とした。","a":"日露協約","h":"1916年の第四次は軍事同盟"},{"q":"民族・民権・民生の三民主義を唱える【　】は、1905年に東京で中国同盟会を結成した。","a":"孫文","h":"中華民国の臨時大総統となる"},{"q":"1911年の【　】により翌年中華民国が成立し、宣統帝の退位で清朝は滅亡した。","a":"辛亥革命","h":"孫文に代わり袁世凱が臨時大総統に"},{"q":"陸軍・長州閥の桂太郎と立憲政友会総裁の【　】が交互に内閣を担当した時期を桂園時代という。","a":"西園寺公望","h":"第2代立憲政友会総裁"},{"q":"1912〜13年の第一次護憲運動は「閥族打破・【　】」を掲げ、第三次桂内閣を62日で退陣させた。","a":"憲政擁護","h":"尾崎行雄・犬養毅らが中心"}],"mc":[{"q":"第二次日韓協約に先立って日本が列強から韓国支配の承認を得た取り決めとして誤っているものはどれか。","c":["桂・タフト協定","第二次日英同盟協約","ポーツマス条約","石井・ランシング協定"],"a":3,"e":"石井・ランシング協定は1917年、中国における日本の特殊権益をアメリカが認めたもの。"},{"q":"第三次日韓協約が結ばれた契機として正しいものはどれか。","c":["伊藤博文の暗殺","義兵運動の全国化","ハーグ密使事件","辛亥革命"],"a":2,"e":"高宗が万国平和会議に密使を送ったことを機に、高宗を退位させ内政権を掌握した。"},{"q":"朝鮮支配と満洲支配の違いとして正しいものはどれか。","c":["朝鮮は植民地化したが、満洲は軍事的・経済的進出にとどまった","満洲は植民地化したが、朝鮮は保護国のままだった","両方とも総督府を置いて植民地化した","両方とも経済的進出のみだった"],"a":0,"e":"朝鮮には朝鮮総督府、満洲には関東都督府と満鉄を置いた。"},{"q":"日露戦争後にアメリカとの関係が悪化した理由として正しいものはどれか。","c":["日本が門戸開放宣言を拒否したため","門戸開放を唱えるアメリカと満洲市場・在米移民問題をめぐって対立したため","アメリカが韓国の独立を支持したため","日本がハワイ併合に抗議したため"],"a":1,"e":"桂・ハリマン覚書の破棄、ノックスの満鉄中立化提案の拒否、サンフランシスコ学童排斥問題などが起きた。"},{"q":"日露協約が結ばれた目的として正しいものはどれか。","c":["ロシアの満洲撤兵を実現するため","韓国の独立を保障するため","満蒙権益を維持しアメリカの満洲進出を阻止するため","中国の門戸開放を推進するため"],"a":2,"e":"第二次協約ではアメリカの満洲進出を阻止する共同行動を約束した。"},{"q":"第一次護憲運動が起こった経緯として正しいものはどれか。","c":["第2次西園寺内閣が2個師団増設を拒否して陸軍と衝突し倒れた後、内大臣桂太郎が組閣したため","桂太郎が普通選挙を拒否したため","大逆事件で社会主義者が弾圧されたため","シーメンス事件が発覚したため"],"a":0,"e":"上原勇作陸相の帷幄上奏と軍部大臣現役武官制で西園寺内閣は総辞職、桂の組閣は閥族の横暴と見られた。"},{"q":"大正政変後も政党内閣が成立しなかった背景として正しいものはどれか。","c":["立憲政友会が解党したため","元老・藩閥・軍閥が政友会に抵抗したため","尾崎行雄が首相になったため","軍部大臣現役武官制が廃止されたため"],"a":1,"e":"海軍・薩摩閥の山本権兵衛内閣、元老が担ぎ出した大隈内閣と非政党内閣が続いた。"},{"q":"第1次山本権兵衛内閣が退陣した理由として正しいものはどれか。","c":["2個師団増設案が否決されたため","第一次護憲運動が起きたため","海軍高官の汚職事件（シーメンス事件）を追及されたため","大逆事件の判決に反発が起きたため"],"a":2,"e":"ジーメンス社・ヴィッカース社と海軍高官の汚職を島田三郎らが追及し内閣は退陣した。"}],"order":[{"title":"韓国支配の過程","items":["第一次日韓協約","第二次日韓協約（統監府設置）","ハーグ密使事件","伊藤博文暗殺","韓国併合条約"],"e":"1904年→1905年→1907年→1909年→1910年。"},{"title":"桂園時代から大正政変へ","items":["第1次桂太郎内閣","第1次西園寺公望内閣（鉄道国有法）","第2次桂太郎内閣（大逆事件・韓国併合）","第2次西園寺公望内閣","第三次桂内閣と大正政変"],"e":"1901〜06→1906〜08→1908〜11→1911〜12→1912〜13年。"},{"title":"中華民国の成立","items":["中国同盟会の結成","辛亥革命","中華民国建国宣言","宣統帝の退位","袁世凱が臨時大総統に"],"e":"1905年東京で結成→1911年革命→1912年1月建国→2月清朝滅亡→3月袁世凱。"}]},{"title":"第一次世界大戦と国際平和体制","flow":[{"y":"1914","t":"第一次世界大戦の開戦","s":"サライェヴォ事件を契機に同盟国と協商国が総力戦へ","why":"三国同盟と三国協商の対立、バルカン半島をめぐる汎ゲルマン主義と汎スラブ主義の対立"},{"y":"1914","t":"日本の参戦","s":"第2次大隈内閣（加藤高明外相）がドイツに宣戦。陸軍は膠州湾、海軍は赤道以北のドイツ領南洋諸島を占領","why":"名目は日英同盟、実情は大陸での権益拡大。井上馨は「大正新時代の天佑」と呼んだ"},{"y":"1915","t":"二十一か条の要求","s":"山東省のドイツ権益継承、旅順・大連の租借期限99年延長などを袁世凱政権に要求し、最後通牒で大部分を認めさせる","why":"中国では排日運動が激化し5月9日は国恥記念日に"},{"y":"1917","t":"西原借款・石井・ランシング協定","s":"寺内正毅首相が北京政府に巨額の借款。アメリカとは中国の領土保全・門戸開放と日本の特殊権益を認め合う","why":"アメリカの参戦にともない太平洋方面の安定が必要だったため"},{"y":"1917","t":"ロシア革命","s":"三月革命で帝政崩壊、レーニン中心の十一月革命でソヴィエト政権成立。第四次日露協約は破棄","why":"1918年にロシアは大戦から離脱"},{"y":"1918","t":"シベリア出兵","s":"チェコスロヴァキア軍団救出を名目に米英仏と共同出兵。日本のみ1922年まで駐兵し、尼港事件も発生","why":"ロシア革命への干渉と東部シベリア・北満洲への勢力拡大が目的"},{"y":"1919","t":"ヴェルサイユ条約","s":"原敬内閣。全権西園寺公望・牧野伸顕。山東省の旧ドイツ権益と南洋諸島の委任統治権を獲得したが人種差別撤廃案は却下","why":"中国は調印を拒否し、三・一独立運動・五・四運動など排日運動が激化"},{"y":"1920","t":"国際連盟の成立","s":"ウィルソンが提唱。日本は常任理事国、新渡戸稲造が初代事務次長。アメリカは上院の反対で不参加","why":"勢力均衡方式から集団安全保障方式へ転換"},{"y":"1921","t":"ワシントン会議・四カ国条約","s":"ハーディングが提唱、高橋是清内閣。全権加藤友三郎ら。四カ国条約で太平洋諸島の現状維持を定め日英同盟は終了","why":"米英は日本の膨張を抑えようとした"},{"y":"1922","t":"九カ国条約・海軍軍縮条約","s":"中国の領土・主権尊重で石井・ランシング協定は破棄、山東権益を中国に返還。主力艦保有比率は米英5：日3","why":"日本はパクス=アメリカーナの国際協調体制を受け入れ協調外交を展開"}],"story":"20世紀初頭、【三国同盟】と【三国協商】の対立で均衡が崩れ→1914年、サライェヴォ事件を契機に【第一次世界大戦】が始まった。大戦は日本にとって「【大正新時代の天佑】」であり→第2次大隈内閣は日英同盟を名目にドイツに宣戦し、1915年に袁世凱政権へ【二十一か条の要求】を突きつけて大部分を認めさせた。アメリカとは【石井・ランシング協定】で特殊権益を認め合った。1917年の【ロシア革命】でソヴィエト政権が成立すると→日本は【シベリア出兵】で干渉し1922年まで駐兵した。1919年の【ヴェルサイユ条約】で日本は山東権益を得たが→中国は調印を拒否した。翌年【国際連盟】が成立した。1921〜22年の【ワシントン会議】では【四カ国条約】で日英同盟が終了し、【九カ国条約】で山東権益を返還、海軍軍縮条約で主力艦を制限された→日本はこのヴェルサイユ・ワシントン体制を受け入れ、協調外交を展開した。","keywords":["三国同盟","三国協商","サライェヴォ事件","大正新時代の天佑","二十一か条の要求","西原借款","石井・ランシング協定","ロシア革命","シベリア出兵","ヴェルサイユ条約","国際連盟","新渡戸稲造","ワシントン会議","四カ国条約","九カ国条約"],"blanks":[{"q":"19世紀末の欧州では、ドイツ・オーストリア・イタリアの【　】と露仏同盟が勢力均衡を保っていた。","a":"三国同盟","h":"のち英仏露の三国協商と対立"},{"q":"1914年、第2次大隈重信内閣（【　】外相）は日英同盟を名目にドイツに宣戦布告した。","a":"加藤高明","h":"立憲同志会総裁"},{"q":"1915年、日本は【　】政権に二十一か条の要求を突きつけ、最後通牒で大部分を認めさせた。","a":"袁世凱","h":"中華民国の大総統"},{"q":"1917年、特派大使石井菊次郎とアメリカ国務長官の間で【　】が結ばれ、日本の特殊権益が認められた。","a":"石井・ランシング協定","h":"アメリカの大戦参戦が契機"},{"q":"1917年、【　】を中心とする十一月革命でソヴィエト政権が成立した。","a":"レーニン","h":"第四次日露協約は破棄"},{"q":"1918年、日本はチェコスロヴァキア軍団救出を名目に米英仏と【　】を行い、1922年まで駐兵した。","a":"シベリア出兵","h":"1920年に尼港事件"},{"q":"1919年、パリ講和会議で【　】が結ばれ、日本は山東省の旧ドイツ権益を継承した。","a":"ヴェルサイユ条約","h":"原敬内閣、全権は西園寺公望・牧野伸顕"},{"q":"1920年に成立した【　】で日本は常任理事国となり、新渡戸稲造が初代事務次長となった。","a":"国際連盟","h":"本部はジュネーヴ"},{"q":"1921〜22年の【　】会議はアメリカ大統領ハーディングが提唱し、日本全権は加藤友三郎らが務めた。","a":"ワシントン","h":"高橋是清内閣"},{"q":"1921年の【　】で太平洋諸島の現状維持が定められ、第三次日英同盟協約は終了した。","a":"四カ国条約","h":"米・英・日・仏"},{"q":"1922年の【　】で中国の領土・主権の尊重が約束され、石井・ランシング協定は破棄された。","a":"九カ国条約","h":"山東権益も中国に返還"},{"q":"ワシントン海軍軍縮条約では主力艦保有量が米・英5：日本【　】：仏・伊1.67と制限された。","a":"3","h":"以後10年間の主力艦建造を禁止"}],"mc":[{"q":"第一次世界大戦開戦の背景として正しいものはどれか。","c":["国際連盟の設立","三国同盟と三国協商の対立、バルカン半島をめぐる対立","ロシア革命の勃発","アメリカの門戸開放宣言"],"a":1,"e":"英仏協商・英露協商で三国協商が成立し均衡が崩れ、サライェヴォ事件で開戦した。"},{"q":"第一次世界大戦が日本にとって「大正新時代の天佑」とされた理由として正しいものはどれか。","c":["ドイツが日本に領土を譲ったため","アメリカが日本と同盟を結んだため","日露戦争後の不景気と国内対立の解決が見込めたため","ロシアが日本に賠償金を払ったため"],"a":2,"e":"元老井上馨の言葉。名目は日英同盟、実情は大陸での権益拡大が目的だった。"},{"q":"二十一か条の要求の結果として正しいものはどれか。","c":["中国で排日運動が激化し5月9日が国恥記念日となった","袁世凱政権がすべて拒否した","日本が山東権益を中国に返還した","アメリカが日本と同盟を結んだ"],"a":0,"e":"袁世凱政権は内外に暴露して不当を訴えたが、最後通牒で大部分を認めさせられた。"},{"q":"石井・ランシング協定が結ばれた契機として正しいものはどれか。","c":["ロシア革命","ワシントン会議","アメリカの第一次世界大戦参戦","二十一か条の要求"],"a":2,"e":"参戦にあたり太平洋方面の安定を確保する必要があったアメリカが日本の特殊権益を認めた。"},{"q":"日本がシベリア出兵を行った真の目的として正しいものはどれか。","c":["チェコスロヴァキア軍団の救出のみ","ロシア革命への干渉と東部シベリア・北満洲への勢力拡大","ドイツ領の占領","北樺太の返還"],"a":1,"e":"列国撤兵後も駐兵を続け、尼港事件や北樺太占領で国際的非難を浴びた。"},{"q":"ヴェルサイユ条約に対する中国の対応とその結果として正しいものはどれか。","c":["調印して山東権益を回復した","調印を拒否し五・四運動が起こった","国際連盟から脱退した","日本と同盟を結んだ"],"a":1,"e":"民族自決は東欧に限られ、日本の山東権益継承に反発した中国は調印を拒否した。"},{"q":"四カ国条約の結果として正しいものはどれか。","c":["石井・ランシング協定が破棄された","主力艦の建造が禁止された","第三次日英同盟協約が終了した","国際連盟が成立した"],"a":2,"e":"太平洋諸島の現状維持を定めた四カ国条約により日英同盟は1923年に終了。石井・ランシング協定の破棄は九カ国条約による。"},{"q":"アメリカが国際連盟に加盟しなかった理由として正しいものはどれか。","c":["ウィルソンが設立に反対したため","上院で共和党がヴェルサイユ条約を批准しなかったため","日本が加盟に反対したため","ドイツが加盟していたため"],"a":1,"e":"提唱国の不参加、全会一致制、武力制裁規定の欠如が連盟の問題点となった。"}],"order":[{"title":"第一次世界大戦中の日本の大陸進出","items":["日本の参戦","二十一か条の要求","西原借款","石井・ランシング協定","シベリア出兵"],"e":"1914年→1915年→1917年→1917年→1918年。"},{"title":"戦後の国際平和体制","items":["ロシア革命","ヴェルサイユ条約","国際連盟成立","四カ国条約","九カ国条約"],"e":"1917年→1919年→1920年→1921年→1922年。"}]}],"review":[{"q":"条約改正が1894年にまず法権回復の形で実現した背景として最も適当なものはどれか。","c":["日清戦争の勝利で国際的地位が向上したため","ロシアの南下を警戒したイギリスが日本に歩み寄ったため","対外硬派連合が現行条約励行を主張したため","アメリカが門戸開放宣言を出したため"],"a":1,"e":"日英通商航海条約は日清戦争直前に締結。日清・日露の勝利は1911年の税権完全回復の背景。"},{"q":"三国干渉から日英同盟締結に至る流れとして正しいものはどれか。","c":["三国干渉でロシアに遼東半島を返還→ロシアが旅順・大連を租借→北清事変後も満洲を占領→日英同盟で対抗","日英同盟締結→三国干渉→北清事変","北清事変→三国干渉→ロシアの旅順租借","三国干渉→日露協約→日英同盟"],"a":0,"e":"1895年干渉→1898年租借→1900年北清事変→1902年同盟という因果の流れ。"},{"q":"日清戦争後に政府と政党が接近し、やがて立憲政友会が成立した流れとして正しいものはどれか。","c":["政党が超然主義を受け入れ、山県有朋が政友会を結成した","戦後経営で政党を無視できなくなった政府が提携を始め、隈板内閣崩壊後に山県内閣の政党抑制策に反発した憲政党が伊藤博文と合同した","軍部大臣現役武官制で政党が軍を掌握し政友会を結成した","大逆事件で社会主義が弾圧され政友会が生まれた"],"a":1,"e":"資本家・地主の発言力増大→提携→憲政党→隈板内閣→第2次山県内閣→立憲政友会（1900年）。"},{"q":"日露戦争後の日本の対外関係の変化として正しいものはどれか。","c":["アメリカとの関係が良好になり、ロシアと対立を続けた","満蒙権益維持のためロシアと接近し、門戸開放を唱えるアメリカとの関係が悪化した","イギリスとの同盟を強化し、韓国の独立を認めた","中国と同盟して列強に対抗した"],"a":1,"e":"日露協約を4次にわたり結ぶ一方、桂・ハリマン覚書破棄や移民問題で米との関係は冷却化した。"},{"q":"日比谷焼打ち事件と第一次護憲運動に共通する背景として最も適当なものはどれか。","c":["社会主義運動の高揚","藩閥・軍閥主導の政治と戦争の負担に対する国民の不満","条約改正の失敗","外国からの内政干渉"],"a":1,"e":"賠償金なしの講和への不満、日露戦後の長期不況と閥族の横暴への不満がそれぞれ民衆を動かした。"},{"q":"日本がヴェルサイユ・ワシントン体制を受け入れた結果として正しいものはどれか。","c":["日英同盟を強化し軍拡を続けた","山東権益を返還し、海軍軍縮を実施して協調外交を展開した","国際連盟を脱退した","シベリアに永久駐兵した"],"a":1,"e":"九カ国条約で山東権益返還、海軍軍縮条約で主力艦制限、会議後にシベリア撤兵を宣言した。"}]},{"id":18,"title":"近代産業と近代文化の発展","era":"明治中期〜昭和初期","span":"1886〜1936","oneLine":"産業革命で資本主義が成立し、社会運動と大衆文化が広がった","chain":["第二次松方正義内閣","第一次西園寺公望内閣","第二次桂太郎内閣","寺内正毅内閣","原敬内閣","高橋是清内閣","加藤友三郎内閣","第二次山本権兵衛内閣"],"parts":[{"title":"近代産業の発展","flow":[{"y":"1882","t":"大阪紡績会社設立","s":"渋沢栄一らが設立し翌年開業。手紡・ガラ紡から機械制生産へ","why":"紡績業を機械化して産業革命の中心とするため"},{"y":"1886","t":"企業勃興","s":"鉄道・紡績を中心に会社設立ブームが起こる（〜89年）","why":"松方デフレの不況を脱出し、物価安定・金利低下で株式取引が活発化したため"},{"y":"1890","t":"1890年恐慌","s":"株式払込の集中で資金不足、前年の凶作と生糸輸出半減が加わりブーム挫折","why":""},{"y":"1896","t":"航海奨励法・造船奨励法","s":"海運・造船を政府が奨励。日本郵船会社が遠洋航路を拡大","why":"日清戦争での商船の功労に報い、外貨節約と軍用船確保をはかるため"},{"y":"1897","t":"貨幣法（金本位制）","s":"第二次松方正義内閣が制定し金本位制を確立","why":"日清戦争の賠償金を基礎に、銀価低落と世界の大勢に合わせ貿易を発展させるため"},{"y":"1897","t":"官営八幡製鉄所設立","s":"ドイツの技術を背景に北九州に建設、1901年操業開始","why":"日清戦争の賠償金で軍需中心の重工業を育てるため"},{"y":"1900","t":"資本主義恐慌","s":"過剰生産による初の資本主義恐慌。日清戦争後の企業勃興の反動","why":""},{"y":"1906","t":"鉄道国有法","s":"第一次西園寺公望内閣が民間の主要幹線17社を買収","why":"軍事的配慮と全国鉄道網の統一的管理のため"},{"y":"1909","t":"綿織物輸出が輸入を超える","s":"生糸輸出量も清を抜き世界最大に。繊維製品輸出が伸張","why":"豊田佐吉の国産力織機など生産力が向上したため"},{"y":"","t":"財閥の形成","s":"三井・三菱・住友・安田の四大財閥が持株会社を本社にコンツェルンを形成","why":"松方財政の官営事業払い下げを背景に資本が集中したため"}],"story":"【松方デフレ】の不況を脱出すると、1886年から鉄道・紡績を中心に【企業勃興】が起こり、産業革命が始まった。中心は【紡績業】で、【渋沢栄一】らの【大阪紡績会社】が機械制生産を進め、1890年に綿糸生産量が輸入量を上回った。日清戦争後は賠償金を基礎に【貨幣法】で金本位制を確立し、【官営八幡製鉄所】で重工業の勃興をはかった。日露戦争前後の第二次産業革命では綿織物輸出が輸入を超えたが、綿花や重工業資材の輸入も増え、輸入超過と外債の利払いに苦しんだ。軍事的配慮から【鉄道国有法】で幹線が国有化され、官営事業払い下げを背景に【財閥】が形成された。一方、低賃金・長時間労働の問題が生じ→【労働組合期成会】が結成され、【足尾 道を除く官営事業が払い下げられ、三井・三菱などの政商資本が育成されて財閥へ発展した。"},{"q":"足尾銅山鉱毒事件について正しいものはどれか。","c":["三菱財閥の経営する鉱山で起こった","田中正造が古河財閥に操業停止を訴えた","高野房太郎が天皇に直訴した","納屋制度による坑夫の虐待が問題となった"],"a":1,"e":"古河財閥の足尾銅山の鉱毒が渡良瀬川流域に被害を与え、田中正造が操業停止を訴え1901年には天皇に直訴を試みた。"},{"q":"第一次西園寺公望内閣が総辞職した直接の原因はどれか。","c":["大逆事件の判決","米騒動の全国化","足尾鉱毒事件の直訴","赤旗事件の責任"],"a":3,"e":"1908年の赤旗事件で直接行動派が逮捕され、第一次西園寺内閣は責任を取って総辞職した。大逆事件は第二次桂内閣。"},{"q":"大逆事件の結果として正しいものはどれか。","c":["日本社会党が合法化された","労働組合期成会が結成された","特別高等課が設置され社会主義運動は「冬の時代」に入った","工場法が廃止された"],"a":2,"e":"全員が有罪となり幸徳秋水ら12名が死刑。警視庁に特高が置かれ、以後約10年間社会主義運動は「冬の時代」となった。"}],"order":[{"title":"産業革命の進展","items":["大阪紡績会社の設立","1890年恐慌","貨幣法による金本位制の確立","官営八幡製鉄所の操業開始","鉄道国有法"],"e":"1882年設立→1890年恐慌→1897年貨幣法→1901年操業開始→1906年鉄道国有法。"},{"title":"社会主義運動の展開","items":["社会民主党の結成","平民社の創立","日本社会党の結成","赤旗事件","大逆事件"],"e":"1901年社会民主党（非合法）→1903年平民社→1906年日本社会党（合法）→1908年赤旗事件→1910年大逆事件で「冬の時代」へ。"},{"title":"労働問題への対応","items":["甲府雨宮製糸工女スト","労働組合期成会の結成","治安警察法の制定","工場法の制定"],"e":"1886年初のストライキ→1897年期成会→1900年治安警察法で運動を規制→1911年工場法制定（施行は1916年）。"}]},{"title":"明治時代の文化","flow":[{"y":"1868","t":"神仏分離令","s":"神仏習合を否定し廃仏毀釈が起こる","why":"神道国教化をめざしたため"},{"y":"1872","t":"学制","s":"文部卿大木喬任のもとフランス流の制度を採用、国民皆学を表明","why":"近代国家形成のため教育を普及させる"},{"y":"1873","t":"明六社結成","s":"森有礼を社長に『明六雑誌』を発行し西洋啓蒙思想を紹介","why":""},{"y":"1879","t":"教育令","s":"文部卿寺島宗則のもとアメリカ流の自由な制度へ転換","why":"学制の全国画一的な強制に批判が噴出したため"},{"y":"1880","t":"改正教育令","s":"再び中央集権的なドイツ流の国家主義的教育へ","why":"自由教育令が混乱を招いたため"},{"y":"","t":"『小説神髄』","s":"坪内逍遥の評論を契機に写実主義と言文一致運動が起こる","why":""},{"y":"1886","t":"学校令","s":"文部大臣森有礼が制定、義務教育3〜4年","why":"国家主義教育を強化するため"},{"y":"1887","t":"東京美術学校・東京音楽学校","s":"岡倉天心とフェノロサが美術学校設立に尽力、音楽学校は伊沢修二が初代校長","why":""},{"y":"1890","t":"教育勅語","s":"元田永孚・井上毅が起草、忠君愛国を強調","why":"国家主義的な教育理念を示すため"},{"y":"1903","t":"国定教科書","s":"教科書を検定制から国定制へ変更","why":"教育統制を強めるため"}],"story":"明治の文化は和洋・旧新が混在する二元性を特色とした。太陽暦の採用や断髪令など【文明開化】が進む一方、伝統文化軽視の風潮も広がった。思想では【森有礼】を社長とする【明六社】が西洋啓蒙思想を紹介し、【福沢諭吉】の功利主義や【中江兆民】の自由主義が民権論を支えた。しかし明治20年代、三国干渉への憤激から国家主義が台頭→【徳富蘇峰】の平民主義、【三宅雪嶺】の国粋主義などが現れた。教育は【学制】（仏流）→【教育令】（米流）→改正教育令（独流）と揺れたのち、【学校令】と【教育勅語】で国家主義教育が確立した。宗教は【廃仏毀釈】ののち神道国教化が挫折し、法律の範囲内で信教の自由が認められた。学問ではお雇い外国人が近代科学を導入し【北里柴三郎】らが活躍。文学は『小説神髄』から写実主義・言文一致運動が起こり、ロマン主義・自然主義を経て【夏目漱石】と森鷗外が近代的自我の確立をめざした。","keywords":["明六社","森有礼","加藤弘之","福沢諭吉","徳富蘇峰","三宅雪嶺","学制","教育令","学校令","教育勅語","廃仏毀釈","北里柴三郎","小説神髄","自然主義","東京美術学校"],"blanks":[{"q":"天賦人権思想を紹介した【　】は、『人権新説』で国権論に変説した。","a":"加藤弘之","h":"明六社の同人"},{"q":"『西洋事情』『学問のすゝめ』『文明論之概略』を著したのは【　】である。","a":"福沢諭吉","h":"慶應義塾の創設者"},{"q":"【　】らの民友社は雑誌『国民之友』を発行し平民主義を唱えた。","a":"徳富蘇峰","h":"熊本バンドの一員"},{"q":"1872年、文部卿大木喬任のもとで出されたフランス流の教育制度は【　】である。","a":"学制","h":"国民皆学の理念を表明"},{"q":"1879年、アメリカ流の自由な教育制度として【　】が出された。","a":"教育令","h":"文部卿は寺島宗則"},{"q":"1886年、文部大臣森有礼は【　】を制定し、義務教育を3〜4年とした。","a":"学校令","h":"国家主義教育の強化"},{"q":"1890年、元田永孚・井上毅が起草した【　】は忠君愛国を強調した。","a":"教育勅語","h":"翌年、内村鑑三不敬事件が起こる"},{"q":"1868年の神仏分離令により神仏習合が否定され、【　】が起こった。","a":"廃仏毀釈","h":"仏教が打撃を受けた"},{"q":"ドイツのコッホに学び伝染病研究所初代所長となったのは【　】である。","a":"北里柴三郎","h":"のち北里研究所を設立"},{"q":"【　】は米でタカジアスターゼを発明しアドレナリンを抽出した。","a":"高峰譲吉","h":"薬学者"},{"q":"1887年、岡倉天心とフェノロサが設立に尽力した官立学校は【　】である。","a":"東京美術学校","h":"初代校長は岡倉天心"},{"q":"鹿鳴館・ニコライ堂を設計したイギリス人建築家は【　】である。","a":"コンドル","h":"辰野金吾らを育てた"}],"mc":[{"q":"明治20年代に国家主義が台頭した背景として最も適当なものはどれか。","c":["自由民権運動の高揚","三国干渉への憤激","大逆事件の判決","米騒動の広がり"],"a":1,"e":"日清戦争勝利の自信と三国干渉への憤激が国家主義〔ナショナリズム〕への転換をもたらした。"},{"q":"1879年に教育令が出された理由として正しいものはどれか。","c":["学制の全国画一的な強制に批判が噴出したため","教育勅語の理念を実現するため","義務教育を6年に延長するため","国定教科書を導入するため"],"a":0,"e":"学制の画一的な強制に政府内外から批判が出たため、アメリカ流の自由な教育令に転換したが、混乱を招き翌年改正された。"},{"q":"教育制度の変遷として正しいものはどれか。","c":["学制（アメリカ流）→教育令（フランス流）→改正教育令（ドイツ流）","学制（ドイツ流）→教育令（フランス流）→改正教育令（アメリカ流）","学制（フランス流）→教育令（アメリカ流）→改正教育令（ドイツ流）","学制（フランス流）→教育令（ドイツ流）→改正教育令（アメリカ流）"],"a":2,"e":"学制はフランス流、教育令はアメリカ流、改正教育令はドイツ流の国家主義的教育をめざした。"},{"q":"明治政府が神道国教化を諦めた結果として正しいものはどれか。","c":["キリスト教が国教とされた","祭祀と宗教を分離し国家神道が確立、法律の範囲内で信教の自由が認められた","廃仏毀釈が始まった","神仏習合が復活した"],"a":1,"e":"大教宣布の詔による国教化は挫折し、祭祀と宗教を分離して国家神道とし、大日本帝国憲法で法律の範囲内の信教の自由を認めた。"},{"q":"言文一致運動が起こる契機となったものはどれか。","c":["森鷗外『舞姫』","二葉亭四迷『浮雲』","尾崎紅葉『金色夜叉』","坪内逍遥『小説神髄』"],"a":3,"e":"坪内逍遥の評論『小説神髄』を契機に写実主義が生まれ、二葉亭四迷らが言文一致運動を進めた。"},{"q":"明六社について正しいものはどれか。","c":["中江兆民を社長に急進的民権論を唱えた","三宅雪嶺らが国粋主義を唱えた","徳富蘇峰らが平民主義を唱えた","森有礼を社長に西洋啓蒙思想を紹介した"],"a":3,"e":"1873年、森有礼を社長に結成され『明六雑誌』で西洋啓蒙思想を紹介した。"},{"q":"日露戦争前後に流行した文学の潮流はどれか。","c":["自然主義","戯作文学","政治小説","理想主義"],"a":0,"e":"日露戦争前後には田山花袋・島崎藤村らの自然主義や社会小説が流行した。ロマン主義は日清戦争前後。"},{"q":"白馬会が結成された経緯として正しいものはどれか。","c":["岡倉天心が日本画中心の団体として設立した","黒田清輝らが明治美術会から脱会して結成した","浅井忠らが初の西洋美術団体として結成した","工部美術学校の閉鎖に伴い設立された"],"a":1,"e":"1896年、黒田清輝・久米桂一郎らが明治美術会（1889年、浅井忠ら）から脱会して結成した。"}],"order":[{"title":"教育制度の整備","items":["学制","教育令","改正教育令","学校令","教育勅語"],"e":"1872年学制→1879年教育令→1880年改正教育令→1886年学校令→1890年教育勅語と、国家主義教育の強化へ進んだ。"},{"title":"明治文学の潮流","items":["戯作文学","政治小説","写実主義","ロマン主義","自然主義"],"e":"仮名垣魯文の戯作→矢野龍溪らの政治小説→坪内逍遥・二葉亭四迷の写実主義→日清戦争前後のロマン主義→日露戦争前後の自然主義。"},{"title":"明治の美術団体","items":["工部美術学校","東京美術学校","明治美術会","白馬会","日本美術院"],"e":"1876年工部美術学校→1887年東京美術学校→1889年明治美術会→1896年白馬会→1898年日本美術院。"}]},{"title":"「大正デモクラシー」の風潮","flow":[{"y":"1916","t":"寺内正毅内閣成立","s":"陸軍・長州閥の初代朝鮮総督が超然内閣を組閣","why":""},{"y":"1916","t":"吉野作造の民本主義","s":"『中央公論』に発表、天皇主権の枠内で民主主義の長所を採用","why":"大正デモクラシーの理論的支柱となる"},{"y":"1916","t":"憲政会結成","s":"立憲同志会の加藤高明が改組。翌年の総選挙では立憲政友会が第一党","why":"寺内内閣に対抗するため"},{"y":"1918","t":"米騒動","s":"越中の女一揆を発端に全国に拡大、寺内内閣総辞職","why":"都市人口の激増とシベリア出兵を要因とする異常な米価高のため"},{"y":"1918","t":"原敬内閣成立","s":"初の本格的政党内閣、「平民宰相」。四大政綱の積極政策","why":"民衆運動の高まりを機に元老が政党内閣を認めたため"},{"y":"1919","t":"選挙法改正","s":"選挙権を直接国税3円以上に引き下げ、小選挙区制を導入","why":"普通選挙運動には冷淡で、時期尚早として衆議院解散"},{"y":"1920","t":"戦後恐慌","s":"積極政策の財源を失う。初のメーデー、森戸事件も同年","why":""},{"y":"1921","t":"原敬刺殺・高橋是清内閣","s":"原敬が東京駅で刺殺され、高橋是清が閣僚全員留任で組閣","why":""},{"y":"1922","t":"加藤友三郎内閣・全国水平社・日本共産党","s":"非政党内閣が続く一方、社会運動が高揚","why":"高橋内閣が閣内不統一で総辞職したため"},{"y":"1923","t":"関東大震災・虎の門事件","s":"第二次山本権兵衛内閣が「地震内閣」となり、虎の門事件で総辞職","why":""}],"story":"第一次世界大戦の終結、【ロシア革命】、【米騒動】を背景に、天皇主権の憲法の枠内で市民的自由と大衆の政治参加を求める【大正デモクラシー】の風潮が高まった。1916年に【吉野作造】が【民本主義】を唱え、【美濃部達吉】の天皇機関説とともに理論的支柱となった。陸軍・長州閥の【寺内正毅】内閣は超然内閣だったが、大戦景気下の米価高騰が原因で1918年に米騒動が全国化し総辞職→元老が政党内閣を認め、【原敬】の立憲政友会内閣が成立した。原内閣は積極政策を進めたが普選には冷淡で、1920年の【戦後恐慌】で財源を失い、翌年原は東京駅で刺殺された。続く【高橋是清】内閣は閣内不統一で倒れ、非政党内閣が続く中、1923年の【関東大震災】直後に【虎の門事件】が起こった。同じ頃、労働運動は【友愛会】から【日本労働総同盟】へ階級闘争主義化し、【日本共産党】・【青鞜社】・【全国水平社】など社会運動が発展した。","keywords":["大正デモクラシー","寺内正毅","憲政会","米騒動","原敬","高橋是清","関東大震災","虎の門事件","友愛会","日本労働総同盟","吉野作造","民本主義","日本共産党","青鞜社","全国水平社"],"blanks":[{"q":"1916年、初代朝鮮総督であった【　】が陸軍・長州閥の超然内閣を組閣した。","a":"寺内正毅","h":"非立憲内閣とよばれた"},{"q":"立憲同志会の加藤高明は1916年に【　】に改組した。","a":"憲政会","h":"寺内内閣に対抗"},{"q":"1918年、富山県の主婦による「越中の女一揆」を発端に【　】が全国に広がった。","a":"米騒動","h":"寺内内閣は総辞職"},{"q":"1918年、立憲政友会の【　】が初の本格的政党内閣を組織した。","a":"原敬","h":"「平民宰相」"},{"q":"1921年、原敬は一青年により【　】で刺殺された。","a":"東京駅","h":"後継は高橋是清"},{"q":"原敬暗殺後、大蔵大臣の【　】が首相を兼任し、閣僚すべてを留任した。","a":"高橋是清","h":"第4代立憲政友会総裁"},{"q":"1923年9月1日に起こった【　】で東京市の3分の2が壊滅し、戒厳令が出された。","a":"関東大震災","h":"第二次山本内閣組閣の前日"},{"q":"摂政宮裕仁親王が難波大助に狙撃された【　】で、第二次山本権兵衛内閣は総辞職した。","a":"虎の門事件","h":"1923年"},{"q":"1912年、鈴木文治を中心に労資協調主義の【　】が結成された。","a":"友愛会","h":"のち日本労働総同盟へ"},{"q":"1916年、東京帝国大学教授【　】は『中央公論』で民本主義を唱えた。","a":"吉野作造","h":"黎明会を結成"},{"q":"1922年、堺利彦・山川均らはコミンテルンの日本支部として【　】を非合法で結成した。","a":"日本共産党","h":"初代委員長は堺利彦"},{"q":"1922年、西光万吉が宣言を起草した【　】が京都で結成された。","a":"全国水平社","h":"部落解放運動"}],"mc":[{"q":"1918年に米価が異常に高騰した原因として最も適当なものはどれか。","c":["戦後恐慌による生産の減少","都市人口の激増とシベリア出兵を当て込んだ買占め","関東大震災による流通の途絶","金本位制の採用による物価上昇"],"a":1,"e":"大戦景気下で都市人口が激増し、シベリア出兵を当て込んだ地主・商人の買占め・売り惜しみで米価が高騰した。"},{"q":"原敬内閣が成立した背景として正しいものはどれか。","c":["第一次護憲運動で桂内閣が倒れたため","憲政会が総選挙で勝利したため","普通選挙法が制定されたため","米騒動を機に元老が政党内閣の成立を認めたため"],"a":3,"e":"米騒動で民衆運動の力を目の当たりにした元老が政党内閣を認め、寺内内閣の後に立憲政友会の原内閣が成立した。"},{"q":"原敬内閣の政策として正しいものはどれか。","c":["男子普通選挙法の制定","ワシントン海軍軍縮条約の調印","選挙権を直接国税3円以上に引き下げ小選挙区制を導入","シベリアからの撤兵完了"],"a":2,"e":"1919年に選挙資格を3円以上に引き下げ小選挙区制を導入したが、普通選挙には冷淡だった。軍縮条約は高橋内閣、撤兵完了は加藤友三郎内閣。"},{"q":"原敬内閣が挫折した原因として最も適当なものはどれか。","c":["戦後恐慌で積極政策の財源を失ったため","米騒動の責任を問われたため","虎の門事件の責任を取ったため","二個師団増設問題で陸軍と衝突したため"],"a":0,"e":"1920年の戦後恐慌により積極政策を展開する財源を失い、翌年原は刺殺された。"},{"q":"大正デモクラシーの背景として適当でないものはどれか。","c":["第一次世界大戦の終結","ロシア革命の成功","米騒動の広がり","大逆事件の判決"],"a":3,"e":"背景はWWⅠの終結・ロシア革命・米騒動。大逆事件は1910年で、社会主義運動を「冬の時代」に追い込んだ出来
