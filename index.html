"story":"藤原【北家】は、娘を入内させて天皇の【外戚】となる外戚政策と他氏排斥によって台頭した。810年の【藤原冬嗣】の蔵人頭就任が契機で、子の【藤原良房】は842年の【承和の変】で恒貞親王らを排斥し、858年に孫の【清和天皇】が幼少で即位したため臣下で初の【摂政】となり、866年の【応天門の変】で伴善男を排斥して正式の摂政となった。養子の【藤原基経】は884年に初の【関白】となり、【阿衡の紛議】で宇多天皇に勅書を撤回させて地位を確立した。しかし基経の死後、北家と外戚関係のない【宇多天皇】は摂関を置かず親政（【寛平の治】）を行い、【菅原道真】を登用した→続く【醍醐天皇】も親政（【延喜の治】）を行ったが、901年の【昌泰の変】で道真は時平の讒言で左遷された。朱雀天皇のもとで【藤原忠平】が一時摂関政治を復活させたが、忠平の死後は【村上天皇】が親政（【天暦の治】）を行った。11世紀には延喜・天暦の治が理想の治世と美化された。","keywords":["外戚","他氏排斥","藤原冬嗣","藤原良房","承和の変","摂政","応天門の変","藤原基経","関白","阿衡の紛議","寛平の治","菅原道真","延喜の治","昌泰の変","藤原忠平"],"blanks":[{"q":"藤原北家は娘を入内・出産させて天皇の【　】（母方の親戚）となることで発展した。","a":"外戚","h":"当時は妻問婚で男児も母方で育った"},{"q":"842年の【　】で、藤原良房は皇太子恒貞親王・伴健岑・橘逸勢を謀反の疑いで排斥した。","a":"承和の変","h":"仁明天皇のとき"},{"q":"858年、藤原良房は孫の【　】天皇が幼少で即位したため、臣下で初の摂政となった。","a":"清和","h":"娘明子の産んだ惟仁親王"},{"q":"866年の【　】で、大納言伴善男と紀氏の兄弟が排斥され、良房は正式の摂政となった。","a":"応天門の変","h":"左大臣源信を陥れるための放火"},{"q":"良房の養子【　】は、884年に陽成天皇を廃位して光孝天皇のもとで初の関白となった。","a":"藤原基経","h":"阿衡の紛議で地位を確立"},{"q":"887年からの【　】で、宇多天皇は勅書を撤回し、橘広相が責を負った。","a":"阿衡の紛議","h":"阿衡事件ともいう。基経の示威事件"},{"q":"宇多天皇は藤原北家と外戚関係がないことから摂政・関白を置かず親政を行った。これを【　】の治という。","a":"寛平","h":"文章博士菅原道真を蔵人頭に登用"},{"q":"醍醐天皇の親政を【　】の治といい、左大臣藤原時平・右大臣菅原道真を従えて始まった。","a":"延喜","h":"11世紀に理想的な治世と美化される"},{"q":"901年の【　】で、菅原道真は藤原時平の讒言により大宰権帥に左遷された。","a":"昌泰の変","h":"道真の怨霊を鎮めるため北野天満宮などがつくられた"},{"q":"朱雀天皇のとき、時平の弟【　】により一時的に摂関政治が復活した。","a":"藤原忠平","h":"この時期に承平・天慶の乱"},{"q":"関白藤原忠平の死後、【　】天皇は摂政・関白を置かず親政（天暦の治）を行った。","a":"村上","h":"958年に乾元大宝を鋳造"},{"q":"958年に鋳造された【　】は、最後の本朝（皇朝）十二銭である。","a":"乾元大宝","h":"村上天皇のとき"}],"mc":[{"q":"藤原北家が外戚となることを重視した背景として最も適当なものはどれか。","c":["天皇が外戚の氏長者に太政大臣を世襲させる制度があったため","外戚でなければ荘園の寄進を受けられなかったため","律令で摂政は外戚に限ると定められていたため","妻問婚の風習で男児も幼少時は母方の実家で養育されたため"],"a":3,"e":"母方で育つため外祖父などの外戚が天皇に強い影響力をもった。"},{"q":"藤原良房が臣下で初の摂政となった経緯として正しいものはどれか。","c":["応天門の変で源信を排斥した功績による","娘明子の産んだ孫の惟仁親王が幼少で即位したため","陽成天皇を廃位して光孝天皇を立てたため","阿衡の紛議で勅書を撤回させたため"],"a":1,"e":"858年、清和天皇が8歳で即位したため事実上の摂政に。866年の応天門の変で正式の摂政となる。"},{"q":"応天門の変について正しいものはどれか。","c":["橘逸勢が応天門に放火し排斥された","藤原基経が陽成天皇を廃位した","伴善男が源信を陥れるため応天門に放火したとして排斥された","菅原道真が大宰権帥に左遷された"],"a":2,"e":"嵯峨源氏の左大臣源信を陥れようとした大納言伴善男と紀氏の兄弟を排斥した。"},{"q":"宇多天皇が摂政・関白を置かず親政を行った理由として最も適当なものはどれか。","c":["藤原北家と外戚関係がなかったため","藤原基経が阿衡の紛議で失脚したため","承平・天慶の乱で藤原氏が没落したため","菅原道真が関白に就任したため"],"a":0,"e":"基経の死後、北家と外戚関係のない宇多天皇は親政（寛平の治）を展開した。"},{"q":"894年に遣唐使が停止された理由として、テキストで名目とされたものはどれか。","c":["新羅が唐と同盟して航路を封鎖したため","藤原時平が道真を排斥するため","黄巣の乱などによる唐の衰退と航海の危険","宋が建国され唐が滅亡したため"],"a":2,"e":"名目は唐の衰退と航海の危険。背景に朝廷の財政難、唐文化の十分な吸収、民間貿易の発達もあった。"},{"q":"昌泰の変の結果として正しいものはどれか。","c":["藤原時平が大宰権帥に左遷された","源高明が大宰権帥に左遷された","橘広相が責を負って辞任した","菅原道真が大宰権帥に左遷された"],"a":3,"e":"藤原時平の讒言により道真が左遷。源高明の左遷は969年の安和の変。"},{"q":"延喜・天暦の治が後世に美化された背景として最も適当なものはどれか。","c":["11世紀の文人貴族が自らの地位低下や摂関家の専横に不満をもったため","醍醐・村上天皇が律令制を完全に復活させたため","藤原忠平が両天皇の親政を記録させたため","遣唐使の再開で唐の文化が流入したため"],"a":0,"e":"摂関政治全盛の11世紀に、摂関を置かなかった醍醐・村上天皇の親政が理想化された。"}],"order":[{"title":"藤原北家の他氏排斥事件","items":["承和の変","応天門の変","阿衡の紛議","昌泰の変"],"e":"承和の変（842、良房）→応天門の変（866、良房）→阿衡の紛議（887〜888、基経）→昌泰の変（901、時平）。"},{"title":"北家の台頭を担った人物","items":["藤原冬嗣","藤原良房","藤原基経","藤原時平","藤原忠平"],"e":"冬嗣（蔵人頭）→子の良房（初の摂政）→養子の基経（初の関白）→時平（昌泰の変）→弟の忠平（摂関政治復活）。"},{"title":"9〜10世紀の天皇","items":["清和天皇","宇多天皇","醍醐天皇","朱雀天皇","村上天皇"],"e":"良房が摂政となった清和→寛平の治の宇多→延喜の治の醍醐→忠平が摂関の朱雀→天暦の治の村上。"}]},{"title":"摂関政治と外交","flow":[{"y":"969","t":"安和の変","s":"左大臣源高明（醍醐源氏）が源満仲の讒言により大宰権帥に左遷される。北家最後の他氏排斥事件","why":"以後、摂関常置が慣例となる"},{"y":"","t":"氏長者争い","s":"兼通と兼家、道隆と道兼、道長と伊周の争いを経て道長・頼通父子の全盛期へ","why":"他氏排斥が完了し争いが一族内に移ったため"},{"y":"995","t":"道長が一条天皇の内覧に","s":"甥の伊周との政争に勝利し左大臣に昇進","why":""},{"y":"1000","t":"彰子が一条天皇の中宮に","s":"道隆の娘定子は皇后として並立","why":"外戚政策"},{"y":"1016","t":"道長が後一条天皇の摂政に","s":"孫の後一条天皇の摂政となり、翌年摂政を頼通に譲って太政大臣に昇進","why":""},{"y":"1018","t":"一家三立后","s":"娘威子が後一条天皇の中宮となり「この世をば我が世とぞ思ふ望月の…」と詠む","why":""},{"y":"1019","t":"刀伊の入寇","s":"女真（刀伊）の一部が九州北部に来襲し、大宰権帥藤原隆家が地方武士を動員して撃退","why":""},{"y":"1020","t":"法成寺の建立","s":"道長が平安京外に建立（無量寿院）。1021年には日記『御堂関白記』","why":""},{"y":"1053","t":"平等院鳳凰堂の建立","s":"藤原頼通（宇治関白）が宇治に建立","why":"1052年から末法に入ると考えられたため"},{"y":"1068","t":"頼通が関白を教通に譲る","s":"後冷泉天皇の関白を弟の教通に譲る","why":""}],"story":"969年の【安和の変】で【源高明】が左遷され、藤原北家の他氏排斥は完了→以後摂関常置が慣例となり、争いは北家内の氏長者争いに移った。【藤原道長】・【頼通】父子の【摂関政治】全盛期を迎える。道長は995年に内覧となって甥の【伊周】に勝ち、一家三立后を達成し、1016年に孫の後一条天皇の摂政となった。摂関は天皇の【外戚】として政務を代行・補佐し、官吏の任免権を握ったため【成功】の収入も莫大で、寄進地系荘園も集積した。重要政務は【陣定】で決定されたが、先例・儀式を重視して積極的政策はなく→国政は形式的となり、国司に一任された地方政治は乱れて武士団成長の要因となった。外交では894年に【菅原道真】の建議で遣唐使が停止され、907年に【唐】が滅亡、960年に【宋】が建国された。朝鮮では【高麗】が半島を統一し、渤海は926年に【契丹】に滅ぼされた。日本はいずれとも国交を開かず、民間貿易のみ続いた。1019年の【刀伊の入寇】は藤原隆家が撃退した。","keywords":["安和の変","源高明","氏長者","藤原道長","藤原伊周","一家三立后","陣定","藤原頼通","平等院鳳凰堂","刀伊の入寇","藤原隆家","唐物","宋","高麗","契丹"],"blanks":[{"q":"969年の【　】で左大臣源高明が大宰権帥に左遷され、藤原北家による他氏排斥は終わった。","a":"安和の変","h":"源満仲の讒言による。以後摂関常置"},{"q":"他氏排斥の完了後、藤原北家内で「【　】」争いが展開された。","a":"氏長者","h":"兼通と兼家、道隆と道兼、道長と伊周"},{"q":"藤原道長は甥の【　】との政争に勝利し、995年に一条天皇の内覧となった。","a":"伊周","h":"道隆の子。妹の定子は皇后"},{"q":"1018年、道長の娘【　】が後一条天皇の中宮となり、一家三立后が達成された。","a":"威子","h":"彰子は一条天皇、妍子は三条天皇の中宮"},{"q":"道長は1020年に平安京外に【　】（無量寿院）を建立した。","a":"法成寺","h":"焼失して現存せず"},{"q":"藤原道長の日記を『【　】』という。","a":"御堂関白記","h":"道長は御堂関白と呼ばれた"},{"q":"藤原頼通は1053年、宇治に【　】を建立した。","a":"平等院鳳凰堂","h":"1052年から末法の始まり"},{"q":"摂関政治期の重要政務は、公卿が参加する内裏の左右近衛府の陣における「【　】」で決定された。","a":"陣定","h":"先例・儀式を重視"},{"q":"960年、趙匡胤が【　】を建国し、979年に中国を統一した。","a":"宋","h":"唐滅亡後の五代十国を経て"},{"q":"918年に王建が【　】を建国し、936年に朝鮮半島を統一した。","a":"高麗","h":"新羅は935年に滅亡"},{"q":"10世紀前半、モンゴル高原東南部を本拠とする【　】が強力な国家を建て、926年に渤海を滅ぼした。","a":"契丹","h":"中国風に遼ともいう"},{"q":"1019年、女真の一部が九州北部に来襲し、大宰権帥藤原隆家が撃退した事件を【　】という。","a":"刀伊の入寇","h":"隆家は伊周の弟"}],"mc":[{"q":"安和の変の結果として正しいものはどれか。","c":["藤原北家が没落し天皇の親政が始まった","菅原道真が大宰権帥に左遷された","以後、摂政・関白の常置が慣例となった","清和源氏が排斥された"],"a":2,"e":"北家最後の他氏排斥事件で、以後は摂関常置となり氏長者争いへ移った。源満仲（清和源氏）は北家と通じた側。"},{"q":"藤原道長が権力を握った過程について正しいものはどれか。","c":["兄の道隆に勝利して関白となった","陽成天皇を廃位して摂政となった","安和の変で源高明を排斥して摂政となった","甥の伊周との政争に勝利して一条天皇の内覧となった"],"a":3,"e":"995年に内覧となり左大臣に昇進、1016年に孫の後一条天皇の摂政となった。"},{"q":"摂関が莫大な収入を得た理由として最も適当なものはどれか。","c":["国司として任国に赴任し徴税を請け負ったため","官吏の任免権を握り成功による収入があったうえ、寄進地系荘園を集積したため","宋との国交を開き貿易を独占したため","健児を率いて蝦夷征討を行ったため"],"a":1,"e":"律令官人としての収入に加え、成功と寄進地系荘園（殿下渡領）からの収入があった。"},{"q":"摂関政治の結果として正しいものはどれか。","c":["国政は形式的となり、国司に一任された地方政治が乱れて武士団成長の要因となった","国司の権限が縮小され朝廷が直接地方を支配した","積極的な対外政策で宋と国交を開いた","陣定が廃止され天皇の親政が復活した"],"a":0,"e":"先例・儀式を重視し積極的政策がなく、個人・一族の栄達に執着して国政を軽視した結果。"},{"q":"10世紀の東アジア情勢について正しいものはどれか。","c":["日本は宋と正式に国交を開き遣宋使を派遣した","高麗が渤海を滅ぼし中国東北部を支配した","契丹の商人が博多に頻繁に来航した","唐・新羅・渤海が10世紀前半に滅亡し、日本は新たな国々と国交を結ばなかった"],"a":3,"e":"唐（907）・渤海（926）・新羅（935）が滅亡。宋・高麗とは商人の往来のみ、契丹とは往来もなかった。"},{"q":"日本が宋と正式な国交を開かなかった理由として最も適当なものはどれか。","c":["宋が日本人の渡航を禁止したため","東アジアの動乱や冊封体制を避けたため","藤原道長が唐物の輸入を禁止したため","刀伊の入寇で宋との航路が閉ざされたため"],"a":1,"e":"国交はなかったが宋船が博多に来航し民間貿易は継続。奝然・成尋など巡礼僧の渡航は許されることもあった。"},{"q":"刀伊の入寇について正しいものはどれか。","c":["宋の商人が九州北部を襲撃した","藤原純友が瀬戸内海で反乱を起こした","契丹の支配下にあった女真の一部が九州北部に来襲し、藤原隆家が撃退した","高麗軍が対馬に来襲し、藤原道長が撃退した"],"a":2,"e":"1019年、大宰権帥藤原隆家（伊周の弟）が地方武士団を率いて撃退した。"}],"order":[{"title":"道長の栄華","items":["一条天皇の内覧となる","彰子が一条天皇の中宮となる","後一条天皇の摂政となる","一家三立后の達成","法成寺の建立"],"e":"内覧（995）→彰子中宮（1000）→摂政（1016）→威子中宮で三立后（1018）→法成寺（1020）。"},{"title":"東アジアの王朝交代","items":["唐の滅亡","高麗の建国","渤海の滅亡","新羅の滅亡","宋の建国"],"e":"唐滅亡（907）→王建が高麗建国（918）→契丹が渤海を滅ぼす（926）→新羅滅亡（935）→趙匡胤が宋建国（960）。"},{"title":"摂関政治期の対外・国内事件","items":["遣唐使の停止","安和の変","刀伊の入寇","平忠常の乱","前九年合戦"],"e":"遣唐使停止（894）→安和の変（969）→刀伊の入寇（1019）→平忠常の乱（1028〜）→前九年合戦（1051〜）。"}]},{"title":"浄土信仰と平安中期・後期の文化","flow":[{"y":"905","t":"古今和歌集","s":"醍醐天皇の命による初の勅撰和歌集。紀貫之らが編纂し、仮名序は最古の歌論","why":"仮名文字の発達を前提に和歌が漢詩と並ぶ地位を確立"},{"y":"","t":"本地垂迹説の浸透","s":"仏を本体とし、神は仏の仮の姿（権現）とする神仏習合の進展","why":""},{"y":"","t":"空也の布教","s":"10世紀半ば、市聖と呼ばれ京の市などで一般民衆に浄土教を布教。西光寺（のちの六波羅蜜寺）を創建","why":""},{"y":"","t":"源信『往生要集』","s":"10世紀後半、恵心僧都源信が著し皇族・貴族への浄土教普及を促す","why":""},{"y":"","t":"枕草子・源氏物語","s":"中宮定子に仕えた清少納言の随筆、中宮彰子に仕えた紫式部の物語","why":"摂関政治に伴う後宮の充実と仮名文字の発達のため女流文学が発達"},{"y":"1020","t":"法成寺阿弥陀堂","s":"藤原道長が建立。焼失により現存せず","why":""},{"y":"1052","t":"末法の始まり","s":"釈迦入滅後、正法・像法を経て永承7年から末法に入ると考えられた","why":"末法思想の流行が浄土教隆盛の背景"},{"y":"1053","t":"平等院鳳凰堂","s":"藤原頼通が宇治に建立。阿弥陀如来像は定朝が寄木造で制作","why":"浄土教の流行を背景とする需要に応えた"},{"y":"","t":"来迎図の流行","s":"阿弥陀如来が往生者を迎えに来臨する場面を描く。高野山聖衆来迎図など","why":""}],"story":"平安中期〜後期には【本地垂迹説】が浸透し、【浄土教】が隆盛した。念仏「【南無阿弥陀仏】」を唱えて極楽浄土への往生を願う信仰で、社会不安、大寺院の世俗化、1052年から末法に入るとする【末法思想】の流行が背景にあった。10世紀半ばに【空也】が京の市で一般民衆に布教し、10世紀後半に【源信】が『【往生要集】』を著して皇族・貴族に広めた→この流行を背景に道長の法成寺、頼通の【平等院鳳凰堂】が建てられ、【定朝】が【寄木造】で阿弥陀如来像を大量生産し、【来迎図】が描かれた。文化全体では大陸文化を吸収・消化した日本独自の【国風文化】が栄え、【大和絵】、【三蹟】の和様書道、【蒔絵】が発達した。貴族は【寝殿造】に住み、【陰陽道】の影響で物忌・方違を行った。仮名文字の発達により905年の『【古今和歌集】』で和歌は漢詩と並ぶ地位を確立し、摂関政治に伴う後宮の充実によって、紫式部の『【源氏物語】』や清少納言の『【枕草子】』などの女流文学が発達した。","keywords":["本地垂迹説","浄土教","末法思想","空也","源信","往生要集","定朝","寄木造","来迎図","国風文化","大和絵","三蹟","寝殿造","古今和歌集","源氏物語"],"blanks":[{"q":"仏を本体とし、神は仏の仮の姿（権現）とする考えを【　】という。","a":"本地垂迹説","h":"神仏習合の進展"},{"q":"釈迦入滅後、正法・像法を経て1052年から末法に入るという【　】の流行が浄土教隆盛の背景となった。","a":"末法思想","h":"永承7年"},{"q":"10世紀半ば、【　】は市聖と呼ばれ、京の市などで一般民衆に浄土教を布教した。","a":"空也","h":"西光寺（のちの六波羅蜜寺）を創建"},{"q":"10世紀後半、源信（恵心僧都）は『【　】』を著して皇族・貴族への浄土教普及を促した。","a":"往生要集","h":"宋でも高い評価を得た"},{"q":"慶滋保胤が著した往生伝を『【　】』という。","a":"日本往生極楽記","h":"念仏の功徳で往生した人の伝記集"},{"q":"平等院鳳凰堂阿弥陀如来像は仏師【　】が寄木造で制作した。","a":"定朝","h":"仏所で阿弥陀如来像を大量生産"},{"q":"阿弥陀如来が往生者を迎えに来臨する場面を描いた絵を来迎図といい、紀伊国の【　】が代表である。","a":"高野山聖衆来迎図","h":""},{"q":"国風文化では日本の風物を題材とする【　】が発達し、巨勢金岡らが活躍した。","a":"大和絵","h":"唐絵に対する語"},{"q":"和様書道の小野道風・藤原佐理・藤原行成の3名手を【　】という。","a":"三蹟","h":"三跡とも。唐風の三筆と区別"},{"q":"貴族の多くは檜皮葺・白木造で左京に多い【　】の屋敷に居住した。","a":"寝殿造","h":"民衆は掘立柱住居"},{"q":"905年、醍醐天皇の命で初の勅撰和歌集『【　】』が完成した。","a":"古今和歌集","h":"紀貫之らが編纂。八代集の初め"},{"q":"中宮彰子に仕えた紫式部が著した物語文学の集大成が『【　】』である。","a":"源氏物語","h":"随筆『枕草子』は中宮定子に仕えた清少納言"}],"mc":[{"q":"平安中期〜後期に浄土教が隆盛した背景として最も適当なものはどれか。","c":["遣唐使によって新たに密教が持ち込まれたため","朝廷が南都六宗を禁止したため","藤原氏が念仏を義務づけたため","社会不安の増大・大寺院の世俗化・末法思想の流行があったため"],"a":3,"e":"盗賊・戦乱・疫病などの社会不安、寄進地系荘園の集積による大寺院の世俗化、1052年からの末法思想が背景。"},{"q":"空也と源信の布教対象の違いについて正しいものはどれか。","c":["空也は皇族・貴族に、源信は一般民衆に布教した","空也は宋で、源信は日本で布教した","空也は一般民衆に、源信は皇族・貴族に布教した","両者とも南都六宗の僧に布教した"],"a":2,"e":"空也は京の市で民衆に布教（市聖）、源信は『往生要集』で皇族・貴族に浄土教を広めた。"},{"q":"平安後期に寄木造が広まった理由として最も適当なものはどれか。","c":["密教の秘法で仏像を神秘的に表現するため","浄土教の流行で阿弥陀如来像の需要が高まり大量生産する必要があったため","一木造に適した木材が枯渇したため","宋から新しい技法が伝来したため"],"a":1,"e":"仏所において寄木造で阿弥陀如来像を大量生産し、定朝が平等院鳳凰堂阿弥陀如来像を制作した。"},{"q":"国風文化の最大の特色として最も適当なものはどれか。","c":["大陸文化を十分に吸収・消化した日本独自の貴族文化","唐の文化をそのまま模倣した文化","庶民を担い手とする文化","密教の影響が強い暗く神秘的な文化"],"a":0,"e":"平安京の皇族・摂関家を中心とする高度な貴族文化で、日本人の人情・嗜好や風土に合うよう工夫された。"},{"q":"平安中期〜後期に女流文学が流行した理由として最も適当なものはどれか。","c":["仮名文字の発達と摂関政治に伴う後宮の充実","文章経国思想で漢文学が衰えたため","大学別曹で女性教育が行われたため","遣唐使の停止で漢字が使われなくなったため"],"a":0,"e":"紫式部は中宮彰子、清少納言は中宮定子に仕えた。摂関家の娘の入内が後宮を充実させた。"},{"q":"貴族が日記や儀式書を盛んに著した理由として最も適当なものはどれか。","c":["陰陽道で日記の執筆が義務づけられたため","国司に赴任するための試験科目だったため","先例や儀式に精通することが教養とされ、年中行事が発達したため","浄土教で往生の記録が求められたため"],"a":2,"e":"『御堂関白記』（道長）『小右記』（実資）、儀式書『西宮記』（源高明）『北山抄』（公任）など。"},{"q":"作品と作者の組み合わせとして正しいものはどれか。","c":["蜻蛉日記－紀貫之","更級日記－菅原孝標女","土佐日記－藤原道綱母","枕草子－紫式部"],"a":1,"e":"土佐日記は紀貫之、蜻蛉日記は藤原道綱母、枕草子は清少納言。"},{"q":"弘仁・貞観文化と国風文化の比較として正しいものはどれか。","c":["前者は寄木造・大和絵、後者は一木造・曼荼羅が特色","前者は浄土教、後者は密教が芸術に影響した","前者は仮名文学、後者は勅撰漢詩集が栄えた","前者は三筆の唐風書道、後者は三蹟の和様書道が発達した"],"a":3,"e":"弘仁・貞観＝密教芸術・一木造・三筆・漢詩集、国風＝浄土教美術・寄木造・三蹟・仮名文学。"}],"order":[{"title":"浄土教の展開","items":["空也の布教","源信『往生要集』","末法の始まり","平等院鳳凰堂の建立"],"e":"空也（10世紀半ば）→源信（10世紀後半）→末法（1052）→鳳凰堂（1053、頼通）。"},{"title":"国文学の流れ","items":["古今和歌集","土佐日記","源氏物語","更級日記"],"e":"古今和歌集（905）→土佐日記（紀貫之）→源氏物語（紫式部、一条天皇の中宮彰子に仕える）→更級日記（菅原孝標女）。"}]}],"review":[{"q":"810年が「藤原式家と北家の勢力が入れ替わる年」とされる理由として最も適当なものはどれか。","c":["承和の変で式家が排斥され、北家の良房が摂政となったため","蔵人頭に北家の冬嗣が任命される一方、平城太上天皇の変で式家の仲成・薬子が没落したため","阿衡の紛議で式家の基経が失脚し、北家の時平が台頭したため","安和の変で式家の源高明が左遷されたため"],"a":1,"e":"嵯峨天皇の蔵人所設置と薬子の変が同年。これが北家台頭の契機となり、のち良房・基経が摂関政治を開始する。"},{"q":"10世紀に国司が徴税請負人化した背景として最も適当なものはどれか。","c":["摂関政治で積極的な地方政策がとられたため","遣唐使の停止で朝廷の収入が増えたため","藤原氏が国司を廃止して荘園に切り替えたため","偽籍・浮浪などで戸籍・計帳による個別人身支配が困難になり、国司に一定量の税納入と引き換えに一国支配を一任したため"],"a":3,"e":"律令の徴税方式が崩れ負名体制へ転換。摂関政治が国政を軽視したことも地方政治の乱れを助長した。"},{"q":"宇多・醍醐・村上天皇の親政が可能になった理由と、その間に摂関政治が復活した理由の組み合わせとして正しいものはどれか。","c":["藤原北家と外戚関係がなかった／朱雀天皇のもとで藤原忠平が摂関となった","藤原北家が安和の変で没落した／藤原道長が内覧となった","菅原道真が関白に就任した／昌泰の変で道真が左遷された","健児の制で軍事力を掌握した／承平・天慶の乱が起きた"],"a":0,"e":"宇多は北家と外戚関係がなく親政。醍醐・村上は摂関を置かず親政。その間の朱雀天皇期に忠平が摂関政治を一時復活。"},{"q":"弘仁・貞観文化と国風文化で仏教美術が異なる理由として最も適当なものはどれか。","c":["前期は浄土教、後期は密教が流行したため","前期は宋、後期は唐の文化の影響を受けたため","前期は唐から持ち込まれた密教の影響、後期は末法思想を背景とする浄土教の影響が強かったため","前期は庶民、後期は貴族が担い手だったため"],"a":2,"e":"前期は一木造・曼荼羅など密教芸術、後期は寄木造の阿弥陀如来像・来迎図など浄土教美術。"},{"q":"藤原北家の他氏排斥の流れとして正しいものはどれか。","c":["安和の変に始まり、承和の変で終わった","承和の変に始まり、応天門の変・昌泰の変を経て安和の変で終わり、その後は氏長者争いとなった","昌泰の変に始まり、阿衡の紛議で終わった","応天門の変に始まり、刀伊の入寇で終わった"],"a":1,"e":"842年承和の変→866年応天門の変→901年昌泰の変→969年安和の変。以後は北家内の氏長者争い。"},{"q":"摂関政治期に女流文学が発達したことと政治の関係として最も適当なものはどれか。","c":["摂関家が娘を入内させる外戚政策により後宮が充実し、仕える女房が文学を生んだ","天皇の親政で紀伝道が重視され女性にも漢文学が普及した","国司の遙任により地方で女性が文学を担った","遣唐使の廃止で宋の女流文学が流入した"],"a":0,"e":"紫式部は道長の娘彰子、清少納言は道隆の娘定子に仕えた。仮名文字の発達も前提。"}]},{"id":5,"title":"荘園公領制と武士","era":"平安時代中期〜後期","span":"10〜12世紀","oneLine":"土地は荘園と公領に再編され、治安悪化の中で武士が台頭し清和源氏が東国へ進出した","chain":["源経基","源満仲","源頼信","源頼義","源義家","藤原清衡","藤原基衡","藤原秀衡"],"parts":[{"title":"荘園公領制の確立","flow":[{"y":"","t":"初期荘園の荒廃","s":"国司が徴税請負人化し郡衙の機能が衰えたため、初期荘園は労働力を失い荒廃した","why":"律令国家体制の崩壊"},{"y":"","t":"開発領主の登場（11世紀）","s":"国衙から臨時雑役などを免除された国司の子孫・地方豪族（在庁官人）や大名田堵が大規模な土地経営を始めた","why":""},{"y":"","t":"国司との対立","s":"徴税請負人化した国司の徴税攻勢や圧迫、開発領主間の抗争が起こった","why":""},{"y":"","t":"領家の発生","s":"国司方につかない開発領主が土地を中央の貴族・寺社に名目上寄進し、荘園領主「領家」が生まれた。寄進者は荘官（預所・下司・公文）として実質支配を確保","why":"不輸・不入の権などの保護を求めたため"},{"y":"","t":"本家の発生","s":"領家がさらに権門勢家（皇族・摂関家・大寺社）に寄進し「本家」が発生。実質的支配者を本所という","why":"より強い保護を得るため"},{"y":"","t":"不輸の権（10世紀後半〜）","s":"官物・臨時雑役免除の特権。手続きは立券荘号。官省符荘と国免荘がある","why":""},{"y":"","t":"不入の権（11世紀〜）","s":"国司が派遣する検田使・追捕使の立ち入りを拒否する権利","why":""},{"y":"","t":"公領〔国衙領〕の形成","s":"国司・目代や在庁官人による公有地の私有化が進み、公領を郡・郷・保に再編。年貢・公事・夫役を徴収","why":""},{"y":"","t":"荘園公領制の確立（11世紀後半）","s":"荘・郡・郷・保が並立して一国が編成され、管理者として地方武士が配置された。田堵は名主に成長","why":""},{"y":"","t":"知行国の制度（12世紀）","s":"院や有力貴族が知行国主となり一国を支配し、公領から収益を得た。一国平均役も登場","why":"公領も私領のように扱われる傾向が強まったため"}],"story":"【律令国家体制の崩壊】により国司が徴税請負人化し、郡衙の機能が衰えたため→初期荘園は労働力を失い荒廃した。代わって【11世紀】には、国衙から臨時雑役を免除された在庁官人や【大名田堵】らが【開発領主】として大規模経営を始める。しかし国司の徴税攻勢や開発領主間の抗争が起こったため→開発領主は【不輸・不入の権】などの保護を求め、土地を中央の貴族・寺社に名目上寄進して【領家】が発生し、自らは【荘官】（預所・下司・公文）として実質支配を確保した。領家はさらに権門勢家に寄進して【本家】が生まれ、実質的支配者は【本所】と呼ばれた。一方、公有地も国司や在庁官人により私有化が進んで【公領〔国衙領〕】が形成され、郡・郷・保に再編されて荘園と同じく年貢・公事・夫役が課された。こうして11世紀後半、荘と郡・郷・保が並立する【荘園公領制】が確立し、12世紀には【知行国】の制度も始まった。","keywords":["開発領主","大名田堵","在庁官人","領家","本家","本所","荘官","不輸の権","不入の権","官省符荘","国免荘","立券荘号","公領〔国衙領〕","荘園公領制","名主","知行国"],"blanks":[{"q":"11世紀、国衙から臨時雑役などを免除された在庁官人や大名田堵らが【　】として大規模な土地経営を始めた。","a":"開発領主","h":"国司の子孫・地方豪族・有力農民"},{"q":"開発領主が土地を中央の貴族・寺社に名目上寄進したことで、荘園領主【　】が発生した。","a":"領家","h":"寄進を受けた最初の荘園領主"},{"q":"領家がさらに権門勢家に寄進したことで、荘園領主【　】が発生した。","a":"本家","h":"皇族・摂関家・大寺社など"},{"q":"荘園領主（領家・本家）のうち、実質的支配者を【　】という。","a":"本所","h":"「実質的」がポイント"},{"q":"寄進した開発領主は、預所・下司・公文などの【　】として実質的な土地支配権を確保した。","a":"荘官","h":"現地の管理者"},{"q":"官物や臨時雑役を免除される特権を【　】の権といい、その手続きを立券荘号という。","a":"不輸","h":"10世紀後半〜"},{"q":"朝廷の太政官符・民部省符により不輸を認められた荘園を【　】という。","a":"官省符荘","h":"国免荘と対比"},{"q":"国司が派遣する検田使や追捕使の立ち入りを拒否する権利を【　】の権という。","a":"不入","h":"11世紀〜"},{"q":"荘園絵図で有名な神護寺領の荘園は紀伊国【　】である。","a":"桛田荘","h":"肥後国鹿子木荘と並ぶ代表例"},{"q":"国司は公領〔国衙領〕を郡・郷・【　】などの新たな単位に再編した。","a":"保","h":"もとは郡・郷（もとの里）"},{"q":"荘園・公領の田堵は耕作権に加え土地支配権も得て【　】へと成長した。","a":"名主","h":"作人や下人・所従に名田を耕作させた"},{"q":"12世紀、院や有力貴族が一国を支配し公領から収益を得る【　】の制度が始まった。","a":"知行国","h":"知行国主に任命される"}],"mc":[{"q":"初期荘園が荒廃した原因として最も適当なものはどれか。","c":["寄進地系荘園に不入の権が認められたため","国司が徴税請負人化し郡衙の機能が衰えて労働力を失ったため","知行国の制度が始まったため","延喜の荘園整理令で停止されたため"],"a":1,"e":"律令国家体制の崩壊により国司が徴税請負人化し、郡衙の機能が衰えたことで労働力を失い荒廃した。"},{"q":"開発領主が土地を中央の貴族・寺社に寄進した目的として正しいものはどれか。","c":["不輸・不入の権などの保護を得るため","国司に任命してもらうため","知行国主となるため","郡司に任命されるため"],"a":0,"e":"国司の徴税攻勢や抗争から土地を守るため、不輸・不入の権などの保護を求めて寄進した。"},{"q":"寄進地系荘園の構造について正しいものはどれか。","c":["本家がさらに領家に寄進した","寄進した開発領主は土地の支配権を失った","領家が権門勢家に寄進して本家が発生した","本所とは荘官のことである"],"a":2,"e":"開発領主→領家→本家の順に寄進。開発領主は荘官として実質支配を確保し、実質的支配者を本所という。"},{"q":"不輸の権と不入の権について正しいものはどれか。","c":["不輸の権は検田使の立ち入りを拒否する権利である","不入の権は10世紀後半、不輸の権は11世紀から広まった","国免荘は太政官符・民部省符で不輸を認められた","不入の権は国司が派遣する検田使・追捕使の立ち入りを拒否する権利である"],"a":3,"e":"不輸（10世紀後半〜）は官物・臨時雑役の免除、不入（11世紀〜）は検田使などの立ち入り拒否。官省符荘が太政官符・民部省符によるもの。"},{"q":"公領〔国衙領〕の変化について正しいものはどれか。","c":["郡・郷・保に再編され、荘園と同様に年貢・公事・夫役が徴収された","官物・臨時雑役の徴収が続いた","公領は私有化が禁止され公有地のままだった","郡・郷・里に再編された"],"a":0,"e":"国司・在庁官人による私有化が進み、郡・郷・保に再編、荘園と同様に年貢・公事・夫役を徴収した。"},{"q":"荘園の増加が国司にもたらした結果として正しいものはどれ 〔家人〕】・【滝口の武者】・【北面の武士】・【検非違使】などに活用した。一方935年、内紛から【平将門】が叔父国香を殺害し、939年「新皇」と自称して関東8カ国の大半を支配したが→940年【平貞盛】と【藤原秀郷】に鎮圧された。同じ頃、もと伊予掾の【藤原純友】も海賊と結び大宰府を落としたが→941年【源経基】と【小野好古】に鎮圧された。この【承平・天慶の乱】で中央の無力さと地方武士の実力が確認された。","keywords":["武士団","家子","郎党","棟梁","兵の家","桓武平氏","清和源氏","侍〔家人〕","滝口の武者","北面の武士","検非違使","押領使・追捕使","平将門の乱","藤原秀郷","藤原純友の乱","小野好古","承平・天慶の乱"],"blanks":[{"q":"地方豪族・有力農民は家子や郎党・下人・所従を率いて【　】を形成し、時には国司にも反抗した。","a":"小武士団","h":"大武士団の前段階"},{"q":"辺境に土着した軍事貴族は小武士団を統合・連合し大武士団を形成して【　】となった。","a":"棟梁","h":"大武士団の首長"},{"q":"9世紀末の平高望〔高望王〕を祖とする武士団は【　】である。","a":"桓武平氏","h":"平将門もこの一族"},{"q":"10世紀半ばの源経基〔経基王〕を祖とする武士団は【　】である。","a":"清和源氏","h":"清和天皇の孫が祖"},{"q":"皇族・貴族の警護にあたった武士を【　】〔家人〕という。","a":"侍","h":"「さぶらう」者"},{"q":"宇多天皇の時に設けられた朝廷の警護は【　】である。","a":"滝口の武者","h":"北面の武士は院の警護"},{"q":"白河上皇が設けた院の警護は【　】である。","a":"北面の武士","h":"西面の武士は後鳥羽上皇"},{"q":"中央の治安維持にあたったのは【　】である。","a":"検非違使","h":"地方は押領使・追捕使"},{"q":"939年、常陸・下野・上野の国府を攻め落として「新皇」と自称したのは【　】である。","a":"平将門","h":"下総国猿島が根拠地"},{"q":"平将門の乱は平貞盛と下野国押領使【　】により940年に鎮圧された。","a":"藤原秀郷","h":"俵藤太"},{"q":"もと伊予掾で、瀬戸内海の海賊と結び大宰府を攻め落としたのは【　】である。","a":"藤原純友","h":"伊予国日振島が根拠地"},{"q":"藤原純友の乱は【　】（清和源氏の祖）と追捕使小野好古により941年に鎮圧された。","a":"源経基","h":"経基王"}],"mc":[{"q":"9世紀後半以降、各地に武士が登場した背景として最も適当なものはどれか。","c":["律令制の動揺で治安が悪化し、国司の徴税攻勢も強まったため","朝廷が地方豪族に武装を命じたため","荘園公領制が確立したため","知行国主が武士を任命したため"],"a":0,"e":"律令制の動揺・崩壊で治安が悪化し、徴税請負人化した国司の圧迫もあって、地方豪族・有力農民が自衛のため武装した。"},{"q":"大武士団の形成について正しいものはどれか。","c":["有力農民が受領となって大武士団を率いた","軍事貴族が受領の任期後も辺境に土着し、小武士団を統合して棟梁となった","国司が郎党を率いて大武士団を形成した","中央の摂関家が直接大武士団を組織した"],"a":1,"e":"関東・東北などの辺境で軍事貴族〔兵の家〕が土着し、館を築いて小武士団を統合・連合した。"},{"q":"中央の皇族・貴族が地方武士を活用するようになった理由として正しいものはどれか。","c":["武士が荘園を寄進したため","武士が国司に任命されたため","死や血というケガレにつながる武芸を避けるようになったため","武士が検非違使を廃止したため"],"a":2,"e":"皇族・貴族は武芸をケガレとして避け、武士を侍〔家人〕や北面の武士などとして活用した。"},{"q":"武士の利用について正しい組み合わせはどれか。","c":["滝口の武者－白河上皇","北面の武士－宇多天皇","西面の武士－後鳥羽上皇","検非違使－地方の治安維持"],"a":2,"e":"滝口の武者は宇多天皇、北面の武士は白河上皇、西面の武士は後鳥羽上皇。検非違使は中央の治安維持。"},{"q":"平将門の乱の経過について正しいものはどれか。","c":["叔父の平貞盛を殺害して内紛に勝利した","伊予国を根拠地に「新皇」と自称した","征東大将軍藤原忠文が下向して鎮圧した","平貞盛と藤原秀郷により忠文の下向前に鎮圧された"],"a":3,"e":"将門は叔父国香を殺害、下総国猿島を根拠地とし、貞盛（国香の子）と秀郷（下野国押領使）が忠文の下向前に鎮圧した。"},{"q":"藤原純友の乱について正しいものはどれか。","c":["もと伊予掾で、瀬戸内海の海賊と結び大宰府を攻め落とした","関東8カ国の大半を支配した","藤原秀郷により鎮圧された","陸奥国を根拠地とした"],"a":0,"e":"純友は伊予国日振島を根拠に伊予・讃岐の国府を襲い大宰府を攻め落とし、源経基・小野好古に鎮圧された。"},{"q":"承平・天慶の乱の結果・意義として最も適当なものはどれか。","c":["中央政府の軍事力の強さが証明された","中央の無力さが露呈し、地方武士の実力が確認された","荘園が全て停止された","清和源氏が東国に進出した"],"a":1,"e":"2つの乱を通じて中央の無力さが露呈し、地方武士の実力を確認する契機となった。源氏の東国進出は後の平忠常の乱が契機。"},{"q":"平将門と藤原純友の共通点として正しいものはどれか。","c":["ともに清和源氏の一族であった","ともに陸奥国を根拠地とした","ともに京での官人生活を経験していた","ともに源経基に鎮圧された"],"a":2,"e":"将門は京から関東に戻り、純友はもと伊予国の国司。ともに京での官人生活を経験していた。"}],"order":[{"title":"武士団の形成","items":["律令制の動揺による治安悪化","地方豪族・有力農民の武装","小武士団の形成","軍事貴族の土着","大武士団の形成と棟梁"],"e":"治安悪化→自衛のため武装→小武士団→辺境に土着した軍事貴族が小武士団を統合して大武士団の棟梁となった。"},{"title":"平将門の乱","items":["平良将の遺領をめぐる内紛","叔父国香の殺害","国府を攻め落とし「新皇」と自称","平貞盛・藤原秀郷による鎮圧"],"e":"935年の内紛→939年に反乱→940年に鎮圧。"},{"title":"承平・天慶の乱の流れ","items":["桓武平氏一族の内紛（935年〜）","平将門・藤原純友の反乱（939年〜）","平将門の乱の平定（940年）","藤原純友の乱の平定（941年）"],"e":"935年の内紛に始まり、939年に東西で反乱、将門は940年、純友は941年に平定された。"}]},{"title":"清和源氏の台頭と奥州藤原氏の成立","flow":[{"y":"941","t":"源経基","s":"清和天皇の孫。追捕使小野好古とともに藤原純友の乱を鎮圧","why":""},{"y":"969","t":"源満仲と安和の変","s":"経基の子。摂関家の源高明排斥に協力して接近。藤原兼家の侍となり摂津国多田荘に土着","why":"摂関家と結んで台頭するため"},{"y":"","t":"源頼光","s":"満仲の子。藤原道長の侍として勢力を伸長し、摂津源氏の棟梁として国司を歴任し富裕を誇る","why":""},{"y":"1028","t":"平忠常の乱","s":"上総国で発生し房総半島に広がる。甲斐守源頼信（満仲の子）が戦わずして平定し、のち河内源氏の祖に","why":""},{"y":"","t":"源氏の東国進出","s":"平忠常の乱を契機に東国の源平勢力が交代した","why":"頼信が平忠常の乱を平定したため"},{"y":"1051","t":"前九年合戦","s":"陸奥守・鎮守府将軍源頼義が子の義家とともに陸奥国の安倍頼時・貞任らの反乱を平定。苦戦のため出羽の清原武則の協力をあおぐ","why":""},{"y":"1083","t":"後三年合戦","s":"陸奥守・鎮守府将軍源義家〔八幡太郎〕が出羽国の清原氏の内紛に介入し、藤原（清原）清衡を助け清原家衡を鎮圧","why":""},{"y":"","t":"義家が東国武士団の棟梁に","s":"2度の合戦を通じ荘園の寄進が集中。寄進は禁止されるが、白河上皇から院の昇殿を許可される","why":"その勢力を無視できなくなったため"},{"y":"","t":"奥州藤原氏の繁栄","s":"義家の帰京後、清衡・基衡・秀衡の3代約100年、奥六郡の平泉（柳の御所）を中心に覇権を確立。金・良馬と北方貿易の財力で平泉文化を創出","why":"源義家が陸奥守の任期を終え帰京したため"},{"y":"","t":"平泉の建築","s":"清衡が中尊寺金色堂、基衡が毛越寺、秀衡が無量光院を建立。秀衡は鎮守府将軍となり「北の王者」と呼ばれた","why":""}],"story":"清和源氏は【摂関家】と結んで台頭した。祖の【源経基】が藤原純友の乱を鎮圧し、子の【源満仲】は969年の【安和の変】で摂関家の源高明排斥に協力したため→摂関家の侍として勢力を持ち摂津国多田荘に土着した。満仲の子【源頼信】は1028年の【平忠常の乱】を戦わずして平定し、これを契機に東国の源平勢力が交代して→清和源氏（河内源氏）が東国へ進出した。頼信の子【源頼義】は【前九年合戦】（1051〜62年、陸奥国の安倍氏の反乱）を清原武則の協力で平定し、頼義の子【源義家】は【後三年合戦】（1083〜87年、出羽国の清原氏の内紛）で藤原清衡を助けて平定した。2度の合戦で義家は東国武士団の棟梁となり荘園の寄進が集中したため→【白河上皇】も院の昇殿を許した。一方、義家が帰京したため→東北では【藤原清衡】ら3代が【平泉】に約100年君臨し、金・良馬と北方貿易の財力で【平泉文化】を創出した。","keywords":["源経基","源満仲","安和の変","源頼光","源頼信","平忠常の乱","河内源氏","源頼義","前九年合戦","安倍頼時・貞任","清原武則","源義家","後三年合戦","奥州藤原氏","平泉","中尊寺金色堂","毛越寺","無量光院"],"blanks":[{"q":"経基の子で、969年の安和の変で摂関家の源高明排斥に協力し、摂津国多田荘に土着したのは【　】である。","a":"源満仲","h":"藤原兼家の侍"},{"q":"満仲の子で藤原道長の侍として摂津源氏の棟梁となり、大江山の酒呑童子退治の伝説でも有名なのは【　】である。","a":"源頼光","h":"頼信の兄"},{"q":"源頼信が甲斐守の時に戦わずして平定した、上総国で起きた乱を【　】という。","a":"平忠常の乱","h":"1028〜31年"},{"q":"平忠常の乱を平定し、のち河内守として畿内に土着して【　】の祖となったのは源頼信である。","a":"河内源氏","h":"摂津源氏と対比"},{"q":"源頼義が陸奥守・鎮守府将軍として子の義家とともに平定した、陸奥国の安倍氏の反乱を【　】という。","a":"前九年合戦","h":"1051〜62年"},{"q":"前九年合戦で苦戦した源頼義が協力をあおいだ出羽国の有力豪族は【　】である。","a":"清原武則","h":"出羽国"},{"q":"〔八幡太郎〕と呼ばれ、後三年合戦を平定した河内源氏の棟梁は【　】である。","a":"源義家","h":"頼義の子"},{"q":"源義家が清原氏の内紛に介入し、藤原清衡を助けて清原家衡を鎮圧した出羽国の合戦を【　】という。","a":"後三年合戦","h":"1083〜87年"},{"q":"義家に荘園の寄進が集中し、その勢力を無視できなくなった【　】は院の昇殿を許可した。","a":"白河上皇","h":"北面の武士を設置した上皇"},{"q":"奥州藤原氏は奥六郡の【　】（陸奥国）にある柳の御所を中心に覇権を確立した。","a":"平泉","h":"岩手県"},{"q":"奥州藤原氏の初代藤原【　】は中尊寺金色堂を建立した。","a":"清衡","h":"もと清原清衡"},{"q":"無量光院を建立し、鎮守府将軍に就任して「北の王者」と呼ばれたのは藤原【　】である。","a":"秀衡","h":"3代目"}],"mc":[{"q":"清和源氏が台頭した背景として最も適当なものはどれか。","c":["安和の変で摂関家に協力し、その侍となったため","承平・天慶の乱で朝廷に反乱したため","院と結んで北面の武士となったため","奥州藤原氏と同盟したため"],"a":0,"e":"源満仲が安和の変（969年）で源高明排斥に協力して摂関家に接近し、清和源氏は摂関家の侍として台頭した。"},{"q":"平忠常の乱の結果として正しいものはどれか。","c":["桓武平氏が東国の支配を固めた","清和源氏の東国進出の契機となり、東国の源平勢力が交代した","奥州藤原氏が成立した","源満仲が摂津国に土着した"],"a":1,"e":"源頼信が戦わずして平定し、清和源氏の東国進出の契機となって東国における源平勢力が交代した。"},{"q":"前九年合戦について正しいものはどれか。","c":["出羽国の清原氏の内紛を平定した","源義家が単独で平定した","陸奥国の安倍氏の反乱を源頼義が清原武則の協力を得て平定した","藤原清衡を助けて清原家衡を鎮圧した"],"a":2,"e":"前九年合戦（1051〜62年、陸奥国）は安倍頼時・貞任らの反乱。頼義は苦戦し出羽の清原武則の協力をあおいだ。"},{"q":"後三年合戦について正しいものはどれか。","c":["陸奥国の安倍氏の反乱である","源頼義が鎮守府将軍として平定した","清原武則の協力で安倍貞任を破った","出羽国の清原氏の内紛に源義家が介入し、清衡を助けた"],"a":3,"e":"後三年合戦（1083〜87年、出羽国）は清原氏の内紛。義家が藤原（清原）清衡を助け清原家衡を鎮圧した。"},{"q":"前九年・後三年合戦の影響として正しいものはどれか。","c":["源義家が摂関家の侍となった","源義家が東国武士団の棟梁となり荘園の寄進が集中した","清和源氏が東国から撤退した","安倍氏が奥州の覇者となった"],"a":1,"e":"2度の合戦を通じ義家が東国武士団の棟梁となり荘園の寄進が集中。白河上皇から院の昇殿を許された。"},{"q":"奥州藤原氏が東北の覇者となった背景として正しいものはどれか。","c":["源義家が陸奥守の任期を終えて帰京したため","前九年合戦で安倍氏を破ったため","源頼義が平泉に土着したため","白河上皇が知行国主に任命したため"],"a":0,"e":"後三年合戦で義家に助けられた清衡は、義家が任期を終えて帰京したことで東北の覇者となった。"},{"q":"奥州藤原氏の繁栄の経済的背景として正しいものはどれか。","c":["日宋貿易の利益","金・良馬の産出と大陸を含む北方貿易","畿内の荘園からの年貢","知行国からの収入"],"a":1,"e":"金・良馬の産出と北方貿易による財力を背景に京文化を移植し、平泉文化を創出した。"},{"q":"奥州藤原氏3代と建立した寺院の組み合わせとして正しいものはどれか。","c":["清衡－毛越寺","基衡－無量光院","秀衡－中尊寺金色堂","基衡－毛越寺"],"a":3,"e":"清衡が中尊寺金色堂、基衡が毛越寺（浄土庭園の遺構）、秀衡が無量光院。"}],"order":[{"title":"清和源氏の系譜","items":["源経基","源満仲","源頼信","源頼義","源義家"],"e":"経基（純友の乱鎮圧）→満仲（安和の変）→頼信（平忠常の乱）→頼義（前九年）→義家（後三年）。"},{"title":"源氏の東国進出","items":["安和の変","平忠常の乱","前九年合戦","後三年合戦"],"e":"969年安和の変で摂関家に接近→1028年平忠常の乱で東国進出→1051年前九年合戦→1083年後三年合戦。"},{"title":"奥州藤原氏","items":["後三年合戦","藤原清衡の中尊寺金色堂","藤原基衡の毛越寺","藤原秀衡の無量光院"],"e":"後三年合戦以後、清衡→基衡→秀衡の3代が平泉に君臨し、それぞれ中尊寺金色堂・毛越寺・無量光院を建てた。"}]}],"review":[{"q":"荘園公領制の下で「あらゆる土地に管理者として地方武士が入った」ことと、武士団の形成との関係として最も適当なものはどれか。","c":["武士が荘園を全て公領に戻したため","律令制の崩壊で治安が悪化し武装した地方豪族・有力農民が、荘・郡・郷・保の管理者となったため","朝廷が武士に荘園の寄進を禁止したため","知行国主が武士を国司に任命したため"],"a":1,"e":"治安悪化で武装した地方豪族・有力農民（開発領主）が、荘園公領制の下で荘官や郡司・郷司・保司として土地を管理した。"},{"q":"開発領主が寄進を行った原因と、武士団が形成された原因に共通するものはどれか。","c":["徴税請負人化した国司の圧迫・徴税攻勢","院の昇殿を許されたこと","知行国の制度の開始","承平・天慶の乱の敗北"],"a":0,"e":"徴税請負人化した国司の圧迫が、寄進による保護要求（領家の発生）と自衛のための武装（武士団）の共通の背景。"},{"q":"承平・天慶の乱と清和源氏の台頭の関係として正しいものはどれか。","c":["源満仲が平将門の乱を鎮圧して摂関家に接近した","藤原純友の乱を鎮圧した源経基が清和源氏の祖となり、子の満仲が安和の変で摂関家と結んだ","承平・天慶の乱で源氏が東国に進出した","源頼信が藤原純友の乱を鎮圧した"],"a":1,"e":"純友の乱鎮圧（941年）の経基が祖。満仲が安和の変（969年）で摂関家に協力し台頭。東国進出は平忠常の乱が契機。"},{"q":"10世紀から12世紀の武士の動向を時系列で正しく並べたものはどれか。","c":["平忠常の乱→承平・天慶の乱→前九年合戦→後三年合戦","承平・天慶の乱→前九年合戦→平忠常の乱→後三年合戦","承平・天慶の乱→平忠常の乱→前九年合戦→後三年合戦","前九年合戦→承平・天慶の乱→平忠常の乱→後三年合戦"],"a":2,"e":"承平・天慶の乱（935〜41年）→平忠常の乱（1028〜31年）→前九年合戦（1051〜62年）→後三年合戦（1083〜87年）。"},{"q":"源義家に荘園の寄進が集中した背景と、その後の朝廷の対応として正しいものはどれか。","c":["前九年・後三年合戦で東国武士団の棟梁となったため寄進が集中し、寄進は禁止されたが白河上皇は院の昇殿を許した","平忠常の乱の平定で摂関家の侍となり、藤原道長が荘園を与えた","安和の変で摂関家に協力したため寄進が集中し、摂津国に土着した","奥州藤原氏から荘園を寄進され、鎮守府将軍となった"],"a":0,"e":"2度の合戦で義家が東国武士団の棟梁となって寄進が集中。寄進は禁止されたが、その勢力を無視できない白河上皇は院の昇殿を許可した。"},{"q":"奥州藤原氏が成立・繁栄した流れとして正しいものはどれか。","c":["前九年合戦で安倍氏を破った清原氏が平泉に移り奥州藤原氏となった","後三年合戦で源義家に助けられた清衡が、義家の帰京後に金・良馬と北方貿易の財力で平泉に君臨した","源頼義が陸奥守として平泉に土着し奥州藤原氏の祖となった","藤原秀衡が後三年合戦を平定して初代となった"],"a":1,"e":"後三年合戦で義家が藤原（清原）清衡を助け、義家の帰京後、清衡・基衡・秀衡の3代が平泉を中心に約100年君臨した。"}]},{"id":6,"title":"院政と平氏政権","era":"平安時代末期","span":"1068〜1180","oneLine":"摂関家に頼らぬ天皇が院政を開き、院と結んだ平氏が武家政権を築いた","chain":["後三条天皇","白河上皇","鳥羽上皇","後白河上皇","平清盛","安徳天皇"],"parts":[{"title":"摂関政治の終焉と院政の開始","flow":[{"y":"1068","t":"後三条天皇の即位","s":"摂関家を外戚としない立場で34歳の時にようやく即位し、摂関政治は終焉した","why":"摂関家と外戚関係にないため、摂関家にとらわれない親政が可能だった"},{"y":"","t":"後三条天皇の親政","s":"大江匡房らを登用して親政を行い、早期に白河天皇に譲位して皇統を摂関家から独立させた","why":"摂関家にとらわれない人材で政治を進めるため"},{"y":"1069","t":"延久の荘園整理令","s":"国司任せにせず朝廷で厳正に採決。1045年以降の新立荘園や券契不明の荘園を停止した","why":"摂関家の荘園も例外視せず天皇権威を回復するため"},{"y":"1069","t":"記録荘園券契所の設置","s":"記録所で荘園の証拠書類を審査。皇室に荘園の寄進が集中し、公領が回復して国司が台頭した","why":"朝廷公認の荘園を確定し荘園公領制の発展を促した"},{"y":"","t":"宣旨枡・一国平均役","s":"宣旨枡を制定し、荘園・公領の別なく全ての土地に一律に賦課する一国平均役を導入した","why":"財政の再建をはかり、臨時の支出に備えるため"},{"y":"1086","t":"院政の開始","s":"白河天皇が8歳の堀河天皇に譲位し、上皇として院庁で政治の実権を掌握した","why":"亡き父後三条天皇にならい、天皇を後見して専制政治を行うため"},{"y":"","t":"北面の武士の設置","s":"白河上皇が院の武力として設置し、平氏や源氏などの地方武士を登用した","why":"台頭する地方武士の力に目をつけて登用するため"},{"y":"","t":"白河・鳥羽・後白河の院政","s":"白河（堀河・鳥羽・崇徳）、鳥羽（崇徳・近衛・後白河）、後白河（二条〜後鳥羽）の3上皇が約100年間院政を展開した","why":""},{"y":"","t":"院の経済基盤","s":"知行国（院分国）からの収入と、八条院領・長講堂領などの荘園からの収入が主たる収入となった","why":"荘園公領制の下で権門勢家が知行国主となる制度が整ったため"}],"story":"【後三条天皇】は摂関家を外戚としない立場で即位したため、【大江匡房】らを登用した親政を展開できた。天皇権威を回復するため→1069年に【延久の荘園整理令】を出し、【記録荘園券契所】で摂関家の荘園も例外なく審査した。その結果→皇室に荘園の寄進が集中し、公領が回復して国司が台頭し、【荘園公領制】の発展が促された。さらに【宣旨枡】の制定と【一国平均役】の導入で財政再建をはかった。父にならい親政を行っていた【白河天皇】は、1086年に8歳の【堀河天皇】に譲位→上皇として【院庁】で実権を握る【院政】を開始した。院はもと天皇だが摂関家は外戚にすぎなかったため→院が権力を握れた。院庁には受領層などの【院近臣】が出入りし、【院庁下文】・【院宣】が国政に効力を持ち、武力として【北面の武士】が置かれた。経済は【知行国】と荘園が支え、白河・鳥羽・後白河の3代約100年を院政期という。","keywords":["後三条天皇","大江匡房","延久の荘園整理令","記録荘園券契所","宣旨枡","一国平均役","荘園公領制","白河上皇","堀河天皇","院庁","治天の君","院近臣","院宣","北面の武士","知行国","長講堂領"],"blanks":[{"q":"摂関家を外戚としない立場で1068年に即位し、親政を行った天皇は【　】である。","a":"後三条天皇","h":"大江匡房らを登用した"},{"q":"1069年、後三条天皇は【　】の荘園整理令を出し、朝廷で厳正に荘園を審査した。","a":"延久","h":"1045年（寛徳の荘園整理令）以降の新立荘園を停止"},{"q":"1069年、荘園の証拠書類を審査するため【　】（記録所）が設置された。","a":"記録荘園券契所","h":"摂関家の荘園も見逃さなかった"},{"q":"後三条天皇は荘園・公領の別なく全ての土地に一律に賦課する【　】を導入した。","a":"一国平均役","h":"財政の再建や臨時の支出に備えた"},{"q":"後三条天皇が制定した公定の枡を【　】という。","a":"宣旨枡","h":"皇室領荘園以外ではさまざまな枡が用いられた"},{"q":"1086年、【　】天皇が8歳の堀河天皇に譲位し、上皇として院政を開始した。","a":"白河","h":"父の後三条天皇にならい親政を行っていた"},{"q":"院政を行う皇室の家長たる上皇を「【　】」と呼ぶ。","a":"治天の君","h":"天皇を後見し院庁で実権を掌握"},{"q":"崇徳・近衛・後白河天皇の3代にわたり院政を展開したのは【　】上皇である。","a":"鳥羽","h":"白河上皇の次の院"},{"q":"院庁に常時出入りした受領層の中・下級貴族や后妃・乳母の一族などを【　】という。","a":"院近臣","h":"上皇のお気に入りの人々"},{"q":"院の命令を伝える文書を【　】という。","a":"院宣","h":"院庁下文とともに国政に効力を持った"},{"q":"白河上皇が院の武力として設置し、平氏や源氏を登用したのは【　】である。","a":"北面の武士","h":"鎌倉時代には後鳥羽上皇が西面の武士を追加"},{"q":"権門勢家を知行国主とし、国司推薦権と公領からの税収の大半を与える制度を【　】の制度という。","a":"知行国","h":"院や女院のものは院分国という"}],"mc":[{"q":"後三条天皇が親政を展開できた背景として最も適当なものはどれか。","c":["摂関家と外戚関係になかったため","藤原頼通が関白を辞任したため","北面の武士を設置したため","皇統が摂関家に取り込まれたため"],"a":0,"e":"後三条天皇は摂関家を外戚としない立場で即位したため、摂関家にとらわれない親政が可能だった。"},{"q":"延久の荘園整理令の内容として正しいものはどれか。","c":["国司に一任して荘園を審査させた","1045年以降の新立荘園を停止し、券契不明のものも停止した","摂関家の荘園は全て例外とした","全ての荘園を停止し公地公民制に戻した"],"a":1,"e":"記録荘園券契所で朝廷が厳正に採決し、1045年以降の新立荘園と券契不明の荘園を停止した。"},{"q":"記録荘園券契所の設置がもたらした結果として正しいものはどれか。","c":["摂関家に荘園の寄進が集中した","公領が縮小し国司が没落した","朝廷公認の荘園が確定し荘園公領制の発展が促された","荘園が全廃された"],"a":2,"e":"朝廷公認の荘園が確定して荘園公領制が発展し、公領が回復して国司が台頭、皇室に寄進が集中した。"},{"q":"白河上皇が院政を開始した経緯として正しいものはどれか。","c":["摂関家に強制されて譲位した","後三条天皇の死により即位した","堀河天皇に廃位された","幼い堀河天皇に譲位し、上皇として天皇を後見した"],"a":3,"e":"1086年、白河天皇は8歳の堀河天皇に譲位し、上皇として院庁で政治の実権を握った。"},{"q":"院が摂関家より強い権力を握れた理由として最も適当なものはどれか。","c":["院が武士を全て家人化したため","院はもと天皇であり、摂関家は外戚にすぎなかったため","摂関家が荘園を全て失ったため","院が延暦寺の僧兵を率いたため"],"a":1,"e":"院はもと天皇で皇室の家長だが、摂関家は外戚にすぎなかったため、院が権力を握れた。"},{"q":"院政期の摂関家について正しいものはどれか。","c":["院と対立して完全に没落した","外戚であるかどうかに関係なく摂政・関白を父子間で継承する家として確立した","摂政・関白の地位が廃止された","院近臣として受領層に転落した"],"a":1,"e":"摂関家は院と結びつくことで衰退を取り戻そうとし、外戚の有無に関係なく摂関を継承する家となった。"},{"q":"院の経済基盤について正しいものはどれか。","c":["知行国と荘園からの収入が主で、鳥羽上皇の八条院領などが有名","租・調・庸による人頭税収入","日宋貿易の収益のみ","摂関家の殿下渡領を没収した収入"],"a":0,"e":"院政期には荘園公領制の下で知行国（院分国）と荘園が主たる収入となり、八条院領・長講堂領が有名。"},{"q":"白河上皇が北面の武士を設置した目的として最も適当なものはどれか。","c":["蝦夷を征討するため","遣唐使を護衛するため","台頭する地方武士を登用し院の武力とするため","摂関家の政所を警備するため"],"a":2,"e":"白河上皇は台頭する地方武士の力に目をつけ、平氏や源氏を北面の武士として登用した。"}],"order":[{"title":"後三条天皇から院政開始までの流れ","items":["後三条天皇の即位","延久の荘園整理令","白河天皇への譲位","院政の開始"],"e":"1068年即位→1069年延久の荘園整理令・記録所設置→早期に白河天皇へ譲位→1086年白河上皇の院政開始。"},{"title":"院政を行った上皇の順","items":["白河上皇","鳥羽上皇","後白河上皇","後鳥羽上皇"],"e":"白河→鳥羽→後白河の3代約100年が院政期。鎌倉時代の後鳥羽上皇は西面の武士を追加した。"},{"title":"白河上皇の院政下の天皇の順","items":["堀河天皇","鳥羽天皇","崇徳天皇"],"e":"白河上皇は堀河・鳥羽・崇徳の3代にわたり院政を展開した。"}]},{"title":"院の仏教保護と桓武平氏の台頭","flow":[{"y":"","t":"3上皇の出家","s":"白河・鳥羽・後白河の3上皇は出家して法皇となった","why":"仏教の振興により末法を克服し、鎮護国家と五穀豊穣を実現するため"},{"y":"","t":"六勝寺の建立","s":"法勝寺（白河天皇）・尊勝寺（堀河）・最勝寺（鳥羽）・円勝寺（待賢門院）・成勝寺（崇徳）・延勝寺（近衛）を白河殿周辺に建立","why":"造寺造仏で仏教を振興するため"},{"y":"","t":"高野詣・熊野詣","s":"3上皇は高野山金剛峯寺への高野詣、熊野三社への熊野詣を何度も行った","why":""},{"y":"","t":"財政難と政治の腐敗","s":"造寺造仏・寺社参詣・離宮造営が重なり財政難を招き、成功・重任など売位・売官が流行した","why":"3上皇が仏教保護に執心しすぎたため"},{"y":"","t":"僧兵の横暴","s":"興福寺（奈良法師）は春日神社の神木、延暦寺（山法師）は日吉神社の神輿を担いで強訴した","why":"国司や武士に対する民衆の不満をくみ取ったことが寺社勢力発展の原動力"},{"y":"","t":"武士の登用","s":"上皇・天皇・貴族の大寺院に対する無力さが露呈し、武士による僧兵の鎮圧が地方武士の中央進出を招いた","why":"皇族や貴族は大寺社との関係が深く、武士なしでは僧兵を抑えきれなかったため"},{"y":"1107","t":"平正盛が源義親の乱を鎮圧","s":"白河上皇の北面の武士となった伊勢平氏の平正盛が、河内源氏の源義親の反乱を出雲国で鎮圧した","why":"院と結んで中央に進出するため"},{"y":"","t":"平忠盛の活躍","s":"鳥羽上皇の院近臣として瀬戸内海の海賊を平定、国司を歴任して西国武士を家人化し日宋貿易に参入、貴族の仲間入りを果たした","why":""},{"y":"1167","t":"平清盛の太政大臣就任","s":"保元・平治の乱に連勝し、後白河上皇の院近臣として太政大臣にまで出世した","why":"武力に加え外戚政策や日宋貿易により力を握ったため"}],"story":"白河・鳥羽・後白河の3上皇は出家して【法皇】となり、末法を克服するため→【六勝寺】の建立や【高野詣】・【熊野詣】を繰り返した。しかし造寺造仏や離宮造営が重なり財政難を招いた→【成功】・重任など売位・売官が流行し政治が腐敗した。一方で【僧兵】の横暴が増大し、【興福寺】の奈良法師は春日神社の神木を、【延暦寺】の山法師は日吉神社の神輿を担いで強訴した。皇族・貴族は僧兵に無力だったため→武士による僧兵の鎮圧が地方武士の中央進出を招いた。摂関家と結んだ清和源氏に対し、院と結んで台頭したのが【桓武平氏】である。【平正盛】は白河上皇の北面の武士となり源義親の乱を鎮圧→子の【平忠盛】は鳥羽上皇の院近臣として海賊を平定し【日宋貿易】に参入→孫の【平清盛】は保元・平治の乱に連勝し、1167年に太政大臣となった。","keywords":["法皇","六勝寺","法勝寺","熊野詣","高野詣","成功","僧兵","強訴","興福寺","延暦寺","園城寺","天下三不如意","平正盛","源義親","平忠盛","平清盛"],"blanks":[{"q":"白河・鳥羽・後白河の3上皇は出家して【　】となった。","a":"法皇","h":"末法を克服するため仏教を振興した"},{"q":"皇室が平安京外の白河殿周辺に建立した法勝寺など6つの大寺院を【　】という。","a":"六勝寺","h":"法勝・尊勝・最勝・円勝・成勝・延勝"},{"q":"六勝寺のうち、白河天皇が建立したのは【　】である。","a":"法勝寺","h":"六勝寺の最初"},{"q":"3上皇が何度も行った、熊野三社（本宮・新宮・那智）への参詣を【　】という。","a":"熊野詣","h":"紀伊国"},{"q":"院の仏教保護による財政難のなか、【　】・重任など売位・売官が流行して政治が腐敗した。","a":"成功","h":"私財を献じて官職を得ること"},{"q":"『源平盛衰記』によれば、白河法皇は賀茂川の水・双六のサイ・【　】を天下三不如意とした。","a":"山法師","h":"延暦寺の僧兵"},{"q":"興福寺の僧兵は奈良法師と呼ばれ、【　】神社の神木を掲げて強訴を行った。","a":"春日","h":"南都＝奈良"},{"q":"延暦寺の僧兵は山法師と呼ばれ、【　】神社の神輿を担いで強訴を行った。","a":"日吉","h":"北嶺＝比叡山"},{"q":"園城寺（三井寺）の僧兵は【　】と呼ばれ、しばしば延暦寺の山法師と争った。","a":"寺法師","h":"寺門派（円珍派）"},{"q":"伊勢平氏の【　】は白河上皇の北面の武士となり、源義親の反乱を出雲国で鎮圧した。","a":"平正盛","h":"1107〜08年"},{"q":"【　】は鳥羽上皇の院近臣として瀬戸内海の海賊を平定し、日宋貿易にも参入した。","a":"平忠盛","h":"正盛の子、清盛の父"},{"q":"摂関家と結び台頭した清和源氏に対し、【　】と結び台頭したのが桓武平氏である。","a":"院","h":"北面の武士として登用された"}],"mc":[{"q":"院の仏教保護が政治の腐敗を招いた理由として最も適当なものはどれか。","c":["僧兵が院庁を占拠したため","造寺造仏・寺社参詣・離宮造営で財政難となり売位・売官が流行したため","仏教勢力が政治に介入し遷都を強いたため","摂関家が寺社を没収したため"],"a":1,"e":"3上皇の造寺造仏や参詣、離宮造営が重なって財政難を招き、成功・重任が流行して政治が腐敗した。"},{"q":"六勝寺の一つで、白河天皇が建立した寺院はどれか。","c":["最勝寺","尊勝寺","成勝寺","法勝寺"],"a":3,"e":"法勝寺は白河天皇、尊勝寺は堀河天皇、最勝寺は鳥羽天皇、成勝寺は崇徳天皇が建立した。"},{"q":"興福寺の僧兵の強訴について正しいものはどれか。","c":["奈良法師と呼ばれ、春日神社の神木を掲げた","山法師と呼ばれ、日吉神社の神輿を担いだ","寺法師と呼ばれ、園城寺と争った","北嶺と呼ばれ、比叡山に拠った"],"a":0,"e":"興福寺（南都）は奈良法師で春日神社の神木、延暦寺（北嶺）は山法師で日吉神社の神輿。"},{"q":"僧兵の横暴がもたらした結果として最も適当なものはどれか。","c":["寺社勢力が衰退し院が仏教保護をやめた","上皇が僧兵を北面の武士に編入した","皇族・貴族の無力さが露呈し、武士による鎮圧が地方武士の中央進出を招いた","延暦寺と興福寺が合併した"],"a":2,"e":"皇族・貴族は大寺社との関係が深く僧兵を抑えきれず、武士に鎮圧させたことが武士の中央政界進出を招いた。"},{"q":"桓武平氏が台頭した経緯として正しいものはどれか。","c":["摂関家と結び侍として勢力を伸ばした","院と結び北面の武士として中央に進出した","奥州藤原氏と結び平泉を拠点とした","東国に土着し新皇を称した"],"a":1,"e":"清和源氏が摂関家と結んだのに対し、桓武平氏は院と結び、平正盛が白河上皇の北面の武士となって中央に進出した。"},{"q":"平正盛が出雲国で鎮圧した河内源氏の棟梁はだれか。","c":["源為義","源義朝","源義家","源義親"],"a":3,"e":"源義家（八幡太郎）の子で河内源氏の棟梁だった源義親の反乱を、平正盛が1107〜08年に鎮圧した。"},{"q":"平忠盛について正しいものはどれか。","c":["白河上皇の院近臣として源義親を討った","保元の乱で崇徳上皇方について敗れた","鳥羽上皇の院近臣として海賊を平定し、日宋貿易に参入して貴族の仲間入りを果たした","太政大臣となり安徳天皇の外祖父となった"],"a":2,"e":"忠盛は鳥羽上皇の院近臣として瀬戸内海の海賊平定で活躍し、西国武士を家人化、日宋貿易に参入し、桓武平氏は「武家」となった。"},{"q":"清和源氏が院政期に衰退した背景として最も適当なものはどれか。","c":["一族内部の争いがあり、源義親の反乱が平氏に鎮圧されたため","日宋貿易に失敗したため","奥州藤原氏に滅ぼされたため","後三条天皇に荘園を没収されたため"],"a":0,"e":"清和源氏は一族内部の争いもあり衰退したが、義親の子の源為義は摂関家と結び少しずつ勢力を盛り返した。"}],"order":[{"title":"桓武平氏（伊勢平氏）の台頭","items":["平正盛","平忠盛","平清盛"],"e":"正盛（白河上皇の北面の武士）→忠盛（鳥羽上皇の院近臣）→清盛（後白河上皇の院近臣、太政大臣）。"},{"title":"院の仏教保護から武士の中央進出まで","items":["3上皇の出家と造寺造仏","財政難による政治の腐敗","僧兵の強訴の激化","武士による僧兵の鎮圧"],"e":"仏教保護の度が過ぎて財政難・腐敗を招き、僧兵の横暴に無力な皇族・貴族が武士を登用したことで武士が中央に進出した。"},{"title":"河内源氏の系譜","items":["源義家","源義親","源為義","源義朝"],"e":"義家（八幡太郎）→子の義親（平正盛に鎮圧）→義親の子の為義（摂関家と結ぶ）→為義の子の義朝（東国武士団を統率）。"}]},{"title":"平氏政権の確立","flow":[{"y":"1156","t":"保元の乱","s":"後白河天皇（弟・藤原忠通・平清盛・源義朝）が崇徳上皇（兄・藤原頼長・平忠正・源為義）を破った","why":"鳥羽上皇の死を契機に皇室・摂関家の内部対立が表面化したため"},{"y":"1156","t":"保元の乱の結果","s":"崇徳上皇は讃岐国へ配流、平忠正と源為義は斬首。2年後に後白河上皇が院政を開始","why":"京を舞台とした武士の初の合戦で、武力が中央政界の抗争に不可欠と判明した"},{"y":"1159","t":"平治の乱","s":"清盛の熊野詣の留守中に藤原信頼・源義朝が挙兵し信西を自殺に追い込んだが、帰京した清盛が源氏方を破った","why":"後白河上皇の院近臣の対立に源平二大棟梁の対立が絡んだため"},{"y":"1159","t":"平治の乱の結果","s":"藤原信頼は斬首、源義朝は謀殺、頼朝は伊豆国へ配流。翌年清盛は武士出身で初の公卿となった","why":"武力が政権争いの決定的要素と明白になり、武士の政治的地位が急速に高まった"},{"y":"1167","t":"清盛の太政大臣就任","s":"二条天皇の死後、後白河院政を武力で支え蓮華王院を造営した結果、武士として初の太政大臣に就任した","why":"後白河上皇への奉仕の見返り"},{"y":"","t":"西国武士の家人化","s":"西国武士団の多くを荘園・公領の地頭に任命し直接主従関係を結んだ","why":"伊勢平氏が瀬戸内海周辺の国司を歴任してきたため"},{"y":"","t":"外戚政策","s":"娘の平徳子（建礼門院）を高倉天皇の中宮とし、男児（のちの安徳天皇）の誕生で清盛は外祖父となった","why":"摂関家と同じく外戚として権力を握るため"},{"y":"","t":"日宋貿易の展開","s":"大宰府を掌握し、大輪田泊の修築・音戸の瀬戸の開削で宋船を直接畿内に入港させ、莫大な利益を得た","why":"1127年に宋が金に圧迫され南宋となってから貿易が盛んになっていた"},{"y":"1179","t":"平氏の全盛期","s":"全国の約半数の知行国、500カ所に及ぶ荘園、日宋貿易の収益が平氏政権を支えた","why":""}],"story":"1156年、【鳥羽上皇】の死を契機に皇室・摂関家の内部対立が表面化し→【保元の乱】が起こった。【後白河天皇】・藤原忠通・平清盛・源義朝の天皇方が、【崇徳上皇】・藤原頼長・平忠正・源為義の上皇方を破り、崇徳は讃岐へ配流された。武力が不可欠と判明したため→武士の中央進出が決定づけられた。1159年、後白河上皇の院近臣の対立に源平二大棟梁の対立が絡み→【平治の乱】が起こった。【藤原信頼】・源義朝は清盛の熊野詣中に挙兵し【信西】を自殺に追い込んだが、帰京した清盛に敗れ、義朝は謀殺、頼朝は伊豆へ配流された。連勝した清盛は後白河院政を武力で支え【蓮華王院】を造営した結果→1167年に武士初の【太政大臣】となった。平氏は西国武士を【地頭】に任命して家人化し、娘【平徳子】を高倉天皇の中宮として【安徳天皇】の外祖父となり、【大輪田泊】を修築して【日宋貿易】を独占した。貴族政権と武家政権の二面性を持つ政権だった。","keywords":["保元の乱","崇徳上皇","藤原頼長","藤原忠通","信西","平治の乱","藤原信頼","源義朝","源頼朝","太政大臣","蓮華王院","地頭","平徳子","安徳天皇","大輪田泊","音戸の瀬戸","厳島神社","日宋貿易","宋銭"],"blanks":[{"q":"1156年、鳥羽上皇の死を契機に皇室・摂関家の内部対立が表面化して【　】が起こった。","a":"保元の乱","h":"天皇方と上皇方に武士が組織された"},{"q":"保元の乱で後白河天皇と対立し、敗れて讃岐国へ配流された上皇は【　】である。","a":"崇徳上皇","h":"後白河天皇の兄"},{"q":"保元の乱で上皇方についた左大臣【　】は、兄の関白藤原忠通と対立していた。","a":"藤原頼長","h":"摂関家の弟"},{"q":"保元の乱で天皇方の実質的な采配者となった院近臣は【　】（藤原通憲）である。","a":"信西","h":"平治の乱で襲撃され自殺"},{"q":"慈円の『【　】』では、保元の乱以降「武者ノ世」になったと書かれている。","a":"愚管抄","h":"武士の中央進出を決定づけた"},{"q":"1159年、後白河上皇の院近臣の対立に源平の対立が絡んで【　】が起こった。","a":"平治の乱","h":"清盛の熊野詣の留守中に挙兵"},{"q":"平治の乱で源義朝とともに挙兵し、敗れて斬首された院近臣は【　】である。","a":"藤原信頼","h":"信西と対立した"},{"q":"平治の乱で敗れた源義朝の子【　】は、翌年に伊豆国へ配流された。","a":"源頼朝","h":"三男だが嫡男"},{"q":"1167年、平清盛は武士として初めて【　】に就任した。","a":"太政大臣","h":"六波羅殿とも呼ばれた"},{"q":"清盛は娘の【　】（建礼門院）を高倉天皇の中宮とし、安徳天皇の外祖父となった。","a":"平徳子","h":"外戚政策"},{"q":"清盛は摂津国の【　】を修築し、宋船を直接畿内に入港させた。","a":"大輪田泊","h":"現在の神戸市"},{"q":"平氏一族が崇拝した安芸国宮島の神社は【　】である。","a":"厳島神社","h":"平家納経が奉納された"}],"mc":[{"q":"保元の乱が起こった背景として最も適当なものはどれか。","c":["白河上皇の死により院政が中断したため","鳥羽上皇の死を契機に皇室・摂関家の内部対立が表面化したため","平清盛が後白河法皇を幽閉したため","源義朝が清盛と対立したため"],"a":1,"e":"鳥羽上皇（法皇）の死を契機に、崇徳上皇と後白河天皇、藤原頼長と忠通の対立が表面化した。"},{"q":"保元の乱の対立関係として正しいものはどれか。","c":["後白河天皇方に藤原頼長、崇徳上皇方に藤原忠通","後白河天皇方に源為義、崇徳上皇方に源義朝","後白河天皇方に平忠正、崇徳上皇方に平清盛","後白河天皇方に平清盛・源義朝、崇徳上皇方に平忠正・源為義"],"a":3,"e":"天皇方は忠通・清盛・義朝、上皇方は頼長・忠正（清盛の叔父）・為義（義朝の父）で、親子・叔父甥が分かれて戦った。"},{"q":"保元の乱の意義として最も適当なものはどれか。","c":["中央政界の抗争に武力が不可欠と判明し、武士の中央進出を決定づけた","摂関政治が復活した","院政が廃止された","平氏が滅亡した"],"a":0,"e":"京を舞台とした武士初の合戦で、皇族・貴族に衝撃を与え「武者ノ世」となった。"},{"q":"平治の乱が起こった原因として正しいものはどれか。","c":["崇徳上皇の復権運動","後白河上皇の院近臣の対立に源平二大棟梁の対立が絡んだこと","延暦寺僧兵の強訴","鹿ケ谷での平氏打倒計画"],"a":1,"e":"院近臣の信西と藤原信頼の対立に、平清盛と源義朝の対立が絡んで発生した。"},{"q":"平治の乱の結果として正しいものはどれか。","c":["源義朝が政権を握った","藤原信頼が関白となった","源氏方が敗北し、清盛が政権担当への足掛かりをつかんだ","後白河上皇が讃岐へ配流された"],"a":2,"e":"信頼は斬首、義朝は謀殺、頼朝は伊豆へ配流。清盛は翌年武士初の公卿となった。"},{"q":"平清盛が1167年に太政大臣となった背景として最も適当なものはどれか。","c":["摂関家の養子となったため","後白河院政を武力で支え、蓮華王院を造営するなど奉仕したため","安徳天皇を即位させたため","鳥羽上皇の院庁別当となったため"],"a":1,"e":"二条天皇の死後、後白河上皇の院政を武力で支えて奉仕した結果、武士として初の太政大臣に就任した。"},{"q":"平氏が西国武士の家人化に成功した理由として最も適当なものはどれか。","c":["瀬戸内海周辺の国司を歴任してきたため、地頭に任命して直接主従関係を結べた","東国に土着して館を築いたため","奥州藤原氏と同盟したため","北面の武士を全て指揮したため"],"a":0,"e":"伊勢平氏は西国の受領を歴任してきたため、西国武士団を荘園・公領の地頭に任命できた。"},{"q":"日宋貿易の輸入品として正しいものはどれか。","c":["硫黄","刀剣","宋銭","金"],"a":2,"e":"輸入品は宋銭・陶磁器・『太平御覧』などの書籍・絹織物。金・水銀・硫黄・刀剣・漆器などは輸出品。"}],"order":[{"title":"平清盛の栄達","items":["保元の乱","平治の乱","武士初の公卿","太政大臣就任"],"e":"1156年保元の乱→1159年平治の乱→翌1160年に武士出身で初の公卿→1167年太政大臣。"},{"title":"平治の乱の経過","items":["清盛が熊野詣に出発","藤原信頼・源義朝が挙兵し信西を自殺に追い込む","清盛が帰京し源平が戦闘","源義朝が謀殺され頼朝が伊豆へ配流"],"e":"清盛の留守中に信頼・義朝が挙兵→信西を襲撃→清盛が急ぎ帰京して源氏方を破る→義朝は謀殺、頼朝は翌年配流。"},{"title":"宋との関係の変化","items":["宋（北宋）の建国と商船の往来","宋が金に圧迫され南宋となる","平忠盛が日宋貿易に参入","平清盛が大輪田泊を修築"],"e":"11世紀後半から商船の往来が活発→1127年南宋となり貿易が盛んに→忠盛が参入→清盛が大輪田泊を修築し大規模に展開。"}]},{"title":"平氏政権の動揺と平安末期の文化","flow":[{"y":"","t":"平氏の強大化","s":"「此一門にあらざらむ人は皆人非人なるべし」（平時忠）の言葉に象徴されるように独裁傾向が強まった","why":""},{"y":"","t":"反平氏勢力の増大","s":"後白河法皇や他の院近臣との対立が激しくなり、皇族・摂関家・大寺社に加え地方武士の反感も強まった","why":"平氏の独裁傾向が強まったため"},{"y":"1177","t":"鹿ケ谷の陰謀","s":"院近臣の俊寛・西光・藤原成親らの平氏打倒計画が源行綱の密告で判明し厳罰が下されたが、後白河法皇の責任は問われなかった","why":"清盛の権力は後白河法皇の院近臣たることで確立されていたため"},{"y":"1179","t":"後白河法皇の幽閉","s":"平重盛の遺領を法皇が没収したことに清盛が激怒し、法皇を鳥羽殿に幽閉して院政を停止、関白以下多数の貴族の官職を奪った","why":"重盛の遺領没収への激怒"},{"y":"1180","t":"安徳天皇の即位","s":"政界の主導権を握った清盛は孫の安徳天皇を即位させ外戚の地位を手に入れ、平氏の軍事独裁政権（六波羅政権）が確立した","why":"外戚として権力を固めるため"},{"y":"","t":"反対勢力の結集","s":"急速な権力集中はかえって院・貴族・寺社・地方武士団など反対勢力の結集を促し、没落を早めた","why":"院政停止や孫の即位が平氏の敵を増やしたため"},{"y":"","t":"浄土教の地方普及","s":"寺院に所属しない聖・上人の布教と地方武士の台頭により、中尊寺金色堂・白水阿弥陀堂・三仏寺投入堂・富貴寺大堂などが建てられた","why":"中央の浄土教文化を地方武士が受け入れたため"},{"y":"","t":"絵巻物と装飾経","s":"源氏物語絵巻・伴大納言絵巻・信貴山縁起絵巻・鳥獣戯画・年中行事絵巻、扇面古写経・平家納経がつくられた","why":"絵と詞書を織り交ぜて時間の進行を表現した"},{"y":"","t":"文芸と芸能の庶民化","s":"『今昔物語集』、軍記物語『将門記』『陸奥話記』、歴史物語『大鏡』、後白河上皇の『梁塵秘抄』、田楽・猿楽が流行した","why":"古代から中世への転換期に貴族が歴史を振り返り、民間芸能を取り入れた"}],"story":"平氏の独裁傾向が強まり「平氏でなければ人ではない」と言われるほどになった→【後白河法皇】や他の院近臣との対立が激化し、皇族・摂関家・大寺社に加え地方武士の反感も強まった。1177年の【鹿ケ谷の陰謀】では俊寛・西光・【藤原成親】らの平氏打倒計画が源行綱の密告で判明したが、清盛の権力は法皇の院近臣たることで成り立っていたため→法皇の責任は問わなかった。しかし1179年、【平重盛】の遺領を法皇が没収したことに激怒した清盛は→法皇を【鳥羽殿】に幽閉して院政を停止した。1180年に孫の【安徳天皇】を即位させ「【六波羅政権】」が確立したが→急速な権力集中はかえって反対勢力の結集を促し没落を早めた。文化面では、聖・上人の布教と地方武士の台頭により→【中尊寺金色堂】など浄土教文化が地方に波及した。【絵巻物】や【平家納経】、『【今昔物語集】』、歴史物語『【大鏡】』、後白河上皇の『【梁塵秘抄】』、【田楽】・猿楽など庶民性の高い文化が栄えた。","keywords":["鹿ケ谷の陰謀","俊寛","藤原成親","源行綱","鳥羽殿","安徳天皇","六波羅政権","本地垂迹説","中尊寺金色堂","富貴寺大堂","源氏物語絵巻","伴大納言絵巻","鳥獣戯画","平家納経","今昔物語集","大鏡","梁塵秘抄","田楽"],"blanks":[{"q":"1177年、院近臣の俊寛・西光・藤原成親らの平氏打倒計画が発覚した事件を【　】という。","a":"鹿ケ谷の陰謀","h":"源行綱（多田行綱）の密告"},{"q":"1179年、平清盛は後白河法皇を【　】に幽閉し、院政を停止した。","a":"鳥羽殿","h":"重盛の遺領没収に激怒"},{"q":"1180年、清盛は孫の【　】を即位させ、外戚の地位を手に入れた。","a":"安徳天皇","h":"平徳子と高倉天皇の子"},{"q":"多数の荘園・知行国を持つ平氏の軍事独裁政権を、初の武家政権である「【　】」という。","a":"六波羅政権","h":"清盛の邸宅の場所"},{"q":"院政期には在俗出家した3法皇の主導で神仏習合が進み、【　】説が定着した。","a":"本地垂迹","h":"神は仏の仮の姿"},{"q":"奥州藤原氏の藤原清衡が陸奥国平泉に建てた阿弥陀堂は【　】である。","a":"中尊寺金色堂","h":"岩手県"},{"q":"豊後国にある九州最古の木造建築物は【　】である。","a":"富貴寺大堂","h":"大分県豊後高田"},{"q":"応天門の変の大納言伴善男を描いた絵巻物は【　】である。","a":"伴大納言絵巻","h":"絵巻物の一つ"},{"q":"平清盛が厳島神社に奉納した装飾経は【　】である。","a":"平家納経","h":"安芸国"},{"q":"日本・中国・インドの1000余りの説話を集めた院政期の説話集は『【　】』である。","a":"今昔物語集","h":"仏教説話・世俗説話"},{"q":"藤原氏全盛期を客観的に紀伝体で描いた「四鏡」の初めは『【　】』である。","a":"大鏡","h":"大鏡・今鏡・水鏡・増鏡"},{"q":"後白河上皇が民間の流行歌謡である今様を集めて編纂したのは『【　】』である。","a":"梁塵秘抄","h":"今様"}],"mc":[{"q":"鹿ケ谷の陰謀で平清盛が後白河法皇の責任を問わなかった理由として最も適当なものはどれか。","c":["法皇がすでに出家していたため","清盛の権力は後白河法皇の院近臣たることで確立されていたため","法皇が清盛の外祖父だったため","源行綱が法皇をかばったため"],"a":1,"e":"清盛の権力基盤は法皇の院近臣という立場にあったため、俊寛らには厳罰を下したが法皇の責任はあえて問わなかった。"},{"q":"1179年に清盛が後白河法皇を幽閉した直接の原因はどれか。","c":["法皇が源頼朝を赦免したため","法皇が鹿ケ谷で平氏打倒を命じたため","法皇が平重盛の遺領を没収したため","法皇が安徳天皇の即位を拒んだため"],"a":2,"e":"この年没した重盛の遺領を法皇が没収したことに清盛が激怒し、鳥羽殿に幽閉して院政を停止した。"},{"q":"平氏政権の確立がかえって没落を早めた理由として最も適当なものはどれか。","c":["日宋貿易が途絶えたため","院政停止や孫の即位など急速な権力集中が院・貴族・寺社・地方武士の結集を促したため","清盛が出家して政治から退いたため","摂関家が院政を復活させたため"],"a":1,"e":"平氏の軍事独裁政権の確立は、反対勢力の結集を促し没落を早める結果となった。"},{"q":"浄土教文化が地方に普及した背景として正しいものはどれか。","c":["寺院に所属しない聖・上人の布教と、それを受け入れる地方武士の台頭","延暦寺の僧兵が地方に派遣されたこと","院が地方に六勝寺を建立したこと","宋から浄土教が直接伝来したこと"],"a":0,"e":"聖・上人による浄土教布教と地方武士の台頭により、中尊寺金色堂などが地方に建てられた。"},{"q":"院政期の建築とその所在地の組合せとして正しいものはどれか。","c":["中尊寺金色堂—福島県","白水阿弥陀堂—岩手県","三仏寺投入堂—大分県","富貴寺大堂—大分県"],"a":3,"e":"中尊寺金色堂は岩手県平泉、白水阿弥陀堂は福島県、三仏寺投入堂は鳥取県、富貴寺大堂は大分県。"},{"q":"平安時代末期に和文体の歴史物語が書かれた理由として最も適当なものはどれか。","c":["漢字が使えなくなったため","古代から中世への転換期に立ち、貴族が過去の歴史を振り返ろうとしたため","後白河上皇が命じたため","武士が歴史書を求めたため"],"a":1,"e":"転換期に立った貴族たちは過去を振り返ろうとし、『栄華物語』『大鏡』などの歴史物語を著した。"},{"q":"『栄華（栄花）物語』と『大鏡』の違いとして正しいものはどれか。","c":["『栄華物語』は紀伝体、『大鏡』は編年体","『栄華物語』は賞賛的に編年体、『大鏡』は客観的に紀伝体で藤原氏全盛期を描く","『栄華物語』は漢文体、『大鏡』は仮名","『栄華物語』は院政期のみ、『大鏡』は国風文化期のみを描く"],"a":1,"e":"栄華物語は藤原氏全盛期を賞賛的に編年体で、大鏡は客観的に紀伝体で描き、四鏡の初めとなった。"},{"q":"院政期の芸能について正しいものはどれか。","c":["田楽は農村の労働歌舞から貴族にも流行した","今様は貴族の雅楽である","猿楽は貴族だけの娯楽だった","催馬楽は後白河上皇が創始した"],"a":0,"e":"田楽（農村の労働歌舞）と猿楽（滑稽を主とした民間娯楽）は貴族にも流行し、文化の庶民性が高まった。今様は民間の流行歌謡。"}],"order":[{"title":"平氏政権の動揺と全盛","items":["清盛の太政大臣就任","鹿ケ谷の陰謀","後白河法皇の鳥羽殿幽閉","安徳天皇の即位"],"e":"1167年太政大臣→1177年鹿ケ谷の陰謀→1179年法皇幽閉・院政停止→1180年安徳天皇即位で外戚に。"},{"title":"歴史物語の成立順","items":["栄華（栄花）物語","大鏡","今鏡","増鏡"],"e":"栄華物語（国風文化期〜院政期）→大鏡が四鏡の初め→今鏡→水鏡→増鏡と続く。"},{"title":"後白河法皇をめぐる清盛との関係","items":["後白河院政を武力で支える","鹿ケ谷の陰謀で法皇の責任を問わず","重盛の遺領没収に激怒","法皇を幽閉し院政を停止"],"e":"院近臣として支えていた清盛が、遺領没収を機に法皇を幽閉し、院政を停止して国家機構を手中に収めた。"}]},{"title":"資料・史料と中世","flow":[{"y":"","t":"源氏物語絵巻","s":"院政期に登場した絵巻物で、引目鈎鼻・吹抜屋台が二大技法","why":""},{"y":"","t":"神護寺領紀伊国桛田荘絵図","s":"寄進地系・領域型荘園の絵図で、中世の土台となる荘園公領制を読み取れる","why":"中世は土地制度の荘園公領制が土台となる"},{"y":"","t":"『平家物語』","s":"鎌倉時代の軍記物（信濃前司行長？）で、平氏政権に対する後世の評価である主観的文献史料","why":""},{"y":"","t":"（観応）半済令","s":"南北朝時代の法令で、御成敗式目の追加集『建武以来追加』に残る客観的文献史料","why":""},{"y":"","t":"新安沈船","s":"14世紀前半に沈没した船。1976年に大韓民国の沖合で船体の一部と大量の積み荷が発見された","why":""},{"y":"1429","t":"琉球王国の成立","s":"沖縄諸島に琉球王国が成立し、首都に首里城がつくられた","why":""},{"y":"","t":"明銭の輸入","s":"室町時代の日明貿易（勘合貿易）で洪武通宝・永楽通宝・宣徳通宝が輸入され、私鋳銭も大量に出回った","why":""},{"y":"2019","t":"首里城の焼失","s":"世界文化遺産「琉球王国のグスク及び関連遺産群」の首里城は何度も焼け、2019年にも正殿などが焼失した","why":"戦災や人災"}],"story":"中世は古代に比べ考古学遺物の出土量が増加する。1976年に【大韓民国】の沖合で発見された【新安沈船】は14世紀前半に沈没したもので、大量の積み荷が見つかった。室町時代の【日明貿易】（勘合貿易）では【洪武通宝】・【永楽通宝】・【宣徳通宝】などの【明銭】が輸入され、日本で鋳造された私鋳銭も大量に出回った。1429年に成立した【琉球王国】の首里城は世界文化遺産の構成要素だが、戦災や人災で何度も焼け、2019年にも正殿などが焼失した→復元物が存在するのは各人各様の尽力の結果である。文献史料には、南北朝時代の法令『【半済令】』のような客観的史料と、鎌倉時代の軍記物『【平家物語】』のような後世の評価である主観的史料があり、両者には根本的な違いがある。院政期には引目鈎鼻・吹抜屋台を技法とする『【源氏物語絵巻】』が登場した。中世の土台である【荘園公領制】は、紀伊国【桛田荘絵図】のような寄進地系荘園の絵図からも読み取れる。","keywords":["新安沈船","明銭","洪武通宝","永楽通宝","宣徳通宝","私鋳銭","琉球王国","首里城","半済令","建武以来追加","平家物語","源氏物語絵巻","引目鈎鼻","吹抜屋台","桛田荘絵図","荘園公領制"],"blanks":[{"q":"1976年、【　】の沖合で14世紀前半に沈没した新安沈船が発見された。","a":"大韓民国","h":"船体の一部と大量の積み荷"},{"q":"室町時代の日明貿易（勘合貿易）で輸入された洪武通宝・永楽通宝・宣徳通宝などを【　】という。","a":"明銭","h":"初代洪武帝・3代永楽帝・5代宣徳帝"},{"q":"明の初代洪武帝の銭貨は【　】である。","a":"洪武通宝","h":"明銭の一つ"},{"q":"明銭のほかに、日本で鋳造された粗悪な鐚銭を含む【　】が大量に出回った。","a":"私鋳銭","h":"民間で鋳造"},{"q":"沖縄県の首里城は世界文化遺産「【　】王国のグスク及び関連遺産群」の構成要素である。","a":"琉球","h":"1429年に沖縄諸島に成立"},{"q":"琉球王国の首都につくられ、2019年に正殿などが焼失した城は【　】である。","a":"首里城","h":"戦災や人災で何度も焼けた"},{"q":"南北朝時代の法令『（観応）【　】』は中世の客観的文献史料の例である。","a":"半済令","h":"『建武以来追加』より"},{"q":"鎌倉時代の軍記物『【　】』は、平氏政権に対する後世の評価である主観的文献史料の例である。","a":"平家物語","h":"信濃前司行長？"},{"q":"院政期の『【　】』は引目鈎鼻・吹抜屋台を二大技法とする絵巻物である。","a":"源氏物語絵巻","h":"中世に登場した絵巻物"},{"q":"神護寺領紀伊国【　】絵図は、寄進地系・領域型荘園の絵図である。","a":"桛田荘","h":"紀伊国"},{"q":"中世は土地制度の【　】制が土台となる。","a":"荘園公領","h":"荘園と公領からなる土地領有体制"}],"mc":[{"q":"新安沈船について正しいものはどれか。","c":["12世紀に沈没し中国の沖合で発見された","14世紀前半に沈没し1976年に大韓民国の沖合で発見された","室町時代の遣明船で日本近海で発見された","琉球王国の貿易船で首里城近くで発見された"],"a":1,"e":"新安沈船は14世紀前半に沈没し、1976年に大韓民国の沖合で船体の一部と大量の積み荷が発見された。"},{"q":"室町時代に輸入された明銭にあてはまらないものはどれか。","c":["洪武通宝","永楽通宝","寛永通宝","宣徳通宝"],"a":2,"e":"明銭は洪武通宝・永楽通宝・宣徳通宝。寛永通宝は江戸時代に発行された。"},{"q":"首里城について正しいものはどれか。","c":["世界文化遺産の構成要素だが、戦災や人災で何度も焼け2019年にも正殿が焼失した","一度も焼けたことがなく創建当時のまま残る","琉球王国以前の三山時代に廃城となった","日明貿易の拠点として明が築いた"],"a":0,"e":"首里城は「琉球王国のグスク及び関連遺産群」の構成要素で、直近では2019年に正殿などが焼失した。"},{"q":"中世の客観的文献史料と主観的文献史料の例の組合せとして正しいものはどれか。","c":["客観：平家物語、主観：半済令","客観：源氏物語絵巻、主観：桛田荘絵図","客観：半済令、主観：平家物語","客観：平家物語、主観：源氏物語絵巻"],"a":2,"e":"法令である半済令は客観的史料、平氏政権への後世の評価である平家物語は主観的史料で、両者には根本的な違いがある。"},{"q":"『（観応）半済令』が残されている史料はどれか。","c":["平家物語","建武以来追加","愚管抄","今昔物語集"],"a":1,"e":"半済令は南北朝時代の法令で、御成敗式目の追加集『建武以来追加』の一部として残されている。"},{"q":"『源氏物語絵巻』の二大技法として正しいものはどれか。","c":["翻波式と一木造","引目鈎鼻と吹抜屋台","寄木造と来迎図","蒔絵と螺鈿"],"a":1,"e":"院政期に登場した源氏物語絵巻は、引目鈎鼻・吹抜屋台が二大技法である。"},{"q":"紀伊国桛田荘絵図から読み取れる制度として正しいものはどれか。","c":["班田収授","公地公民制","小作制度","荘園公領制"],"a":3,"e":"桛田荘は寄進地系・領域型荘園で、中世の土台である荘園公領制を読み取ることができる。"}],"order":[{"title":"中世の史料の成立順","items":["源氏物語絵巻","平家物語","（観応）半済令","明銭の輸入"],"e":"源氏物語絵巻は院政期、平家物語は鎌倉時代、半済令は南北朝時代、明銭は室町時代の日明貿易で輸入された。"},{"title":"琉球・首里城の歩み","items":["新安沈船の沈没","琉球王国の成立","新安沈船の発見","首里城正殿の焼失"],"e":"14世紀前半に沈船が沈没→1429年琉球王国成立→1976年沈船発見→2019年首里城焼失。"}]}],"review":[{"q":"後三条天皇の親政から院政の開始に至る流れとして正しいものはどれか。","c":["摂関家の外戚として即位した後三条天皇が、摂関家に院政を委ねた","摂関家を外戚としない後三条天皇が親政を行い、皇統を摂関家から独立させたことで、白河上皇の院政が可能になった","後三条天皇が北面の武士を設置し、武士が院政を始めた","延久の荘園整理令で摂関家が滅び、白河天皇が摂政となった"],"a":1,"e":"後三条天皇は摂関家を外戚としない立場で親政を行い、早期に白河天皇に譲位して皇統を摂関家から独立させた。これが1086年の院政開始につながった。"},{"q":"院の仏教保護が武士の中央進出につながった因果として最も適当なものはどれか。","c":["仏教保護で財政難となり僧兵の横暴に皇族・貴族が無力だったため、武士に僧兵を鎮圧させた","六勝寺の建立に武士が動員されたため","熊野詣の護衛として摂関家が源氏を招いたため","僧兵が武士と結んで院政を倒したため"],"a":0,"e":"院の仏教保護は財政難と僧兵の横暴を招き、大寺社と関係の深い皇族・貴族は武士を登用しなければ僧兵を抑えきれなかった。"},{"q":"清和源氏と桓武平氏の台頭の仕方の違いとして正しいものはどれか。","c":["源氏は院と結び、平氏は摂関家と結んだ","源氏は摂関家と結び、平氏は院と結んだ","両氏とも奥州藤原氏と結んだ","両氏とも摂関家と結び、院とは対立した"],"a":1,"e":"清和源氏は摂関家と結び台頭したのに対し、桓武平氏は平正盛が白河上皇の北面の武士となるなど院と結び台頭した。"},{"q":"保元の乱と平治の乱の原因の違いとして正しいものはどれか。","c":["保元の乱は源平の対立、平治の乱は皇室の対立が原因","保元の乱は鳥羽上皇の死による皇室・摂関家の内部対立、平治の乱は後白河上皇の院近臣の対立に源平二大棟梁の対立が絡んだもの","保元の乱は鹿ケ谷の陰謀、平治の乱は重盛の遺領没収が原因","保元の乱は僧兵の強訴、平治の乱は日宋貿易の利権争いが原因"],"a":1,"e":"保元の乱は鳥羽上皇の死を契機に皇室・摂関家の内部対立が表面化し、平治の乱は院近臣（信西と信頼）の対立に清盛と義朝の対立が絡んで起こった。"},{"q":"平氏政権が「貴族政権と武家政権の二面性」を持つとされる理由として正しいものはどれか。","c":["武士出身でありながら高位高官の独占・外戚政策・知行国と荘園を経済基盤としたため","摂関家の養子となり関白に就任したため","鎌倉に幕府を開いたため","武士を全く用いず貴族だけで政治を行ったため"],"a":0,"e":"平氏は西国武士を地頭に任命して家人化する一方、高位高官の独占・外戚政策・知行国と荘園を基盤とするなど摂関政治に似た性格を持った。"},{"q":"平氏政権が確立後まもなく没落へ向かった流れとして最も適当なものはどれか。","c":["日宋貿易の失敗で経済基盤を失ったため","鹿ケ谷の陰謀で清盛が処罰されたため","院政停止と安徳天皇即位という急速な権力集中が、院・貴族・寺社・地方武士など反対勢力の結集を促したため","後白河法皇が出家して院政をやめたため"],"a":2,"e":"1179年の法皇幽閉と1180年の安徳天皇即位で平氏の軍事独裁政権が確立したが、かえって反対勢力の結集を促し没落を早めた。"}]},{"id":7,"title":"武家政権の確立","era":"鎌倉時代","span":"1180〜1333","oneLine":"源平の争乱から鎌倉幕府が生まれ，執権政治を経て蒙古襲来後に衰退へ向かった","chain":["源頼朝","北条時政","北条義時","北条泰時","北条時頼","北条時宗","北条貞時"],"parts":[{"title":"源平の争乱と鎌倉幕府の成立","flow":[{"y":"1180","t":"以仁王・源頼政の挙兵","s":"後白河法皇の子の以仁王と摂津源氏の源頼政が園城寺・興福寺の僧兵の支持を得て挙兵するが敗死","why":"後白河院政を停止し独裁政権を確立した平氏への不満が爆発したため"},{"y":"1180","t":"福原京遷都","s":"6月に摂津国福原京へ遷都するが，貴族や寺社の反対が多く11月に平安京へ還都","why":""},{"y":"1180","t":"源頼朝の挙兵","s":"以仁王の令旨により北条時政とともに伊豆国で挙兵。石橋山で敗れ安房国へ逃れるが10月に鎌倉に入り，富士川の戦いで平維盛を破る","why":"東国武士団が頼朝を中心とする新たな政治体制の成立に期待したため"},{"y":"1180","t":"南都焼打ち","s":"12月，平重衡が南都を焼打ちし東大寺大仏殿が炎上","why":""},{"y":"1181","t":"平清盛の死","s":"閏2月に清盛が熱病で死亡し，三男の宗盛が棟梁となる。畿内・西国では養和の飢饉","why":""},{"y":"1183","t":"倶利伽羅峠の戦い・平氏都落ち","s":"源義仲が平維盛を破り，平氏は安徳天皇を奉じて西国へ都落ち。義仲が入京","why":""},{"y":"1183","t":"寿永二年十月宣旨","s":"後白河法皇が源頼朝の東国支配権を承認。頼朝は範頼・義経を西国へ派遣","why":"入京した義仲が後白河法皇と対立したため"},{"y":"1184","t":"宇治川・一の谷の戦い","s":"範頼・義経が義仲を破り（義仲は粟津で戦死），続いて一の谷で平氏を破る","why":""},{"y":"1185","t":"屋島・壇の浦の戦い","s":"讃岐国屋島，長門国壇の浦で平氏を破り，安徳天皇らは入水，平氏は滅亡","why":""},{"y":"1185","t":"守護・地頭の任命権（文治勅許）","s":"義経・行家追討を口実に後白河法皇から守護・地頭の任命権を認められ，勢力が西国へ伸びる","why":"義経に与えられた頼朝追討令に対抗するため"}],"story":"平氏が【後白河院政】を停止して独裁体制を確立したため，各勢力の不満が噴出した。【1180】年，【以仁王】と【源頼政】が挙兵して敗死したが，その令旨により伊豆国で【源頼朝】が，信濃国で【源義仲】が挙兵した。荘園領主や国司に対抗して支配権を強めようとしていた東国の武士団は，頼朝を中心とする新たな政治体制に期待して従った。頼朝は【鎌倉】に入り【侍所】を置き，関東平定を優先した。【1183】年に義仲が平氏を都落ちさせて入京すると，後白河法皇は【寿永二年十月宣旨】で頼朝の東国支配権を承認し，頼朝は範頼・【義経】を西国へ派遣した。【1185】年，【壇の浦】の戦いで平氏は滅亡。同年，頼朝は義経追討を口実に守護・地頭の任命権を認められ，1189年の奥州平定，【1192】年の【征夷大将軍】就任へと進んだ。幕府成立の画期をどこに置くかは定まらず，成立年代には諸説がある。","keywords":["以仁王","源頼政","福原京","石橋山の戦い","富士川の戦い","寿永二年十月宣旨","壇の浦の戦い","文治勅許","侍所","公文所","問注所","政所","征夷大将軍","和田義盛","大江広元"],"blanks":[{"q":"1180年5月，後白河法皇の子【　】が源頼政とともに挙兵したが敗死した。","a":"以仁王","h":"その令旨で各地の源氏が挙兵する"},{"q":"1180年6月，平氏は摂津国【　】に遷都したが，反対が多く11月に平安京へ戻した。","a":"福原京","h":"建設中に放棄された"},{"q":"源頼朝は以仁王の令旨により，【　】とともに伊豆国で挙兵した。","a":"北条時政","h":"のちの初代執権"},{"q":"1180年10月，源頼朝は駿河国【　】の戦いで平維盛を破った。","a":"富士川","h":"この後，頼朝は関東平定を優先した"},{"q":"1181年閏2月，【　】が熱病により死亡し，三男の宗盛が棟梁となった。","a":"平清盛","h":"桓武平氏の独裁者"},{"q":"1183年7月，平氏は【　】を奉じて西国へ都落ちした。","a":"安徳天皇","h":"壇の浦で入水した幼帝"},{"q":"1183年10月，後白河法皇が源頼朝の東国支配権を承認した宣旨をいわゆる【　】という。","a":"寿永二年十月宣旨","h":"東海道・東山道の支配権"},{"q":"1185年3月，長門国【　】の戦いで平氏は滅亡した。","a":"壇の浦","h":"海戦"},{"q":"1184年，源頼朝は公文所と【　】を設置し，裁判事務を担当させた。","a":"問注所","h":"初代執事は三善康信"},{"q":"1191年，公文所は【　】に改組された。","a":"政所","h":"一般政務・財政を担当"},{"q":"侍所の初代別当は【　】である。","a":"和田義盛","h":"のち和田合戦で討滅される"},{"q":"1192年，後白河法皇の死後，源頼朝は後鳥羽天皇から【　】に任命された。","a":"征夷大将軍","h":"1190年には右近衛大将になったがすぐ辞退"}],"mc":[{"q":"1180年に各地で反平氏の挙兵が起こった背景として最も適当なものはどれか。","c":["平清盛が熱病で死去し，平氏の指導者が不在となったため","平氏が後白河院政を停止して独裁体制を確立し，各勢力の不満が爆発したため","後鳥羽上皇が北条義時追討の院宣を発したため","養和の飢饉により西国の武士が困窮したため"],"a":1,"e":"後白河院政の停止と平氏の独裁に対し，以仁王の令旨を契機に各地の勢力が挙兵した。"},{"q":"源頼朝の挙兵に東国武士が多く従った理由として最も適当なものはどれか。","c":["頼朝が朝廷から征夷大将軍に任命されていたため","頼朝が守護・地頭の任命権をすでに持っていたため","在地領主として支配権を強化したい東国武士団が，頼朝中心の新政治体制に期待したため","平氏が東国武士の所領をすべて没収したため"],"a":2,"e":"荘園領主や国司に対抗する在地領主たちが，頼朝による新体制の成立に期待した。"},{"q":"1185年に源頼朝が守護・地頭の任命権を認められた直接の経緯として正しいものはどれか。","c":["義経に与えられた頼朝追討令に対抗し，義経・行家追討を口実に後白河法皇に要求した","奥州藤原氏を平定した功績により後鳥羽天皇から与えられた","寿永二年十月宣旨の中で東国支配権とともに認められた","平清盛が死去する直前に譲り渡した"],"a":0,"e":"義経追討と反乱防止を口実に，兵糧米徴収権・在庁官人支配権とあわせて認められた（文治勅許）。"},{"q":"源頼朝が弟の義経を死に追い込んだ理由として最も適当なものはどれか。","c":["義経が平氏に味方して壇の浦で戦ったため","「鎌倉殿」として独裁体制を確立するために義経を排除する必要があったため","義経が奥州藤原氏の当主となり東北を支配したため","義経が征夷大将軍に任命されたため"],"a":1,"e":"頼朝は独裁体制の確立のため義経を排除し，義経を匿った藤原泰衡も平定して東北へ勢力を伸ばした。"},{"q":"1183年の寿永二年十月宣旨の内容として正しいものはどれか。","c":["源頼朝を征夷大将軍に任命した","源義仲の入京を承認した","守護・地頭の設置を認めた","源頼朝の東国（東海道・東山道）支配権を事実上承認した"],"a":3,"e":"後白河法皇が頼朝の東国支配権を承認した宣旨。守護・地頭の任命権は1185年，征夷大将軍は1192年。"},{"q":"鎌倉幕府の成立年代に諸説がある理由として最も適当なものはどれか。","c":[" 公領ごとに荘官・郷司（非御家人），幕府は守護と地頭（御家人）を任命した。"},{"q":"鎌倉幕府の公家的性格を示すものとして正しいものはどれか。","c":["武士団を御家人として組織し，所領支配を全国に広げた","武家新制を独自に発布して朝廷と対立した","守護に荘園・公領への直接干渉を認めた","関東御成敗地を経済基盤とし，朝廷の新制に基づき荘園公領制の維持に協力した"],"a":3,"e":"幕府は荘園・知行国を基盤とし，地頭の年貢滞納を罰するなど朝廷の支配体制に協力した。"},{"q":"国司・荘園領主と守護・地頭の対立が次第に強まった原因として最も適当なものはどれか。","c":["幕府が東国を中心に武士団を御家人として組織し，強固な所領支配を全国に広げようとしたため","朝廷が守護・地頭の任命権を取り上げたため","地頭が朝廷から任命される非御家人になったため","議奏公卿が廃止されて連絡役がいなくなったため"],"a":0,"e":"幕府の武家的性格（所領支配の拡大）が，荘園公領制を守る朝廷側との対立を生んだ。"}],"order":[{"title":"地頭設置の経過","items":["守護・地頭の任命権獲得（文治勅許）","国地頭の設置","国地頭の廃止・荘郷地頭への限定","承久の乱後の全国拡大"],"e":"1185年に文治勅許と同時に国地頭を設置→1186年に廃止・限定→承久の乱などを経て全国へ。"},{"title":"幕府の基盤拡大","items":["東国支配権の承認","守護・地頭の設置","奥州平定による東北への拡大","承久の乱による畿内・西国への拡大"],"e":"1183年東国→1185年守護・地頭→1189年東北→1221年畿内・西国の順に基盤が広がった。"}]},{"title":"執権政治","flow":[{"y":"1199","t":"源頼朝の死・13人の合議制","s":"子の頼家が家督を継ぐが親裁を制限され，有力御家人13人の合議制となる","why":"頼朝の独裁に代わる体制が必要だったため"},{"y":"1203","t":"比企氏の乱","s":"北条時政が比企能員・一幡を討滅，頼家を修禅寺に幽閉し実朝を3代将軍に。時政は政所別当となり事実上の執権","why":"北条氏が源氏将軍の外戚として権力を握るため"},{"y":"1205","t":"北条義時が2代執権","s":"畠山重忠討滅の後，時政は平賀朝雅擁立に失敗し義時・政子に追放される","why":""},{"y":"1213","t":"和田合戦","s":"侍所別当和田義盛を討滅し，義時が政所・侍所別当を兼務して執権の地位を確立","why":""},{"y":"1219","t":"源実朝の暗殺","s":"実朝が鶴岡八幡宮で公暁に暗殺され源氏将軍が断絶。幼い藤原頼経が鎌倉に下る","why":""},{"y":"1221","t":"承久の乱","s":"後鳥羽上皇が北条義時追討の院宣を発するが，政子の演説に鼓舞された泰時・時房の大軍が約1か月で圧勝","why":"公武二元的支配の矛盾と，皇族将軍要請を拒否した後鳥羽上皇の討幕計画のため"},{"y":"1221","t":"承久の乱の結果","s":"三上皇配流（後鳥羽→隠岐・土御門→土佐のち阿波・順徳→佐渡），所領約3000か所没収，新補地頭設置，六波羅探題設置","why":""},{"y":"1225","t":"連署・評定衆の設置","s":"3代執権北条泰時が連署（初代時房）と評定衆を置き合議制の執権政治を展開","why":"義時・政子・大江広元が相次いで没したため"},{"y":"1232","t":"御成敗式目","s":"頼朝以来の先例と道理を基準とする51か条の最初の武家法典","why":"所領紛争の裁判基準を明確化・公正化するため"},{"y":"1249","t":"引付衆の設置","s":"5代執権北条時頼が宝治合戦で三浦氏を討滅した後，所領訴訟専門の引付を置く","why":"裁判の迅速化・公正化のため"}],"story":"北条氏は源氏将軍の外戚として特別な地位を得た。【1199】年に頼朝が死ぬと13人の合議制となり，【北条時政】は1203年の【比企氏の乱】で頼家を幽閉して実朝を3代将軍とし，政所別当となった。子の【北条義時】は1213年の【和田合戦】で和田義盛を滅ぼし，政所・侍所の別当を兼ねて執権の地位を確立した。1219年に実朝が暗殺され源氏将軍が断絶すると，皇族将軍要請を【後鳥羽上皇】が拒否し，公武二元的支配の矛盾が【1221】年の【承久の乱】として爆発した。幕府軍が圧勝した結果，三上皇が配流され，没収地に【新補地頭】が置かれ，【六波羅探題】が設置されて幕府の優位が確定した。3代【北条泰時】は連署・【評定衆】を置いて合議制を整え，【1232】年に先例と道理を基準とする【御成敗式目】を制定した。一方，西国に進出した地頭の不法行為が激増したため，荘園領主は【地頭請】や【下地中分】で妥協していった。","keywords":["北条時政","比企氏の乱","北条義時","和田合戦","公暁","承久の乱","後鳥羽上皇","西面の武士","隠岐","新補地頭","六波羅探題","北条泰時","連署","評定衆","御成敗式目"],"blanks":[{"q":"初代執権【　】は，源頼朝の妻政子の父で，伊豆国の在庁官人出身であった。","a":"北条時政","h":"1203年に政所別当となる"},{"q":"1203年の【　】で，北条時政は頼家の義父の能員と頼家の長男一幡を討滅した。","a":"比企氏の乱","h":"この後，頼家は修禅寺に幽閉"},{"q":"1213年の和田合戦で北条義時に討滅された侍所別当は【　】である。","a":"和田義盛","h":"初代侍所別当"},{"q":"1219年，3代将軍源実朝は鶴岡八幡宮で甥の【　】に暗殺され，源氏将軍は断絶した。","a":"公暁","h":"頼家の子"},{"q":"承久の乱の原因は，公武二元的支配の矛盾と，院政を行う【　】の討幕計画であった。","a":"後鳥羽上皇","h":"北面の武士に加えて西面の武士を設置"},{"q":"天台座主【　】は『愚管抄』を著し，後鳥羽上皇を諫めようとした。","a":"慈円","h":"九条兼実の弟"},{"q":"承久の乱後，後鳥羽上皇は【　】に配流された。","a":"隠岐","h":"土御門上皇は土佐のち阿波，順徳上皇は佐渡"},{"q":"承久の乱後，京都守護を改組して【　】が設置され，朝廷の監視と西国御家人の統括にあたった。","a":"六波羅探題","h":"初代は北条泰時・時房"},{"q":"1225年，3代執権北条泰時は執権を補佐する【　】を新設し，初代には北条時房が就いた。","a":"連署","h":"副執権にあたる"},{"q":"1232年，北条泰時は最初の武家法典である【　】51か条を制定した。","a":"御成敗式目","h":"貞永式目ともいう"},{"q":"1247年の【　】で，5代執権北条時頼は三浦泰村一族を鎌倉で討滅した。","a":"宝治合戦","h":"安達氏と対立していた"},{"q":"荘園領主と地頭が所領を折半し，相互の支配権を認めて干渉を排除する方法を【　】という。","a":"下地中分","h":"『伯耆国東郷荘下地中分図』が残る"}],"mc":[{"q":"御家人の中で北条氏が特に台頭できた理由として最も適当なものはどれか。","c":["北条時政が源頼朝の挙兵時に唯一従った御家人だったため","北条氏が源氏将軍の外戚として特別な扱いを受けたため","北条氏が朝廷から国司に任命されていたため","北条氏が奥州藤原氏の系譜を引く大豪族だったため"],"a":1,"e":"時政は頼朝の妻政子の父で，源氏将軍の外戚として御家人の中で特別な地位にあった。"},{"q":"北条義時が執権の地位を確立した契機として正しいものはどれか。","c":["比企氏の乱で比企能員を討滅し，政所別当となった","承久の乱に勝利し，六波羅探題に就任した","和田合戦で和田義盛を討滅し，政所と侍所の別当を兼務した","源実朝を暗殺し，藤原頼経を将軍に迎えた"],"a":2,"e":"1213年の和田合戦後，義時は政所・侍所の別当を兼ね執権の地位を確立した。比企氏の乱は時政。"},{"q":"承久の乱の契機として最も適当なものはどれか。","c":["実朝暗殺後に幕府が要請した皇族将軍を後鳥羽上皇が拒否し，対立が深まったため","後鳥羽上皇が六波羅探題の設置に反発したため","北条泰時が御成敗式目を制定して公家法を否定したため","幕府が三上皇を配流したため"],"a":0,"e":"源氏将軍断絶後の皇族将軍要請を上皇が拒否し，上皇は義時追討の院宣を発した。"},{"q":"承久の乱の結果として誤っているものはどれか。","c":["後鳥羽上皇が隠岐，順徳上皇が佐渡に配流された","朝廷方の所領約3000か所が没収され新補地頭が置かれた","京都守護を改組して六波羅探題が設置された","朝廷の優位が確定し，幕府は皇位継承への干渉を禁じられた"],"a":3,"e":"幕府の優位が確定し，皇位継承や重要政務に干渉するようになった。"},{"q":"承久の乱の意義として最も適当なものはどれか。","c":["新補地頭の設置により畿内・西国へ幕府の支配権が拡大した","守護・地頭が初めて全国に設置された","源氏将軍が断絶し藤原将軍が始まった","得宗専制政治が始まった"],"a":0,"e":"没収地に新補地頭が置かれ，1223年には大田文作成を命じるなど西国支配が進んだ。"},{"q":"北条泰時が連署・評定衆を置いて合議制を展開した背景として正しいものはどれか。","c":["源実朝が右大臣に昇進し将軍権力が強まったため","1224〜25年に北条義時・政子・大江広元が相次いで没したため","承久の乱に敗北して幕府の権威が低下したため","宝治合戦で三浦氏が滅んだため"],"a":1,"e":"義時・政子・広元の死により，六波羅探題から戻った泰時と時房が合議制の執権政治を始めた。"},{"q":"御成敗式目の制定基準として正しいものはどれか。","c":["律令を引き継いだ朝廷の公家法","荘園領主が定めた本所法","源頼朝以来の先例と武家社会の慣習・道徳である道理","宋学の大義名分論"],"a":2,"e":"頼朝以来の先例と道理を基準とし，公家法・本所法と並存しつつ次第に影響力を広げた。"},{"q":"承久の乱後に地頭請や下地中分が行われた背景として最も適当なものはどれか。","c":["幕府が荘園領主に地頭の罷免権を与えたため","御成敗式目が地頭の年貢納入を免除したため","農民が地頭に年貢の代銭納を要求したため","西国に進出した新補地頭の不法行為を罷免権のない荘園領主が抑えられず，妥協的解決を取ったため"],"a":3,"e":"「泣く子と地頭には勝てぬ」と言われるように，領主は地頭請・下地中分で妥協し，地頭の領主化が進んだ。"}],"order":[{"title":"北条氏の権力確立","items":["比企氏の乱","畠山重忠の討滅","和田合戦","源実朝の暗殺","承久の乱"],"e":"1203年比企氏→1205年畠山→1213年和田→1219年実朝暗殺→1221年承久の乱。"},{"title":"執権政治の制度整備","items":["連署・評定衆の設置","藤原頼経の将軍就任","御成敗式目の制定","引付衆の設置","宗尊親王の将軍就任"],"e":"1225年連署・評定衆→1226年摂家将軍→1232年式目→1249年引付衆→1252年皇族将軍。"},{"title":"承久の乱後の処置","items":["三上皇の配流・仲恭天皇の廃位","六波羅探題の設置","新補率法の適用","大田文作成の命令"],"e":"乱直後に配流・六波羅探題設置→1223年に新補率法を適用し，諸国に大田文作成を命じた。"}]},{"title":"蒙古襲来と鎌倉幕府の衰退","flow":[{"y":"1234","t":"モンゴル帝国の拡大","s":"チンギス=ハンが諸部族を統合し，2代オゴタイ=ハンが金を滅ぼしてカラコルムに首都を置く","why":""},{"y":"1271","t":"元の建国","s":"5代フビライ=ハンが大都を首都に元を建国。高麗を通じ日本に朝貢を要求するが8代執権北条時宗は拒否","why":""},{"y":"1274","t":"文永の役","s":"元・高麗連合軍約3万が対馬・壱岐を攻め博多湾に上陸。集団戦法とてつはうで御家人を苦しめるが内部対立で撤退","why":"時宗が朝貢要求を拒否したため"},{"y":"1275","t":"国防の強化","s":"異国警固番役を強化，長門警固番役を新設，石築地を構築，非御家人も動員，守護に北条氏一門を配置","why":"元の再襲来に備えるため"},{"y":"1281","t":"弘安の役","s":"南宋を滅ぼした元・高麗・南宋連合軍約14万が再襲来するが，上陸を阻まれる間に暴風雨で大損害を受け撤退","why":""},{"y":"1285","t":"霜月騒動","s":"9代執権北条貞時・内管領平頼綱が外様御家人安達泰盛を滅ぼす","why":"得宗の家人である御内人と外様御家人の対立が激化したため"},{"y":"1293","t":"平禅門の乱・鎮西探題設置","s":"貞時が内管領平頼綱を滅ぼし実権を握る。博多に鎮西探題を置き北条氏一門が就任","why":""},{"y":"1297","t":"永仁の徳政令","s":"御家人の所領売買・質入れの禁止，売却地の無償返還，越訴制度の廃止など。効果は一時的","why":"恩賞不十分・警戒態勢維持・分割相続・貨幣経済で窮乏した御家人を救済するため"},{"y":"","t":"惣領制の解体","s":"分割相続から嫡子の単独相続へ，血縁的結合から地縁的結合へ。畿内を中心に悪党が発生","why":"所領の細分化と御家人の窮乏のため"}],"story":"1271年に5代【フビライ=ハン】が【元】を建国し日本に朝貢を要求したが，8代執権【北条時宗】は拒否した。そのため【1274】年の【文永の役】で元・高麗連合軍が博多湾に上陸し，集団戦法や【てつはう】で御家人を苦しめたが内部対立で撤退した。幕府は【異国警固番役】を強化し石築地を築き，非御家人も動員した結果，【1281】年の【弘安の役】では上陸を阻み，暴風雨で撃退した。1293年には博多に【鎮西探題】が置かれた。襲来の結果，幕府の支配力は非御家人へも及び，北条氏本家の【得宗】の地位が強化され，得宗の家人【御内人】と外様御家人の対立が1285年の【霜月騒動】を生んだ。一方，恩賞が不十分で警戒態勢が続いたうえ，分割相続による所領細分化と貨幣経済の進展で御家人は窮乏した。1297年の【永仁の徳政令】は一時的効果に終わり，御家人制の基礎である【惣領制】は解体して悪党が発生し，幕府は衰退へ向かった。","keywords":["フビライ=ハン","北条時宗","文永の役","てつはう","異国警固番役","石築地","弘安の役","鎮西探題","得宗","御内人","内管領","霜月騒動","平頼綱","安達泰盛","永仁の徳政令"],"blanks":[{"q":"1234年，モンゴル帝国2代皇帝オゴタイ=ハンは中国北部の【　】を滅ぼした。","a":"金","h":"その後カラコルムに首都を置く"},{"q":"1271年，5代皇帝【　】が中国に元を建国し，日本に朝貢を要求した。","a":"フビライ=ハン","h":"首都は大都"},{"q":"元の朝貢要求を拒否した8代執権は【　】である。","a":"北条時宗","h":"時頼の子"},{"q":"1274年，元・高麗連合軍約3万が博多湾に上陸した戦いを【　】という。","a":"文永の役","h":"集団戦法とてつはうで御家人を苦しめた"},{"q":"文永の役の後，幕府は九州北部に設置していた【　】を強化した。","a":"異国警固番役","h":"中国地方には長門警固番役を新設"},{"q":"1281年，元・高麗・南宋連合軍約14万が再度襲来した戦いを【　】という。","a":"弘安の役","h":"暴風雨で大損害を受けて撤退"},{"q":"1293年，幕府は博多に【　】を設置し，北条氏一門が就任した。","a":"鎮西探題","h":"鎮西奉行に追加して置かれた"},{"q":"北条氏本家の当主を【　】といい，蒙古襲来後にその地位が強化された。","a":"得宗","h":"私邸で寄合を開く"},{"q":"得宗の家人を【　】といい，その筆頭を内管領という。","a":"御内人","h":"外様御家人と対立"},{"q":"1285年の【　】で，内管領平頼綱は外様御家人の安達泰盛を滅ぼした。","a":"霜月騒動","h":"9代執権北条貞時のとき"},{"q":"1297年，9代執権北条貞時は御家人救済のため【　】を出したが，効果は一時的だった。","a":"永仁の徳政令","h":"所領の売買・質入れ禁止など"},{"q":"惣領制の解体の中で，畿内を中心に発生した自由な新興武士層を【　】という。","a":"悪党","h":"幕府への信頼が揺らぐ中で発生"}],"mc":[{"q":"文永の役が起こった直接の背景として最も適当なものはどれか。","c":["元が南宋を滅ぼして日本との貿易を要求したため","幕府が鎮西探題を設置して元に対抗したため","高麗を通じた元の朝貢要求を8代執権北条時宗が拒否したため","三別抄の乱を日本が支援したため"],"a":2,"e":"フビライの朝貢要求を時宗が拒否したことで元・高麗連合軍が襲来した。"},{"q":"弘安の役で日本が元軍を撃退できた要因として最も適当なものはどれか。","c":["石築地により上陸を阻んでいる間に暴風雨が起こり，元軍が大損害を受けたため","元軍が集団戦法とてつはうを持たなかったため","南宋が元軍の背後を攻撃したため","御家人だけで元軍を海上で撃破したため"],"a":0,"e":"国防強化で上陸を阻み，暴風雨で撃退。実際は敵の内輪揉めや御家人・非御家人の奮闘が大きかった。"},{"q":"蒙古襲来の影響として誤っているものはどれか。","c":["幕府の支配力が西国の非御家人へも及んだ","北条氏本家の当主である得宗の地位が強化された","「神風」による神国思想が広まり末法思想から解放された","御家人が十分な恩賞を得て経済的に安定した"],"a":3,"e":"防衛戦のため恩賞 :"商業の発達","s":"月に三度の定期市（三斎市），行商人，都市の常設店見世棚，商工業者の同業者組合である座","why":"農業生産力の向上と商品作物栽培・手工業の発展のため"},{"y":"","t":"貨幣経済の発達","s":"日宋・日元貿易による宋銭の大量流入で，問丸・為替・借上が登場し，荘園領主への年貢の代銭納が始まる","why":"交通の発達と宋銭の大量流通のため"}],"story":"鎌倉時代の地方武士は【兵農未分離】で【一所懸命】に生き，堀や塀を巡らせた【館】に住んで年貢を徴収し，直営地を経営した。御家人は「いざ鎌倉」に備え【騎射三物】や巻狩で武芸を修練し，武家道徳が形成された。農村は武士，名田を経営する【名主】，名主に【加地子】を納めて請作する作人，隷属する下人・所従で構成された。武士の血縁的結合である【惣領制】のもと，惣領が庶子を統率し，幕府は惣領を通じて一族を掌握した。相続は【分割相続】で女子も財産を得た。農業では畿内・瀬戸内で【二毛作】が始まり，【刈敷】・草木灰や牛馬耕が普及して生産力が上がった結果，商品作物や副業の手工業が進み，月三度の【定期市】が開かれ，特権的同業者組合の【座】が成長した。さらに日宋貿易による【宋銭】の大量流入が交通の発達と連動して貨幣経済が発達し，【問丸】・為替・高利貸の【借上】が登場して年貢の代銭納も始まった。","keywords":["一所懸命","館","騎射三物","名主","作人","加地子","下人・所従","惣領制","分割相続","悔い返し","二毛作","大唐米","刈敷","草木灰","三斎市"],"blanks":[{"q":"地方武士は所領内に堀・溝や塀を巡らせた【　】を構えて生活した。","a":"館","h":"河川近くの微高地に建てた"},{"q":"御家人は犬追物・笠懸・流鏑馬の【　】や巻狩で武芸を修練した。","a":"騎射三物","h":"「いざ鎌倉」に備えて"},{"q":"もとの田堵で，名田を経営し年貢・公事・夫役を負担した百姓身分を【　】という。","a":"名主","h":"作人から加地子を受け取る"},{"q":"作人は名主に【　】（小作料）を納入して名田を請作した。","a":"加地子","h":"小作料にあたる"},{"q":"本家の惣領が分家の庶子を統率し，一族で所領を共同知行する武士の血縁的結合を【　】という。","a":"惣領制","h":"幕府は惣領を通じて一族を掌握"},{"q":"鎌倉時代の所領相続は，惣領だけでなく庶子も相続する【　】であった。","a":"分割相続","h":"女子も財産を分配された"},{"q":"鎌倉時代，畿内・瀬戸内で麦を裏作とする【　】が始まった。","a":"二毛作","h":"農業技術の改良の代表"},{"q":"青草・堆肥にかわる新肥料として【　】・草木灰が登場した。","a":"刈敷","h":"草を刈って田に敷き込む"},{"q":"荘園・公領の中心や交通の要地，寺社の門前に月三度の【　】（三斎市）が発達した。","a":"定期市","h":"『一遍上人絵伝』の備前国福岡市"},{"q":"平安末期に登場し，本所の保護を受けて仕入れ・販売を独占した商工業者の同業者組合を【　】という。","a":"座","h":"本所に座役を納めた"},{"q":"年貢・商品の中継ぎや委託販売も行った運送・倉庫業者を【　】という。","a":"問丸","h":"各地の港湾で活躍"},{"q":"都市を中心とする高利貸業者を【　】という。","a":"借上","h":"永仁の徳政令では凡下として扱われた"}],"mc":[{"q":"鎌倉時代の地方武士の生活について正しいものはどれか。","c":["兵農分離が進み，武士は都市に集住した","武士は直営地を持たず，名主から加地子を受け取るだけだった","武士は朝廷から国司に任命されて国衙に住んだ","兵農未分離で，所領内に館を構え現地支配者として年貢徴収にあたった"],"a":3,"e":"武士は荘園・公領内の館に住み，地頭・荘官として年貢を徴収し，直営地も経営した。"},{"q":"御家人が騎射三物や巻狩で武芸を修練した理由として最も適当なものはどれか。","c":["朝廷の京都大番役で武芸を披露する必要があったため","常に「いざ鎌倉」の戦時の軍役を想定していたため","座の保護を受けるために本所に奉仕したため","農民に武芸を教えて年貢を増やすため"],"a":1,"e":"御家人は戦時の軍役に備えて武芸を修練し，武家道徳が形成された。"},{"q":"鎌倉時代の農村の構成について正しいものはどれか。","c":["名主は作人に加地子を
