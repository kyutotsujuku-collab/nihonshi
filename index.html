<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本史 流れマスター</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#e3ded4;--acc:#b5443c;--acc2:#2f6b8f;--ok:#2d8a4e;--ng:#c33;--warn:#c98a1a;--chip:#f0ebe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--acc);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ver{font-size:11px;opacity:.85}
header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:12px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:#faf7f0}
h2{font-size:17px;margin:14px 0 8px}
h3{font-size:15px;margin:10px 0 6px;color:var(--acc2)}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--sub);white-space:nowrap}
.badge.ok{background:#e2f3e7;color:var(--ok)}
.badge.acc{background:#fbe6e4;color:var(--acc)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.s{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.era{margin-top:16px;font-size:13px;color:var(--acc2);font-weight:700;border-left:4px solid var(--acc2);padding-left:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.chain span{background:var(--chip);border-radius:6px;padding:2px 8px}
.chain b{color:var(--sub);font-weight:400}
.steps{display:flex;gap:4px;margin:8px 0 12px}
.steps div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--chip);color:var(--sub)}
.steps div.on{background:var(--acc);color:#fff;font-weight:700}
.steps div.done{background:#e2f3e7;color:var(--ok)}
.tl{position:relative;padding-left:22px;margin:8px 0}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:12px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 0 1px var(--acc)}
.tl .y{font-size:12px;color:var(--acc);font-weight:700}
.tl .t{font-weight:700}
.tl .s{font-size:14px}
.tl .w{font-size:13px;color:var(--acc2);background:#eaf2f7;border-radius:6px;padding:2px 8px;margin-top:3px;display:inline-block}
.tl .w:before{content:"なぜ→ "}
.story{font-size:15px;line-height:1.85;background:#fffdf7;border:1px solid #efe6cf;border-radius:10px;padding:12px}
.story mark{background:#fde9a8;padding:0 2px;border-radius:3px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
.q{font-size:16px;margin:6px 0 10px}
.q .n{color:var(--sub);font-size:13px}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--acc);color:transparent;text-align:center;padding:0 6px;cursor:pointer}
.blank.show{color:var(--acc);font-weight:700}
.hint{font-size:13px;color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5;color:var(--ink)}
.choices button.ok{background:#e2f3e7;border-color:var(--ok)}
.choices button.ng{background:#fbe6e4;border-color:var(--ng)}
.choices button.dim{opacity:.55}
.exp{margin-top:10px;font-size:14px;background:#f2f6f9;border-radius:8px;padding:8px 10px}
.exp b{color:var(--acc2)}
.pool{display:flex;flex-direction:column;gap:8px}
.pool button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
.pool button.picked{opacity:.35}
.picked-list{min-height:40px;border:2px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.picked-list div{background:#eaf2f7;border-radius:8px;padding:6px 10px;font-size:15px}
.picked-list div.ok{background:#e2f3e7}
.picked-list div.ng{background:#fbe6e4}
.res{font-size:22px;font-weight:700;text-align:center;margin:12px 0}
.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
.center{text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:#fff;padding:8px 4px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--acc2);color:#fff}
select{font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;width:100%}
.menu{background:#fff8e6;border:1px solid #f1dfa8;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.menu b{color:var(--warn)}
.big{font-size:28px;font-weight:700;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.self{display:flex;gap:8px;margin-top:8px}
.self button{flex:1}
.mini{font-size:12px;color:var(--sub)}
.year-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.year-strip div{flex:0 0 auto;background:var(--chip);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap}
.flowline{border-left:3px solid var(--acc);padding-left:10px;margin:6px 0 10px}
.flowline .h{font-weight:700}
.flowline .o{font-size:14px;color:var(--sub)}
</style>
</head>

<script>

。"}]},{"title":"縄文文化（新石器時代）","flow":[{"y":"","t":"完新世の開始（約1万1500年前〜）","s":"気候の温暖化で海面が上昇し、日本列島が現れた。針葉樹林に代わり落葉広葉樹林（東日本）・照葉樹林（西日本）が形成","why":"更新世末から気候が温暖化したため"},{"y":"","t":"中小動物の増加","s":"ニホンジカ・イノシシ・ウサギなど動きの速い中小動物が増加。北海道のヒグマを除き大型動物は絶滅","why":"森林が形成されたため"},{"y":"","t":"弓矢の登場","s":"弓矢や落とし穴を利用し、イヌを使った狩猟が盛んに","why":"動きの速い中小動物を狩るため"},{"y":"","t":"縄文文化＝日本の新石器文化","s":"本格的な農耕・牧畜は行わず、狩猟・漁労・採集中心の採集経済段階","why":""},{"y":"","t":"磨製石器・骨角器・網の使用","s":"石鏃・石匙・磨製石斧・石皿と磨石など。釣針・銛・やす。石錘・土錘から網漁が判明","why":""},{"y":"","t":"縄文土器（約1万6500年前〜）","s":"厚手でもろく黒褐色。草創期・早期・前期・中期・後期・晩期の6期に区分","why":""},{"y":"","t":"定住生活の開始","s":"水辺に近い台地上に竪穴住居・平地式住居・貯蔵穴からなる環状や馬蹄形の集落","why":""},{"y":"","t":"平等社会とアニミズム","s":"住居の規模が同じで大きな墓がない。屈葬・抜歯・叉状研歯・土偶・石棒の習俗","why":"あらゆる自然物や自然現象に霊の存在を信じたため"},{"y":"","t":"活発な交易","s":"黒曜石・ヒスイ・サヌカイト・アスファルトが原産地から離れた場所でも出土。丸木舟で外洋へ","why":""},{"y":"1877","t":"大森貝塚の発見","s":"アメリカ人動物学者モースが発見し、日本考古学の出発点に。晩期には板付・菜畑で稲作開始","why":""}],"story":"更新世末から気候が温暖化したため→海面が上昇し日本列島が現れた（【完新世】）。森林が広がり→大型動物は絶滅し、動きの速い中小動物が増加した→そのため【弓矢】が登場し、落とし穴やイヌを使った狩猟が盛んになった。日本の新石器文化【縄文文化】は本格的な農耕・牧畜を行わず、狩猟・【漁労】・採集中心の【採集経済】段階にとどまった。【磨製石器】を打製石器と併用し、【骨角器】や網も使った。厚手でもろく黒褐色の【縄文土器】が登場し、台地上の【竪穴住居】で【定住生活】が始まった。貧富・身分の差のない平等社会で、【アニミズム】から【屈葬】・【抜歯】・【土偶】の習俗が生まれた。【黒曜石】や【ヒスイ】が原産地から離れて出土することから→丸木舟による活発な交易がわかる。1877年【モース】発見の【大森貝塚】は日本考古学の出発点。晩期には【板付】・【菜畑】など九州北部で稲作が始まった。","keywords":["完新世","弓矢","磨製石器","骨角器","縄文土器","竪穴住居","アニミズム","屈葬","抜歯","土偶","黒曜石","ヒスイ","貝塚","大森貝塚","三内丸山遺跡"],"blanks":[{"q":"約1万1500年前から現在までの、気候が温暖化した時代を地質学的には【　】という。","a":"完新世","h":"更新世の後の時代"},{"q":"縄文時代、動きの速い中小動物を狩るために【　】が登場した。","a":"弓矢","h":"落とし穴やイヌも使った"},{"q":"縄文時代には打製石器と併用して、石を磨いて作った【　】が登場した。","a":"磨製石器","h":"石鏃・石匙・磨製石斧など"},{"q":"厚手でもろく黒褐色の土器を【　】という。","a":"縄文土器","h":"草創期〜晩期の6期に区分"},{"q":"縄文時代の人々は水辺に近い台地上に、中央に炉を設けた【　】を作って住んだ。","a":"竪穴住居","h":"環状や馬蹄形の集落を形成"},{"q":"あらゆる自然物や自然現象に霊の存在を信じる宗教観を【　】という。","a":"アニミズム","h":"精霊崇拝"},{"q":"縄文時代に呪術に用いられた、女性をかたどった土製品を【　】という。","a":"土偶","h":"男性の生殖器を表現したものは石棒"},{"q":"白滝・和田峠・神津島などを原産地とし、広く交易された石器材料は【　】である。","a":"黒曜石","h":"阿蘇山や姫島も原産地"},{"q":"新潟県の姫川流域を原産 ,"t":"水稲耕作の開始→生産経済段階へ","s":"湿田から乾田、直播から田植えへ。収穫物は貯蔵穴や高床倉庫に収めた","why":""},{"y":"","t":"農具の発達","s":"石包丁（穂首刈り）→鉄鎌（根刈り）。木製の鍬・鋤、田下駄・大足・田舟、木臼・竪杵","why":""},{"y":"","t":"金属器の使用（金石併用時代）","s":"青銅器は祭器・宝器などの祭祀用、鉄器は武具・工具・農具などの実用","why":""},{"y":"","t":"弥生土器と機織り","s":"薄手でやや硬く赤褐色。甕・壺・高杯・甑。紡錘車で糸を紡ぎ袈裟衣・貫頭衣を着用","why":""},{"y":"","t":"ムラの発展と階級社会","s":"貧富差・身分差が明確になり、ムラオサが首長として支配","why":"稲作の開始による共同作業・余剰生産物の発生"},{"y":"","t":"クニ（小国）の成立","s":"環濠集落・高地性集落の登場に見られる戦いを経て、ムラを統合したクニが成立。首長は王","why":"用水・耕地・余剰生産物・金属器をめぐるムラどうしの対立が激化したため"},{"y":"","t":"墓制の変化","s":"土坑墓・甕棺墓・支石墓→方形周溝墓→墳丘墓へ。副葬品を伴う個人墓に発展","why":"階級社会への変化"},{"y":"","t":"弥生文化の分布","s":"沖縄は貝塚文化、北海道は続縄文文化が展開し採集経済にとどまった","why":"南西諸島・北海道には稲作が広がらなかったため"}],"story":"中国では紀元前3世紀に【秦】・前漢が統一国家をつくった。中国の農耕文化の発達が周辺に強い影響を与えたため→朝鮮半島を経て渡来人から稲作と金属器が伝わり→【弥生文化】が成立した。【水稲耕作】の開始で【生産経済】段階に入り、【石包丁】の穂首刈りから鉄鎌の根刈りへ進み、収穫物は【高床倉庫】に納めた。【青銅器】は祭祀用、【鉄器】は実用の金石併用時代である。稲作による共同作業・余剰生産物の発生が原因で→貧富差・身分差が明確な階級社会となり、ムラオサが首長として支配した。さらに用水・耕地・余剰生産物をめぐるムラどうしの対立が激化したため→【環濠集落】・【高地性集落】に見られる戦いを経て→ムラを統合した【クニ】が成立し、首長は【王】と呼ばれた。墓制も共同墓地から【方形周溝墓】→【墳丘墓】へと個人墓に発展した。稲作が広がらなかった沖縄では【貝塚文化】、北海道では【続縄文文化】が展開し採集経済にとどまった。","keywords":["弥生文化","水稲耕作","生産経済","石包丁","高床倉庫","青銅器","鉄器","弥生土器","銅鐸","環濠集落","高地性集落","方形周溝墓","墳丘墓","貝塚文化","続縄文文化"],"blanks":[{"q":"紀元前3世紀、中国では前漢と並んで統一国家である【　】が成立した。","a":"秦","h":"春秋・戦国時代を経て成立"},{"q":"水稲耕作の開始により、弥生時代は採集経済から【　】経済の段階へ移った。","a":"生産","h":"農耕と狩猟・漁労・採集が併存"},{"q":"稲の穂首刈りに使用された磨製石器を【　】という。","a":"石包丁","h":"根刈りには鉄鎌"},{"q":"弥生時代、収穫物は貯蔵穴や【　】に収められた。","a":"高床倉庫","h":"集落の中に作られた"},{"q":"弥生時代の金属器のうち、祭器・宝器などの祭祀用に使われたのは【　】である。","a":"青銅器","h":"実用には鉄器"},{"q":"青銅製祭器のうち、近畿を中心に分布するのは【　】である。","a":"銅鐸","h":"九州北部は銅矛・銅戈、瀬戸内は平形銅剣"},{"q":"薄手でやや硬く赤褐色の土器を【　】という。","a":"弥生土器","h":"甕・壺・高杯・甑に多様化"},{"q":"周囲に濠をめぐらせた弥生時代の集落を【　】という。","a":"環濠集落","h":"吉野ヶ里遺跡など"},{"q":"九州北部で朝鮮半島南部の影響を受けて地上に大石を置いた墓を【　】という。","a":"支石墓","h":"大型の土器に納めるのは甕棺墓"},{"q":"方形に溝を掘って墓域を作った弥生時代の墓を【　】という。","a":"方形周溝墓","h":"のち墳丘墓へ発展"},{"q":"沖縄など南西諸島で弥生時代〜10世紀頃まで展開した採集経済の文化を【　】という。","a":"貝塚文化","h":"南島文化"},{"q":"北海道で弥生時代〜7世紀頃まで展開した、鉄器を使った狩猟・漁労・採集中心の文化を【　】という。","a":"続縄文文化","h":"のち擦文文化・オホーツク文化"}],"mc":[{"q":"弥生文化が成立した背景として最も適当なものはどれか。","c":["縄文人が独自に稲作を発明したため","北海道から稲作が南下したため","中国の農耕文化が朝鮮半島を経て稲作・金属器として伝わったため","魏の皇帝が稲作を命じたため"],"a":2,"e":"中国文明の農耕文化の発達が周辺地域に影響を与え、渡来人が稲作・金属器を伝えた。"},{"q":"弥生時代に階級社会へ変化した原因として最も適当なものはどれか。","c":["稲作の開始による共同作業と余剰生産物の発生","アニミズムの広まり","中国の皇帝による冊封","気候の寒冷化"],"a":0,"e":"余剰生産物の発生などから貧富差・身分差が明確になり、ムラオサが首長として支配した。"},{"q":"環濠集落や高地性集落が登場した背景として最も適当なものはどれか。","c":["貝塚文化の影響","縄文時代からの平等社会の維持","大型動物の侵入を防ぐため","用水・耕地・余剰生産物などをめぐるムラどうしの対立"],"a":3,"e":"ムラどうしの争いが繰り返され、防御的な集落が生まれ、各地にクニが成立した。"},{"q":"南西諸島と北海道に稲作が広がらなかった結果として正しいものはどれか。","c":["両地域で弥生土器が使われた","沖縄では貝塚文化、北海道では続縄文文化が展開した","両地域で青銅器による農耕祭祀が行われた","両地域で早くから古墳が築かれた"],"a":1,"e":"両地域は採集経済段階にとどまり、縄文人の特質を濃く残した。"},{"q":"弥生時代の金属器の用途について正しいものはどれか。","c":["青銅器も鉄器も農具として使われた","鉄器は祭祀用、青銅器は実用に使われた","青銅器は祭祀用、鉄器は武具・工具・農具などの実用に使われた","金属器は装身具にのみ使われた"],"a":2,"e":"弥生時代は青銅器と鉄器が同時に伝来した金石併用時代。"},{"q":"弥生時代の墓制の変化の方向として正しいものはどれか。","c":["共同墓地から副葬品を伴う個人の墓へ","個人の墓から共同墓地へ","墳丘墓から土坑墓へ","方形周溝墓から甕棺墓へ"],"a":0,"e":"土坑墓などの共同墓地→方形周溝墓→墳丘墓へと、階級社会化に伴い個人墓が発展した。"},{"q":"弥生時代の遺跡とその特徴の組み合わせとして正しいものはどれか。","c":["加茂岩倉遺跡－高地性集落","楯築遺跡－環濠集落","紫雲出山遺跡－墳丘墓","荒神谷遺跡－358本の銅剣"],"a":3,"e":"加茂岩倉は39個の銅鐸、楯築は墳丘墓、紫雲出山は高地性集落。"},{"q":"青銅製祭器と主な分布地域の組み合わせとして正しいものはどれか。","c":["銅鐸－九州北部","平形銅剣－瀬戸内","銅矛－近畿","銅戈－瀬戸内"],"a":1,"e":"銅矛・銅戈は九州北部、平形銅剣は瀬戸内、銅鐸は近畿中心。"}],"order":[{"title":"稲作の開始からクニの成立まで","items":["水稲耕作の開始","余剰生産物の発生と貧富差・身分差","ムラどうしの対立の激化","環濠集落・高地性集落の登場","クニ（小国）の成立"],"e":"稲作→余剰→階級社会→ムラの対立→戦い→ムラを統合したクニの成立、と因果でつながる。"},{"title":"弥生時代の墓制の変化","items":["土坑墓（共同墓地）","甕棺墓・支石墓","方形周溝墓","墳丘墓"],"e":"共同墓地から方形周溝墓・墳丘墓へと、副葬品を伴う個人の墓に発展した。"}]},{"title":"中国の歴史書による「倭」","flow":[{"y":"前1世紀","t":"『漢書』地理志の倭","s":"倭人は100余りの小国に分立し、前漢の武帝が紀元前108年に設置した楽浪郡を通じて前漢に朝貢","why":"先進的な文物の入手と、倭国内での地位を高めるため皇帝の後援を求めた"},{"y":"57","t":"奴国王の遣使（『後漢書』東夷伝）","s":"後漢の都洛陽に遣使し、光武帝から印綬を授かり冊封。志賀島で「漢委奴国王」の金印発見","why":""},{"y":"107","t":"倭国王帥升の遣使","s":"安帝に生口160人を献上し冊封される","why":""},{"y":"","t":"倭国大乱（2世紀後半）","s":"桓帝・霊帝の頃、小国の間で争いが激化。近畿・瀬戸内に高地性集落が登場","why":""},{"y":"220","t":"後漢の滅亡→三国時代","s":"魏・呉・蜀が分立。朝鮮半島北部は魏が支配し楽浪郡南部から帯方郡が分立、高句麗が進出。南部は三韓が並立","why":""},{"y":"","t":"邪馬台国連合の成立（3世紀前半）","s":"約30の小国が女王卑弥呼を盟主とあおぐ。鬼道による支配、大人・下戸の身分、伊都国に一大率","why":""},{"y":"239","t":"魏への遣使","s":"帯方郡を通じ大夫難升米を洛陽に派遣。明帝から「親魏倭王」の称号と金印紫綬・銅鏡100枚","why":"南方の狗奴国と抗争中だった"},{"y":"247","t":"卑弥呼の死","s":"男王が立つが混乱→宗女で13歳の壱与（台与）が女王となり安定。共立王権の段階","why":""},{"y":"266","t":"壱与の西晋への遣使","s":"以後約150年間、中国の歴史書から倭の記載が消える","why":""},{"y":"280","t":"西晋の中国統一","s":"三国時代が終わる","why":""}],"story":"紀元前1世紀、【『漢書』地理志】によれば倭人は100余りの小国に分立し、【楽浪郡】を通じて前漢に朝貢した。先進文物の入手と倭国内での地位向上のため→小国の王は皇帝に遣使し【冊封】を受けた。【『後漢書』東夷伝】では57年に【奴国】王が光武帝から印綬を授かり（志賀島の【金印】）、107年に【帥升】が生口を献上した。2世紀後半に争いが激化して【倭国大乱】となり→高地性集落が現れた。220年に後漢が滅び【三国時代】に入り、朝鮮半島では魏のもとで【帯方郡】が分立した。3世紀前半、約30の小国が【邪馬台国】の女王【卑弥呼】を盟主とする地域連合国家を形成した（【『魏志』倭人伝】）。卑弥呼は鬼道で支配し、狗奴国と抗争中だったため→239年に帯方郡を通じて【魏】に遣使し「【親魏倭王】」の称号と銅鏡100枚を授かった。247年頃に卑弥呼が死ぬと男王で混乱し→宗女の【壱与】が女王となり安定。266年の西晋遣使を最後に約150年間倭の記載は消える。","keywords":["『漢書』地理志","楽浪郡","冊封","『後漢書』東夷伝","奴国","金印","帥升","倭国大乱","『魏志』倭人伝","邪馬台国","卑弥呼","帯方郡","親魏倭王","壱与","三韓"],"blanks":[{"q":"紀元前1世紀の倭について記す、班固が編纂した前漢の正史は『【　】』地理志である。","a":"漢書","h":"後漢の班固が紀伝体で編纂"},{"q":"前漢の武帝が紀元前108年に設置した4郡の一つで、倭人が朝貢の際に通った現在の平壌付近の郡は【　】である。","a":"楽浪郡","h":"のち南部から帯方郡が分立"},{"q":"中国の皇帝に遣使し、ある地域の王に任命されることを【　】という。","a":"冊封","h":"先進文物の入手と国内での地位向上が目的"},{"q":"1〜2世紀の倭について記す、范曄が編纂した後漢の正史は『【　】』東夷伝である。","a":"後漢書","h":"5世紀に宋の范曄が編纂"},{"q":"57年、倭の【　】の王が後漢の光武帝から印綬を授かった。","a":"奴国","h":"金印「漢委奴国王」"},{"q":"江戸時代に福岡県志賀島で発見された金印には「【　】」と刻まれている。","a":"漢委奴国王","h":"光武帝から授かったとされる"},{"q":"107年、倭国王【　】らが安帝に生口160人を献上した。","a":"帥升","h":"生口は奴隷のこと"},{"q":"2世紀後半、桓帝・霊帝の頃に倭で小国の間の争いが激しくなった状態を【　】という。","a":"倭国大乱","h":"近畿・瀬戸内に高地性集落が登場"},{"q":"3世紀、魏の支配下で楽浪郡の南部から分立した、現在のソウル付近の郡は【　】である。","a":"帯方郡","h":"卑弥呼はこの郡を通じて魏に遣使"},{"q":"約30の小国からなる邪馬台国連合の盟主となった女王は【　】である。","a":"卑弥呼","h":"鬼道と呼ばれる呪術で支配"},{"q":"239年、卑弥呼は魏の明帝から「【　】」の称号と金印紫綬・銅鏡100枚を授かった。","a":"親魏倭王","h":"帯方郡を通じ難升米を派遣"},{"q":"卑弥呼の死後、宗女で13歳の【　】が女王となり混乱が収まった。","a":"壱与","h":"台与とも書く。266年に西晋へ遣使"}],"mc":[{"q":"倭の小国の王が中国の皇帝に朝貢した目的として最も適当なものはどれか。","c":["中国から稲作技術を初めて導入するため","先進的な文物を入手し、倭国内での地位を高めるため皇帝の後援を求めた","中国の領土に組み込まれるため","邪馬台国の位置を中国に認めてもらうため"],"a":1,"e":"冊封を受けることで、ほかの小国よりも倭国内での地位を高めようとした。"},{"q":"2世紀後半の倭国大乱の結果として正しいものはどれか。","c":["前漢への朝貢が始まった","奴国王が金印を授かった","西晋が中国を統一した","近畿や瀬戸内に高地性集落が登場した"],"a":3,"e":"小国間の争いが激しくなり、防御的な高地性集落が現れた。"},{"q":"帯方郡が成立した背景として最も適当なものはどれか。","c":["魏の支配下で楽浪郡の南部から分立した","前漢の武帝が紀元前108年に設置した","高句麗が丸都に首都を置いた","三韓のうち馬韓が設置した"],"a":0,"e":"3世紀、朝鮮半島北部を支配した魏のもとで楽浪郡南部から帯方郡（現在のソウル付近）が分立した。"},{"q":"239年に卑弥呼が魏に遣使した当時の倭の状況として正しいものはどれか。","c":["倭国大乱の最中だった","壱与が女王として統治していた","南方の狗奴国と抗争中だった","後漢に朝貢していた"],"a":2,"e":"狗奴国との抗争中に帯方郡を通じて魏に遣使し、親魏倭王の称号を授かった。"},{"q":"卑弥呼の死後の経過として正しいものはどれか。","c":["弟が王となり安定した","男王が立つが混乱し、宗女の壱与が女王となって安定した","狗奴国が邪馬台国を滅ぼした","魏が一大率を派遣して直接統治した"],"a":1,"e":"247年頃の卑弥呼の死後、男王では混乱し、壱与が女王となった。いまだ共立王権の段階だった。"},{"q":"中国の歴史書と記述内容の組み合わせとして正しいものはどれか。","c":["『漢書』地理志－卑弥呼の遣使","『魏志』倭人伝－奴国王の遣使","『後漢書』東夷伝－倭人の100余国への分立","『後漢書』東夷伝－倭国王帥升の遣使"],"a":3,"e":"『漢書』地理志は紀元前1世紀の100余国、『後漢書』東夷伝は57年・107年の遣使と倭国大乱、『魏志』倭人伝は卑弥呼。"},{"q":"邪馬台国連合の統治について正しいものはどれか。","c":["伊都国に一大率という役人を派遣した","身分制度はなく平等社会だった","租税・刑罰制度はなかった","卑弥呼が自ら政治を行い、弟は存在しなかった"],"a":0,"e":"大人・下戸などの身分制度、一大率・大倭という役人、租税・刑罰制度があり、弟が政治を補佐した。"},{"q":"266年の壱与による西晋への遣使の後に起こったこととして正しいものはどれか。","c":["後漢が滅亡した","奴国王が光武帝から印綬を授かった","約150年間、中国の歴史書から倭の記載が消えた","楽浪郡が設置された"],"a":2,"e":"266年以降、4世紀にかけて中国の歴史書に倭の記事がなくなる。"}],"order":[{"title":"倭の中国への遣使","items":["奴国王の後漢への遣使（57年）","倭国王帥升の遣使（107年）","倭国大乱（2世紀後半）","卑弥呼の魏への遣使（239年）","壱与の西晋への遣使（266年）"],"e":"後漢への遣使→倭国大乱→邪馬台国連合の成立→魏・西晋への遣使の順。"},{"title":"中国王朝の変遷","items":["前漢","後漢","三国時代（魏・呉・蜀）","西晋の統一"],"e":"前漢→後漢（220年滅亡）→三国時代（220〜280年）→西晋が280年に統一。"},{"title":"邪馬台国連合の成立から動揺・再建まで","items":["邪馬台国連合の成立","魏への遣使と「親魏倭王」","卑弥呼の死と男王の混乱","壱与の即位と安定"],"e":"3世紀前半に成立→239年に魏へ遣使→247年頃卑弥呼死去→壱与が女王となり安定。"}]},{"title":"資料・史料と原始・古代","flow":[{"y":"","t":"原始は考古資料頼み","s":"文字史料がない時代の研究は考古資料に頼る","why":""},{"y":"1946","t":"岩宿遺跡の発見","s":"アマチュアの相沢忠洋が発見し、専門家の「思い込み」を打ち破った","why":""},{"y":"1949","t":"明治大学による調査","s":"明治大学文学部考古学研究室が調査。以後約1万か所の旧石器遺跡が発見","why":""},{"y":"2000","t":"旧石器発掘捏造事件","s":"アマチュアによる捏造が発覚。考古資料頼みの落とし穴","why":""},{"y":"","t":"三角縁神獣鏡は「卑弥呼の鏡」か？","s":"同笵鏡が各地で出土（椿井大塚山・黒塚古墳）、中国では未発見、330枚以上で多すぎる","why":"『魏志』倭人伝の銅鏡100枚と結びつけるには疑問が残るため"},{"y":"","t":"木簡からわかること","s":"藤原京木簡で郡評論争が決着、長屋王邸木簡で貢進物、大宰府・多賀城木簡で地方統治","why":""},{"y":"","t":"倭を記す中国の歴史書","s":"『漢書』地理志（前1世紀）、『後漢書』東夷伝（1〜2世紀）、『魏志』倭人伝（3世紀）","why":""},{"y":"391","t":"好太王（広開土王）碑文の辛卯の年","s":"高句麗の長寿王が鴨緑江沿岸に建てた碑。倭が海を渡り百残・新羅を臣民とした、と記す。真贋は判明していない","why":""},{"y":"","t":"古代日本の金石文","s":"稲荷山古墳出土鉄剣銘（埼玉県）、江田船山古墳出土鉄刀銘（熊本県）","why":""},{"y":"","t":"客観的史料と主観的史料","s":"『正倉院文書』（廃棄戸籍の裏紙に写経）と『御堂関白記』（藤原道長、世界の記憶）","why":""}],"story":"文字のない原始の研究は【考古資料】に頼る。戦前は縄文以前に人類はいないとされたが→1946年アマチュアの【相沢忠洋】が【岩宿遺跡】を発見し→1949年の調査で専門家の「思い込み」が打ち破られ→以後約1万か所の旧石器遺跡が見つかった。しかし2000年に【旧石器発掘捏造事件】も起こり、考古資料頼みには落とし穴がある。古代では文献史料と考古資料を突き合わせる。【三角縁神獣鏡】は「卑弥呼の鏡」とされるが、中国で未発見かつ330枚以上と多すぎるため→『魏志』倭人伝の銅鏡100枚と結びつけるには疑問が残る。【木簡】は藤原京出土のもので【郡評論争】を決着させ、長屋王邸のものから貢進物、大宰府・多賀城のものから地方統治がわかる。文献史料には中国の歴史書のほか高句麗の【好太王碑文】（【辛卯の年】＝391年）があり、金石文には【稲荷山古墳出土鉄剣銘】・【江田船山古墳出土鉄刀銘】がある。古代の文献史料は客観的な【『正倉院文書』】と主観的な【『御堂関白記』】に分けられる。","keywords":["考古資料","岩宿遺跡","相沢忠洋","旧石器発掘捏造事件","三角縁神獣鏡","同笵鏡","木簡","郡評論争","好太王碑文","辛卯の年","稲荷山古墳出土鉄剣銘","江田船山古墳出土鉄刀銘","正倉院文書","御堂関白記"],"blanks":[{"q":"1946年、アマチュアの相沢忠洋が発見し、専門家の「思い込み」を打ち破った遺跡は【　】である。","a":"岩宿遺跡","h":"1949年に明治大学が調査"},{"q":"2000年に発覚した、アマチュアによる旧石器の【　】事件は考古資料頼みの落とし穴を示した。","a":"発掘捏造","h":"旧石器発掘捏造事件"},{"q":"「卑弥呼の鏡」かどうか議論される、各地の古墳から出土する銅鏡は【　】である。","a":"三角縁神獣鏡","h":"330枚以上発見されている"},{"q":"同じ鋳型を用いて鋳造した鏡を【　】という。","a":"同笵鏡","h":"椿井大塚山古墳・黒塚古墳などで出土"},{"q":"「景初三年」銘のある三角縁神獣鏡が出土した島根県の古墳は【　】である。","a":"神原神社古墳","h":"卑弥呼の受けた鏡と推定する説もある"},{"q":"藤原京出土の木簡などにより、『日本書紀』の記述をめぐる【　】は決着した。","a":"郡評論争","h":"木簡から判ることの例"},{"q":"平城宮・【　】邸出土の木簡から貢進物を読み解くことができる。","a":"長屋王","h":"大宰府・多賀城の木簡は地方統治"},{"q":"高句麗の【　】碑文は、倭が海を渡って百残・新羅を臣民とした、と記す。","a":"好太王","h":"広開土王ともいう。子の長寿王が建てた"},{"q":"好太王碑文に記された391年は【　】の年にあたる。","a":"辛卯","h":"干支"},{"q":"埼玉県の【　】古墳から出土した鉄剣銘は、古代日本の金石文の例である。","a":"稲荷山","h":"熊本県は江田船山古墳出土鉄刀銘"},{"q":"廃棄する戸籍の裏紙に写経した、古代日本の客観的文献史料の例は『【　】』である。","a":"正倉院文書","h":"主観的史料は『御堂関白記』"},{"q":"藤原道長の日記で、ユネスコ「世界の記憶」に登録された主観的文献史料は『【　】』である。","a":"御堂関白記","h":"古代日本の主観的文献史料の例"}],"mc":[{"q":"原始（先史）の研究が考古資料に頼らざるを得ない理由として最も適当なものはどれか。","c":["遺跡がほとんど残っていないため","中国の歴史書が信用できないため","文字史料が存在しないため","年代測定法が使えないため"],"a":2,"e":"文字のない時代は考古資料に頼って研究するが、落とし穴もある。"},{"q":"三角縁神獣鏡を「卑弥呼の鏡」とすることに疑問がある根拠として最も適当なものはどれか。","c":["中国では1枚も発見されておらず、330枚以上と多すぎる","日本でまだ1枚も出土していない","『魏志』倭人伝に銅鏡の記述がない","すべて鉄製で青銅製ではない"],"a":0,"e":"『魏志』倭人伝の銅鏡100枚に対し、日本で330枚以上出土し中国で未発見のため疑問が残る。"},{"q":"木簡と、そこから判明することの組み合わせとして正しいものはどれか。","c":["長屋王邸出土木簡－地方統治","多賀城出土木簡－貢進物","大宰府出土木簡－郡評論争の決着","藤原京出土木簡－郡評論争の決着"],"a":3,"e":"藤原京木簡は郡評論争、長屋王邸木簡は貢進物、大宰府・多賀城木簡は地方統治。"},{"q":"岩宿遺跡の発見が歴史研究に与えた意義として最も適当なものはどれか。","c":["文献史料と考古資料の一致を示した","アマチュアの発見が専門家の「思い込み」を打ち破った","邪馬台国が近畿にあることを証明した","旧石器の捏造を明らかにした"],"a":1,"e":"戦前の専門家は縄文以前に人類はいないと考えていたが、アマチュアの相沢忠洋の発見で覆った。"},{"q":"好太王（広開土王）碑文について正しいものはどれか。","c":["百済の王が建てた石碑である","真贋が確定した信頼できる史料である","好太王の子の長寿王が鴨緑江沿岸に建て、真贋は判明していない","『魏志』倭人伝と同じ3世紀の倭を記す"],"a":2,"e":"高句麗の長寿王が中国吉林省に建てた碑で、辛卯の年（391年）の倭の動きを記すが真贋は不明。"},{"q":"古代日本の史料の性格について正しいものはどれか。","c":["『正倉院文書』は客観的史料、『御堂関白記』は主観的史料である","『正倉院文書』は主観的史料、『御堂関白記』は客観的史料である","両者とも中世の歴史書である","両者とも金石文である"],"a":0,"e":"『正倉院文書』は廃棄戸籍の裏紙に写経した記録、『御堂関白記』は藤原道長の日記。"},{"q":"2000年の旧石器発掘捏造事件が示すこととして最も適当なものはどれか。","c":["岩宿遺跡の発見も捏造だった","旧石器時代の遺跡は日本に存在しない","考古学は専門家だけが行うべきである","文字史料のない原始の研究は考古資料頼みで落とし穴がある"],"a":3,"e":"考古資料に頼る原始の研究には落とし穴があり、古代では文献史料と突き合わせて考察する。"}],"order":[{"title":"旧石器研究の歩み","items":["縄文以前に人類はいないという戦前の通説","相沢忠洋による岩宿遺跡の発見（1946年）","明治大学による学術調査（1949年）","旧石器発掘捏造事件（2000年）"],"e":"通説→アマチュアの発見→学術調査で確定→捏造事件という落とし穴、の順。"},{"title":"倭について記す史料の時代順","items":["『漢書』地理志","『後漢書』東夷伝","『魏志』倭人伝","好太王（広開土王）碑文"],"e":"紀元前1世紀→1〜2世紀→3世紀→辛卯の年（391年）の順で倭を記す。"}]}],"review":[{"q":"旧石器時代から縄文時代にかけて狩猟の対象が大型動物から中小動物へ変化した原因として最も適当なものはどれか。","c":["稲作の開始で家畜の飼育が始まったため","気候の温暖化で森林が形成され、大型動物が絶滅し中小動物が増加したため","渡来人が中小動物を持ち込んだため","弓矢の発明で大型動物が狩り尽くされたため"],"a":1,"e":"更新世から完新世への温暖化で植物相が変わり、動きの速い中小動物が増えたため弓矢が登場した。"},{"q":"縄文文化と弥生文化の経済段階の違いとして正しいものはどれか。","c":["縄文は採集経済、弥生は水稲耕作による生産経済","縄文は生産経済、弥生は採集経済","両者とも本格的な農耕を行わない採集経済","両者とも稲作中心の生産経済"],"a":0,"e":"縄文は狩猟・漁労・採集中心、弥生は稲作と金属器の伝来で生産経済段階に入った。"},{"q":"『漢書』地理志に「倭人は100余りの小国に分立」と記される状況が生まれた流れとして最も適当なものはどれか。","c":["中国の皇帝が倭を100の国に分割したため","邪馬台国連合が分裂したため","稲作による余剰生産物から階級社会が生まれ、ムラどうしの対立を経てクニが各地に成立したため","縄文時代の平等社会がそのまま続いたため"],"a":2,"e":"弥生時代のクニの成立が、紀元前1世紀の小国分立という中国の歴史書の記述につながる。"},{"q":"2世紀後半に近畿や瀬戸内で高地性集落が登場した背景として最も適当なものはどれか。","c":["卑弥呼が魏から親魏倭王の称号を受けたため","『後漢書』東夷伝に記された倭国大乱で小国間の争いが激化したため","後漢が滅亡して三国時代に入ったため","壱与が西晋に遣使したため"],"a":1,"e":"桓帝・霊帝の頃の倭国大乱は考古学的には高地性集落の登場と対応する。"},{"q":"三角縁神獣鏡と『魏志』倭人伝の関係について正しいものはどれか。","c":["『魏志』倭人伝に三角縁神獣鏡の名が明記されている","中国で多数出土しているため卑弥呼の鏡と確定した","卑弥呼が授かった銅鏡100枚との説があるが、中国で未発見で数も多すぎるため疑問が残る","好太王碑文に卑弥呼の鏡と記されている"],"a":2,"e":"文献史料（銅鏡100枚）と考古資料（330枚以上・中国で未発見）を突き合わせると単純には結びつかない。"},{"q":"岩宿遺跡の発見の前後で、日本の歴史研究はどう変化したか。最も適当なものはどれか。","c":["縄文時代より前に人類はいないという通説が覆り、旧石器時代の遺跡が1万か所以上発見された","邪馬台国の位置が九州説に決まった","縄文土器の年代が完新世以降と確定した","稲作の開始が弥生時代からと確定した"],"a":0,"e":"1946年の相沢忠洋の発見と1949年の学術調査により、日本にも旧石器時代が存在することが確定した。"}]},{"id":2,"title":"中央集権国家「日本」の成立","era":"古墳時代〜飛鳥時代","span":"3世紀中頃〜702","oneLine":"豪族連合のヤマト政権が、東アジアの緊張の中で天皇中心の律令国家へと変わった","chain":["倭の五王（武＝雄略天皇）","蘇我馬子","厩戸皇子（推古朝）","中大兄皇子（孝徳・斉明朝）","天智天皇","天武天皇","持統天皇","文武天皇"],"parts":[{"title":"PART1 ヤマト政権の成立","flow":[{"y":"3世紀中頃","t":"古墳の出現","s":"近畿中央部〜瀬戸内海沿岸で、弥生時代の墳丘墓から古墳へ発展。畿内・西日本は前方後円墳、東日本は前方後方墳が多い","why":"有力な個人の墓として、統一的な墓制が広まったため"},{"y":"","t":"前期古墳の特徴","s":"墳丘上に埴輪、竪穴式石室や粘土槨に埋葬。三角縁神獣鏡・腕輪型石製品・勾玉など呪術的・宗教的な副葬品（被葬者は司祭者的性格）。代表は箸墓・黒塚・椿井大塚山","why":""},{"y":"313","t":"高句麗の南下","s":"楽浪郡、翌年に帯方郡を滅ぼして三韓を圧迫","why":"中国が東晋・五胡十六国から南北朝時代に入り、周辺地域への支配力が弱まったため"},{"y":"4世紀半ば","t":"百済・新羅の成立","s":"馬韓から百済、辰韓から新羅が統一国家を形成。弁韓は加耶（加羅）諸国として小国分立が続く","why":""},{"y":"4世紀中頃","t":"ヤマト政権の成立","s":"大和を中心に、遅くとも4世紀中頃までに九州の一部〜中部地方を統一。大王を中心とする有力豪族の連合政権で、世襲王権制をとる","why":""},{"y":"391","t":"倭の朝鮮半島進出（好太王碑）","s":"辛卯の年以降、倭が南下してきた高句麗と交戦して敗れたと好太王（広開土王）碑に刻まれる","why":"先進技術と鉄資源を獲得するため"},{"y":"5世紀","t":"倭の五王の南朝朝貢","s":"讃・珍・済・興・武が中国の南朝に朝貢し、冊封体制に組み込まれる。男子による世襲王権制が確立","why":"朝鮮半島南部における外交・軍事上の立場を優位にするため"},{"y":"478","t":"倭王武の上表文","s":"倭王武（雄略天皇＝ワカタケル大王）が宋の順帝に上表文を送る（『宋書』倭国伝）","why":""},{"y":"5世紀","t":"古墳の巨大化と暮らしの変化","s":"畿内の平地で前方後円墳が巨大化、勢力範囲は九州の大半〜東北の一部へ。カマドの設置、須恵器の使用が始まる","why":""}],"story":"3世紀中頃、近畿を中心に【前方後円墳】などの【古墳】が出現し、竪穴式石室に三角縁神獣鏡などの呪術的な副葬品を納めた。これは被葬者が司祭者的性格をもっていたことを表す。大和を本拠とする【大王】を中心に有力豪族が連合した【ヤマト政権】は、邪馬台国連合の共立王権とは違い世襲王権制をとった。同じころ中国は南北朝時代に入り周辺への支配力が弱まった→【高句麗】が313年に楽浪郡を滅ぼして南下し、馬韓から【百済】、辰韓から【新羅】が成立した。倭は先進技術と鉄資源を得るため朝鮮半島に進出→【391年】以降に高句麗と交戦して敗れた（【好太王碑】）。そこで朝鮮半島南部での立場を有利にするため、5世紀には【倭の五王】が南朝に朝貢して冊封を受け、【478年】には倭王【武】が順帝に上表文を送った（『【宋書】』倭国伝）。","keywords":["前方後円墳","竪穴式石室","三角縁神獣鏡","箸墓古墳","土師器","須恵器","三ツ寺Ⅰ遺跡","高句麗","百済","新羅","加耶","好太王碑","倭の五王","『宋書』倭国伝","ワカタケル大王"],"blanks":[{"q":"前期古墳は畿内・西日本を中心に【　】が多く、東日本では前方後方墳が多い。","a":"前方後円墳","h":"ヤマト政権の象徴とされる形式"},{"q":"前期古墳では【　】石室や粘土槨に埋葬され、呪術的・宗教的な副葬品が出土する。","a":"竪穴式","h":"後期に一般化する横穴式ではない"},{"q":"前期古墳の副葬品である【　】などの銅鏡は、被葬者の司祭者的性格を表す。","a":"三角縁神獣鏡","h":"腕輪型石製品・勾玉とともに出土"},{"q":"代表的な前期古墳には奈良県の【　】古墳や黒塚古墳、京都府の椿井大塚山古墳がある。","a":"箸墓","h":"卑弥呼の墓という説もある"},{"q":"群馬県の【　】遺跡は、周囲に環濠・柵列をめぐらした豪族の居館である。","a":"三ツ寺Ⅰ","h":"庶民の集落は同じ群馬県の黒井峯遺跡"},{"q":"5世紀以降、朝鮮半島から伝わった硬質で灰褐色の【　】が使われるようになった。","a":"須恵器","h":"弥生土器の系譜を引く赤褐色の土器は土師器"},{"q":"ヤマト政権は大和地方に本拠を持つ【　】を中心とした有力豪族の連合政権である。","a":"大王","h":"邪馬台国連合と違い世襲王権制をとった"},{"q":"313年、【　】が楽浪郡を滅ぼし、翌年に帯方郡を滅ぼして南下した。","a":"高句麗","h":"朝鮮半島北部の国"},{"q":"4世紀半ば、馬韓から【　】、辰韓から新羅が統一国家を形成した。","a":"百済","h":"のち仏教を倭に伝える国"},{"q":"弁韓は【　】諸国と呼ばれ、小国分立の状態が続いた。『日本書紀』ではこれを任那と呼ぶ。","a":"加耶","h":"加羅とも書く"},{"q":"【　】碑には、391年以降に倭が高句麗と交戦して敗れたと刻まれている。","a":"好太王","h":"広開土王碑ともいう。中国吉林省にある"},{"q":"『【　】』倭国伝には、478年に倭王武が順帝に上表文を送ったことが記されている。","a":"宋書","h":"南朝の沈約が編纂した宋の正史"}],"mc":[{"q":"倭が4世紀末以降に朝鮮半島に進出した目的として最も適当なものはどれか。","c":["冊封体制からの離脱のため","先進技術と鉄資源を獲得するため","仏教を導入するため","高句麗と同盟を結ぶため"],"a":1,"e":"先進技術と鉄資源の獲得が目的で、その結果、南下してきた高句麗と交戦して敗れた（好太王碑）。"},{"q":"倭の五王が中国の南朝に朝貢した理由として最も適当なものはどれか。","c":["朝鮮半島南部での外交・軍事上の立場を有利にするため","隋との対等外交を実現するため","楽浪郡を再建するため","邪馬台国連合を復活させるため"],"a":0,"e":"朝鮮半島南部での立場を優位にするため南朝に朝貢し、冊封体制に組み込まれた。"},{"q":"前期古墳の副葬品と、そこから読み取れる被葬者の性格の組み合わせとして正しいものはどれか。","c":["鉄製武器・甲冑－武人的性格","三角縁神獣鏡・勾玉－司祭者的性格","土器・農具－農民的性格","馬具・冠－騎馬民族的性格"],"a":1,"e":"前期は呪術的・宗教的な副葬品が中心で司祭者的性格を表す。武器・甲冑は中期以降に増える。"},{"q":"ヤマト政権が邪馬台国連合と異なる点として正しいものはどれか。","c":["女王を共立して王とした","中国の魏に朝貢した","大王による世襲王権制をとった","九州北部のみを支配した"],"a":2,"e":"邪馬台国連合の共立王権制に対し、ヤマト政権は世襲王権制をとった。"},{"q":"4世紀の朝鮮半島で高句麗が南下できた背景として最も適当なものはどれか。","c":["新羅が高句麗に従属したため","中国が南北朝に分かれて周辺への支配力が弱まったため","倭が楽浪郡を滅ぼしたため","百済が高句麗と同盟したため"],"a":1,"e":"東晋・五胡十六国から南北朝へと移り中国の支配力が弱まったため、313年に高句麗が楽浪郡を滅ぼして南下した。"},{"q":"4世紀半ばの朝鮮半島南部の状況として正しいものはどれか。","c":["馬韓から新羅、辰韓から百済が成立した","弁韓は統一国家を形成し任那と称した","馬韓から百済、辰韓から新羅が成立し、弁韓は小国分立が続いた","三韓すべてを高句麗が併合した"],"a":2,"e":"馬韓→百済、辰韓→新羅。弁韓は加耶（加羅）諸国として小国分立の状態が続いた。"},{"q":"『宋書』倭国伝の記述として正しいものはどれか。","c":["卑弥呼が魏に朝貢したことが記されている","倭王武が478年に順帝に上表文を送ったことが記されている","小野妹子が煬帝に国書を送ったことが記されている","倭の奴国王が光武帝から印綬を受けたことが記されている"],"a":1,"e":"昇明二年（478年）、倭王武（雄略天皇＝ワカタケル大王）が順帝に上表文を送ったと記される。"}],"order":[{"title":"4〜5世紀の東アジアと倭","items":["高句麗が楽浪郡を滅ぼす","馬韓から百済・辰韓から新羅が成立","倭が高句麗と交戦して敗れる（好太王碑）","倭の五王が南朝に朝貢","倭王武が順帝に上表文を送る"],"e":"313年の高句麗南下→4世紀半ばに百済・新羅成立→391年以降の高句麗との交戦→5世紀の五王の朝貢→478年の上表文。"},{"title":"墓制と暮らしの変化","items":["弥生時代の墳丘墓","前方後円墳の出現（前期古墳）","畿内の平地で前方後円墳が巨大化","須恵器の使用・竪穴住居へのカマド設置"],"e":"3世紀中頃に墳丘墓から古墳へ発展し、5世紀に巨大化。カマドや須恵器も5世紀に広まった。"}]},{"title":"PART2 ヤマト政権の発展","flow":[{"y":"4世紀末〜5世紀","t":"渡来人の伝説と品部","s":"王仁（西文氏の祖）・阿知使主（東漢氏の祖）・弓月君（秦氏の祖）。錦織部・韓鍛冶部・陶作部などの技術者集団が活躍","why":"中国・朝鮮半島から先進技術が伝わったため"},{"y":"5世紀","t":"漢字の使用","s":"稲荷山古墳出土鉄剣銘（埼玉県）・江田船山古墳出土鉄刀銘（熊本県）にワカタケル大王の名。日本語表記の始まり","why":""},{"y":"4世紀末〜5世紀","t":"中期古墳","s":"大阪平野で大王の前方後円墳が巨大化（大仙陵・誉田御廟山）。鉄製武器・甲冑・馬具など軍事的副葬品が増え、被葬者は武人的性格に","why":"ヤマト政権の勢力拡大と、朝鮮半島での戦いを通じた軍事化のため"},{"y":"5〜6世紀","t":"氏姓制度と部民制","s":"氏（擬制的血縁集団）に大王が姓（臣・連・君・直など）を授ける。朝廷は屯倉・名代・子代、豪族は田荘・部曲を所有","why":"大王を中心に畿内有力豪族を組織化するため"},{"y":"512","t":"任那四県の割譲","s":"ヤマト政権が百済に任那四県を割譲","why":"高句麗・新羅が強大化し、朝鮮半島経営が衰退したため"},{"y":"527","t":"磐井の乱","s":"筑紫国造磐井が新羅と結んで反乱。継体天皇が大連の物部麁鹿火に命じて鎮圧","why":""},{"y":"538","t":"仏教の伝来","s":"百済の聖明王から欽明天皇へ（戊午説538年・壬申説552年）。崇仏派の蘇我稲目と排仏派の物部尾輿が崇仏論争","why":""},{"y":"562","t":"加耶諸国の滅亡","s":"新羅により加耶諸国が滅亡し、ヤマト政権は朝鮮半島での影響力を著しく後退させた","why":""},{"y":"587","t":"蘇我馬子が物部守屋を滅ぼす","s":"三蔵の管理・渡来人との連携・大王家との婚姻で勢力を伸ばした蘇我氏が、大連の物部守屋を滅ぼし独裁へ","why":"崇仏論争以来の蘇我氏と物部氏の対立のため"},{"y":"592","t":"崇峻天皇の暗殺","s":"蘇我馬子が崇峻天皇を暗殺し、姪の炊屋姫を初の女帝・推古天皇として擁立。6〜7世紀の後期古墳では横穴式石室・群集墳が広まり、7世紀後半に古墳は消滅へ","why":""}],"story":"中国・朝鮮半島から【渡来人】が先進技術を伝え、【王仁】（西文氏の祖）・阿知使主・弓月君らの伝説が残る。彼らは【品部】として組織され、【漢字】の使用も始まった（【稲荷山古墳出土鉄剣銘】）。ヤマト政権は【氏姓制度】で豪族を組織し、【臣】・【連】などの姓を与え、朝廷は【屯倉】、豪族は田荘・【部曲】を所有する私地私民制をとった。しかし高句麗・新羅の強大化により朝鮮半島経営は衰退→512年に任那四県を百済に割譲、527年には【磐井】が新羅と結んで反乱、562年に【加耶諸国】が滅亡した。一方、【仏教】が百済の聖明王から欽明天皇へ伝わると、崇仏派の蘇我稲目と排仏派の物部尾輿が対立→587年に【蘇我馬子】が物部守屋を滅ぼし、592年には崇峻天皇を暗殺して【推古天皇】を擁立し、独裁を確立した。古墳は中期に武人的性格を強め、後期に【横穴式石室】が広まったが、薄葬令などで7世紀後半に消滅した。","keywords":["王仁","品部","稲荷山古墳出土鉄剣銘","仏教伝来","氏姓制度","臣・連","国造","屯倉","部曲","磐井の乱","蘇我馬子","物部守屋","横穴式石室","群集墳","薄葬令","盟神探湯","大神神社"],"blanks":[{"q":"西文氏の祖とされる渡来人は【　】である。","a":"王仁","h":"阿知使主は東漢氏、弓月君は秦氏の祖"},{"q":"渡来人系の技術者集団は錦織部・韓鍛冶部などの【　】として組織された。","a":"品部","h":"伴造のもとの部"},{"q":"埼玉県の【　】古墳出土鉄剣銘には、ワカタケル大王の名が刻まれている。","a":"稲荷山","h":"熊本県は江田船山古墳出土鉄刀銘"},{"q":"仏教は【　】の聖明王から欽明天皇へ公式に伝えられた。","a":"百済","h":"戊午説は538年、壬申説は552年"},{"q":"氏のヤマト政権内における世襲的な政治的地位を示す称号を【　】といい、大王が授けた。","a":"姓","h":"臣・連・君・直など"},{"q":"大伴・物部・中臣など、特定の職務で大王に仕える有力豪族には【　】の姓が与えられた。","a":"連","h":"葛城・蘇我などの自立的豪族は臣"},{"q":"地方は大王―【　】・県主・稲置という支配のしくみをとった。","a":"国造","h":"地方豪族が任じられた"},{"q":"朝廷は直轄地として【　】を設け、田部に耕作させた。","a":"屯倉","h":"直属民は名代・子代の部"},{"q":"豪族は私有地として田荘、私有民として【　】を所有した。","a":"部曲","h":"675年に天武天皇が廃止する"},{"q":"527年、筑紫国造【　】が新羅と結んでヤマト政権に反乱を起こした。","a":"磐井","h":"物部麁鹿火が鎮圧。岩戸山古墳がその墓か"},{"q":"587年、大臣の【　】が大連の物部守屋を滅ぼした。","a":"蘇我馬子","h":"592年には崇峻天皇を暗殺"},{"q":"後期古墳では朝鮮半島から伝来した【　】石室が一般化し、家族墓的性格をもつようになった。","a":"横穴式","h":"日常生活用の副葬品が増加"}],"mc":[{"q":"6世紀にヤマト政権の朝鮮半島での影響力が後退した背景として最も適当なものはどれか。","c":["唐が朝鮮半島に進出したため","高句麗・新羅が強大化し、任那四県割譲や加耶諸国の滅亡が続いたため","倭の五王が南朝への朝貢をやめたため","百済が倭と断交したため"],"a":1,"e":"高句麗・新羅の強大化→512年任那四県割譲→562年に新羅が加耶諸国を滅ぼし、拠点を失った。"},{"q":"蘇我氏が急激に勢力を伸ばした要因として誤っているものはどれか。","c":["三蔵を管理して財政を把握した","渡来人系氏族と連携して技術力を高めた","大王家との婚姻を通じて結びついた","新羅と結んで反乱を起こした"],"a":3,"e":"新羅と結んで反乱したのは筑紫国造磐井。蘇我氏は財政・技術・婚姻で勢力を伸ばした。"},{"q":"587年に蘇我馬子が物部守屋を滅ぼした背景として最も適当なものはどれか。","c":["仏教受容をめぐる崇仏派と排仏派の対立","任那四県割譲をめぐる責任問題","冠位十二階の授与をめぐる争い","遣隋使の派遣をめぐる対立"],"a":0,"e":"崇仏派の蘇我稲目と排仏派の物部尾輿の対立が子の馬子と守屋に引き継がれた。"},{"q":"氏姓制度の説明として正しいものはどれか。","c":["姓は各氏が自ら名乗った家柄の呼称である","臣は特定の職務で大王に仕える豪族に与えられた","姓は大王が氏に授ける世襲的な政治的地位の称号である","君は畿内の自立的有力豪族に与えられた"],"a":2,"e":"姓は大王が授ける。臣は自立的有力豪族、連は職務で仕える豪族、君は有力地方豪族。"},{"q":"中期古墳で軍事的な副葬品が増えた理由として、テキストの説明に最も近いものはどれか。","c":["被葬者が司祭者的性格を強めたため","被葬者が武人的性格を強めたため","古墳を死後の生活の場と考えたため","仏教思想が流入したため"],"a":1,"e":"中期は鉄製武器・甲冑・馬具が増え、被葬者の武人的性格を表す。日常品の増加は後期。"},{"q":"7世紀後半に古墳が消滅していった理由として誤っているものはどれか。","c":["大化の薄葬令により豪族の古墳築造が減った","仏教思想の流入で火葬が始まった","豪族の権威誇示の手段が氏寺建立に変化した","横穴式石室の伝来で家族墓が禁止された"],"a":3,"e":"横穴式石室は後期に一般化した埋葬施設で、古墳消滅の理由ではない。"},{"q":"ヤマト政権の経済基盤の説明として正しいものはどれか。","c":["朝廷の直轄地は田荘、豪族の私有地は屯倉である","朝廷の直轄地は屯倉、豪族の私有地は田荘である","豪族は部曲を持たず、名代・子代のみを支配した","公地公民制が原則で私有地は認められなかった"],"a":1,"e":"朝廷は屯倉（田部が耕作）・名代・子代、豪族は田荘・部曲を所有する私地私民制だった。"},{"q":"後期古墳の説明として正しいものはどれか。","c":["地方でも巨大前方後円墳が盛んに築造された","円墳・方墳が激増し、築造者は有力農民にも拡大した","副葬品は呪術的なものが中心となった","竪穴式石室が新たに登場した"],"a":1,"e":"後期は各地に円墳・方墳が激増し群集墳が登場、横穴式石室が一般化した。"}],"order":[{"title":"ヤマト政権の動揺","items":["百済に任那四県を割譲","筑紫国造磐井の反乱","新羅により加耶諸国が滅亡","蘇我馬子が物部守屋を滅ぼす","蘇我馬子が崇峻天皇を暗殺"],"e":"512年割譲→527年磐井の乱→562年加耶滅亡→587年守屋滅亡→592年崇峻暗殺。"},{"title":"古墳の変遷","items":["前方後円墳の出現（司祭者的副葬品）","大阪平野で前方後円墳が巨大化（軍事的副葬品）","横穴式石室・群集墳の登場","大王の墓が八角墳になる","古墳の消滅"],"e":"前期→中期→後期→7世紀中頃の八角墳→薄葬令などで7世紀後半に消滅。"},{"title":"大陸文化の受容","items":["渡来人の伝説（王仁ら）","ワカタケル大王の鉄剣銘（漢字の使用）","百済から五経博士の渡来","仏教の公式伝来（欽明天皇）","崇仏論争（蘇我稲目と物部尾輿）"],"e":"4世紀末〜5世紀の渡来人→5世紀の漢字使用→6世紀の儒教・仏教伝来→崇仏論争。"}]},{"title":"PART3 中央集権国家の準備","flow":[{"y":"589","t":"隋の南北朝統一","s":"北朝の隋が南朝の陳を滅ぼす。598年には高句麗征討を開始","why":""},{"y":"593","t":"厩戸皇子の摂政就任","s":"崇峻天皇暗殺の翌年、叔母の推古天皇の摂政・皇太子となり、蘇我馬子との二頭政治が始まる。以降を飛鳥時代と呼ぶ","why":""},{"y":"594","t":"仏教興隆の詔","s":"推古天皇が厩戸皇子と蘇我馬子に命じた","why":""},{"y":"603","t":"冠位十二階","s":"徳・仁・礼・信・義・智を大小に分け、中央豪族個人の才能・功績に与える","why":"氏・姓にとらわれない人材登用と世襲制の打破のため"},{"y":"604","t":"憲法十七条","s":"日本初の成文法。豪族に役人としての政治的・道徳的訓戒を示し、仏教・儒教を重んじた","why":"遣隋使で未開国の扱いを受け、国家の体裁を整える必要があったため"},{"y":"607","t":"小野妹子の派遣・法隆寺建立","s":"第二回遣隋使として小野妹子を派遣。煬帝は答礼使として裴世清を送る。同年、法隆寺（斑鳩寺）建立","why":"南朝に冊封された倭の五王とは違い、隋との対等外交を目指したため"},{"y":"608","t":"第三回遣隋使","s":"裴世清を送る小野妹子に高向玄理・旻・南淵請安らが同行。彼らは隋の滅亡と唐の統一を体験して帰国し、大化改新に影響を与える","why":""},{"y":"614","t":"最後の遣隋使","s":"犬上御田鍬らを派遣","why":""},{"y":"620","t":"『天皇記』『国記』の編纂","s":"厩戸皇子が蘇我馬子と共同で国史を編纂。皇室による支配の正当性を示す","why":""},{"y":"622","t":"厩戸皇子の死","s":"即位できないまま推古天皇・蘇我馬子より先に亡くなる。飛鳥文化（日本初の仏教文化）が栄えた","why":""}],"story":"592年に崇峻天皇が暗殺されると、翌593年に【厩戸皇子】が叔母の【推古天皇】の【摂政】となり、【蘇我馬子】との二頭政治が始まった（以降を【飛鳥時代】と呼ぶ）。589年に【隋】が南北朝を統一していたため、倭は南朝に冊封された倭の五王とは違って隋との対等外交を目指し、【遣隋使】を派遣した。しかし未開国の扱いを受けたため→603年に【冠位十二階】で氏・姓にとらわれない人材登用をはかり、604年に日本初の成文法【憲法十七条】で役人としての訓戒を示した。607年には【小野妹子】を派遣し、【煬帝】は裴世清を答礼使として送った。608年の遣隋使には高向玄理・旻・南淵請安が同行→隋の滅亡と唐の統一を体験して帰国し、大化改新に影響を与える。最低限の制度が整い、隋が高句麗征討中という事情もあって冊封体制から離脱できたことが、中央集権国家の準備となった。この時期に日本初の仏教文化【飛鳥文化】が栄えた。","keywords":["厩戸皇子","推古天皇","蘇我馬子","冠位十二階","憲法十七条","遣隋使","小野妹子","煬帝","裴世清","高向玄理・旻・南淵請安","犬上御田鍬","飛鳥文化","法隆寺","鞍作鳥","百済観音像","三経義疏","観勒・曇徴"],"blanks":[{"q":"593年、厩戸皇子は叔母の【　】天皇の摂政・皇太子となった。","a":"推古","h":"崇峻天皇暗殺後に擁立された初の女帝"},{"q":"厩戸皇子は【　】と二頭政治を行い、『天皇記』『国記』も共同で編纂した。","a":"蘇我馬子","h":"大臣。法興寺（飛鳥寺）を建立"},{"q":"603年の【　】は、徳・仁・礼・信・義・智の冠を大小に分けて個人の才能・功績に与えた。","a":"冠位十二階","h":"世襲制の打破が目的"},{"q":"604年の【　】は日本初の成文法で、豪族に役人としての政治的・道徳的訓戒を示した。","a":"憲法十七条","h":"仏教・儒教を新しい政治理念とした"},{"q":"607年、『日本書紀』にも記載がある遣隋使として【　】が派遣された。","a":"小野妹子","h":"608年にも再派遣"},{"q":"隋の2代皇帝【　】は、答礼使として裴世清を倭に派遣した。","a":"煬帝","h":"隋の皇帝"},{"q":"614年、【　】らが最後の遣隋使として派遣された。","a":"犬上御田鍬","h":"630年には第一回遣唐使にもなる"},{"q":"皇族・中央豪族が担う日本初の仏教文化を【　】文化という。","a":"飛鳥","h":"百済・高句麗や南北朝文化の影響が強い"},{"q":"【　】が制作した飛鳥寺釈迦如来像は現存日本最古の仏像である。","a":"鞍作鳥","h":"止利仏師ともいう。法隆寺金堂釈迦三尊像も制作"},{"q":"南梁様式の仏像には法隆寺【　】像・中宮寺半跏思惟像・広隆寺半跏思惟像がある。","a":"百済観音","h":"柔和で丸みのある表現"},{"q":"厩戸皇子が著した法華経・勝鬘経・維摩経の注釈書を【　】という。","a":"三経義疏","h":"三つの仏典の注釈"},{"q":"百済の僧【　】は暦法・天文地理を伝えた。","a":"観勒","h":"紙・墨・絵の具は高句麗の曇徴"}],"mc":[{"q":"冠位十二階を制定した目的として最も適当なものはどれか。","c":["地方豪族を中央に組み込むため","氏・姓にとらわれない人材登用と世襲制の打破のため","蘇我氏の勢力を排除するため","唐の律令を導入するため"],"a":1,"e":"個人の才能・功績に冠位を与え、昇進も可能にした。地方豪族は対象外だった。"},{"q":"遣隋使が倭の五王の外交と異なる点として正しいものはどれか。","c":["中国の南朝に朝貢して冊封を受けた","隋との対等外交を目指し、結果的に冊封体制から離脱した","高句麗と同盟して隋に対抗した","隋から国王の称号を受けた"],"a":1,"e":"南朝に冊封された五王と違い対等外交を目指し、隋が高句麗征討中という事情もあり冊封体制から離脱できた。"},{"q":"冠位十二階・憲法十七条が制定された背景として最も適当なものはどれか。","c":["白村江の敗戦で国防強化が必要になった","壬申の乱で豪族が没落した","遣隋使で未開国の扱いを受け、制度を整える必要があった","仏教伝来をめぐる崇仏論争が起きた"],"a":2,"e":"遣隋使で未開国の扱いを受けたことが制度整備のきっかけとなった。"},{"q":"608年の遣隋使に同行した留学生・学問僧がのちに果たした役割として正しいものはどれか。","c":["隋の滅亡と唐の統一を体験して帰国し、大化改新に影響を与えた","隋の煬帝の答礼使として倭に戻った","冠位十二階の制定を主導した","遣唐使の廃止を建議した"],"a":0,"e":"高向玄理・旻・南淵請安らは激動を体験後に帰国し、高向玄理・旻は大化改新で国博士となる。"},{"q":"憲法十七条の説明として正しいものはどれか。","c":["唐にならった日本初の律令である","豪族に対し役人としての政治的・道徳的訓戒を示した日本初の成文法である","公地公民制の原則を定めた","冠位を十七階に増やした"],"a":1,"e":"日本初の成文法で、仏教・儒教を新しい政治理念として重んじた。"},{"q":"飛鳥文化の仏像彫刻について正しいものはどれか。","c":["北魏様式は柔和で丸みのある表現である","法隆寺百済観音像は鞍作鳥の作である","北魏様式は端正で硬い表現で、飛鳥寺釈迦如来像が代表である","南梁様式は左右対称の幾何学的な衣文が特徴である"],"a":2,"e":"北魏様式は端正で硬く左右対称、南梁様式は柔和で丸みがある。百済観音像は南梁様式。"},{"q":"飛鳥文化の寺院建築の説明として正しいものはどれか。","c":["法隆寺は蘇我馬子が建立した日本初の本格的寺院である","伽藍配置は金堂中心から塔中心へと変化した","法興寺（飛鳥寺）は蘇我馬子が建立し、法隆寺は現存世界最古の木造建築である","広隆寺は舒明天皇が建立した"],"a":2,"e":"飛鳥寺は蘇我馬子、法隆寺は厩戸皇子、広隆寺は秦河勝、百済大寺は舒明天皇。伽藍配置は塔中心から金堂中心へ。"}],"order":[{"title":"推古朝の政治","items":["厩戸皇子が摂政に就任","冠位十二階の制定","憲法十七条の制定","小野妹子の派遣","『天皇記』『国記』の編纂"],"e":"593年摂政→603年冠位十二階→604年憲法十七条→607年小野妹子→620年国史編纂。"},{"title":"遣隋使をめぐる動き","items":["隋が南北朝を統一","隋が高句麗征討を開始","第一回遣隋使（『隋書』倭国伝）","小野妹子の派遣と裴世清の来倭","犬上御田鍬の派遣（最後の遣隋使）"],"e":"589年統一→598年高句麗征討→600年第一回→607・608年小野妹子→614年犬上御田鍬。"}]},{"title":"PART4 中央集権国家の目標設定","flow":[{"y":"618","t":"唐の成立","s":"隋は高句麗征討の失敗と大運河建設で疲弊して滅亡。628年に唐が中国を統一し、律令に基づく強大な中央集権国家を確立","why":""},{"y":"630","t":"第一回遣唐使","s":"舒明天皇が犬上御田鍬を派遣","why":""},{"y":"643","t":"山背大兄王の死","s":"皇極天皇を擁立して権力を握った蘇我蝦夷・入鹿が、厩戸皇子の子・山背大兄王を斑鳩宮で滅ぼす","why":"古人大兄皇子を後継者に擁立するため"},{"y":"644","t":"唐の高句麗征討","s":"周辺諸国に緊張が走り、倭は中央集権の確立と国内統一の必要に迫られる","why":""},{"y":"645","t":"乙巳の変","s":"中大兄皇子・中臣鎌足らが飛鳥板蓋宮で蘇我入鹿を殺害、蝦夷は自害。孝徳天皇が即位し、年号を大化と定め難波に遷都","why":"強大化する唐に対し中央集権体制の確立が必要になったため"},{"y":"646","t":"改新の詔","s":"公地公民制・地方行政組織の整備・戸籍計帳と班田収授・新税制の4条。政策方針を示したもので、そのまま実施されたとは限らない","why":"氏姓制度・部民制・私地私民制に基づく国政を改めるため"},{"y":"647","t":"東北への進出","s":"孝徳天皇が越後国に渟足柵（647年）・磐舟柵（648年）を設置。658年に斉明天皇が阿倍比羅夫を派遣","why":""},{"y":"655","t":"斉明天皇の重祚","s":"孝徳天皇の死の翌年、皇極太上天皇が重祚し、大王宮を難波から飛鳥に戻す","why":""},{"y":"663","t":"白村江の戦い","s":"660年に唐・新羅連合が百済を滅ぼし、救援に向かう途中で斉明天皇が死去。倭・旧百済連合は唐・新羅連合に大敗し朝鮮半島から撤退","why":"百済復興を目指す鬼室福信らの救援要請を受けたため"},{"y":"667","t":"近江大津宮遷都と天智天皇の政治","s":"防人・水城・朝鮮式山城で国防を強化。667年に近江大津宮へ遷都、668年に中大兄皇子が天智天皇として即位、670年に庚午年籍を作成","why":"唐・新羅の侵攻に備え、飛鳥より内陸で安全を確保するため"}],"story":"618年に【唐】が成立し、律令に基づく強大な中央集権国家を確立した。国内では蘇我蝦夷・入鹿が権力を握り、643年に【山背大兄王】を滅ぼした。644年に唐が高句麗征討を始めると周辺諸国に緊張が走り→中央集権の確立が必要になったため、645年に【中大兄皇子】・【中臣鎌足】が飛鳥板蓋宮で蘇我入鹿を殺害した（【乙巳の変】）。【孝徳天皇】が即位して年号を【大化】と定め、難波に遷都し、646年に【改新の詔】で公地公民制などの方針を示したが、豪族連合の性格が残っていたため全ては実行できなかった。一方、新羅が唐と結んで660年に【百済】が滅亡→救援に向かった倭は663年の【白村江の戦い】で大敗し、朝鮮半島から撤退した。危機に対応して【防人】・【水城】を設置し、667年に【近江大津宮】へ遷都→668年に【天智天皇】が即位、670年に【庚午年籍】を作成したが、急速な権力集中は豪族の不満を高めた。","keywords":["唐","犬上御田鍬","蘇我蝦夷・入鹿","山背大兄王","乙巳の変","中大兄皇子","中臣鎌足","孝徳天皇","改新の詔","公地公民制","斉明天皇","白村江の戦い","防人","水城","近江大津宮","天智天皇","庚午年籍"],"blanks":[{"q":"618年に成立した【　】は、628年に中国を統一し律令に基づく中央集権国家を確立した。","a":"唐","h":"隋は高句麗征討の失敗と大運河建設で滅亡"},{"q":"630年、舒明天皇は第一回遣唐使として【　】を派遣した。","a":"犬上御田鍬","h":"614年の最後の遣隋使でもあった"},{"q":"643年、蘇我入鹿は厩戸皇子の子である【　】を斑鳩宮で滅ぼした。","a":"山背大兄王","h":"代わりに古人大兄皇子を後継者に擁立"},{"q":"645年、中大兄皇子・中臣鎌足らが飛鳥板蓋宮で蘇我入鹿を殺害した事件を【　】という。","a":"乙巳の変","h":"蝦夷は自邸で自害"},{"q":"皇極天皇に代わり弟が【　】天皇として即位し、初めて年号を大化と定めた。","a":"孝徳","h":"大王宮を難波に移した"},{"q":"646年正月の「【　】」は4条からなり、公地公民制の原則などの政策方針を示した。","a":"改新の詔","h":"実施されたとは限らない"},{"q":"改新政権では中臣鎌足が【　】、高向玄理・旻が国博士となった。","a":"内臣","h":"左大臣は阿倍内麻呂、右大臣は蘇我倉山田石川麻呂"},{"q":"655年、皇極太上天皇が重祚して【　】天皇となり、大王宮を飛鳥に戻した。","a":"斉明","h":"661年に百済救援に向かう途中で死去"},{"q":"660年、唐・新羅連合により【　】が滅亡し、倭は救援要請を受けた。","a":"百済","h":"鬼室福信らが救援を要請"},{"q":"663年の【　】で倭・旧百済連合は唐・新羅連合に大敗し、朝鮮半島から撤退した。","a":"白村江の戦い","h":"朝廷最大の危機"},{"q":"白村江の敗戦後、対馬・壱岐や九州北部に【　】を、大宰府北方に水城を設置した。","a":"防人","h":"朝鮮式山城の大野城・基肄城も築いた"},{"q":"670年に作成された最初の全国的戸籍を【　】という。","a":"庚午年籍","h":"氏姓を正す根本台帳として永久保存"}],"mc":[{"q":"大化改新が行われた背景として最も適当なものはどれか。","c":["白村江の敗戦で国防強化が急務となったため","強大化する唐が高句麗征討を始め、中央集権体制の確立が必要になったため","蘇我氏が仏教を排斥したため","隋が滅亡して遣隋使が中断したため"],"a":1,"e":"644年に唐が高句麗征討を開始し周辺諸国に緊張が走った→中央集権の確立と国内統一の必要に迫られた。"},{"q":"改新の詔の内容が当時そのまま実行できなかった理由として最も適当なものはどれか。","c":["豪族の連合政権的性格が残存していたため","唐が倭に侵攻してきたため","戸籍がすでに完成していたため","蘇我氏が改新政権を主導していたため"],"a":0,"e":"改新の詔は政策方針を決定しただけで、豪族連合の性格が残るため全ては実行できなかった。"},{"q":"乙巳の変後に成立した政権の説明として正しいものはどれか。","c":["中大兄皇子が即位して天智天皇となった","大臣・大連を廃止し、左大臣・右大臣を置いた","大王宮を難波から飛鳥に戻した","中臣鎌足が右大臣となった"],"a":1,"e":"大臣・大連を廃止し阿倍内麻呂を左大臣、蘇我倉山田石川麻呂を右大臣とした。中大兄皇子は皇太子、鎌足は内臣。"},{"q":"倭が白村江の戦いに至った経緯として正しいものはどれか。","c":["高句麗が滅亡し、その復興要請を受けたため","新羅が唐と結んで百済を滅ぼし、百済復興の救援要請を受けたため","唐が倭に朝貢を求めたため","加耶諸国の復興を目指したため"],"a":1,"e":"660年に唐・新羅連合が百済を滅ぼし、鬼室福信らの救援要請を受けて出兵した。"},{"q":"白村江の敗戦の結果として誤っているものはどれか。","c":["対馬・壱岐や九州北部に防人を置いた","大宰府北方に水城を築いた","百済の亡命貴族の指導で朝鮮式山城を築いた","遣唐使の派遣を全面的に中止した"],"a":3,"e":"敗戦後の665年にも遣唐使は派遣されている。国防強化として防人・水城・朝鮮式山城・烽を設置した。"},{"q":"667年に近江大津宮へ遷都した理由として最も適当なものはどれか。","c":["藤原京の建設予定地だったため","飛鳥より内陸へ移り安全を確保するため","新羅との貿易に便利だったため","蘇我氏の本拠地から離れるため"],"a":1,"e":"白村江の敗戦後、唐・新羅の脅威に備え飛鳥より内陸の近江へ遷都した。"},{"q":"天智天皇に対する豪族の不満が高まった理由として最も適当なものはどれか。","c":["庚午年籍の作成などで急激に大王への権力集中が進んだため","遣唐使を中断したため","豪族の私有民をすべて廃止したため","八色の姓で身分秩序を再編したため"],"a":0,"e":"庚午年籍により徴税・徴兵は行いやすくなったが、急速な権力集中が地方豪族の不満を高めた。部曲廃止・八色の姓は天武天皇。"},{"q":"676年に新羅が倭に急速に歩み寄った理由として最も適当なものはどれか。","c":["百済を復興させるため","唐との関係が悪化したため","倭が高句麗と同盟したため","倭に仏教を伝えるため"],"a":1,"e":"668年に高句麗を滅ぼした後、新羅は唐と対立し、676年に唐の勢力を追放して半島を統一した。"}],"order":[{"title":"大化改新までの流れ","items":["唐の成立","第一回遣唐使（犬上御田鍬）","蘇我入鹿が山背大兄王を滅ぼす","唐が高句麗征討を開始","乙巳の変"],"e":"618年唐成立→630年遣唐使→643年山背大兄王→644年唐の高句麗征討→645年乙巳の変。"},{"title":"白村江前後の外交","items":["唐・新羅連合により百済が滅亡","斉明天皇が九州で死去","白村江の戦い","唐・新羅連合により高句麗が滅亡","新羅が朝鮮半島を統一"],"e":"660年百済滅亡→661年斉明天皇死去→663年白村江→668年高句麗滅亡→676年新羅統一。"},{"title":"天智朝の内政","items":["甲子の宣","近江大津宮へ遷都","天智天皇の即位","中臣鎌足の死（藤原姓）","庚午年籍の作成"],"e":"664年甲子の宣→667年遷都→668年即位→669年鎌足死去→670年庚午年籍。"}]},{"title":"PART5 中央集権国家の成立","flow":[{"y":"672","t":"壬申の乱","s":"天智天皇の死後、大海人皇子（弟、吉野軍）と大友皇子（子、近江朝廷軍）が皇位を争い、東国の中小豪族の協力を得た大海人皇子が勝利","why":"皇位継承をめぐる対立のため"},{"y":"673","t":"天武天皇の即位","s":"飛鳥浄御原宮に遷都して即位。畿内の大豪族が没落して大王の権威が高揚し、皇后・皇子を登用する皇親政治を展開。富本銭を鋳造、遣唐使は中断","why":"内政に集中するため遣唐使を中断した"},{"y":"675","t":"部曲の廃止","s":"豪族の私有民（部曲）を廃止","why":"公地公民を進め、天皇への権力集中をはかるため"},{"y":"681","t":"飛鳥浄御原令の編纂開始","s":"国史の編纂も開始","why":""},{"y":"684","t":"八色の姓","s":"真人・朝臣・宿禰・忌寸・道師・臣・連・稲置とし、皇族・豪族の身分秩序を再編","why":"天皇中心の新しい身分秩序をつくるため"},{"y":"686","t":"大津皇子の死","s":"天武天皇の死後、持統天皇が皇太子草壁皇子の地位を守るため自害に追い込む。草壁皇子の死後、称制を経て持統天皇が即位し高市皇子が補佐","why":""},{"y":"689","t":"飛鳥浄御原令の施行","s":"持統天皇が施行","why":""},{"y":"690","t":"庚寅年籍の作成","s":"6年1比として5比30年保存。これにより班田収授法が確立","why":""},{"y":"694","t":"藤原京遷都","s":"中国の都城を模倣し条坊制を採用した初の本格的宮都。大和三山を内包。出土した木簡で郡評論争が決着","why":""},{"y":"701","t":"大宝律令の制定","s":"697年に譲位を受けた文武天皇のもと、刑部親王・藤原不比等が編纂した初の律令。702年に粟田真人らを律令国家「日本」の使者として遣唐使を再開","why":"律令国家の完成を唐に示すため"}],"story":"天智天皇の死後、672年に【大海人皇子】と【大友皇子】が皇位を争う【壬申の乱】が起き、東国の中小豪族を動員した大海人皇子が勝利した→畿内の大豪族が没落し、大王の権威が高揚した。翌年【飛鳥浄御原宮】で即位した【天武天皇】は皇后・皇子を登用する皇親政治を展開し、内政に集中するため遣唐使を中断した。675年に【部曲】を廃止、681年に【飛鳥浄御原令】の編纂を始め、684年に【八色の姓】で身分秩序を再編した。天武の死後、【持統天皇】は689年に飛鳥浄御原令を施行、690年に【庚寅年籍】を作成して班田収授法を確立し、694年に条坊制をもつ初の本格的宮都【藤原京】へ遷都した。孫の【文武天皇】のもとで701年に刑部親王・藤原不比等が【大宝律令】を制定→律令国家「日本」が成立し、702年に遣唐使が再開された。この時期には初唐文化の影響を受けた明るく清新な【白鳳文化】が栄えた。","keywords":["壬申の乱","大海人皇子","大友皇子","天武天皇","飛鳥浄御原宮","皇親政治","富本銭","八色の姓","持統天皇","飛鳥浄御原令","庚寅年籍","藤原京","文武天皇","大宝律令","白鳳文化","薬師寺東塔","興福寺仏頭","法隆寺金堂壁画","高松塚古墳壁画"],"blanks":[{"q":"672年、天智天皇の死後に大海人皇子と大友皇子が皇位を争った内乱を【　】という。","a":"壬申の乱","h":"古代最大の内乱"},{"q":"壬申の乱で勝利した【　】は、翌年飛鳥浄御原宮で天武天皇として即位した。","a":"大海人皇子","h":"天智天皇の弟。吉野軍を率いた"},{"q":"天武天皇は唐の皇帝にならい【　】の鋳造を行った。","a":"富本銭","h":"遣唐使は中断した"},{"q":"684年、天武天皇は【　】を制定し、皇族・豪族の身分秩序を再編した。","a":"八色の姓","h":"真人・朝臣・宿禰・忌寸・道師・臣・連・稲置"},{"q":"689年、持統天皇は【　】を施行した。","a":"飛鳥浄御原令","h":"681年に天武天皇が編纂を開始"},{"q":"690年に作成された【　】は6年1比として30年保存され、班田収授法が確立した。","a":"庚寅年籍","h":"670年の庚午年籍と区別"},{"q":"694年、持統天皇は条坊制を採用した初の本格的宮都【　】へ遷都した。","a":"藤原京","h":"大和三山を内包する日本史上最大の都"},{"q":"藤原京跡から大量の【　】が出土し、郡評論争が決着した。","a":"木簡","h":"文字を書いた木の札"},{"q":"701年、刑部親王・藤原不比等が編纂した初の律令【　】が制定された。","a":"大宝律令","h":"文武天皇のとき"},{"q":"702年、粟田真人らが律令国家「【　】」の使者として遣唐使を再開した。","a":"日本","h":"国号"},{"q":"初唐文化の影響が強い、律令国家建設期の明るく清新な文化を【　】文化という。","a":"白鳳","h":"薬師寺東塔・興福寺仏頭など"},{"q":"1949年に焼損した【　】壁画は、その焼損が1950年の文化財保護法制定の契機となった。","a":"法隆寺金堂","h":"アジャンター石窟壁画に類似"}],"mc":[{"q":"壬申の乱の結果として最も適当なものはどれか。","c":["畿内の大豪族が没落し、大王の権威が高揚した","大友皇子が近江大津宮で即位した","東国の豪族が朝廷に反乱を起こした","遣唐使が再開された"],"a":0,"e":"大海人皇子の勝利により大友氏・紀氏などを除く畿内の大豪族が没落し、天武天皇の皇親政治が可能になった。"},{"q":"天武・持統朝に遣唐使が中断された理由として最も適当なものはどれか。","c":["唐が倭に侵攻したため","内政に集中するため","新羅が航路を封鎖したため","白村江の敗戦で船を失ったため"],"a":1,"e":"内政に集中するため中断し、新羅や旧百済・旧高句麗からの亡命者の知識を活用した。"},{"q":"大海人皇子が壬申の乱で勝利できた理由として正しいものはどれか。","c":["唐の援軍を得たため","東国の中小豪族の協力を得て軍事動員に成功したため","近江朝廷軍が内部分裂したため","畿内の大豪族が味方したため"],"a":1,"e":"美濃国の不破に進軍し、東国の中小豪族の協力を得て軍事動員に成功した。"},{"q":"持統天皇の政治として正しいものはどれか。","c":["八色の姓を制定した","庚午年籍を作成した","庚寅年籍を作成し、藤原京へ遷都した","大宝律令を制定した"],"a":2,"e":"八色の姓は天武、庚午年籍は天智、大宝律令は文武天皇のとき。"},{"q":"藤原京の説明として正しいものはどれか。","c":["天武天皇が完成させた都である","中国の都城を模倣して条坊制を採用した初の本格的宮都である","近江にあり、白村江の敗戦後に遷都された","文武天皇が710年に遷都した"],"a":1,"e":"694年に持統天皇が遷都。大和三山を内包する日本史上最大の都で、木簡の出土で郡評論争が決着。"},{"q":"白鳳文化の特徴として正しいものはどれか。","c":["南北朝文化の影響を受けた日本初の仏教文化である","初唐文化の影響が強く、律令国家建設期を反映した明るく清新な文化である","北魏様式と南梁様式の仏像が中心である","皇族・豪族ではなく庶民が担った"],"a":1,"e":"飛鳥文化は南北朝・百済・高句麗の影響、白鳳文化は遣唐使を介した初唐文化の影響が強い。"},{"q":"興福寺仏頭の説明として正しいものはどれか。","c":["鞍作鳥が制作した飛鳥文化の仏像である","もと山田寺本尊の薬師如来像で、白鳳文化の仏像である","法隆寺夢殿の秘仏として発見された","薬師寺東塔に安置されていた"],"a":1,"e":"山田寺は蘇我倉山田石川麻呂の発願で建立。その本尊の頭部が興福寺仏頭。"},{"q":"法隆寺金堂壁画の焼損がもたらした結果として正しいものはどれか。","c":["高松塚古墳の石室が解体された","1950年の文化財保護法制定の契機となった","キトラ古墳の壁画がはぎ取られた","法隆寺再建論争が決着した"],"a":1,"e":"1949年の焼損が1950年の文化財保護法制定の契機となった。"}],"order":[{"title":"天武・持統朝の政治","items":["壬申の乱","部曲の廃止","八色の姓の制定","飛鳥浄御原令の施行","藤原京遷都"],"e":"672年壬申の乱→675年部曲廃止→684年八色の姓→689年浄御原令施行→694年藤原京。"},{"title":"律令国家の成立","items":["庚寅年籍の作成","藤原京遷都","文武天皇への譲位","大宝律令の制定","遣唐使の再開"],"e":"690年庚寅年籍→694年藤原京→697年譲位→701年大宝律令→702年遣唐使再開。"},{"title":"戸籍と法典の整備","items":["近江令の制定？","庚午年籍の作成","飛鳥浄御原令の編纂開始","庚寅年籍の作成","大宝律令の制定"],"e":"668年近江令→670年庚午年籍→681年浄御原令編纂開始→690年庚寅年籍→701年大宝律令。"}]}],"review":[{"q":"倭の五王が南朝に朝貢した目的と、遣隋使が目指したものの違いとして正しいものはどれか。","c":["五王は対等外交、遣隋使は冊封を求めた","五王は朝鮮半島南部での立場を有利にするため冊封を受け、遣隋使は隋との対等外交を目指した","どちらも高句麗との同盟を目指した","どちらも仏教の導入が目的だった"],"a":1,"e":"5世紀の五王は冊封体制に入ったが、推古朝の遣隋使は対等外交を目指し結果的に冊封体制から離脱した。"},{"q":"6世紀に蘇我氏が台頭してから乙巳の変で滅ぶまでの流れとして正しいものはどれか。","c":["物部守屋を滅ぼす→崇峻天皇暗殺→推古天皇擁立→山背大兄王を滅ぼす→乙巳の変","崇峻天皇暗殺→物部守屋を滅ぼす→乙巳の変→山背大兄王を滅ぼす","山背大兄王を滅ぼす→物部守屋を滅ぼす→崇峻天皇暗殺→乙巳の変","乙巳の変→物部守屋を滅ぼす→崇峻天皇暗殺→推古天皇擁立"],"a":0,"e":"587年守屋滅亡→592年崇峻暗殺・推古擁立→643年山背大兄王→645年乙巳の変。"},{"q":"大化改新と天智天皇の政治に共通する背景として最も適当なものはどれか。","c":["新羅の朝鮮半島統一に対抗するため","唐の強大化と東アジアの緊張に対応し、中央集権体制を確立する必要があったため","蘇我氏の再興を防ぐため","仏教を国家の統制下に置くため"],"a":1,"e":"644年の唐の高句麗征討が大化改新の背景、663年の白村江の敗戦が天智朝の権力集中の背景となった。"},{"q":"白村江の敗戦から壬申の乱に至る流れの説明として正しいものはどれか。","c":["敗戦後に遷都と戸籍作成で権力集中が進み、豪族の不安の中で天智天皇の死後に皇位継承争いが起きた","敗戦後に天智天皇が藤原京へ遷都し、その死後に大友皇子が即位した","敗戦により天智天皇が退位し、大海人皇子がただちに即位した","敗戦後に遣唐使を中断し、その反発から壬申の乱が起きた"],"a":0,"e":"近江遷都・庚午年籍などの急速な権力集中が豪族の不安を生み、天智の死後に大海人皇子と大友皇子が争った。"},{"q":"戸籍の整備と土地制度の変化の流れとして正しいものはどれか。","c":["庚寅年籍→庚午年籍→改新の詔→大宝律令","改新の詔で公地公民の方針→庚午年籍で最初の全国的戸籍→庚寅年籍で班田収授法が確立→大宝律令","大宝律令→庚午年籍→庚寅年籍→改新の詔","庚午年籍→改新の詔→大宝律令→庚寅年籍"],"a":1,"e":"646年改新の詔（方針）→670年庚午年籍→690年庚寅年籍（班田収授法確立）→701年大宝律令。"},{"q":"飛鳥文化と白鳳文化の違いの説明として正しいものはどれか。","c":["飛鳥文化は初唐文化、白鳳文化は南北朝文化の影響が強い","飛鳥文化は南北朝・百済・高句麗の影響が強く、白鳳文化は遣唐使を介した初唐文化の影響が強い","飛鳥文化は庶民、白鳳文化は皇族が担った","飛鳥文化は薬師寺東塔、白鳳文化は法隆寺が代表である"],"a":1,"e":"飛鳥文化の代表は法隆寺・飛鳥寺釈迦如来像、白鳳文化は薬師寺東塔・興福寺仏頭・法隆寺金堂壁画。"}]},{"id":3,"title":"律令体制の展開と矛盾","era":"奈良時代〜平安時代初期","span":"701〜812","oneLine":"律令国家は完成したが、政争と土地制度の矛盾が噴き出し、桓武天皇が刷新を図った","chain":["藤原不比等","長屋王","藤原四子","橘諸兄","藤原仲麻呂","道鏡","藤原百川","桓武天皇"],"parts":[{"title":"律令体制の成立","flow":[{"y":"689","t":"飛鳥浄御原令","s":"持統天皇のもとで施行された令","why":"律令国家の建設を進めるため"},{"y":"701","t":"大宝律令","s":"文武天皇のとき、刑部親王・藤原不比等が編纂。律・令がそろい律令制がスタート","why":"唐にならった中央集権体制を整えるため"},{"y":"702","t":"遣唐使の再開","s":"天武・持統朝で中断していた遣唐使を文武天皇が再開","why":"唐の先進文化・制度を摂取するため"},{"y":"708","t":"和同開珎の鋳造","s":"元明天皇が唐の開元通宝にならい鋳造。本朝十二銭の始め","why":"貨幣による流通を促進するため"},{"y":"710","t":"平城京遷都","s":"藤原不比等の建議で元明天皇が藤原京から遷都。奈良時代スタート","why":"唐の長安にならった都城を整えるため"},{"y":"711","t":"蓄銭叙位令","s":"元明天皇が貨幣流通の促進をはかる","why":"布・稲の物々交換が主流で貨幣が広まらなかったため"},{"y":"712","t":"出羽国設置","s":"陸奥国と並ぶ東北地方の蝦夷対策","why":"支配領域を北へ広げるため"},{"y":"713","t":"大隅国設置","s":"薩摩国と並ぶ九州南部の隼人対策","why":"支配領域を南へ広げるため"},{"y":"718","t":"養老律令","s":"元正天皇のとき藤原不比等が編纂。施行は757年の藤原仲麻呂政権","why":"大宝律令を修正するため"},{"y":"724","t":"多賀城の設置","s":"陸奥国府と鎮守府を置く。733年には秋田城に出羽国府","why":"東北の蝦夷支配の拠点とするため"}],"story":"【689】年の【飛鳥浄御原令】に続き、【701】年、文武天皇のもとで刑部親王・【藤原不比等】が【大宝律令】を完成させ、律令国家が成立した。中央には【神祇官】と【太政官】の二官、その下に八省を置き、地方は国・郡・里制として【国司】を京から派遣し、在地豪族を【郡司】に任じて中央集権を確立した。東国の反乱を恐れたため→畿内の東に【三関】を置いた。外交では新羅との関係が悪化したため→【遣唐使】は北路から南路へ航路を変えた。【710】年、不比等の建議で元明天皇が唐の長安にならった【平城京】に遷都し、【708】年鋳造の【和同開珎】で貨幣流通を促そうとしたが、物々交換が主流のため→【蓄銭叙位令】を出しても使用は畿内周辺にとどまった。また出羽国・大隅国を置き、【724】年に【多賀城】を築いて蝦夷・隼人への支配を広げた。","keywords":["大宝律令","養老律令","二官八省","太政官","国司","郡司","三関","官位相当制","蔭位の制","遣唐使","阿倍仲麻呂","平城京","和同開珎","蓄銭叙位令","多賀城"],"blanks":[{"q":"701年、文武天皇のとき刑部親王・藤原不比等が編纂した【　】が完成し、律令制がスタートした。","a":"大宝律令","h":"律と令がそろった最初の法典"},{"q":"718年、元正天皇のとき藤原不比等が編纂した【　】は、757年に藤原仲麻呂政権で施行された。","a":"養老律令","h":"施行は制定の約40年後"},{"q":"律令の中央官制は、神祇官と【　】の二官からなり、公卿が合議で政務を行った。","a":"太政官","h":"その下に八省が置かれた"},{"q":"博多津に近い「遠の朝廷」と呼ばれた地方官庁は【　】である。","a":"大宰府","h":"防人司や鴻臚館も置かれた"},{"q":"京から貴族が派遣され、国府を拠点に国内を統治した地方官は【　】である。","a":"国司","h":"郡司は在地豪族の世襲"},{"q":"五位以上の貴族には、父祖の位階に応じて位階を与える【　】が適用された。","a":"蔭位の制","h":"貴族の政治的特権"},{"q":"遣唐使として唐に渡り、玄宗に仕えて日本に帰れなかったのは【　】である。","a":"阿倍仲麻呂","h":"藤原清河も同様に帰国できなかった"},{"q":"710年、藤原不比等の建議により元明天皇が藤原京から【　】に遷都した。","a":"平城京","h":"唐の長安にならった都城制"},{"q":"平城京の中央を南北に走る【　】により、都は左京・右京に分かれた。","a":"朱雀大路","h":"碁盤目状の条坊制"},{"q":"708年、唐の開元通宝にならって鋳造された本朝十二銭の始めは【　】である。","a":"和同開珎","h":"初の本格的な流通貨幣"},{"q":"724年、陸奥国府と鎮守府を置くために築かれた城柵は【　】である。","a":"多賀城","h":"木簡や漆紙文書が出土"},{"q":"713年に設置された【　】は、薩摩国と並ぶ九州南部の隼人対策であった。","a":"大隅国","h":"前年には出羽国が置かれた"}],"mc":[{"q":"日本が律よりも令を重視した理由として最も適当なものはどれか。","c":["唐との戦争に備える必要があったため","多数の異民族を支配する必要がなかったため","刑罰よりも仏教の戒律を重んじたため","郡司の世襲を認める必要があったため"],"a":1,"e":"日本は多数の異民族支配の必要がないことから、刑法である律よりも行政法・民法である令を重視した。"},{"q":"三関が畿内から見て東方に置かれた理由として正しいものはどれか。","c":["新羅の侵攻に備えるため","隼人の反乱を防ぐため","東国と連動した反乱を恐れたため","渤海使を迎えるため"],"a":2,"e":"不破関・鈴鹿関・愛発関は東国に向けた軍事目的の関所で、東国と連動した反乱を恐れたため東側に置かれた。"},{"q":"律令制の地方官について正しいものはどれか。","c":["郡司は京から貴族が派遣された","国司はもと国造などの地方豪族が世襲した","国司は京から貴族が派遣された","里長は中央から派遣された"],"a":2,"e":"国司は京から貴族を派遣し、郡司はもと国造などの地方豪族が世襲した。"},{"q":"8世紀に遣唐使が北路から南路へ航路を変更した背景として正しいものはどれか。","c":["新羅との関係が悪化したため","渤海が唐と対立したため","安史の乱で唐が混乱したため","唐が冊封を要求したため"],"a":0,"e":"新羅との関係悪化のため、朝鮮半島沿いの北路をとれなくなり南路（南島路）へ変更した。"},{"q":"蓄銭叙位令が出された目的として正しいものはどれか。","c":["貴族の位階を制限するため","貨幣の流通を促進するため","布・稲の物々交換を奨励するため","渤海との通商を進めるため"],"a":1,"e":"711年、元明天皇は貨幣流通の促進をはかって蓄銭叙位令を出したが、物々交換が主流で貨幣使用は畿内周辺に限られた。"},{"q":"平城京について誤っているものはどれか。","c":["唐の長安にならった都城制を採用した","藤原不比等の建議で藤原京から遷都した","全体を囲む羅城があった","朱雀大路で左京と右京に分かれた"],"a":2,"e":"平城京には全体を囲む羅城はなく、外京・北辺坊があった。"},{"q":"8世紀前半の朝廷が出羽国・大隅国を設置した目的として正しいものはどれか。","c":["新羅・渤海への防衛のため","遣唐使の港を確保するため","初期荘園を開発するため","蝦夷・隼人への支配を広げるため"],"a":3,"e":"出羽国は東北の蝦夷対策、大隅国は九州南部の隼人対策として設置された。"},{"q":"渤海と日本の関係について正しいものはどれか。","c":["日本が渤海に朝貢した","たびたび戦争になった","渤海は唐の冊封を受けて日本と対立した","通商を軸に日本を上位とする友好関係が続いた"],"a":3,"e":"渤海は当初唐・新羅と対立していたため日本に接近し、通商を軸に日本を上位とする友好関係が続いた。"}],"order":[{"title":"令・律令の制定","items":["近江令","飛鳥浄御原令","大宝律令","養老律令"],"e":"近江令（天智）→飛鳥浄御原令（持統）→大宝律令（701年、文武）→養老律令（718年、元正）。"},{"title":"平城京と流通政策","items":["和同開珎の鋳造","平城京遷都","蓄銭叙位令","出羽国の設置"],"e":"708年和同開珎→710年平城京遷都→711年蓄銭叙位令→712年出羽国設置。"},{"title":"支配領域の拡大","items":["出羽国の設置","大隅国の設置","多賀城の設置","秋田城の設置"],"e":"712年出羽国→713年大隅国→724年多賀城（陸奥国府）→733年秋田城（出羽国府）。"}]},{"title":"奈良時代の政争と公地公民制の崩壊","flow":[{"y":"723","t":"三世一身法","s":"長屋王政権が開墾地の私有を期限付きで公認","why":"口分田不足に対応し開墾を促すため"},{"y":"729","t":"長屋王の変","s":"長屋王が自殺に追い込まれ、藤原光明子が人臣初の皇后に","why":"藤原氏が外戚として権力を握るため"},{"y":"737","t":"藤原四子の死","s":"天然痘により武智麻呂・房前・宇合・麻呂の四兄弟が全員死亡","why":""},{"y":"740","t":"藤原広嗣の乱","s":"式家の広嗣が玄昉・吉備真備の排除を求め大宰府で反乱。聖武天皇は恭仁京へ","why":"橘諸兄政権で玄昉・吉備真備が登用されたことへの反発"},{"y":"743","t":"墾田永年私財法","s":"橘諸兄政権が開墾地の私有を条件付きで無期限に公認。同年大仏造立の詔","why":"三世一身法では期限があり開墾が進まなかったため"},{"y":"757","t":"橘奈良麻呂の変","s":"藤原仲麻呂が養老律令を施行、諸兄の子のクーデタ未遂を鎮圧","why":"仲麻呂の台頭に対する橘氏の反発"},{"y":"764","t":"恵美押勝の乱","s":"仲麻呂が敗死、淳仁天皇は淡路に配流。孝謙太上天皇が称徳天皇として重祚","why":"孝謙太上天皇・道鏡の勢力と対立したため"},{"y":"769","t":"宇佐八幡神託事件","s":"和気清麻呂が道鏡の天皇即位を阻止","why":"道鏡が法王となり皇位をうかがったため"},{"y":"770","t":"光仁天皇即位","s":"藤原百川らが擁立し、道鏡は下野国薬師寺に左遷。天智系皇室が復活","why":"称徳天皇が亡くなったため"},{"y":"781","t":"桓武天皇即位","s":"光仁天皇と高野新笠の子が即位","why":""}],"story":"奈良時代の政争は藤原氏を中心に展開した。【藤原不比等】は外戚政策で台頭し、その死後は【長屋王】が【三世一身法】を出したが、【729】年の【長屋王の変】で滅び、光明子が人臣初の皇后となった。【737】年に【藤原四子】が天然痘で全員死亡したため→【橘諸兄】が玄昉・吉備真備を登用して政権を担い、これに反発した【藤原広嗣】が【740】年に反乱を起こすと→聖武天皇は恭仁京などを転々とし、鎮護国家のため大仏造立を命じ、【743】年の【墾田永年私財法】で開墾地の永久私有を認めた。これが公地制崩壊の決定打となった。次いで【藤原仲麻呂】が淳仁天皇を擁立したが、孝謙太上天皇と【道鏡】に敗れ【764】年の【恵美押勝の乱】で滅んだ。道鏡は法王となり皇位をうかがったが【宇佐八幡神託事件】で阻止され、称徳天皇の死後は【藤原百川】が【光仁天皇】を擁立し天智系皇室が復活した。一方、過大な負担のため→農民は浮浪・逃亡し、公民制も崩れていった。","keywords":["長屋王の変","藤原四子","橘諸兄","藤原広嗣の乱","恵美押勝の乱","道鏡","宇佐八幡神託事件","光仁天皇","戸籍","計帳","班田収授法","租調庸","出挙","三世一身法","墾田永年私財法"],"blanks":[{"q":"藤原不比等の死後、天武天皇の孫である【　】が政権を握り、三世一身法を出した。","a":"長屋王","h":"高市皇子の子で729年に滅ぼされた"},{"q":"729年の長屋王の変の後、【　】が人臣初の皇后となった。","a":"光明子","h":"藤原不比等の娘、聖武天皇の妻"},{"q":"737年、藤原四兄弟が【　】により全員死亡した。","a":"天然痘","h":"疱瘡ともいう"},{"q":"740年、藤原式家の【　】が玄昉・吉備真備の排除を求めて大宰府で反乱を起こした。","a":"藤原広嗣","h":"宇合の子で百川の兄"},{"q":"藤原仲麻呂は淳仁天皇を擁立して【　】の名を賜り、764年に乱を起こして敗死した。","a":"恵美押勝","h":"人臣初の太政大臣（大師）"},{"q":"769年、【　】が道鏡の天皇即位を阻止した事件を宇佐八幡神託事件という。","a":"和気清麻呂","h":"のちに平安京遷都も進言"},{"q":"770年、藤原百川らが擁立した【　】天皇の即位により、天智系皇室が復活した。","a":"光仁","h":"白壁王。桓武天皇の父"},{"q":"口分田班給のための基本台帳である【　】は、6年ごとに作成された。","a":"戸籍","h":"計帳は調・庸賦課のため毎年作成"},{"q":"6歳以上の男女に口分田を班給する制度を【　】という。唐の均田制にならった。","a":"班田収授法","h":"良民男子には2段を班給"},{"q":"郷土の産物を京に運脚して納める中央の人頭税を【　】という。","a":"調","h":"庸は歳役に替えて布を納めた"},{"q":"723年、開墾地の私有を期限付きで公認した法令を【　】という。","a":"三世一身法","h":"元正天皇・長屋王政権"},{"q":"743年、開墾地の私有を条件付きで無期限に公認した【　】により公地制が崩壊した。","a":"墾田永年私財法","h":"聖武天皇・橘諸兄政権"}],"mc":[{"q":"藤原不比等が台頭した方法として正しいものはどれか。","c":["軍事力で東国を制圧した","娘を天皇や皇太子に嫁がせる外戚政策をとった","太政大臣禅師となった","宇佐八幡の神託を利用した"],"a":1,"e":"不比等は娘の宮子を文武天皇に、光明子を皇太子（聖武天皇）に嫁がせ、外戚政策により台頭した。"},{"q":"橘諸兄が政権を担うことになった背景として正しいものはどれか。","c":["長屋王の変で長屋王が滅んだため","藤原四子が天然痘で全員死亡したため","恵美押勝の乱で仲麻呂が敗死したため","藤原広嗣の乱が失敗したため"],"a":1,"e":"737年に藤原四兄弟が天然痘で死亡したため、光明皇后の異父兄である橘諸兄が政権を担った。"},{"q":"藤原広嗣の乱の原因として正しいものはどれか。","c":["橘諸兄政権が玄昉・吉備真備を登用したことへの反発","道鏡が法王となったことへの反発","養老律令の施行への反発","淳仁天皇の擁立への反発"],"a":0,"e":"式家の広嗣は、諸兄政権に登用された玄昉・吉備真備の排除を要求して大宰府で反乱を起こした。"},{"q":"聖武天皇が国分寺建立の詔や大仏造立の詔を出した理由として最も適当なものはどれか。","c":["新羅を征討するため","遣唐使を再開するため","疫病や戦乱が相次いだため鎮護国家をはかった","藤原氏の氏寺を建てるため"],"a":2,"e":"天然痘の流行や藤原広嗣の乱など疫病や戦乱が相次いだことで、朝廷は鎮護国家のため仏教を重視した。"},{"q":"恵美押勝の乱の結果として正しいものはどれか。","c":["淳仁天皇が重祚した","橘奈良麻呂が処罰された","道鏡が下野国に左遷された","孝謙太上天皇が称徳天皇として重祚した"],"a":3,"e":"764年の乱で仲麻呂は敗死し、淳仁天皇は淡路国に配流され、孝謙太上天皇が重祚して称徳天皇となった。"},{"q":"墾田永年私財法が出された背景として最も適当なものはどれか。","c":["初期荘園が荒廃したため","三世一身法では私有に期限があり開墾が進まなかったため","加墾禁止令が廃止されたため","貴族の開墾を禁止するため"],"a":1,"e":"723年の三世一身法は期限付きの私有公認だったため、743年に無期限の私有を認める墾田永年私財法が出された。"},{"q":"戸籍と計帳について正しいものはどれか。","c":["戸籍は毎年、計帳は6年ごとに作成された","戸籍は調・庸賦課のため、計帳は口分田班給のための台帳である","戸籍は6年ごと、計帳は毎年作成された","どちらも身体的特徴を記載した"],"a":2,"e":"戸籍は口分田班給のため6年ごとに、計帳は調・庸賦課のため身体的特徴も記して毎年作成された。"},{"q":"8世紀に浮浪・逃亡や偽籍が激増した原因として正しいものはどれか。","c":["墾田永年私財法で口分田が増えたため","過大な負担・疫病・飢饉のため","初期荘園が荘民を独占したため","国司の派遣が廃止されたため"],"a":1,"e":"過大な負担、疫病、飢饉などにより偽籍・浮浪・逃亡・私度僧が激増し、口分田の荒廃や兵士の弱体化を招いた。"}],"order":[{"title":"奈良時代前半の政権担当者","items":["藤原不比等","長屋王","藤原四子","橘諸兄"],"e":"不比等→長屋王（729年の変で自殺）→藤原四子（737年天然痘で死亡）→橘諸兄。"},{"title":"奈良時代後半の政権担当者","items":["橘諸兄","藤原仲麻呂","道鏡","藤原百川"],"e":"諸兄→仲麻呂（764年恵美押勝の乱で敗死）→道鏡（770年左遷）→百川（光仁天皇擁立）。"},{"title":"土地制度の変遷","items":["百万町歩開墾計画","三世一身法","墾田永年私財法","加墾禁止令","加墾禁止令の廃止"],"e":"722年→723年→743年→765年（道鏡政権）→772年（藤原百川政権）。"}]},{"title":"奈良仏教と奈良時代の文化","flow":[{"y":"712","t":"古事記","s":"元明天皇の命で稗田阿礼の暗誦を太安万侶が筆録。現存最古の歴史書","why":"皇室による支配の正統性を示すため"},{"y":"713","t":"風土記","s":"元明天皇の命で各国の物産・地理・伝説を国司が編纂","why":""},{"y":"720","t":"日本書紀","s":"元正天皇の命で舎人親王らが編纂。漢文編年体の正史で六国史の始め","why":"皇室による国家統治の正当性を示すため"},{"y":"741","t":"国分寺建立の詔","s":"聖武天皇が諸国に国分寺を建てさせる","why":"鎮護国家のため"},{"y":"743","t":"大仏造立の詔","s":"行基が協力し、745年に大僧正となる","why":"鎮護国家のため"},{"y":"751","t":"懐風藻","s":"最古の漢詩集。淡海三船・石上宅嗣が代表的漢詩人","why":""},{"y":"752","t":"東大寺大仏開眼供養会","s":"聖武太上天皇が菩提僊那や仏哲を招く","why":""},{"y":"753","t":"鑑真の来日","s":"普照・栄叡の要請で5度の失敗を乗り越え渡来。戒律を伝え東大寺に戒壇院を建立","why":"鎮護国家のもとで正式な戒律を広めるため"},{"y":"764","t":"百万塔陀羅尼","s":"称徳天皇が恵美押勝の乱の戦没者慰霊のため十大寺に寄進","why":""},{"y":"","t":"万葉集","s":"8世紀後半、約4500首を収める最古の和歌集。万葉仮名を使用","why":""}],"story":"奈良時代の【天平文化】は、平城京の皇族・貴族が担う華やかな貴族文化であると同時に、【鎮護国家】思想を反映した仏教文化で、遣唐使がもたらす盛唐文化や西域の影響で国際色豊かである。仏教は教理研究の学派である【南都六宗】が中心で、朝廷は鎮護国家のため仏教を広めようとして→唐から【鑑真】を招き、鑑真は【753】年に来日して戒律を伝え【唐招提寺】を創建した。【行基】は大仏造立に協力し、光明皇后は悲田院・施薬院を設けた。しかし造寺造仏が盛んになった結果→国家財政が窮乏し、玄昉・道鏡のような僧の政治介入や神仏習合も生じた。建築では校倉造の【正倉院】宝庫、彫刻では塑像と乾漆像が作られ、正倉院宝物には聖武太上天皇の遺愛品や西域の工芸品が残る。また皇室支配の正統性を示すため→【712】年に【古事記】、【720】年に【日本書紀】が完成し、【懐風藻】や【万葉集】も編まれた。","keywords":["天平文化","鎮護国家","南都六宗","南都七大寺","鑑真","唐招提寺","行基","正倉院宝物","校倉造","乾漆像","塑像","古事記","日本書紀","風土記","万葉集"],"blanks":[{"q":"奈良時代の文化を【　】文化といい、鎮護国家思想を反映する仏教文化でもある。","a":"天平","h":"聖武天皇の時代の年号"},{"q":"三論宗・成実宗・法相宗・俱舎宗・華厳宗・律宗の六宗派を【　】という。","a":"南都六宗","h":"教理研究の学派"},{"q":"南都七大寺のうち、藤原氏の氏寺は【　】である。","a":"興福寺","h":"阿修羅像で有名"},{"q":"753年に来日し、戒律を伝えて東大寺に戒壇院を建立した唐僧は【　】である。","a":"鑑真","h":"普照・栄叡の要請で渡来"},{"q":"鑑真はのちに【　】を創建し、そこで没した。","a":"唐招提寺","h":"鑑真和上像がある"},{"q":"民間布教や架橋・治水を行い、745年に大僧正となった僧は【　】である。","a":"行基","h":"大仏造立に協力"},{"q":"東大寺【　】宝庫は校倉造で、聖武太上天皇の遺愛品などを納める。","a":"正倉院","h":"光明皇太后が寄進"},{"q":"麻布を漆で塗り固めて原型を抜き取った仏像の製法を【　】という。","a":"乾漆像","h":"興福寺阿修羅像はこの製法"},{"q":"751年に成立した現存最古の漢詩集は【　】である。","a":"懐風藻","h":"淡海三船・石上宅嗣が代表的詩人"},{"q":"712年、元明天皇の命で稗田阿礼の暗誦を太安万侶が筆録した現存最古の歴史書は【　】である。","a":"古事記","h":"神代から推古天皇まで"},{"q":"720年、舎人親王らが編纂した漢文編年体の正史【　】は六国史の始めである。","a":"日本書紀","h":"神代から持統天皇まで"},{"q":"713年、元明天皇の命で各国の物産・地理・伝説を国司に編纂させたものを【　】という。","a":"風土記","h":"出雲・常陸・播磨・肥前・豊後の五つが残存"}],"mc":[{"q":"朝廷が鑑真を日本に招いた目的として最も適当なものはどれか。","c":["新羅征討の協力を得るため","鎮護国家思想の下で仏教を広め戒律を伝えてもらうため","大仏造立の技術を伝えてもらうため","遣唐使の航路を確保するため"],"a":1,"e":"朝廷は鎮護国家思想の下で仏教を広めるため唐から鑑真を招き、鑑真は戒律を伝えて東大寺に戒壇院を建立した。"},{"q":"南都六宗の性格について正しいものはどれか。","c":["一つの寺院に一宗派しか置けなかった","民衆への布教を目的とした","教理研究の学派であり一つの寺院に複数の宗派が存在できた","後世の宗派と同じく開祖を中心に組織された"],"a":2,"e":"南都六宗は宗派というより教理研究の学派なので、一つの寺院に複数の宗派が存在してもよかった。"},{"q":"鎮護国家仏教の政策がもたらした影響として誤っているものはどれか。","c":["国家財政の窮乏と人民の疲弊","玄昉・道鏡など僧の政治介入","神仏習合の発生","仏教勢力による平安京への寺院移転"],"a":3,"e":"影響は財政窮乏・僧の政治介入・神仏習合など。桓武天皇は逆に新都への寺院移転を禁止した。"},{"q":"正倉院宝物について正しいものはどれか。","c":["称徳天皇が十大寺に寄進した小塔である","光明皇太后が東大寺に寄進した聖武太上天皇の遺愛品などである","鑑真が唐から持参した仏典である","行基が集めた民衆の寄進品である"],"a":1,"e":"正倉院宝物は光明皇太后が東大寺に寄進した聖武太上天皇の遺愛品などで、シルクロード経由の西域の工芸品も含む。"},{"q":"称徳天皇が百万塔陀羅尼を十大寺に寄進した理由として正しいものはどれか。","c":["恵美押勝の乱の戦没者を慰霊するため","大仏開眼を祝うため","道鏡を法王にするため","藤原広嗣の乱を鎮めるため"],"a":0,"e":"764年の恵美押勝の乱の戦没者慰霊のため寄進した。内部の陀羅尼は現存最古級の印刷物。"},{"q":"古事記・日本書紀が編纂された目的として最も適当なものはどれか。","c":["唐に朝貢するための資料とするため","皇室による支配の正統性・正当性を示すため","地方の物産や伝説を記録するため","官人養成の教科書とするため"],"a":1,"e":"皇室による支配の正統性・正当性を示すため、天武天皇が命じた歴史書の編纂が奈良時代に完成した。"},{"q":"日本書紀について正しいものはどれか。","c":["稗田阿礼の暗誦を太安万侶が筆録した","漢字の音訓を用いて日本語を表記した","舎人親王らが編纂した漢文編年体の正史で六国史の始めである","各国の国司が編纂した地誌である"],"a":2,"e":"日本書紀は720年に元正天皇の命で舎人親王らが編纂した正史。古事記は稗田阿礼・太安万侶。"},{"q":"律令国家の教育制度について正しいものはどれか。","c":["大学は地方に置かれ郡司の子弟が通った","国学は中央に置かれ貴族の子弟が通った","庶民教育を主目的とした","大学は中央に置かれ式部省が管轄した"],"a":3,"e":"大学は中央に設置され式部省が管轄、国学は地方に設置され国司が管轄。官人養成が目的で庶民教育は行わなかった。"}],"order":[{"title":"歴史書・文芸の成立","items":["古事記","風土記","日本書紀","懐風藻","万葉集"],"e":"712年古事記→713年風土記→720年日本書紀→751年懐風藻→8世紀後半万葉集。"},{"title":"鎮護国家仏教の展開","items":["国分寺建立の詔","大仏造立の詔","東大寺大仏開眼供養会","鑑真の来日"],"e":"741年国分寺建立の詔→743年大仏造立の詔→752年開眼供養会→753年鑑真来日。"},{"title":"道鏡と仏教政治","items":["恵美押勝の乱","道鏡が太政大臣禅師","道鏡が法王","宇佐八幡神託事件"],"e":"764年の乱→765年太政大臣禅師→766年法王→769年神託事件で即位を阻止。"}]},{"title":"遷都と蝦夷の征討","flow":[{"y":"780","t":"伊治呰麻呂の乱","s":"服属していた蝦夷の族長が反乱し、多賀城を焼き払う","why":""},{"y":"781","t":"桓武天皇即位","s":"天智系皇室の威勢を示し、政治の刷新をはかる","why":""},{"y":"784","t":"長岡京遷都","s":"藤原種継の進言で大和国から山背国へ。新都への寺院移転を禁止","why":"仏教勢力の政治介入を排除し、水陸交通の便を得るため"},{"y":"785","t":"藤原種継暗殺事件","s":"大伴氏・佐伯氏が首謀。早良親王が廃太子され無実を訴えながら死去","why":"奈良時代に不遇だった大伴氏らの反発"},{"y":"789","t":"紀古佐美の征討失敗","s":"征東大使紀古佐美が蝦夷征討に失敗。その後大伴弟麻呂も失敗","why":"本格的な東北支配を開始したため"},{"y":"794","t":"平安京遷都","s":"和気清麻呂の進言で京都盆地へ遷都。平安時代スタート","why":"早良親王の怨霊を恐れ、洪水で長岡京造営が遅れたため"},{"y":"797","t":"坂上田村麻呂の任命","s":"征夷大将軍に任命される","why":""},{"y":"802","t":"胆沢城の築城","s":"北上川沿いに築き鎮守府を移転。阿弖流為らが帰順。翌年志波城","why":"東北支配の拠点を北へ進めるため"},{"y":"805","t":"徳政論争","s":"藤原緒嗣の意見を採用し「軍事と造作」を中断","why":"蝦夷征討と平安京造営で民衆が疲弊したため"},{"y":"811","t":"文室綿麻呂の征討","s":"嵯峨天皇のもとで征討し、38年続いた蝦夷との戦いが終了。のち徳丹城を築く","why":""}],"story":"【光仁天皇】以降、皇室は天武系から天智系に代わった。その子【桓武天皇】は、仏教勢力の政治介入を排除し政治を刷新するため→【784】年に山背国の【長岡京】へ遷都し、寺院の移転を禁じた。しかし翌年【藤原種継】が暗殺され、皇太子【早良親王】が廃太子されて亡くなると→母や皇后の死や洪水を「早良親王の怨霊」と恐れ、和気清麻呂の進言で【794】年に【平安京】へ遷都した。一方東北では【780】年に【伊治呰麻呂】が反乱して多賀城を焼いたため→桓武天皇は本格的な蝦夷征討を始め、紀古佐美らの失敗の後【坂上田村麻呂】を征夷大将軍に任じ、【802】年に【胆沢城】を築いて阿弖流為らを帰順させた。しかし蝦夷征討と平安京造営の二大事業は民衆の負担が大きかったため→【805】年の【徳政論争】で【藤原緒嗣】の意見を採り「軍事と造作」を中断した。嵯峨天皇のとき【文室綿麻呂】の征討で蝦夷との戦いはいったん終わった。","keywords":["桓武天皇","長岡京","藤原種継","早良親王","平安京","和気清麻呂","徳政論争","藤原緒嗣","伊治呰麻呂","坂上田村麻呂","胆沢城","志波城","文室綿麻呂","徳丹城","俘囚"],"blanks":[{"q":"784年、【　】天皇は政治の刷新と水陸交通の利便性を理由に大和国から山背国へ遷都した。","a":"桓武","h":"光仁天皇と高野新笠の子"},{"q":"784年に遷都した山背国の都は【　】である。","a":"長岡京","h":"藤原種継の進言"},{"q":"785年、長岡京造営の責任者【　】が暗殺された。","a":"藤原種継","h":"式家。大伴氏・佐伯氏が首謀"},{"q":"藤原種継暗殺事件により廃太子され、無実を訴えながら亡くなった桓武天皇の弟は【　】である。","a":"早良親王","h":"その怨霊が恐れられた"},{"q":"794年、和気清麻呂の進言により【　】へ遷都し、平安時代が始まった。","a":"平安京","h":"山城国の京都盆地"},{"q":"805年、桓武天皇が藤原緒嗣の意見を採用して二大事業を中断した議論を【　】という。","a":"徳政論争","h":"菅野真道の意見は退けられた"},{"q":"780年、服属していた蝦夷の族長【　】が反乱し、多賀城を焼き払った。","a":"伊治呰麻呂","h":"光仁天皇の時代"},{"q":"797年に征夷大将軍に任命され、802年に胆沢城を築いたのは【　】である。","a":"坂上田村麻呂","h":"阿弖流為らを帰順させた"},{"q":"802年に北上川沿いに築かれ、多賀城から鎮守府が移された城柵は【　】である。","a":"胆沢城","h":"翌年その北方に志波城"},{"q":"811年、嵯峨天皇のもとで征夷将軍【　】が蝦夷を征討し、38年続いた戦いがいったん終了した。","a":"文室綿麻呂","h":"のち徳丹城を築く"},{"q":"朝廷に服属した蝦夷を【　】といい、関東以西の各地にも移住させられた。","a":"俘囚","h":"柵戸は東北へ移された農民"}],"mc":[{"q":"桓武天皇が大和国から山背国へ遷都した理由として最も適当なものはどれか。","c":["蝦夷の侵攻から逃れるため","仏教勢力の政治介入を排除し政治を刷新するため","藤原氏の氏寺に近づくため","遣唐使の港に近づくため"],"a":1,"e":"桓武天皇は政治の刷新と水陸交通の利便性を理由に遷都し、新都への寺院移転を禁じて仏教勢力の政治介入を排除した。"},{"q":"長岡京から平安京へ遷都した背景として正しいものはどれか。","c":["伊治呰麻呂の乱で長岡京が焼かれたため","徳政論争で造営が中止されたため","母や皇后の死や洪水を早良親王の怨霊と恐れたため","藤原種継が進言したため"],"a":2,"e":"桓武天皇は母や皇后の相次ぐ死や洪水による造営の遅れを早良親王の怨霊と恐れ、和気清麻呂の進言で平安京に遷都した。"},{"q":"藤原種継暗殺事件の結果として正しいものはどれか。","c":["早良親王が廃太子された","藤原緒嗣が失脚した","坂上田村麻呂が征夷大将軍に任命された","道鏡が下野国に左遷された"],"a":0,"e":"事件は大伴氏・佐伯氏が首謀し、桓武天皇の同母弟である皇太子早良親王が廃太子され、無実を訴えながら死去した。"},{"q":"平安時代前期に本格的な蝦夷征討が行われた理由として正しいものはどれか。","c":["新羅と蝦夷が結んだため","服属した蝦夷の抵抗が続き、天智系皇室の威勢を示す必要があったため","初期荘園を東北に開くため","多賀城の造営に資金が必要だったため"],"a":1,"e":"780年の伊治呰麻呂の乱など服属した蝦夷の抵抗が続き、新たな天智系皇室の威勢を示す必要もあったため。"},{"q":"徳政論争で桓武天皇が「軍事と造作」を中断した理由として正しいものはどれか。","c":["蝦夷征討が完了したため","菅野真道が中断を進言したため","蝦夷征討と平安京造営で民衆が疲弊していたため","藤原種継が暗殺されたため"],"a":2,"e":"桓武天皇は菅野真道の継続論を退け、藤原緒嗣の意見を採用して、疲弊した民衆のため蝦夷征討と平安京造営を中断した。"},{"q":"坂上田村麻呂の蝦夷征討について正しいものはどれか。","c":["征東大使として派遣され失敗した","多賀城を築き陸奥国府を置いた","胆沢城を築き阿弖流為らを帰順させた","徳丹城を築いて征討を終えた"],"a":2,"e":"田村麻呂は802年に北上川沿いに胆沢城を築いて鎮守府を移し、阿弖流為らが帰順した。徳丹城は文室綿麻呂。"},{"q":"奈良時代後期以降の皇室について正しいものはどれか。","c":["天武系の女帝が続いた","光仁天皇以降、天智系の男帝に代わった","藤原氏出身の天皇が即位した","桓武天皇は天武天皇の孫である"],"a":1,"e":"飛鳥時代後期以降の皇室は天武系で女帝も多かったが、光仁天皇以降は天智系の男帝に代わった。"}],"order":[{"title":"桓武天皇の遷都","items":["長岡京遷都","藤原種継暗殺事件","平安京遷都","徳政論争"],"e":"784年長岡京→785年種継暗殺→794年平安京→805年徳政論争で二大事業中断。"},{"title":"東北の城柵","items":["多賀城","秋田城","胆沢城","志波城","徳丹城"],"e":"724年多賀城→733年秋田城→802年胆沢城→803年志波城→嵯峨朝の徳丹城が最後。"},{"title":"蝦夷征討の展開","items":["伊治呰麻呂の乱","紀古佐美の征討失敗","坂上田村麻呂の征夷大将軍任命","文室綿麻呂の征討"],"e":"780年反乱→789年紀古佐美失敗→797年田村麻呂任命→811年文室綿麻呂で戦いが終了。"}]}],"review":[{"q":"藤原不比等の建議で遷都された都と、その都で始まった時代の政争の説明として正しいものはどれか。","c":["長岡京。藤原種継が造営を主導した","平城京。藤原氏を中心に政争が展開し最終的に藤原氏が勝ち残った","平安京。和気清麻呂が遷都を進言した","恭仁京。藤原広嗣の乱を避けて遷都した"],"a":1,"e":"710年に平城京へ遷都し、奈良時代の政争は不比等・四子・仲麻呂・百川ら藤原氏を中心に展開した。"},{"q":"藤原広嗣の乱から墾田永年私財法までの流れとして正しいものはどれか。","c":["乱の後、聖武天皇は平城京にとどまり大仏を造立した","乱の背景には道鏡の登用があった","乱の後、聖武天皇は恭仁京などに遷都し、鎮護国家のため仏教を重視するとともに開墾を促した","乱の後、藤原四子が政権を握った"],"a":2,"e":"740年の乱後、聖武天皇は恭仁京・難波宮・紫香楽宮を転々とし、国分寺建立・大仏造立の詔を出し、743年に墾田永年私財法を出した。"},{"q":"鎮護国家仏教の進展が奈良時代後半の政治に与えた影響として正しいものはどれか。","c":["僧の道鏡が政治に介入し、皇位をうかがった","南都六宗が藤原氏を排除した","鑑真が太政大臣禅師となった","行基が長屋王を滅ぼした"],"a":0,"e":"仏教の国家保護により玄昉・道鏡など僧の政治介入が生じ、道鏡は法王となって宇佐八幡神託事件を起こした。"},{"q":"桓武天皇が新都への寺院移転を禁止した背景として、奈良時代の出来事と関連づけて最も適当なものはどれか。","c":["南都七大寺が正倉院宝物を独占したため","鑑真が東大寺に戒壇院を建立したため","道鏡など僧が政治に介入した反省から仏教勢力を排除しようとしたため","行基が民間布教を行ったため"],"a":2,"e":"奈良時代には玄昉・道鏡など僧の政治介入が問題となったため、桓武天皇は長岡京への寺院移転を禁止して仏教勢力を排除した。"},{"q":"光仁天皇の即位から桓武天皇の蝦夷征討までの流れとして正しいものはどれか。","c":["天武系皇室が復活し、その威勢を示すため征討が行われた","藤原百川が光仁天皇を擁立して天智系が復活し、桓武天皇は新皇室の威勢を示すため本格的な征討を行った","道鏡が光仁天皇を擁立し、蝦夷征討を主導した","称徳天皇が光仁天皇に譲位し、征討を命じた"],"a":1,"e":"770年に百川らが天智系の光仁天皇を擁立し、子の桓武天皇は伊治呰麻呂の乱後の蝦夷の抵抗に対し、新皇室の威勢を示すため本格的な征討を行った。"},{"q":"奈良時代の農民の疲弊と桓武天皇の政策の関係として正しいものはどれか。","c":["農民の疲弊を受けて班田収授を廃止した","農民の疲弊を受けて墾田永年私財法を出した","民衆の負担を考え、徳政論争で蝦夷征討と平安京造営を中断した","民衆の負担を考え、遣唐使を廃止した"],"a":2,"e":"過大な負担で農民が疲弊していたうえ、蝦夷征討と平安京造営の二大事業の負担も大きかったため、805年の徳政論争で中断した。"}]},{"id":4,"title":"律令体制の衰退","era":"平安時代前期〜中期","span":"794〜1068","oneLine":"律令再建の努力は実らず、国司は徴税請負人化し、藤原北家の摂関政治が全盛を迎えた","chain":["桓武天皇","嵯峨天皇","藤原良房","藤原基経","宇多天皇","醍醐天皇","村上天皇","藤原道長","藤原頼通"],"parts":[{"title":"律令体制の衰退","flow":[{"y":"792","t":"健児の制","s":"辺境を除き公民の兵役・軍団を廃止し、郡司の子弟や有力農民の志願による少数精鋭の健児を採用","why":"農民負担を軽減するため"},{"y":"","t":"勘解由使の設置","s":"桓武天皇が解由状を審査し、国司交代の際の引継ぎを厳しく監督させた","why":"地方政治の監督を強化するため"},{"y":"","t":"徳政論争","s":"桓武天皇が「軍事と造作」を停止","why":"農民負担の軽減のため"},{"y":"810","t":"蔵人所の設置","s":"嵯峨天皇が設置し、蔵人頭に藤原冬嗣（北家）・巨勢野足を任命","why":"天皇側近の機関で政務を速やかに扱うため"},{"y":"810","t":"平城太上天皇の変（薬子の変）","s":"藤原仲成（式家）は処刑、妹の薬子は自殺し、藤原式家は没落","why":"平城太上天皇の重祚と平城京再遷都を画策して失敗したため"},{"y":"816","t":"検非違使の設置","s":"令の規定にこだわらず京内の警察・裁判にあたる。のち刑部省・弾正台・衛門府・左右京職の業務を吸収","why":""},{"y":"820","t":"弘仁格式の編纂","s":"嵯峨天皇。三代格式の最初。格・式を重視し有効なものを整理","why":"律令を日本の実情に合わせて修正するため"},{"y":"823","t":"公営田の設置","s":"嵯峨天皇が大宰府管内に設置した直営方式の田。のち官田（879年、畿内）なども","why":"班田収授の後退で税収が減少し、有力農民を利用して税収を確保するため"},{"y":"902","t":"延喜の荘園整理令・最後の班田","s":"醍醐天皇が勅旨田・非合法荘園を停止。班田の記録はこの年で途絶える","why":"律令制を維持する努力"},{"y":"988","t":"尾張国郡司百姓等解","s":"尾張守藤原元命が郡司・百姓に訴えられ、翌年解任される","why":"徴税請負人化した国司（受領）と地方豪族・有力農民が対立したため"}],"story":"奈良時代に揺らいだ律令国家を再建するため、【桓武天皇】は【健児の制】（792年）などで農民負担を軽くし、【勘解由使】を置いて国司交代の引継ぎを監督した。【嵯峨天皇】は810年に【蔵人所】を設置し、蔵人頭に【藤原冬嗣】を任命したため藤原北家が台頭、同年の【平城太上天皇の変】で藤原式家は没落した。さらに816年に【検非違使】、820年に【弘仁格式】と律令を実情に合わせて修正した。しかし農民の【偽籍】や浮浪・逃亡で戸籍・計帳が形だけとなり、班田収授や徴税が困難になった→そこで823年の【公営田】など直営方式の田で税収確保をはかった。902年の【延喜の荘園整理令】を最後に班田は途絶え、10世紀には国司に一定量の税納入と引き換えに一国の支配を一任した→国司は【受領】として徴税請負人化し、【田堵】に名の耕作を請け負わせる【負名体制】へ転換。【成功】や【遙任】が広がり、【藤原元命】のように訴えられる国司も現れた。","keywords":["桓武天皇","健児の制","勘解由使","嵯峨天皇","蔵人所","藤原冬嗣","平城太上天皇の変","検非違使","弘仁格式","令義解","偽籍","公営田","延喜の荘園整理令","受領","田堵"],"blanks":[{"q":"792年、【　】の制により辺境を除いて公民の兵役・軍団が廃止され、郡司の子弟や有力農民の志願による少数精鋭が採用された。","a":"健児","h":"桓武天皇の農民負担軽減策"},{"q":"桓武天皇は解由状を審査して国司交代の引継ぎを監督する【　】を設置した。","a":"勘解由使","h":"地方政治の監督強化"},{"q":"810年、嵯峨天皇は天皇側近の機関として【　】を設置し、蔵人頭に藤原冬嗣・巨勢野足を任命した。","a":"蔵人所","h":"これにより藤原北家が台頭"},{"q":"810年の【　】で藤原仲成は処刑、薬子は自殺し、藤原式家は没落した。","a":"平城太上天皇の変","h":"薬子の変ともいう"},{"q":"816年に設置された【　】は、令の規定にこだわらず京内の警察・裁判にあたった。","a":"検非違使","h":"のち刑部省・弾正台などの業務を吸収"},{"q":"嵯峨天皇の【　】、清和天皇の貞観格式、醍醐天皇の延喜格式をあわせて三代格式という。","a":"弘仁格式","h":"9世紀前半に編纂"},{"q":"淳和天皇が清原夏野らに編纂させた養老令の官撰注釈書を【　】という。","a":"令義解","h":"私撰の令集解と区別"},{"q":"9世紀後半、惟宗直本が令に関する法律家たちの注釈を私的に集めたものを【　】という。","a":"令集解","h":"私撰"},{"q":"8世紀後半〜9世紀、農民の【　】や浮浪・逃亡が一般化し、戸籍・計帳が形だけのものとなった。","a":"偽籍","h":"負担の大きい男子を少なく申告すること"},{"q":"823年、嵯峨天皇は大宰府管内に直営方式の田である【　】を設置した。","a":"公営田","h":"879年には畿内に官田"},{"q":"902年、醍醐天皇は【　】の荘園整理令を出し、勅旨田・非合法荘園を停止した。","a":"延喜","h":"同年が最後の班田"},{"q":"自ら任国に赴任する国司の最上級者を【　】といい、任国に赴任せず収入のみを受け取る国司を遙任という。","a":"受領","h":"通常は守"}],"mc":[{"q":"桓武天皇が健児の制を採用した目的として最も適当なものはどれか。","c":["蝦夷征討の兵力を増強するため","農民の兵役負担を軽減するため","京内の警察・裁判を強化するため","国司交代の引継ぎを監督するため"],"a":1,"e":"辺境を除いて公民の兵役・軍団を廃止し、少数精鋭の健児を採用した。農民負担軽減策の一つ。"},{"q":"810年に藤原北家が台頭した直接の契機として正しいものはどれか。","c":["藤原冬嗣が嵯峨天皇の蔵人頭に任命された","藤原仲成が検非違使に任命された","藤原冬嗣が桓武天皇の関白に任命された","藤原百川が勘解由使に任命された"],"a":0,"e":"嵯峨天皇が蔵人所を設置し、蔵人頭に藤原冬嗣（北家）を任命したことで北家が台頭した。"},{"q":"平城太上天皇の変（薬子の変）の結果として正しいものはどれか。","c":["藤原北家が没落した","平城京への再遷都が実現した","藤原式家が没落した","嵯峨天皇が譲位した"],"a":2,"e":"藤原仲成は処刑、薬子は自殺し、式家は没落。810年は式家と北家の勢力が入れ替わる年。"},{"q":"9世紀に公営田・官田などの直営方式の田が経営された背景として最も適当なものはどれか。","c":["墾田永年私財法で開墾が禁止されたため","国司が遙任するようになり任国に不在だったため","藤原氏が荘園を寄進させて集積したため","偽籍や浮浪・逃亡で班田収授・徴税が困難になり税収が減少したため"],"a":3,"e":"戸籍・計帳が形だけとなり個別人身支配が困難になったため、有力農民を利用した直営方式で税収確保をはかった。"},{"q":"弘仁格式について正しいものはどれか。","c":["清和天皇の命で9世紀半ばに編纂された","淳和天皇の命で清原夏野らが編纂した","醍醐天皇の命で10世紀初めに編纂された","嵯峨天皇の命で9世紀前半に編纂された"],"a":3,"e":"弘仁（嵯峨）→貞観（清和）→延喜（醍醐）。令義解は淳和天皇の命で清原夏野らが編纂した養老令の注釈書。"},{"q":"10世紀の徴税方式の転換
