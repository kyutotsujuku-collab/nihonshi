本を刊行した","沿線の住宅地開発と歌劇団・ターミナルデパートの経営を組み合わせた","映画会社を設立し有声映画を製作した"],"a":2,"e":"乗客増加のため沿線で住宅地開発を進めるとともに宝塚少女歌劇団などの娯楽施設を経営し、梅田に阪急百貨店を開業した。"},{"q":"反自然主義の文学の組み合わせとして正しいものはどれか。","c":["白樺派＝芥川龍之介","新思潮派＝菊池寛","新感覚派＝永井荷風","耽美派＝志賀直哉"],"a":1,"e":"新思潮派は芥川龍之介・菊池寛、白樺派は武者小路実篤・志賀直哉・有島武郎、耽美派は永井荷風・谷崎潤一郎、新感覚派は横光利一・川端康成。"},{"q":"歌謡曲〔流行歌〕が流行した背景として正しいものはどれか。","c":["蓄音機とレコードの登場・ラジオ放送の開始","唱歌が小学校教育に導入されたため","東京音楽学校の設立","新劇運動の展開"],"a":0,"e":"蓄音機とレコードの登場、ラジオ放送開始により歌謡曲が流行し、中山晋平・古賀政男らの作曲家が活躍した。"}],"order":[{"title":"マスメディアの発展","items":["総合雑誌『改造』創刊","ラジオ放送開始","大衆娯楽雑誌『キング』創刊","日本放送協会の設立"],"e":"1919年『改造』→1925年ラジオ放送開始→同年『キング』創刊→1926年NHK設立・円本刊行開始。"},{"title":"オリンピック参加の歩み","items":["ストックホルム大会に初参加","アントワープ大会で初のメダル","アムステルダム大会で初の金メダル","ベルリン大会で女子初の金メダル"],"e":"1912年初参加→1920年初メダル→1928年織田幹雄・鶴田義行が金→1936年前畑秀子が女子初の金。"}]}],"review":[{"q":"第一次産業革命と第二次産業革命の違いとして正しいものはどれか。","c":["第一次は重工業、第二次は軽工業が中心","第一次は軽工業、第二次は重工業が中心","どちらも製糸業のみが中心","第一次は日露戦争前後、第二次は日清戦争前後"],"a":1,"e":"日清戦争前後の第一次産業革命は紡績・製糸など軽工業、日露戦争前後の第二次産業革命は鉄鋼・造船など重工業が中心。"},{"q":"資本主義の成立後に社会運動が発生した理由として最も適当なものはどれか。","c":["政党内閣が成立したため","金本位制が確立したため","格差が広がり、低賃金・長時間労働などの労働問題が生じたため","国家主義思想が衰退したため"],"a":2,"e":"資本主義が成立して格差が広がり、女工や坑夫の虐待などの労働問題が生じたため、労働組合期成会の結成や社会主義運動が起こった。"},{"q":"明治政府が社会主義運動を弾圧した理由として正しいものはどれか。","c":["平等を求める社会主義が政府の前提とする資本主義と相容れなかったため","社会主義者が国家主義を唱えたため","社会主義者が財閥を支持したため","社会主義者が神道国教化を求めたため"],"a":0,"e":"平等を求める社会主義は政府が前提とする資本主義と相容れず、治安警察法や大逆事件で弾圧された。"},{"q":"明治の国家主義教育と大正の自由教育の関係について正しいものはどれか。","c":["教育勅語により児童中心主義が確立した","学校令で自由教育運動が始まった","学校令・教育勅語で国家主義教育が確立したのち、大正後期に児童中心主義の自由教育運動が広がった","自由教育運動の結果、国定教科書が導入された"],"a":2,"e":"1886年学校令・1890年教育勅語で国家主義教育が確立し、1903年国定教科書で統制が強まったが、大正後期には沢柳政太郎らの自由教育運動が広がった。"},{"q":"明治末期から大正期にかけての社会主義運動の流れとして正しいものはどれか。","c":["日本社会党結成→大逆事件→冬の時代→森戸事件・日本社会主義同盟→日本共産党結成","大逆事件→冬の時代→日本共産党結成→日本社会党結成","日本共産党結成→大逆事件→日本社会党結成","森戸事件→大逆事件→日本社会党結成"],"a":0,"e":"1906年日本社会党→1910年大逆事件で冬の時代→1920年森戸事件・日本社会主義同盟で再燃→1922年日本共産党結成。"},{"q":"大正・昭和初期の文化が「大衆化」した背景として、明治期からの変化を踏まえて最も適当なものはどれか。","c":["お雇い外国人が増加したため","義務教育の普及と都市化により新中間層が生まれ、ラジオ・雑誌などマスメディアが発展したため","国家主義教育が廃止されたため","廃仏毀釈により宗教が衰退したため"],"a":1,"e":"義務教育の徹底と民衆の政治意識の高まり、新中間層の登場を背景に、ラジオ放送や『キング』・円本などのマスメディアが文化を国民的に普及させた。"}]},{"id":19,"title":"戦争への道と敗戦","era":"大正末期〜昭和前期","span":"1915〜1945","oneLine":"恐慌の連続で政党政治が倒れ、軍部の独走が満洲事変・日中戦争・太平洋戦争と敗戦を招いた","chain":["原敬","加藤高明","若槻礼次郎","田中義一","浜口雄幸","犬養毅","斎藤実","岡田啓介","広田弘毅","近衛文麿","東条英機"],"parts":[{"title":"大戦景気と戦後恐慌・震災恐慌","flow":[{"y":"1914","t":"第一次世界大戦勃発","s":"ヨーロッパの生産力低下と需要増大で日本からの軍需品・日用品輸出が急増","why":"列強がアジア市場から後退し、日本がほぼ無競争で輸出できたため"},{"y":"1915","t":"大戦景気の始まり","s":"アジア向け綿織物・綿糸、アメリカ向け生糸の輸出が伸張し、輸出超過に転じる","why":"アジア市場の独占とアメリカの好景気"},{"y":"1915","t":"猪苗代水力発電所の長距離送電","s":"福島県〜東京間の長距離送電に成功し、水力発電が発達","why":""},{"y":"1917","t":"金輸出禁止","s":"正貨は急増したが、列国にならって金輸出を禁止","why":"アメリカの金輸出禁止にならったため"},{"y":"1918","t":"工業生産額が農業生産額を上回る","s":"アジア最大の工業国となるが、工業人口は農業人口の半数以下","why":"軽工業の躍進と重化学工業化の進展"},{"y":"1918","t":"米騒動","s":"成金の出現と物価高騰で民衆の生活が苦しくなり米騒動が起こる","why":"物価上昇率に賃金上昇率が追いつかず実質賃金が低下したため"},{"y":"1920","t":"戦後恐慌","s":"株価暴落、生糸・綿糸相場の暴落、銀行の休業と失業者の増大","why":"大戦終結でヨーロッパ諸国が復興し、国際競争が復活したため"},{"y":"1920","t":"原敬内閣の救済融資","s":"日本銀行を通じ市中銀行に多額の救済融資を実施","why":"恐慌を鎮めるためだが、財界の整理が進まず不況が長期化"},{"y":"1923","t":"関東大震災・震災恐慌","s":"9月1日の直下型地震で被害総額60億円以上。戒厳令発令","why":""},{"y":"1923","t":"第二次山本権兵衛内閣の対策","s":"1か月間のモラトリアムと震災手形割引損失補償令で日銀が特別融資","why":"震災手形を抱えた市中銀行の連鎖倒産を防ぐため"}],"story":"【第一次世界大戦】でヨーロッパの生産力が落ちて需要が増えたため→日本は軍需品・日用品を大量輸出し、アジア向け【綿織物・綿糸】、アメリカ向け【生糸】の輸出も伸びて【大戦景気】となった。敵国【ドイツ】からの輸入が途絶えたため→化学工業も勃興した。しかし物価上昇率に賃金上昇率が追いつかず実質賃金は低下し→民衆の生活苦は【米騒動】（1918年）につながった。大戦終結でヨーロッパ諸国が復興したため→輸出不振・生産過剰となり、1920年に【戦後恐慌】が発生した。【原敬内閣】は日本銀行を通じて救済融資を行ったが→財界の整理が進まず不況は慢性化した。そこへ1923年の【関東大震災】で【震災恐慌】が起こり→【第二次山本権兵衛内閣】はモラトリアムと震災手形割引損失補償令を出したが、決済不能の震災手形が残り、不況下のインフレが定着した。","keywords":["大戦景気","船成金","在華紡","猪苗代水力発電所","鈴木商店","戦後恐慌","震災恐慌","関東大震災","モラトリアム","震災手形割引損失補償令","帝都復興院","後藤新平","四大工業地帯"],"blanks":[{"q":"第一次世界大戦中を中心とする1915〜19年頃の好景気を【　】という。","a":"大戦景気","h":"「大正バブル」的な好景気"},{"q":"大戦景気の際、アメリカの好景気を背景にアメリカ向け【　】の輸出が伸張した。","a":"生糸","h":"アジア向けは綿織物・綿糸"},{"q":"大戦景気で企業買収を繰り返し急成長した神戸の総合商社は【　】である。","a":"鈴木商店","h":"番頭は金子直吉"},{"q":"第一次世界大戦で敵国となった【　】からの輸入が途絶したため、化学工業が勃興した。","a":"ドイツ","h":"薬品・染料・肥料の国産化"},{"q":"1915年、【　】（福島県）〜東京間の長距離送電に成功し、水力発電が発達した。","a":"猪苗代水力発電所","h":"電灯の農村部への普及も進んだ"},{"q":"国内の賃金上昇を背景に、大戦後は上海・青島などでの現地工場経営（＝【　】）も行われた。","a":"在華紡","h":"紡績業における資本輸出"},{"q":"1920年、ヨーロッパ諸国の復興を原因として反動的な【　】が発生した。","a":"戦後恐慌","h":"株価が暴落し輸入超過に"},{"q":"戦後恐慌に対し、【　】内閣は日本銀行を通じ市中銀行に多額の救済融資を実施した。","a":"原敬","h":"立憲政友会の本格的政党内閣"},{"q":"1923年9月1日に発生した【　】が原因で震災恐慌が起こった。","a":"関東大震災","h":"マグニチュード7.9の直下型地震"},{"q":"震災恐慌に際し、第二次山本権兵衛内閣は緊急勅令により1か月間の【　】を実施した。","a":"モラトリアム","h":"支払猶予令"},{"q":"震災手形を抱える市中銀行に対する日銀の特別融資と政府の損失補償を定めたのは【　】である。","a":"震災手形割引損失補償令","h":"特別融資約4億3000万円、政府補償1億円"},{"q":"東京復興のため帝都復興院が設置され、総裁には東京市長経験者の【　】内相が就任した。","a":"後藤新平","h":"第二次山本権兵衛内閣の内務大臣"}],"mc":[{"q":"大戦景気が起こった背景として適当でないものはどれか。","c":["ヨーロッパにおける生産力低下と需要増大","アジア市場の独占","アメリカの好景気","ヨーロッパ諸国の復興"],"a":3,"e":"ヨーロッパ諸国の復興は大戦景気を終わらせ、戦後恐慌を招いた原因である。"},{"q":"第一次世界大戦期に化学工業が勃興した理由として最も適当なものはどれか。","c":["敵国ドイツからの輸入が途絶したため","アメリカの好景気で薬品の需要が増えたため","中国の在華紡が化学製品を求めたため","水力発電の発達で電力が余ったため"],"a":0,"e":"ドイツからの薬品・染料・肥料の輸入途絶を受け、国産化を目指して化学工業が勃興した。"},{"q":"大戦景気の結果、民衆の生活が苦しくなった理由として最も適当なものはどれか。","c":["工業人口が農業人口を上回ったため","物価上昇率に賃金上昇率が追いつかず実質賃金が低下したため","輸入超過により外貨が減少したため","銀行が閉鎖され失業者が増大したため"],"a":1,"e":"労働者数は大戦前の1.5倍以上になったが、実質賃金は低下し、物価高騰で生活苦となり米騒動につながった。"},{"q":"戦後恐慌の際に不況が長期化した理由として最も適当なものはどれか。","c":["政府が救済融資を一切行わなかったため","戒厳令により経済活動が停止したため","日銀を通じた救済融資により財界の整理や企業の合理化が進まなかったため","金解禁により正貨が大量流出したため"],"a":2,"e":"原敬内閣の救済融資で企業は延命したが、国際競争力が付かないまま不況は長期化した。"},{"q":"戦後恐慌と震災恐慌の違いについて正しいものはどれか。","c":["戦後恐慌は予測不能で、震災恐慌は予測通りに起こった","戦後恐慌は予測通りに起こったが、震災恐慌は予測不能だった","どちらも金解禁が原因で起こった","どちらも予測不能だった"],"a":1,"e":"戦後恐慌は大戦終結によるヨーロッパ復興という予測できる原因だったが、震災恐慌は地震という予想外の事態で起こった。"},{"q":"震災恐慌に対する第二次山本権兵衛内閣の対策として正しいものはどれか。","c":["3週間のモラトリアムと片面紙幣の発行","重要産業統制法による不況カルテルの助成","金輸出再禁止による管理通貨制への移行","1か月間のモラトリアムと震災手形割引損失補償令"],"a":3,"e":"3週間のモラトリアムは1927年金融恐慌時の田中義一内閣、金輸出再禁止は犬養毅内閣の政策。"},{"q":"震災恐慌の結果として適当でないものはどれか。","c":["決済不能の震災手形の残存","復興のための輸入急増と国際収支の大赤字","成金の出現と債権国への転換","不況下のインフレーション（スタグフレーション）"],"a":2,"e":"成金の出現や債権国化は大戦景気の展開であり、震災恐慌ではむしろ経済が弱体化した。"}],"order":[{"title":"大戦景気から震災恐慌までの流れ","items":["第一次世界大戦勃発","金輸出禁止","米騒動","戦後恐慌","関東大震災"],"e":"1914年大戦勃発→1917年金輸出禁止→1918年米騒動→1920年戦後恐慌→1923年関東大震災。"},{"title":"震災恐慌の経過","items":["関東大震災の発生","戒厳令の発令","モラトリアム（支払猶予令）の実施","震災手形割引損失補償令","帝都復興院の設置"],"e":"地震発生後、戒厳令→緊急勅令によるモラトリアム→震災手形の損失補償→復興のための国家支出、と対策が続いた。"}]},{"title":"「憲政の常道」","flow":[{"y":"1924","t":"清浦奎吾内閣成立","s":"元老の松方正義・西園寺公望が枢密院議長清浦を推し、貴族院中心の超然内閣が成立","why":"政党と距離を置く人物を選ぶため"},{"y":"1924","t":"第二次護憲運動","s":"護憲三派（憲政会・立憲政友会・革新倶楽部）が「普選断行」「行財政整理」「貴族院改革」を掲げて倒閣運動","why":"超然内閣への反発だが、民衆運動は盛り上がらず"},{"y":"1924","t":"加藤高明内閣成立","s":"護憲三派が総選挙に大勝し連立内閣を組織。憲政の常道の始まり","why":"衆議院の多数党総裁に組閣の大命が下る慣習ができた"},{"y":"1925","t":"日ソ基本条約・治安維持法・普通選挙法","s":"北樺太撤兵と引き換えに油田開発権を獲得。国体変革・私有財産制否認の結社を処罰。満25歳以上の男子に選挙権","why":"日ソ国交樹立による共産主義の波及を防ぎつつ普通選挙に備えるため"},{"y":"1926","t":"第一次若槻礼次郎内閣成立・昭和と改元","s":"加藤の病死により若槻が組閣。大正天皇崩御で裕仁親王が即位","why":""},{"y":"1927","t":"田中義一内閣成立","s":"金融恐慌処理で若槻内閣が総辞職し、立憲政友会の田中が組閣。強硬外交と高橋積極財政","why":"幣原協調外交に不満をもつ枢密院が緊急勅令案を否決したため"},{"y":"1929","t":"浜口雄幸内閣成立","s":"張作霖爆殺事件の処理で田中内閣が総辞職し、立憲民政党の浜口が組閣。幣原外交と井上緊縮財政","why":"田中首相が昭和天皇の不信を買ったため"},{"y":"1930","t":"統帥権干犯問題","s":"ロンドン海軍軍縮条約調印を軍令部・枢密院・右翼・立憲政友会が攻撃し、浜口が東京駅で狙撃される","why":""},{"y":"1931","t":"第二次若槻礼次郎内閣・満洲事変","s":"満洲事変に不拡大方針をとるが陸軍が無視し、閣内不統一で総辞職","why":""},{"y":"1932","t":"五・一五事件","s":"犬養毅首相が暗殺され、戦前の政党政治は終焉","why":"不況の連続で限界を感じた軍部や世論が政党内閣を見限ったため"}],"story":"1924年、元老は政党と距離を置くため→枢密院議長【清浦奎吾】を首相に推し、超然内閣が成立した。これに対し【護憲三派】が【第二次護憲運動】を起こし→総選挙に大勝して【加藤高明】内閣が成立、以後、衆議院の多数党総裁が組閣する【憲政の常道】が約8年続いた。加藤内閣は1925年に【日ソ基本条約】・【治安維持法】・【普通選挙法】を成立させた。二大政党のうち【立憲政友会】は三井と結び積極外交・積極財政、【立憲民政党】は三菱と結び協調外交・緊縮財政が特色だった。しかし【田中義一】内閣は張作霖爆殺事件の処理で天皇の不信を買って総辞職し→【浜口雄幸】内閣は【統帥権干犯問題】で首相が狙撃され→第二次若槻内閣は満洲事変への不拡大方針を陸軍に無視されて総辞職し→【犬養毅】内閣は1932年の【五・一五事件】で首相が暗殺された。不況の連続で限界を感じた軍部や世論が政党内閣を終わらせた。","keywords":["清浦奎吾","第二次護憲運動","護憲三派","憲政の常道","加藤高明","日ソ基本条約","治安維持法","普通選挙法","立憲政友会","立憲民政党","田中義一","浜口雄幸","統帥権干犯問題","犬養毅","五・一五事件"],"blanks":[{"q":"1924年、元老の推薦で枢密院議長の【　】が貴族院中心の超然内閣を組織した。","a":"清浦奎吾","h":"山県有朋直系の元官僚"},{"q":"清浦内閣に対し、護憲三派が倒閣運動を起こした出来事を【　】という。","a":"第二次護憲運動","h":"第一次護憲運動に比べ民衆運動は盛り上がらず"},{"q":"護憲三派のうち、加藤高明が総裁を務めた政党は【　】である。","a":"憲政会","h":"のち立憲民政党"},{"q":"衆議院の多数党総裁に組閣の大命が下り、政党内閣を組織する慣習を【　】という。","a":"憲政の常道","h":"二大政党制が約8年続いた"},{"q":"1925年、日本は北樺太からの撤兵と引き換えに油田開発権を得る【　】を結んだ。","a":"日ソ基本条約","h":"加藤高明内閣"},{"q":"1925年、国体の変革と私有財産制度の否認を目的とする結社を処罰する【　】が制定された。","a":"治安維持法","h":"共産主義者・無政府主義者を処罰"},{"q":"1925年の【　】により、満25歳以上の男子に選挙権が与えられ中選挙区制が採用された。","a":"普通選挙法","h":"有権者は全人口の20.8％"},{"q":"1926年、大正天皇の崩御により摂政宮裕仁親王が即位し【　】と改元された。","a":"昭和","h":"第一次若槻礼次郎内閣のとき"},{"q":"自由党系の急進的民権派が発展し、三井財閥と結んで積極外交・積極財政の傾向が強い政党は【　】である。","a":"立憲政友会","h":"総裁は原敬→高橋是清→田中義一→犬養毅"},{"q":"憲政会と政友本党が合流して成立し、三菱財閥と結んで協調外交・緊縮財政の傾向が強い政党は【　】である。","a":"立憲民政党","h":"総裁は浜口雄幸→若槻礼次郎"},{"q":"【　】内閣（立憲政友会）は張作霖爆殺事件の処理で昭和天皇の不信を買い総辞職した。","a":"田中義一","h":"陸軍・長州閥、外相も兼任"},{"q":"1932年の【　】で犬養毅首相が暗殺され、戦前の政党政治は終焉を迎えた。","a":"五・一五事件","h":"海軍青年将校らによる"}],"mc":[{"q":"清浦奎吾内閣が成立した背景として最も適当なものはどれか。","c":["護憲三派が総選挙に大勝したため","元老が政党と距離を置く人物を首相に選ぼうとしたため","普通選挙で政友本党が第一党になったため","関東大震災の復興を進めるため"],"a":1,"e":"元老の松方正義・西園寺公望は政党と距離を置く人物として、山県有朋直系の枢密院議長清浦を推した。"},{"q":"第二次護憲運動について正しいものはどれか。","c":["第一次護憲運動以上に民衆運動が盛り上がった","護憲三派は普選断行・行財政整理・貴族院改革を掲げた","犬養毅の立憲政友会が中心となった","運動の結果、清浦内閣は総選挙に勝利した"],"a":1,"e":"民衆運動は盛り上がらなかったが、護憲三派が総選挙に大勝し加藤高明内閣が成立した。犬養毅は革新倶楽部。"},{"q":"1925年に治安維持法が制定された目的として最も適当なものはどれか。","c":["国体の変革と私有財産制度の否認を目的とする結社を取り締まるため","軍部のクーデタを防ぐため","天皇機関説を否認するため","財閥と政党の結託を防ぐため"],"a":0,"e":"共産主義者・無政府主義者を処罰対象とし、日ソ国交樹立と普通選挙実施に備えた。"},{"q":"第一次若槻礼次郎内閣が総辞職した理由として最も適当なものはどれか。","c":["統帥権干犯問題で首相が狙撃されたため","張作霖爆殺事件の処理で天皇の不信を買ったため","幣原協調外交に不満をもつ枢密院が金融恐慌対策の緊急勅令案を否決したため","満洲事変をめぐり閣内不統一に陥ったため"],"a":2,"e":"台湾銀行救済緊急勅令案が枢密院で否決され総辞職。他の選択肢は浜口・田中・第二次若槻内閣の総辞職理由。"},{"q":"立憲民政党の特徴として正しいものはどれか。","c":["自由党系の急進的民権派が発展した","三井財閥と結び積極財政の傾向が強い","総裁は田中義一・犬養毅と続いた","立憲改進党系の漸進的民権派が発展し、協調外交・緊縮財政の傾向が強い"],"a":3,"e":"立憲民政党は憲政会と政友本党が合同し、三菱財閥と結んだ。他は立憲政友会の特徴。"},{"q":"浜口雄幸内閣が総辞職した経緯として正しいものはどれか。","c":["五・一五事件で首相が暗殺された","ロンドン海軍軍縮条約調印が統帥権干犯と攻撃され、首相が東京駅で狙撃された","金融恐慌の処理に失敗した","食い逃げ解散後の総選挙で敗北した"],"a":1,"e":"軍令部・枢密院・右翼・立憲政友会などが憲法第11条の統帥権干犯だと攻撃し、浜口は狙撃された。"},{"q":"戦前の政党政治が約8年で終わった背景として最も適当なものはどれか。","c":["普通選挙で無産政党が第一党になったため","不況の連続で限界を感じた軍部や国民世論が政党内閣を見限ったため","元老が超然内閣の復活を望んだため","枢密院が廃止されたため"],"a":1,"e":"恐慌が続く中で政党と財閥の結託が批判され、軍部が独走。五・一五事件で犬養首相が暗殺され政党内閣は終焉した。"}],"order":[{"title":"憲政の常道期の内閣","items":["加藤高明内閣","第一次若槻礼次郎内閣","田中義一内閣","浜口雄幸内閣","犬養毅内閣"],"e":"護憲三派の加藤→病死で若槻→金融恐慌で政友会の田中→張作霖事件で民政党の浜口→（第二次若槻を経て）政友会の犬養。"},{"title":"大正末期の政局","items":["清浦奎吾内閣成立","第二次護憲運動","護憲三派内閣成立","治安維持法・普通選挙法制定","昭和と改元"],"e":"1924年に清浦内閣→護憲運動→加藤内閣、1925年に三大法案、1926年に大正天皇崩御。"},{"title":"政党内閣の終焉","items":["統帥権干犯問題","浜口雄幸首相狙撃","満洲事変勃発","第二次若槻内閣の総辞職","五・一五事件"],"e":"1930年ロンドン条約調印→浜口狙撃→1931年満洲事変→閣内不統一で若槻総辞職→1932年犬養暗殺。"}]},{"title":"不況の慢性化","flow":[{"y":"1926","t":"無産政党の結成","s":"普通選挙に対応する合法的社会主義政党。労働農民党（左派）・日本労農党（中間派）・社会民衆党（右派）に分裂","why":"治安維持法と普通選挙法の制定に直面し、左派と右派に分かれたため"},{"y":"1927","t":"金融恐慌","s":"片岡直温蔵相の失言で取り付け騒ぎが起こり、東京渡辺銀行などが休業","why":"不況の慢性化で震災手形に限らず銀行経営が不良化していたため"},{"y":"1927","t":"台湾銀行の休業","s":"鈴木商店の破産で台湾銀行が休業。救済緊急勅令案を枢密院が否決し若槻内閣総辞職","why":"枢密院が憲政会の協調外交に不満をもっていたため"},{"y":"1927","t":"田中内閣の恐慌収拾","s":"高橋是清蔵相が3週間のモラトリアムを発令、片面紙幣を大量発行し台湾銀行を救済","why":""},{"y":"1927","t":"五大銀行への預金集中","s":"三井・三菱・住友・安田・第一に預金が集中し、財閥のコンツェルン支配が強化","why":"中小銀行の信用が失墜したため"},{"y":"1928","t":"初の普通選挙・三・一五事件","s":"無産政党から8名当選。田中内閣は共産党員を一斉検挙し、治安維持法改正で最高刑を死刑に","why":"非合法の共産党が公然と活動を始めたため"},{"y":"1929","t":"四・一六事件・世界恐慌","s":"共産党員を再び一斉検挙。10月にウォール街で株価大暴落","why":""},{"y":"1930","t":"金解禁","s":"浜口内閣の井上準之助蔵相が旧平価（100円＝49.85ドル）で金解禁を断行","why":"為替相場の安定と貿易振興、経済界の抜本的整理をはかるため"},{"y":"1930","t":"昭和恐慌","s":"世界恐慌と円高で輸出減少・金の大量流出。農村は農業恐慌に陥り欠食児童・身売りが続出","why":"旧平価解禁による円高と、アメリカ向け生糸輸出の不振"},{"y":"1931","t":"重要産業統制法","s":"指定産業での不況カルテル結成を助成し、統制経済の先駆けに","why":"金解禁の影響で輸出が大不振だったため"}],"story":"不況の慢性化で銀行経営が不良化していたため→1927年、【片岡直温】蔵相の失言を契機に【金融恐慌】が発生した。鈴木商店の破産で【台湾銀行】が休業し、救済の緊急勅令案が枢密院に否決されたため→若槻内閣は総辞職し、【田中義一】内閣（高橋是清蔵相）が3週間の【モラトリアム】で収拾した。結果、【五大銀行】に預金が集中し財閥支配が強化された。一方、普通選挙に対応して【無産政党】が結成され、共産党が公然と活動したため→田中内閣は【三・一五事件】で一斉検挙し、治安維持法の最高刑を死刑とした。【浜口雄幸】内閣は蔵相【井上準之助】のもと緊縮財政で国際競争力の強化を目指し→1930年に旧平価で【金解禁】を断行した。しかし直前に【世界恐慌】が発生していたため→輸出減少と金の大量流出で【昭和恐慌】となり、農村は農業恐慌に陥った。【重要産業統制法】は統制経済の先駆けとなった。","keywords":["金融恐慌","片岡直温","台湾銀行","鈴木商店","モラトリアム","五大銀行","無産政党","労働農民党","三・一五事件","特別高等警察","金解禁","井上準之助","世界恐慌","昭和恐慌","重要産業統制法"],"blanks":[{"q":"1927年、第一次若槻内閣の【　】蔵相の失言を契機に金融恐慌が発生した。","a":"片岡直温","h":"震災手形を大量に有する銀行名を明かした"},{"q":"総合商社鈴木商店の破産により【　】が休業に追い込まれた。","a":"台湾銀行","h":"救済緊急勅令案は枢密院が否決"},{"q":"金融恐慌の収拾のため、田中義一内閣の【　】蔵相が3週間のモラトリアムを発令した。","a":"高橋是清","h":"片面紙幣を大量に発行"},{"q":"金融恐慌の結果、三井・三菱・住友・安田・第一の【　】に預金が集中した。","a":"五大銀行","h":"中小銀行の信用は失墜"},{"q":"1926年から結成された、普通選挙に対応する合法的社会主義政党を【　】という。","a":"無産政党","h":"労働農民党・日本労農党・社会民衆党"},{"q":"1928年の【　】で田中内閣は共産党員を一斉検挙し、労働農民党などを解散させた。","a":"三・一五事件","h":"翌年には四・一六事件"},{"q":"1928年、緊急勅令により治安維持法が改正され、最高刑が【　】とされた。","a":"死刑","h":"無期懲役も追加"},{"q":"1928年、左翼運動の取り締まりを業務とする【　】〔特高〕が道府県にも設置された。","a":"特別高等警察","h":"スパイ活動や拷問も行った"},{"q":"浜口雄幸内閣は蔵相に前日本銀行総裁の【　】を起用し、緊縮財政を進めた。","a":"井上準之助","h":"のち血盟団事件で殺害される"},{"q":"1930年1月、浜口内閣は旧平価100円＝49.85ドルで【　】を実施した。","a":"金解禁","h":"金本位制への復帰を意味した"},{"q":"1929年10月、ニューヨークのウォール街の株価大暴落から【　】が始まった。","a":"世界恐慌","h":"「暗黒の木曜日」"},{"q":"1931年の【　】は指定産業での不況カルテルの結成を助成し、統制経済の先駆けとなった。","a":"重要産業統制法","h":"資本の集中・独占が進む"}],"mc":[{"q":"金融恐慌が起こった背景として最も適当なものはどれか。","c":["金解禁による正貨の大量流出","不況の慢性化で震災手形に限らず銀行経営が不良化していたこと","世界恐慌によるアメリカ向け生糸輸出の不振","五大銀行への預金集中"],"a":1,"e":"慢性不況で弱った銀行に片岡蔵相の失言が加わり、取り付け騒ぎが発生した。五大銀行への集中は結果。"},{"q":"第一次若槻内閣の台湾銀行救済緊急勅令案が否決された理由として最も適当なものはどれか。","c":["枢密院が憲政会の協調外交に不満をもっていたため","衆議院で立憲政友会が反対したため","昭和天皇が反対したため","軍令部が統帥権干犯を主張したため"],"a":0,"e":"枢密顧問官伊東巳代治らが幣原外交への不満から否決し、内閣は総辞職した。"},{"q":"金融恐慌の結果として適当でないものはどれか。","c":["五大銀行への預金集中","中小銀行の減少","財閥と政党の結託の強化","成金の出現"],"a":3,"e":"成金の出現は大戦景気の現象。金融恐慌後は財閥のコンツェルン支配が強まり、三井と政友会、三菱と民政党の結託が強化された。"},{"q":"社会主義運動が左派と右派に分裂した背景として最も適当なものはどれか。","c":["世界恐慌で農村が疲弊したため","五大銀行が労働運動を弾圧したため","関東大震災時の迫害と治安維持法・普通選挙法制定という状況に直面したため","田中内閣が三・一五事件を起こしたため"],"a":2,"e":"革命的な共産主義的潮流（左派）と改良的な社会民主主義的潮流（右派）に分かれ、労働農民党・日本労農党・社会民衆党が並立した。"},{"q":"浜口雄幸内閣が金解禁に踏み切った目的として最も適当なものはどれか。","c":["軍事費を増やして軍部の支持を得るため","為替相場の安定と貿易振興をはかり、経済界を抜本的に整理するため","農村の救済のため公共事業を行うため","円安によって輸出を増やすため"],"a":1,"e":"欧米列国の金本位制復帰にならい、緊縮財政・産業合理化とあわせて国際競争力の強化を目指した。"},{"q":"昭和恐慌が起こった原因として最も適当なものはどれか。","c":["震災手形の未決済と銀行の取り付け騒ぎ","ヨーロッパ諸国の復興による輸出不振","世界恐慌と旧平価による金解禁が重なったこと","金輸出再禁止による円安"],"a":2,"e":"1929年の世界恐慌の直後に円高となる旧平価で金解禁したため、輸出減少と金の大量流出を招いた。"},{"q":"昭和恐慌の農村への影響として適当でないものはどれか。","c":["生糸価格の下落で繭価が暴落した","米価の低迷で寄生地主も苦しんだ","関西の農村が特に大打撃を受けた","欠食児童や子女の身売りが目立った"],"a":2,"e":"特に大打撃を受けたのは東北・関東・甲信越の農村。兼業機会が少なく失業者の帰村も重なった。"},{"q":"昭和恐慌後に財閥・政党を攻撃する声が強まった理由として最も適当なものはどれか。","c":["金解禁時の財閥の円売り・ドル買いや、財閥と無策な政党の結託があったため","財閥が無産政党を支援したため","政党が金輸出再禁止に反対したため","財閥が農村救済事業を独占したため"],"a":0,"e":"金輸出再禁止を予期した財閥の円売り・ドル買いが金流出に拍車をかけ、国民の反感を招いた。"}],"order":[{"title":"金融恐慌の経過","items":["片岡直温蔵相の失言","東京渡辺銀行の休業","台湾銀行の休業","枢密院の緊急勅令案否決","田中内閣のモラトリアム発令"],"e":"失言→取り付け騒ぎで中小銀行休業→鈴木商店破産で台湾銀行休業→枢密院否決で若槻内閣総辞職→田中内閣が収拾。"},{"title":"金解禁と昭和恐慌","items":["浜口雄幸内閣成立","世界恐慌発生","金解禁実施","昭和恐慌","重要産業統制法"],"e":"1929年7月浜口内閣成立→10月世界恐慌→1930年1月金解禁→昭和恐慌→1931年重要産業統制法。"},{"title":"田中義一内閣の社会主義弾圧","items":["初の普通選挙実施","三・一五事件","治安維持法改正","四・一六事件"],"e":"1928年2月普通選挙→3月三・一五事件→6月緊急勅令で治安維持法改正→1929年四・一六事件。"}]},{"title":"協調外交の展開と挫折","flow":[{"y":"1924","t":"幣原外交の開始・第一次国共合作","s":"加藤高明内閣の幣原喜重郎外相が対欧米協調・対中国内政不干渉の協調外交を推進","why":"ヴェルサイユ・ワシントン体制に歩調を合わせるため"},{"y":"1926","t":"北伐の開始","s":"蔣介石を中心とする国民革命軍が軍閥制圧による中国統一を目指す","why":""},{"y":"1927","t":"第一次山東出兵・東方会議","s":"田中義一内閣が日本人居留民保護を名目に出兵。東方会議で「対支政策綱領」を決定","why":"満蒙の権益を実力で守る強硬外交への転換"},{"y":"1928","t":"済南事件・張作霖爆殺事件","s":"第二次山東出兵で日中が衝突。関東軍参謀河本大作らが張作霖を爆殺","why":"関東軍は混乱に乗じて満洲占領を図ったが、張学良が国民政府に合流し挫折"},{"y":"1929","t":"田中内閣総辞職・幣原外交の復活","s":"張作霖爆殺事件の処理で昭和天皇に叱責され総辞職。浜口内閣で幣原外交が復活","why":""},{"y":"1930","t":"ロンドン海軍軍縮条約","s":"全権若槻礼次郎・財部彪。補助艦保有量を制限し、総トン数で対米英7割を確保","why":"統帥権干犯問題が起こり浜口首相が狙撃される"},{"y":"1931","t":"柳条湖事件・満洲事変勃発","s":"9月18日、関東軍が南満洲鉄道を爆破。第二次若槻内閣の不拡大方針を無視して軍事行動を拡大","why":"「満蒙の危機」を叫ぶ関東軍が満蒙の計画的制圧を図ったため"},{"y":"1932","t":"満洲国建国宣言・五・一五事件","s":"溥儀を執政とする傀儡政権が「五族協和」「王道楽土」を掲げて建国。承認を渋る犬養首相が暗殺","why":""},{"y":"1932","t":"日満議定書","s":"斎藤実内閣が満洲国を承認し関東軍の支配下に置く。リットン報告書は日本の軍事行動を否認","why":""},{"y":"1933","t":"国際連盟脱退通告・塘沽停戦協定","s":"臨時総会で42対1の対日勧告案が採決され全権松岡洋右が退場。停戦協定で満洲事変終息","why":"対日勧告案が満洲国承認撤回と撤兵を求めたため"}],"story":"中国では1926年に【蔣介石】が北伐を開始し、1928年の【張作霖爆殺事件】後に【張学良】が国民政府に合流して北伐が完了した。日本では【幣原喜重郎】外相が対中国内政不干渉の【協調外交】を進めていたが、【田中義一】内閣が成立すると→【山東出兵】や【東方会議】による強硬外交に転じた。張作霖爆殺事件の処理で田中内閣が倒れると→幣原外交が復活し、1930年に【ロンドン海軍軍縮条約】を締結したが、【統帥権干犯】と攻撃されて浜口首相が狙撃された。「満蒙の危機」を叫ぶ関東軍は1931年の【柳条湖事件】を機に【満洲事変】を起こし、若槻内閣の不拡大方針を無視したため→内閣は総辞職した。1932年、【溥儀】を執政とする【満洲国】が建国され、承認を渋る犬養首相は【五・一五事件】で暗殺された。斎藤内閣は【日満議定書】で満洲国を承認したが、国際連盟が【リットン報告書】をもとに対日勧告案を採決したため→1933年に日本は【国際連盟】脱退を通告した。","keywords":["蔣介石","北伐","張作霖爆殺事件","張学良","幣原外交","山東出兵","東方会議","ロンドン海軍軍縮条約","統帥権干犯問題","柳条湖事件","満洲事変","溥儀","リットン調査団","日満議定書","松岡洋右"],"blanks":[{"q":"1926年、右派の【　】を中心とする国民革命軍が北伐を開始した。","a":"蔣介石","h":"1927年に南京に国民政府を樹立"},{"q":"1928年、関東軍が張作霖を爆殺した事件を【　】〔満洲某重大事件〕という。","a":"張作霖爆殺事件","h":"関東軍参謀河本大作大佐らの独断"},{"q":"張作霖の子【　】は国民政府に合流し、満洲全土に青天白日旗が掲げられた。","a":"張学良","h":"関東軍の満洲占領計画は挫折"},{"q":"加藤高明・第一次若槻内閣の【　】外相が推進した協調外交を幣原外交という。","a":"幣原喜重郎","h":"対中国は内政不干渉・武力不行使"},{"q":"1927年、田中義一内閣は日本人居留民保護を名目に第一次【　】を行った。","a":"山東出兵","h":"1928年の第二次出兵で済南事件"},{"q":"1927年、田中内閣は【　】を開き「対支政策綱領」を決定した。","a":"東方会議","h":"外務政務次官森恪が中心"},{"q":"1930年、【　】で補助艦の保有量が制限され、日本は総トン数で対米英7割を確保した。","a":"ロンドン海軍軍縮条約","h":"日本全権は若槻礼次郎・財部彪"},{"q":"ロンドン海軍軍縮条約の調印を憲法第11条違反と攻撃した問題を【　】問題という。","a":"統帥権干犯","h":"軍令部総長加藤寛治が反対"},{"q":"1931年9月18日の【　】を受け、関東軍は満洲各地に軍事行動を拡大した。","a":"柳条湖事件","h":"奉天郊外で南満洲鉄道を爆破"},{"q":"1932年建国の満洲国は、清朝最後の皇帝だった【　】を執政とした。","a":"溥儀","h":"1934年に皇帝となり帝政開始"},{"q":"1932年、斎藤実内閣は【　】により満洲国を承認し、関東軍の支配下に置いた。","a":"日満議定書","h":"外相は内田康哉"},{"q":"1933年の国際連盟臨時総会で対日勧告案が採決され、日本全権【　】らは退場した。","a":"松岡洋右","h":"42対1で採決"}],"mc":[{"q":"中国で北伐後も国共内戦が続いた理由として最も適当なものはどれか。","c":["蔣介石が北伐完了後も共産党軍を攻めたため","張学良が国民政府への合流を拒んだため","日本が第一次国共合作を妨害したため","孫文が共産党員の国民党入党を認めなかったため"],"a":0,"e":"1927年の上海クーデタで蔣介石が共産党との絶縁を宣言し、国共合作が崩れた。"},{"q":"幣原外交と田中外交の違いについて正しいものはどれか。","c":["幣原外交は対欧米強硬、田中外交は対欧米協調","両者とも対中国は内政不干渉","対欧米はともに協調だが、対中国は幣原が内政不干渉、田中が強硬政策","幣原外交は立憲政友会、田中外交は憲政会の外交"],"a":2,"e":"田中外交は対欧米協調・対中国強硬の「二面外交」。幣原は憲政会・立憲民政党、田中は立憲政友会。"},{"q":"田中義一内閣が総辞職した理由として最も適当なものはどれか。","c":["統帥権干犯問題で右翼に攻撃されたため","張作霖爆殺事件の処理で昭和天皇に叱責されたため","済南事件の責任を問われたため","パリ不戦条約の批准に失敗したため"],"a":1,"e":"関東軍の独断による事件の処理をめぐり天皇の不信を買った。"},{"q":"関東軍が満洲事変を起こした背景として最も適当なものはどれか。","c":["中国が国際連盟に提訴したため","五・一五事件で犬養首相が暗殺されたため","「満蒙の危機」を叫び、石原莞爾の構想に基づき満蒙の計画的制圧を図ったため","リットン調査団が派遣されたため"],"a":2,"e":"石原莞爾『世界最終戦論』は日米最終戦争に備え「日本の生命線」満蒙の制圧が必要とした。提訴や調査団は事変の結果。"},{"q":"第二次若槻礼次郎内閣が総辞職した理由として最も適当なものはどれか。","c":["満洲国の承認を渋ったため","不拡大方針を関東軍に無視され、閣内不統一に陥ったため","国際連盟からの脱退に失敗したため","リットン報告書が日本の軍事行動を否認したため"],"a":1,"e":"世論・マスコミも軍を支持し、幣原協調外交は挫折した。承認を渋ったのは犬養首相。"},{"q":"1932年に日本が第一次上海事変を起こした目的として最も適当なものはどれか。","c":["満洲から列国の注意を逸らすため","国民政府の首都南京を占領するため","華北5省を国民政府から切り離すため","汪兆銘に新政権を樹立させるため"],"a":0,"e":"満洲国建国を進める間、列国の目を上海に向けさせようとした。"},{"q":"日本が国際連盟脱退を通告した直接の契機として最も適当なものはどれか。","c":["日満議定書の締結を連盟が批判したため","スチムソンが不承認宣言を発表したため","臨時総会で満洲国承認撤回と撤兵を求める対日勧告案が42対1で採決されたため","塘沽停戦協定が連盟に否定されたため"],"a":2,"e":"リットン報告書に基づく勧告案の採決を受け、全権松岡洋右らは退場。脱退は1935年発効。"},{"q":"満洲事変・華北分離工作の結果として正しいものはどれか。","c":["日本は国際連盟の常任理事国として地位を高めた","傀儡政権の樹立と国際連盟脱退・海軍軍縮条約の破棄により日本は国際社会から孤立した","中国との関係が改善し日中関税協定が結ばれた","関東軍は満洲から撤兵した"],"a":1,"e":"満洲国・冀東防共自治政府が誕生し日本の支配が確立する一方、ワシントン・ロンドン条約も失効して孤立した。"}],"order":[{"title":"中国の情勢","items":["中国国民党結成","第一次国共合作","北伐の開始","上海クーデタ","張作霖爆殺事件"],"e":"1919年国民党結成→1924年国共合作→1926年北伐開始→1927年上海クーデタで国共合作崩壊→1928年張作霖爆殺。"},{"title":"日本の対中外交","items":["幣原外交の開始","第一次山東出兵","東方会議","パリ不戦条約","ロンドン海軍軍縮条約"],"e":"1924年幣原外交→1927年山東出兵・東方会議（田中外交）→1928年不戦条約→1929年幣原外交復活→1930年ロンドン条約。"},{"title":"満洲事変の経過","items":["柳条湖事件","第一次上海事変","満洲国建国宣言","日満議定書","国際連盟脱退通告"],"e":"1931年9月柳条湖事件→1932年上海事変→満洲国建国→五・一五事件後の斎藤内閣が日満議定書→1933年連盟脱退通告。"}]},{"title":"日本の国際的孤立と日中戦争","flow":[{"y":"1932","t":"血盟団事件・五・一五事件","s":"井上日召ら右翼が前蔵相井上準之助・団琢磨を殺害。海軍青年将校らが犬養首相を殺害","why":""},{"y":"1932","t":"斎藤実内閣成立","s":"元老・重臣が推薦した海軍穏健派の「挙国一致内閣」。滝川事件、共産党指導者の転向","why":"相次ぐテロ後の軍部と政党の摩擦を緩和するため"},{"y":"1934","t":"岡田啓介内閣成立","s":"帝人事件で斎藤内閣が退陣し海軍穏健派の岡田が組閣。ワシントン海軍軍縮条約破棄を通告","why":""},{"y":"1935","t":"天皇機関説問題・国体明徴声明","s":"菊池武夫らが美濃部達吉の天皇機関説を非難。岡田内閣は2度の声明で天皇機関説を否認","why":"軍部・右翼が反国体的として政治問題化させたため"},{"y":"1936","t":"二・二六事件","s":"皇道派青年将校が約1400名の兵で首都中心部を4日間占拠。高橋是清蔵相・斎藤実内大臣らを殺害","why":"「昭和維新」を掲げ国家改造を図ったため。鎮圧後、統制派が主導権を握る"},{"y":"1936","t":"広田弘毅内閣・軍部大臣現役武官制復活","s":"「広義国防国家」の建設を掲げ、「国策の基準」を決定。日独防共協定を締結","why":"陸軍統制派の要求に従ったため"},{"y":"1936","t":"西安事件","s":"張学良が蔣介石を軟禁し、内戦停止・抗日民族統一戦線結成を約束させる","why":"前年の八・一宣言を受けたため"},{"y":"1937","t":"盧溝橋事件・日中戦争勃発","s":"支那駐屯軍が北京郊外で中国軍と衝突。第一次近衛文麿内閣は不拡大方針をとるが陸軍が無視","why":"華北分離工作の過程で衝突"},{"y":"1937","t":"日独伊三国防共協定・南京占領","s":"日本が枢軸国の一員に。第二次上海事変を機に戦火が拡大し、大本営を設置して南京を占領","why":"蔣介石が武漢・重慶へ退きつつ抗戦を続けたため全面戦争化"},{"y":"1938","t":"三次にわたる近衛声明","s":"「爾後国民政府を対手とせず」「東亜新秩序建設」「近衛三原則」。汪兆銘を重慶から脱出させる","why":"トラウトマン工作が挫折し、傀儡政権樹立方式に切り替えたため"}],"story":"昭和恐慌下で財閥と政党への不満が高まり→1932年に【血盟団事件】・【五・一五事件】とテロが相次いだ。元老は軍部と政党の摩擦を緩和するため→海軍穏健派の【斎藤実】・【岡田啓介】の「挙国一致内閣」を続けた。1935年、【美濃部達吉】の【天皇機関説】が攻撃され→岡田内閣は【国体明徴声明】で否認し、政党政治は理論的支柱を失った。陸軍では皇道派と統制派が対立し、【相沢事件】に続いて1936年に皇道派青年将校が【二・二六事件】を起こしたが鎮圧され→統制派が主導権を握り、陸軍は政治的発言力を強めた。【広田弘毅】内閣は【軍部大臣現役武官制】を復活させ、【日独防共協定】で枢軸に接近した。中国では【西安事件】で国共が接近していたところ→1937年の【盧溝橋事件】で【日中戦争】が始まった。第一次【近衛文麿】内閣の不拡大方針を陸軍が無視し、蔣介石が重慶へ退いて抗戦を続けたため→「爾後国民政府を対手とせず」の【近衛声明】で和平の道を閉ざし、戦争は泥沼化した。","keywords":["血盟団事件","斎藤実","挙国一致内閣","滝川事件","天皇機関説","美濃部達吉","国体明徴声明","相沢事件","二・二六事件","広田弘毅","軍部大臣現役武官制","西安事件","盧溝橋事件","近衛声明","汪兆銘"],"blanks":[{"q":"1932年の【　】で井上日召ら右翼が前蔵相井上準之助・団琢磨を殺害した。","a":"血盟団事件","h":"一人一殺主義"},{"q":"五・一五事件後、元老・重臣の推薦で海軍穏健派の【　】が「挙国一致内閣」を組織した。","a":"斎藤実","h":"日満議定書・国際連盟脱退"},{"q":"1933年の【　】〔京大事件〕で京大教授滝川幸辰が鳩山一郎文相により休職処分となった。","a":"滝川事件","h":"自由主義的刑法学説が問題に"},{"q":"1934年、【　】により斎藤実内閣が退陣し、岡田啓介内閣が成立した。","a":"帝人事件","h":"帝国人造絹糸会社の株式売買をめぐる疑獄"},{"q":"1935年、貴族院議員菊池武夫らが【　】の天皇機関説を反国体的と非難した。","a":"美濃部達吉","h":"美濃部は貴族院議員を辞職"},{"q":"岡田内閣は2度にわたる【　】で天皇機関説を反国体学説として否認した。","a":"国体明徴声明","h":"政党政治は理論的支柱を失った"},{"q":"1936年の【　】で皇道派青年将校が高橋是清蔵相・斎藤実内大臣らを殺害し首都中心部を占拠した。","a":"二・二六事件","h":"東京市に戒厳令、北一輝らが死刑"},{"q":"1936年、【　】内閣は軍部大臣現役武官制を復活させ「国策の基準」を決定した。","a":"広田弘毅","h":"「広義国防国家」の建設"},{"q":"1936年、張学良が蔣介石を軟禁し内戦停止・抗日民族統一戦線結成を約束させた事件を【　】という。","a":"西安事件","h":"翌年の第二次国共合作へ"},{"q":"1937年7月7日、支那駐屯軍が北京郊外の【　】で中国軍と衝突し、日 40年、新体制運動の結果全政党が解散して【　】が結成された。","a":"大政翼賛会","h":"総裁は首相、隣組などを下部組織とする"},{"q":"1940年、第二次近衛内閣は北部仏印進駐とともに【　】を締結した。","a":"日独伊三国同盟","h":"アメリカは屑鉄・鉄鋼の輸出を禁止"},{"q":"1941年4月、松岡洋右外相の独走により【　】が締結された。","a":"日ソ中立条約","h":"6月に独ソ戦開始で混乱"},{"q":"1941年の【　】に対し、アメリカは在米日本資産凍結と対日石油禁輸を行った。","a":"南部仏印進駐","h":"第三次近衛内閣のとき"},{"q":"1941年11月26日、アメリカは【　】で満洲事変以前の状態への復帰を要求した。","a":"ハル＝ノート","h":"国務長官ハル"},{"q":"1941年12月8日、【　】内閣のもと陸軍がマレー半島上陸、海軍が真珠湾攻撃を行い太平洋戦争が始まった。","a":"東条英機","h":"内大臣木戸幸一が推挙"},{"q":"1942年6月の【　】海戦で日本は空母4隻を失い、日米の攻守が交代した。","a":"ミッドウェー","h":"戦局悪化の契機"},{"q":"1944年7月の【　】島陥落で絶対国防圏の一角が崩壊し、東条内閣は総辞職した。","a":"サイパン","h":"マリアナ諸島陥落"},{"q":"1945年2月の【　】会談で米英ソはソ連の対日参戦などを決めた。","a":"ヤルタ","h":"1943年11月のカイロ会談は米英中"}],"mc":[{"q":"戦時体制確立の決定打となった二大要素として最も適当なものはどれか。","c":["治安維持法と普通選挙法","国家総動員法と大政翼賛会","国民精神総動員運動と国民学校令","重要産業統制法と企画院"],"a":1,"e":"1938年の国家総動員法で経済統制が、1940年の大政翼賛会で政治体制が一元化された。"},{"q":"平沼騏一郎内閣が総辞職した理由として最も適当なものはどれか。","c":["日米通商航海条約破棄を通告されたため","ノモンハン事件で敗北したため","独ソ不可侵条約の締結に対応できなかったため","パリ陥落で南進論が浮上したため"],"a":2,"e":"北進論を再検討中に独ソ不可侵条約が結ばれ「欧州の天地は複雑怪奇」と総辞職した。"},{"q":"日本が欧州大戦不介入方針から南進論へ転換した契機として最も適当なものはどれか。","c":["ノモンハン事件で日ソが激突したため","パリ陥落でフランスがドイツに降伏したため","アメリカが石油禁輸を行ったため","イギリスが日英通商航海条約破棄を通告したため"],"a":1,"e":"1940年のパリ陥落で南進論が急浮上し、「バスに乗り遅れるな」と新体制運動も始まった。"},{"q":"アメリカが在米日本資産凍結と対日石油禁輸を行った直接の契機として最も適当なものはどれか。","c":["日独伊三国同盟の締結","北部仏印進駐","南部仏印進駐","真珠湾攻撃"],"a":2,"e":"1941年7月の南部仏印進駐に対する措置。北部仏印進駐・三国同盟の際は屑鉄・鉄鋼などの輸出禁止。"},{"q":"東条英機内閣が成立した経緯として正しいものはどれか。","c":["9月6日の御前会議決定の白紙還元を条件に、内大臣木戸幸一が推挙した","総選挙で東条の政党が勝利した","五・一五事件後に元老が推薦した","松岡洋右外相が推挙した"],"a":0,"e":"「帝国国策遂行要領」の白紙還元を条件としたが、ハル＝ノートを受けて開戦に至った。"},{"q":"日本の戦局が悪化する契機となった出来事として最も適当なものはどれか。","c":["ガダルカナル島撤退","レイテ島海戦の敗北","ミッドウェー海戦の敗北","サイパン島陥落"],"a":2,"e":"1942年6月のミッドウェー海戦で空母4隻を失い攻守が交代。以後、撤退・玉砕が続いた。"},{"q":"東条英機内閣が総辞職した理由として最も適当なものはどれか。","c":["東京大空襲の責任を負ったため","サイパン島陥落で絶対国防圏の一角が崩壊したため","沖縄戦に敗れたため","ヤルタ会談でソ連の参戦が決まったため"],"a":1,"e":"1944年7月、マリアナ諸島陥落の責任を負い総辞職。小磯国昭内閣が成立した。"},{"q":"日本の敗因として本文で挙げられているものはどれか。","c":["連合国の国土や植民地が枢軸国より狭かったこと","陸軍と海軍の連帯感のなさ","大政翼賛会が政党として機能したこと","日ソ中立条約が最後まで守られたこと"],"a":1,"e":"陸海軍の連帯感のなさに加え、連合国は枢軸国に比べ国土か植民地が広い国が多かった。"}],"order":[{"title":"戦時体制の確立","items":["企画院の設置","国家総動員法","国民徴用令","大政翼賛会の結成","国民学校令"],"e":"1937年企画院→1938年国家総動員法→1939年国民徴用令（平沼内閣）→1940年大政翼賛会→1941年国民学校令。"},{"title":"太平洋戦争開戦への道","items":["独ソ不可侵条約","北部仏印進駐・日独伊三国同盟","日ソ中立条約","南部仏印進駐","ハル＝ノート"],"e":"1939年独ソ不可侵条約→1940年北部仏印進駐・三国同盟→1941年4月日ソ中立条約→7月南部仏印進駐→11月ハル＝ノート。"},{"title":"太平洋戦争の戦局","items":["真珠湾攻撃","ミッドウェー海戦","ガダルカナル島撤退","サイパン島陥落","沖縄戦"],"e":"1941年12月開戦→1942年6月ミッドウェー→1943年2月ガダルカナル撤退→1944年7月サイパン陥落→1945年4〜6月沖縄戦。"}]}],"review":[{"q":"大戦景気から昭和恐慌に至る流れとして正しいものはどれか。","c":["大戦景気→震災恐慌→戦後恐慌→金融恐慌→昭和恐慌","大戦景気→戦後恐慌→震災恐慌→金融恐慌→昭和恐慌","大戦景気→金融恐慌→戦後恐慌→震災恐慌→昭和恐慌","大戦景気→戦後恐慌→金融恐慌→震災恐慌→昭和恐慌"],"a":1,"e":"1920年戦後恐慌→1923年震災恐慌→1927年金融恐慌→1930年昭和恐慌と、恐慌が連続した。"},{"q":"金融恐慌が政党内閣の交代につながった経緯として最も適当なものはどれか。","c":["田中義一内閣の強硬外交が枢密院に否決されたため","浜口内閣の金解禁が失敗したため","第一次若槻内閣の台湾銀行救済緊急勅令案が、協調外交への不満から枢密院に否決されたため","五・一五事件で若槻首相が暗殺されたため"],"a":2,"e":"憲政会の幣原外交に不満をもつ枢密院の否決で若槻内閣は総辞職し、立憲政友会の田中義一内閣が成立した。"},{"q":"浜口雄幸内閣の政策とその結果の組み合わせとして正しいものはどれか。","c":["金輸出再禁止→円安で輸出が激増した","旧平価による金解禁→世界恐慌と重なり昭和恐慌を招いた","積極財政→大戦景気を再現した","強硬外交→張作霖爆殺事件を招いた"],"a":1,"e":"金輸出再禁止は犬養内閣、積極財政・強硬外交は田中内閣の政策。"},{"q":"戦前の政党政治が終焉した過程として正しいものはどれか。","c":["統帥権干犯問題→満洲事変での閣内不統一→五・一五事件","五・一五事件→統帥権干犯問題→満洲事変","満洲事変→統帥権干犯問題→五・一五事件","二・二六事件→五・一五事件→満洲事変"],"a":0,"e":"1930年ロンドン条約をめぐる統帥権干犯問題→1931年満洲事変で第二次若槻内閣総辞職→1932年五・一五事件で犬養首相暗殺。"},{"q":"満洲事変から日中戦争に至る日本の国際的孤立の過程として最も適当なものはどれか。","c":["国際連盟脱退→柳条湖事件→日独防共協定→盧溝橋事件","柳条湖事件→国際連盟脱退→日独防共協定→盧溝橋事件","盧溝橋事件→柳条湖事件→国際連盟脱退→日独防共協定","柳条湖事件→日独防共協定→国際連盟脱退→盧溝橋事件"],"a":1,"e":"1931年柳条湖事件→1933年連盟脱退通告→1936年日独防共協定→1937年盧溝橋事件と、孤立を深めながら枢軸に接近した。"},{"q":"日本が太平洋戦争の開戦に至った背景として最も適当なものはどれか。","c":["独ソ不可侵条約により北進論が実行されたため","南進を進める日本に対し、アメリカが石油禁輸などの経済封鎖を強め、ハル＝ノートで満洲事変以前への復帰を要求したため","国際連盟が対日制裁を決議したため","日ソ中立条約をソ連が破棄したため"],"a":1,"e":"南部仏印進駐後のABCD包囲陣による経済封鎖と日米交渉の難航により、東条内閣は開戦を決断した。"}]},{"id":20,"title":"終戦後の日本","era":"昭和時代（占領期）","span":"1945〜1949","oneLine":"敗戦後の日本はGHQの間接統治で非軍事化・民主化されたが、冷戦で占領政策は経済復興へ転換した","chain":["鈴木貫太郎","東久邇宮稔彦","幣原喜重郎","第一次吉田茂","片山哲","芦田均","第二次吉田茂"],"parts":[{"title":"日本の民主化（敗戦・占領・五大改革のスタート）","flow":[{"y":"1945","t":"鈴木貫太郎内閣成立","s":"昭和天皇の信頼が厚い元侍従長が戦争終結を期待され組閣（東郷茂徳外相）","why":"戦争終結のため"},{"y":"1945","t":"広島・長崎に原爆投下、ソ連参戦","s":"8月6日広島、8月8日ソ連参戦（翌9日満洲・朝鮮・樺太へ侵攻）、8月9日長崎。シベリア抑留・中国残留孤児問題が発生","why":"米ソの戦後世界の主導権争いもあった"},{"y":"1945","t":"ポツダム宣言受諾","s":"8月14日に受諾し無条件降伏。15日の玉音放送が現在の終戦記念日","why":""},{"y":"1945","t":"東久邇宮稔彦内閣・GHQ設置","s":"皇族が組閣。連合国軍総司令部（GHQ）が東京に設置され、最高司令官（SCAP）はマッカーサー元帥。9月2日ミズーリ号上で降伏文書調印","why":"敗戦直後の国民心理を考えて皇族が組閣"},{"y":"1945","t":"人権指令→東久邇宮内閣総辞職","s":"治安警察法・治安維持法・特高の廃止、政治犯釈放を指令。「国体護持」を唱える内閣は占領政策と対立し総辞職","why":"人権指令を機に占領政策と対立したため"},{"y":"1945","t":"幣原喜重郎内閣・五大改革指令","s":"マッカーサーが口頭で①婦人の解放②労働組合結成の奨励③教育の自由主義化④圧制的諸制度の撤廃⑤経済の民主化を指令","why":"日本の非軍事化・民主化のため"},{"y":"1946","t":"天皇の人間宣言・極東委員会・対日理事会","s":"1月1日に天皇が神格を否定。ワシントンに極東委員会（FEC）、東京に対日理事会（ACJ）を設置。GHQは日本政府に指令・勧告を出す間接統治方式","why":"アメリカ単独の間接統治により日本は分断を免れた"},{"y":"1946","t":"戦後初の総選挙・第一次吉田茂内閣","s":"4月の総選挙で39名の女性議員が誕生。第1党日本自由党は公職追放された鳩山一郎にかわり吉田茂が組閣","why":"鳩山一郎が公職追放となったため"},{"y":"1946","t":"公職追放令・極東国際軍事裁判開始","s":"約21万名が公職を追われる。東京裁判ではA級戦犯28名を起訴し、東条英機・広田弘毅ら7名が絞首刑（1948年）。パル判事は全員無罪を主張","why":"圧制的諸制度の撤廃と戦争責任の追及"},{"y":"1947","t":"教育基本法・学校教育法","s":"教育の機会均等・男女共学・義務教育9年制。六・三・三・四制の新学制が発足（第一次吉田茂内閣）","why":"教育の自由主義化"}],"story":"1945年、【鈴木貫太郎】内閣のもとで【ポツダム宣言】が通告され、【広島】・【長崎】への原爆投下と【ソ連参戦】を受けて8月14日に宣言を受諾し無条件降伏した。敗戦直後の国民心理を考えて皇族の【東久邇宮稔彦】が組閣したが、【GHQ】の人権指令に対し「国体護持」を唱えて対立したため総辞職→協調外交で知られる【幣原喜重郎】が組閣した。GHQは最高司令官【マッカーサー】のもとで日本政府に指令・勧告を出す【間接統治】方式をとり、ワシントンの【極東委員会】が基本方針を、東京の【対日理事会】が諮問を担った。アメリカ単独の間接統治だったため→日本はドイツのような分断を免れた。マッカーサーは幣原内閣に【五大改革指令】を出し、婦人参政権（20歳以上の男女）、教育の自由主義化（【教育基本法】・学校教育法）、圧制的諸制度の撤廃（【公職追放】・東京裁判）が進められた。1946年の戦後初の総選挙で日本自由党が第1党となり、鳩山一郎が公職追放されたため→第一次【吉田茂】内閣が成立した。","keywords":["鈴木貫太郎","ポツダム宣言","ソ連参戦","シベリア抑留","東久邇宮稔彦","GHQ","マッカーサー","人権指令","幣原喜重郎","五大改革指令","極東委員会","対日理事会","間接統治","公職追放","極東国際軍事裁判","教育基本法"],"blanks":[{"q":"1945年、昭和天皇の信頼が厚い元侍従長の【　】が戦争終結を期待されて組閣した。","a":"鈴木貫太郎","h":"海軍出身、東郷茂徳が外相"},{"q":"1945年8月8日、【　】が日本に宣戦し、翌9日に満洲・朝鮮・樺太へ侵攻した。","a":"ソ連","h":"日ソ中立条約を破棄"},{"q":"ソ連参戦により、在満日本人が抑留される【　】問題や中国残留孤児問題が発生した。","a":"シベリア抑留","h":"帰国は1956年まで続いた"},{"q":"敗戦直後の国民心理を考え、皇族の【　】が組閣し「一億総懺悔」「国体護持」を唱えた。","a":"東久邇宮稔彦","h":"人権指令を機に総辞職"},{"q":"1945年、東京に設置された連合国軍総司令部の略称は【　】である。","a":"GHQ","h":"最高司令官はマッカーサー"},{"q":"GHQが日本政府に指令・勧告を発して政治を行わせる占領方式を【　】方式という。","a":"間接統治","h":"南西諸島などは直接軍政"},{"q":"1946年、ワシントンに設置された対日占領政策決定の最高機関を【　】という。","a":"極東委員会","h":"略称FEC、11か国で構成"},{"q":"1946年、東京に設置されたGHQ・SCAPの諮問機関を【　】という。","a":"対日理事会","h":"略称ACJ、米英ソ中の4か国"},{"q":"1945年、マッカーサーが幣原喜重郎首相に口頭で示した改革指令を【　】という。","a":"五大改革指令","h":"婦人の解放・労働組合結成の奨励など5項目"},{"q":"1946年、政界・官界・財界などから約21万名が職を追われた措置を【　】という。","a":"公職追放","h":"戦争犯罪人・職業軍人・超国家主義者など"},{"q":"極東国際軍事裁判で唯一の文官として絞首刑となったのは【　】である。","a":"広田弘毅","h":"東条英機ら7名が絞首刑"},{"q":"1947年、教育の機会均等・男女共学・義務教育9年制を定めた法律は【　】である。","a":"教育基本法","h":"第一次吉田茂内閣、同年に学校教育法も"}],"mc":[{"q":"東久邇宮稔彦内閣が総辞職した直接の契機として正しいものはどれか。","c":["昭和電工事件で閣僚が逮捕されたため","GHQの人権指令に「国体護持」の立場から対立したため","戦後初の総選挙で敗北したため","二・一ゼネストの中止指令に反発したため"],"a":1,"e":"東久邇宮内閣は「一億総懺悔」「国体護持」を唱え、治安維持法廃止などを求める人権指令を機に占領政策と対立して総辞職した。"},{"q":"日本が占領期にドイツのような分断を免れた理由として最も適当なものはどれか。","c":["極東委員会の11か国が共同で直接軍政を行ったため","実質的にアメリカ単独の間接統治方式がとられたため","ソ連が対日理事会の議長国となったため","日本政府が降伏文書の調印を拒否したため"],"a":1,"e":"GHQはアメリカ軍のみで構成され、日本政府に指令・勧告を出す間接統治をとった。これが分断を防いだ。"},{"q":"極東委員会（FEC）についての説明として正しいものはどれか。","c":["東京に置かれたGHQの諮問機関で、米英ソ中の4か国からなる","ワシントンに置かれ、中間指令権をもつアメリカ政府に基本方針を伝えた","日本政府に直接指令・勧告を発した","議長国はイギリスであった"],"a":1,"e":"極東委員会はワシントンに設置された対日占領政策決定の最高機関。東京の諮問機関は対日理事会で、議長国はいずれもアメリカ。"},{"q":"第一次吉田茂内閣が成立した背景として正しいものはどれか。","c":["戦後初の総選挙で日本社会党が第1党となり、連立を組んだため","日本自由党総裁の鳩山一郎が公職追放されたため","幣原喜重郎が病気で辞任したため","GHQが吉田を直接首相に任命したため"],"a":1,"e":"第1党の日本自由党は、選挙後に公職追放となった鳩山一郎に代わり、日本進歩党の協力を得て第一次吉田茂内閣を成立させた。"},{"q":"1945年12月の衆議院議員選挙法改正の内容として正しいものはどれか。","c":["25歳以上の男子に選挙権を付与し、小選挙区制とした","20歳以上の男女に選挙権を付与し、大選挙区制とした","納税額による制限選挙を復活させた","18歳以上の男女に選挙権を付与した"],"a":1,"e":"五大改革の「婦人の解放」により、20歳以上の男女に選挙権が与えられ、翌1946年の総選挙で39名の女性議員が誕生した。"},{"q":"極東国際軍事裁判（東京裁判）の問題点として本文が挙げているものはどれか。","c":["昭和天皇が被告として出廷させられた点","A級戦犯容疑者28名全員が絞首刑となった点","原爆投下など連合国側の所業が不問とされ「勝者の裁き」の側面をもった点","インドのパル判事が全員有罪を主張した点"],"a":2,"e":"絞首刑は東条英機・広田弘毅ら7名。天皇の戦争責任は追及されず、パル判事は全員無罪を主張した。"},{"q":"教育の自由主義化に関する記述として誤っているものはどれか。","c":["修身・日本歴史・地理の授業が一時停止された","1946年にアメリカ教育使節団が来日し教育の民主化を勧告した","教育委員会は当初任命制で、のち公選制となった","学校教育法により六・三・三・四制の新学制が発足した"],"a":2,"e":"教育委員会は当初公選制で、1956年の新教育委員会法により首長による任命制となった。"},{"q":"五大改革指令にあてはまらないものはどれか。","c":["経済の民主化","戦犯容疑者の逮捕","労働組合結成の奨励","婦人参政権の付与"],"a":1,"e":"五大改革は婦人の解放・労働組合結成の奨励・教育の自由主義化・圧制的諸制度の撤廃・経済の民主化。"}],"order":[{"title":"1945年の終戦への流れ","items":["ソ連が日ソ中立条約不延長を通告","ポツダム宣言通告","広島に原爆投下","ソ連参戦","ポツダム宣言受諾"],"e":"4月不延長通告→7月ポツダム宣言→8月6日広島→8月8日ソ連参戦→8月14日受諾。"},{"title":"終戦直後の内閣","items":["鈴木貫太郎内閣","東久邇宮稔彦内閣","幣原喜重郎内閣","第一次吉田茂内閣"],"e":"鈴木内閣が降伏→皇族の東久邇宮内閣が降伏文書調印→人権指令で総辞職し幣原内閣→戦後初の総選挙を経て吉田内閣。"},{"title":"占領政策の展開","items":["降伏文書調印","人権指令","五大改革指令","天皇の人間宣言","戦後初の総選挙"],"e":"9月2日調印→10月人権指令→幣原内閣に五大改革指令→1946年1月1日人間宣言→4月総選挙。"}]},{"title":"経済の民主化と憲法改正","flow":[{"y":"1945","t":"財閥解体指令","s":"三井・三菱・住友・安田などの財閥に資産凍結・解体を指令","why":"財閥は軍国主義の温床・潜在的な戦争遂行力とみなされたため"},{"y":"1945","t":"労働組合法","s":"幣原喜重郎内閣。労働三権（団結権・団体交渉権・争議権）を保障","why":"労働組合結成の奨励"},{"y":"1946","t":"第二次農地改革","s":"第一次案がGHQに不徹底とされ、改正農地調整法・自作農創設特別措置法により国家が小作地を強制買収し小作人に売却。在村地主の保有は1町歩まで","why":"寄生地主制を解体し自作農を創設するため"},{"y":"1946","t":"日本国憲法の公布","s":"11月3日。GHQのマッカーサー草案を幣原内閣が和訳・修正した政府原案を帝国議会で審議・修正し、第一次吉田茂内閣で公布","why":"政府の憲法改正要綱が保守的でGHQに拒否されたため"},{"y":"1947","t":"二・一ゼネスト中止指令","s":"公務員中心のゼネストが前日にGHQの指令で中止","why":"GHQが日本の左翼化を望まなかったため"},{"y":"1947","t":"独占禁止法・労働基準法","s":"第一次吉田茂内閣。独禁法は公正取引委員会を執行機関とし現存","why":""},{"y":"1947","t":"日本国憲法施行・民主化立法","s":"5月3日施行。国民主権・平和主義・基本的人権の尊重が3原則。地方自治法（首長の公選制）、新民法（家制度廃止）、新刑法（不敬罪・姦通罪廃止）","why":""},{"y":"1947","t":"片山哲内閣成立・過度経済力集中排除法","s":"戦後2度目の総選挙で日本社会党が第1党となり、民主党・国民協同党と3党連立。巨大独占企業の分割を命じたが実際は11社のみ","why":"占領政策の転換により分割が縮小"},{"y":"1948","t":"政令201号・国家公務員法改正","s":"芦田均内閣で国家公務員の争議を禁止、第二次吉田茂内閣で法律化し人事院を設置","why":"労働運動を抑圧するため"},{"y":"1950","t":"総評の結成","s":"レッド・パージの中で産別会議から右派が分裂し総同盟と合同。日本社会党支持","why":"GHQの支援を受けた"}],"story":"経済の民主化では、軍国主義の温床とされた財閥と寄生地主制が標的となった。【財閥解体】は1945年の資産凍結指令→【持株会社整理委員会】→1947年【独占禁止法】・【過度経済力集中排除法】と進んだが、大銀行が解体されず占領政策の転換で分割は11社にとどまったため→不徹底に終わり、のちに六大企業集団が形成された。【農地改革】は第一次案がGHQに不徹底とされ→第二次改革で国家が小作地を強制買収し小作人に売却したため→1950年までに小作地の80％以上が解放され、自作農が大量に創出された。労働の民主化では【労働組合法】・労働関係調整法・労働基準法の労働三法が制定されたが、GHQは日本の左翼化を望まず→1947年の【二・一ゼネスト】を中止させ、政令201号・国家公務員法改正で公務員の争議権を奪った。憲法改正は、【幣原喜重郎】内閣の憲法改正要綱が保守的でGHQに拒否されたため→GHQがマッカーサー草案を提示し、政府が和訳・修正して帝国議会で審議、1946年11月3日に【日本国憲法】が公布された。【国民主権】・【平和主義】・基本的人権の尊重を3原則とし、【象徴】天皇制・【議院内閣制】・【地方自治法】による首長公選制など制度の民主化が進んだ。","keywords":["財閥解体","持株会社整理委員会","独占禁止法","過度経済力集中排除法","農地改革","自作農創設特別措置法","労働組合法","労働三法","二・一ゼネスト","総同盟","産別会議","総評","日本国憲法","マッカーサー草案","議院内閣制","地方自治法"],"blanks":[{"q":"1946年に発足し、財閥の株式の譲渡を受けて一般に売り出した機関は【　】である。","a":"持株会社整理委員会","h":"財閥解体の実行機関"},{"q":"1947年、第一次吉田茂内閣で制定され、公正取引委員会を執行機関とする法律は【　】である。","a":"独占禁止法","h":"緩和されながらも現存"},{"q":"1947年、片山哲内閣で制定され巨大独占企業の分割を命じた法律は【　】である。","a":"過度経済力集中排除法","h":"325社指定のうち分割は11社のみ"},{"q":"第二次農地改革では、改正農地調整法と【　】により国家が小作地を強制買収した。","a":"自作農創設特別措置法","h":"第一次吉田茂内閣"},{"q":"1945年、幣原喜重郎内閣で制定され労働三権を保障した法律は【　】である。","a":"労働組合法","h":"労働三法の最初"},{"q":"1946年に結成された左派・日本共産党系の労働組合の全国組織は【　】である。","a":"全日本産業別労働組合会議","h":"略称は産別会議"},{"q":"1947年、公務員を中心に計画されたがGHQの指令で前日に中止された計画を【　】という。","a":"二・一ゼネスト","h":"吉田内閣打倒をめざした"},{"q":"1948年、芦田均内閣が国家公務員の争議を禁止した命令は【　】である。","a":"政令201号","h":"のち国家公務員法改正で法律化"},{"q":"1945年、GHQから憲法改正を指示されたのは【　】内閣である。","a":"幣原喜重郎","h":"憲法問題調査委員会を設置"},{"q":"日本国憲法の3原則は、国民主権・【　】・基本的人権の尊重である。","a":"平和主義","h":"第9条で戦争放棄・戦力の不保持"},{"q":"日本国憲法では、内閣が国会に対し連帯して責任を負う【　】がとられた。","a":"議院内閣制","h":"内閣は行政権"},{"q":"1947年に制定され、都道府県知事・市区町村長の公選制などを定めた法律は【　】である。","a":"地方自治法","h":"リコール制も承認"}],"mc":[{"q":"財閥解体が不徹底に終わった理由として最も適当なものはどれか。","c":["財閥の中心である大銀行が解体されなかったため","持株会社整理委員会が設置されなかったため","独占禁止法が制定されなかったため","農地改革が優先されたため"],"a":0,"e":"大銀行は解体されず、分割を免れた財閥系銀行を中心に新たな企業集団が形成された。"},{"q":"過度経済力集中排除法の指定を受けた325社のうち実際に分割された企業が11社にとどまった背景はどれか。","c":["日本国憲法の施行により違憲とされたため","冷戦の激化に伴い占領政策が転換されたため","片山哲内閣が総辞職したため","極東委員会が反対したため"],"a":1,"e":"1948年以降、占領政策が「経済復興」重視に転換したため、分割は大幅に縮小された。"},{"q":"第二次農地改革が行われた直接の理由として正しいものはどれか。","c":["第一次農地改革案をGHQが不徹底として再改革を指令したため","地主の要望で改革を緩和する必 ッパ経済復興援助計画を発表。ソ連・東欧はコミンフォルムを結成","why":"社会主義陣営と資本主義陣営の冷戦の開始"},{"y":"1947","t":"復興金融金庫・片山哲内閣","s":"復金の過剰融資で「復金インフレ」。日本社会党首班の片山哲が3党連立の中道政治を開始","why":""},{"y":"1948","t":"片山内閣退陣→芦田均内閣","s":"炭鉱国家管理問題で党内左派に攻撃され退陣。民主党の芦田均が連立を維持して組閣するが昭和電工事件で退陣","why":"連立ゆえの調整に苦しみ実行力を欠いたため"},{"y":"1948","t":"ロイヤル陸軍長官の演説","s":"日本を「反共の防壁」にすると演説。占領政策を非軍事化・民主化から経済復興へ転換","why":"冷戦の激化、特に中国情勢の変化"},{"y":"1948","t":"大韓民国・朝鮮民主主義人民共和国の成立","s":"北緯38度線が国境。韓国は李承晩、北朝鮮は金日成","why":""},{"y":"1948","t":"経済安定九原則実行指令","s":"第二次吉田茂内閣。GHQが予算の均衡・徴税の強化・物価の統制など9項目を指令","why":"日本経済の早期の復興・安定・自立のため"},{"y":"1949","t":"中華人民共和国の成立","s":"共産党が勝利し毛沢東が国家主席、周恩来が首相。国民党の蔣介石は台湾へ","why":"国共内戦での共産党の勝利"}],"story":"終戦直後は軍需産業の崩壊と復員・引揚げで失業者が急増し、記録的凶作で食糧不足が深刻となったため→都市民衆は【闇市】や買出しでしのいだ。悪性インフレに対し幣原内閣は【金融緊急措置令】で新円切り換え・預金封鎖を行ったが、物資不足が根本にあるため効果は一時的だった。第一次吉田内閣は経済安定本部を設け【傾斜生産方式】を決定し、片山・芦田内閣が実行したが→復興金融金庫の過剰融資で復金インフレを招いた。1947年、日本社会党の【片山哲】が3党連立の中道政治を始めたが、炭鉱国家管理問題で党内左派に攻撃され退陣→民主党の【芦田均】が引き継いだが昭和電工事件で退陣した。一方、世界では社会主義陣営と資本主義陣営の【冷戦】が始まり、【トルーマン=ドクトリン】・【マーシャル=プラン】に対しソ連はコミンフォルム・COMECONで対抗、1948年に南北朝鮮、1949年に【中華人民共和国】と東西ドイツが成立した。冷戦の激化、特に中国情勢の変化のため→アメリカは日本を「反共の防壁」とする方針に転じ、【ロイヤル】陸軍長官の演説を経て、第二次吉田内閣に【経済安定九原則】の実行を指令した。こうして占領政策は「非軍事化・民主化」から「経済復興」へ転換された。","keywords":["闇市","金融緊急措置令","傾斜生産方式","復興金融金庫","片山哲","芦田均","昭和電工事件","冷戦","国際連合","トルーマン=ドクトリン","マーシャル=プラン","ロイヤル","李承晩","毛沢東","経済安定九原則"],"blanks":[{"q":"終戦直後、都市民衆は農村への買出しや【　】での闇買いで飢えをしのいだ。","a":"闇市","h":"米の遅配・欠配が続いた"},{"q":"1946年、幣原喜重郎内閣は【　】を発令し、新円切り換えと預金封鎖を実施した。","a":"金融緊急措置令","h":"インフレ抑制効果は一時的"},{"q":"第一次吉田茂内閣が決定し、石炭・鉄鋼などに集中投資した政策を【　】という。","a":"傾斜生産方式","h":"有沢広巳発案、石橋湛山蔵相が決定"},{"q":"1947年に設置され、過剰融資で「復金インフレ」を引き起こした機関は【　】である。","a":"復興金融金庫","h":"略称は復金"},{"q":"1947年、日本社会党首班で3党連立の中道政治を行ったのは【　】内閣である。","a":"片山哲","h":"炭鉱国家管理問題で退陣"},{"q":"1948年、民主党の【　】が組閣したが、昭和電工事件により退陣した。","a":"芦田均","h":"復興金融金庫の融資をめぐる贈収賄事件"},{"q":"1945年2月、米英ソが協定を結んだ会談は【　】会談である。","a":"ヤルタ","h":"ソ連の対日参戦を秘密協定で約束"},{"q":"1945年10月に成立し、本部をニューヨークに置く国際組織は【　】である。","a":"国際連合","h":"原加盟国51か国"},{"q":"1947年、共産主義「封じ込め」政策の必要を唱えたアメリカ大統領の宣言を【　】という。","a":"トルーマン=ドクトリン","h":"同年マーシャル=プランも発表"},{"q":"1948年に成立した大韓民国の初代大統領は【　】である。","a":"李承晩","h":"首都はソウル"},{"q":"1949年に成立した中華人民共和国の初代国家主席は【　】である。","a":"毛沢東","h":"初代首相は周恩来"},{"q":"1948年、GHQが第二次吉田茂内閣に実行を指令した経済政策を【　】という。","a":"経済安定九原則","h":"予算の均衡・徴税の強化など"}],"mc":[{"q":"終戦直後の経済混乱の主要因として本文が挙げているものはどれか。","c":["財閥解体による生産の停滞","軍需産業の崩壊と復員・引揚げによる失業者の急増","農地改革による農業生産の減少","朝鮮戦争による物価上昇"],"a":1,"e":"最重点産業だった軍需産業が崩壊し、復員・引揚げも重なって失業者は約1400万人に達した。"},{"q":"金融緊急措置令のインフレ抑制効果が一時的にとどまった理由はどれか。","c":["新円切り換えが実施されなかったため","根本的な物資不足が解消されなかったため","GHQが命令を撤回したため","傾斜生産方式と矛盾したため"],"a":1,"e":"新円切り換え・預金封鎖で通貨量は減らしたが、極度の物不足が続いたため効果は一時的だった。"},{"q":"片山哲内閣が総辞職した原因として正しいものはどれか。","c":["昭和電工事件で首相が関与を疑われたため","炭鉱国家管理問題で党内左派から攻撃されたため","二・一ゼネストを阻止できなかったため","経済安定九原則の実行を拒否したため"],"a":1,"e":"昭和電工事件で退陣したのは芦田均内閣。片山内閣は連立の調整に苦しみ、炭鉱国家管理問題で日本社会党両派が対立して退陣した。"},{"q":"アメリカが対日占領政策を「経済復興」重視へ転換した背景として最も適当なものはどれか。","c":["日本国憲法が施行されたため","冷戦の激化、特に中国情勢の変化があったため","極東委員会がアメリカに要請したため","日本の労働運動が沈静化したため"],"a":1,"e":"1948年、ロイヤル陸軍長官が日本を「反共の防壁」にすると演説し、五大改革路線から経済復興へ転換した。"},{"q":"1947年のマーシャル=プランについての説明として正しいものはどれか。","c":["アメリカ大統領が発表した共産主義封じ込め政策である","アメリカ国務長官が発表した全ヨーロッパの経済復興援助計画で、ソ連・東欧は受け入れを拒否した","ソ連・東欧の情報交換組織である","アメリカと西欧諸国の共同防衛組織である"],"a":1,"e":"封じ込め政策はトルーマン=ドクトリン、情報交換組織はコミンフォルム、共同防衛組織はNATO。"},{"q":"傾斜生産方式で集中投資された重要産業部門の組み合わせとして正しいものはどれか。","c":["綿紡績・製糸","石炭・鉄鋼","造船・石油化学","食品・繊維"],"a":1,"e":"石炭・鉄鋼・電力・化学肥料・海運などに集中投資され、資金は復興金融金庫が融資した。"},{"q":"1949年の出来事として誤っているものはどれか。","c":["NATO（北大西洋条約機構）の成立","中華人民共和国の成立","大韓民国・朝鮮民主主義人民共和国の成立","COMECON（経済相互援助会議）の成立"],"a":2,"e":"南北朝鮮の成立は1948年。1949年にはソ連の原爆実験成功、東西ドイツ成立もあった。"},{"q":"経済安定九原則にあてはまらないものはどれか。","c":["予算の均衡","徴税の強化","予算の拡大","輸出の振興"],"a":2,"e":"九原則は予算の均衡・徴税の強化・資金の貸出制限・賃金の安定・物価の統制・貿易為替管理の改善・輸出の振興・生産の増強・食糧集荷の改善。"}],"order":[{"title":"戦後経済政策の流れ","items":["金融緊急措置令","傾斜生産方式の決定","復興金融金庫の設置","経済安定九原則実行指令"],"e":"1946年幣原内閣の金融緊急措置令→1946年第一次吉田内閣で傾斜生産方式決定→1947年復金設置→1948年九原則。"},{"title":"占領期の内閣（1946〜48年）","items":["第一次吉田茂内閣","片山哲内閣","芦田均内閣","第二次吉田茂内閣"],"e":"1947年総選挙で社会党第1党→片山内閣→炭鉱国家管理問題で退陣し芦田内閣→昭和電工事件で退陣し第二次吉田内閣。"},{"title":"冷戦の展開","items":["国際連合の成立","トルーマン=ドクトリン","大韓民国の成立","NATOの成立","中華人民共和国の成立"],"e":"1945年国連→1947年封じ込め政策→1948年南北朝鮮→1949年NATO→同年10月中華人民共和国。"}]}],"review":[{"q":"東久邇宮稔彦内閣から幣原喜重郎内閣への交代の背景と、その後の幣原内閣の政策の組み合わせとして正しいものはどれか。","c":["昭和電工事件による退陣→傾斜生産方式の決定","人権指令をめぐる占領政策との対立→五大改革指令の受入れと選挙法改正","二・一ゼネストの失敗→労働基準法の制定","戦後初の総選挙での敗北→日本国憲法の公布"],"a":1,"e":"東久邇宮内閣は人権指令を機に総辞職し、幣原内閣は五大改革指令を受けて婦人参政権付与などを進めた。"},{"q":"財閥解体と労働の民主化がいずれも「中途半端」に終わった共通の背景として最も適当なものはどれか。","c":["日本政府が改革を拒否したため","冷戦の激化に伴いGHQが日本の左翼化を望まず、占領政策を経済復興へ転換したため","極東委員会が改革の中止を決定したため","日本国憲法が改革を禁止したため"],"a":1,"e":"集中排除法の分割は11社にとどまり、ゼネスト中止・政令201号で労働運動は抑圧された。いずれも占領政策の転換が背景。"},{"q":"1947年に片山哲内閣が成立した経緯として正しいものはどれか。","c":["戦後初の総選挙で日本社会党が第1党となり単独で組閣した","戦後2度目の衆議院総選挙で日本社会党が第1党となり、民主党・国民協同党と連立した","吉田茂が公職追放されたため日本自由党が片山を推した","GHQが直接片山を首相に指名した"],"a":1,"e":"1947年の総選挙では過半数政党がなく、社会党・民主党・国民協同党の3党連立となった。GHQは中道政治として評価した。"},{"q":"日本国憲法とそれに伴う制度改革の説明として誤っているものはどれか。","c":["国民主権・平和主義・基本的人権の尊重を3原則とする","地方自治法により都道府県知事・市区町村長が公選制となった","新民法では戸主権や家制度が廃止された","第一次農地改革は日本国憲法の規定に基づいて実施された"],"a":3,"e":"農地改革はGHQの農地改革指令（1945年）に基づくもので、憲法公布（1946年11月）より前に始まっている。"},{"q":"占領政策が「非軍事化・民主化」から「経済復興」へ転換した1948年前後の出来事の因果関係として正しいものはどれか。","c":["経済安定九原則の実行指令→冷戦の開始→ロイヤル演説","国際連合の成立→日本の分断→間接統治","冷戦の激化・中国情勢の変化→ロイヤルの「反共の防壁」演説→経済安定九原則実行指令","中華人民共和国の成立→五大改革指令→公職追放"],"a":2,"e":"冷戦激化を受けてアメリカは日本を反共の防壁と位置づけ、第二次吉田内閣に経済安定九原則の実行を指令した。"},{"q":"終戦直後から1949年までの内閣を時系列順に正しく並べたものはどれか。","c":["鈴木貫太郎→幣原喜重郎→東久邇宮稔彦→吉田茂→片山哲→芦田均","鈴木貫太郎→東久邇宮稔彦→幣原喜重郎→吉田茂→片山哲→芦田均","東久邇宮稔彦→鈴木貫太郎→幣原喜重郎→片山哲→吉田茂→芦田均","鈴木貫太郎→東久邇宮稔彦→幣原喜重郎→片山哲→吉田茂→芦田均"],"a":1,"e":"鈴木（降伏）→東久邇宮（皇族）→幣原（五大改革）→第一次吉田（憲法公布）→片山（連立）→芦田（昭和電工事件）→第二次吉田。"}]},{"id":21,"title":"国際社会への復帰と高度成長","era":"昭和時代（戦後）","span":"1949〜1972","oneLine":"冷戦下で単独講和により独立を回復し、55年体制のもとで高度経済成長を遂げた","chain":["吉田茂","鳩山一郎","石橋湛山","岸信介","池田勇人","佐藤栄作"],"parts":[{"title":"国際社会への復帰","flow":[{"y":"1949","t":"ドッジ＝ライン","s":"デトロイト銀行頭取ドッジが超均衡予算を設定し復興金融金庫の融資を停止、1ドル＝360円の単一為替レートを設定","why":"経済安定九原則を実行し、インフレを収束させるため"},{"y":"1949","t":"シャウプ勧告","s":"コロンビア大学教授シャウプの税制チームが直接税（所得税）中心主義などの税制改革を勧告","why":"経済安定九原則の実行のため"},{"y":"1950","t":"朝鮮戦争開始・特需景気","s":"南を国連軍、北をソ連・中国人民義勇軍が支援。繊維・金属を中心とする朝鮮特需で安定恐慌から脱出","why":"アメリカが日本を国連軍の中継地として利用したため"},{"y":"1950","t":"警察予備隊設置・レッド＝パージ","s":"第三次吉田内閣。共産主義者をマスコミ・官公庁・企業から追放、公職追放解除も決定（「逆コース」）","why":"朝鮮戦争で米軍出動後の日本の治安維持にあたるため"},{"y":"1951","t":"マッカーサー解任","s":"満洲爆撃を主張し、戦争拡大を恐れるトルーマン大統領と衝突して突如解任。後任はリッジウェイ","why":"朝鮮戦局の行き詰まり打開をはかったため"},{"y":"1951","t":"サンフランシスコ平和条約","s":"日本首席全権は吉田茂。48か国と調印し主権回復。奄美・小笠原・沖縄はアメリカの施政権下に。ソ連・ポーランド・チェコスロヴァキアは出席したが調印せず","why":"アメリカが日本をアジアにおける自由主義陣営の拠点とするため単独講和を急いだ"},{"y":"1951","t":"日米安全保障条約","s":"平和条約と同日に締結。占領軍は駐留軍となるが、アメリカの日本防衛義務欠如・内乱条項などの問題が残る","why":"占領解除後もアメリカ軍の日本駐留を続けるため"},{"y":"1952","t":"日米行政協定・平和条約発効","s":"日本は米軍に基地を無償提供し防衛分担金を負担。4月28日に平和条約発効。保安隊設置（第四次吉田内閣）","why":"日米安全保障条約に基づく細目を定めるため"},{"y":"1952","t":"皇居前広場事件→破壊活動防止法","s":"独立回復後初のメーデーでデモ隊と警官隊が大乱闘。これを契機に破防法が成立し公安調査庁を設置","why":"暴力主義的破壊活動を行う団体を取り締まるため"},{"y":"1954","t":"MSA協定→防衛庁・自衛隊設置","s":"第五次吉田内閣。第五福竜丸事件も発生。造船疑獄事件で批判が集中し、鳩山一郎らが日本民主党を結成","why":"MSA協定で経済援助を受けるかわりに防衛力増強を約束したため"}],"story":"1949年、【ドッジ＝ライン】と【シャウプ勧告】により経済安定九原則が実行され、超均衡予算と1ドル＝【360円】の単一為替レートが設定された→デフレ政策のため失業者が急増する【安定恐慌】が起こったが、1950年の【朝鮮戦争】による【特需景気】で脱出した。朝鮮戦争でアメリカは日本を国連軍の中継地として利用したため、【レッド＝パージ】・【警察予備隊】設置・公職追放解除という「逆コース」が進んだ。アメリカは日本を自由主義陣営の拠点とするため講和を急ぎ、国内では【単独講和】論と【全面講和】論が対立したが、1951年【サンフランシスコ平和条約】が調印され主権を回復、同日に【日米安全保障条約】を締結した。これが原因で【日本社会党】は左右に分裂した。1952年の【日米行政協定】で基地を無償提供し、皇居前広場事件を契機に【破壊活動防止法】が成立、警察予備隊は【保安隊】に改組された。1954年には【MSA協定】により【防衛庁・自衛隊】が設置される一方、【造船疑獄事件】で吉田内閣への批判が集中し、【鳩山一郎】を総裁とする【日本民主党】が結成された。","keywords":["ドッジ＝ライン","シャウプ勧告","安定恐慌","特需景気","レッド＝パージ","警察予備隊","単独講和論","サンフランシスコ平和条約","日米安全保障条約","日米行政協定","破壊活動防止法","保安隊","第五福竜丸事件","MSA協定","自衛隊"],"blanks":[{"q":"1949年、GHQはデトロイト銀行頭取の【　】を招請し、超均衡予算を設定させた。","a":"ドッジ","h":"当時の日本経済を「竹馬経済」と酷評"},{"q":"ドッジ＝ラインにより1ドル＝【　】円の単一為替レートが設定された。","a":"360","h":"のち固定相場制をスタート"},{"q":"1949年、コロンビア大学教授【　】を団長とする税制専門家チームが直接税中心の税制改革を勧告した。","a":"シャウプ","h":"累進課税制度の所得税が中心に"},{"q":"1950年、【　】の開始により特需景気が始まり、日本は安定恐慌から脱出した。","a":"朝鮮戦争","h":"繊維・金属中心の特需"},{"q":"1950年、第三次吉田茂内閣のもとで【　】が設置された。1952年に保安隊に改組される。","a":"警察予備隊","h":"米軍出動後の治安維持のため"},{"q":"講和をめぐり、自由主義陣営のみと講和する単独講和論と、社会主義陣営も含む【　】論が対立した。","a":"全面講和","h":"南原繁・大内兵衛や社会党・共産党が運動を展開"},{"q":"1951年、【　】が日本と48か国との間で調印され、日本は主権を回復した。","a":"サンフランシスコ平和条約","h":"日本首席全権は吉田茂"},{"q":"サンフランシスコ講和会議に出席したが調印しなかった国は、【　】・ポーランド・チェコスロヴァキアである。","a":"ソ連","h":"インド・ビルマ・ユーゴスラヴィアは出席を拒否"},{"q":"1951年、平和条約と同日に【　】が締結され、占領軍は駐留軍となった。","a":"日米安全保障条約","h":"アメリカの日本防衛義務が欠如していた"},{"q":"1952年、皇居前広場事件を契機に【　】が制定され、公安調査庁が設置された。","a":"破壊活動防止法","h":"破防法"},{"q":"1954年、【　】の締結に伴い、陸上・海上・航空の3自衛隊と防衛庁が設置された。","a":"MSA協定","h":"日米相互防衛援助協定など4協定"},{"q":"1954年、ビキニ環礁でのアメリカの水爆実験により日本の遠洋マグロ漁船が「死の灰」を浴びる【　】事件が起こった。","a":"第五福竜丸","h":"1955年の第一回原水爆禁止世界大会につながる"}],"mc":[{"q":"ドッジ＝ラインの結果として起こったことはどれか。","c":["特需景気が始まった","失業者が急増する安定恐慌が起こった","復興金融金庫の融資が拡大した","インフレが激化した"],"a":1,"e":"超均衡予算と復金融資停止のデフレ政策により失業者が急増した（ドッジ＝デフレ）。特需景気はその後の朝鮮戦争による。"},{"q":"日本が安定恐慌から脱出できた背景として正しいものはどれか。","c":["シャウプ勧告による減税","朝鮮戦争による特需景気","サンフランシスコ平和条約の発効","日米行政協定による防衛分担金"],"a":1,"e":"1950年の朝鮮戦争で繊維・金属を中心とする特需が発生し、安定恐慌から脱出した。"},{"q":"1950年に警察予備隊が設置された理由として最も適当なものはどれか。","c":["MSA協定で防衛力増強を約束したため","皇居前広場事件が起こったため","朝鮮戦争で米軍が出動した後の治安維持のため","サンフランシスコ平和条約で再軍備が義務づけられたため"],"a":2,"e":"朝鮮戦争で日本は国連軍の中継地となり、米軍出動後の治安維持のため警察予備隊が設置された。MSA協定は1954年。"},{"q":"1951年にマッカーサーが解任された理由はどれか。","c":["日本国憲法制定に反対したため","全面講和論を支持したため","満洲爆撃を主張しトルーマン大統領と衝突したため","レッド＝パージに反対したため"],"a":2,"e":"朝鮮戦局の打開のため満洲爆撃を主張し、戦争拡大を恐れるトルーマンと衝突して解任された。後任はリッジウェイ。"},{"q":"アメリカが日本との単独講和を急いだ背景として最も適当なものはどれか。","c":["朝鮮戦争で日本の戦略的価値を再認識し、自由主義陣営の拠点としたかったため","ソ連が日本との講和を強く求めたため","日本の再軍備が完了したため","中華人民共和国と友好関係を結ぶため"],"a":0,"e":"冷戦と朝鮮戦争のなかで、アメリカは日本を自由主義陣営に組み込むため単独講和を急いだ。"},{"q":"1951年に日本社会党が左右両派に分裂した原因はどれか。","c":["レッド＝パージへの対応をめぐる対立","サンフランシスコ平和条約・日米安全保障条約への賛否","警察予備隊設置への賛否","破壊活動防止法への賛否"],"a":1,"e":"左派は平和条約・安保条約の両方に反対、右派は安保条約にのみ反対し分裂した。"},{"q":"1952年に制定された破壊活動防止法の直接の契機となった事件はどれか。","c":["第五福竜丸事件","造船疑獄事件","内灘闘争","皇居前広場事件"],"a":3,"e":"独立回復後初のメーデーでデモ隊と警官隊が衝突した皇居前広場事件（血のメーデー事件）を契機に成立した。"},{"q":"1954年に鳩山一郎らが日本民主党を結成した背景として最も適当なものはどれか。","c":["造船疑獄事件で吉田内閣への批判が集中したため","第五福竜丸事件で原水爆禁止運動が高まったため","サンフランシスコ平和条約が発効したため","保守合同で自由民主党が成立したため"],"a":0,"e":"造船疑獄事件で法相犬養健が指揮権を発動し批判が集中、自由党反吉田派と改進党などが合同して日本民主党を結成した。保守合同は翌1955年。"}],"order":[{"title":"占領末期から独立回復までの流れ","items":["ドッジ＝ライン","朝鮮戦争の開始","サンフランシスコ平和条約の調印","日米行政協定の締結","自衛隊の設置"],"e":"1949年ドッジ＝ライン→1950年朝鮮戦争→1951年平和条約→1952年行政協定→1954年自衛隊の順。"},{"title":"日本の防衛組織の変遷","items":["警察予備隊の設置","保安隊の設置","MSA協定の締結","防衛庁・自衛隊の設置"],"e":"1950年警察予備隊→1952年保安庁設置で保安隊に改組→1954年MSA協定に伴い自衛隊へ。"},{"title":"吉田内閣の終末期","items":["バカヤロー解散","奄美群島の返還","造船疑獄事件","日本民主党の結成"],"e":"1953年バカヤロー解散→1953年奄美返還→1954年造船疑獄→同年日本民主党結成で吉田内閣は追い込まれた。"}]},{"title":"55年体制","flow":[{"y":"1955","t":"日本社会党の再統一","s":"委員長は鈴木茂三郎。左右両派が再統一し3分の1以上の議席を占める","why":"憲法改正阻止・革新陣営の結束を目指したため"},{"y":"1955","t":"保守合同→自由民主党成立","s":"自由党（緒方竹虎）と日本民主党（鳩山一郎）が合同。初代総裁は鳩山一郎。保守一党優位の55年体制が1993年まで続く","why":"社会党の再統一に対抗するため"},{"y":"1956","t":"日ソ共同宣言","s":"第三次鳩山内閣。鳩山首相がモスクワで調印しソ連と国交回復。平和条約締結後の歯舞群島・色丹島返還を約束","why":"「自主外交」を掲げ日ソ国交回復を目指したため"},{"y":"1956","t":"国際連合加盟","s":"ソ連の反対がなくなり日本が国連に加盟。鳩山内閣は総辞職し、石橋湛山内閣は病のため65日で退陣","why":"日ソ共同宣言でソ連との国交が回復したため"},{"y":"1960","t":"日米相互協力及び安全保障条約（新安保条約）","s":"岸信介首相がワシントンで調印。アメリカの日本防衛義務を明記、事前協議制、期限10年で自動延長。日米地位協定で防衛分担金を廃止","why":"旧安保条約の問題点（防衛義務欠如など）を改定するため"},{"y":"1960","t":"60年安保闘争","s":"岸内閣が批准を衆議院で強行採決→労働者・学生・市民の大規模デモが国会を包囲。全学連の国会乱入で樺美智子が死亡。新安保は参議院承認なしで自然成立し岸内閣は総辞職","why":"強行採決に対し「民主主義擁護・岸内閣打倒」の運動が起こったため"},{"y":"1960","t":"池田勇人内閣「国民所得倍増計画」","s":"「寛容と忍耐」「政経分離」を唱え、政治の季節から経済の季節へ。1961年農業基本法、1962年全総・LT貿易開始","why":"革新勢力との対立を避け経済成長に専念するため"},{"y":"1964","t":"東海道新幹線開通・東京オリンピック","s":"第三次池田内閣。アジア初の五輪。名神高速道路も全通","why":""},{"y":"1965","t":"日韓基本条約","s":"第一次佐藤内閣。朴正熙大統領との間で東京調印。韓国を「朝鮮にある唯一の合法的な政府」と確認。ベトナム戦争本格化","why":"佐藤内閣がアメリカのアジア政策に協力し韓国・台湾・南ベトナムとの連携を強化したため"},{"y":"1971","t":"沖縄返還協定調印→1972年返還","s":"1969年の佐藤・ニクソン会談で「核抜き・本土並み・72年返還」を約束。1971年調印、1972年5月15日発効。同年ニクソン＝ショック・ドル＝ショックも発生","why":"ベトナム戦争でB52の出撃基地となった沖縄で祖国復帰運動が高まったため"}],"story":"1955年、憲法改正阻止をめざして【日本社会党】が再統一すると→これに対抗して自由党と日本民主党が保守合同し【自由民主党】が成立、自民党が約3分の2、社会党が約3分の1を占める【55年体制】が始まった。第三次鳩山内閣は「自主外交」を掲げ、1956年【日ソ共同宣言】でソ連と国交を回復→ソ連の反対がなくなり日本は【国際連合】に加盟した。【岸信介】内閣 "生産面の技術革新に対し有害な副産物への対処が遅れ、住民運動が広がったため"},{"y":"1967","t":"革新自治体の誕生","s":"東京都知事に美濃部亮吉が当選。公害規制や社会福祉で成果","why":"公害への住民運動が広がったため"},{"y":"1971","t":"ニクソン＝ショック・ドル＝ショック","s":"ニクソンが北京訪問計画を発表（第一次）、金・ドル交換停止（第二次）。中華人民共和国が国連加盟","why":""},{"y":"1972","t":"ニクソン訪中・日中共同声明","s":"アメリカ大統領が中華人民共和国を訪問。日本も日中共同声明を締結","why":""},{"y":"1973","t":"変動為替相場制・第一次オイル＝ショック","s":"固定相場制と安価な石油という高度成長の要因が崩れる。ベトナム和平協定、東西ドイツの国連同時加盟","why":"第四次中東戦争が起こったため"}],"story":"高度成長の要因は、1ドル＝360円の円安の【固定為替相場制】、アラブ諸国からの安価な【石油】、良質で豊富な労働力、高い【貯蓄率】による設備投資、55年体制と【春闘】方式による政治・労使の安定であった。しかし企業の利潤との調和を優先したため→【公害】対策は遅れ、【四大公害訴訟】が起こり、1967年に【公害対策基本法】、1971年に【環境庁】が設置された。都市の【過密】と農村の【過疎】も進んだ。国際的には1956年フルシチョフの【スターリン批判】で「雪どけ」の機運が高まったが、米ソは核と宇宙開発で競争し、1962年【キューバ危機】で直接衝突の危機を迎えた→回避後は【デタント】の機運が高まり、1963年【PTBT】、1968年【NPT】が結ばれた。1965年【ベトナム戦争】が本格化する一方、1971年【ニクソン＝ショック】で米中接近と金・ドル交換停止が起こり、1973年に日本は変動相場制へ移行、【第一次オイル＝ショック】で高度成長の前提が崩れた。文化では戦中に矢内原事件・津田事件など思想弾圧が続いたが、戦後は【太宰治】ら戦後派文学、【黒澤明】の映画、1953年のテレビ放送開始など大衆文化が活気を取り戻した。","keywords":["固定為替相場制","春闘","四大公害訴訟","公害対策基本法","環境庁","革新自治体","過疎","スターリン批判","キューバ危機","部分的核実験停止条約","核拡散防止条約","ベトナム戦争","ニクソン＝ショック","津田事件","黒澤明"],"blanks":[{"q":"高度経済成長の要因の一つは、1ドル＝360円の円安状態で維持された【　】であった。","a":"固定為替相場制","h":"1973年から変動為替相場制へ"},{"q":"高い貯蓄率は銀行を通じて各企業に融資され、積極的な【　】が行われた。","a":"設備投資","h":"「投資が投資を呼ぶ」"},{"q":"四大公害訴訟のうち、熊本県・鹿児島県の八代海で有機水銀を原因に発生したのは【　】である。","a":"水俣病","h":"新潟県阿賀野川では第二水俣病"},{"q":"1967年、公害に対応するため【　】が制定され、1970年に「調和条項」が削除された。","a":"公害対策基本法","h":"1993年に環境基本法へ"},{"q":"1971年、公害行政を担う【　】が設置され、2001年に環境省に昇格した。","a":"環境庁","h":"省庁再編で昇格"},{"q":"1967年、東京都知事に革新系の【　】が当選し、各地に革新自治体が誕生した。","a":"美濃部亮吉","h":"戦前は第二次人民戦線事件で検挙"},{"q":"1956年、ソ連の【　】がスターリン批判を行い「平和共存」路線を打ち出した。","a":"フルシチョフ","h":"「雪どけ」の機運"},{"q":"1962年、ケネディ大統領とフルシチョフによる米ソ直接衝突の危機である【　】が起こった。","a":"キューバ危機","h":"回避後デタントの機運"},{"q":"1963年、米ソ英の間で【　】（PTBT）が締結された。","a":"部分的核実験停止条約","h":"1968年にはNPT"},{"q":"1965年、アメリカによる【　】と中ソの援助により、ベトナム戦争が本格化した。","a":"北爆","h":"ジョンソン大統領"},{"q":"1940年、早稲田大学教授【　】が記紀神話の文献批判を理由に不敬罪で告発され辞職した。","a":"津田左右吉","h":"津田事件"},{"q":"戦後派文学を代表する【　】は『斜陽』『人間失格』を著した。","a":"太宰治","h":"坂口 :"政府（吉田内閣）は単独講和を選び、1951年サンフランシスコ平和条約に調印した。"},{"q":"55年体制の成立から60年安保闘争までの流れとして正しいものはどれか。","c":["保守合同→社会党再統一→新安保条約→安保闘争","社会党再統一→保守合同→新安保条約強行採決→安保闘争","新安保条約→保守合同→社会党再統一→安保闘争","安保闘争→保守合同→社会党再統一→新安保条約"],"a":1,"e":"1955年社会党再統一に対抗して保守合同、1960年岸内閣の強行採決が安保闘争を招いた。"},{"q":"60年安保闘争の後、池田内閣が「所得倍増」を掲げた背景と、その後の経済の動きの組み合わせとして正しいものはどれか。","c":["憲法改正を争点化するため／なべ底不況に陥った","革新勢力との対立を避け経済に専念するため／貿易・為替・資本の自由化が進んだ","沖縄返還を実現するため／赤字国債の発行が止まった","日ソ国交回復のため／特需景気が始まった"],"a":1,"e":"政治の季節から経済の季節へ移行し、1963〜64年にGATT11条国・IMF8条国・OECD加盟と「第2の開国」が進んだ。"},{"q":"高度経済成長の要因が崩れた出来事の組み合わせとして正しいものはどれか。","c":["キューバ危機と朝鮮戦争休戦","ドル＝ショックと第一次オイル＝ショック","日韓基本条約と沖縄返還","スターリン批判とスプートニク＝ショック"],"a":1,"e":"1971年ドル＝ショックで固定相場が崩れ1973年に変動相場制へ、同年のオイル＝ショックで安価な石油の供給が不安定になった。"},{"q":"ベトナム戦争が日本に及ぼした影響として正しいものはどれか。","c":["なべ底不況を引き起こした","沖縄の祖国復帰運動が高まり、いざなぎ景気（ベトナム特需）が起こった","日ソ共同宣言の締結を早めた","レッド＝パージが行われた"],"a":1,"e":"沖縄はB52の出撃基地となり復帰運動が高まる一方、ベトナム特需によるいざなぎ景気が続いた。"},{"q":"1971〜72年の国際情勢と日本の対応として正しいものはどれか。","c":["ニクソン訪中を受け日本も日中共同声明を締結し、日華平和条約は無効となった","ドル＝ショックにより円は1ドル＝360円に切り下げられた","中華民国が国連に加盟し中華人民共和国が代表権を失った","沖縄返還協定は米軍基地の全面撤去を定めた"],"a":0,"e":"1972年ニクソン訪中と日中共同声明で日華平和条約は無効に。円は308円に切り上げ、国連代表権は中華人民共和国が獲得、沖縄の米軍基地はほとんど存続した。"}]},{"id":22,"title":"経済大国としての安定成長","era":"昭和時代（安定成長期）〜平成時代初期","span":"1972〜1996","oneLine":"石油危機で高度成長が終わり、円高とバブルを経て冷戦終結とバブル崩壊が55年体制を崩した","chain":["田中角栄","三木武夫","福田赳夫","大平正芳","鈴木善幸","中曽根康弘","竹下登","宇野宗佑","海部俊樹","宮沢喜一"],"parts":[{"title":"高度経済成長の終了と安定成長","flow":[{"y":"1972","t":"第一次田中角栄内閣・日中共同声明","s":"「日本列島改造論」を掲げ列島改造ブーム。田中首相と周恩来首相が北京で調印し日中国交正常化","why":"ニクソン訪中を受けて対中関係を転換するため"},{"y":"1973","t":"変動為替相場制へ移行","s":"スミソニアン体制が崩壊。1976年のキングストン合意で国際的に認知","why":"ドルショック後の固定相場が維持できなくなったため"},{"y":"1973","t":"第四次中東戦争・第一次オイルショック","s":"OAPECの石油戦略（輸出制限・価格4倍引上げ）で「狂乱物価」。高度経済成長が終了","why":"アラブ産油国が石油を武器にしたため"},{"y":"1974","t":"田中内閣総辞職→三木武夫内閣","s":"スタグフレーションの中、田中首相の金脈問題で退陣。三木は「クリーンな政治」を掲げた","why":"金脈問題で政治不信が高まったため"},{"y":"1974","t":"戦後初のマイナス成長","s":"翌年から2〜5％の低成長〔安定成長〕へ。企業は減量経営・OA化で対応","why":"ドルショックとオイルショックの打撃"},{"y":"1975","t":"第一回先進国首脳会議〔サミット〕","s":"フランスのランブ tle":"冷戦の終結と国内のバブル経済","flow":[{"y":"1979","t":"ソ連のアフガニスタン侵攻","s":"ブレジネフ政権が侵攻し、デタントから新冷戦へ","why":"1970年代の緊張緩和が崩れた"},{"y":"1982","t":"第一次中曽根康弘内閣","s":"「戦後政治の総決算」を唱え臨調路線で行財政改革。レーガン大統領と「ロン・ヤス」関係","why":"経済力を背景に政治大国化をめざし西側陣営への傾斜を強めた"},{"y":"1985","t":"ゴルバチョフ政権成立","s":"グラスノスチに基づくペレストロイカを実施","why":"財政難にあえぐソ連の立て直しのため"},{"y":"1985","t":"NTT・JT設立、男女雇用機会均等法、プラザ合意","s":"電電公社・専売公社を民営化。首相以下全閣僚が初の靖国神社公式参拝。G5がドル切下げを決定し日本は円高不況に","why":"「双子の赤字」に悩むアメリカを救済するため"},{"y":"1986","t":"チェルノブイリ原発事故","s":"ソ連ウクライナ共和国で発生","why":""},{"y":"1987","t":"ルーブル合意・バブル経済スタート・JR設立","s":"G7が為替安定を図り円高不況を脱出。超低金利でだぶついた資金が不動産・株式に流入。国鉄を分割民営化","why":"円高不況時の超低金利政策が主な要因"},{"y":"1988","t":"竹下登内閣・リクルート事件","s":"スーパー301条で日米摩擦激化。未公開株譲渡で「政治とカネ」問題。消費税法案可決","why":"「経済大国」化した日本にアメリカが対抗"},{"y":"1989","t":"平成改元・消費税3％・宇野内閣退陣","s":"昭和天皇崩御。日米構造協議開始。参院選で与野党逆転し宇野首相は69日で退陣","why":"リクルート事件・消費税・スキャンダルへの批判"},{"y":"1989","t":"ベルリンの壁崩壊・マルタ会談で冷戦終結","s":"東欧革命の中、ブッシュ大統領とゴルバチョフ書記長が会談。海部俊樹内閣のとき","why":"ソ連の指導力が低下したため"},{"y":"1991","t":"湾岸戦争・バブル経済の崩壊","s":"多国籍軍に130億ドルの戦費支援、戦後に掃海艇派遣。以後は平成不況","why":"経済援助しかしない日本は国際社会で非難された"}],"story":"1979年ソ連の【アフガニスタン侵攻】でデタントは崩れ【新冷戦】となった。1982年【中曽根康弘】が「戦後政治の総決算」を掲げ、【臨調】路線で【NTT】・【JT】・【JR】の民営化を進めた。1985年、「双子の赤字」に悩むアメリカのため【プラザ合意】でドル切下げ→日本は円高不況に。1987年【ルーブル合意】で脱出したが、超低金利でだぶついた資金が不動産・株式に流入→【バブル経済】が始まった。ソ連では1985年【ゴルバチョフ】が【ペレストロイカ】を実施→1987年INF全廃条約→1989年【ベルリンの壁】崩壊→【マルタ会談】で冷戦終結。国内では【竹下登】内閣が【消費税】を導入したが【リクルート事件】が問題化→1989年参院選で与野党逆転し宇野内閣は69日で退陣。アメリカは【スーパー301条】で対抗、1991年【湾岸戦争】では130億ドルの支援のみで批判を浴びた。同年バブルも崩壊した。","keywords":["新冷戦","アフガニスタン侵攻","戦後政治の総決算","臨調","プラザ合意","ルーブル合意","バブル経済","国鉄分割民営化","ゴルバチョフ","ペレストロイカ","マルタ会談","リクルート事件","消費税","スーパー301条","湾岸戦争"],"blanks":[{"q":"1979年、ソ連のブレジネフ政権が【　】に侵攻し、緊張緩和から新冷戦状態となった。","a":"アフガニスタン","h":"1988年に撤兵を表明"},{"q":"1982年に組閣した【　】は「戦後政治の総決算」を唱え、行財政改革に乗り出した。","a":"中曽根康弘","h":"「三角大福中」最後の組閣"},{"q":"中曽根首相と「ロン・ヤス」と呼び合う仲だったアメリカ大統領は【　】である。","a":"レーガン","h":"共和党"},{"q":"1985年、ソ連は【　】政権に移行し、ペレストロイカを実施した。","a":"ゴルバチョフ","h":"グラスノスチ〔情報公開〕に基づく改革"},{"q":"1985年、G5が「双子の赤字」に悩むアメリカのためドル切下げを決めた【　】により、日本は円高不況に突入した。","a":"プラザ合 晋三内閣","菅直人内閣"],"a":3,"e":"菅直人内閣（2010〜11年）の時に発生。野田内閣はその後を継いだ。"},{"q":"2012年に自民党が政権奪還できた理由として最も適当なものはどれか。","c":["民主党政権が政治的実行力に欠け国民の支持を失ったため","民主党が消費税増税に反対したため","自民党がアベノミクスの成果を示したため","民主党が社民党と合流したため"],"a":0,"e":"民主党内の路線対立や公約放棄が相次ぎ支持を失い、総選挙で自民党が圧勝した。アベノミクスは政権奪還後。"},{"q":"「アベノミクス」の「三本の矢」の組み合わせとして正しいものはどれか。","c":["強い経済・子育て支援・社会保障","金融緩和・財政出動・成長戦略","規制緩和・郵政民営化・小さな政府","脱官僚依存・政治主導・地域主権"],"a":1,"e":"2013年の三本の矢は金融緩和・財政出動・成長戦略。強い経済・子育て支援・社会保障は2015年の「新三本の矢」。"},{"q":"2015年の安全保障関連法の内容として正しいものはどれか。","c":["自衛隊のインド洋派遣を認めた","防衛庁を防衛省に格上げした","緊急存立事態における集団的自衛権の行使を容認した","特定秘密の漏洩を処罰することとした"],"a":2,"e":"新々日米ガイドラインを受けて集団的自衛権行使を容認。インド洋派遣はテロ対策特別措置法、特定秘密は2013年。"},{"q":"2021年に夏季オリンピック・パラリンピック東京大会を実施した内閣はどれか。","c":["菅義偉内閣","安倍晋三内閣","岸田文雄内閣","菅直人内閣"],"a":0,"e":"2020年に延期された大会を菅義偉内閣が2021年に実施。岸田内閣はその後に成立。"},{"q":"2014年にロシアがG8サミットから除名された理由として正しいものはどれか。","c":["核兵器禁止条約を批准しなかったため","アラブの春に軍事介入したため","EUから離脱したため","ウクライナに侵攻したため"],"a":3,"e":"2014年のウクライナ侵攻でG8から除名。2022年には本格的な侵攻を行った。"}],"order":[{"title":"民主党政権の内閣","items":["鳩山由紀夫内閣","菅直人内閣","野田佳彦内閣","第二次安倍晋三内閣"],"e":"鳩山（普天間問題で退陣）→菅（震災対応）→野田（消費税増税決定）→総選挙で自民党が政権奪還。"},{"title":"第二次安倍内閣以降の出来事","items":["アベノミクス開始","安全保障関連法","天皇の退位","新型コロナウイルス感染拡大","安倍元首相暗殺事件"],"e":"2013年→2015年→2019年→2020年→2022年の順。"},{"title":"2010年代以降の世界","items":["アラブの春","パリ協定採択","トランプ大統領就任","イギリスのEU離脱","ロシアのウクライナ本格侵攻"],"e":"2011年→2015年→2017年→2020年→2022年の順。"}]},{"title":"現代日本の課題","flow":[{"y":"1950","t":"文化財保護法の制定","s":"国や地方公共団体はこれにもとづき有形・無形・民俗文化財などの保存に努める","why":"伝統文化を保存・継承するため"},{"y":"1975","t":"年少人口の減少開始","s":"14歳以下の年少人口が1975年から減り始める","why":"晩婚化・非婚化など価値観の多様化、子育て支援不足、教育費負担が背景"},{"y":"2003","t":"少子化対策基本法施行","s":"少子高齢化に対する環境づくりの一環","why":"合計特殊出生率の低下（約1.3）に対応するため"},{"y":"2009","t":"育児・介護休業法改正","s":"子育てと仕事の両立支援を強化","why":"少子化対策と性的役割分担の見直しのため"},{"y":"2022","t":"出生数80万人割れ・老年人口29％超","s":"出生数が80万人を割り込み、老年人口比率は29％を超える超高齢社会に","why":"医療技術の進歩や栄養・健康管理の向上で平均寿命が延びたため"},{"y":"","t":"社会保障制度の4つの柱","s":"公的扶助・社会保険・社会福祉・公衆衛生。制度間・世代間・地域間の格差から国民の不公平感が増大","why":""},{"y":"","t":"国民負担率の上昇","s":"従来の「低負担・中福祉」から、国民負担率約5割の「中負担・中福祉」へ移行傾向","why":"老年人口を支える生産年齢人口が減り、「胴上げ」型から「騎馬戦」型、将来は「肩車」型になるため"},{"y":"","t":"伝統文化の継承問題","s":"少子高齢化と大都市への人口流出で継承者不足が起こり、存続が危ぶまれる地域が増加","why":""}],"story":"日本では【合計特殊出生率】の低下（約1.3）による【少子化】と、平均寿命の延びによる【高齢化】が同時に進む。少子化の背景には【晩婚化・非婚化】など価値観の多様化、子育て支援の不足、教育費の負担があり、高齢化の背景には医療技術の進歩や栄養状態の向上がある→【2022年】には出生数が80万人を割り、【老年人口】比率は29％を超えて【超高齢社会】となった→【生産年齢人口】（15〜64歳）が減るため、老年人口の支え方は「胴上げ」型から「【騎馬戦】」型へ移り、社会福祉政策を展開しにくくなる→【公的扶助】・【社会保険】・【社会福祉】・【公衆衛生】の4つの柱からなる【社会保障制度】は格差から不公平感を増し、【国民負担率】が約5割となって「【中負担・中福祉】」へ進む。同じ少子高齢化と人口流出は、【伝統文化】の継承者不足も生み、国は【1950年】の【文化財保護法】にもとづき保存に努めている。","keywords":["少子化","高齢化","合計特殊出生率","生産年齢人口","超高齢社会","少子化対策基本法","社会保障制度","公的扶助","社会保険","社会福祉","公衆衛生","国民負担率","伝統文化","五節句","文化財保護法"],"blanks":[{"q":"少子化の指標となる【　】は約1.3まで低下している。","a":"合計特殊出生率","h":"女性1人が生涯に産む子どもの数の目安"},{"q":"14歳以下の【　】人口は1975年から減り始めた。","a":"年少","h":"2022年の出生数は80万人割れ"},{"q":"15〜64歳の人口を【　】人口という。","a":"生産年齢","h":"65歳以上は老年人口"},{"q":"老年人口比率が21％を超えると【　】社会と呼ばれ、日本は2022年時点で29％を超えている。","a":"超高齢","h":"7％で高齢化社会、14％で高齢社会"},{"q":"2003年、少子高齢化に対する環境づくりとして【　】基本法が施行された。","a":"少子化対策","h":"2009年には育児・介護休業法改正"},{"q":"社会保障制度の4つの柱のうち、生活保護法にもとづき困窮者を援助するしくみを【　】という。","a":"公的扶助","h":"生活扶助・住宅扶助・教育扶助・医療扶助など"},{"q":"加入者が毎月保険料を支払い必要な時に給付を受けるしくみを【　】といい、医療・年金・雇用・労災・介護の5種類がある。","a":"社会保険","h":"制度間・世代間・地域間の格差が大きい"},{"q":"高齢者福祉・児童福祉・障がい者福祉など社会的立場が弱くなりがちな人を支援するしくみを【　】という。","a":"社会福祉","h":"「高負担・高福祉か低負担・低福祉か」と議論"},{"q":"従来の日本は「低負担・中福祉」だったが、【　】が約5割となり「中負担・中福祉」が進む傾向にある。","a":"国民負担率","h":"租税と社会保障の負担の割合"},{"q":"長い歴史の中で育まれ、人々に受け継がれてきた文化を【　】という。","a":"伝統文化","h":"衣食住・年中行事・伝統芸能など"},{"q":"人日・上巳・端午・七夕・重陽をあわせて【　】といい、江戸時代に固まった。","a":"五節句","h":"1月7日・3月3日・5月5日・7月7日・9月9日"},{"q":"国や地方公共団体は1950年制定の【　】法にもとづき文化財の保存に努めている。","a":"文化財保護","h":"有形・無形・民俗文化財や記念物など"}],"mc":[{"q":"少子化の背景として適当でないものはどれか。","c":["男性・女性の晩婚化・非婚化","子育て支援の不足","医療技術の進歩","高まる教育費に対する経済的事情"],"a":2,"e":"医療技術の進歩や栄養状態の向上は高齢化の背景。少子化は価値観の多様化・子育て支援不足・教育費負担が背景。"},{"q":"少子高齢化が社会福祉政策上の問題となる理由として最も適当なものはどれか。","c":["老年人口が減り福祉の需要がなくなるため","生産年齢人口が減り老年人口を支えにくくなるため","年少人口が増え教育費が増大するため","平均寿命が短くなるため"],"a":1,"e":"老年人口の支え方が「胴 基本法","s":"2000年施行。2015年には女性活躍推進法も制定","why":"ジェンダーの視点から男女平等社会を実現するため"},{"y":"2000","t":"循環型社会形成推進基本法・MDGs","s":"3Rを進める各種リサイクル関連法を制定。国連は8種類のミレニアム開発目標を採択（〜2015年）","why":"持続可能な循環型社会を目指すため"},{"y":"2015","t":"SDGs採択","s":"国連が17種類の持続可能な開発目標を採択（〜2030年）。5番目にジェンダー平等、10番目に不平等の解消","why":"MDGsの後継として"}],"story":"【公害】問題は基本的に国内問題で、騒音・振動・悪臭・大気汚染・土壌汚染・水質汚濁・地盤沈下の【典型七公害】により生活環境や健康が損なわれる→被害が広がると対策を求める世論が広がり、【四大公害病】の被害者が【公害訴訟】を起こした→【1967年】の【公害対策基本法】、【1971年】の【環境庁】設置へ→さらに地球温暖化・オゾン層破壊・酸性雨など国際問題である【地球環境問題】に対応するため、【1993年】に【環境基本法】、【2001年】に【環境省】へ発展した。国際社会では【1972年】の【国連人間環境会議】（ストックホルム）、【1992年】の【国連環境開発会議】（リオデジャネイロ）で「【持続可能な開発】」が指針となり、日本も【2000年】の【循環型社会形成推進基本法】で【3R】を進めた→国連は【MDGs】に続き【2015年】に【SDGs】を採択した。一方、【ジェンダー】（社会的・文化的性差）の面では、【平塚らいてう】の『青鞜』以来の運動が【1945年】の婦人参政権につながり、【1985年】の【男女雇用機会均等法】、【1999年】の【男女共同参画社会基本法】へ。グローバル化で定住外国人が増える中、【多文化共生】と【ダイバーシティ】が求められている。","keywords":["典型七公害","公害対策基本法","環境庁","環境基本法","環境省","国連人間環境会議","国連環境開発会議","持続可能な開発","3R","循環型社会形成推進基本法","SDGs","青鞜","男女雇用機会均等法","男女共同参画社会基本法","ジェンダー","多文化共生","ダイバーシティ"],"blanks":[{"q":"騒音・振動・悪臭・大気汚染・土壌汚染・水質汚濁・地盤沈下を【　】という。","a":"典型七公害","h":"公害問題は基本的に国内問題"},{"q":"1967年の公害対策基本法は1993年の【　】法に発展した。","a":"環境基本","h":"地球環境問題を含む総合的な法律"},{"q":"1971年に設置された環境庁は、2001年の中央省庁再編で【　】となった。","a":"環境省","h":"1府12省庁の一つ"},{"q":"二酸化炭素などの温室効果ガス排出による地球環境問題を【　】という。","a":"地球温暖化","h":"1997年に京都議定書、2015年にパリ協定"},{"q":"1972年、スウェーデンのストックホルムで【　】会議が開かれ、人間環境宣言を採択した。","a":"国連人間環境","h":"「かけがえのない地球」がスローガン"},{"q":"1992年、ブラジルのリオデジャネイロで【　】会議が開かれ、気候変動枠組条約・生物多様性条約を採択した。","a":"国連環境開発","h":"リオ宣言で「持続可能な開発」を指針に"},{"q":"2000年に【　】形成推進基本法が制定され、各種リサイクル関連法が整備された。","a":"循環型社会","h":"3R（リデュース・リユース・リサイクル）"},{"q":"2015年、国連は17種類の「持続可能な開発目標（【　】）」を採択した。","a":"SDGs","h":"2000年のMDGsの後継、2030年まで"},{"q":"1911年、雑誌『青鞜』を創刊し「元始、女性は実に太陽であった」と記したのは【　】である。","a":"平塚らいてう","h":"1920年に新婦人協会を設立"},{"q":"1985年、国連の女子差別撤廃条約を受けて【　】法が制定された（86年施行）。","a":"男女雇用機会均等","h":"第二次中曽根内閣の時"},{"q":"1999年、【　】基本法が制定され、2000年に施行された。","a":"男女共同参画社会","h":"小渕内閣の時"},{"q":"生物学的性差のセックスに対し、社会的・文化的性差を【　】という。","a":"ジェンダー","h":"日本のジェンダー・ギャップ指数は世界的に低い"}],"mc":[{"q":"公 function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function go(v,push=true){if(push)hist.push(view);view=v;render();window.scrollTo(0,0)}

  let h='';

  if(tm){h+=`<div class="menu"><b>今日のメニュー</b><div class="row" style="margin-top:4px"><div class="grow">第${tm.L.id}講 ${esc(tm.L.title)}<br><span class="sub">PART${tm.pi+1} ${esc(tm.L.parts[tm.pi].title)}</span></div><button class="btn p sm" onclick="go({tab:'part',l:${tm.L.id},p:${tm.pi},step:0})">始める</button></div></div>`;}
  else h+=`<div class="menu"><b>全PART達成！</b> 演習タブで通史整序・ランダム4択を回そう。</div>`;
  h+=`<div class="sub">読む→穴埋め→4択→整序 の順で1PARTずつ。4択80%以上＋整序全問正解で✓。</div>`;
  ERAS.forEach(([name,ids])=>{
    h+=`<div class="era">${name}</div>`;
    ids.forEach(id=>{const L=DATA[id-1];const [n,t]=lecProg(L);
      h+=`<div class="card tap" onclick="go({tab:'lec',l:${id}})"><div class="row"><div class="grow"><b>第${id}講 ${esc(L.title)}</b><div class="sub">${esc(L.era)}｜${esc(L.span)}</div></div><span class="badge ${n===t?'ok':''}">${n}/${t}</span></div><div class="prog"><i style="width:${100*n/t}%"></i></div></div>`;});
  });
  main.innerHTML=h;
}
function rLec(){
  const L=DATA[view.l-1]; ttl.textContent=`第${L.id}講`;
  let h=`<h2>${esc(L.title)}</h2><div class="sub">${esc(L.era)}｜${esc(L.span)}</div><div class="card"><b>一言でいうと</b><div>${esc(L.oneLine)}</div></div>`;
  if(L.chain.length)h+=`<div class="card"><b>主役の流れ</b><div class="chain">${L.chain.map((c,i)=>(i?'<b>→</b>':'')+`<span>${esc(c)}</span>`).join('')}</div></div>`;
  L.parts.forEach((p,i)=>{const d=S.done[partKey(L.id,i)]||{};
    h+=`<div class="card tap" onclick="go({tab:'part',l:${L.id},p:${i},step:0})"><div class="row"><div class="grow"><b>PART${i+1} ${esc(p.title)}</b><div class="sub">流れ${p.flow.length}｜穴埋め${p.blanks.length}｜4択${p.mc.length}｜整序${p.order.length}</div></div>${partDone(L.id,i)?'<span class="badge ok">✓ 達成</span>':(d.mc!=null?`<span class="badge">4択 ${d.mc}%</span>`:'')}</div></div>`;});
  h+=`<div class="card tap" onclick="startDrill({type:'mc',src:'review',l:${L.id}})"><b>講の総合問題（${L.review.length}問）</b><div class="sub">PARTをまたぐ因果・流れを確認</div></div>`;
  main.innerHTML=h;
}
/* ---------- part study flow ---------- */
const STEPS=['読む','穴埋め','4択','整序','判定'];
function rPart(){
  const L=DATA[view.l-1],P=L.parts[view.p],st=view.step||0; ttl.textContent=`第${L.id}講 PART${view.p+1}`;
  let h=`<div class="sub">${esc(L.title)}</div><h2 style="margin-top:2px">${esc(P.title)}</h2><div class="steps">${STEPS.map((s,i)=>`<div class="${i===st?'on':i<st?'done':''}">${s}</div>`).join('')}</div><div id="body"></div>`;
  main.innerHTML=h;
  const b=$('#body');
  if(st===0)renderRead(b,L,P);
  else if(st===1)renderBlanks(b,L,P);
  else if(st===2)runMC(b,P.mc.map((q,i)=>({...q,key:`mc:${L.id}:${view.p}:${i}`})),r=>{const k=partKey(L.id,view.p);S.done[k]=Object.assign(S.done[k]||{},{mc:r});save();go({tab:'part',l:L.id,p:view.p,step:3},false)});
  else if(st===3)runOrder(b,P.order.map((q,i)=>({...q,key:`or:${L.id}:${view.p}:${i}`})),ok=>{const k=partKey(L.id,view.p);S.done[k]=Object.assign(S.done[k]||{},{order:ok});save();go({tab:'part',l:L.id,p:view.p,step:4},false)});
  else renderJudge(b,L,P);
}
function renderRead(b,L,P){
  let h=`<h3>流れ（因果つき年表）</h3><div class="tl">`+P.flow.map(e=>`<div class="ev">${e.y?`<div class="y">${esc(e.y)}</div>`:''}<div class="t">${esc(e.t)}</div><div class="s">${esc(e.s)}</div>${e.why?`<div class="w">${esc(e.why)}</div>`:''}</div>`).join('')+`</div>`;
  h+=`<h3>ストーリーで読む</h3><div class="story">${esc(P.story).replace(/【(.+?)】/g,'<mark>$1</mark>')}</div>`;
  h+=`<h3>キーワード</h3><div class="kw">${P.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`;
  h+=`<div class="btns"><button class="btn p" onclick="go({tab:'part',l:${L.id},p:${view.p},step:1},false)">穴埋めへ →</button></div>`;
  b.innerHTML=h;
}
function renderBlanks(b,L,P){
  let h=`<div class="sub">下線をタップで答え表示。全部見たら次へ。</div>`;
  P.blanks.forEach((q,i)=>{h+=`<div class="card"><div class="q"><span class="n">${i+1}. </span>${esc(q.q).replace('【　】',`<span class="blank" onclick="this.classList.toggle('show')">${esc(q.a)}</span>`).replace('【 】',`<span class="blank" onclick="this.classList.toggle('show')">${esc(q.a)}</span>`)}</div>${q.h?`<div class="hint">ヒント：${esc(q.h)}</div>`:''}</div>`;});
  h+=`<div class="btns"><button class="btn" onclick="document.querySelectorAll('.blank').forEach(e=>e.classList.add('show'))">全部表示</button><button class="btn p" onclick="S.done['${partKey(L.id,view.p)}']=Object.assign(S.done['${partKey(L.id,view.p)}']||{},{blank:true});save();go({tab:'part',l:${L.id},p:${view.p},step:2},false)">4択へ →</button></div>`;
  b.innerHTML=h;
}
function renderJudge(b,L,P){
  const d=S.done[partKey(L.id,view.p)]||{};const ok=partDone(L.id,view.p);
  let h=`<div class="res ${ok?'ok':'ng'}">${ok?'✓ 達成！':'もう一息'}</div><div class="card">4択：${d.mc!=null?d.mc+'%':'—'}（80%以上で合格）<br>整序：${d.order?'全問正解':'未達成'}</div>`;
  const next=L.parts[view.p+1]?{l:L.id,p:view.p+1}:(DATA[L.id]?{l:L.id+1,p:0}:null);
  h+=`<div class="btns">${ok?'':`<button class="btn" onclick="go({tab:'part',l:${L.id},p:${view.p},step:0},false)">読み直す</button><button class="btn s" onclick="go({tab:'part',l:${L.id},p:${view.p},step:2},false)">4択をやり直す</button>`}${next?`<button class="btn p" onclick="go({tab:'part',l:${next.l},p:${next.p},step:0},false)">次のPARTへ →</button>`:''}<button class="btn" onclick="go({tab:'lec',l:${L.id}},false)">講の一覧へ</button></div>`;
  b.innerHTML=h;
}
/* ---------- MC engine ---------- */
function runMC(b,qs,onEnd){
  let i=0,correct=0;
  function show(){
    if(i>=qs.length){const r=Math.round(100*correct/qs.length);b.innerHTML=`<div class="res ${r>=80?'ok':'ng'}">${correct}/${qs.length}（${r}%）</div><div class="btns center"><button class="btn p" id="nx">次へ →</button></div>`;$('#nx').onclick=()=>onEnd(r);return;}
    const q=qs[i];const ord=shuffle([0,1,2,3]);
    b.innerHTML=`<div class="q"><span class="n">${i+1}/${qs.length}${q.tag?' ・'+esc(q.tag):''}</span><br>${esc(q.q)}</div><div class="choices">${ord.map(k=>`<button data-k="${k}">${esc(q.c[k])}</button>`).join('')}</div><div id="ex"></div>`;
    b.querySelectorAll('.choices button').forEach(btn=>btn.onclick=()=>{
      const k=+btn.dataset.k;const ok=k===q.a;if(ok)correct++;
      b.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;const kk=+x.dataset.k;if(kk===q.a)x.classList.add('ok');else if(kk===k)x.classList.add('ng');else x.classList.add('dim')});
      const st=S.mcStat[q.key]||[0,0];st[0]+=ok?1:0;st[1]++;S.mcStat[q.key]=st;
      if(!ok)S.miss[q.key]=(S.miss[q.key]||0)+1; else if(S.miss[q.key]&&S.miss[q.key]>0){S.miss[q.key]=Math.max(0,S.miss[q.key]-1);if(!S.miss[q.key])delete S.miss[q.key]}
      save();
      $('#ex').innerHTML=`<div class="exp"><b>${ok?'正解':'不正解'}</b>　正解：${esc(q.c[q.a])}<br>${esc(q.e||'')}</div><div class="btns"><button class="btn p" id="nx">${i+1<qs.length?'次の問題':'結果を見る'}</button></div>`;
      $('#nx').onclick=()=>{i++;show()};
    });
  }
  show();
}
/* ---------- Order engine ---------- */
function runOrder(b,qs,onEnd){
  let i=0,allOk=true;
  function show(){
    if(i>=qs.length){b.innerHTML=`<div class="res ${allOk?'ok':'ng'}">${allOk?'全問正解！':'間違いあり'}</div><div class="btns center"><button class="btn p" id="nx">次へ →</button></div>`;$('#nx').onclick=()=>onEnd(allOk);return;}
    const q=qs[i];const items=q.items;let pool=shuffle(items.map((t,k)=>k));let picked=[];
    function draw(){
      b.innerHTML=`<div class="q"><span class="n">${i+1}/${qs.length}</span><br><b>${esc(q.title)}</b>　古い順にタップ</div><div class="picked-list" id="pl">${picked.map(k=>`<div>${esc(items[k])}</div>`).join('')||'<span class="mini">ここに順番に並びます</span>'}</div><div class="pool">${pool.map(k=>`<button data-k="${k}" class="${picked.includes(k)?'picked':''}" ${picked.includes(k)?'disabled':''}>${esc(items[k])}</button>`).join('')}</div><div class="btns"><button class="btn sm" id="undo">1つ戻す</button></div><div id="ex"></div>`;
      b.querySelectorAll('.pool button').forEach(x=>x.onclick=()=>{picked.push(+x.dataset.k);if(picked.length===items.length)judge();else draw()});
      $('#undo').onclick=()=>{picked.pop();draw()};
    }
    function judge(){
      const ok=picked.every((k,idx)=>k===idx);if(!ok)allOk=false;
      if(!ok)S.miss[q.key]=(S.miss[q.key]||0)+1; else if(S.miss[q.key]){S.miss[q.key]=Math.max(0,S.miss[q.key]-1);if(!S.miss[q.key])delete S.miss[q.key]}
      save();
      b.innerHTML=`<div class="q"><b>${esc(q.title)}</b></div><div class="picked-list">${picked.map((k,idx)=>`<div class="${k===idx?'ok':'ng'}">${esc(items[k])}</div>`).join('')}</div><div class="exp"><b>${ok?'正解':'不正解'}</b>　正しい順：${items.map(esc).join(' → ')}<br>${esc(q.e||'')}</div><div class="btns"><button class="btn p" id="nx">${i+1<qs.length?'次の問題':'結果を見る'}</button></div>`;
      $('#nx').onclick=()=>{i++;show()};
    }
    draw();
  }
  show();
}
/* ---------- flow (通史) ---------- */
function rFlow(){
  ttl.textContent='通史の流れ';
  let h=`<div class="sub">23講を1本の流れで。タップで講へ。</div>`;
  ERAS.forEach(([name,ids])=>{h+=`<div class="era">${name}</div>`;
    ids.forEach(id=>{const L=DATA[id-1];h+=`<div class="card tap" onclick="go({tab:'lec',l:${id}})"><div class="flowline"><div class="h">第${id}講 ${esc(L.title)} <span class="badge">${esc(L.span)}</span></div><div class="o">${esc(L.oneLine)}</div>${L.chain.length?`<div class="chain" style="margin-top:4px">${L.chain.map((c,i)=>(i?'<b>→</b>':'')+`<span>${esc(c)}</span>`).join('')}</div>`:''}</div></div>`});});
  h+=`<h2>年表（全講の主要ステップ）</h2><div class="seg" id="ysel">${ERAS.map((e,i)=>`<button data-i="${i}">${e[0]}</button>`).join('')}</div><div id="ylist"></div>`;
  main.innerHTML=h;
  const showY=i=>{document.querySelectorAll('#ysel button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));const ids=ERAS[i][1];let ev=[];ids.forEach(id=>DATA[id-1].parts.forEach(p=>p.flow.forEach(e=>{if(e.y)ev.push({...e,l:id})})));
    $('#ylist').innerHTML=`<div class="tl">${ev.map(e=>`<div class="ev"><div class="y">${esc(e.y)} <span class="mini">第${e.l}講</span></div><div class="t">${esc(e.t)}</div><div class="s">${esc(e.s)}</div></div>`).join('')}</div>`;};
  document.querySelectorAll('#ysel button').forEach(b=>b.onclick=()=>showY(+b.dataset.i));showY(0);
}
/* ---------- drill ---------- */
let drill={type:'mc',range:'all',n:10};
function rDrill(){
  ttl.textContent='演習';
  const opts=`<option value="all">全範囲</option>`+ERAS.map((e,i)=>`<option value="e${i}">${e[0]}</option>`).join('')+DATA.map(L=>`<option value="l${L.id}">第${L.id}講 ${esc(L.title)}</option>`).join('');
  main.innerHTML=`<div class="card"><b>出題形式</b><div class="seg" id="tsel"><button data-t="mc">4択</button><button data-t="order">整序</button><button data-t="tsu">通史整序</button><button data-t="blank">穴埋め</button></div>
  <b>範囲</b><select id="rsel">${opts}</select>
  <div style="margin-top:8px"><b>問題数</b><div class="seg" id="nsel"><button data-n="10">10</button><button data-n="20">20</button><button data-n="0">全部</button></div></div>
  <div class="btns"><button class="btn p" id="st">スタート</button></div>
  <div class="mini">通史整序＝異なる講の出来事を混ぜて年代順に並べる（流れの総仕上げ）。</div></div>`;
  const upd=()=>{document.querySelectorAll('#tsel button').forEach(b=>b.classList.toggle('on',b.dataset.t===drill.type));document.querySelectorAll('#nsel button').forEach(b=>b.classList.toggle('on',+b.dataset.n===drill.n));};
  document.querySelectorAll('#tsel button').forEach(b=>b.onclick=()=>{drill.type=b.dataset.t;upd()});
  document.querySelectorAll('#nsel button').forEach(b=>b.onclick=()=>{drill.n=+b.dataset.n;upd()});
  $('#rsel').value=drill.range;$('#rsel').onchange=e=>drill.range=e.target.value;upd();
  $('#st').onclick=()=>startDrill({type:drill.type,range:drill.range,n:drill.n});
}
function lecsInRange(r){if(r==='all')return DATA;if(r[0]==='e')return ERAS[+r.slice(1)][1].map(i=>DATA[i-1]);return [DATA[+r.slice(1)-1]]}
function startDrill(o){go({tab:'drillRun',o})}
function rDrillRun(){
  const o=view.o;ttl.textContent='演習';
  const b=document.createElement('div');main.innerHTML='';main.appendChild(b);
  const end=()=>{b.innerHTML+=`<div class="btns center"><button class="btn" onclick="go({tab:'drill'},false)">演習メニューへ</button></div>`};
  if(o.src==='review'){const L=DATA[o.l-1];runMC(b,L.review.map((q,i)=>({...q,key:`rv:${L.id}:${i}`,tag:'総合'})),end);return;}
  const Ls=lecsInRange(o.range);let qs=[];
  if(o.type==='mc'){Ls.forEach(L=>{L.parts.forEach((p,pi)=>p.mc.forEach((q,i)=>qs.push({...q,key:`mc:${L.id}:${pi}:${i}`,tag:`第${L.id}講`})));L.review.forEach((q,i)=>qs.push({...q,key:`rv:${L.id}:${i}`,tag:`第${L.id}講 総合`}))});qs=shuffle(qs);if(o.n)qs=qs.slice(0,o.n);runMC(b,qs,end);}
  else if(o.type==='order'){Ls.forEach(L=>L.parts.forEach((p,pi)=>p.order.forEach((q,i)=>qs.push({...q,key:`or:${L.id}:${pi}:${i}`}))));qs=shuffle(qs);if(o.n)qs=qs.slice(0,o.n);runOrder(b,qs,end);}
  else if(o.type==='tsu'){
    // 通史整序：年号つきflowから年が異なる4〜5件を抽出
    let ev=[];Ls.forEach(L=>L.parts.forEach(p=>p.flow.forEach(e=>{const y=parseInt(e.y);if(!isNaN(y)&&e.y.length<=4)ev.push({y,t:e.t,l:L.id})})));
    const n=o.n||10;for(let k=0;k<n&&ev.length>=5;k++){let pick=[];let tries=0;while(pick.length<5&&tries<200){tries++;const e=ev[Math.random()*ev.length|0];if(!pick.some(x=>x.y===e.y||x.t===e.t))pick.push(e)}
      if(pick.length<4)break;pick.sort((a,b)=>a.y-b.y);qs.push({title:'通史整序（'+pick.map(x=>'第'+x.l+'講').filter((v,i,a)=>a.indexOf(v)===i).join('・')+'）',items:pick.map(x=>x.t),e:pick.map(x=>x.y+' '+x.t).join(' → '),key:'tsu'})}
    runOrder(b,qs,end);
  }
  else { // blank as 4択（同PART内の他の答えを誤答に）
    Ls.forEach(L=>L.parts.forEach((p,pi)=>p.blanks.forEach((q,i)=>{const others=shuffle(p.blanks.filter(x=>x.a!==q.a).map(x=>x.a)).filter((v,k,a)=>a.indexOf(v)===k).slice(0,3);if(others.length<3)return;const c=shuffle([q.a,...others]);qs.push({q:q.q,c,a:c.indexOf(q.a),e:q.h||'',key:`bl:${L.id}:${pi}:${i}`,tag:`第${L.id}講 穴埋め`})})));
    qs=shuffle(qs);if(o.n)qs=qs.slice(0,o.n);runMC(b,qs,end);
  }
}
/* ---------- miss ---------- */
function findQ(key){
  const [t,l,p,i]=key.split(':');const L=DATA[+l-1];if(!L)return null;
  if(t==='mc')return {...L.parts[+p].mc[+i],key,tag:`第${L.id}講 PART${+p+1}`};
  if(t==='rv')return {...L.review[+i],key,tag:`第${L.id}講 総合`};
  if(t==='or')return {...L.parts[+p].order[+i],key};
  if(t==='bl'){const P=L.parts[+p],q=P.blanks[+i];const others=shuffle(P.blanks.filter(x=>x.a!==q.a).map(x=>x.a)).filter((v,k,a)=>a.indexOf(v)===k).slice(0,3);const c=shuffle([q.a,...others]);return {q:q.q,c,a:c.indexOf(q.a),e:q.h||'',key,tag:`第${L.id}講 穴埋め`}}
  return null;
}
function rMiss(){
  ttl.textContent='間違い';
  const keys=Object.keys(S.miss).filter(k=>k!=='tsu');
  const mc=keys.filter(k=>/^(mc|rv|bl):/.test(k)).map(findQ).filter(Boolean),or=keys.filter(k=>k.startsWith('or:')).map(findQ).filter(Boolean);
  let h=`<div class="card"><div class="big">${mc.length+or.length}</div><div class="sub">間違えた問題（正解すると1回分減ります）</div><div class="btns">${mc.length?`<button class="btn p" id="rm">4択・穴埋めをやり直す（${mc.length}）</button>`:''}${or.length?`<button class="btn s" id="ro">整序をやり直す（${or.length}）</button>`:''}<button class="btn sm" id="clr">記録を消す</button></div></div>`;
  h+=mc.map(q=>`<div class="card"><div class="mini">${esc(q.tag)}｜×${S.miss[q.key]}</div>${esc(q.q)}<div class="exp">答：${esc(q.c[q.a])}</div></div>`).join('');
  h+=or.map(q=>`<div class="card"><div class="mini">整序｜×${S.miss[q.key]}</div><b>${esc(q.title)}</b><div class="exp">${q.items.map(esc).join(' → ')}</div></div>`).join('');
  main.innerHTML=h;
  const end=b=>()=>{b.innerHTML+=`<div class="btns center"><button class="btn" onclick="go({tab:'miss'},false)">間違い一覧へ</button></div>`};
  if($('#rm'))$('#rm').onclick=()=>{const b=document.createElement('div');main.innerHTML='';main.appendChild(b);runMC(b,shuffle(mc),end(b))};
  if($('#ro'))$('#ro').onclick=()=>{const b=document.createElement('div');main.innerHTML='';main.appendChild(b);runOrder(b,shuffle(or),end(b))};
  $('#clr').onclick=()=>{if(confirm('間違いの記録を消しますか？')){S.miss={};save();rMiss()}};
}
/* ---------- stat ---------- */
function rStat(){
  ttl.textContent='達成度';
  let tot=0,done=0;DATA.forEach(L=>{const [n,t]=lecProg(L);tot+=t;done+=n});
  let c=0,t=0;Object.values(S.mcStat).forEach(s=>{c+=s[0];t+=s[1]});
  let h=`<div class="card center"><div class="big">${done} / ${tot} PART</div><div class="sub">達成率 ${Math.round(100*done/tot)}%</div><div class="prog"><i style="width:${100*done/tot}%"></i></div><div class="sub" style="margin-top:8px">4択 累計正答率：${t?Math.round(100*c/t)+'%（'+c+'/'+t+'）':'—'}</div></div>`;
  ERAS.forEach(([name,ids])=>{h+=`<div class="era">${name}</div>`;ids.forEach(id=>{const L=DATA[id-1];const [n,tt]=lecProg(L);h+=`<div class="card tap" onclick="go({tab:'lec',l:${id}})"><div class="row"><div class="grow">第${id}講 ${esc(L.title)}</div><span class="badge ${n===tt?'ok':''}">${n}/${tt}</span></div><div class="row" style="gap:4px;margin-top:6px">${L.parts.map((p,i)=>{const d=S.done[partKey(id,i)]||{};return `<span class="badge ${partDone(id,i)?'ok':(d.mc!=null?'acc':'')}">P${i+1}${d.mc!=null?' '+d.mc+'%':''}</span>`}).join('')}</div></div>`})});
  h+=`<div class="btns center"><button class="btn sm" onclick="if(confirm('学習記録をすべて消しますか？')){localStorage.removeItem('${LS}');location.reload()}">記録をリセット</button></div>`;
  main.innerHTML=h;
}
render();
</script>
